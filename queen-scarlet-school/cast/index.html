<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>The Cast — Queen Scarlet's School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #FFF6E0; --paper-card: #FFFFFF; --paper-deep: #FCEDC4; --paper-soft: #FFFAEC;
      --ink: #1F1F23; --ink-bright: #000; --ink-soft: #353540; --ink-faint: #6B6B7A;
      --red: #E84545; --red-deep: #C32626;
      --yolk: #FFD93D; --yolk-deep: #F0B900;
      --sky: #4DB8E8; --bubblegum: #FF6FAA; --grass: #6BCB77;
      --display: 'Fredoka', system-ui, sans-serif;
      --serif: 'Andika', Georgia, serif;
      --ui: 'Fredoka', system-ui, sans-serif;
      --ease: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; background: #2C2C34; color: var(--ink); font-family: var(--serif); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    body {
      min-height: 100vh; display: flex; flex-direction: column; position: relative;
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 209, 88, 0.08) 0%, transparent 35%),
        radial-gradient(circle at 80% 90%, rgba(255, 111, 170, 0.07) 0%, transparent 35%),
        #2C2C34;
    }
    ::selection { background: var(--yolk); color: var(--ink-bright); }
    button { font-family: var(--ui); cursor: pointer; border: none; background: none; color: inherit; padding: 0; user-select: none; -webkit-user-select: none; }
    button:disabled { cursor: not-allowed; opacity: 0.45; }

    .topbar {
      display: flex; align-items: center; padding: 14px 22px; gap: 16px;
      background: rgba(20, 20, 24, 0.6);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid rgba(255, 217, 100, 0.2);
      padding-top: max(14px, env(safe-area-inset-top));
      flex-shrink: 0;
    }
    .brand {
      font-family: var(--ui); font-size: 18px; font-weight: 600; letter-spacing: -0.01em;
      color: var(--paper);
      text-decoration: none; display: inline-flex; align-items: center; gap: 10px;
    }
    .blob { display: inline-block; background: var(--yolk); border: 2.5px solid var(--ink-bright); border-radius: 50%; position: relative; box-shadow: 2px 2px 0 var(--ink-bright); width: 26px; height: 26px; }
    .blob::before, .blob::after { content: ''; position: absolute; background: var(--ink-bright); border-radius: 50%; width: 4px; height: 4px; top: 9px; }
    .blob::before { left: 6px; } .blob::after { right: 6px; }
    .topbar .spacer { flex: 1; }
    .topbar a, .topbar .topbtn {
      font-family: var(--ui); font-size: 14px; font-weight: 600;
      color: var(--paper); padding: 8px 14px;
      background: rgba(255, 246, 224, 0.06);
      border: 2px solid rgba(255, 246, 224, 0.3); border-radius: 999px;
      text-decoration: none;
      min-height: 36px; display: inline-flex; align-items: center;
    }
    .topbar a:hover, .topbar .topbtn:hover { background: rgba(255, 246, 224, 0.14); }

    .page {
      flex: 1;
      padding: 26px clamp(20px, 4vw, 60px) 80px;
      max-width: 1400px; margin: 0 auto; width: 100%;
    }

    /* ─── Grid view ─── */
    .grid-view { display: block; }
    .grid-view.hidden { display: none; }

    .page-head {
      display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
      margin-bottom: 28px; flex-wrap: wrap;
    }
    .page-title {
      font-family: var(--ui);
      font-size: clamp(32px, 3.6vw, 48px);
      color: var(--paper);
      font-weight: 600; line-height: 1;
      letter-spacing: -0.02em;
    }
    .page-title em { color: var(--yolk); font-style: normal; font-weight: 600; }
    /* ─── SAVE ALL button + status ─── */
    .page-head-actions {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .btn-save {
      font-family: var(--ui); font-weight: 800; font-size: 15px;
      padding: 12px 22px;
      background: #d23f3f; color: #fff;
      border: 3px solid #1f1f23; border-radius: 14px;
      box-shadow: 4px 4px 0 #1f1f23;
      cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px;
      letter-spacing: 0.02em;
      transition: transform 80ms, box-shadow 80ms, background 120ms;
    }
    .btn-save:hover { transform: translate(-1px,-1px); box-shadow: 5px 5px 0 #1f1f23; background: #e04848; }
    .btn-save:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #1f1f23; }
    .btn-save:disabled { opacity: 0.65; cursor: progress; }
    .btn-save .bs-ico { font-size: 17px; }
    .save-status {
      font-family: var(--ui); font-size: 13px; font-weight: 600;
      color: var(--paper); opacity: 0.85;
      padding: 6px 12px;
      background: rgba(255,255,255,0.06);
      border: 1.5px dashed rgba(255,255,255,0.18);
      border-radius: 10px;
      min-height: 28px;
      display: inline-flex; align-items: center;
    }
    .save-status:empty { display: none; }
    .save-status.ok { background: rgba(72,200,120,0.18); border-color: rgba(72,200,120,0.5); color: #b6f3cf; border-style: solid; }
    .save-status.err { background: rgba(210,63,63,0.22); border-color: rgba(210,63,63,0.55); color: #ffd8d8; border-style: solid; }
    .save-status.busy { color: var(--paper); }
    .story-chip {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 14px;
      background: rgba(255, 217, 100, 0.18);
      border: 2px solid rgba(255, 217, 100, 0.45);
      border-radius: 999px;
      color: var(--paper);
      font-family: var(--ui); font-size: 13px; font-weight: 600;
      transform: rotate(-1.5deg);
    }
    .story-chip strong { color: var(--yolk); font-weight: 700; }

    .cast-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 26px;
    }
    .empty {
      grid-column: 1 / -1;
      text-align: center; padding: 80px 30px;
      color: rgba(244, 233, 200, 0.7);
      font-family: var(--serif); font-size: 17px;
      max-width: 560px; margin: 0 auto;
    }
    .empty strong { display: block; font-family: var(--ui); color: var(--paper); font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 8px; }
    .empty.error strong { color: var(--red); }

    /* Detail-head speaker — sits between the name and delete button */
    .detail-tts { display: inline-flex; align-items: center; }
    /* Wordy reply speaker inside chat bubbles */
    .cmsg-tts {
      margin-top: 6px;
      display: flex;
      justify-content: flex-start;
    }

    /* ── TTS button (read aloud, shared with main app) ── */
    .tts-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px;
      background: var(--paper-card); border: 2px solid var(--ink-bright); border-radius: 50%;
      box-shadow: 2px 2px 0 var(--ink-bright);
      cursor: pointer; transition: transform 140ms var(--ease), background 140ms var(--ease);
      flex-shrink: 0; color: var(--ink-bright); padding: 0;
    }
    .tts-btn svg { width: 14px; height: 14px; pointer-events: none; }
    .tts-btn:hover { background: var(--yolk); transform: translate(-1px, -1px) rotate(-4deg); box-shadow: 3px 3px 0 var(--ink-bright); }
    .tts-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink-bright); }
    .tts-btn.playing {
      background: var(--yolk);
      color: var(--ink-bright);
      animation: cast-tts-pulse 850ms ease-in-out infinite;
    }
    .tts-btn.loading { background: var(--yolk); color: var(--ink-bright); }
    .tts-btn.sm { width: 24px; height: 24px; box-shadow: 1.5px 1.5px 0 var(--ink-bright); }
    .tts-btn.sm svg { width: 12px; height: 12px; }
    .tts-btn.lg { width: 44px; height: 44px; box-shadow: 3px 3px 0 var(--ink-bright); }
    .tts-btn.lg svg { width: 20px; height: 20px; }
    .tts-btn.dark { background: rgba(255, 246, 224, 0.12); border-color: rgba(255, 246, 224, 0.5); color: var(--paper); box-shadow: 2px 2px 0 rgba(255, 246, 224, 0.25); }
    .tts-btn.dark:hover { background: var(--yolk); color: var(--ink-bright); border-color: var(--ink-bright); }
    @keyframes cast-tts-pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.14); }
    }
    @keyframes cast-tts-spin { to { transform: rotate(360deg); } }
    .tts-spin { transform-origin: center; animation: cast-tts-spin 0.9s linear infinite; }
    /* Card-mounted read-aloud — sits in the nameplate, kid-finger sized */
    .ccard-tts {
      position: absolute;
      top: 8px; right: 10px;
      z-index: 4;
    }
    .ccard:has(.ccard-portraits-count) .ccard-tts { top: 38px; }

    /* Card */
    .ccard {
      position: relative;
      aspect-ratio: 2.5 / 3.5;
      width: 100%;
      cursor: pointer;
      filter: drop-shadow(6px 8px 0 rgba(0, 0, 0, 0.55));
      transition: transform 220ms var(--ease);
    }
    .ccard:hover { transform: translate(-3px, -4px) rotate(-1deg); }
    .ccard-face {
      position: absolute; inset: 0;
      border-radius: 14px;
      border: 3px solid var(--ink-bright);
      overflow: hidden;
      background: var(--paper);
      display: flex; flex-direction: column;
    }
    .ccard-corner {
      position: absolute; top: 8px; left: 10px;
      font-family: var(--display); font-size: 22px; font-weight: 700;
      color: var(--ink-bright); line-height: 1;
      transform: rotate(-3deg);
      z-index: 2; pointer-events: none;
      text-shadow: 1px 1px 0 var(--paper);
    }
    .ccard-corner.tr {
      top: auto; left: auto;
      bottom: 8px; right: 10px;
      transform: rotate(180deg) rotate(-3deg);
    }
    .ccard-portrait {
      flex: 1; min-height: 0;
      background: #F5E9C8 url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10'%3E%3Crect width='10' height='10' fill='%23F5E9C8'/%3E%3Ccircle cx='5' cy='5' r='0.8' fill='%23D8C58A'/%3E%3C/svg%3E");
      background-size: 10px 10px;
      position: relative; overflow: hidden;
    }
    .ccard-portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ccard-portrait.loading,
    .ccard-portrait.failed {
      display: flex; align-items: center; justify-content: center;
      color: var(--ink-soft);
      font-family: var(--serif); font-style: italic; font-size: 14px;
      padding: 16px; text-align: center;
    }
    .ccard-portrait.loading::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.45) 50%, transparent 70%);
      animation: ccard-shimmer 1.8s linear infinite;
    }
    @keyframes ccard-shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
    .ccard-nameplate {
      flex-shrink: 0;
      padding: 12px 14px 14px;
      background: var(--paper-deep);
      border-top: 2.5px solid var(--ink-bright);
    }
    .ccard-name {
      font-family: var(--ui); font-size: 17px; font-weight: 600;
      line-height: 1.15; letter-spacing: -0.01em; color: var(--ink-bright);
    }
    .ccard-current {
      font-family: var(--serif); font-style: italic; font-size: 12.5px;
      color: var(--ink-soft); margin-top: 3px; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .ccard-state {
      position: absolute; top: 0; left: 0;
      padding: 4px 8px;
      font-family: var(--ui); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--paper); background: var(--ink-bright);
      border-bottom-right-radius: 8px;
      z-index: 3; pointer-events: none;
    }
    .ccard-portraits-count {
      position: absolute; top: 8px; right: 10px;
      padding: 3px 8px;
      font-family: var(--ui); font-size: 11px; font-weight: 700;
      background: var(--yolk); color: var(--ink-bright);
      border: 2px solid var(--ink-bright); border-radius: 999px;
      box-shadow: 1.5px 1.5px 0 var(--ink-bright);
      z-index: 3; pointer-events: none;
    }
    .ccard-hint {
      position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
      font-family: var(--ui); font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(31, 31, 35, 0.35); pointer-events: none; z-index: 2;
    }

    /* ─── Detail view ─── */
    .detail-view { display: none; }
    .detail-view.active { display: block; }

    .detail-head {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin-bottom: 22px;
    }
    .detail-back {
      font-family: var(--ui); font-weight: 700; font-size: 14px;
      color: var(--paper); padding: 9px 16px;
      background: rgba(255, 246, 224, 0.08);
      border: 2px solid rgba(255, 246, 224, 0.4); border-radius: 999px;
      cursor: pointer;
    }
    .detail-back:hover { background: rgba(255, 246, 224, 0.18); }
    .detail-name {
      flex: 1;
      font-family: var(--ui);
      font-size: clamp(26px, 3vw, 36px); color: var(--paper);
      font-weight: 600; line-height: 1.1; letter-spacing: -0.02em;
      min-width: 200px;
    }
    /* Editable name — feels clickable, shows hover hint, focus ring */
    .editable-name {
      outline: none;
      border-bottom: 2px dashed transparent;
      padding: 2px 4px;
      border-radius: 6px;
      cursor: text;
      transition: background 120ms var(--ease), border-color 120ms var(--ease);
    }
    .editable-name:hover { background: rgba(255, 217, 60, 0.08); border-bottom-color: rgba(255, 217, 60, 0.35); }
    .editable-name:focus { background: rgba(255, 217, 60, 0.16); border-bottom-color: var(--yolk); }
    .editable-name:empty::before {
      content: attr(data-placeholder);
      color: rgba(255, 246, 224, 0.4);
    }
    .workshop-tag {
      font-family: var(--ui);
      font-size: 11px; font-weight: 700; letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 4px 10px;
      background: var(--yolk); color: var(--ink-bright);
      border: 2px solid var(--ink-bright); border-radius: 999px;
      box-shadow: 2px 2px 0 var(--ink-bright);
      transform: rotate(-3deg);
      align-self: center;
    }
    .detail-delete {
      font-family: var(--ui); font-weight: 700; font-size: 13px;
      color: var(--paper); padding: 8px 14px;
      background: rgba(232, 69, 69, 0.18); border: 2px solid var(--red); border-radius: 999px;
      cursor: pointer;
    }
    .detail-delete:hover { background: var(--red); }

    /* Bio block — visually identical to notes-block so the character
       panel reads as a single matched pair. */
    .bio-block {
      background: var(--paper-card);
      border: 2.5px solid var(--ink-bright);
      border-radius: 14px;
      box-shadow: 4px 4px 0 var(--ink-bright);
      padding: 14px 16px;
    }
    .bio-textarea {
      width: 100%;
      min-height: 110px;
      max-height: 280px;
      background: var(--paper-soft);
      border: 2px solid var(--ink-bright);
      border-radius: 10px;
      padding: 10px 12px;
      font-family: var(--serif);
      font-size: 14.5px;
      line-height: 1.5;
      color: var(--ink);
      resize: vertical;
      outline: none;
      box-shadow: 1.5px 1.5px 0 var(--ink-bright);
    }
    .bio-textarea:focus { border-color: var(--yolk-deep); box-shadow: 1.5px 1.5px 0 var(--yolk-deep); }

    /* Gallery section — full-width below the two-col grid */
    .gallery-section {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 2px dashed rgba(255, 246, 224, 0.18);
    }
    .gallery-heading {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px;
      margin-bottom: 12px;
    }
    .gallery-title {
      font-family: var(--ui); font-weight: 700; font-size: 16px;
      color: var(--paper); letter-spacing: -0.01em;
    }
    .gallery-hint {
      font-family: var(--serif); font-style: italic; font-size: 13px;
      color: rgba(244, 233, 200, 0.6);
    }

    /* Workshop 3-column grid — portrait | character panel | chat.
       Sized so all three are useful at once. Portrait is the subject
       (fixed compact width so it doesn't dominate). Character panel
       holds the editable bio + visual notes side-by-side weight.
       Chat column gets remaining space and grows for long threads. */
    .detail-grid {
      display: grid;
      grid-template-columns: 320px minmax(280px, 360px) 1fr;
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 1180px) {
      /* 2-col on tablet: portrait + (panel above chat, stacked) */
      .detail-grid {
        grid-template-columns: 300px 1fr;
        grid-template-areas:
          "portrait panel"
          "portrait chat";
      }
      .portrait-col { grid-area: portrait; }
      .character-panel { grid-area: panel; }
      .chat-col { grid-area: chat; }
    }
    @media (max-width: 800px) {
      .detail-grid {
        grid-template-columns: 1fr;
        grid-template-areas:
          "portrait"
          "panel"
          "chat";
      }
    }

    /* Column 1 — the portrait */
    .portrait-col { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 14px; }
    .portrait-primary {
      width: 100%;
      aspect-ratio: 2.5 / 3.5;
      border: 3px solid var(--ink-bright);
      border-radius: 14px;
      overflow: hidden;
      background: var(--paper);
      box-shadow: 6px 8px 0 var(--ink-bright);
      position: relative;
      transform: rotate(-0.5deg);
    }
    /* Column 2 — the character panel (bio + notes vertically stacked) */
    .character-panel {
      display: flex; flex-direction: column;
      gap: 14px;
      min-width: 0;
    }
    .portrait-primary img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .portrait-primary.loading,
    .portrait-primary.failed {
      display: flex; align-items: center; justify-content: center;
      color: var(--ink-soft); font-family: var(--serif); font-style: italic;
      padding: 24px; text-align: center;
    }
    .portrait-primary.loading::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.45) 50%, transparent 70%);
      animation: ccard-shimmer 1.8s linear infinite;
    }

    .gallery-strip {
      display: flex; gap: 14px; align-items: stretch;
      overflow-x: auto;
      padding: 6px 4px 18px;
    }
    .gallery-strip::-webkit-scrollbar { height: 10px; }
    .gallery-strip::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 999px; }
    .gallery-thumb {
      position: relative;
      flex: 0 0 auto;
      width: 132px;
      aspect-ratio: 2.5 / 3.5;
      border-radius: 12px;
      border: 3px solid rgba(255, 246, 224, 0.5);
      background: var(--paper-card);
      overflow: hidden;
      cursor: pointer;
      transition: transform 140ms var(--ease), border-color 140ms var(--ease), box-shadow 140ms var(--ease);
      box-shadow: 3px 3px 0 var(--ink-bright);
    }
    .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gallery-thumb.primary {
      border-color: var(--yolk);
      box-shadow: 0 0 0 3px rgba(255, 217, 60, 0.45), 4px 4px 0 var(--ink-bright);
      transform: translateY(-2px);
    }
    .gallery-thumb.primary::after {
      content: 'MAIN';
      position: absolute; top: 6px; left: 6px;
      padding: 2px 7px;
      font-family: var(--ui); font-weight: 800; font-size: 9px; letter-spacing: 0.18em;
      background: var(--yolk); color: var(--ink-bright);
      border: 1.5px solid var(--ink-bright); border-radius: 999px;
      pointer-events: none;
    }
    .gallery-thumb:hover { transform: translate(-1px, -1px); border-color: var(--paper); }
    .gallery-thumb-x {
      position: absolute; top: -4px; right: -4px;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--red); color: var(--paper);
      border: 2px solid var(--ink-bright);
      box-shadow: 1.5px 1.5px 0 var(--ink-bright);
      font-family: var(--ui); font-weight: 800; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; padding: 0;
      opacity: 0; transition: opacity 120ms var(--ease);
    }
    .gallery-thumb:hover .gallery-thumb-x { opacity: 1; }
    /* Thumbs-up heart — Henry can mark a portrait as "I love this
     * style, make more like it." Loved portraits get used as visual
     * anchors when we generate a fresh card via the regenerate
     * button. Sits opposite the × so they don't fight. */
    .gallery-thumb-love {
      position: absolute; bottom: -4px; right: -4px;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--paper-card); color: var(--ink-faint);
      border: 2px solid var(--ink-bright);
      box-shadow: 1.5px 1.5px 0 var(--ink-bright);
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; padding: 0;
      opacity: 0; transition: opacity 120ms var(--ease), background 140ms var(--ease), transform 140ms var(--ease);
    }
    .gallery-thumb:hover .gallery-thumb-love { opacity: 1; }
    .gallery-thumb-love.loved {
      opacity: 1;
      background: #FF6FAA;
      color: var(--paper);
      transform: scale(1.1);
    }
    .gallery-thumb-love:hover { transform: scale(1.15); }
    .gallery-thumb.loved {
      border-color: #FF6FAA;
      box-shadow: 0 0 0 3px rgba(255, 111, 170, 0.35);
    }
    /* "Regenerate from loved" — sits next to the + button. Pulls all
     * thumbs-upped portraits as style anchors so the new draw
     * matches the look Henry liked. */
    .gallery-regen {
      flex: 0 0 auto;
      width: 132px; aspect-ratio: 2.5 / 3.5;
      border-radius: 12px;
      border: 3px solid #FF6FAA;
      background: rgba(255, 111, 170, 0.18);
      color: var(--paper);
      cursor: pointer;
      font-family: var(--ui); font-weight: 700; font-size: 14px;
      line-height: 1.2;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 6px;
      transition: transform 140ms var(--ease), background 140ms var(--ease);
      padding: 0 10px;
      text-align: center;
      box-shadow: 3px 3px 0 var(--ink-bright);
    }
    .gallery-regen:hover { background: rgba(255, 111, 170, 0.32); transform: translate(-1px, -1px); }
    .gallery-regen.busy { opacity: 0.6; cursor: wait; }
    .gallery-regen-icon { font-size: 36px; line-height: 1; }
    .gallery-regen-label { font-size: 12px; letter-spacing: 0.04em; }
    .gallery-add {
      flex: 0 0 auto;
      width: 132px; aspect-ratio: 2.5 / 3.5;
      border-radius: 12px;
      border: 3px dashed rgba(255, 246, 224, 0.45);
      background: transparent;
      cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      font-family: var(--display); font-size: 48px;
      color: rgba(255, 246, 224, 0.55);
      transition: color 140ms var(--ease), border-color 140ms var(--ease);
    }
    .gallery-add::after {
      content: 'new drawing';
      font-family: var(--ui); font-size: 11px; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: inherit;
    }
    .gallery-add:hover { color: var(--yolk); border-color: var(--yolk); }
    .gallery-add.busy { animation: ccard-shimmer 1.8s linear infinite; opacity: 0.6; }

    /* Notes + bio blocks share the same visual treatment so the
       character panel reads as one unified tool. No rotation — at
       column width the playful tilt was making them feel rickety. */
    .notes-block {
      background: var(--paper-card);
      border: 2.5px solid var(--ink-bright); border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 4px 4px 0 var(--ink-bright);
    }
    .notes-label {
      display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
      font-family: var(--ui); font-weight: 700; font-size: 11px;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--ink-bright);
      margin-bottom: 8px;
    }
    .notes-label .hint {
      font-family: var(--serif); font-style: italic; font-weight: 400;
      letter-spacing: 0; text-transform: none; font-size: 12.5px;
      color: var(--ink-soft); margin-left: 0;
    }
    .notes-textarea {
      width: 100%;
      background: var(--paper-soft); color: var(--ink);
      border: 2px solid var(--ink-bright); border-radius: 10px;
      padding: 10px 12px;
      font-family: var(--serif); font-size: 14.5px; line-height: 1.5;
      resize: vertical; min-height: 80px; max-height: 240px;
      outline: none;
      box-shadow: 1.5px 1.5px 0 var(--ink-bright);
    }
    .notes-textarea:focus { border-color: var(--yolk-deep); box-shadow: 1.5px 1.5px 0 var(--yolk-deep); }

    /* Right column — chat + composer */
    .chat-col {
      display: flex; flex-direction: column;
      gap: 12px;
      min-width: 0;
    }
    .chat-thread {
      overflow-y: auto;
      padding: 16px 18px;
      background: var(--paper-card);
      border: 2.5px solid var(--ink-bright);
      border-radius: 16px;
      box-shadow: 4px 4px 0 var(--ink-bright);
      display: flex; flex-direction: column;
      gap: 12px;
      max-height: 56vh;
    }
    /* Empty state: shrink-to-fit. Active chat: minimum 240px so it
       doesn't feel cramped once messages land. */
    .chat-thread:not(:has(.cmsg)):not(:has(.cmsg-typing)) {
      min-height: 0;
      padding: 14px 18px;
    }
    .chat-thread:has(.cmsg), .chat-thread:has(.cmsg-typing) {
      min-height: 240px;
    }
    .chat-thread .empty {
      padding: 4px 0;
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.5;
    }
    .chat-thread .empty strong {
      display: block; margin-bottom: 4px;
      color: var(--ink-bright); font-family: var(--ui); font-weight: 700;
      font-size: 14.5px;
    }
    .chat-thread .empty strong { color: var(--ink-bright); }
    .cmsg { display: flex; gap: 10px; align-items: flex-start; }
    .cmsg.kid { justify-content: flex-end; }
    .cmsg-bubble {
      padding: 10px 14px;
      font-family: var(--serif); font-size: 15.5px; line-height: 1.5;
      border: 2.5px solid var(--ink-bright);
      box-shadow: 3px 3px 0 var(--ink-bright);
      white-space: pre-wrap;
      max-width: 82%;
    }
    .cmsg.wordy .cmsg-bubble {
      background: var(--paper-soft);
      border-radius: 14px 14px 14px 4px;
    }
    .cmsg.kid .cmsg-bubble {
      background: var(--sky);
      border-radius: 14px 14px 4px 14px;
    }
    /* Consistency-flag bubble — Wordy proactively flagged that two
       loved portraits look like different characters. Distinct yolk
       tint so Henry can tell this is a heads-up, not a direct reply. */
    .cmsg.wordy.flag .cmsg-bubble {
      background: rgba(255, 217, 60, 0.32);
      border-color: var(--yolk-deep);
    }
    .cmsg-tag {
      display: inline-block;
      padding: 1px 8px;
      margin-right: 8px;
      font-family: var(--ui); font-size: 10px; font-weight: 800;
      letter-spacing: 0.16em; text-transform: uppercase;
      background: var(--yolk-deep); color: var(--ink-bright);
      border: 1.5px solid var(--ink-bright);
      border-radius: 999px;
      vertical-align: 2px;
    }
    .cmsg-typing {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--serif); font-style: italic;
      color: var(--ink-soft); font-size: 13.5px;
      padding: 6px 12px;
    }
    .cmsg-typing .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--ink-soft);
      animation: fs-bounce 1.2s ease-in-out infinite;
    }
    .cmsg-typing .dot:nth-child(2) { animation-delay: 0.15s; }
    .cmsg-typing .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes fs-bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%           { transform: translateY(-5px); opacity: 1; }
    }

    .chat-composer {
      padding: 12px 14px;
      background: var(--paper-deep);
      border: 2.5px solid var(--ink-bright);
      display: flex; flex-direction: column; gap: 10px;
      border-radius: 14px;
      box-shadow: 3px 3px 0 var(--ink-bright);
    }
    .chat-composer textarea {
      width: 100%;
      background: var(--paper-card); color: var(--ink);
      border: 2px solid var(--ink-bright); border-radius: 10px;
      padding: 9px 12px;
      font-family: var(--serif); font-size: 15px; line-height: 1.5;
      resize: vertical; min-height: 52px; max-height: 180px;
      outline: none;
      box-shadow: 1.5px 1.5px 0 var(--ink-bright);
    }
    .chat-composer textarea:focus { border-color: var(--yolk-deep); box-shadow: 1.5px 1.5px 0 var(--yolk-deep); }
    .chat-composer-actions {
      display: flex; gap: 8px; flex-wrap: wrap;
      justify-content: flex-end;
    }
    .chat-composer .btn {
      font-family: var(--ui); font-weight: 700; font-size: 14px;
      padding: 8px 14px; min-height: 38px;
      background: var(--red); color: var(--ink-bright);
      border: 2px solid var(--ink-bright); border-radius: 999px;
      box-shadow: 2px 2px 0 var(--ink-bright);
      cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      transition: transform 120ms var(--ease), background 120ms var(--ease);
    }
    .chat-composer .btn:hover { background: var(--yolk); transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink-bright); }
    .chat-composer .btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink-bright); }
    .chat-composer .btn-redraw {
      background: var(--paper-card); color: var(--ink-bright);
      font-size: 13px; padding: 8px 12px;
    }
    .chat-composer .btn-redraw:hover { background: var(--yolk); }
    .chat-composer .btn-vibe-shift {
      background: var(--yolk); color: var(--ink-bright);
      font-size: 13px; padding: 8px 12px;
    }
    .chat-composer .btn-vibe-shift:hover { background: #ffb84a; }
    .chat-composer .btn-vibe-shift:disabled { opacity: 0.55; cursor: progress; }

    /* Thumbs-down on gallery thumbnails — small twin to the love button */
    .gallery-thumb-down {
      position: absolute; bottom: 6px; right: 36px;
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--paper);
      border: 2px solid var(--ink-bright);
      box-shadow: 1.5px 1.5px 0 var(--ink-bright);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; line-height: 1; cursor: pointer;
      opacity: 0; transition: opacity 120ms, transform 120ms;
      padding: 0;
    }
    .gallery-thumb:hover .gallery-thumb-down { opacity: 1; }
    .gallery-thumb-down:hover { transform: scale(1.15); background: #f7d36b; }

    /* Toast */
    .toast-wrap {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 600; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
      max-width: calc(100vw - 32px);
    }
    .toast {
      pointer-events: auto;
      background: var(--paper-card); color: var(--ink-bright);
      border: 2.5px solid var(--ink-bright); border-radius: 14px;
      padding: 12px 18px; box-shadow: 4px 4px 0 var(--ink-bright);
      font-family: var(--ui); font-weight: 600; font-size: 14px;
      max-width: 480px;
    }
    .toast.error { background: var(--red); color: var(--paper); }

    /* Gate */
    .gate { position: fixed; inset: 0; background: var(--paper); display: flex; align-items: center; justify-content: center; z-index: 500; }
    .gate.hidden { display: none; }
    .gate-inner { max-width: 360px; width: calc(100% - 32px); display: flex; flex-direction: column;
      gap: 18px; padding: 40px; background: var(--paper-card); border: 3px solid var(--ink-bright);
      border-radius: 22px; box-shadow: 8px 8px 0 var(--yolk), 8px 8px 0 3px var(--ink-bright); transform: rotate(-1deg); }
    .gate h1 { font-family: var(--display); font-size: 36px; font-weight: 700; text-align: center; line-height: 1; color: var(--ink-bright); }
    .gate input { width: 100%; background: var(--paper-soft); border: 2.5px solid var(--ink-bright); color: var(--ink);
      font-family: var(--ui); font-size: 16px; padding: 12px 16px; outline: none; border-radius: 12px; text-align: center;
      box-shadow: 2px 2px 0 var(--ink-bright); }
    .gate-error { color: var(--red-deep); font-family: var(--display); font-size: 18px; text-align: center; display: none; }
    .gate-error.show { display: block; }
    .gate .gate-btn {
      font-family: var(--ui); font-weight: 700; font-size: 18px;
      border: 2.5px solid var(--ink-bright); border-radius: 14px; padding: 10px 18px;
      background: var(--red); color: var(--ink-bright);
      box-shadow: 4px 4px 0 var(--ink-bright);
    }
    .gate .gate-btn:hover { background: var(--yolk); transform: translate(-1px, -1px); }
    .app.hidden { display: none; }

    *::-webkit-scrollbar { width: 12px; height: 12px; }
    *::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
  </style>
</head>
<body>

  <div id="gate" class="gate">
    <div class="gate-inner">
      <h1>The Cast</h1>
      <input id="gate-code" type="text" placeholder="say the magic word" autocomplete="off" autocapitalize="off" autocorrect="off" inputmode="text" />
      <button id="gate-submit" class="gate-btn">Let me in!</button>
      <div id="gate-error" class="gate-error">hmm, that's not the word — try one more time</div>
    </div>
  </div>

  <div id="app" class="app hidden" style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
    <header class="topbar">
      <a href="/" class="brand"><span class="blob"></span>mycoldmars</a>
      <span class="spacer"></span>
      <a href="../" id="back-link">← back to the story</a>
      <a href="../library/">📚 library</a>
    </header>

    <main class="page">

      <!-- GRID VIEW -->
      <section id="grid-view" class="grid-view">
        <div class="page-head">
          <div class="page-title">the <em>cast</em></div>
          <div class="page-head-actions">
            <button id="btn-force-save" class="btn-save" type="button" title="Save every portrait to the cloud and to this device's storage. Use this if pictures aren't sticking.">
              <span class="bs-ico">💾</span><span class="bs-label">save all</span>
            </button>
            <span id="save-status" class="save-status" aria-live="polite"></span>
          </div>
        </div>
        <div id="cast-grid" class="cast-grid">
          <div class="empty"><strong>shuffling the deck…</strong>loading characters from the story.</div>
        </div>
      </section>

      <!-- DETAIL VIEW — the Character Workshop -->
      <section id="detail-view" class="detail-view">
        <div class="detail-head">
          <button id="detail-back" class="detail-back" type="button">← back to cast</button>
          <h1 id="detail-name" class="detail-name editable-name" contenteditable="true" spellcheck="false" data-placeholder="character name"></h1>
          <span class="workshop-tag">workshop</span>
          <span id="detail-tts" class="detail-tts"></span>
          <button id="detail-delete" class="detail-delete" type="button">delete character</button>
        </div>
        <div class="detail-grid">
          <!-- Column 1 — the portrait (the subject) -->
          <div class="portrait-col">
            <div id="portrait-primary" class="portrait-primary"></div>
          </div>
          <!-- Column 2 — the character panel (the tools: who + how they look) -->
          <div class="character-panel">
            <div class="bio-block">
              <label class="notes-label" for="character-bio">About this character
                <span class="hint">who they are · read aloud, used by storyboard art</span>
              </label>
              <textarea id="character-bio" class="bio-textarea" placeholder="describe who this character is. their deal, their voice, what they're up to. wordy uses this when drawing new pictures and when reading them out loud."></textarea>
            </div>
            <div class="notes-block">
              <label class="notes-label" for="visual-notes">Visual notes
                <span class="hint">how they look · baked into every redraw</span>
              </label>
              <textarea id="visual-notes" class="notes-textarea" placeholder="how should they look? 'calculator helmet, blue button-down, always slouched'"></textarea>
            </div>
          </div>
          <!-- Column 3 — the conversation (chat about and redraw) -->
          <div class="chat-col">
            <div id="chat-thread" class="chat-thread"></div>
            <div class="chat-composer">
              <textarea id="chat-input" rows="2" placeholder="tell wordy what to change — 'make him look more tired', 'add freckles', 'less calculator more confused'"></textarea>
              <div class="chat-composer-actions">
                <button id="chat-vibe-shift" class="btn btn-vibe-shift" type="button" title="Throw this whole vibe out. Wordy picks a meaningfully different look — different prop, different mood, different palette.">👎 different vibe</button>
                <button id="chat-redraw" class="btn btn-redraw" type="button" title="Use the current visual notes to draw a new portrait (no chat needed)">↻ redraw</button>
                <button id="chat-send" class="btn" type="button">Send<span style="margin-left:4px;">→</span></button>
              </div>
            </div>
          </div>
        </div>
        <!-- Gallery moved to full-width below grid: every draft visible at once -->
        <div class="gallery-section">
          <div class="gallery-heading">
            <span class="gallery-title">every drawing of this character</span>
            <span class="gallery-hint">tap a drawing to make it the main one · ♡ marks favorites wordy will copy when drawing new ones</span>
          </div>
          <div class="gallery-strip" id="gallery-strip">
            <!-- thumbnails populated by render -->
          </div>
        </div>
      </section>

    </main>
  </div>

  <div class="toast-wrap" id="toast-wrap" aria-live="polite"></div>

  <script>
    // ─── API perimeter — fetch wrapper (school/library/cast share this) ───
    (function installAccessCodeFetchWrapper() {
      const LS_KEY = 'qss:access_code';
      const LS_TS_KEY = 'qss:access_code:ts';
      const TTL_MS = 90 * 24 * 60 * 60 * 1000;
      const origFetch = window.fetch.bind(window);
      let inMemoryCode = null;
      function readCached() {
        try {
          const code = localStorage.getItem(LS_KEY);
          const ts = Number(localStorage.getItem(LS_TS_KEY) || 0);
          if (code === null) return null;
          if (Date.now() - ts > TTL_MS) return null;
          return code;
        } catch { return null; }
      }
      function writeCached(code) {
        try { localStorage.setItem(LS_KEY, code); localStorage.setItem(LS_TS_KEY, String(Date.now())); } catch {}
      }
      function clearCached() {
        try { localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_TS_KEY); } catch {}
      }
      async function exchangeForCode() {
        try {
          const r = await origFetch('/api/qss-access-token', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: 'newpress' }),
          });
          if (!r.ok) return null;
          const j = await r.json().catch(() => ({}));
          return typeof j.accessCode === 'string' ? j.accessCode : null;
        } catch { return null; }
      }
      async function getCode() {
        if (inMemoryCode !== null) return inMemoryCode;
        const cached = readCached();
        if (cached !== null) { inMemoryCode = cached; return cached; }
        const fresh = await exchangeForCode();
        if (fresh !== null) { inMemoryCode = fresh; writeCached(fresh); }
        return inMemoryCode;
      }
      function isApi(url) {
        if (!url) return false;
        return url.startsWith('/api/') || url.indexOf(location.origin + '/api/') === 0;
      }
      window.fetch = async function(input, init = {}) {
        const url = typeof input === 'string' ? input : (input?.url || '');
        if (!isApi(url) || url.includes('/api/qss-access-token')) return origFetch(input, init);
        const code = await getCode();
        const headers = new Headers(init.headers || (typeof input !== 'string' ? input.headers : undefined) || {});
        if (code !== null && !headers.has('x-access-code')) headers.set('x-access-code', code);
        let res = await origFetch(input, { ...init, headers });
        if (res.status === 401) {
          clearCached(); inMemoryCode = null;
          const fresh = await getCode();
          if (fresh !== null) {
            headers.set('x-access-code', fresh);
            res = await origFetch(input, { ...init, headers });
          }
        }
        return res;
      };
      getCode();
    })();

    // ─── Gate (shared cookie) ───
    (function() {
      const COOKIE = 'qss_access', PASS = 'newpress';
      const gateEl = document.getElementById('gate'), appEl = document.getElementById('app');
      function getCookie(n) { const m = document.cookie.match(new RegExp('(?:^|; )' + n + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : null; }
      function unlock() {
        document.cookie = COOKIE + '=granted; path=/; max-age=' + (60*60*24*90);
        gateEl.classList.add('hidden'); appEl.classList.remove('hidden');
        setTimeout(boot, 0);  // defer past const-state TDZ
      }
      if (getCookie(COOKIE) === 'granted') { unlock(); return; }
      const inp = document.getElementById('gate-code'), err = document.getElementById('gate-error');
      function check() { const v = (inp.value || '').trim().toLowerCase(); if (v === PASS) unlock(); else { err.classList.add('show'); inp.value = ''; inp.focus(); } }
      document.getElementById('gate-submit').addEventListener('click', check);
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') check(); });
      inp.focus();
    })();

    // ─── helpers ───
    const HEADERS = { 'Content-Type': 'application/json' };
    function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
    function uid() { return Math.random().toString(36).slice(2, 12); }
    function initials(name) {
      const parts = String(name || '').split(/\s+/).filter(Boolean);
      return parts.map(p => p[0]?.toUpperCase()).slice(0, 2).join('') || '?';
    }
    function toast(message, kind = 'success', timeoutMs = 3000) {
      const wrap = document.getElementById('toast-wrap'); if (!wrap) return;
      const el = document.createElement('div');
      el.className = `toast ${kind}`;
      el.textContent = message;
      wrap.appendChild(el);
      if (timeoutMs > 0) setTimeout(() => el.remove(), timeoutMs);
    }

    // ─── TTS engine — same contract as main app's window.qssTTS ───
    // Henry doesn't read well; every visible label on this page needs a
    // speaker button. Primary: /api/qss-tts (ElevenLabs Matilda). Fallback:
    // browser speechSynthesis. Auth is the same x-access-code wrapper
    // installed above.
    (function() {
      const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19.07 4.93a10 10 0 010 14.14"/></svg>';
      const ICON_STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>';
      const ICON_LOADING = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" class="tts-spin"><circle cx="12" cy="12" r="9" opacity="0.25"/><path d="M21 12a9 9 0 00-9-9"/></svg>';

      const synth = window.speechSynthesis || null;
      let synthVoice = null;
      function pickSynthVoice() {
        if (!synth) return;
        const voices = synth.getVoices() || [];
        const ranked = [/Samantha/i, /Karen/i, /Allison/i, /Victoria/i, /Google US English/i, /Daniel/i, /Alex/i, /Microsoft/i];
        for (const re of ranked) { const v = voices.find(x => re.test(x.name) && /en/i.test(x.lang)); if (v) { synthVoice = v; return; } }
        synthVoice = voices.find(v => /en/i.test(v.lang)) || voices[0] || null;
      }
      if (synth) {
        pickSynthVoice();
        if (typeof synth.onvoiceschanged !== 'undefined') synth.onvoiceschanged = pickSynthVoice;
      }

      const cache = new Map();
      const MAX_CACHE = 40;
      function cacheKey(voice, text) { return voice + '|' + text.trim().slice(0, 240); }
      function cacheStore(key, url) {
        cache.set(key, url);
        if (cache.size > MAX_CACHE) {
          const first = cache.keys().next().value;
          try { URL.revokeObjectURL(cache.get(first)); } catch {}
          cache.delete(first);
        }
      }

      let currentAudio = null;
      let activeBtn = null;
      let activeReqId = 0;

      function clearActive() {
        if (activeBtn) { activeBtn.classList.remove('playing', 'loading'); activeBtn.innerHTML = ICON_PLAY; activeBtn = null; }
      }
      function stop() {
        activeReqId++;
        if (currentAudio) { try { currentAudio.pause(); currentAudio.src = ''; } catch {} currentAudio = null; }
        if (synth) { try { synth.cancel(); } catch {} }
        clearActive();
      }
      function setBtnState(btn, state) {
        if (!btn) return;
        btn.classList.toggle('loading', state === 'loading');
        btn.classList.toggle('playing', state === 'playing');
        if (state === 'loading') btn.innerHTML = ICON_LOADING;
        else if (state === 'playing') btn.innerHTML = ICON_STOP;
        else btn.innerHTML = ICON_PLAY;
      }
      function playUrl(url, btn) {
        return new Promise((resolve) => {
          const audio = new Audio(url);
          currentAudio = audio;
          activeBtn = btn || null;
          if (btn) setBtnState(btn, 'playing');
          const done = () => { if (currentAudio === audio) currentAudio = null; clearActive(); resolve(); };
          audio.addEventListener('ended', done, { once: true });
          audio.addEventListener('error', done, { once: true });
          audio.play().catch(done);
        });
      }
      function browserSpeak(text, btn) {
        return new Promise((resolve) => {
          if (!synth) { resolve(); return; }
          const u = new SpeechSynthesisUtterance(text);
          if (synthVoice) u.voice = synthVoice;
          u.rate = 0.95; u.pitch = 1.05; u.volume = 1.0;
          u.onend = () => { clearActive(); resolve(); };
          u.onerror = () => { clearActive(); resolve(); };
          activeBtn = btn || null;
          if (btn) setBtnState(btn, 'playing');
          try { synth.speak(u); } catch { clearActive(); resolve(); }
        });
      }
      async function fetchEleven(text, voice) {
        const res = await fetch('/api/qss-tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, voice, speed: 'fast' }),
        });
        if (!res.ok) throw new Error('tts ' + res.status);
        const blob = await res.blob();
        return URL.createObjectURL(blob);
      }
      async function speak(text, btn, opts = {}) {
        if (!text || !text.trim()) return;
        if (btn && activeBtn === btn) { stop(); return; }
        stop();
        const voice = (opts.voice || 'matilda').toString();
        const key = cacheKey(voice, text);
        if (cache.has(key)) { await playUrl(cache.get(key), btn); return; }
        const reqId = ++activeReqId;
        activeBtn = btn || null;
        if (btn) setBtnState(btn, 'loading');
        try {
          const url = await fetchEleven(text, voice);
          if (reqId !== activeReqId) return;
          cacheStore(key, url);
          await playUrl(url, btn);
        } catch (e) {
          if (reqId !== activeReqId) return;
          await browserSpeak(text, btn);
        }
      }
      function buildBtn(text, opts = {}) {
        const size = opts.size || '';
        return `<button class="tts-btn ${size}${opts.dark ? ' dark' : ''}" type="button" data-tts="${esc(typeof text === 'function' ? text() : text)}" data-tts-voice="${esc(opts.voice || 'matilda')}" aria-label="Read aloud">${ICON_PLAY}</button>`;
      }
      // Delegated click — anything with data-tts attribute speaks.
      document.addEventListener('click', (e) => {
        const btn = e.target.closest('.tts-btn[data-tts]');
        if (!btn) return;
        e.stopPropagation();
        e.preventDefault();
        const text = btn.dataset.tts || '';
        const voice = btn.dataset.ttsVoice || 'matilda';
        speak(text, btn, { voice });
      });
      document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); });
      // Walk the DOM and refresh icons for any buttons that lost innerHTML.
      function refreshIcons() {
        document.querySelectorAll('.tts-btn[data-tts]').forEach(b => {
          if (!b.innerHTML.trim()) b.innerHTML = ICON_PLAY;
        });
      }
      window.qssTTS = { speak, stop, buildBtn, refreshIcons, ICON_PLAY };
    })();

    // ─── State ───
    //
    // Card model:
    //   {
    //     name, synopsis, visual_notes, current_state, intro_block,
    //     portraits:    [{ id, mime, dataBase64, generated_at, note }],
    //     primary_portrait_id: string|null,
    //     chat:         [{ id, role: 'kid'|'wordy', content, ts }],
    //     status:       'ready'|'loading'|'error',
    //     error:        string|null,
    //     generated_at: number
    //   }
    //
    // Persistence:
    //   - localStorage `qss:cast:<storyId>` holds the canonical map.
    //     This is the source of truth until the qss_stories.character_cards
    //     column is created (migration 016) — at which point cards also
    //     round-trip via /api/qss-stories save/get.
    //   - On boot we MERGE: read LS, fetch story.character_cards, merge
    //     keeping the version with the most portraits (which is LS while
    //     migration 016 hasn't been applied).
    const state = {
      storyId: null,
      story: null,
      cards: {},                  // by name
      view: 'grid',               // 'grid' | 'detail'
      openName: null,             // when view==='detail', which card
      pendingGen: new Set(),
      saveTimer: null,
      chatBusy: false,
    };

    // ─── Global cast storage ──────────────────────────────────────────
    // Characters are SHARED across all stories. The localStorage key is a
    // single global JSON map keyed by lowercased name; per-story story id
    // tracking lives inside each card under `story_appearances`. This is
    // the universal cast Henry develops — Queen Scarlet in story A is the
    // same Queen Scarlet in story B, and her portraits + chat carry over.
    //
    // On first load, we one-shot-migrate any legacy `qss:cast:<storyId>`
    // per-story caches into the global map so existing work isn't lost.
    const GLOBAL_KEY = 'qss:globalcast';
    const MIGRATED_FLAG = 'qss:globalcast:migrated';
    function lcKey(name) { return String(name || '').trim().toLowerCase(); }

    // ─── IndexedDB store for portrait blob bodies ────────────────────────
    //
    // Each portrait dataBase64 is 50–300 KB. With 8 characters × multiple
    // portraits each plus chat history plus story_appearances, localStorage
    // (~5 MB ceiling) blows up — the cast goes blank and "drawing the
    // portrait…" sticks because new draws can't persist.
    //
    // Fix: portrait METADATA stays in LS (id, mime, generated_at, note,
    // loved) but dataBase64 lives in IndexedDB keyed by id. IDB has
    // effectively unlimited storage on modern browsers (often 50%+ of
    // disk). state.cards in memory still holds the full shape with
    // dataBase64 attached, so every render/cloud-push site works unchanged
    // — only writeLS strips and readLS rehydrates.
    const castIdb = (function() {
      const DB_NAME = 'qss-cast';
      const STORE = 'portraits';
      const VERSION = 1;
      let dbPromise = null;

      function open() {
        if (dbPromise) return dbPromise;
        dbPromise = new Promise((resolve) => {
          if (!window.indexedDB) { resolve(null); return; }
          const req = indexedDB.open(DB_NAME, VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE)) {
              db.createObjectStore(STORE, { keyPath: 'id' });
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => { console.warn('[idb] open failed', req.error); resolve(null); };
        });
        return dbPromise;
      }
      async function txStore(mode) {
        const db = await open();
        if (!db) return null;
        try { return db.transaction(STORE, mode).objectStore(STORE); }
        catch (e) { console.warn('[idb] tx failed', e); return null; }
      }
      async function put(portrait) {
        if (!portrait?.id) return false;
        const store = await txStore('readwrite');
        if (!store) return false;
        return new Promise((resolve) => {
          let r;
          try { r = store.put(portrait); }
          catch (e) { console.warn('[idb] put threw', e); return resolve(false); }
          r.onsuccess = () => resolve(true);
          r.onerror = () => { console.warn('[idb] put failed', r.error); resolve(false); };
        });
      }
      async function getMany(ids) {
        const out = new Map();
        if (!ids?.length) return out;
        const store = await txStore('readonly');
        if (!store) return out;
        return new Promise((resolve) => {
          let pending = ids.length;
          for (const id of ids) {
            let r;
            try { r = store.get(id); }
            catch { if (--pending === 0) resolve(out); continue; }
            r.onsuccess = () => {
              if (r.result) out.set(id, r.result);
              if (--pending === 0) resolve(out);
            };
            r.onerror = () => { if (--pending === 0) resolve(out); };
          }
        });
      }
      async function del(id) {
        if (!id) return false;
        const store = await txStore('readwrite');
        if (!store) return false;
        return new Promise((resolve) => {
          let r; try { r = store.delete(id); } catch { return resolve(false); }
          r.onsuccess = () => resolve(true);
          r.onerror = () => resolve(false);
        });
      }
      // GC: drop any IDB entries not referenced by current state.cards.
      // Runs occasionally on writes so a never-cleaned IDB doesn't slowly
      // accumulate orphans across re-imports / cloud-pulls.
      async function gc(referencedIds) {
        const store = await txStore('readwrite');
        if (!store) return 0;
        const ref = referencedIds instanceof Set ? referencedIds : new Set(referencedIds);
        return new Promise((resolve) => {
          let dropped = 0;
          let req; try { req = store.openCursor(); } catch { return resolve(0); }
          req.onsuccess = (e) => {
            const cur = e.target.result;
            if (!cur) return resolve(dropped);
            if (!ref.has(cur.key)) { try { cur.delete(); dropped++; } catch {} }
            cur.continue();
          };
          req.onerror = () => resolve(dropped);
        });
      }
      return { open, put, getMany, del, gc };
    })();
    // Pre-open so the first read/write doesn't pay the upgrade cost.
    castIdb.open();

    // Strip portrait dataBase64 before persisting to LS (the body lives in IDB).
    function thinPortrait(p) {
      if (!p) return p;
      const { dataBase64, ...rest } = p;
      return rest;
    }

    // Async: fill any portrait missing dataBase64 by fetching from IDB.
    // Returns true if anything was hydrated (caller should re-render).
    async function hydratePortraitsFromIdb(cards) {
      const ids = [];
      for (const c of Object.values(cards || {})) {
        if (!Array.isArray(c?.portraits)) continue;
        for (const p of c.portraits) {
          if (p?.id && !p.dataBase64) ids.push(p.id);
        }
      }
      if (!ids.length) return false;
      const blobs = await castIdb.getMany(ids);
      let touched = false;
      for (const c of Object.values(cards || {})) {
        if (!Array.isArray(c?.portraits)) continue;
        for (const p of c.portraits) {
          if (p?.id && !p.dataBase64) {
            const full = blobs.get(p.id);
            if (full?.dataBase64) {
              p.dataBase64 = full.dataBase64;
              p.mime = p.mime || full.mime || 'image/png';
              touched = true;
            }
          }
        }
      }
      return touched;
    }

    // readLS / writeLS contract:
    //   - LS is keyed by LOWERCASED character name (cross-story dedup).
    //   - state.cards is keyed by DISPLAY name (unchanged from prior code
    //     so all the existing accessors keep working).
    //   - On read: pulls the global blob, runs one-time per-story migration,
    //     converts lowercased keys back into display-name keys via card.name.
    //   - On write: converts state.cards display-keys into lowercased keys
    //     and persists the single global blob.
    function readLS() {
      try {
        const raw = localStorage.getItem(GLOBAL_KEY);
        let lcMap = raw ? (JSON.parse(raw) || {}) : {};
        // One-time migration from per-story caches.
        if (!localStorage.getItem(MIGRATED_FLAG)) {
          try {
            for (let i = 0; i < localStorage.length; i++) {
              const k = localStorage.key(i);
              if (!k || !k.startsWith('qss:cast:')) continue;
              try {
                const perStory = JSON.parse(localStorage.getItem(k) || '{}') || {};
                for (const [displayName, val] of Object.entries(perStory)) {
                  if (!displayName) continue;
                  const lk = lcKey(displayName);
                  if (!lcMap[lk]) {
                    lcMap[lk] = { ...val, name: displayName };
                  } else {
                    // Merge: union portraits by id, concat chat, take longer notes
                    const ex = lcMap[lk];
                    const exP = Array.isArray(ex.portraits) ? ex.portraits : [];
                    const inP = Array.isArray(val.portraits) ? val.portraits : [];
                    const seen = new Set();
                    ex.portraits = [...exP, ...inP].filter(p => {
                      if (!p || !p.id || seen.has(p.id)) return false;
                      seen.add(p.id);
                      return true;
                    });
                    if (!ex.primary_portrait_id && ex.portraits.length) {
                      ex.primary_portrait_id = ex.portraits[ex.portraits.length - 1].id;
                    }
                    const exC = Array.isArray(ex.chat) ? ex.chat : [];
                    const inC = Array.isArray(val.chat) ? val.chat : [];
                    ex.chat = [...exC, ...inC];
                    if ((val.synopsis || '').length > (ex.synopsis || '').length) ex.synopsis = val.synopsis;
                    if ((val.visual_notes || '').length > (ex.visual_notes || '').length) ex.visual_notes = val.visual_notes;
                    ex.generated_at = Math.max(ex.generated_at || 0, val.generated_at || 0);
                  }
                }
              } catch {}
            }
            localStorage.setItem(MIGRATED_FLAG, '1');
            localStorage.setItem(GLOBAL_KEY, JSON.stringify(lcMap));
          } catch {}
        }
        // Convert lowercased-keyed blob back into display-name-keyed map
        // for the rest of the cast page code to consume.
        const out = {};
        for (const [lk, v] of Object.entries(lcMap || {})) {
          const displayName = (v?.name || '').trim() || lk;
          out[displayName] = v;
        }
        return out;
      } catch { return {}; }
    }

    function writeLS() {
      // Build the LS payload — thin portraits (no dataBase64). The full
      // dataBase64 body lives in IndexedDB, written below.
      const out = {};
      const referenced = new Set();
      for (const [displayName, c] of Object.entries(state.cards)) {
        if (!c) continue;
        const lk = lcKey(c.name || displayName);
        if (!lk) continue;
        // Ensure card.name preserves the display-case so it round-trips.
        if (!c.name) c.name = displayName;
        const thin = { ...c };
        if (Array.isArray(c.portraits)) {
          thin.portraits = c.portraits.map(thinPortrait);
          for (const p of c.portraits) if (p?.id) referenced.add(p.id);
        }
        out[lk] = thin;
      }

      try { localStorage.setItem(GLOBAL_KEY, JSON.stringify(out)); }
      catch (e) {
        // With dataBase64 already extracted to IDB, the LS payload is
        // KB-scale (just metadata + chat + appearances). If this STILL
        // overflows, chat history is the next bloat axis. Auto-trim
        // chat to last 12 turns per card and retry — no "go clean it
        // up yourself" toasts. Then sync the trimmed state back into
        // state.cards in memory so future writes match.
        let chatTrimmed = 0;
        for (const c of Object.values(out)) {
          if (Array.isArray(c?.chat) && c.chat.length > 12) {
            c.chat = c.chat.slice(-12);
            chatTrimmed++;
          }
          if (Array.isArray(c?.story_appearances)) {
            const cutoff = Date.now() - 30 * 24 * 3600_000;
            c.story_appearances = c.story_appearances.filter(a => (a.last_seen_at || 0) > cutoff);
          }
        }
        try {
          localStorage.setItem(GLOBAL_KEY, JSON.stringify(out));
          // Reflect the trim back into the in-memory source of truth.
          for (const [lk, thin] of Object.entries(out)) {
            const dn = thin?.name || lk;
            const live = state.cards[dn];
            if (live) {
              live.chat = thin.chat;
              live.story_appearances = thin.story_appearances;
            }
          }
          if (chatTrimmed) {
            try { toast(`auto-cleaned old chat messages for ${chatTrimmed} character${chatTrimmed === 1 ? '' : 's'}`, 'info', 3500); } catch {}
            console.warn('[qss-cast quota] trimmed chat for', chatTrimmed, 'cards');
          }
        } catch (e2) {
          // Catastrophic — drop chat entirely and retry once more.
          for (const c of Object.values(out)) c.chat = [];
          try {
            localStorage.setItem(GLOBAL_KEY, JSON.stringify(out));
            for (const [lk, thin] of Object.entries(out)) {
              const dn = thin?.name || lk;
              if (state.cards[dn]) state.cards[dn].chat = [];
            }
            try { toast('cleared old chat to fit more pictures', 'info', 3500); } catch {}
            console.warn('[qss-cast quota] all chat dropped');
          } catch (e3) {
            console.error('[qss-cast quota] truly catastrophic', e3);
          }
        }
      }

      // Fire-and-forget: persist portrait blob bodies to IndexedDB.
      // Errors logged but don't crash UI; state.cards in memory still has
      // the dataBase64 so the current session keeps working either way.
      (async () => {
        try {
          const writes = [];
          for (const c of Object.values(state.cards)) {
            if (!Array.isArray(c?.portraits)) continue;
            for (const p of c.portraits) {
              if (p?.id && p.dataBase64) writes.push(castIdb.put(p));
            }
          }
          if (writes.length) await Promise.all(writes);
          // Occasional GC: ~1-in-10 writes, drop orphan IDB blobs not
          // referenced by any current card.
          if (Math.random() < 0.1) {
            try { await castIdb.gc(referenced); } catch {}
          }
        } catch (e) { console.warn('[idb] portrait write batch failed', e); }
      })();
    }

    // ─── Migration of legacy single-image cards into portraits[] ───
    function migrateCard(c) {
      if (!c || typeof c !== 'object') return null;
      const out = {
        name: String(c.name || '').trim(),
        synopsis: String(c.synopsis || '').trim(),
        visual_notes: String(c.visual_notes || '').trim(),
        current_state: String(c.current_state || '').trim(),
        intro_block: Number(c.intro_block) || null,
        portraits: Array.isArray(c.portraits) ? c.portraits.slice() : [],
        primary_portrait_id: c.primary_portrait_id || null,
        chat: Array.isArray(c.chat) ? c.chat.slice() : [],
        status: c.status || 'ready',
        error: c.error || null,
        generated_at: c.generated_at || Date.now(),
      };
      // Legacy single-image shape — promote into portraits[0].
      if (!out.portraits.length && c.image && c.image.dataBase64) {
        const pid = uid();
        out.portraits.push({
          id: pid,
          mime: c.image.mime || 'image/png',
          dataBase64: c.image.dataBase64,
          generated_at: out.generated_at,
          note: '',
        });
        out.primary_portrait_id = pid;
      }
      // If no primary set but portraits exist, default to the most recent.
      if (!out.primary_portrait_id && out.portraits.length) {
        out.primary_portrait_id = out.portraits[out.portraits.length - 1].id;
      }
      if (!out.name) return null;
      return out;
    }

    function getPrimary(card) {
      if (!card || !Array.isArray(card.portraits) || !card.portraits.length) return null;
      return card.portraits.find(p => p.id === card.primary_portrait_id) || card.portraits[card.portraits.length - 1];
    }

    // ─── Cloud sync ────────────────────────────────────────────────────
    //
    // The cast lives in the qss_cast table (migration 018). Each character
    // is a single row keyed by lowercased name, so cross-story dedup is at
    // the DB level. The client merges the cloud snapshot with localStorage:
    //   - Cloud wins for any character with a newer updated_at
    //   - LocalStorage wins for in-flight edits that haven't synced yet
    //
    // If migration 018 isn't applied, the cloud calls 503 silently and the
    // client stays on localStorage. Once Johnny applies it, everything
    // back-fills automatically.
    let cloudPullInflight = null;
    const cloudPushQueue = new Map();  // lowercasedName → cardSnapshot
    let cloudPushTimer = null;

    async function pullFromCloud() {
      if (cloudPullInflight) return cloudPullInflight;
      cloudPullInflight = (async () => {
        try {
          const r = await fetch('/api/qss-cast', { method: 'GET', headers: HEADERS });
          if (!r.ok) {
            if (r.status === 503) {
              // Migration not applied. Silently stay local.
              return;
            }
            return;
          }
          const { characters } = await r.json();
          if (!Array.isArray(characters)) return;
          let touched = false;
          const newCharNeedsDraw = [];
          for (const cloudCard of characters) {
            const name = (cloudCard?.name || '').trim();
            if (!name) continue;
            // Skip if a portrait is being drawn right now — race protection.
            // Without this, a slow cloud pull could overwrite a freshly-drawn
            // local portrait if the timestamps tied.
            if (state.pendingGen.has(name)) continue;
            const localCard = state.cards[name];
            const cloudUpd = cloudCard.updated_at || cloudCard.generated_at || 0;
            const localUpd = localCard?.generated_at || 0;
            // Cloud wins ONLY if strictly newer, or if local missing entirely.
            // Strict > prevents the race where cloud and local share a ms.
            if (!localCard || cloudUpd > localUpd) {
              state.cards[name] = migrateCard({ ...cloudCard, name });
              touched = true;
              // If this newly-merged cloud character has no portraits, queue
              // it for auto-draw. Previously the bootstrap firstDrawQueue ran
              // ONCE before pullFromCloud completed, so cloud-only characters
              // sat at "drawing the portrait…" forever until Henry tapped
              // them. Now they auto-draw on first cloud sync.
              const merged = state.cards[name];
              const hasPortraits = Array.isArray(merged?.portraits) && merged.portraits.length;
              if (!hasPortraits) newCharNeedsDraw.push(name);
            }
          }
          if (touched) {
            writeLS();
            render();
          }
          // Auto-enqueue any newly-merged cloud characters that lack
          // portraits. firstDrawQueue is idempotent — skips anything
          // already pending or anything that gained a portrait since.
          if (newCharNeedsDraw.length) {
            firstDrawQueue(newCharNeedsDraw).catch(() => {});
          }
          // For any LOCAL character not present in the cloud, push them up
          // (first-time hydration of the cloud from any device that's been
          // running on localStorage-only).
          const cloudNames = new Set(characters.map(c => (c?.name || '').toLowerCase()));
          for (const local of Object.values(state.cards)) {
            const lk = (local?.name || '').toLowerCase();
            if (!lk || cloudNames.has(lk)) continue;
            cloudPushQueue.set(lk, local);
          }
          if (cloudPushQueue.size) scheduleCloudPush();
        } catch {}
        finally { cloudPullInflight = null; }
      })();
      return cloudPullInflight;
    }

    function scheduleCloudPush() {
      clearTimeout(cloudPushTimer);
      cloudPushTimer = setTimeout(flushCloudPush, 1500);
    }
    async function flushCloudPush() {
      if (!cloudPushQueue.size) return;
      const batch = Array.from(cloudPushQueue.values());
      cloudPushQueue.clear();
      try {
        const r = await fetch('/api/qss-cast?action=upsert-many', {
          method: 'POST', headers: HEADERS,
          body: JSON.stringify({ cards: batch }),
        });
        if (!r.ok && r.status !== 503) {
          // Re-queue for next attempt; transient.
          for (const c of batch) cloudPushQueue.set((c.name || '').toLowerCase(), c);
        }
      } catch {
        for (const c of batch) cloudPushQueue.set((c.name || '').toLowerCase(), c);
      }
    }
    function pushToCloud(card) {
      const lk = (card?.name || '').toLowerCase();
      if (!lk) return;
      cloudPushQueue.set(lk, card);
      scheduleCloudPush();
    }
    async function deleteFromCloud(name) {
      try {
        await fetch('/api/qss-cast?action=delete', {
          method: 'POST', headers: HEADERS,
          body: JSON.stringify({ name }),
        });
      } catch {}
    }

    // Manual SAVE button — when Henry hits "save all", we exhaustively
    // persist everything: every portrait blob to IDB synchronously,
    // every card to the cloud, and update the LS thin index. Returns a
    // summary { cards, portraits, cloud } for the status pill.
    async function saveAll() {
      const cards = Object.values(state.cards).filter(c => c?.name);
      let portraitCount = 0;
      // 1) Write every portrait blob to IDB (await — block on completion)
      const writes = [];
      for (const c of cards) {
        if (!Array.isArray(c.portraits)) continue;
        for (const p of c.portraits) {
          if (p?.id && p.dataBase64) {
            writes.push(castIdb.put(p));
            portraitCount++;
          }
        }
      }
      try { await Promise.all(writes); } catch (e) { console.warn('[saveAll] idb', e); }
      // 2) Write thin LS index
      try { writeLS(); } catch (e) { console.warn('[saveAll] writeLS', e); }
      // 3) Push every card to cloud (queue + flush)
      let cloudOk = false;
      try {
        for (const c of cards) pushToCloud(c);
        await flushCloudPush();
        cloudOk = true;
      } catch (e) { console.warn('[saveAll] cloud push', e); }
      return { cards: cards.length, portraits: portraitCount, cloud: cloudOk };
    }

    // Convenience: write the global LS blob AND queue an upsert to the
    // cloud for the named character. Pass null to push all cards.
    function syncCard(name) {
      writeLS();
      if (name === null || name === undefined) {
        for (const c of Object.values(state.cards)) pushToCloud(c);
        return;
      }
      const c = state.cards[name];
      if (c) pushToCloud(c);
    }

    // ─── Boot ───
    // Cast is GLOBAL across all stories. The ?story=<id> param is optional
    // and used only to:
    //   - fold any new characters from that story's arc into the global cast
    //   - display a "viewing while in <story>" chip
    // Without ?story=, we just show every character Henry has ever developed.
    // Cross-tab sync — when another tab writes to qss:globalcast,
    // re-read LS and re-render so this tab doesn't drift stale.
    // Without this, two open tabs go out of sync (Henry edits in tab A,
    // tab B keeps showing old state until manual reload). Engineer
    // agent flagged this as one of the silent-divergence risks.
    window.addEventListener('storage', (e) => {
      if (e.key !== 'qss:globalcast') return;
      if (e.newValue == null) return; // ignore clears
      try {
        const fresh = JSON.parse(e.newValue) || {};
        const out = {};
        for (const [lk, raw] of Object.entries(fresh)) {
          const displayName = (raw && raw.name) || lk;
          if (!displayName) continue;
          // Skip overwriting any card currently mid-generation in THIS tab.
          if (state.pendingGen?.has(displayName)) continue;
          const m = migrateCard({ ...raw, name: displayName });
          if (m) out[m.name] = m;
        }
        // Preserve in-flight cards from this tab.
        for (const [name, c] of Object.entries(state.cards || {})) {
          if (state.pendingGen?.has(name)) out[name] = c;
        }
        state.cards = out;
        render();
      } catch {}
    });

    async function boot() {
      const params = new URLSearchParams(location.search);
      let storyId = params.get('story');
      if (!storyId) {
        try {
          const lastName = localStorage.getItem('qss:last_story');
          if (lastName) {
            const raw = localStorage.getItem(`qss:story:${lastName}`);
            if (raw) {
              const obj = JSON.parse(raw);
              if (obj?.serverId) storyId = obj.serverId;
            }
          }
        } catch {}
      }
      state.storyId = storyId;

      // Hydrate state.cards from the localStorage blob FIRST (instant UI),
      // then fetch the CLOUD cast and merge — cloud wins for any character
      // with a newer updated_at. This is what makes the cast cross-device:
      // edit on laptop, see it on iPad.
      //
      // Portrait dataBase64 lives in IndexedDB (since the cast was hitting
      // the LS quota ceiling); hydrate that async after the first render
      // so "drawing the portrait…" placeholders flip to real images as
      // soon as IDB delivers them.
      state.cards = readLS();
      render();
      (async () => {
        try {
          const touched = await hydratePortraitsFromIdb(state.cards);
          if (touched) render();
          // Wait for the cloud sync to also have its say (it might pull
          // newer portraits than what's locally cached). Then check for
          // orphans: cards with portraits[] entries that have NO
          // dataBase64 anywhere (LS stripped, IDB empty, cloud absent).
          // These would stick on "drawing the portrait…" forever
          // because firstDrawQueue skips any card with portraits.length>0.
          // Fix: drop the orphan metadata and let the auto-draw queue
          // pick them up.
          try { await pullFromCloud(); } catch {}
          const orphanNames = [];
          for (const c of Object.values(state.cards)) {
            if (!Array.isArray(c?.portraits) || !c.portraits.length) continue;
            const hasAny = c.portraits.some(p => p?.dataBase64);
            if (!hasAny) {
              c.portraits = [];
              c.primary_portrait_id = null;
              c.status = 'loading';
              orphanNames.push(c.name);
            }
          }
          if (orphanNames.length) {
            console.warn('[cast recovery] orphan portrait metadata cleared for', orphanNames);
            writeLS();
            render();
            try { toast(`re-drawing ${orphanNames.length} character${orphanNames.length === 1 ? '' : 's'} — old pictures got stuck`, 'info', 3500); } catch {}
            firstDrawQueue(orphanNames).catch(() => {});
          }
        } catch (e) { console.warn('[idb] hydrate on init failed', e); }
      })();
      // Fire-and-forget cloud sync. If migration 018 isn't applied yet,
      // returns 503 and we silently stay on localStorage.
      pullFromCloud().catch(() => {});

      // If we have an active story, try to fetch it to:
      //   1. show the story-chip in the corner
      //   2. fold any new arc characters into the global cast (with empty
      //      portraits so they'll trigger a first-draw)
      // The page works fine without this — it's enrichment, not required.
      if (storyId) {
        try {
          const r = await fetch(`/api/qss-stories?action=get&id=${encodeURIComponent(storyId)}`, { headers: HEADERS });
          if (r.ok) {
            const { story } = await r.json();
            state.story = story;
            // Fold any arc characters into the global cast as appearances.
            const arcChars = Array.isArray(story.arc_context?.characters) ? story.arc_context.characters : [];
            for (const ch of arcChars) {
              const name = (ch?.name || '').trim();
              if (!name) continue;
              const existing = state.cards[name];
              if (!existing) {
                state.cards[name] = migrateCard({
                  name,
                  current_state: ch.current_state || '',
                  intro_block: ch.intro_block || null,
                  status: 'loading',
                });
              } else {
                // Always refresh current_state since it changes as story grows.
                existing.current_state = ch.current_state || existing.current_state || '';
                existing.intro_block = ch.intro_block || existing.intro_block || null;
              }
              // Track that this character appears in this story.
              const card = state.cards[name];
              card.story_appearances = card.story_appearances || [];
              let app = card.story_appearances.find(a => a.story_id === storyId);
              if (!app) {
                app = { story_id: storyId };
                card.story_appearances.push(app);
              }
              if (story.name) app.story_name = story.name;
              if (ch.intro_block != null) app.intro_block = ch.intro_block;
              if (ch.current_state) app.current_state = ch.current_state;
              app.last_seen_at = Date.now();
            }
            writeLS();
