          }
        } catch {}
      }

      try {
        // Normalize every card in the global state through migrateCard
        // so legacy single-image shapes get promoted into portraits[].
        const normalized = {};
        for (const [name, raw] of Object.entries(state.cards)) {
          const m = migrateCard({ ...raw, name });
          if (m) normalized[m.name] = m;
        }
        state.cards = normalized;
        writeLS();

        // Auto-draw on load: only for cards that have ZERO portraits. Each
        // successful draw fires syncCard() which pushes to the qss_cast
        // cloud table, so future reloads find them ready-made.
        const needsFirstDraw = Object.values(state.cards).filter(c =>
          !(Array.isArray(c.portraits) && c.portraits.length)
        );
        render();
        firstDrawQueue(needsFirstDraw.map(c => c.name));
      } catch (e) {
        renderGridEmpty('couldn\'t load the cast', e.message || 'try refresh');
      }
    }

    // First-draw queue — runs one generation at a time, with a short pause
    // between to give Gemini room to breathe. Each card runs through
    // generatePortrait()'s own retry logic (up to 3 attempts inside the
    // server's callNanoBanana too), so if one card fails after all retries
    // we move on instead of blocking the rest.
    async function firstDrawQueue(names) {
      // Concurrency 2 — Gemini handles 2 parallel image-gen calls fine,
      // and this cuts wall time in half for a fresh 8-character cast
      // (40s → ~22s). Anvil flagged the original fully-serial loop as
      // P0 perf. Each batch of 2 fires together, then a 400ms cool-off
      // between batches so we don't pile on Gemini if it's already
      // slow.
      const queue = names.slice();
      while (queue.length) {
        const batch = queue.splice(0, 2)
          .filter(n => state.cards[n] && !state.cards[n].portraits?.length);
        if (!batch.length) continue;
        await Promise.all(batch.map(n => generatePortrait(n).catch(() => {})));
        if (queue.length) await new Promise(r => setTimeout(r, 400));
      }
    }

    function renderGridEmpty(title, sub) {
      document.getElementById('cast-grid').innerHTML = `<div class="empty error"><strong>${esc(title)}</strong>${esc(sub || '')}</div>`;
    }

    // ─── Render ───
    function render() {
      if (state.view === 'detail') renderDetail();
      else renderGrid();
    }
    function renderGrid() {
      document.getElementById('grid-view').classList.remove('hidden');
      document.getElementById('detail-view').classList.remove('active');
      const grid = document.getElementById('cast-grid');
      const cards = Object.values(state.cards);
      if (!cards.length) {
        grid.innerHTML = `<div class="empty"><strong>no characters yet</strong>start writing — anyone Henry adds to the story will show up here.</div>`;
        return;
      }
      const sorted = cards.slice().sort((a, b) => (a.intro_block ?? 9999) - (b.intro_block ?? 9999));
      grid.innerHTML = sorted.map(gridCardMarkup).join('');
    }
    function gridCardMarkup(c) {
      const primary = getPrimary(c);
      // A portrait counts as "ready to render" only when its dataBase64
      // body is attached. With portraits offloaded to IDB, there's a brief
      // window between LS hydrate and IDB hydrate where the metadata is
      // present but the body isn't — that's a loading state, not a primary.
      const primaryReady = !!(primary && primary.dataBase64);
      const isLoading = c.status === 'loading';
      const hasError = c.status === 'error' && !primaryReady;
      const portraitInner = primaryReady
        ? `<img src="data:${esc(primary.mime || 'image/png')};base64,${primary.dataBase64}" alt="${esc(c.name)}" loading="lazy" />`
        : hasError
          ? `<div>couldn't draw yet — tap to try again</div>`
          : `<span>drawing the portrait…</span>`;
      const portraitCls = primaryReady ? '' : (hasError ? 'failed' : 'loading');
      const more = c.portraits.length > 1 ? `<span class="ccard-portraits-count">${c.portraits.length} drawings</span>` : '';
      // Build the read-aloud text — name first, then current_state if any.
      // Henry hears who the character is + what they're up to right now.
      const ttsText = c.current_state ? `${c.name}. ${c.current_state}` : c.name;
      const ttsBtn = window.qssTTS ? window.qssTTS.buildBtn(ttsText, { size: 'sm' }) : '';
      return `<div class="ccard" data-name="${esc(c.name)}">
        <div class="ccard-face">
          ${more}
          <div class="ccard-tts" onclick="event.stopPropagation()">${ttsBtn}</div>
          <div class="ccard-portrait ${portraitCls}">${portraitInner}</div>
          <div class="ccard-nameplate">
            <div class="ccard-name">${esc(c.name)}</div>
            ${c.current_state ? `<div class="ccard-current">${esc(c.current_state)}</div>` : ''}
          </div>
        </div>
      </div>`;
    }

    function renderDetail() {
      const card = state.cards[state.openName];
      if (!card) { state.view = 'grid'; renderGrid(); return; }
      document.getElementById('grid-view').classList.add('hidden');
      document.getElementById('detail-view').classList.add('active');
      // Don't trample the name if Henry is currently editing it (focus
      // would lose its caret position on every re-render otherwise).
      const nameEl = document.getElementById('detail-name');
      if (document.activeElement !== nameEl) nameEl.textContent = card.name;
      // Bio textarea — same rule: don't trample while focused.
      const bioEl = document.getElementById('character-bio');
      if (bioEl && document.activeElement !== bioEl) bioEl.value = card.synopsis || '';
      // Detail-head speaker: reads name + synopsis (if any) + current_state.
      // That's the whole introduction to this character — Henry can hear
      // who they are without reading anything.
      const ttsEl = document.getElementById('detail-tts');
      if (ttsEl && window.qssTTS) {
        const parts = [card.name];
        if (card.synopsis && card.synopsis.trim()) parts.push(card.synopsis.trim());
        else if (card.current_state) parts.push(card.current_state);
        ttsEl.innerHTML = window.qssTTS.buildBtn(parts.join('. '), { size: 'lg', dark: true });
      }

      // Primary portrait. Needs both the metadata AND the dataBase64 body
      // (which arrives async from IDB on first paint).
      const primary = getPrimary(card);
      const primaryReady = !!(primary && primary.dataBase64);
      const ppEl = document.getElementById('portrait-primary');
      if (primaryReady) {
        ppEl.className = 'portrait-primary';
        ppEl.innerHTML = `<img src="data:${esc(primary.mime || 'image/png')};base64,${primary.dataBase64}" alt="${esc(card.name)}" />`;
      } else if (primary || state.pendingGen.has(card.name)) {
        ppEl.className = 'portrait-primary loading';
        ppEl.innerHTML = '<span>drawing the portrait…</span>';
      } else {
        ppEl.className = 'portrait-primary failed';
        ppEl.innerHTML = '<span>no portrait yet — hit ↻ redraw below</span>';
      }

      // Visual notes
      const notesEl = document.getElementById('visual-notes');
      if (document.activeElement !== notesEl) notesEl.value = card.visual_notes || '';

      // Gallery strip — portraits whose dataBase64 hasn't arrived yet from
      // IDB render a small loading shimmer instead of a broken <img>.
      const strip = document.getElementById('gallery-strip');
      const thumbs = card.portraits.slice().sort((a, b) => (a.generated_at || 0) - (b.generated_at || 0)).map(p => {
        const isPrimary = p.id === card.primary_portrait_id;
        const isLoved = !!p.loved;
        const inner = p.dataBase64
          ? `<img src="data:${esc(p.mime || 'image/png')};base64,${p.dataBase64}" alt="" />`
          : `<span style="display:block;padding:18px 8px;font-size:11px;color:var(--ink-faint);text-align:center;">loading…</span>`;
        return `<div class="gallery-thumb ${isPrimary ? 'primary' : ''} ${isLoved ? 'loved' : ''}" data-pid="${esc(p.id)}" title="${esc(p.note || (isPrimary ? 'primary' : 'tap to make primary'))}">
          ${inner}
          <button class="gallery-thumb-x" data-action="delete-portrait" data-pid="${esc(p.id)}" type="button" aria-label="Delete this portrait">×</button>
          <button class="gallery-thumb-down" data-action="vibe-shift" data-pid="${esc(p.id)}" type="button" aria-label="Thumbs down — try a meaningfully different vibe">👎</button>
          <button class="gallery-thumb-love ${isLoved ? 'loved' : ''}" data-action="toggle-love" data-pid="${esc(p.id)}" type="button" aria-label="${isLoved ? 'Unmark this portrait as loved' : 'Mark this portrait as loved — used as style anchor when you regenerate'}">${isLoved ? '♥' : '♡'}</button>
        </div>`;
      }).join('');
      const addBusy = state.pendingGen.has(card.name) ? 'busy' : '';
      // "Regenerate from loved" only shows if at least one portrait
      // has been thumbs-upped. Otherwise the + button is the only way
      // to draw a fresh one.
      const lovedCount = card.portraits.filter(p => p.loved).length;
      const regenBtn = lovedCount > 0
        ? `<button class="gallery-regen ${addBusy}" type="button" data-action="regen-from-loved" aria-label="Regenerate using your loved portraits as the style anchor">
             <span class="gallery-regen-icon">↻</span>
             <span class="gallery-regen-label">like the<br/>♥ ones</span>
           </button>`
        : '';
      strip.innerHTML = thumbs + regenBtn + `<button class="gallery-add ${addBusy}" type="button" data-action="add-portrait" aria-label="Draw another portrait">+</button>`;

      // Chat thread
      renderChatThread(card);
    }

    function renderChatThread(card) {
      const thread = document.getElementById('chat-thread');
      const msgs = card.chat || [];
      if (!msgs.length && !state.chatBusy) {
        thread.innerHTML = `<div class="empty"><strong>chat with ${esc(card.name)}</strong>say what to change — "make him scarier", "add a cape", "no helmet". every message draws a new picture. the old ones stay in the gallery below.</div>`;
        return;
      }
      const lines = msgs.map(m => {
        const role = m.role === 'wordy' ? 'wordy' : 'kid';
        const isFlag = m.tag === 'consistency-flag';
        const tagPrefix = isFlag ? `<span class="cmsg-tag">heads up</span>` : '';
        const ttsBtn = (role === 'wordy' && window.qssTTS)
          ? window.qssTTS.buildBtn(m.content, { size: 'sm', voice: 'adam' })
          : '';
        return `<div class="cmsg ${role}${isFlag ? ' flag' : ''}"><div class="cmsg-bubble">${tagPrefix}${esc(m.content)}</div>${ttsBtn ? `<div class="cmsg-tts">${ttsBtn}</div>` : ''}</div>`;
      }).join('');
      const typing = state.chatBusy
        ? `<div class="cmsg-typing">wordy is drawing… <span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`
        : '';
      thread.innerHTML = lines + typing;
      requestAnimationFrame(() => { thread.scrollTop = thread.scrollHeight; });
    }

    // ─── Generation ───
    async function generatePortrait(name, { visualNotes = null, chatMessage = null, fromChat = false, fromLoved = false, vibeShift = false } = {}) {
      const card = state.cards[name];
      if (!card) return;
      if (state.pendingGen.has(name)) return;
      state.pendingGen.add(name);
      card.status = 'loading';
      card.error = null;
      if (state.view === 'detail' && state.openName === name) renderDetail();
      else render();

      const recent = (state.story?.blocks || []).slice(-6).map(b => ({ text: b.text || '' }));
      const isFirst = card.portraits.length === 0;
      // When Henry hits "regenerate from loved", send every ♥'d portrait
      // as a reference image so nano-banana matches the style he picked.
      // Cap at 3 to keep the payload reasonable — most-recent loved wins.
      const lovedRefs = fromLoved
        ? card.portraits
            .filter(p => p.loved)
            .slice(-3)
            .map(p => ({ dataBase64: p.dataBase64, mimeType: p.mime || 'image/png' }))
        : null;
      const body = {
        character: { name, current_state: card.current_state || '', intro_block: card.intro_block || null },
        arc: state.story?.arc_context || null,
        recentBlocks: recent,
        rules: state.story?.rules || null,
        // New revise-mode fields. Server is tolerant of older clients (no
        // `revise` flag = original behavior).
        revise: !isFirst,
        // vibe_shift: Henry hit 👎 — backend rewrites visual_notes to a
        // meaningfully different archetype, skips the primary portrait as
        // reference so Gemini doesn't anchor to the rejected vibe.
        vibe_shift: !!vibeShift,
        visual_notes: typeof visualNotes === 'string' ? visualNotes : (card.visual_notes || ''),
        chat: card.chat || [],
        new_message: chatMessage || (fromLoved ? 'redraw matching the style anchors I marked ♥' : ''),
        existing_synopsis: card.synopsis || '',
        // In vibeShift mode we deliberately DON'T attach the primary
        // portrait — that's the reference that's locking the vibe Henry
        // rejected. Server also drops it independently as a safety net.
        primary_portrait: (!isFirst && !vibeShift) ? getPrimaryAsRef(card) : null,
        // Style anchors — nano-banana endpoint accepts these as
        // referenceImages (validated for inline base64 + mime).
        // Suppressed in vibeShift mode for the same reason as above.
        referenceImages: vibeShift ? undefined : (lovedRefs || undefined),
      };

      try {
        // Retry the endpoint call up to 3 times with exponential backoff
        // for transient 5xx / network failures. Server itself also retries
        // Gemini internally; this is a belt-and-suspenders layer.
        let r = null;
        let lastErr = null;
        for (let attempt = 1; attempt <= 3; attempt++) {
          if (attempt > 1) await new Promise(rs => setTimeout(rs, attempt * 1500));
          try {
            r = await fetch('/api/qss-character-card', {
              method: 'POST', headers: HEADERS,
              body: JSON.stringify(body),
            });
            // 200 / 4xx (not retryable) → break out
            if (r.ok || (r.status >= 400 && r.status < 500 && r.status !== 408)) break;
            const j = await r.json().catch(() => ({}));
            lastErr = new Error(j.error || `${r.status}`);
          } catch (netErr) {
            lastErr = netErr;
            r = null;
          }
        }
        if (!r || !r.ok) {
          if (r) {
            const j = await r.json().catch(() => ({}));
            throw new Error(j.error || `${r.status}`);
          }
          throw lastErr || new Error('failed after retries');
        }
        const data = await r.json();
        // First-ever generation populates synopsis. Revise calls preserve it.
        if (isFirst && data.synopsis) card.synopsis = data.synopsis;
        if (typeof data.visual_notes === 'string' && data.visual_notes.trim()) {
          card.visual_notes = data.visual_notes.trim();
        }
        if (data.image && data.image.dataBase64) {
          const pid = uid();
          card.portraits.push({
            id: pid,
            mime: data.image.mime || 'image/png',
            dataBase64: data.image.dataBase64,
            generated_at: Date.now(),
            note: chatMessage || (visualNotes ? 'redraw' : ''),
          });
          card.primary_portrait_id = pid;
        }
        if (fromChat && data.chat_reply) {
          card.chat.push({
            id: uid(), role: 'wordy',
            content: data.chat_reply,
            ts: Date.now(),
          });
        }
        card.status = 'ready';
        card.generated_at = Date.now();
      } catch (e) {
        card.status = 'error';
        card.error = e.message || 'failed';
        toast(`couldn't redraw ${name}: ${card.error}`, 'error', 4000);
      } finally {
        state.pendingGen.delete(name);
        syncCard(name);            // → cloud (global)
        scheduleCloudSave();        // → cloud (active story's per-story mirror)
        if (state.view === 'detail' && state.openName === name) renderDetail();
        else render();
      }
    }

    // Compact form of the primary portrait for use as a reference image in
    // the revise prompt. nano-banana accepts referenceImages: [{ dataBase64,
    // mimeType }] — we pass at most one to keep the upstream call cheap.
    function getPrimaryAsRef(card) {
      const p = getPrimary(card);
      if (!p || !p.dataBase64) return null;
      return { mimeType: p.mime || 'image/png', dataBase64: p.dataBase64 };
    }

    // ─── Cloud save (best-effort; LS is authoritative pre-migration) ───
    function scheduleCloudSave() {
      clearTimeout(state.saveTimer);
      state.saveTimer = setTimeout(persistToCloud, 1400);
    }
    async function persistToCloud() {
      // The global cast lives in localStorage. We ALSO mirror the subset
      // that appears in the active story into qss_stories.character_cards
      // (best-effort) so storyboard generation server-side can read the
      // primary portraits + visual notes. No active story → just skip.
      if (!state.storyId || !state.story) return;
      const subset = Object.values(state.cards).filter(c => {
        const apps = Array.isArray(c.story_appearances) ? c.story_appearances : [];
        return apps.some(a => a.story_id === state.storyId);
      });
      const payload = {
        id: state.storyId,
        name: state.story.name,
        character_cards: subset.map(c => ({
          name: c.name,
          synopsis: c.synopsis || '',
          visual_notes: c.visual_notes || '',
          current_state: c.current_state || '',
          intro_block: c.intro_block || null,
          portraits: c.portraits || [],
          primary_portrait_id: c.primary_portrait_id || null,
          chat: c.chat || [],
          generated_at: c.generated_at || Date.now(),
          image: getPrimary(c) ? { mime: getPrimary(c).mime, dataBase64: getPrimary(c).dataBase64 } : null,
        })),
        expectedUpdatedAt: state.story.updated_at || undefined,
      };
      try {
        const r = await fetch('/api/qss-stories?action=save', { method: 'POST', headers: HEADERS, body: JSON.stringify(payload) });
        if (r.ok) {
          const j = await r.json().catch(() => ({}));
          if (j?.story?.updated_at) state.story.updated_at = j.story.updated_at;
        }
      } catch {}
    }

    // ─── Detail-view interactions ───
    function openCard(name) {
      if (!state.cards[name]) return;
      state.view = 'detail';
      state.openName = name;
      try { history.pushState({ name }, '', `#${encodeURIComponent(name)}`); } catch {}
      render();
    }
    function backToGrid() {
      state.view = 'grid';
      state.openName = null;
      try { history.pushState({}, '', location.pathname + location.search); } catch {}
      render();
    }
    window.addEventListener('popstate', () => {
      const hash = (location.hash || '').replace(/^#/, '');
      const name = hash ? decodeURIComponent(hash) : null;
      if (name && state.cards[name]) { state.view = 'detail'; state.openName = name; }
      else { state.view = 'grid'; state.openName = null; }
      render();
    });

    function setPrimaryPortrait(pid) {
      const card = state.cards[state.openName]; if (!card) return;
      const p = card.portraits.find(x => x.id === pid); if (!p) return;
      card.primary_portrait_id = pid;
      syncCard(state.openName);
      scheduleCloudSave();
      renderDetail();
    }
    function deletePortrait(pid) {
      const card = state.cards[state.openName]; if (!card) return;
      const idx = card.portraits.findIndex(x => x.id === pid);
      if (idx < 0) return;
      const isLoved = card.portraits[idx]?.loved;
      const isPrimary = card.primary_portrait_id === pid;
      // Loved or primary portraits get a confirm — Henry might tap the
      // × by accident. Casual portraits delete silently (you can always
      // redraw). Loved portraits are intentionally marked; primary is
      // the visible one. Both deserve a "are you sure?".
      if (isLoved || isPrimary) {
        const what = isLoved ? 'a portrait you ♥-loved' : 'the main portrait you can see right now';
        if (!confirm(`Delete ${what}? You can\'t un-delete this.`)) return;
      }
      card.portraits.splice(idx, 1);
      if (card.primary_portrait_id === pid) {
        card.primary_portrait_id = card.portraits.length
          ? card.portraits[card.portraits.length - 1].id
          : null;
      }
      // Drop the IDB blob too so it doesn't orphan-leak.
      try { castIdb.del(pid); } catch {}
      syncCard(state.openName);
      scheduleCloudSave();
      renderDetail();
      toast('portrait deleted', 'success', 1600);
    }
    function togglePortraitLove(pid) {
      const card = state.cards[state.openName]; if (!card) return;
      const p = card.portraits.find(x => x.id === pid); if (!p) return;
      p.loved = !p.loved;
      syncCard(state.openName);
      scheduleCloudSave();
      renderDetail();
      toast(p.loved ? '♥ saved as style anchor' : '♥ removed', 'success', 1200);
      // Contradiction detection — when a SECOND (or later) love lands,
      // ask Gemini Vision whether the loved portraits actually look like
      // the same character. If they don't, Wordy chimes in on the chat
      // thread so Henry can pick a direction before the style anchors
      // confuse the next redraw.
      if (p.loved) {
        const lovedNow = card.portraits.filter(x => x.loved);
        if (lovedNow.length >= 2) checkLovedConsistency(card).catch(() => {});
      }
    }

    // Rolling de-dupe: don't re-run consistency check on the same set
    // of loved portraits. Key = sorted loved ids joined with comma.
    let _lastConsistencyKey = null;
    let _consistencyInflight = false;
    async function checkLovedConsistency(card) {
      if (_consistencyInflight) return;
      const lovedPortraits = (card.portraits || []).filter(p => p.loved);
      if (lovedPortraits.length < 2) return;
      const key = lovedPortraits.map(p => p.id).slice().sort().join(',');
      if (key === _lastConsistencyKey) return;
      _consistencyInflight = true;
      try {
        // Limit to 4 images max (most recent loved). Each can be ~1.5MB.
        const images = lovedPortraits.slice(-4)
          .filter(p => p.dataBase64)
          .map(p => ({ mimeType: p.mime || 'image/png', dataBase64: p.dataBase64 }));
        if (images.length < 2) return;
        const res = await fetch('/api/qss-character-compare', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ character_name: card.name, images }),
        });
        if (!res.ok) return;
        const data = await res.json().catch(() => ({}));
        _lastConsistencyKey = key;
        if (data.incompatible && data.wordy_message) {
          // Post Wordy's flag into the chat thread. This is a passive
          // notification — Henry can ignore it. He sees it next to the
          // portrait, hears it auto-speak (no — chat auto-speak is in
          // the main app, here we let the speaker button be the entry).
          card.chat = card.chat || [];
          card.chat.push({
            id: uid(),
            role: 'wordy',
            content: data.wordy_message,
            ts: Date.now(),
            tag: 'consistency-flag',
          });
          syncCard(state.openName);
          scheduleCloudSave();
          renderChatThread(card);
          // Auto-speak the flag so Henry doesn't miss it.
          if (window.qssTTS) {
            setTimeout(() => { try { window.qssTTS.speak(data.wordy_message, null, { voice: 'adam' }); } catch {} }, 220);
          }
        }
      } catch {
        // Silently swallow — this is a nice-to-have, not a P0.
      } finally {
        _consistencyInflight = false;
      }
    }
    // Regenerate using the loved portraits as visual anchors. We
    // pass them to the character-card endpoint as referenceImages,
    // which nano-banana already accepts. The endpoint will hand them
    // to Gemini as inline base64 reference frames so the new card
    // matches the style Henry already approved.
    function regenerateFromLoved() {
      const card = state.cards[state.openName]; if (!card) return;
      const loved = card.portraits.filter(p => p.loved);
      if (loved.length === 0) {
        toast('thumbs up a portrait first', 'info', 1600);
        return;
      }
      generatePortrait(state.openName, { fromLoved: true });
    }
    function deleteCharacter() {
      const name = state.openName; if (!name) return;
      if (!confirm(`Delete ${name} from the cast? (this removes the character from the GLOBAL cast — they'll be gone from every story.)`)) return;
      delete state.cards[name];
      writeLS();
      deleteFromCloud(name);
      scheduleCloudSave();
      backToGrid();
      toast(`${name} removed from the cast`, 'success', 2000);
    }

    function saveVisualNotes() {
      const card = state.cards[state.openName]; if (!card) return;
      card.visual_notes = document.getElementById('visual-notes').value;
      syncCard(state.openName);
      scheduleCloudSave();
    }

    function saveBio() {
      const card = state.cards[state.openName]; if (!card) return;
      const bio = document.getElementById('character-bio').value;
      if (bio === card.synopsis) return; // no-op
      card.synopsis = bio;
      syncCard(state.openName);
      scheduleCloudSave();
    }

    // ─── Rename the character (inline-edit the h1) ───
    // The h1 is contenteditable; on blur we validate and commit. Rename
    // is a real shape change — state.cards is keyed by displayName, and
    // syncCard / cloud rows are keyed by lowercased name. We have to:
    //   1. Trim + cap length + reject empty
    //   2. If the lowercased key collided with another character, refuse
    //   3. Move the card to the new key in state.cards, delete the old
    //   4. Tell the cloud the OLD key is gone (delete) + push the new
    //   5. Update state.openName so subsequent renders find the card
    function commitRename() {
      const nameEl = document.getElementById('detail-name');
      const oldName = state.openName;
      const card = state.cards[oldName];
      if (!card || !nameEl) return;
      let newName = (nameEl.textContent || '').replace(/\s+/g, ' ').trim();
      if (newName.length > 80) newName = newName.slice(0, 80);
      // Restore visual on empty or no-change.
      if (!newName) { nameEl.textContent = card.name; return; }
      if (newName === card.name) { nameEl.textContent = card.name; return; }
      const newLk = (newName || '').toLowerCase();
      const oldLk = (oldName || '').toLowerCase();
      if (newLk !== oldLk) {
        // Case-rename safe (Snorbjorn → Snorbjørn) because lowercased key changes.
        // Real-name collision: refuse and restore.
        const collision = Object.values(state.cards).find(c => {
          if (!c || c === card) return false;
          return (c.name || '').toLowerCase() === newLk;
        });
        if (collision) {
          toast(`there's already a character called "${collision.name}" — pick a different name`, 'error', 3500);
          nameEl.textContent = card.name;
          return;
        }
      }
      // Apply the rename. state.cards is keyed by displayName.
      card.name = newName;
      delete state.cards[oldName];
      state.cards[newName] = card;
      state.openName = newName;
      // If the lowercased key changed, the cloud row at the old lk
      // is now orphaned — explicitly delete it before pushing the new one.
      if (newLk !== oldLk && oldLk) {
        try { deleteFromCloud(oldName); } catch {}
      }
      writeLS();
      syncCard(newName);
      scheduleCloudSave();
      // Re-render the grid so the rename is reflected there too.
      // (Re-render detail to refresh the speaker-button text and bio.)
      renderDetail();
      toast(`renamed → ${newName}`, 'success', 1800);
    }

    async function sendChatMessage() {
      const card = state.cards[state.openName]; if (!card) return;
      const inp = document.getElementById('chat-input');
      const text = (inp.value || '').trim();
      if (!text || state.chatBusy) return;
      card.chat.push({ id: uid(), role: 'kid', content: text, ts: Date.now() });
      inp.value = ''; inp.style.height = 'auto';
      state.chatBusy = true;
      renderChatThread(card);
      // Generate a fresh portrait using the chat message as the revise instruction.
      // generatePortrait flips state.pendingGen + status; we don't await here so the
      // typing indicator stays visible until the call returns.
      try {
        await generatePortrait(card.name, {
          visualNotes: card.visual_notes,
          chatMessage: text,
          fromChat: true,
        });
      } finally {
        state.chatBusy = false;
        renderChatThread(card);
      }
    }

    async function redrawFromNotes() {
      const card = state.cards[state.openName]; if (!card) return;
      await generatePortrait(card.name, {
        visualNotes: card.visual_notes,
      });
    }

    // Vibe-shift redraw — Henry hit 👎 on the current direction. Backend
    // rewrites visual_notes to a meaningfully different archetype and
    // draws without the primary portrait as reference so it doesn't lock
    // to the rejected vibe.
    async function vibeShiftRedraw() {
      const card = state.cards[state.openName]; if (!card) return;
      toast(`trying a meaningfully different vibe for ${card.name}…`, 'info', 2200);
      await generatePortrait(card.name, {
        visualNotes: card.visual_notes,
        vibeShift: true,
      });
    }

    // ─── Wire ───
    document.addEventListener('DOMContentLoaded', () => {
      // Grid clicks → open card
      document.getElementById('cast-grid').addEventListener('click', (e) => {
        const card = e.target.closest('.ccard'); if (!card) return;
        openCard(card.dataset.name);
      });

      // "save all" button — force every portrait into IDB + cloud, update
      // the status pill with what got persisted.
      const saveBtn = document.getElementById('btn-force-save');
      const saveStatus = document.getElementById('save-status');
      if (saveBtn && saveStatus) {
        saveBtn.addEventListener('click', async () => {
          saveBtn.disabled = true;
          saveStatus.className = 'save-status busy';
          saveStatus.textContent = 'saving…';
          try {
            const r = await saveAll();
            saveStatus.className = 'save-status ok';
            saveStatus.textContent = r.cloud
              ? `saved ${r.cards} character${r.cards === 1 ? '' : 's'} · ${r.portraits} picture${r.portraits === 1 ? '' : 's'} · cloud ✓`
              : `saved ${r.cards} on this device — cloud try again in a moment`;
            // Fade the pill out after 6s so it's not a permanent label
            setTimeout(() => { if (saveStatus.textContent.startsWith('saved')) saveStatus.textContent = ''; }, 6000);
          } catch (e) {
            saveStatus.className = 'save-status err';
            saveStatus.textContent = 'save failed — open console for details';
            console.error('[saveAll]', e);
          } finally {
            saveBtn.disabled = false;
          }
        });
      }

      // Detail back/delete
      document.getElementById('detail-back').addEventListener('click', backToGrid);
      document.getElementById('detail-delete').addEventListener('click', deleteCharacter);

      // Visual notes — autosave on input (debounced via cloud schedule + LS write per keystroke is fine)
      document.getElementById('visual-notes').addEventListener('input', saveVisualNotes);

      // Character bio — same autosave-on-input pattern.
      document.getElementById('character-bio')?.addEventListener('input', saveBio);

      // Editable name — commit on blur OR Enter. Enter blurs the field
      // so the same commit path handles both. Escape cancels by restoring
      // the original textContent.
      const nameEl = document.getElementById('detail-name');
      if (nameEl) {
        nameEl.addEventListener('blur', commitRename);
        nameEl.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); nameEl.blur(); }
          if (e.key === 'Escape') {
            const card = state.cards[state.openName];
            if (card) nameEl.textContent = card.name;
            nameEl.blur();
          }
        });
        // Strip pasted formatting — keep only plain text.
        nameEl.addEventListener('paste', (e) => {
          e.preventDefault();
          const t = (e.clipboardData || window.clipboardData).getData('text');
          document.execCommand('insertText', false, t.replace(/\s+/g, ' '));
        });
      }

      // Gallery interactions
      document.getElementById('gallery-strip').addEventListener('click', (e) => {
        const x = e.target.closest('[data-action="delete-portrait"]');
        if (x) { e.stopPropagation(); deletePortrait(x.dataset.pid); return; }
        const love = e.target.closest('[data-action="toggle-love"]');
        if (love) { e.stopPropagation(); togglePortraitLove(love.dataset.pid); return; }
        const down = e.target.closest('[data-action="vibe-shift"]');
        if (down) { e.stopPropagation(); vibeShiftRedraw(); return; }
        const regen = e.target.closest('[data-action="regen-from-loved"]');
        if (regen) { regenerateFromLoved(); return; }
        const add = e.target.closest('[data-action="add-portrait"]');
        if (add) { redrawFromNotes(); return; }
        const thumb = e.target.closest('.gallery-thumb');
        if (thumb) setPrimaryPortrait(thumb.dataset.pid);
      });

      // "👎 different vibe" button next to redraw — forces a meaningfully
      // different visual direction (rewrites visual_notes, drops the
      // primary-portrait reference so Gemini doesn't anchor).
      document.getElementById('chat-vibe-shift')?.addEventListener('click', vibeShiftRedraw);

      // Chat composer
      const chatInp = document.getElementById('chat-input');
      document.getElementById('chat-send').addEventListener('click', sendChatMessage);
      chatInp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
      });
      chatInp.addEventListener('input', () => {
        chatInp.style.height = 'auto';
        chatInp.style.height = Math.min(chatInp.scrollHeight, 180) + 'px';
      });
      document.getElementById('chat-redraw').addEventListener('click', redrawFromNotes);
    });
  </script>
</body>
</html>
