<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>The Universe — Henry's Storytelling Worlds</title>
  <link rel="icon" type="image/svg+xml" href="/queen-scarlet-school/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="/queen-scarlet-school/lib/worlds.js"></script>
  <link rel="stylesheet" href="/queen-scarlet-school/lib/themes.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    :root {
      --ink: #f4e9c8;
      --ink-bright: #ffffff;
      --ink-soft: rgba(244, 233, 200, 0.72);
      --ink-faint: rgba(244, 233, 200, 0.4);
      --yolk: #FFD93D;
      --space: #000003;
      --display: 'Orbitron', sans-serif;
      --ui: 'Space Grotesk', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --kid: 'Fredoka', system-ui, sans-serif;
      --ease: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-soft: cubic-bezier(0.22, 0.6, 0.24, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      min-height: 100%;
      width: 100%;
      background: var(--space);
      color: var(--ink);
      font-family: var(--ui);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ── Loading screen ─────────────────────────────────────────────── */
    .loading {
      position: fixed; inset: 0; z-index: 100;
      background: radial-gradient(circle at center, #0a0a14 0%, #000003 70%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 22px;
      transition: opacity 800ms ease, visibility 800ms ease;
    }
    .loading.gone { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-sun {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff7c4 0%, #FFD93D 45%, #FF8A3D 80%, transparent 100%);
      box-shadow: 0 0 40px rgba(255, 217, 60, 0.7), 0 0 90px rgba(255, 138, 61, 0.45);
      animation: sun-pulse 1.8s ease-in-out infinite;
    }
    @keyframes sun-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(255,217,60,0.7), 0 0 90px rgba(255,138,61,0.45); }
      50% { transform: scale(1.12); box-shadow: 0 0 60px rgba(255,217,60,0.95), 0 0 140px rgba(255,138,61,0.65); }
    }
    .loader-title {
      font-family: var(--display);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--ink-bright);
    }
    .loader-sub {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--ink-faint);
    }

    /* ── Three.js stage ─────────────────────────────────────────────── */
    #stage3d {
      position: fixed; inset: 0;
      z-index: 1;
    }
    #stage3d canvas { display: block; }

    /* ── Topbar ─────────────────────────────────────────────────────── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 20;
      display: flex; align-items: center;
      padding: 22px 30px;
      padding-top: max(22px, env(safe-area-inset-top));
      pointer-events: none;
    }
    .topbar > * { pointer-events: auto; }
    .brand {
      font-family: var(--display);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--ink-bright);
      text-decoration: none;
      display: inline-flex; align-items: center; gap: 12px;
    }
    .brand-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--yolk);
      box-shadow: 0 0 12px rgba(255, 217, 60, 0.8);
    }
    .topbar .spacer { flex: 1; pointer-events: none; }
    .top-eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .top-eyebrow b { color: var(--yolk); font-weight: 700; }

    /* ── Title card (top-center, a real moment) ─────────────────────── */
    .title-card {
      position: fixed;
      top: 96px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      text-align: center;
      pointer-events: none;
      animation: fade-down 1.4s var(--ease-soft) both;
      max-width: min(720px, 92vw);
    }
    .title-eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 14px;
      display: inline-flex; align-items: center; gap: 12px;
    }
    .title-eyebrow::before,
    .title-eyebrow::after {
      content: '';
      display: inline-block;
      width: 36px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,217,60,0.45), transparent);
    }
    .title-h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(34px, 4.6vw, 64px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-bright);
      text-shadow:
        0 0 24px rgba(255, 217, 60, 0.42),
        0 0 64px rgba(255, 138, 61, 0.22),
        0 2px 0 rgba(0,0,0,0.6);
      text-wrap: balance;
      line-height: 1.05;
    }
    .title-sub {
      font-family: var(--mono);
      font-size: 11.5px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-top: 18px;
      font-style: normal;
      text-wrap: balance;
    }
    @keyframes fade-down {
      from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ── Projected planet labels ────────────────────────────────────── */
    #labelLayer {
      position: fixed; inset: 0;
      z-index: 10;
      pointer-events: none;
    }
    .planet-label {
      position: absolute;
      transform: translate(-50%, 0);
      pointer-events: auto;
      text-align: center;
      cursor: pointer;
      padding: 6px 8px;
      opacity: 0;
      transition: opacity 360ms ease;
      will-change: transform, opacity;
    }
    .planet-label.visible { opacity: 1; }
    .planet-label .label-name {
      display: inline-block;
      font-family: var(--display);
      font-weight: 700;
      font-size: 13.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--planet-color, var(--ink-bright));
      text-shadow: 0 0 12px var(--planet-glow, rgba(255,255,255,0.6)), 0 0 2px rgba(0,0,0,0.9);
      line-height: 1.15;
      position: relative;
      padding-bottom: 4px;
      transition: letter-spacing 320ms var(--ease-soft);
    }
    .planet-label .label-name::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 0;
      width: 0; height: 1.5px;
      background: var(--planet-color, var(--yolk));
      box-shadow: 0 0 10px var(--planet-glow, var(--yolk));
      transform: translateX(-50%);
      transition: width 360ms var(--ease-soft);
    }
    .planet-label:hover .label-name::after,
    .planet-label.hot .label-name::after { width: 80%; }
    .planet-label:hover .label-name,
    .planet-label.hot .label-name { letter-spacing: 0.26em; }
    .planet-label .label-tagline {
      display: block;
      margin-top: 6px;
      font-family: var(--ui);
      font-size: 12px;
      color: var(--ink-soft);
      max-width: 220px;
      margin-left: auto; margin-right: auto;
      line-height: 1.35;
      text-shadow: 0 2px 8px rgba(0,0,0,0.85);
    }
    .planet-label .label-actions {
      margin-top: 10px;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .label-enter {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px;
      font-family: var(--mono);
      font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--planet-color, var(--yolk));
      background: rgba(0, 0, 0, 0.55);
      border: 1.5px solid color-mix(in srgb, var(--planet-color, #FFD93D) 60%, transparent);
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 180ms ease, transform 180ms ease;
    }
    .label-enter:hover {
      background: color-mix(in srgb, var(--planet-color, #FFD93D) 18%, rgba(0,0,0,0.55));
      transform: translateY(-1px);
    }
    .label-speaker {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px;
      background: rgba(0, 0, 0, 0.55);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      cursor: pointer;
      color: var(--ink);
      backdrop-filter: blur(6px);
      transition: background 160ms ease, transform 160ms ease;
    }
    .label-speaker:hover { background: var(--yolk); color: #000; transform: scale(1.06); }
    .label-speaker.playing { background: var(--yolk); color: #000; }
    .label-speaker svg { width: 13px; height: 13px; pointer-events: none; }

    /* ── Bottom-right legend (refined hierarchy) ────────────────────── */
    .legend {
      position: fixed;
      right: 28px;
      bottom: 28px;
      bottom: max(28px, env(safe-area-inset-bottom));
      z-index: 20;
      display: flex; flex-direction: column;
      align-items: stretch;
      gap: 10px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-faint);
      pointer-events: none;
      padding: 14px 16px;
      background: linear-gradient(180deg, rgba(8,8,18,0.55), rgba(0,0,3,0.65));
      border: 1px solid rgba(244, 233, 200, 0.08);
      backdrop-filter: blur(8px) saturate(1.05);
      border-radius: 4px;
      min-width: 180px;
    }
    .legend-head {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.36em;
      color: rgba(244,233,200,0.55);
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(244, 233, 200, 0.10);
      display: flex; align-items: center; justify-content: space-between;
    }
    .legend-head b { color: var(--yolk); font-weight: 700; letter-spacing: 0.32em; }
    .legend-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 14px;
    }
    .legend-row span:first-child { color: rgba(244,233,200,0.62); }
    .legend-key {
      font-family: var(--mono); font-weight: 700;
      padding: 2px 7px;
      border: 1px solid rgba(244, 233, 200, 0.22);
      border-radius: 2px;
      color: var(--ink-bright);
      background: rgba(0, 0, 0, 0.55);
      letter-spacing: 0.14em;
      font-size: 9.5px;
    }
    .legend-divider {
      width: 100%;
      border-top: 1px solid rgba(244, 233, 200, 0.10);
      margin: 2px 0;
    }
    .legend-keyline {
      display: flex; align-items: center; justify-content: space-between;
      gap: 14px;
    }
    .legend-keyline > span:first-child { color: rgba(244,233,200,0.62); }
    .legend-keyline .swatch {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--yolk);
      box-shadow: 0 0 8px var(--yolk);
    }
    .legend-keyline.swatch-orbit .swatch {
      background: transparent;
      width: 18px; height: 0;
      border-top: 1px dashed rgba(244,233,200,0.45);
      box-shadow: none;
      border-radius: 0;
    }

    /* ── CSS parallax star drift (over Three.js field, very slow) ────── */
    .star-drift {
      position: fixed; inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.55;
      mix-blend-mode: screen;
    }
    .star-drift .layer {
      position: absolute; inset: -10%;
      background-repeat: repeat;
      animation: star-drift-anim 240s linear infinite;
      will-change: transform;
    }
    .star-drift .layer.l1 {
      background-image: radial-gradient(circle at 12% 22%, rgba(255,255,255,0.55) 0.5px, transparent 1.5px),
                        radial-gradient(circle at 78% 64%, rgba(255,240,200,0.45) 0.5px, transparent 1.5px),
                        radial-gradient(circle at 42% 88%, rgba(200,220,255,0.4) 0.5px, transparent 1.5px);
      background-size: 320px 320px;
    }
    .star-drift .layer.l2 {
      background-image: radial-gradient(circle at 65% 18%, rgba(255,255,255,0.35) 0.5px, transparent 1px),
                        radial-gradient(circle at 22% 72%, rgba(255,217,60,0.30) 0.5px, transparent 1px);
      background-size: 540px 540px;
      animation-duration: 380s;
      animation-direction: reverse;
    }
    @keyframes star-drift-anim {
      from { transform: translate3d(0, 0, 0); }
      to   { transform: translate3d(-320px, -180px, 0); }
    }

    /* ── Footer pulse / hint ────────────────────────────────────────── */
    .footer-hint {
      position: fixed;
      left: 28px;
      bottom: 28px;
      bottom: max(28px, env(safe-area-inset-bottom));
      z-index: 20;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-soft);
      display: inline-flex; align-items: center; gap: 10px;
    }
    .footer-pulse {
      display: inline-block;
      width: 7px; height: 7px;
      background: var(--yolk);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--yolk);
      animation: pulse-dot 1.6s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50%      { opacity: 1; transform: scale(1.4); }
    }

    /* ── Warp transition into a world ───────────────────────────────── */
    .warp-flash {
      position: fixed; inset: 0; z-index: 90;
      background: radial-gradient(circle at center, rgba(255,255,255,0.95), rgba(255,255,255,0));
      opacity: 0;
      pointer-events: none;
    }
    .warp-flash.fire {
      animation: warp 1100ms var(--ease-soft) forwards;
    }
    @keyframes warp {
      0% { opacity: 0; }
      55% { opacity: 1; }
      100% { opacity: 1; background: radial-gradient(circle at center, rgba(255,255,255,1), rgba(255,255,255,1)); }
    }
    body.zooming .title-card,
    body.zooming .legend,
    body.zooming .footer-hint,
    body.zooming #labelLayer {
      animation: fade-away 600ms ease forwards;
    }
    @keyframes fade-away {
      to { opacity: 0; transform: translateY(-6px); }
    }

    /* ── Mobile ─────────────────────────────────────────────────────── */
    @media (max-width: 760px) {
      .title-card { top: 70px; }
      .title-h1 { font-size: 18px; letter-spacing: 0.12em; }
      .topbar { padding: 16px 18px; }
      .legend, .footer-hint { font-size: 9.5px; right: 14px; left: auto; bottom: 14px; }
      .footer-hint { display: none; }
      .planet-label .label-name { font-size: 12px; }
      .planet-label .label-tagline { font-size: 11px; max-width: 180px; }
    }
  </style>
</head>
<body>

  <div class="loading" id="loader">
    <div class="loader-sun"></div>
    <div class="loader-title">Warming up the universe</div>
    <div class="loader-sub">Plotting orbits · gathering stars</div>
  </div>

  <div id="stage3d"></div>
  <div class="star-drift" aria-hidden="true">
    <div class="layer l1"></div>
    <div class="layer l2"></div>
  </div>
  <div id="labelLayer"></div>

  <header class="topbar">
    <a href="/" class="brand"><span class="brand-dot"></span>mycoldmars</a>
    <span class="spacer"></span>
    <span class="top-eyebrow">welcome back, <b>Henry</b></span>
  </header>

  <div class="title-card">
    <div class="title-eyebrow">The Universe</div>
    <h1 class="title-h1">Pick a World</h1>
    <p class="title-sub">drag to spin · scroll to zoom · tap a planet to step in</p>
  </div>

  <div class="legend" aria-hidden="true">
    <div class="legend-head"><span>NAV</span><b>v2</b></div>
    <div class="legend-keyline"><span>Worlds</span><span class="swatch"></span></div>
    <div class="legend-keyline swatch-orbit"><span>Orbits</span><span class="swatch"></span></div>
    <div class="legend-divider"></div>
    <div class="legend-row"><span>Explore</span><span class="legend-key">click</span></div>
    <div class="legend-row"><span>Spin</span><span class="legend-key">drag</span></div>
    <div class="legend-row"><span>Zoom</span><span class="legend-key">scroll</span></div>
  </div>

  <div class="footer-hint">
    <span class="footer-pulse" aria-hidden="true"></span>
    every world is its own story
  </div>

  <div class="warp-flash" id="warp" aria-hidden="true"></div>

  <script>
  (function() {
    if (!window.QSSWorlds || !window.THREE) {
      console.error('Missing dependency: QSSWorlds or THREE');
      return;
    }

    const THREE = window.THREE;
    const worlds = window.QSSWorlds.list();
    const stage = document.getElementById('stage3d');
    const labelLayer = document.getElementById('labelLayer');
    const loader = document.getElementById('loader');
    const warp = document.getElementById('warp');

    // ─── Scene / camera / renderer ───
    const scene = new THREE.Scene();
    // Light fog adds depth but keep it weak — too dense kills the
    // starfield that lives at radius ~400.
    scene.fog = new THREE.FogExp2(0x000003, 0.004);

    const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 2000);
    camera.position.set(0, 20, 56);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x000003, 1);
    stage.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.minDistance = 14;
    controls.maxDistance = 80;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;
    controls.maxPolarAngle = Math.PI * 0.62;
    controls.minPolarAngle = Math.PI * 0.30;

    // ─── Lights ───
    scene.add(new THREE.AmbientLight(0x6a6a85, 1.0));
    const sunLight = new THREE.PointLight(0xfff0c8, 1.6, 240);
    sunLight.position.set(0, 0, 0);
    scene.add(sunLight);
    const fill = new THREE.DirectionalLight(0xb8c8ff, 0.45);
    fill.position.set(20, 30, 20);
    scene.add(fill);

    // ─── Starfield (Points cloud) ───
    (function makeStarfield() {
      const g = new THREE.BufferGeometry();
      const N = 1600;
      const pos = new Float32Array(N * 3);
      const col = new Float32Array(N * 3);
      for (let i = 0; i < N; i++) {
        // spherical shell at radius 400-600
        const r = 380 + Math.random() * 220;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
        pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
        pos[i*3+2] = r * Math.cos(phi);
        const warm = Math.random();
        col[i*3]   = 0.85 + warm * 0.15;
        col[i*3+1] = 0.82 + warm * 0.12;
        col[i*3+2] = 0.7  + warm * 0.20;
      }
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      g.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const m = new THREE.PointsMaterial({
        size: 2.2,
        sizeAttenuation: true,
        vertexColors: true,
        transparent: true,
        opacity: 1,
        depthWrite: false,
      });
      scene.add(new THREE.Points(g, m));
    })();

    // ─── Central sun ───
    (function makeSun() {
      const sunGeom = new THREE.SphereGeometry(1.4, 48, 48);
      const sunMat = new THREE.MeshBasicMaterial({ color: 0xfff7c4 });
      const sun = new THREE.Mesh(sunGeom, sunMat);
      scene.add(sun);

      // halo sprite — tight + restrained so it doesn't drown the planets
      const haloTex = makeRadialSprite(['#fff7c4', '#ffd93d', '#ff8a3d'], [0.85, 0.35, 0.0]);
      const halo = new THREE.Sprite(new THREE.SpriteMaterial({
        map: haloTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.85,
      }));
      halo.scale.set(5, 5, 1);
      scene.add(halo);

      const haloOuter = new THREE.Sprite(new THREE.SpriteMaterial({
        map: haloTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.18,
      }));
      haloOuter.scale.set(10, 10, 1);
      scene.add(haloOuter);
    })();

    // ─── Helper: radial gradient sprite texture ───
    function makeRadialSprite(stops, alphas) {
      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      stops.forEach((stop, i) => {
        const a = alphas[i] != null ? alphas[i] : (1 - i / stops.length);
        g.addColorStop(i / (stops.length - 1), hexToRgba(stop, a));
      });
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 256, 256);
      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }
    function hexToRgba(hex, a) {
      const h = hex.replace('#', '');
      const r = parseInt(h.slice(0,2), 16);
      const g = parseInt(h.slice(2,4), 16);
      const b = parseInt(h.slice(4,6), 16);
      return `rgba(${r},${g},${b},${a})`;
    }
    function pickAccent(w) {
      // The PLANET BODY color — favor the bright accent so the sphere
      // pops against deep space. Burgundy/iron-gray primaries vanish
      // against the sun bloom.
      const c = w.colors || {};
      return c.accent || c.primary || (w.planet?.ring?.color) || '#FFD93D';
    }
    function pickGlow(w) {
      // The HALO / LABEL color — same accent so the eye binds them.
      const c = w.colors || {};
      return c.accent || c.primary || (w.planet?.ring?.color) || '#FFD93D';
    }

    // ─── Build planets on orbits ───
    const planetRecords = [];
    const N = worlds.length;
    // Spread the planets out — with few worlds, generous spacing reads as
    // a real solar system. With many, the curve compresses naturally.
    const baseRadius = N <= 2 ? 14 : 11;
    const radiusStep = N <= 2 ? 12 : 7.5;
    worlds.forEach((w, i) => {
      const radius = baseRadius + i * radiusStep;
      // Spread initial angles evenly so planets sit on opposite sides
      // of the sun instead of clustering at startup.
      const angle = (i / Math.max(N, 1)) * Math.PI * 2 + Math.PI * 0.25;
      const speed = 0.00045 + (i % 2 === 0 ? 0.00018 : -0.00018) - i * 0.000035;
      const tiltY = (i % 2 === 0 ? 0.05 : -0.08);

      // Orbit ring (line)
      const orbitGeom = new THREE.BufferGeometry();
      const segs = 256;
      const pts = new Float32Array((segs + 1) * 3);
      for (let s = 0; s <= segs; s++) {
        const a = (s / segs) * Math.PI * 2;
        pts[s*3]   = Math.cos(a) * radius;
        pts[s*3+1] = Math.sin(a) * radius * 0.18; // slight ellipse
        pts[s*3+2] = Math.sin(a) * radius;
      }
      orbitGeom.setAttribute('position', new THREE.BufferAttribute(pts, 3));
      const orbitMat = new THREE.LineBasicMaterial({
        color: 0x6b6850,
        transparent: true,
        opacity: 0.22,
      });
      const orbit = new THREE.LineLoop(orbitGeom, orbitMat);
      orbit.rotation.x = tiltY;
      scene.add(orbit);

      // Planet pivot — we rotate this around Y to orbit the sun
      const pivot = new THREE.Object3D();
      pivot.rotation.x = tiltY;
      scene.add(pivot);

      // Planet body
      const accent = pickAccent(w);
      const glow = pickGlow(w);
      const planetSize = 1.4 + Math.min((w.planet?.size || 220) / 220, 1.4) * 0.8;
      const planetGeom = new THREE.SphereGeometry(planetSize, 64, 64);
      let planetMat;
      if (w.planet?.heroImage) {
        // Use the painted hero as the planet's surface texture
        const tex = new THREE.TextureLoader().load(w.planet.heroImage);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        planetMat = new THREE.MeshPhongMaterial({
          map: tex,
          shininess: 18,
          specular: 0x222222,
          emissive: new THREE.Color(accent),
          emissiveIntensity: 0.08,
        });
      } else {
        planetMat = new THREE.MeshPhongMaterial({
          color: new THREE.Color(accent),
          emissive: new THREE.Color(accent),
          emissiveIntensity: 0.22,
          shininess: 40,
          specular: 0x333333,
        });
      }
      const planet = new THREE.Mesh(planetGeom, planetMat);
      // position the planet on its orbit (ellipse in XZ)
      planet.position.set(Math.cos(angle) * radius, Math.sin(angle) * radius * 0.18, Math.sin(angle) * radius);
      // store initial angle on the planet so we can advance it each frame
      planet.userData.angle = angle;
      pivot.add(planet);

      // Atmosphere halo
      const haloTex = makeRadialSprite([glow, glow, '#000000'], [0.85, 0.32, 0.0]);
      const haloSprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: haloTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
      }));
      haloSprite.scale.set(planetSize * 4.5, planetSize * 4.5, 1);
      planet.add(haloSprite);

      // Optional ring (Saturn-style) if world has ring config
      if (w.planet?.ring) {
        const ringInner = planetSize * 1.35;
        const ringOuter = planetSize * 1.95;
        const ringGeom = new THREE.RingGeometry(ringInner, ringOuter, 96);
        const ringMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(w.planet.ring.color),
          side: THREE.DoubleSide,
          transparent: true,
          opacity: (w.planet.ring.opacity ?? 0.7) * 0.7,
          depthWrite: false,
        });
        const ring = new THREE.Mesh(ringGeom, ringMat);
        ring.rotation.x = Math.PI / 2 + ((w.planet.ring.tilt || -16) * Math.PI / 180);
        planet.add(ring);
      }

      // HTML label for this planet
      const label = document.createElement('div');
      label.className = 'planet-label';
      label.style.setProperty('--planet-color', accent);
      label.style.setProperty('--planet-glow', glow);
      label.innerHTML = `
        <span class="label-name">${escHtml(w.shortName || w.name)}</span>
        <span class="label-tagline">${escHtml(w.tagline || '')}</span>
        <div class="label-actions">
          <button class="label-enter" type="button" data-action="enter">enter →</button>
          <button class="label-speaker" type="button" data-action="speak" aria-label="Read this world's name aloud">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 5L6 9H2v6h4l5 4V5z"/>
              <path d="M15.54 8.46a5 5 0 010 7.07"/>
              <path d="M19.07 4.93a10 10 0 010 14.14"/>
            </svg>
          </button>
        </div>
      `;
      labelLayer.appendChild(label);

      label.querySelector('[data-action="enter"]').addEventListener('click', () => enterWorld(w.slug, planet, accent));
      label.querySelector('[data-action="speak"]').addEventListener('click', (e) => {
        e.stopPropagation();
        speakWorld(w, label.querySelector('.label-speaker'));
      });
      label.querySelector('.label-name').addEventListener('click', () => enterWorld(w.slug, planet, accent));

      // Burgundy → tiny amber lamp on the surface that pulses softly
      let burgundyLamp = null;
      if ((w.slug || '').toLowerCase() === 'burgundy') {
        // small emissive sphere parented to the planet, sits on near surface
        const lampGeom = new THREE.SphereGeometry(planetSize * 0.07, 12, 12);
        const lampMat = new THREE.MeshBasicMaterial({ color: 0xE8A248 });
        burgundyLamp = new THREE.Mesh(lampGeom, lampMat);
        // anchor at upper-right of planet (camera side)
        burgundyLamp.position.set(planetSize * 0.72, planetSize * 0.45, planetSize * 0.55);
        planet.add(burgundyLamp);

        // amber point-light radiating from the lamp
        const lampLight = new THREE.PointLight(0xE8A248, 0.9, planetSize * 8);
        lampLight.position.copy(burgundyLamp.position);
        planet.add(lampLight);

        // soft glow sprite
        const lampHaloTex = makeRadialSprite(['#FFD68A', '#E8A248', '#000000'], [0.95, 0.45, 0.0]);
        const lampHalo = new THREE.Sprite(new THREE.SpriteMaterial({
          map: lampHaloTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.85,
        }));
        lampHalo.scale.set(planetSize * 0.85, planetSize * 0.85, 1);
        lampHalo.position.copy(burgundyLamp.position);
        planet.add(lampHalo);

        // store on record for pulse animation
        planet.userData.lamp = { mesh: burgundyLamp, light: lampLight, halo: lampHalo };
      }

      planetRecords.push({
        world: w, planet, pivot, label, speed, baseRadius: radius, accent, glow, tiltY, planetSize,
      });
    });

    function escHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
    }

    // ─── Raycaster for click + hover on planet body ───
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    let hoveredRec = null;
    renderer.domElement.addEventListener('pointerdown', (e) => {
      ndc.x = (e.clientX / innerWidth) * 2 - 1;
      ndc.y = -(e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(ndc, camera);
      const meshes = planetRecords.map(r => r.planet);
      const hits = raycaster.intersectObjects(meshes, false);
      if (hits.length) {
        const hit = hits[0].object;
        const rec = planetRecords.find(r => r.planet === hit);
        if (rec) enterWorld(rec.world.slug, rec.planet, rec.accent);
      }
    });
    renderer.domElement.addEventListener('pointermove', (e) => {
      ndc.x = (e.clientX / innerWidth) * 2 - 1;
      ndc.y = -(e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(ndc, camera);
      const meshes = planetRecords.map(r => r.planet);
      const hits = raycaster.intersectObjects(meshes, false);
      const rec = hits.length ? planetRecords.find(r => r.planet === hits[0].object) : null;
      if (rec !== hoveredRec) {
        if (hoveredRec) hoveredRec.label.classList.remove('hot');
        hoveredRec = rec;
        if (hoveredRec) hoveredRec.label.classList.add('hot');
        renderer.domElement.style.cursor = rec ? 'pointer' : 'default';
      }
    });

    // ─── Project planet positions → screen, position HTML labels ───
    const tmp = new THREE.Vector3();
    function updateLabels() {
      const W = innerWidth, H = innerHeight;
      const camPos = camera.position;
      planetRecords.forEach(rec => {
        rec.planet.getWorldPosition(tmp);
        const dist = tmp.distanceTo(camPos);
        const v = tmp.clone().project(camera);
        const sx = (v.x * 0.5 + 0.5) * W;
        const sy = (-v.y * 0.5 + 0.5) * H;
        // Behind camera or off-screen → hide
        const behind = v.z > 1;
        const off = sx < -200 || sx > W + 200 || sy < -200 || sy > H + 200;
        if (behind || off) {
          rec.label.classList.remove('visible');
          return;
        }
        // Position label just below the planet — clear the sphere by a
        // margin that grows when the planet is close to the camera.
        const planetRadiusPx = (rec.planet.geometry.parameters.radius * (innerHeight / 2)) / (dist * Math.tan(camera.fov * Math.PI / 360));
        const offsetY = Math.max(54, planetRadiusPx + 26);
        rec.label.style.left = sx + 'px';
        rec.label.style.top  = (sy + offsetY) + 'px';
        rec.label.classList.add('visible');
      });
    }

    // ─── Animation loop ───
    let last = performance.now();
    function tick(now) {
      const dt = Math.min(now - last, 50);
      last = now;
      // Advance each planet around its orbit
      const tNow = now * 0.001;
      planetRecords.forEach(rec => {
        const p = rec.planet;
        p.userData.angle += rec.speed * dt;
        const a = p.userData.angle;
        p.position.set(Math.cos(a) * rec.baseRadius, Math.sin(a) * rec.baseRadius * 0.18, Math.sin(a) * rec.baseRadius);
        p.rotation.y += 0.003;
        // hover scale lerp
        const targetScale = (rec === hoveredRec) ? 1.06 : 1.0;
        const cur = p.scale.x;
        const next = cur + (targetScale - cur) * Math.min(dt / 160, 1);
        p.scale.setScalar(next);
        // burgundy lamp pulse (slow breathing)
        if (p.userData.lamp) {
          const pulse = 0.78 + 0.22 * (0.5 + 0.5 * Math.sin(tNow * 1.4));
          p.userData.lamp.light.intensity = 0.5 + pulse * 0.9;
          p.userData.lamp.halo.material.opacity = 0.55 + pulse * 0.35;
          const haloS = rec.planetSize * (0.78 + pulse * 0.22);
          p.userData.lamp.halo.scale.set(haloS, haloS, 1);
        }
      });
      controls.update();
      renderer.render(scene, camera);
      updateLabels();
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // ─── Resize ───
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ─── Enter-world transition ───
    function enterWorld(slug, planetMesh, accentHex) {
      if (window.__qssZooming) return;
      window.__qssZooming = true;
      window.QSSWorlds.setActive(slug);
      document.body.classList.add('zooming');
      controls.autoRotate = false;

      // Tween camera toward the planet
      const target = new THREE.Vector3();
      planetMesh.getWorldPosition(target);
      const start = camera.position.clone();
      const startTarget = controls.target.clone();
      const tweenStart = performance.now();
      const DUR = 900;

      function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
      function tween(now) {
        const t = Math.min((now - tweenStart) / DUR, 1);
        const e = easeOutCubic(t);
        // approach to within 0.4 units of the planet
        const dir = target.clone().sub(start).normalize();
        const finalPos = target.clone().sub(dir.multiplyScalar(0.6));
        camera.position.lerpVectors(start, finalPos, e);
        controls.target.lerpVectors(startTarget, target, e);
        if (t < 1) requestAnimationFrame(tween);
      }
      requestAnimationFrame(tween);

      // Fire the white wash halfway through
      setTimeout(() => warp.classList.add('fire'), 350);

      // Redirect once the wash hits full white
      setTimeout(() => {
        const href = window.QSSWorlds?.libraryHref(slug) || `/universe/${slug}/`;
        if (typeof document.startViewTransition === 'function') {
          document.startViewTransition(() => { location.href = href; });
        } else {
          location.href = href;
        }
      }, 1280);
    }

    // ─── Speak a world's name + tagline (existing /api/qss-tts) ───
    let activeSpeakerBtn = null;
    let activeAudio = null;
    function stopSpeaker() {
      if (activeAudio) { try { activeAudio.pause(); activeAudio.src = ''; } catch {} activeAudio = null; }
      if (activeSpeakerBtn) { activeSpeakerBtn.classList.remove('playing'); activeSpeakerBtn = null; }
      try { window.speechSynthesis?.cancel(); } catch {}
    }
    async function speakWorld(world, btn) {
      if (activeSpeakerBtn === btn) { stopSpeaker(); return; }
      stopSpeaker();
      activeSpeakerBtn = btn;
      btn.classList.add('playing');
      const text = `${world.shortName || world.name}. ${world.tagline || ''}`;
      try {
        const r = await fetch('/api/qss-tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, voice: 'matilda', speed: 'fast' }),
        });
        if (!r.ok) throw new Error('tts ' + r.status);
        const blob = await r.blob();
        const audio = new Audio(URL.createObjectURL(blob));
        activeAudio = audio;
        audio.addEventListener('ended', () => { if (activeSpeakerBtn === btn) stopSpeaker(); });
        audio.addEventListener('error', () => { if (activeSpeakerBtn === btn) stopSpeaker(); });
        await audio.play().catch(() => stopSpeaker());
      } catch {
        try {
          const u = new SpeechSynthesisUtterance(text);
          u.rate = 0.95; u.pitch = 1.05;
          u.onend = () => { if (activeSpeakerBtn === btn) stopSpeaker(); };
          u.onerror = () => { if (activeSpeakerBtn === btn) stopSpeaker(); };
          window.speechSynthesis?.speak(u);
        } catch { stopSpeaker(); }
      }
    }
    document.addEventListener('visibilitychange', () => { if (document.hidden) stopSpeaker(); });

    // ─── Drop the loader once the first frame is on screen ───
    requestAnimationFrame(() => {
      setTimeout(() => loader.classList.add('gone'), 380);
    });
  })();
  </script>
</body>
</html>
