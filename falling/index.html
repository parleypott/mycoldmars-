function row(cls, text, tone) {
  const d = document.createElement("div");

  return d;
}

/* ── content emitters: each returns an array of row elements ── */

function emitLogs() {
  const out = [];
  const n = rint(6, 14);
  for (let i = 0; i < n; i++) {
    const h = padL(rint(0,23),2), m = padL(rint(0,59),2), s = padL(rint(0,59),2);
    const ms = padL(rint(0,999),3);
    const svc = pick(SERVICES);
    const lvCh = pick(["I","I","I","I","D","D","W","E"]);
    const lv = lvCh === "I" ? "INFO " : lvCh === "D" ? "DEBUG" : lvCh === "W" ? "WARN " : "ERROR";
    const msg = pick(LOG_MSGS);
    const tone = lvCh === "E" || lvCh === "W" ? "lit" : "dim";
    out.push(row("log", `[${h}:${m}:${s}.${ms}] ${lv} ${svc.padEnd(13," ")} ${msg}`, tone));
  }
  return out;
}

function emitHex() {
  const out = [];
  const n = rint(4, 10);
  for (let i = 0; i < n; i++) {
    const addr = (rint(0,0xFFFFFF)).toString(16).padStart(6,"0").toUpperCase();
    const bytes = Array.from({length: 16}, hexB);
    const ascii = bytes.map(b => {
      const v = parseInt(b,16);
      return (v >= 32 && v < 127) ? String.fromCharCode(v) : ".";
    }).join("");
    const left = bytes.slice(0,8).join(" ");
    const right = bytes.slice(8).join(" ");
    out.push(row("hex", `${addr}  ${left}  ${right}  ${ascii}`, i % 3 === 0 ? "lit" : "dim"));
  }
  return out;
}

    const own = pick(OWNERS);
    const sz = String(rint(1, 99999)).padStart(6," ");
    const dt = `2026-${padL(rint(1,12),2)}-${padL(rint(1,28),2)} ${padL(rint(0,23),2)}:${padL(rint(0,59),2)}`;
    const nm = pick(FILENAMES);
    out.push(row("ls", `${perm}  ${own.padEnd(7," ")} ${sz}  ${dt}  ${nm}`, i % 4 === 0 ? "lit" : "dim"));
  }
  return out;
}

function emitSession() {
  const out = [];
  const session = pick(SESSIONS);
  out.push(gap("gap-s"));
  for (let i = 0; i < session.length; i++) {
    const line = session[i];
    const isPrompt = line.startsWith("$") || line.startsWith("^") || line.startsWith("[sudo]");
    out.push(row("cmd", line, isPrompt ? "lit" : "dim"));
  }
  out.push(gap("gap-s"));
  return out;
}

function emitPoem() {
  const p = pick(POEMS);
  const out = [];
  out.push(gap("gap-m"));
  const head = document.createElement("div");
  head.className = "row poem lit";
  head.innerHTML = `<span class="ttl dim">${p.t}</span>` + p.L.join("<br>");
  out.push(head);
  out.push(gap("gap-m"));
  return out;
}

function emitAscii() {
  const out = [];
  const a = pick(ASCII);
  out.push(gap("gap-s"));
  const lines = a.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const tone = i % 5 === 0 ? "lit" : "dim";
    const r = document.createElement("div");
    r.className = "row ascii " + tone;
    r.textContent = lines[i] || " ";
    out.push(r);
  }
  out.push(gap("gap-s"));
  return out;
}

function emitCss()  {
  const out = [];
  out.push(gap("gap-s"));
  const body = pick(CSS_BLOCKS);
  const lines = body.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const isCommentOrSelector = lines[i].trim().startsWith("/*") || lines[i].includes("{");
    const tone = isCommentOrSelector ? "lit" : "dim";
    out.push(row("css", lines[i] || " ", tone));
  }
  out.push(gap("gap-s"));
  return out;
}
function emitJs()   {
  const out = [];
  out.push(gap("gap-s"));
  const body = pick(JS_BLOCKS);
  const lines = body.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const tone = lines[i].trim().startsWith("//") ? "dim" : "lit";
    out.push(row("js", lines[i] || " ", tone));
  }
  out.push(gap("gap-s"));
  return out;
}
function emitHtml() {
  const out = [];
  out.push(gap("gap-s"));
  const body = pick(HTML_BLOCKS);
  const lines = body.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const tone = lines[i].trim().startsWith("<!--") ? "dim" : "lit";
    out.push(row("html", lines[i] || " ", tone));
  }
  out.push(gap("gap-s"));
  return out;
}

function emitJoke() {
  const out = [];
  const j = pick(JOKES);
  out.push(gap("gap-s"));
  out.push(row("joke", j.s, "dim"));
  out.push(row("joke", "    " + j.p, "lit"));
  out.push(gap("gap-s"));
  return out;
}

function emitOne() {
  return [gap("gap-s"), row("one", pick(ONES), "lit"), gap("gap-s")];
}

function emitBig() {
  return [gap("gap-m"), row("big", pick(BIG_WORDS), "lit"), gap("gap-s")];
}

function emitMarquee() {
  return [gap("gap-s"), row("marquee", pick(MARQ), "lit"), gap("gap-s")];
}

function emitStatic() {
  return [gap("gap-s"), row("static", pick(STATIC_CHARS), "dim")];
}

function emitStat() {
  const out = [];
  out.push(gap("gap-s"));
  out.push(row("rule", "-".repeat(60), "dim"));
  const n = rint(3, 6);
  for (let i = 0; i < n; i++) {
    const [k, fn] = pick(STAT_KEYS);
    out.push(row("stat", `${k.padEnd(10," ")}  ${fn()}`, i % 2 === 0 ? "lit" : "dim"));
  }
  out.push(row("rule", "-".repeat(60), "dim"));
  return out;
}

/* ── weighted dispatcher ── */
const MAKERS = [
  [emitLogs,    8],
  [emitHex,     5],
  [emitLs,      4],
  [emitSession, 5],
  [emitAscii,   4],
  [emitPoem,    5],
  [emitCss,     3],
  [emitJs,      3],
  [emitHtml,    2],
  [emitJoke,    3],
  [emitOne,     5],
  [emitBig,     2],
  [emitMarquee, 2],
  [emitStatic,  5],
  [emitStat,    3],
];
const WEIGHTS = (() => {
  const out = [];
  for (const [fn, w] of MAKERS) for (let i = 0; i < w; i++) out.push(fn);
  return out;
})();
const pickMaker = () => pick(WEIGHTS);

/* ── build a section: ONE palette, many rows, no fancy stuff ── */
function buildSection(palette) {
  const sec = document.createElement("section");
  sec.className = "section " + palette.cls;

  // section label, dim
  const label = document.createElement("div");
  label.className = "row sec-label dim";
  label.textContent = palette.label;
  sec.appendChild(label);

  // 6-10 emitters per section
  const blockCount = rint(6, 10);
  for (let i = 0; i < blockCount; i++) {
    const rows = pickMaker()();
    for (const r of rows) sec.appendChild(r);
  }

  return sec;
}

/* ── build the stream ── */
const stream = document.getElementById("stream");

// shuffle palette order each visit so it's not always the same sequence
const order = [...PALETTES].sort(() => Math.random() - 0.5);

// build enough sections to fill many screens; loop palette order
const SECTION_COUNT = 36;
for (let i = 0; i < SECTION_COUNT; i++) {
  stream.appendChild(buildSection(order[i % order.length]));
}
</script>
