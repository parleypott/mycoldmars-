<span class="tag">&lt;meta</span> <span class="att">name</span>=<span class="val">"weather"</span> <span class="att">content</span>=<span class="val">"the kind you'd describe to a friend"</span><span class="tag">&gt;</span>
<span class="tag">&lt;meta</span> <span class="att">name</span>=<span class="val">"channel"</span> <span class="att">content</span>=<span class="val">"037 / mycoldmars"</span><span class="tag">&gt;</span>`,

/* ── log line generators ────────────────────────────────────── */
const SERVICES = ["kernel","systemd","dreamd","mycoldmars","heartbeat","poetryd","cron","render","gpu","wifi","ssh","launchd","cosmic-bus"];
const LOG_MSGS = [
  "rotating buffer", "establishing tunnel to 127.0.0.1", "color cycle complete",
  "memory pressure: warm", "vector store flushed", "dream cache invalidated",
  "session restored", "no new mail", "still here", "rolling logs",
  "subscriber awoke", "subscriber dozed", "phosphor warm", "channel 037 stable",
  "tide receded", "tide returned", "moon: 73%", "uptime 9999 days",
  "queued: 1 unsent letter", "compaction successful", "soft warnings tolerated",
  "fan curve gentle", "battery polite", "you remembered the thing",
  "you forgot the thing — that's ok", "tab count: yes",
];

function logRow() {
  const h = padL(rint(0,23),2), m = padL(rint(0,59),2), s = padL(rint(0,59),2);
  const ms = padL(rint(0,999),3);
  const svc = pick(SERVICES);
  const lvCh = pick(["I","I","I","I","D","D","W","E"]);
  const lv = lvCh === "I" ? "INFO " : lvCh === "D" ? "DEBUG" : lvCh === "W" ? "WARN " : "ERROR";
  const msg = pick(LOG_MSGS);
  const div = document.createElement("div");
  div.className = "row log";
  div.innerHTML = `<span class="ts">[${h}:${m}:${s}.${ms}]</span> <span class="lv lv-${lvCh}">${lv}</span> ${svc.padEnd(13," ")} ${msg}`;
  return div;
}

function hexRow() {
  const addr = (rint(0,0xFFFFFF)).toString(16).padStart(6,"0").toUpperCase();
  const bytes = Array.from({length: 16}, hexB);
  const ascii = bytes.map(b => {
    const v = parseInt(b,16);
    return (v >= 32 && v < 127) ? String.fromCharCode(v) : ".";
  }).join("");
  const left = bytes.slice(0,8).join(" ");
  const right = bytes.slice(8).join(" ");
  const div = document.createElement("div");
  div.className = "row hex";
  div.innerHTML = `<span class="a">${addr}</span>  <span class="b">${left}</span>  <span class="b">${right}</span>  <span class="c">${ascii}</span>`;
  return div;
}

const FILENAMES = [
  "manifesto.txt", "rain.wav", "01_voicememo.m4a", "sketch.psd", "letter.draft",
  "color-grade.lut", "shotlist.md", "thumbs.db", "backup.tar.gz", ".DS_Store",
  "field-notes.txt", "untitled-final-FINAL.mov", "song-i-didnt-write.midi",
  "dream-027.log", "remember-this.txt", "no.rtf", "yes.rtf", "maybe.rtf",
];
const OWNERS = ["johnny","root","nobody","ghost","muse","cat"];
function lsRow() {
  const perm = "-rw-r--r--";
  const own = pick(OWNERS);
  const sz = String(rint(1, 99999)).padStart(6," ");
  const dt = `2026-${padL(rint(1,12),2)}-${padL(rint(1,28),2)} ${padL(rint(0,23),2)}:${padL(rint(0,59),2)}`;
  const nm = pick(FILENAMES);
  const div = document.createElement("div");
  div.className = "row ls";
  div.innerHTML = `<span class="perm">${perm}</span>  <span class="own">${own.padEnd(7," ")}</span> <span class="sz">${sz}</span>  <span class="dt">${dt}</span>  <span class="nm">${nm}</span>`;
  return div;
}

/* ── static bars (full-width single line of repeating chars) ── */
const STATIC_CHARS = [
  "▒░▒░▒░▒░▒░▒░▒░▒░▒░▒░▒░▒░▒░▒░▒░▒░▒░▒░▒░▒░▒░▒░▒░▒░▒░▒░▒░▒░▒░▒░",
  "·.·.·.·.·.·.·.·.·.·.·.·.·.·.·.·.·.·.·.·.·.·.·.·.·.·.·.·.·.·.·.·.·.·.·.·",
  "▓▒░  ░▒▓▓▒░  ░▒▓▓▒░  ░▒▓▓▒░  ░▒▓▓▒░  ░▒▓▓▒░  ░▒▓▓▒░  ░▒▓▓▒░  ░▒▓",
  "=================================== signal warm ===================================",
  "└─┴─┴─┴─┴─┴─┴─┴─┴─┴─┴─┴─┴─┴─┴─┴─┴─┴─┴─┴─┴─┴─┴─┴─┴─┴─┴─┴─┴─┴─┴─┴─┘",
  "♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥",
  "★    ☆    ★    ☆    ★    ☆    ★    ☆    ★    ☆    ★    ☆    ★    ☆    ★",
  "──────── you are still falling ──────── you are still falling ────────",
  "······ the page does not end ······ the page does not end ······",
  "////////////////////  warm static  ////////////////////  warm static  ////////",
  ">>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>",
];

const STAT_KEYS = [
  ["uptime", () => `${rint(1,9999)} days, ${padL(rint(0,23),2)}:${padL(rint(0,59),2)}`],
  ["load",   () => `${(Math.random()*0.8+0.05).toFixed(2)}, ${(Math.random()*0.8+0.05).toFixed(2)}, ${(Math.random()*0.8+0.05).toFixed(2)}`],
  ["mem",    () => `${rint(1,32)}.${rint(0,9)} GiB / 64 GiB`],
  ["temp",   () => `${rint(31,72)}°C`],
  ["mood",   () => pick(["warm static","hopeful","cold-but-ok","fine, actually","quietly optimistic","tea-deficient"])],
  ["channel",() => `037 / mycoldmars / ${pick(["clear","drifting","stable","romantic"])}`],
  ["pwd",    () => pick(["/dreams","/feelings","/var/log/heart","/usr/local/whitman","~/falling"])],
  ["whoami", () => pick(["johnny","nobody","still figuring it out","both"])],
];
function statBlock() {
  const wrap = document.createDocumentFragment();
  const n = rint(3, 6);
  for (let i=0; i<n; i++) {
    const [k, fn] = pick(STAT_KEYS);
    const div = document.createElement("div");
    div.className = "row stat";
    div.innerHTML = `<span class="k">${k.padEnd(10," ")}</span>  <span class="v">${fn()}</span>`;
    wrap.appendChild(div);
  }
  return wrap;
}

/* ── builders that emit a sequence of rows ──────────────────── */
function frag() { return document.createDocumentFragment(); }
function gap(cls) { const d = document.createElement("div"); d.className = "row " + cls; return d; }
function rule(char = "─", width = 70) {
  const d = document.createElement("div");
  d.className = "row rule";
  d.textContent = char.repeat(width);
  return d;
}

/* poems */
function blockPoem() {
  const p = pick(POEMS);
  const f = frag();
  f.appendChild(gap("gap-s"));
  const head = document.createElement("div");
  head.className = "row poem";
  head.innerHTML = `<span class="ttl">${p.t}</span>` + p.L.join("<br>");
  f.appendChild(head);
  f.appendChild(gap("gap-s"));
  return f;
}

/* ascii */
const ASCII_COLORS = ["", "pink", "cyan", "amber", "purple"];
function blockAscii() {
  const a = pick(ASCII);
  const c = pick(ASCII_COLORS);
  const f = frag();
  f.appendChild(gap("gap-s"));
  const lines = a.split("\n");
  for (const ln of lines) {
    const r = document.createElement("div");
    r.className = "row ascii " + c;
    r.textContent = ln || " ";
    f.appendChild(r);
  }
  f.appendChild(gap("gap-s"));
  return f;
}

/* multi-line code blocks rendered as one .row (preserves spaces) */
function blockCode(cls, body) {
  const f = frag();
  f.appendChild(gap("gap-s"));
  const lines = body.split("\n");
  for (const ln of lines) {
    const r = document.createElement("div");
    r.className = "row " + cls;
    r.innerHTML = ln === "" ? "&nbsp;" : ln;
    f.appendChild(r);
  }
  f.appendChild(gap("gap-s"));
  return f;
}
function blockCss()  { return blockCode("css",  pick(CSS_BLOCKS));  }
function blockJs()   { return blockCode("js",   pick(JS_BLOCKS));   }
function blockHtml() { return blockCode("html", pick(HTML_BLOCKS)); }

/* jokes */
function blockJoke() {
  const j = pick(JOKES);
  const f = frag();
  f.appendChild(gap("gap-s"));
  const a = document.createElement("div");
  a.className = "row joke";
  a.innerHTML = `<span class="setup">${j.s}</span>  <span class="punch">${j.p}</span>`;
  f.appendChild(a);
  return f;
}

/* one-liner */
function blockOne() {
  const f = frag();
  f.appendChild(gap("gap-s"));
  const a = document.createElement("div");
  a.className = "row one";
  a.textContent = pick(ONES);
  f.appendChild(a);
  return f;
}

/* big word */
const BIG_WORDS = ["FALL","DEEPER","STILL","HERE","SOFT","WARM","HOLD","MORE","OK","QUIET","BREATHE","AGAIN"];
const BIG_COLORS = ["","r","y","p","c","o"];
function blockBig() {
  const f = frag();
  f.appendChild(gap("gap-m"));
  const a = document.createElement("div");
  a.className = "row big " + pick(BIG_COLORS);
  a.textContent = pick(BIG_WORDS);

}

/* gradient logo */

function blockGradient() {

  const a = document.createElement("div");
  a.className = "row gradient";

  f.appendChild(a);
  f.appendChild(gap("gap-s"));

/* marquee */
const MARQ = [
  "this is not loading. this is the page.",
  "scroll? no. the page is the scroll.",
  "everything you've ever lost is still in motion.",
  "channel 037 is open. you are the only listener.",
  "the cursor is a small friend. don't be too hard on it.",
];
function blockMarquee() {
  const f = frag();
  f.appendChild(gap("gap-s"));
  const a = document.createElement("div");
  a.className = "row marquee " + pick(["","pink","cyan","amber","purple"]);
  a.textContent = pick(MARQ);
  f.appendChild(a);
  f.appendChild(gap("gap-s"));
  return f;
}

/* command session */
function blockSession() {
  const session = pick(SESSIONS);
  const f = frag();
  f.appendChild(gap("gap-s"));
  for (const [text, type] of session) {
    const r = document.createElement("div");
    r.className = "row cmd";
    if (type === "p") r.innerHTML = `<span class="p">${text}</span>`;
    else              r.innerHTML = `<span class="o">${text}</span>`;
    f.appendChild(r);
  }
  f.appendChild(gap("gap-s"));
  return f;
}

/* runs of log lines */
function blockLogs() {
  const f = frag();
  f.appendChild(gap("gap-s"));
  const n = rint(5, 14);
  for (let i=0; i<n; i++) f.appendChild(logRow());
  f.appendChild(gap("gap-s"));
  return f;
}

/* runs of hex */
function blockHex() {
  const f = frag();
  f.appendChild(gap("gap-s"));
  const n = rint(4, 10);
  for (let i=0; i<n; i++) f.appendChild(hexRow());
  f.appendChild(gap("gap-s"));
  return f;
}

/* runs of ls */
function blockLs() {
  const f = frag();
  f.appendChild(gap("gap-s"));
  const n = rint(4, 9);
  for (let i=0; i<n; i++) f.appendChild(lsRow());
  f.appendChild(gap("gap-s"));
  return f;
}

/* static bar */
function blockStatic() {
  const f = frag();
  f.appendChild(gap("gap-s"));
  const a = document.createElement("div");
  a.className = "row static " + pick(["", "pink", "cyan", "amber", "purple"]);
  a.textContent = pick(STATIC_CHARS);
  f.appendChild(a);
  return f;
}

/* stat dump */
function blockStat() {
  const f = frag();
  f.appendChild(gap("gap-s"));
  f.appendChild(rule("─", 60));
  f.appendChild(statBlock());
  f.appendChild(rule("─", 60));
  return f;
}

/* ── weighted dispatcher ────────────────────────────────────── */
const MAKERS = [
  [blockLogs,    8],
  [blockHex,     5],
  [blockLs,      4],
  [blockSession, 5],
  [blockAscii,   4],
  [blockPoem,    5],
  [blockCss,     4],
  [blockJs,      4],
  [blockHtml,    3],
  [blockJoke,    3],
  [blockOne,     5],
  [blockBig,     3],
  [blockGradient,2],
  [blockMarquee, 2],
  [blockStatic,  6],
  [blockStat,    3],
];
const WEIGHTS = (() => {
  const out = [];
  for (const [fn, w] of MAKERS) for (let i=0; i<w; i++) out.push(fn);
  return out;
})();
const pickMaker = () => pick(WEIGHTS);

/* ── build the stream ───────────────────────────────────────── */
const stream = document.getElementById("stream");
const BUILD_COUNT = 500;  // a LOT of rows for density
for (let i = 0; i < BUILD_COUNT; i++) {
  stream.appendChild(pickMaker()());
}

/* swap recycled blocks every so often so the loop varies */
setInterval(() => {
  const children = stream.children;
  if (!children.length) return;
  const idx = rint(0, children.length - 1);
  const r = children[idx].getBoundingClientRect();
  if (r.bottom < -200) {
    children[idx].remove();
    stream.appendChild(pickMaker()());
  }
}, 300);

/* slight per-visit hue jitter for variety */
const hue = rint(-12, 12);
document.documentElement.style.setProperty("filter", `hue-rotate(${hue}deg)`);
