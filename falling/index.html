    height: 100vh;
    width: 100vw;
    cursor: none;

  .vignette {
    position: fixed; inset: 0;
    background: var(--vignette);
    pointer-events: none;
    z-index: 10;
  }
  .scanlines {
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(255,255,255,0.018) 2px,
      rgba(255,255,255,0.018) 3px

    pointer-events: none;
    z-index: 11;
    mix-blend-mode: overlay;
  }
  .glow {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 9;
    background: radial-gradient(circle at 50% 50%, rgba(40,255,180,0.04), transparent 60%);
    animation: glowshift 24s ease-in-out infinite;
  }
  @keyframes glowshift {
    0%   { background: radial-gradient(circle at 30% 80%, rgba(80,255,180,0.06), transparent 65%); }
    20%  { background: radial-gradient(circle at 70% 30%, rgba(255,80,200,0.06), transparent 65%); }
    40%  { background: radial-gradient(circle at 20% 20%, rgba(255,200,40,0.06), transparent 65%); }
    60%  { background: radial-gradient(circle at 80% 70%, rgba(80,160,255,0.06), transparent 65%); }
    80%  { background: radial-gradient(circle at 50% 50%, rgba(255,120,80,0.06), transparent 65%); }
    100% { background: radial-gradient(circle at 30% 80%, rgba(80,255,180,0.06), transparent 65%); }
  }

  #stream {
    position: absolute;
    left: 0; right: 0;
    bottom: -200vh;
    padding: 0 6vw;
    will-change: transform;
    animation: fall 240s linear infinite;
  }
  @keyframes fall {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(0, -1000vh, 0); }
  }

  .block {
    margin: 4em 0;
    white-space: pre-wrap;
    word-break: break-word;
    filter: drop-shadow(0 0 6px currentColor);
    animation: hue 40s linear infinite;
  }
  @keyframes hue {
    0%   { filter: drop-shadow(0 0 6px currentColor) hue-rotate(0deg); }
    100% { filter: drop-shadow(0 0 6px currentColor) hue-rotate(360deg); }
  }

  .poem      { color: #f3eac2; font-size: 18px; line-height: 1.7; font-style: italic; letter-spacing: 0.02em; text-align: center; max-width: 32em; margin-left: auto; margin-right: auto; }

  .css .prop { color: #8be9fd; }

  .big       { color: #ffe66d; font-size: 64px; text-align: center; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  .terminal  { color: #7fffaa; font-size: 13px; background: rgba(0,40,30,0.4); padding: 1em 1.4em; border-left: 3px solid #7fffaa; max-width: 44em; margin: 0 auto; }

  .gradient  { font-size: 80px; font-weight: 900; text-align: center; letter-spacing: -0.04em; line-height: 0.95;

  .block:nth-child(3n+1) { animation-delay: -22s; }
  .block:nth-child(3n+2) { animation-delay: -35s; }

  /* mobile */
  @media (max-width: 700px) {
    body { font-size: 12px; }
    #stream { padding: 0 4vw; }
    .poem { font-size: 15px; }
    .big { font-size: 38px; }

  @media (prefers-reduced-motion: reduce) {

    .block { animation: none; }
  }

const GRADIENTS = ["m y c o l d  m a r s", "F A L L I N G", "ENDLESS", "still here", "•   •   •"];

/* ---------------- builders ---------------- */

const $ = (sel) => document.querySelector(sel);
const stream = $("#stream");

const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function makePoem() {
  const p = pick(POEMS);
  const el = document.createElement("div");
  el.className = "block poem";
  el.innerHTML = `<span class="title">${p.t}</span>${p.lines.join("<br>")}`;
  return el;
}
function makeCss() {
  const el = document.createElement("pre");
  el.className = "block css";
  el.innerHTML = pick(CSS_BLOCKS);

}
function makeJs() {

const MAKERS = [
  makePoem, makePoem, makePoem,        // poetry weighted heavier
  makeCss, makeCss,
  makeJs, makeJs,
  makeHtml,
  makeAscii, makeAscii,
  makeJoke,
  makeOne, makeOne,
  makeBig,
  makeGradient,
  makeMarquee,
  makeTerminal,
  makeListing,
  makeSignpost,
  makeQuiet,
];

/* ---------------- the stream ---------------- */

const TOTAL_BLOCKS = 240; // enough to fill the loop without being thin
const blocks = [];

function spawn() {
  const fn = pick(MAKERS);
  const el = fn();
  // assign a random hue rotation start so colors aren't all in phase
  const delay = -Math.floor(Math.random() * 40);
  el.style.animationDelay = `${delay}s`;
  return el;
}

for (let i = 0; i < TOTAL_BLOCKS; i++) {
  const el = spawn();
  blocks.push(el);
  stream.appendChild(el);
}

/* periodically swap a block out for a new one so the loop never feels identical */
setInterval(() => {
  const idx = Math.floor(Math.random() * blocks.length);
  // only swap blocks that are above the viewport (already scrolled past)
  const r = blocks[idx].getBoundingClientRect();
  if (r.bottom < 0) {
    const nv = spawn();
    stream.replaceChild(nv, blocks[idx]);
    blocks[idx] = nv;
  }
}, 800);

/* a soft on-load color jitter so each visit is its own thing */
const baseHue = Math.floor(Math.random() * 360);
document.documentElement.style.setProperty("filter", `hue-rotate(${baseHue}deg)`);
