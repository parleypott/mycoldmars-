<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>falling · mycoldmars</title>
<style>
  :root {
    --bg: #000;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "IBM Plex Mono", "Fira Code", Menlo, Consolas, monospace;

    /* neon palette — flat HSL, no glow */
    --g1: #00ff6a;   /* primary neon green */
    --g2: #a6ff00;   /* acid lime */
    --g3: #00ffb3;   /* mint neon */
    --g4: #00b347;   /* deep green */
    --g5: #006a2e;   /* dim moss */
    --g6: #003a18;   /* near-black green */
    --g7: #e6ffd0;   /* near-white green */
    --rd: #ff1f3d;   /* neon red */
    --rs: #ff4775;   /* radish */
    --rh: #b0001d;   /* dark radish */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.22;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    cursor: default;
    color: var(--g4);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: geometricPrecision;
  }

  /* banana layer — flying yellow ASCII bananas across the whole page */
  .banana {
    position: fixed;
    font-family: var(--mono);
    white-space: pre;
    line-height: 1;
    z-index: 10;
    pointer-events: none;
    color: #ffd726;
    font-weight: 700;
    will-change: transform;
  }
  .banana.bright { color: #fff04d; }
  .banana.deep   { color: #c89400; }
  .banana.tiny   { font-size: 18px; }
  .banana.mid    { font-size: 26px; }
  .banana.huge   { font-size: 42px; }

  @keyframes fly-right {
    from { transform: translate3d(-30vw, 0, 0) rotate(var(--rot, 0deg)); }
    to   { transform: translate3d(130vw, 0, 0) rotate(var(--rot, 0deg)); }
  }
  @keyframes fly-left {
    from { transform: translate3d(130vw, 0, 0) rotate(var(--rot, 0deg)); }
    to   { transform: translate3d(-30vw, 0, 0) rotate(var(--rot, 0deg)); }
  }

  /* THREE columns of waterfall, each scrolls at a slightly different rate
     so the screen feels like layered streams, not one stream */
  .col {
    position: absolute;
    top: 0;
    width: 33.33vw;
    height: 100vh;
    overflow: hidden;
    border-right: 1px solid #061a0e;
  }
  .col:nth-child(1) { left: 0;       }
  .col:nth-child(2) { left: 33.33vw; }
  .col:nth-child(3) { left: 66.66vw; border-right: none; }

  .stream {
    position: absolute;
    left: 0; right: 0;
    bottom: -200vh;
    padding: 0 10px;
    will-change: transform;
  }

  /* jittery stutter scroll via steps() — feels like terminal repaint */
  .stream-a { animation: fall 180s steps(540) infinite; }
  .stream-b { animation: fall 150s steps(620) infinite; }
  .stream-c { animation: fall 220s steps(480) infinite; }
  @keyframes fall {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(0, -900vh, 0); }
  }

  /* mobile: collapse to one column */
  @media (max-width: 700px) {
    .col { width: 100vw; left: 0 !important; border-right: none; }
    .col:nth-child(2), .col:nth-child(3) { display: none; }
  }

  /* row baseline */
  .row {
    white-space: pre;
    overflow: hidden;
    color: var(--g4);
    padding: 0;
  }
  .row + .row { margin-top: 0; }

  /* color tones — picked at random per row, weighted to greens */
  .t-g1 { color: var(--g1); }   /* primary neon */
  .t-g2 { color: var(--g2); }   /* lime */
  .t-g3 { color: var(--g3); }   /* mint */
  .t-g4 { color: var(--g4); }   /* deep green */
  .t-g5 { color: var(--g5); }   /* dim moss */
  .t-g6 { color: var(--g6); }   /* near-black */
  .t-g7 { color: var(--g7); }   /* near white */
  .t-rd { color: var(--rd); }   /* red accent */
  .t-rs { color: var(--rs); }   /* radish accent */
  .t-rh { color: var(--rh); }   /* dark radish */

  /* size variants — chaotic, bumped up ~20% */
  .sz-9  { font-size: 11px; line-height: 1.1;  }
  .sz-10 { font-size: 12px; line-height: 1.15; }
  .sz-11 { font-size: 13px; line-height: 1.22; }
  .sz-12 { font-size: 15px; line-height: 1.25; }
  .sz-13 { font-size: 17px; line-height: 1.25; }
  .sz-15 { font-size: 19px; line-height: 1.18; }
  .sz-22 { font-size: 28px; line-height: 1.05; font-weight: 800; letter-spacing: 0.04em; }
  .sz-34 { font-size: 44px; line-height: 1.0;  font-weight: 900; letter-spacing: -0.02em; }

  /* the burst flash: a chunk of new rows appended at the bottom of a stream
     gets briefly slammed with .burst — pure color swap, no animation/transition */
  .burst { color: var(--g7); }
</style>
</head>
<body>
  <div class="col"><div class="stream stream-a" id="s1"></div></div>
  <div class="col"><div class="stream stream-b" id="s2"></div></div>
  <div class="col"><div class="stream stream-c" id="s3"></div></div>
  <div id="banana-layer"></div>

<script>
/* ============================================================
   F A L L I N G  —  dense neon waterfall, jittery, chaotic
   ============================================================ */

const pick = a => a[Math.floor(Math.random() * a.length)];
const rint = (lo, hi) => Math.floor(Math.random() * (hi - lo + 1)) + lo;
const padL = (s, n) => String(s).padStart(n, "0");
const hex  = (n, w=2) => n.toString(16).toUpperCase().padStart(w, "0");
const hexB = () => hex(rint(0, 255));

/* tone picker — heavy greens, occasional red/radish */
const TONES = [
  "t-g4","t-g4","t-g4","t-g4","t-g4","t-g4","t-g4",  // baseline moss
  "t-g1","t-g1","t-g1","t-g1","t-g1","t-g1",          // neon green
  "t-g2","t-g2","t-g2",                                // lime
  "t-g3","t-g3",                                       // mint
  "t-g5","t-g5","t-g5","t-g5",                         // dim
  "t-g6","t-g6",                                       // near-black
  "t-g7",                                              // bright white-green
  "t-rd","t-rs","t-rh",                                // red/radish rare
];
const tone = () => pick(TONES);

const SIZES = [
  "sz-11","sz-11","sz-11","sz-11","sz-11","sz-11",
  "sz-10","sz-10","sz-10",
  "sz-12","sz-12",
  "sz-9","sz-9",
  "sz-13",
  "sz-15",
];
const sizeNorm = () => pick(SIZES);

/* ── content sources ───────────────────────────────────────── */

const POEMS = [

   "AND WHAT I ASSUME YOU SHALL ASSUME,",
   "FOR EVERY ATOM BELONGING TO ME AS GOOD BELONGS TO YOU."],
  ["I BEQUEATH MYSELF TO THE DIRT TO GROW FROM THE GRASS I LOVE,",
   "IF YOU WANT ME AGAIN LOOK FOR ME UNDER YOUR BOOT-SOLES."],
  ["DO I CONTRADICT MYSELF?",
   "VERY WELL THEN I CONTRADICT MYSELF,",
   "(I AM LARGE, I CONTAIN MULTITUDES.)"],
  ["AFOOT AND LIGHT-HEARTED I TAKE TO THE OPEN ROAD,",
   "HEALTHY, FREE, THE WORLD BEFORE ME."],
  ["A NOISELESS PATIENT SPIDER,",
   "I MARK'D WHERE ON A LITTLE PROMONTORY IT STOOD ISOLATED."],
  ["THAT YOU ARE HERE — THAT LIFE EXISTS AND IDENTITY,",
   "THAT THE POWERFUL PLAY GOES ON,",
   "AND YOU MAY CONTRIBUTE A VERSE."],
];

const ASCII = [
"╔══════════════════════════════════════╗",
"║  MYCOLDMARS / CH.037 / SIGNAL WARM   ║",
"╚══════════════════════════════════════╝",
"┌──────────────┐  ┌──────────────┐",
"│  ░░▒▒▓▓██▓▓  │  │  ▓▓██▓▓▒▒░░  │",
"└──────────────┘  └──────────────┘",
"╭─╮ ╭─╮ ╭─╮ ╭─╮ ╭─╮ ╭─╮ ╭─╮ ╭─╮",
"╰─╯ ╰─╯ ╰─╯ ╰─╯ ╰─╯ ╰─╯ ╰─╯ ╰─╯",
"►►►►►►►►►►►►►►►►►►►►►►►►►►►►►►►►",
"▲ ▲ ▲ ▲ ▲ ▲ ▲ ▲ ▲ ▲ ▲ ▲ ▲ ▲ ▲ ▲",
"╋━╋━╋━╋━╋━╋━╋━╋━╋━╋━╋━╋━╋━╋━╋━╋",
"░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░",
"▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒",
"▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓",
"████████████████████████████████",
"·─·─·─·─·─·─·─·─·─·─·─·─·─·─·─·─",
"═══════════════════════════════",
"```````````````````````````````",
"~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~",
"<><><><><><><><><><><><><><><><>",
"┃┃┃┃┃┃┃┃┃┃┃┃┃┃┃┃┃┃┃┃┃┃┃┃┃┃┃┃┃┃┃┃",
"╱╲╱╲╱╲╱╲╱╲╱╲╱╲╱╲╱╲╱╲╱╲╱╲╱╲╱╲╱╲╱╲",
];

const CODE_SNIPPETS = [
"const heart = setInterval(beat, 1000);",
"while (true) { listen(); whisper(); }",

"docker run -it --rm --net host channel037",
"ssh johnny@mycoldmars 'tail -f /var/log/heart'",
"curl -sN https://mycoldmars.com/falling/",
"grep -rE 'why|how|when' ~/notes",
"rsync -avh ~/dreams /var/backups",
"ffmpeg -i life.mov -c:v copy life.mp4",
"git commit -m 'still here'",
"git push --force-with-lease origin main",
"npm install courage  # bun is forbidden... jk",
"kubectl apply -f hope.yaml",
"systemctl restart heartbeat",
"watch -n0 'echo still falling'",
"xargs -n1 echo  < /etc/dreams",
"awk '{print $NF}' /var/log/days.log",
"sed -i 's/fear/curiosity/g' ~/.bashrc",
];

const SERVICES = ["kernel","systemd","dreamd","mycoldmars","heartbeat","poetryd","cron","render","gpu","wifi","ssh","launchd","cosmic-bus","tide","modemd","compass","auroral"];
const LOG_MSGS = [
  "rotating buffer", "tunnel up", "color cycle", "memory: warm",
  "vector flushed", "cache invalidated", "session restored", "no new mail",
  "still here", "rolling logs", "subscriber awoke", "subscriber dozed",
  "phosphor warm", "channel 037 stable", "tide receded", "tide returned",
  "moon: 73%", "uptime ok", "queued: 1 letter", "compaction ok",
  "warnings tolerated", "fan curve gentle", "battery polite",
  "you remembered", "you forgot — ok", "tab count: yes",
  "thread pool widened", "gc complete", "lockfile released",
  "swap mounted", "fs sealed", "entropy adequate", "epoch incremented",
];

const FILENAMES = [
  "manifesto.txt", "rain.wav", "voicememo_01.m4a", "sketch.psd", "letter.draft",
  "grade.lut", "shotlist.md", "thumbs.db", "backup.tar.gz", ".DS_Store",
  "field-notes.txt", "untitled-FINAL.mov", "song.midi",
  "dream-027.log", "remember.txt", "no.rtf", "yes.rtf", "maybe.rtf",
  "channel-037.cfg", "phosphor.bin", "tide.json", "compass.toml",
];

const ONES = [
  "STILL HERE.","KEEP FALLING.","WARM STATIC.","CHANNEL 037 OPEN.",
  "SIGNAL ACQUIRED.","NO NEW MAIL.","DRINK SOME WATER.","BREATHE.",
  "THE PAGE DOES NOT END.","YOU ARE THE LISTENER.","THE WORK WAS GOOD.",
  "GO OUTSIDE BRIEFLY.","DROP YOUR SHOULDERS.",
];

const BIG_WORDS = ["FALL","DEEPER","STILL","HERE","WARM","HOLD","MORE","OK","QUIET","BREATHE","AGAIN","NOW","SOON","SOFT","LOUD","WIDE"];

/* ── row factories ─────────────────────────────────────────── */

function rRow(text, opts = {}) {
  const d = document.createElement("div");
  d.className = "row " + (opts.size || sizeNorm()) + " " + (opts.tone || tone());
  d.textContent = text;
  return d;
}

function rLog() {
  const h = padL(rint(0,23),2), m = padL(rint(0,59),2), s = padL(rint(0,59),2);
  const ms = padL(rint(0,999),3);
  const svc = pick(SERVICES);
  const lvCh = pick(["I","I","I","I","D","D","W","E"]);
  const lv = lvCh === "I" ? "INFO " : lvCh === "D" ? "DEBUG" : lvCh === "W" ? "WARN " : "ERROR";
  const msg = pick(LOG_MSGS);
  const t = lvCh === "E" ? "t-rd" : lvCh === "W" ? "t-g2" : tone();
  return rRow(`[${h}:${m}:${s}.${ms}] ${lv} ${svc.padEnd(13," ")} ${msg}`, { size: "sz-10", tone: t });
}

function rHex() {
  const addr = (rint(0,0xFFFFFF)).toString(16).toUpperCase().padStart(6,"0");
  const bytes = Array.from({length: 8}, hexB).join(" ");
  return rRow(`${addr}  ${bytes}`, { size: "sz-10" });
}

function rLs() {
  const perm = "-rw-r--r--";
  const own = pick(["johnny","root","nobody","ghost","muse"]);
  const sz = String(rint(1, 99999)).padStart(6," ");
  const dt = `2026-${padL(rint(1,12),2)}-${padL(rint(1,28),2)} ${padL(rint(0,23),2)}:${padL(rint(0,59),2)}`;
  const nm = pick(FILENAMES);
  return rRow(`${perm}  ${own.padEnd(7)} ${sz}  ${dt}  ${nm}`, { size: "sz-10" });
}

function rPrompt() {
  const cmds = [
    "$ whoami","$ uptime","$ tail -f /var/log/heart","$ ping meaning.local",
    "$ man patience","$ cat /etc/motd","$ ls -la ~/feelings","$ df -h /dreams",
    "$ ps aux | grep wonder","$ top","$ dmesg | tail","$ history | tail -3",
  ];
  return rRow(pick(cmds), { size: "sz-12", tone: pick(["t-rs","t-rd","t-g7"]) });
}

function rCode()    { return rRow(pick(CODE_SNIPPETS), { size: "sz-11" }); }
function rAscii()   { return rRow(pick(ASCII), { size: "sz-11" }); }
function rOne()     { return rRow(pick(ONES), { size: "sz-13", tone: pick(["t-g1","t-g2","t-g7"]) }); }
function rBig()     { return rRow(pick(BIG_WORDS), { size: pick(["sz-22","sz-22","sz-34"]), tone: pick(["t-g1","t-g2","t-rd","t-rs","t-g7"]) }); }
function rPoemLine(){
  const stanza = pick(POEMS);
  return rRow(pick(stanza), { size: "sz-12", tone: pick(["t-g3","t-g1","t-g7"]) });
}
function rDivider() {
  return rRow(pick([
    "═══════════════════════════════",
    "───────────────────────────────",
    "▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒",
    "···············................",
    "++++++++++++++++++++++++++++++",
    "////////////////////////////////",
  ]), { size: "sz-10", tone: pick(["t-g5","t-g6","t-rh"]) });
}
function rBlank() {
  const d = document.createElement("div");
  d.className = "row";
  d.innerHTML = "&nbsp;";
  return d;
}

/* weighted picker: dense logs/code/hex, occasional poetry/big/divider */
const MAKERS = [
  [rLog,       18],
  [rCode,      14],
  [rHex,        8],
  [rLs,         6],
  [rPrompt,     5],
  [rAscii,      7],
  [rPoemLine,   5],
  [rOne,        3],
  [rDivider,    4],
  [rBig,        2],
  [rBlank,      3],
];
const WPOOL = (() => {
  const out = [];
  for (const [fn, w] of MAKERS) for (let i=0; i<w; i++) out.push(fn);
  return out;
})();
const pickMaker = () => pick(WPOOL);

/* ── streams + burst engine ───────────────────────────────── */

const streams = [
  document.getElementById("s1"),
  document.getElementById("s2"),
  document.getElementById("s3"),
];

/* seed each stream with a lot of rows so the screen is dense immediately */
function seed(stream, count) {
  const frag = document.createDocumentFragment();
  for (let i = 0; i < count; i++) frag.appendChild(pickMaker()());
  stream.appendChild(frag);
}
streams.forEach(s => seed(s, 600));

/* burst engine — every short interval, one stream gets a chunk of new rows
   appended at the bottom + briefly flashed white-green */
function burst() {
  const stream = pick(streams);
  const n = rint(4, 14);
  const frag = document.createDocumentFragment();
  const flashed = [];
  for (let i = 0; i < n; i++) {
    const r = pickMaker()();
    if (Math.random() < 0.45) {
      r.classList.add("burst");
      flashed.push(r);
    }
    frag.appendChild(r);
  }
  stream.appendChild(frag);

  /* drop the white flash after a moment, no transition, just swap */
  setTimeout(() => {
    for (const r of flashed) r.classList.remove("burst");
  }, rint(180, 380));

  /* keep DOM bounded — trim old rows from top once stream gets huge */
  while (stream.childElementCount > 2400) {
    stream.removeChild(stream.firstChild);
  }
}

/* fire bursts on a jittered cadence — feels like incoming code */
function scheduleBurst() {
  const next = rint(40, 220);
  setTimeout(() => { burst(); scheduleBurst(); }, next);
}
scheduleBurst();
scheduleBurst();
scheduleBurst();

/* ============================================================
   B A N A N A S  —  flying yellow ASCII across the page
   ============================================================ */

const BANANA_ART = [
  // single-line bananas
  ")",
  "))",
  "))))",
  "~)",
  "~~)",
  "(~~",
  "~~)~~",
  "BANANA",
  "BANANA!!",
  "BANANA BANANA BANANA",
  ")))))))))))",
  "(~~~~~~~)",
  "~ B A N A N A ~",
  // tiny multi-line bananas
  "  ___\n_/   \\__\n\\______/",
  " __\n/  \\__\n\\____/",
  "   ___\n  /   )___\n  \\_______/",
  // wordy
  "🍌",
  "🍌🍌🍌",
  "🍌 🍌 🍌 🍌 🍌",
  "🍌  ───>  🍌",
  "<───  🍌  ───>",
];

const banLayer = document.getElementById("banana-layer");

function flyBanana() {
  const art = pick(BANANA_ART);
  const el = document.createElement("pre");

  const size = pick(["tiny","tiny","tiny","mid","mid","huge"]);
  const tone = pick(["", "bright", "deep", "bright"]);
  el.className = "banana " + size + " " + tone;
  el.textContent = art;

  // vertical position anywhere in the viewport
  const y = rint(2, 92);
  el.style.top = y + "vh";

  // small random rotation, locked for the flight
  const rot = rint(-25, 25);
  el.style.setProperty("--rot", rot + "deg");

  // direction + duration (slow-ish so they read)
  const dir = Math.random() < 0.5 ? "fly-right" : "fly-left";
  const dur = rint(4, 10);
  el.style.animation = `${dir} ${dur}s linear forwards`;

  banLayer.appendChild(el);
  setTimeout(() => el.remove(), (dur + 1) * 1000);
}

/* spawn bananas on a jittered cadence — multiple in the air at once */
function scheduleBanana() {
  const next = rint(220, 900);
  setTimeout(() => { flyBanana(); scheduleBanana(); }, next);
}
scheduleBanana();
scheduleBanana();
scheduleBanana();
scheduleBanana();
</script>
