<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill · BURGUNDY — Everything Outstanding</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%99%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --paper:#f3ead9; --paper-2:#efe4cf; --card:#faf3e6; --ink:#211a14; --ink-soft:#5b4f42;
    --ink-faint:#8a7c69; --rule:#d8c8ab; --oxblood:#7c2130; --red:#b8332c; --gold:#a9853f;
    --green:#4a6741; --blue:#3d5a6e; --purple:#5d4a6e;
    --shadow:0 1px 0 rgba(120,90,40,.08), 0 12px 34px -20px rgba(60,40,20,.55);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --disp:"Hoefler Text","Iowan Old Style",Palatino,Georgia,serif;
    --mono:"SF Mono",ui-monospace,"Menlo","Consolas",monospace;
  }
  html[data-theme="night"]{
    --paper:#171310; --paper-2:#1d1813; --card:#221b15; --ink:#eadfce; --ink-soft:#c3b39a;
    --ink-faint:#8c7c66; --rule:#3a2f24; --oxblood:#d98a92; --red:#e0776d; --gold:#d6b673;
    --green:#8fb283; --blue:#8ab0c4; --purple:#b09ac4;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 14px 40px -22px rgba(0,0,0,.85);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);
    color:var(--ink); font-family:var(--serif); font-size:17.5px; line-height:1.6; padding-bottom:110px}
  .wrap{max-width:860px; margin:0 auto; padding:0 20px}
  header.masthead{padding:52px 0 20px; text-align:center}
  .emblem{display:inline-flex; align-items:baseline; gap:.04em; font-family:var(--disp); font-size:60px; line-height:1}
  .emblem .b{color:var(--ink); font-weight:600; position:relative; padding-bottom:6px}
  .emblem .b::after{content:""; position:absolute; left:2%; right:2%; bottom:0; height:4px; background:linear-gradient(90deg,var(--red),var(--oxblood)); border-radius:2px}
  .spark{color:var(--gold); font-size:24px; transform:translateY(-20px); margin-left:2px}
  .kicker{font-family:var(--mono); font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--ink-faint); margin:20px 0 6px}
  h1.title{font-family:var(--disp); font-weight:600; font-size:36px; line-height:1.1; margin:.1em 0 .15em}
  .byline{font-family:var(--mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--oxblood); margin-top:14px}
  .rule{height:1px; background:linear-gradient(90deg,transparent,var(--rule) 15%,var(--rule) 85%,transparent); margin:28px 0}
  .letter{background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:26px 28px 22px; box-shadow:var(--shadow); position:relative}
  .letter::before{content:"how to use this"; position:absolute; top:-9px; left:22px; background:var(--card); padding:0 10px; font-family:var(--mono); font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--gold)}
  .letter p{margin:0 0 12px} .letter p:last-child{margin-bottom:0}

  /* legend */
  .legend{display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 0}
  .lg{display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); border:1px solid var(--rule); border-radius:20px; padding:4px 11px}
  .lg .sw{width:10px; height:10px; border-radius:3px; display:inline-block}

  /* chapters */
  .chap{margin-top:44px}
  .chap-head{display:flex; align-items:center; gap:12px; background:var(--paper); padding:10px 0; border-bottom:1px solid var(--rule)}
  .chap-head h2{font-family:var(--disp); font-weight:600; font-size:24px; margin:0}
  .chap-head .cnt{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--ink-faint); text-transform:uppercase}

  /* edit cards */
  .ed{background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:16px 18px; margin:14px 0; border-left-width:4px; border-left-style:solid}
  .ed[data-t="age-fix"], .ed[data-t="line-edit"], .ed[data-t="timing-marker"]{border-left-color:var(--gold)}
  .ed[data-t="new-paragraph"]{border-left-color:var(--green)}
  .ed[data-t="new-scene"], .ed[data-t="new-chapter"]{border-left-color:var(--oxblood)}
  .ed[data-t="restructure"]{border-left-color:var(--red)}
  .ed[data-t="flashback-slot"], .ed[data-t="parked"]{border-left-color:var(--purple)}
  .ed[data-t="open-question"]{border-left-color:var(--blue)}
  .ed-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px}
  .pill{font-family:var(--mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; padding:3px 8px; border-radius:20px; border:1px solid var(--rule); color:var(--ink-soft)}
  .pill.type{font-weight:600}
  .ed[data-t="new-scene"] .pill.type, .ed[data-t="new-chapter"] .pill.type{color:var(--oxblood); border-color:var(--oxblood)}
  .ed[data-t="new-paragraph"] .pill.type{color:var(--green); border-color:var(--green)}
  .ed[data-t="restructure"] .pill.type{color:var(--red); border-color:var(--red)}
  .ed[data-t="flashback-slot"] .pill.type, .ed[data-t="parked"] .pill.type{color:var(--purple); border-color:var(--purple)}
  .ed[data-t="open-question"] .pill.type{color:var(--blue); border-color:var(--blue)}
  .ed[data-t="age-fix"] .pill.type, .ed[data-t="line-edit"] .pill.type, .ed[data-t="timing-marker"] .pill.type{color:var(--gold); border-color:var(--gold)}
  .ed h4{font-family:var(--disp); font-weight:600; font-size:19px; margin:0 0 7px; line-height:1.25}
  .ed .prop{margin:0 0 10px; font-size:16px}
  .ed .prop p{margin:0 0 9px}
  .ed .prop p:last-child{margin-bottom:0}
  .ed .prop strong{font-weight:600}
  .ed .prop .lead{color:var(--ink)}
  .ed .prop ul.opts{list-style:none; margin:10px 0 2px; padding:0}
  .ed .prop ul.opts li{position:relative; padding:6px 10px 6px 26px; margin:4px 0; background:var(--paper-2); border:1px solid var(--rule); border-radius:8px; font-size:15px; line-height:1.45}
  .ed .prop ul.opts li:before{content:"▸"; position:absolute; left:9px; top:6px; color:var(--gold)}
  .ed .prop .change{background:var(--paper-2); border:1px dashed var(--rule); border-radius:8px; padding:8px 12px; margin:8px 0; font-size:15px}
  .ed .why{font-size:13.5px; color:var(--ink-faint); font-style:italic; margin:0 0 10px}
  .ed .draft{font-size:14.5px; color:var(--ink-soft); background:var(--paper-2); border:1px dashed var(--rule); border-radius:8px; padding:9px 12px; margin:0 0 10px}
  .ed .draft b{font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:400; display:block; margin-bottom:4px}
  .anchor{font-size:13px; color:var(--ink-faint); margin:0 0 12px; line-height:1.5}
  .anchor .h,.anchor .t{font-style:italic}
  .anchor b{font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; font-style:normal; color:var(--ink-faint); margin-right:4px}
  .anchor .mark{color:var(--oxblood); font-weight:700; font-style:normal; padding:0 3px}

  /* verdict row */
  .verd{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .vbtn{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; padding:7px 14px; border-radius:8px; border:1px solid var(--rule); background:transparent; color:var(--ink-soft); cursor:pointer; transition:.12s}
  .vbtn:hover{border-color:var(--ink-soft)}
  .vbtn.acc.on{background:var(--green); border-color:var(--green); color:var(--paper)}
  .vbtn.rej.on{background:var(--red); border-color:var(--red); color:var(--paper)}
  .cmt{flex:1; min-width:160px}
  .cmt input{width:100%; background:var(--paper); color:var(--ink); border:1px solid var(--rule); border-radius:8px; padding:8px 11px; font-family:var(--serif); font-size:14px}
  .cmt input:focus{outline:none; border-color:var(--oxblood)}

  .bar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--paper); border-top:1px solid var(--rule)}
  .bar-in{max-width:860px; margin:0 auto; padding:11px 20px; display:flex; align-items:center; gap:14px}
  .progress{flex:1; display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:11.5px; color:var(--ink-soft)}
  .track{flex:1; height:6px; background:var(--rule); border-radius:6px; overflow:hidden; max-width:240px}
  .fill{height:100%; width:0; background:linear-gradient(90deg,var(--oxblood),var(--gold)); transition:width .3s}
  button.act{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--oxblood); color:var(--paper); background:var(--oxblood); padding:9px 14px; border-radius:8px; cursor:pointer}
  button.ghost{background:transparent; color:var(--oxblood)}
  .theme-btn{position:absolute; top:16px; right:18px; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); background:transparent; border:1px solid var(--rule); border-radius:20px; padding:5px 11px; cursor:pointer}
  .toast{position:fixed; bottom:70px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0; background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:10px; font-size:13.5px; font-family:var(--mono); transition:.25s; pointer-events:none; z-index:50}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  @media(max-width:640px){ h1.title{font-size:30px} .emblem{font-size:50px} .letter{padding:20px} .ed{padding:14px} }
</style>
</head>
<body>
<button class="theme-btn" id="themeBtn">☾ night</button>
<div class="wrap">
  <header class="masthead">
    <div class="emblem"><span class="b">B</span><span class="spark">✦</span></div>
    <div class="kicker">Bill · your story wizard</div>
    <h1 class="title">BURGUNDY: The Edit Proposal</h1>
    <div class="byline" id="byline"></div>
  </header>

  <div class="letter" id="intro"></div>

  <div class="legend" id="legend"></div>

  <div id="chapters"></div>
</div>

<div class="bar"><div class="bar-in">
  <div class="progress"><span id="pText">0 ruled</span><span class="track"><span class="fill" id="fill"></span></span></div>
  <button class="act ghost" id="accAllBtn" title="accept everything not yet ruled">accept rest</button>
  <button class="act ghost" id="clearBtn">clear</button>
  <button class="act" id="exportBtn">export ↧</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
const DATA = {"intro":"**★ First, the personal one (not the novel):** this FALL, set Henry up to walk his dog every day. He gets a TRACKER, racks up miles, and earns $1 per mile. He wears a little ruck with his iPad and goes out exploring with the dog — makes money, feels motivated, gets exercise. (Logged so it doesn't get lost; ACCEPT to mark it handled, or COMMENT to adjust the deal.)\n\n---\n\n**Everything outstanding for BURGUNDY, in one place.** I pulled together every open item from the three cockpits — the edit proposal, the chapter-1-22 read-through, and the new arc — dropped what Parts 1 & 2 already shipped, and reconciled the overlaps. This is the single list now; q2, q3 and q4 all fold into here.\n\n**How it's laid out:** the big calls sit at the top — the canon and structure decisions (23) and **the new arc** (9 beats: the depot, the dig, the dinners, the militant, Hesta's trust). Below that, everything is grouped **by chapter**, so all the outstanding work for a given chapter is together: the read-through's pending items and **every live reader note** — 90 from Iz and 12 of yours, each read against the current text with my honest verdict and a clear choice.\n\n**183 cards.** Accept means I make the change; comment overrides me. Export when you're done and I execute — same round-trip as before. (Notes already handled in Parts 1 & 2 aren't here; this is only what's still open.)","edits":[{"chapter":"0 · THE BIG CALLS","seq":1,"type":"decision","size":"ruling","title":"NAME: the space-doors (not \"port\", not \"space door\")","proposal":"The massive circular megastructures that rip open + hold a wormhole (supernova-powered, osmarine-held). You didn't love \"port\" or \"space door.\" Options grounded in the physics — pick one or riff: (A) The Aperture / an Aperture. (B) The Throat (the physics term for a wormhole's neck — stark, bodily). (C) The Lock (canal-lock resonance — a passage you pass through; pairs with \"the door stays locked open\"). (D) The Seam. (E) The Conjunction / a Conjunction-gate. (F) named per its star — \"the Ros Gate.\" Bill's lean: THE LOCK (canal + held-open double meaning). COMMENT with your pick.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":2,"type":"decision","size":"ruling","title":"NAME: Burgundy's ruling clan (V-start, not too magical)","proposal":"The clan Nicholas installed 84 years ago; Burgundy is its 4th generation. You wanted a V, not-magical. Options: (A) Clan VESK. (B) Clan VORNE. (C) Clan VOSS. (D) Clan VANTREL. (E) Clan VIRE. (F) Clan VARO. (G) Clan VESNIK. Bill's lean: VOSS (hard, plain, planetary) or VANTREL (a touch more dynastic). Note: the King's name is currently \"Vorran\" — pick a clan name that doesn't collide. COMMENT with your pick, or a different letter.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":3,"type":"decision","size":"ruling","title":"NAME: the \"red phone\" (Cold-War hotline device)","proposal":"The comms device in the King's lounge — the only channel to Nicholas, with a color-coded escalation ladder (code red → Shanti). Not a literal red telephone. Options: (A) The Line. (B) The Recourse. (C) The Hotline (plain, Cold-War-honest). (D) The Petition. (E) The Escalation. (F) The Redoubt-line / the Redline (the color survives as the top tier: \"going redline\"). Bill's lean: THE REDLINE — keeps your red, verbs nicely (\"he went redline\"), and the ladder tiers are colors. COMMENT.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":4,"type":"decision","size":"ruling","title":"RULING: how much to fudge the space-door physics","proposal":"The research grounds it in real theory (traversable wormholes need exotic matter to hold the throat = osmarine's job; supernova energetics ~10^44 J = the tear; Chandrasekhar-limit \"tipping\" a marginal star = the trigger; canal/chokepoint economics = the ~71 doors). The honest fudges: harnessing/channeling a whole supernova, and \"coaxing\" a star over the edge on demand. Bill's recommendation: keep the TRAPPINGS rigorous (characters speak of throats, exotic mass, the Chandrasekhar edge, the door's frame) and let the two big cheats stay off-page / stated once as accepted history.\n\n▸ Accept — that level.\n▸ Comment — go harder/softer. (Full physics bible on your Desktop.)","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":5,"type":"decision","size":"ruling","title":"REFRAME: osmarine is what HOLDS THE DOORS OPEN (not \"enables star travel\")","proposal":"Per your note, we kill the too-Dune line. New framing everywhere osmarine/travel comes up (ch4 Custom House, Mira's library, the King's dinner boasts): before the doors, travel between stars was slow (decades), the galaxy thin; osmarine's discovery let them hold open the space-doors that made everything reachable — and Nicholas pioneered it here.\n\n▸ Accept — Bill rewrites the osmarine/travel lines to the door framing (green suggestions).\n▸ Comment — your framing.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":6,"type":"decision","size":"ruling","title":"THE STRIKE CAUTIONARY TALE: the uniquely-Nicholas cruelty","proposal":"Grandpa once used the lowest tier of the red phone (a mine strike the domestic force couldn't break). Nicholas's people came and did something uniquely cruel — NOT just \"mowed them down.\" THE RESEARCH FOUND A GROUNDED ANSWER (from King Leopold's Congo, where the signature atrocity was an accounting rule — a severed hand per spent bullet, because the arms-supplier metered munitions and wouldn't trust the local force with unaccounted weapons). Bill's recommendation: \"the Listen + the Meter.\" Nicholas installs (a) a pervasive SURVEILLANCE instrument that hands the King power to hear the people's own words (feeds his control-by-listening doctrine), AND (b) a MUNITIONS-METERING regime — every round issued to the King's men must be reconciled crate-by-crate on the Vicentennial cadence, because Nicholas is an arms-maker who fears his proxy hoarding force for a mutiny. It empowers the King's oppression precisely by making him ACCOUNT to Nicholas for every gram of force — and it foreshadows Burgundy building an army of drill-robots that appears on no ledger at all. And the tribute rose after, and never came down.\n\n▸ Accept — the Listen + the Meter.\n▸ Comment — pick one, or your own.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":7,"type":"decision","size":"ruling","title":"SPEC: the weapons depot arsenal (what's actually in there)","proposal":"Nicholas's on-planet bunker of the clan's disbanded Civil-War military — the thing the resistance quietly empties. You wanted tactical/conventional, NOT WMD, and feasibly under front-heavy / back-unguarded security. Bill's spec: bulk small arms + ammunition, crew-served weapons, armored ground platforms (tanks/walkers), tube & rocket artillery, air-defense batteries, munitions/explosives stores — sealed and racked, guarded hard at the single front entry, zero rear security because it's buried in dead tunnels nothing could breach (until antimatter drills).\n\n▸ Accept — that spec.\n▸ Comment — adjust the loadout.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":8,"type":"decision","size":"ruling","title":"The vassal-planet roster (what each world provides)","proposal":"The system's vassal planets each export ~one thing as tribute; trade among them existed before Nicholas, extortion after. Confirmed: Ros = minerals/osmarine; the ocean world = seafood protein (99% ocean, 87 islands, vacuum-cold cargo). Bill proposes (transposed from real single-resource colonies): a timber/biomass world, a heavy-metals world, a rare-earth/refining world, an agri/calorie world (the sugar-analogue), and a transit/broker world that skims every cargo.\n\n▸ Accept — build the roster from these.\n▸ Comment — your worlds. (Full economics bible on your Desktop.)","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":9,"type":"decision","size":"ruling","title":"STRUCTURE: pick the escalation approach for the middle (4 paths coming)","proposal":"I ran a deep structural study (Harry Potter / Hunger Games / Dune / Monte Cristo / Baru Cormorant) and designed FOUR distinct architectures for the tunnels→climax middle: (1) THE TIGHTENING LEDGER — the father's finance audit is the master clock; (2) THE TRAINING PROGRESSION — the 3-week rotations ARE the structure, curriculum-as-clock; (3) THE EMPTYING DEPOT — the heist is the spine; (4) THE SEEN BOY — the emotional arc drives everything. All are visualized side-by-side on the new OUTLINE HUB (mycoldmars.com/burgundy/outline). This card is where you tell me which one (or which blend) to build the middle around.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":10,"type":"decision","size":"ruling","title":"The 20th-birthday time-bomb: what forces the war?","proposal":"The middle needs a hard clock: something scheduled for the Vicentennial (20th birthday) that would EXPOSE the workshop / South-12 and force Burgundy to move first. Bill's candidate: the rite includes a ceremonial full SURVEY/mapping of the palace's under-tunnels (an old tradition — the new prince is shown \"the whole of what he'll rule\"), which would walk the King's people straight into the robot-dug tunnel and the factory. So the revolution must break BEFORE the survey.\n\n▸ Accept — that device.\n▸ Comment — your time-bomb.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":11,"type":"decision","size":"ruling","title":"Does Burgundy volunteering to run the ledger audit read as too convenient?","proposal":"You flagged this: the father gripes that Mira is over-spending (steel, tracks, bearings, hydraulic arms), sends a finance minister to audit — and Burgundy, who knows it's all for HIM, wants to deflect, maybe by volunteering to run the investigation himself. Bill's read: him volunteering outright IS a little convenient/suspicious (a prince asking to audit his own mother reads as odd to the King). Stronger: Burgundy doesn't volunteer — he QUIETLY sabotages from inside (befriends/feeds the finance minister false leads, or gets Mira to reroute the worst orders through a clean broker) so the audit keeps almost-finding-it. That's the Baru Cormorant move and it's far more tense.\n\n▸ Accept — the quiet-sabotage version.\n▸ Comment — keep the volunteer version / your idea.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":12,"type":"decision","size":"ruling","title":"NAME/ROLE: who is the militant, and who is the Ghai depot-navigator?","proposal":"Two resistance roles are still uncast. (1) THE MILITANT — his father was killed brutally by the regime; he's the one who says \"put weapons on the robots,\" the revenge-force who pushes escalation. (2) THE GHAI-DESCENDED NAVIGATOR — the woman with indigenous local knowledge of the old tunnels who realizes she knows where the weapons depot is and how to reach its unguarded back. They can be two people or (riskier, richer) linked. Bill will draft names on your nod.\n\n▸ Accept — Bill casts + names them.\n▸ Comment — your casting (e.g. make the militant the Ghai woman's brother; whose death drives the militant).","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":13,"type":"decision","size":"ruling","title":"NAME: the rival that fueled the LOSING side of the Great Rupture","proposal":"The clan won the proxy war because Nicholas backed them. The OTHER side was backed by a rival Core-adjacent power — a second East-India-Company-type corporate machine competing with Nicholas for the newly-opened backwater. Naming it (and keeping it faintly alive — a defeated claimant, a corporate competitor still lurking) gives the history teeth and a future threat. Bill's options on your nod.\n\n▸ Accept — Bill names the rival + defines its residue.\n▸ Reject — leave it unnamed backstory. COMMENT.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":14,"type":"decision","size":"ruling","title":"STRUCTURE: the two new TRAINING chapters — where do they go?","proposal":"The training-rhythm middle needs ~2 new chapters where Burgundy shadows professionals (the Archives with the old archivist → the Rupture history; the Office of External Affairs with Schwartz → the vassal planets; the defense track → the weapons depot + red phone as 'boring training facts'). This REPLACES the tutor-flashbacks (to be deleted). The integration map proposes exact insertion points + renumber.\n\n▸ Accept — Bill inserts the two training chapters per the map + deletes the tutor flashbacks.\n▸ Comment — different placement, or fold into existing chapters instead of new ones.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":15,"type":"decision","size":"ruling","title":"Delete ALL tutor-flashbacks — confirm (incl. the ch2 'where's his fleet' exchange)?","proposal":"You said delete all tutor-flashbacks and learn the geopolitics through TRAINING instead. That includes the ch2 tutor 'Where does he keep his fleet / we do not have that on the chart' exchange (currently a parked template slot). Bill's recommendation: delete the flashback FORM everywhere; migrate their best content into the training scenes; keep the ch2 exchange's CHILL only if it becomes a live training beat, else cut.\n\n▸ Accept — delete all tutor-flashbacks, migrate content to training.\n▸ Comment — keep specific ones.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":16,"type":"decision","size":"ruling","title":"Tuck in the back half — right now he vanishes (ch22–28)","proposal":"The emotional spine leans on Tuck (the drifting friend, the quilt, the Tiffins of food he procures for the Hollow dinners) — but in the current draft he DISAPPEARS in the climax stretch (ch22–28). For the bond to pay off, Tuck should carry through: his food-runs to the Hollow, a near-catch that endangers him, his place at the end. Bill's recommendation: thread Tuck through the back half (he procures the Hollow food per raw canon — NOT a new under-cook character) and give the friendship a cost near the climax.\n\n▸ Accept — Bill threads Tuck through ch22-28. COMMENT.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":17,"type":"decision","size":"ruling","title":"NAMING grab-bag: archivist, vassal worlds, the door-network","proposal":"Smaller names Bill can draft on your nod (each with 3-4 options, non-magical, in the Dross register): the ARCHIVIST (kind long-bearded keeper of the clan's history library); the VASSAL WORLDS (the ocean/seafood world of 87 islands, the timber world, the refining/entrepot world at the door-mouth); and whether the network of space-doors needs its own collective name.\n\n▸ Accept — Bill drafts options for each.\n▸ Comment — names you already have.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":18,"type":"decision","size":"ruling","title":"FLOW: the kick became a push — but ch9/ch14/ch18/ch21 still say \"kicked\"","proposal":"Per your King doctrine, ch2 now ends on a brake-check PUSH, not an angry kick. But at least four later lines recall it as a kick: \"the robot his father kicked\" (ch9/10), \"Machines too finished to kick\" (ch14), \"his father had kicked it\" (ch18/21). A reader who watched the gentle push then reads \"kicked\" as a harder act. Bill's recommendation: KEEP the push in ch2 and keep \"too finished to kick\" (it's a great button) by seeding one line in ch2's aftermath where Burgundy privately thinks of the push AS a kick — then every later \"kick\" is his earned bitter shorthand.\n\n▸ Accept — Bill adds that one seeding line + leaves later lines.\n▸ Reject — change all later \"kick\" lines to \"pushed/set his boot against.\"\n▸ Comment — your call.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":19,"type":"decision","size":"ruling","title":"FLOW: ch2's King now pre-says Oz's surveillance reveal (ch11-12)","proposal":"Confirmed what your doctrine md asked me to check: the new ch2 has the King spell out the informant mechanism in his own mouth (\"who's short on his rent, who's angry at his shift boss, who's been asking questions he oughtn't\" / \"I want to know\"). Oz's hunt scene (ch11-12) is built to REVEAL exactly that to Burgundy as new — so it now lands a principle the reader already owns, softening the detonation. Your md's own fallback: \"soften those specifics and let Oz's chapter do them.\" Bill's recommendation: TRIM the three concrete informant specifics from ch2, keep the philosophy (\"a foreman walks a seam to read his men... I know what is moving under it before it moves\").\n\n▸ Accept — Bill trims ch2 to principle-level, Oz keeps the machinery.\n▸ Reject — keep ch2 as-is (accept the early seed).\n▸ Comment — your framing.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":20,"type":"decision","size":"ruling","title":"FLOW: King \"seethes\"/rages in ch8 & ch13 — clashes with presumptuous-not-temperamental","proposal":"Now that the King is locked as presumptuous, never raging (\"he corrects, he never rages\"), two earlier/later beats read wrong: ch8 has him \"seethed\" (the no-more-cook's-boy scene) and ch13 (the preserve) has a hot reaction. Bill's recommendation: re-key both to cold verdict register (ch8 \"seethed\" → \"he informed him, flatly\"; ch13 → cold presumption).\n\n▸ Accept — Bill applies the register fixes.\n▸ Reject — accept these as rare exceptions (a father CAN rage once about his son).\n▸ Comment — per scene.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":21,"type":"decision","size":"ruling","title":"FLOW: the want-engine Vicentennial fantasy echoes across ch1, ch9, ch14","proposal":"The \"finished machines on the Kings' Hall floor at the Vicentennial, too finished to dismiss, his father forced to see\" fantasy appears in ch9 (first ignition) and again ch14 (fuller), plus the ch1 want-seed plants it and ch1/ch14 both open on \"going to be king / never the question / no other outcome.\" It's a deliberate recurring engine, but currently the wording is close enough to read as reprint. Bill's recommendation: let ch9 be the tentative first ignition, ch14 the harder return (rephrase so it reads as a RETURN not a reprint), ch1 the plant.\n\n▸ Accept — Bill differentiates the wording across the three.\n▸ Reject — leave (it's meant to recur). COMMENT.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":22,"type":"decision","size":"ruling","title":"FLOW: \"craft\" lands 5× in ch1-2; the pitch figure is verbatim in ch1 & ch2","proposal":"Two small polish items from the read. (1) \"Craft\" appears 5 times across the two opening chapters (3 inside ch2's proclamation) — the two-crafts rivalry is strong but the word is dense; trimming one or two tightens it. (2) The pitch figure \"tooled properly, at scale... a third more ore inside a year\" runs nearly verbatim in ch1 interior AND ch2 spoken — intentional (he rehearsed it) but so verbatim it can read as a repeat rather than a callback. Bill's recommendation: trim one \"craft\", and vary the ch1 interior figure slightly so the ch2 spoken pitch lands fresh.\n\n▸ Accept — light trims.\n▸ Reject — keep (the rehearsed-line echo is deliberate).","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":23,"type":"decision","size":"ruling","title":"Audio: chapters changed — regenerate narration now or wait?","proposal":"The Author's Edition audio is stale — ch1, ch2, ch4 were fully rewritten and other chapters changed. Regenerating costs ElevenLabs credits. Bill's recommendation: WAIT until you've accepted the remaining green suggestions and ruled these cards, then narrate the final text once (so we pay for final only).\n\n▸ Accept — wait.\n▸ Comment — regenerate specific chapters now (name them).","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":301,"type":"new arc","size":"ruling","title":"The militant — who is he?","proposal":"**One of the resistance distrusts Burgundy first, then commits hardest — and later says \"why don't we put weapons on the machines?\"** The codex already has two men who could carry that: **Skorn** (a hard, quiet miner-organizer, principled suspicion of Burgundy — the moral center of the room) and **Moss** (a silent ex-soldier whose military past does his talking).\n\nThe distrust arc fits Skorn. The weaponize instinct fits a soldier. My instinct: **Skorn is the militant** (suspicion → earned trust → \"arm them\"), and **Moss** is the one who confirms in the debate that it's actually feasible — the two of them are the hawk and the armorer.\n\n▸ Skorn is the militant — Moss backs the feasibility (my recommendation)\n▸ Moss is the militant — the ex-soldier wants the guns\n▸ Merge them into one character — tell me which name\n▸ Comment","head":"","tail":"","rationale":"casting the distrust→militant arc","draft":""},{"chapter":"0 · THE BIG CALLS","seq":302,"type":"new arc","size":"big","title":"Hesta's trust moment — the hinge of the alliance","proposal":"**The first time Burgundy meets Hesta, she has to see the danger and decide to trust him anyway — because the situation is insane.** Her logic, out loud: no normal working of this regime would ever let the sole heir walk unarmed into the deadliest mine on the planet. She knows the regime cold. *The very fact that this kid — the one person whose death throws everything into disorder — has been sent down here alone, unarmed, into a room where I could kill him right now and no one could stop me: that is insane enough that I'll trust you. We don't have a lot of other choices.* She says it clearly, but names her unease: *I don't know what this is. It's really weird. Something's up. But I'll hear you out.*\n\nShe trusts it **on** the strangeness, not despite it.\n\n» This is a character beat, not a new scene — it wants to live inside the first-Hollow meeting.\n\n▸ Fold it into the existing first-meeting scene as the turn (my recommendation)\n▸ Give it its own short chapter — the descent + the standoff + the decision\n▸ Comment — you have the exact line in mind","head":"","tail":"","rationale":"the alliance hinge · first meeting","draft":""},{"chapter":"0 · THE BIG CALLS","seq":303,"type":"new arc","size":"big","title":"The bread — and the Tuck food tradition","proposal":"**Burgundy brings down rolls and passes them around. They have good food, but no wheat, no gluten — squishy bread is a total novelty. They bite in and have never had anything like it.** That single moment starts a tradition: from then on he goes to **Tuck** for food — dried meats, wheels of cheese, bread, fruit — and carries it down. Each Hollow dinner becomes its own described ritual.\n\nThis lands right on canon we already have — **the Tiffins** (the stacked tins carried to the dinners) and **Pell** (the under-cook who packs it). The bread is the *origin*; Tuck is the *supply line*.\n\n▸ Write the \"first bread\" beat once, then make the dinners a recurring described motif (my recommendation)\n▸ Just the one bread scene for now — hold the recurring dinners\n▸ Also write the Tuck \"supply-line\" r":"0 · THE BIG CALLS","seq":306,"type":"new arc","size":"big","title":"The map room — how he finds the exact spot","proposal":"**Burgundy goes to the cartographer in the map room — every map of Dross, the system, the core worlds.** He feigns an idle fascination with the castle and the southern ice, plays it as curiosity about the arctic, and asks to *check the maps out to study the ice.* The cartographer thinks he's a little silly for wanting a stack of maps of nothing. He lets him take them.\n\nHe scours them for hours. On one — a **post–Civil War event map**, survey and settlement plans — in the middle of a sheet of ice, in the middle of nowhere, a **small rectangle** labeled something deliberately benign: **\"storage.\"** He knows instantly. He looks closer: an entire **cavern** built beneath it. About **12 miles south of the castle**, outside the city, on a random ice field. Now he has the exact location.\n\n» New character: **the cartographer.** Wants a name and a quick vibe. My pick: a fussy, incurious archivist who loves the maps and never reads them.\n\n▸ Its own chapter — this is a real set-piece (my recommendation)\n▸ A single scene inside a working chapter\n▸ Name the cartographer + write it — tell me the name, or take my pick\n▸ Comment","head":"","tail":"","rationale":"the hunt's payoff · a set-piece","draft":""},{"chapter":"0 · THE BIG CALLS","seq":307,"type":"new arc","size":"big","title":"The plan + the council confirmation","proposal":"**He brings the location to the Hollow; over a meal they plot the back door** — dig deep enough to come up under the depot's unguarded flank, because Nicholas only guards the top. Then Burgundy confirms the defense at council, framed as *the prince who'll be king needs to understand how it's kept safe.* **Oz:** Nicholas's best soldiers hold the front, the rest is underground. *But what if someone dug through?* **Impossible** — it's **pure corvite all around; miners would take fifty years** to cover that distance.\n\nAnd that is the moment: **Burgundy realizes he has the tool.** The robots turn fifty years into weeks. He is quietly, completely certain they can do it. **They start digging that night.**\n\n▸ Two scenes — the Hollow plan, then the council confirmation (my recommendation)\n▸ One braided scene, cutting between the table and the council\n▸ Comment","head":"","tail":"","rationale":"the plan locks · the dig begins","draft":""},{"chapter":"0 · THE BIG CALLS","seq":308,"type":"new arc","size":"ruling","title":"The dig clock — how long to reach the depot?","proposal":"**Oz's number is fifty years for conventional miners.** The robots are the whole point — dramatically faster, improving as they go. The dig is a new countdown running under the middle of the book, and its length sets the tension.\n\n**My recommendation: ~5–6 weeks, timed to collide with the Vicentennial** (roughly nine months out when this starts, tightening). Long enough to be a real siege of patience — dinners, near-misses, the robots learning the rock — short enough to stay taut, and it lets the two clocks converge at the run-up.\n\n▸ ~5–6 weeks, colliding with the Vicentennial (my recommendation)\n▸ Taut — 5 days\n▸ A 3-week sprint\n▸ Explicitly timed to land on the eve of the Vicentennial\n▸ Comment a number","head":"","tail":"","rationale":"sets the new clock · your call","draft":""},{"chapter":"0 · THE BIG CALLS","seq":309,"type":"new arc","size":"medium","title":"The order of the middle","proposal":"**Here's the order I'd lay these beats into the middle of the book:**\n\n» 1 · Hesta's trust moment (first meeting)\n» 2 · the dinners begin (the bread)\n» 3 · the robots become a factory\n» 4 · the militarization debate + depot reveal\n» 5 · the council probe (the direction)\n» 6 · the map room (the exact spot)\n» 7 · the plan + council confirmation\n» 8 · the dig begins — the clock starts\n\n▸ Confirm this order and I'll build to it (my recommendation)\n▸ Reorder — tell me the sequence\n▸ Comment","head" ing in them had ever once been this good without a hook in it.\"\n\n▸ Accept — I make that change as a green edit\n▸ Reject — keep the line as it is\n▸ Comment — your own version","head":"","tail":"","rationale":"reader note · still live","draft":""},{"chapter":"21","seq":1095,"type":"iz note","size":"medium","title":"Iz · Hesta's speech: three line fixes (diction, narrator tic, fauna)","proposal":"**Iz flagged this:** Three notes on one paragraph: \"Friends.\" (for \"hangs our organizers\"); \"She paused.\" (for \"A pause, one beat, surgical.\"); \"Do they have fish? Maybe bird\" (for the fish/worm line).\n\n*As it reads now:* Line 2663, Hesta's public speech: \"...takes our wages, works our children, hangs our organizers. His father's men have six of ours in some dark cell right now.\\\" A pause, one beat, surgical. \\\"And his boy came down our shaft in the night... If a fish saw a worm do that, even the fish would think twice.\\\"\"\n\n(1) Her diction instinct is right: \"organizers\" is modern labor jargon, off-register for Dross. But \"friends\" loses the political charge, and the book already planted the right idiom: the King's Ch12 speech about \"a practice for the ones who talked\" (the public descent), and his \"a man speaks against the crown in a drink hall... down the hole by night.\" Use that. (2) Agree fully: \"A pause, one beat, surgical\" is the narrator admiring its own timing; the speech shows her control without help. (3) Legitimate catch: fish are never established on Dross, and a lifetime-underground forewoman reaching for an angling idiom is doubly odd. A straight bird swap breaks the bait logic, but bait itself is in-world (the Ch12 preserve hunt runs on scattered grain, and the buck that didn't think twice got shot), so a grain-in-the-open version keeps the trap shape with established texture. The one established bird is the ladderfinch, a mine bird Hesta would know, if Johnny wants the specific noun. Flag the exact wording as a taste call for Johnny.\n\n» **I'd change:** Three pairs. (1) OLD: \"hangs our organizers\" NEW: \"hangs the ones who talk\". (2) OLD: \"A pause, one beat, surgical.\" NEW: \"She paused.\" (3) OLD: \"If a fish saw a worm do that, even the fish would think twice.\" NEW: \"If a bird saw grain thrown down in the open, even the bird would think twice.\"\n\n▸ Accept — I make that change as a green edit\n▸ Reject — keep the line as it is\n▸ Comment — your own version","head":"","tail":"","rationale":"reader note · still live","draft":""},{"chapter":"21","seq":1096,"type":"iz note","size":"medium","title":"Iz · Cut \"There was no sentence that proved anything.\"","proposal":"**Iz flagged this:** Cut this sentence\n\n*As it reads now:* Line 2667: \"Every word he could offer, an informer could offer. Every promise he could make, the regime had made and broken to these people in some generation or another. There was no sentence that proved anything.\"\n\nAgree fully. Textbook Last Step violation: the parallel pair does the work, the summary sentence explains it, and the next line (\"So he said the only thing that was both true and useful\") turns harder against the unexplained pair. Words-prove-nothing is the chapter's designed point, which is exactly why it must not be announced a third time.\n\n» **I'd change:** OLD: \"...the regime had made and broken to these people in some generation or another. There was no sentence that proved anything.\" NEW: \"...the regime had made and broken to these people in some generation or another.\"\n\n▸ Accept — I make that change as a green edit\n▸ Reject — keep the line as it is\n▸ Comment — your own version","head":"","tail":"","rationale":"reader note · still live","draft":""},{"chapter":"21","seq":1097,"type":"iz note","size":"medium","title":"Iz · Drop the \"never seen anything like it\" claim; the snapshot carries it","proposal":"**Iz flagged this:** Really? It doesn't sound that striking or like he wouldn't have seen it before.\n\nAgree. The spec const KEY = 'bill-burgundy-master-v1';
let R = {};
try{ const p = JSON.parse(localStorage.getItem(KEY) || '{}'); R = (p && typeof p==='object' && !Array.isArray(p)) ? p : {}; }catch(e){ R = {}; }
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const inlineMd = s => esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');
function renderProp(s){
  if(!s) return '';
  let out=''; let opts=[];
  const flush=()=>{ if(opts.length){ out+='<ul class="opts">'+opts.map(o=>'<li>'+inlineMd(o)+'</li>').join('')+'</ul>'; opts=[]; } };
  for(const block of String(s).split(/\n\n+/)){
    const b = block.trim(); if(!b) continue;
    const lines = b.split(/\n/).map(l=>l.trim()).filter(Boolean);
    if(lines.length && lines.every(l=>/^▸\s+/.test(l))){ for(const l of lines) opts.push(l.replace(/^▸\s+/,'')); continue; }
    flush();
    if(/^»\s+/.test(b)){ out+='<div class="change">'+inlineMd(b.replace(/^»\s+/,''))+'</div>'; continue; }
    out += '<p'+(out?'':' class="lead"')+'>'+inlineMd(b).replace(/\n/g,'<br>')+'</p>';
  }
  flush();
  return out;
}

const TYPE_LABEL = { 'age-fix':'number fix','line-edit':'line edit','timing-marker':'timing marker','new-paragraph':'new paragraph','new-scene':'new scene','new-chapter':'new chapter','restructure':'restructure','flashback-slot':'flashback slot','parked':'parked (geo)','open-question':'open question' };

const total = edits.length;

$('#byline').textContent = 'chronological · '+total+' proposed edits · accept, reject, or comment on each';
$('#intro').innerHTML = DATA.intro.split(/\n\n+/).map(p=>'<p>'+inlineMd(p)+'</p>').join('');

// legend (only types present)

$('#legend').innerHTML = present.map(t=>'<span class="lg"><span class="sw" style="background:'+TYPE_COLOR[t]+'"></span>'+esc(TYPE_LABEL[t]||t)+'</span>').join('');

// group by chapter, chronological
function chapKey(c){ const m = String(c).match(/\d+/); return m ? parseInt(m[0]) + (String(c).toLowerCase().includes('new')? 0.5 : 0) : 99; }
const groups = {};
edits.forEach(e=>{ (groups[e.chapter] = groups[e.chapter] || []).push(e); });
const chapOrder = Object.keys(groups).sort((a,b)=>chapKey(a)-chapKey(b) || String(a).localeCompare(String(b)));
chapOrder.forEach(c => groups[c].sort((a,b)=>(a.seq||0)-(b.seq||0)));

const cbox = $('#chapters');
chapOrder.forEach(c=>{
  const sec = document.createElement('section'); sec.className='chap';
  let h = '<div class="chap-head"><h2>'+(String(c).match(/^\d+$/)?'Chapter '+c:esc(c))+'</h2><span class="cnt">'+groups[c].length+' edits</span></div>';
  groups[c].forEach(e=>{
    const st = R[e.id]||{};
    h += '<div class="ed" data-t="'+esc(e.type)+'" data-id="'+e.id+'">';

    h += '<h4>'+esc(e.title)+'</h4>';
    h += '<div class="prop">'+renderProp(e.proposal)+'</div>';
    if(e.draft) h += '<div class="draft"><b>the change</b>'+esc(e.draft)+'</div>';
    if(e.head || e.tail){
      h += '<p class="anchor">';
      if(e.head) h += '<b>after</b><span class="h">“…'+esc(e.head)+'”</span> ';
      h += '<span class="mark">◆</span>';
      if(e.tail) h += ' <b>before</b><span class="t">“'+esc(e.tail)+'…”</span>';
      h += '</p>';
    }
    if(e.rationale) h += '<p class="why">'+esc(e.rationale)+'</p>';
    h += '<div class="verd">';
    h += '<button class="vbtn acc'+(st.v==='accept'?' on':'')+'" data-id="'+e.id+'" data-v="accept">✓ accept</button>';
    h += '<button class="vbtn rej'+(st.v==='reject'?' on':'')+'" data-id="'+e.id+'" data-v="reject">✗ reject</button>';
    h += '<span class="cmt"><input data-id="'+e.id+'" placeholder="comment…" value="'+esc(st.c||'')+'"></span>';
    h += '</div></div>';
  });
  sec.innerHTML = h; cbox.appendChild(sec);
});

function ruled(id){ const s=R[id]||{}; return !!(s.v || (s.c && s.c.trim())); }
const doneSet = new Set(edits.filter(e=>ruled(e.id)).map(e=>e.id));
function refreshBar(){
  $('#pText').textContent = doneSet.size+' of '+total+' ruled';
  $('#fill').style.width=(total?doneSet.size/total*100:0)+'%';
}
function refresh(){ doneSet.clear(); edits.forEach(e=>{ if(ruled(e.id)) doneSet.add(e.id); }); refreshBar(); }
let saveTimer=null;
function persist(){ localStorage.setItem(KEY, JSON.stringify(R)); }
function persistSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(persist, 400); }
window.addEventListener('beforeunload', persist);
window.addEventListener('pagehide', persist);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') persist(); });
function updateOne(id){ if(ruled(id)) doneSet.add(id); else doneSet.delete(id); refreshBar(); }
function save(){ persist(); refresh(); }

document.body.addEventListener('click', ev=>{
  const b=ev.target.closest('.vbtn'); if(!b) return;
  const id=b.dataset.id, v=b.dataset.v;
  R[id]=R[id]||{};
  R[id].v = R[id].v===v ? null : v;
  const card=document.querySelector('.ed[data-id="'+id+'"]');
  card.querySelectorAll('.vbtn').forEach(x=>x.classList.toggle('on', x.dataset.v===R[id].v));
  updateOne(id); persist();
});
document.body.addEventListener('input', ev=>{
  const inp=ev.target.closest('.cmt input'); if(!inp) return;
  const id=inp.dataset.id; R[id]=R[id]||{}; R[id].c=inp.value;
  updateOne(id); persistSoon();
});
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1900); }

$('#accAllBtn').addEventListener('click', ()=>{
  edits.forEach(e=>{ if(!ruled(e.id)){ R[e.id]=R[e.id]||{}; R[e.id].v='accept'; } });
  document.querySelectorAll('.ed').forEach(card=>{
    const id=card.dataset.id; card.querySelectorAll('.vbtn').forEach(x=>x.classList.toggle('on', x.dataset.v===(R[id]&&R[id].v)));
  });
  save(); toast('accepted the rest');
});
$('#clearBtn').addEventListener('click', ()=>{
  if(!confirm('Clear all your rulings?')) return;
  R={}; localStorage.removeItem(KEY);
  document.querySelectorAll('.vbtn').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.cmt input').forEach(i=>i.value='');
  refresh(); toast('cleared');
});
$('#exportBtn').addEventListener('click', async ()=>{
  let md='# BURGUNDY — Johnny\'s rulings on the Edit Proposal\n\n';
  chapOrder.forEach(c=>{
    md+='\n## '+(String(c).match(/^\d+$/)?'Chapter '+c:c)+'\n';
    groups[c].forEach(e=>{
      const s=R[e.id]||{};
      md+='\n### '+e.title+' ['+(TYPE_LABEL[e.type]||e.type)+' · '+e.size+']\n';
      md+='- **Verdict:** '+(s.v?s.v.toUpperCase():'_(unruled)_')+'\n';
      if(s.c&&s.c.trim()) md+='- **Johnny:** '+s.c.trim()+'\n';
    });
  });
  try{ await navigator.clipboard.writeText(md); toast('copied — paste it back to Parley'); }catch(e){ toast('downloaded'); }
  const blob=new Blob([md],{type:'text/markdown'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='BURGUNDY-edit-rulings.md'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
});
const tb=$('#themeBtn');
function setTheme(t){ document.documentElement.dataset.theme=t; tb.textContent=t==='night'?'☀ day':'☾ night'; try{localStorage.setItem('bill-theme',t);}catch(e){} }
let bootTheme='day'; try{ bootTheme=localStorage.getItem('bill-theme')||'day'; }catch(e){}
setTheme(bootTheme);
tb.addEventListener('click', ()=>setTheme(document.documentElement.dataset.theme==='night'?'day':'night'));
refresh();
</script>
