<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill · BURGUNDY — Everything Outstanding (v2)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%99%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --paper:#f3ead9; --paper-2:#efe4cf; --card:#faf3e6; --ink:#211a14; --ink-soft:#5b4f42;
    --ink-faint:#8a7c69; --rule:#d8c8ab; --oxblood:#7c2130; --red:#b8332c; --gold:#a9853f;
    --green:#4a6741; --blue:#3d5a6e; --purple:#5d4a6e;
    --shadow:0 1px 0 rgba(120,90,40,.08), 0 12px 34px -20px rgba(60,40,20,.55);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --disp:"Hoefler Text","Iowan Old Style",Palatino,Georgia,serif;
    --mono:"SF Mono",ui-monospace,"Menlo","Consolas",monospace;
  }
  html[data-theme="night"]{
    --paper:#171310; --paper-2:#1d1813; --card:#221b15; --ink:#eadfce; --ink-soft:#c3b39a;
    --ink-faint:#8c7c66; --rule:#3a2f24; --oxblood:#d98a92; --red:#e0776d; --gold:#d6b673;
    --green:#8fb283; --blue:#8ab0c4; --purple:#b09ac4;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 14px 40px -22px rgba(0,0,0,.85);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);
    color:var(--ink); font-family:var(--serif); font-size:17.5px; line-height:1.6; padding-bottom:110px}
  .wrap{max-width:860px; margin:0 auto; padding:0 20px}
  header.masthead{padding:52px 0 20px; text-align:center}
  .emblem{display:inline-flex; align-items:baseline; gap:.04em; font-family:var(--disp); font-size:60px; line-height:1}
  .emblem .b{color:var(--ink); font-weight:600; position:relative; padding-bottom:6px}
  .emblem .b::after{content:""; position:absolute; left:2%; right:2%; bottom:0; height:4px; background:linear-gradient(90deg,var(--red),var(--oxblood)); border-radius:2px}
  .spark{color:var(--gold); font-size:24px; transform:translateY(-20px); margin-left:2px}
  .kicker{font-family:var(--mono); font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--ink-faint); margin:20px 0 6px}
  h1.title{font-family:var(--disp); font-weight:600; font-size:36px; line-height:1.1; margin:.1em 0 .15em}
  .byline{font-family:var(--mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--oxblood); margin-top:14px}
  .rule{height:1px; background:linear-gradient(90deg,transparent,var(--rule) 15%,var(--rule) 85%,transparent); margin:28px 0}
  .letter{background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:26px 28px 22px; box-shadow:var(--shadow); position:relative}
  .letter::before{content:"how to use this"; position:absolute; top:-9px; left:22px; background:var(--card); padding:0 10px; font-family:var(--mono); font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--gold)}
  .letter p{margin:0 0 12px} .letter p:last-child{margin-bottom:0}

  /* legend */
  .legend{display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 0}
  .lg{display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); border:1px solid var(--rule); border-radius:20px; padding:4px 11px}
  .lg .sw{width:10px; height:10px; border-radius:3px; display:inline-block}

  /* chapters */
  .chap{margin-top:44px}
  .chap-head{display:flex; align-items:center; gap:12px; background:var(--paper); padding:10px 0; border-bottom:1px solid var(--rule)}
  .chap-head h2{font-family:var(--disp); font-weight:600; font-size:24px; margin:0}
  .chap-head .cnt{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--ink-faint); text-transform:uppercase}

  /* edit cards */
  .ed{background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:16px 18px; margin:14px 0; border-left-width:4px; border-left-style:solid}
  .ed[data-t="age-fix"], .ed[data-t="line-edit"], .ed[data-t="timing-marker"]{border-left-color:var(--gold)}
  .ed[data-t="new-paragraph"]{border-left-color:var(--green)}
  .ed[data-t="new-scene"], .ed[data-t="new-chapter"]{border-left-color:var(--oxblood)}
  .ed[data-t="restructure"]{border-left-color:var(--red)}
  .ed[data-t="flashback-slot"], .ed[data-t="parked"]{border-left-color:var(--purple)}
  .ed[data-t="open-question"]{border-left-color:var(--blue)}
  .ed-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px}
  .pill{font-family:var(--mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; padding:3px 8px; border-radius:20px; border:1px solid var(--rule); color:var(--ink-soft)}
  .pill.type{font-weight:600}
  .ed[data-t="new-scene"] .pill.type, .ed[data-t="new-chapter"] .pill.type{color:var(--oxblood); border-color:var(--oxblood)}
  .ed[data-t="new-paragraph"] .pill.type{color:var(--green); border-color:var(--green)}
  .ed[data-t="restructure"] .pill.type{color:var(--red); border-color:var(--red)}
  .ed[data-t="flashback-slot"] .pill.type, .ed[data-t="parked"] .pill.type{color:var(--purple); border-color:var(--purple)}
  .ed[data-t="open-question"] .pill.type{color:var(--blue); border-color:var(--blue)}
  .ed[data-t="age-fix"] .pill.type, .ed[data-t="line-edit"] .pill.type, .ed[data-t="timing-marker"] .pill.type{color:var(--gold); border-color:var(--gold)}
  .ed h4{font-family:var(--disp); font-weight:600; font-size:19px; margin:0 0 7px; line-height:1.25}
  .ed .prop{margin:0 0 10px; font-size:16px}
  .ed .prop p{margin:0 0 9px}
  .ed .prop p:last-child{margin-bottom:0}
  .ed .prop strong{font-weight:600}
  .ed .prop .lead{color:var(--ink)}
  .ed .prop ul.opts{list-style:none; margin:10px 0 2px; padding:0}
  .ed .prop ul.opts li{position:relative; padding:6px 10px 6px 26px; margin:4px 0; background:var(--paper-2); border:1px solid var(--rule); border-radius:8px; font-size:15px; line-height:1.45}
  .ed .prop ul.opts li:before{content:"▸"; position:absolute; left:9px; top:6px; color:var(--gold)}
  .ed .prop .change{background:var(--paper-2); border:1px dashed var(--rule); border-radius:8px; padding:8px 12px; margin:8px 0; font-size:15px}
  .ed .why{font-size:13.5px; color:var(--ink-faint); font-style:italic; margin:0 0 10px}
  .ed .draft{font-size:14.5px; color:var(--ink-soft); background:var(--paper-2); border:1px dashed var(--rule); border-radius:8px; padding:9px 12px; margin:0 0 10px}
  .ed .draft b{font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:400; display:block; margin-bottom:4px}
  .anchor{font-size:13px; color:var(--ink-faint); margin:0 0 12px; line-height:1.5}
  .anchor .h,.anchor .t{font-style:italic}
  .anchor b{font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; font-style:normal; color:var(--ink-faint); margin-right:4px}
  .anchor .mark{color:var(--oxblood); font-weight:700; font-style:normal; padding:0 3px}

  /* verdict row */
  .verd{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .vbtn{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; padding:7px 14px; border-radius:8px; border:1px solid var(--rule); background:transparent; color:var(--ink-soft); cursor:pointer; transition:.12s}
  .vbtn:hover{border-color:var(--ink-soft)}
  .vbtn.acc.on{background:var(--green); border-color:var(--green); color:var(--paper)}
  .vbtn.rej.on{background:var(--red); border-color:var(--red); color:var(--paper)}
  .cmt{flex:1; min-width:160px}
  .cmt input{width:100%; background:var(--paper); color:var(--ink); border:1px solid var(--rule); border-radius:8px; padding:8px 11px; font-family:var(--serif); font-size:14px}
  .cmt input:focus{outline:none; border-color:var(--oxblood)}

  .bar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--paper); border-top:1px solid var(--rule)}
  .bar-in{max-width:860px; margin:0 auto; padding:11px 20px; display:flex; align-items:center; gap:14px}
  .progress{flex:1; display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:11.5px; color:var(--ink-soft)}
  .track{flex:1; height:6px; background:var(--rule); border-radius:6px; overflow:hidden; max-width:240px}
  .fill{height:100%; width:0; background:linear-gradient(90deg,var(--oxblood),var(--gold)); transition:width .3s}
  button.act{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--oxblood); color:var(--paper); background:var(--oxblood); padding:9px 14px; border-radius:8px; cursor:pointer}
  button.ghost{background:transparent; color:var(--oxblood)}
  .theme-btn{position:absolute; top:16px; right:18px; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); background:transparent; border:1px solid var(--rule); border-radius:20px; padding:5px 11px; cursor:pointer}
  .toast{position:fixed; bottom:70px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0; background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:10px; font-size:13.5px; font-family:var(--mono); transition:.25s; pointer-events:none; z-index:50}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  @media(max-width:640px){ h1.title{font-size:30px} .emblem{font-size:50px} .letter{padding:20px} .ed{padding:14px} }
</style>
</head>
<body>
<button class="theme-btn" id="themeBtn">☾ night</button>
<div class="wrap">
  <header class="masthead">
    <div class="emblem"><span class="b">B</span><span class="spark">✦</span></div>
    <div class="kicker">Bill · your story wizard</div>
    <h1 class="title">BURGUNDY: The Edit Proposal</h1>
    <div class="byline" id="byline"></div>
  </header>

  <div class="letter" id="intro"></div>

  <div class="legend" id="legend"></div>

  <div id="chapters"></div>
</div>

<div class="bar"><div class="bar-in">
  <div class="progress"><span id="pText">0 ruled</span><span class="track"><span class="fill" id="fill"></span></span></div>
  <button class="act ghost" id="accAllBtn" title="accept everything not yet ruled">accept rest</button>
  <button class="act ghost" id="clearBtn">clear</button>
  <button class="act" id="exportBtn">export ↧</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
const DATA = {"intro":"**★ First, the personal one (not the novel):** this FALL, set Henry up to walk his dog every day. He gets a TRACKER, racks up miles, and earns $1 per mile. He wears a little ruck with his iPad and goes out exploring with the dog — makes money, feels motivated, gets exercise. (Logged so it doesn't get lost; ACCEPT to mark it handled, or COMMENT to adjust the deal.)\n\n---\n\n**Everything outstanding for BURGUNDY, in one place.** I pulled together every open item from the three cockpits — the edit proposal, the chapter-1-22 read-through, and the new arc — dropped what Parts 1 & 2 already shipped, and reconciled the overlaps. This is the single list now; q2, q3 and q4 all fold into here.\n\n**How it's laid out:** the big calls sit at the top — the canon and structure decisions (27) and **the new arc** (9 beats: the depot, the dig, the dinners, the militant, Hesta's trust). Below that, everything is grouped **by chapter**, so all the outstanding work for a given chapter is together: the read-through's pending items and **every live reader note** — 90 from Iz and 12 of yours, each read against the current text with my honest verdict and a clear choice.\n\n**158 cards.** Accept means I make the change; comment overrides me. Export when you're done and I execute — same round-trip as before. (Notes already handled in Parts 1 & 2 aren't here; this is only what's still open.)\n\n---\n\n**Updated after the full-manuscript read (Aug 22).** Five new cards lead: Tuck's appearance (young + grown), his personality doctrine, and Burgundy's face. Cards the manuscript has already resolved were dropped (34); stale ones were re-grounded against the current text (40). Your saved rulings carried over.","edits":[{"chapter":"0 · THE BIG CALLS","seq":0.1,"type":"decision","size":"ruling","title":"TUCK'S FACE, PART 1 — young Tuck in the early memories (where the straw-white hair goes)","proposal":"Right now Tuck has zero physical description in the whole book — not one line. You want young Tuck seeded in the early memories: hair the color of light straw, near white-blonde, and tall and lanky even as a kid. Chapter 5 is where all the early-Tuck material lives, and it offers three natural anchors. (A) The birth-story paragraph — Tuck's mother's voice carries it: she's already doing the two-boys-one-birthday routine, and one more punchline about the pale straw hair he got from nobody-knows-where slides in warm and free. (B) The corridor beat — 'there would be Tuck going the other way with a sack of tubers over his shoulder, his knuckles red from the cold storage' — add the straw-white head bobbing above the other kitchen boys; it also quietly plants that he's TALL. (C) The saw-the-wheel reunion at fifteen — Tuck comes around the corner carrying crates of eggs; a half-line that he'd gone up like a ladder since the corridor days, all elbows, the straw hair the same. Bill's lean: B for the first plant (hair + height in one moving image, no scene-stop) plus a whisper at C (the lankiness at fifteen). House-style note: the description should ride an action he's already doing — never a paused portrait.\n\n▸ Accept — Bill drafts B + C as green edits\n▸ Comment — pick a different anchor or write your own line","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":0.2,"type":"decision","size":"ruling","title":"TUCK'S FACE, PART 2 — grown Tuck at the cold storage (your dictated description)","proposal":"Your line, near-verbatim: 'Tuck had grown up still tall, still lanky. His white straw hair had turned a dirty blonde, cut short and utilitarian, and he had a smile that was infectious.' The reconnection scene in ch16 opens in the palace cold storage — Tuck fills a sack of tubers, Burgundy steps out from behind the cheese racks. The natural anchor is the beat after 'Tuck's face softened to something familiar to Burgundy. And he smiled.' Two ways to execute. (A) The whole description lands there as one beat, close to your dictation — the reader gets the grown man in a single frame, four years of change in the frost-light. (B) Split it: the body at the recognition beat (still tall, still lanky, the straw hair gone dirty blonde, cut short for kitchen work), and the SMILE gets its own half-line when he laughs the big laugh two lines later — 'the smile hadn't changed' — so the infectious part is demonstrated by the laugh the page already has, not asserted. Bill's lean: B — it obeys the Cargo Test and the smile pays off inside an action. Bonus texture available if you want it: kitchen-work hands (a burn scar like Ran's forearms — the family trade written on both of them).\n\n▸ Accept — Bill drafts B as a green edit (A on request)\n▸ Comment — adjust the wording or the split","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":0.3,"type":"decision","size":"ruling","title":"TUCK'S PERSONALITY DOCTRINE — codify the joy, then audit every scene against it","proposal":"Your spec: unguarded joy and laughter, always kind of making a joke, always exaggerating, always looking for the amusement in things. The good news — on the page he's already 80% this: 'So YOU'RE the ghost,' the mocking 'I will not talk,' the rat the size of a cat, the barley-liquor scheme delivered like a prank. The gap is the back half: after ch18 ('They took Ran' / 'I know') Tuck goes serious and then vanishes — the existing card about Tuck disappearing in ch22–28 is the structural half of this same problem. Decision: do we canonize the doctrine (Tuck is the book's one unguarded-joy character; his jokes are how he loves people; the jokes get quieter but never stop, even in danger — ESPECIALLY in danger) and then give Bill license to (1) audit every existing Tuck line against it and (2) write him into the back-half chapters as the Tiffins supply line with that voice — the running food-smuggling comedy as his showcase? The one craft risk to rule on: when Ran is taken, does Tuck's joke-engine stall (real grief beat, contrast) or does he joke THROUGH it thinner and braver? Bill's lean: canonize, audit, and let the engine stall exactly once — the night Ran is taken — so the reader learns the jokes were load-bearing.\n\n▸ Accept — doctrine goes into canon + Bill runs the audit\n▸ Comment — adjust the doctrine or the stall-once call","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":0.4,"type":"decision","size":"ruling","title":"BURGUNDY'S FACE — the proposal (his father's coin, his mother's coloring)","proposal":"Your seed: chocolate-brown hair, brown eyes, olive skin, tall but not Tuck-tall. Bill's proposal for how to make that MEAN something: the book already owns a canonical fact about his face — Ran recognizes him because 'his face was on the coin in Ran's own pocket' (the King's face, stamped young). So: Burgundy has his father's features — the jaw, the brow, the coin-shape that makes strangers stop — under his mother's coloring: the chocolate-brown hair, the brown eyes, the olive skin that no fourth-generation Dross clansman has. His face is literally both parents' machines at once — the boy who yearns to be SEEN carries a face where everyone sees someone else: the city sees the coin, his father sees the heir, and only Mira sees her own family looking back. That's the emotional core made visible, and it costs nothing — it's already half-canon. Height: shorter than Tuck lands free in the ch16 cold-storage beat ('still tall' does the math for the reader). Rule on the concept first; placement is the next card.\n\n▸ Accept — the coin-under-coloring concept becomes canon\n▸ Reject — different concept, tell Bill the direction\n▸ Comment — your own version","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":0.5,"type":"decision","size":"ruling","title":"BURGUNDY'S FACE — where it enters (and does olive skin read as cartel blood?)","proposal":"Two placement questions. FIRST, where the reader gets him: (A) The two-boys frame in ch5 — one image of the pair in the kitchens, straw-pale Tuck and the dark olive prince, the contrast doing both descriptions in one stroke. (B) The coin beat at Ran's in ch7 — Ran looks from the young King's face on the coin to the boy at his counter; one line gives us the features-under-different-coloring. (C) A Mira beat — she touches his hair or sees her family in him once, early. (D) Some or all of the above as tiny touches, never a portrait. Bill's lean: A + B (the contrast plants it, the coin confirms it; no mirrors, ever). SECOND, the worldbuilding edge you should rule on deliberately: if his coloring is visibly Mira's, does a sharp eye on Dross read olive skin as OFF-WORLD — as cartel blood? That has real plot weight: it sharpens every disguise scene (the scarf isn't hiding a famous face, it's hiding a face that doesn't belong), and it gives Hesta's people one more reason to distrust him on sight. Or Dross is mixed enough that coloring carries no signal and only the coin-face is dangerous. Bill's lean: the coloring reads — it makes the scarf scenes tighter and hands the resistance a free beat of earned suspicion.\n\n▸ Accept — A + B placement, and the coloring reads as off-world\n▸ Comment — adjust placement or the coloring-signal call","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":1,"type":"decision","size":"ruling","title":"NAME: the space-doors (not \"port\", not \"space door\")","proposal":"The massive circular megastructures that rip open + hold a wormhole (supernova-powered, osmarine-held). You didn't love \"port\" or \"space door.\" Options grounded in the physics — pick one or riff: (A) The Aperture / an Aperture. (B) The Throat (the physics term for a wormhole's neck — stark, bodily). (C) The Lock (canal-lock resonance — a passage you pass through; pairs with \"the door stays locked open\"). (D) The Seam. (E) The Conjunction / a Conjunction-gate. (F) named per its star — \"the Ros Gate.\" Bill's lean: THE LOCK (canal + held-open double meaning). COMMENT with your pick.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":2,"type":"decision","size":"ruling","title":"NAME: Burgundy's ruling clan (V-start, not too magical)","proposal":"The clan Nicholas installed 84 years ago; Burgundy is its 4th generation. You wanted a V, not-magical. Options: (A) Clan VESK. (B) Clan VORNE. (C) Clan VOSS. (D) Clan VANTREL. (E) Clan VIRE. (F) Clan VARO. (G) Clan VESNIK. Bill's lean: VOSS (hard, plain, planetary) or VANTREL (a touch more dynastic). Note: the King's name is currently \"Vorran\" — pick a clan name that doesn't collide. COMMENT with your pick, or a different letter.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":3,"type":"decision","size":"ruling","title":"NAME: the \"red phone\" (Cold-War hotline device)","proposal":"The comms device in the King's lounge — the only channel to Nicholas, with a color-coded escalation ladder (code red → Shanti). Not a literal red telephone. Options: (A) The Line. (B) The Recourse. (C) The Hotline (plain, Cold-War-honest). (D) The Petition. (E) The Escalation. (F) The Redoubt-line / the Redline (the color survives as the top tier: \"going redline\"). Bill's lean: THE REDLINE — keeps your red, verbs nicely (\"he went redline\"), and the ladder tiers are colors. COMMENT.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":4,"type":"decision","size":"ruling","title":"RULING: how much to fudge the space-door physics","proposal":"The research grounds it in real theory (traversable wormholes need exotic matter to hold the throat = osmarine's job; supernova energetics ~10^44 J = the tear; Chandrasekhar-limit \"tipping\" a marginal star = the trigger; canal/chokepoint economics = the ~71 doors). The honest fudges: harnessing/channeling a whole supernova, and \"coaxing\" a star over the edge on demand. Bill's recommendation: keep the TRAPPINGS rigorous (characters speak of throats, exotic mass, the Chandrasekhar edge, the door's frame) and let the two big cheats stay off-page / stated once as accepted history.\n\n▸ Accept — that level.\n▸ Comment — go harder/softer. (Full physics bible on your Desktop.)","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":5,"type":"decision","size":"ruling","title":"REFRAME: osmarine is what HOLDS THE DOORS OPEN (not \"enables star travel\")","proposal":"Per your note we killed the too-Dune line — and the door framing is already live in the manuscript: Gitz's ch10 lecture (\"You couldn't hold a door open in space long enough to cross the galaxy. Osmarine is what holds them open.\") and Burgundy's ch14 research (\"the thing that kept doors in space open\") both run on doors now. One survivor of the old framing: the King's ch1 dinner boast, \"Our ores make travel between the stars possible.\" Bill's lean: KEEP it — it's the father's simplified propaganda, and ch10 quietly corrects it under the boy's feet, which is better than consistency.\n\n▸ Keep — the ch1 boast stays as the father's shorthand.\n▸ Rewrite — Bill re-lines the boast to the door framing too (green suggestion).","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":6,"type":"decision","size":"ruling","title":"THE STRIKE CAUTIONARY TALE: the uniquely-Nicholas cruelty","proposal":"Grandpa once used the lowest tier of the red phone (a mine strike the domestic force couldn't break). Nicholas's people came and did something uniquely cruel — NOT just \"mowed them down.\" THE RESEARCH FOUND A GROUNDED ANSWER (from King Leopold's Congo, where the signature atrocity was an accounting rule — a severed hand per spent bullet, because the arms-supplier metered munitions and wouldn't trust the local force with unaccounted weapons). Bill's recommendation: \"the Listen + the Meter.\" Nicholas installs (a) a pervasive SURVEILLANCE instrument that hands the King power to hear the people's own words (feeds his control-by-listening doctrine), AND (b) a MUNITIONS-METERING regime — every round issued to the King's men must be reconciled crate-by-crate on the Vicentennial cadence, because Nicholas is an arms-maker who fears his proxy hoarding force for a mutiny. It empowers the King's oppression precisely by making him ACCOUNT to Nicholas for every gram of force — and it foreshadows Burgundy building an army of drill-robots that appears on no ledger at all. And the tribute rose after, and never came down.\n\n▸ Accept — the Listen + the Meter.\n▸ Comment — pick one, or your own.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":7,"type":"decision","size":"ruling","title":"SPEC: the weapons depot arsenal (what's actually in there)","proposal":"Nicholas's on-planet bunker of the clan's disbanded Civil-War military — the thing the resistance quietly empties. You wanted tactical/conventional, NOT WMD, and feasibly under front-heavy / back-unguarded security. Bill's spec: bulk small arms + ammunition, crew-served weapons, armored ground platforms (tanks/walkers), tube & rocket artillery, air-defense batteries, munitions/explosives stores — sealed and racked, guarded hard at the single front entry, zero rear security because it's buried in dead tunnels nothing could breach (until antimatter drills).\n\n▸ Accept — that spec.\n▸ Comment — adjust the loadout.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":8,"type":"decision","size":"ruling","title":"The vassal-planet roster (what each world provides)","proposal":"The system's vassal planets each export ~one thing as tribute; trade among them existed before Nicholas, extortion after. Confirmed: Ros = minerals/osmarine; the ocean world = seafood protein (99% ocean, 87 islands, vacuum-cold cargo). Bill proposes (transposed from real single-resource colonies): a timber/biomass world, a heavy-metals world, a rare-earth/refining world, an agri/calorie world (the sugar-analogue), and a transit/broker world that skims every cargo.\n\n▸ Accept — build the roster from these.\n▸ Comment — your worlds. (Full economics bible on your Desktop.)","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":9,"type":"decision","size":"ruling","title":"STRUCTURE: pick the escalation approach for the middle (4 paths coming)","proposal":"I ran a deep structural study (Harry Potter / Hunger Games / Dune / Monte Cristo / Baru Cormorant) and designed FOUR distinct architectures for the tunnels→climax middle — visualized side-by-side on the OUTLINE HUB (mycoldmars.com/burgundy/outline), under these names: (1) THE PAGE THAT HEARS — the household ledger is the master clock; the King's listening network is structurally deaf to machines, and the finance audit is the only sense-organ he has; (2) THE LAST PAGE OF THE SYLLABUS — the training rotations are a two-stage fuse, curriculum-as-clock; (3) CROWNED ABOVE, BREAKING BELOW — the depot-emptying doomsday count running under the ceremony; (4) THE SEEN BOY (hardened) — the emotional arc drives everything, recognition on the same wire as concealment. This card is where you tell me which one (or which blend) to build the middle around.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":10,"type":"decision","size":"ruling","title":"The 20th-birthday time-bomb: what forces the war?","proposal":"The middle needs a hard clock: something scheduled for the Vicentennial (20th birthday) that would EXPOSE the workshop / South-12 and force Burgundy to move first. Bill's candidate: the rite includes a ceremonial full SURVEY/mapping of the palace's under-tunnels (an old tradition — the new prince is shown \"the whole of what he'll rule\"), which would walk the King's people straight into the robot-dug tunnel and the factory. So the revolution must break BEFORE the survey.\n\n▸ Accept — that device.\n▸ Comment — your time-bomb.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":11,"type":"decision","size":"ruling","title":"Does Burgundy volunteering to run the ledger audit read as too convenient?","proposal":"You flagged this: the father gripes that Mira is over-spending (steel, tracks, bearings, hydraulic arms), sends a finance minister to audit — and Burgundy, who knows it's all for HIM, wants to deflect, maybe by volunteering to run the investigation himself. Bill's read: him volunteering outright IS a little convenient/suspicious (a prince asking to audit his own mother reads as odd to the King). Stronger: Burgundy doesn't volunteer — he QUIETLY sabotages from inside (befriends/feeds the finance minister false leads, or gets Mira to reroute the worst orders through a clean broker) so the audit keeps almost-finding-it. That's the Baru Cormorant move and it's far more tense.\n\n▸ Accept — the quiet-sabotage version.\n▸ Comment — keep the volunteer version / your idea.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":12,"type":"decision","size":"ruling","title":"NAME/ROLE: who is the militant, and who is the Ghai depot-navigator?","proposal":"Two resistance roles have largely cast themselves since this card was written — this is now a confirm-or-redirect. (1) THE MILITANT: canon (08-07) gives him the arc suspicion → earned trust → \"why don't we put weapons on them?\", and the working default is SKORN — already on the page with a backstory: his grandfather led the eleven-day strike, the tally-book of names kept through the flogging years, two of the six your father's men took are his friends (ch22). That replaces the earlier \"father killed brutally\" note. Moss, the silent ex-soldier, is the one who confirms arming them is militarily feasible. (2) THE GHAI NAVIGATOR: she exists too — MAREN, the old lantern-keeper who takes the party down (ch22). But since the depot's location now comes from Burgundy's map-room find (the \"storage\" rectangle, 08-07), Maren's role narrows to the old-tunnel ROUTE the dig follows — not knowing where the depot is.\n\n▸ Accept — Skorn the militant (strike-book backstory), Moss the feasibility voice, Maren the route-knowledge.\n▸ Comment — recast (e.g. restore the murdered-father drive to Skorn, merge roles, or give Maren the depot knowledge instead of the map room).","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":13,"type":"decision","size":"ruling","title":"NAME: the rival that fueled the LOSING side of the Great Rupture","proposal":"The clan won the proxy war because Nicholas backed them. The OTHER side was backed by a rival Core-adjacent power — a second East-India-Company-type corporate machine competing with Nicholas for the newly-opened backwater. Naming it (and keeping it faintly alive — a defeated claimant, a corporate competitor still lurking) gives the history teeth and a future threat. Bill's options on your nod.\n\n▸ Accept — Bill names the rival + defines its residue.\n▸ Reject — leave it unnamed backstory. COMMENT.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":14,"type":"decision","size":"ruling","title":"STRUCTURE: the two new TRAINING chapters — where do they go?","proposal":"The training-rhythm middle replaces the tutor-flashbacks (to be deleted — the parked tutor-memory slots in ch9/ch11 and the stray tutor mentions go with them). The integration map on the outline hub stages it as THREE new rotation chapters plus reworks: NEW ch10 THE ARCHIVES (the old bearded archivist → the Great Rupture history), NEW ch11 THE VASSAL WORLDS (Minister Schwartz / External Affairs → what each world provides), NEW ch14 THE ARSENAL (the defense minister → the depot + the red phone as \"boring training facts\"), with the Custom House reworked into rotation 3 (Gitz/trade), the Preserve fused into rotation 5 (Oz), and downstream renumbered.\n\n▸ Accept — Bill inserts the three rotation chapters per the map + deletes the tutor flashbacks.\n▸ Comment — different placement, fewer chapters, or fold the material into existing chapters instead.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":15,"type":"decision","size":"ruling","title":"Delete ALL tutor-flashbacks — confirm (incl. the ch2 'where's his fleet' exchange)?","proposal":"You said delete all tutor-flashbacks and learn the geopolitics through TRAINING instead. In the current text that means: the ch2 tutor exchange (\"Where does he keep his fleet\" / \"We do not have that on the chart\") is still LIVE prose in ch2's opening — and three tutor-memory slots are still PARKED awaiting your content (ch9 the stale disc, ch9 the foundry mark, ch11 the robot's tally). Confirming this ruling cuts the ch2 flashback and retires those three slots, so don't write content for them. Bill's recommendation: delete the flashback FORM everywhere; migrate their best content into the rotation scenes; keep the ch2 exchange's CHILL only if it becomes a live training beat, else cut.\n\n▸ Accept — delete all tutor-flashbacks (incl. the live ch2 exchange), retire the three parked slots, migrate content to training.\n▸ Comment — keep specific ones.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":16,"type":"decision","size":"ruling","title":"Tuck in the back half — right now he vanishes (ch22–28)","proposal":"The emotional spine leans on Tuck, and the new outline already threads him through the back half (ch26 'Bread and Iron' runs the Hollow food operation via — hold this triage\n▸ Reject — I want more of the system on the page COMMENT","head":"","tail":"","rationale":"the single biggest lever on Red-Rising-vs-Dune","draft":""},{"chapter":"0 · THE BIG CALLS","seq":20,"type":"decision","size":"ruling","title":"RHYTHM: point-of-view quarantine — no fact reaches the reader unless a character needs it now","proposal":"Stay in close third, but hold the discipline of a tight POV: backstory and worldbuilding arrive ONLY as triggered memory or present need, never as narration. This is not a rewrite to first person; it is a rule we enforce line by line.\n\n▸ Accept — hold the quarantine rule\n▸ Reject — allow narrated exposition COMMENT","head":"","tail":"","rationale":"how Hunger Games/Red Rising stay readable at depth","draft":""},{"chapter":"0 · THE BIG CALLS","seq":22,"type":"decision","size":"ruling","title":"FLOW: the kick became a push — but ch9/ch14/ch18/ch21 still say \"kicked\"","proposal":"Per your King doctrine, ch2 now ends on a brake-check PUSH, not an angry kick. But at least four later lines recall it as a kick: \"the robot his father kicked\" (ch9/10), \"Machines too finished to kick\" (ch14), \"his father had kicked it\" (ch18/21). A reader who watched the gentle push then reads \"kicked\" as a harder act. Bill's recommendation: KEEP the push in ch2 and keep \"too finished to kick\" (it's a great button) by seeding one line in ch2's aftermath where Burgundy privately thinks of the push AS a kick — then every later \"kick\" is his earned bitter shorthand.\n\n▸ Accept — Bill adds that one seeding line + leaves later lines.\n▸ Reject — change all later \"kick\" lines to \"pushed/set his boot against.\"\n▸ Comment — your call.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":23,"type":"decision","size":"ruling","title":"FLOW: ch2's King now pre-says Oz's surveillance reveal (ch11-12)","proposal":"Confirmed what your doctrine md asked me to check: the new ch2 has the King spell out the informant mechanism in his own mouth (\"who's short on his rent, who's angry at his shift boss, who's been asking questions he oughtn't\" / \"I want to know\"). Oz's hunt scene (ch11-12) is built to REVEAL exactly that to Burgundy as new — so it now lands a principle the reader already owns, softening the detonation. Your md's own fallback: \"soften those specifics and let Oz's chapter do them.\" Bill's recommendation: TRIM the three concrete informant specifics from ch2, keep the philosophy (\"a foreman walks a seam to read his men... I know what is moving under it before it moves\").\n\n▸ Accept — Bill trims ch2 to principle-level, Oz keeps the machinery.\n▸ Reject — keep ch2 as-is (accept the early seed).\n▸ Comment — your framing.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":24,"type":"decision","size":"ruling","title":"FLOW: King \"seethes\"/rages in ch8 & ch13 — clashes with presumptuous-not-temperamental","proposal":"Now that the King is locked as presumptuous, never raging (\"he corrects, he never rages\"), one beat still reads wrong: ch8 has him seething at sixteen-year-old Burgundy (\"He was sixteen, he seethed… no more of the cook's boy\"). The other hot moment — Mira's ch13 memory of him yelling and breaking a vase over the Essa medicine — is explicitly framed as unprecedented (\"I had seen him angry before. I had never seen him like that\"), so it can stand as the marked exception that proves the doctrine. Bill's recommendation: re-key ch8's \"seethed\" to cold verdict register (\"he informed him, flatly\"); keep ch13's vase story as the one marked exception.\n\n▸ Accept — fix ch8, keep ch13's vase as the marked exception.\n▸ Reject — keep both as-is (a father CAN rage once about his son).\n▸ Comment — per scene.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":25,"type":"decision","size":"ruling","title":"FLOW: the want-engine Vicentennial fantasy echoes across ch1, ch9, ch14","proposal":"The \"finished machines on the Kings' Hall floor at the Vicentennial, too finished to dismiss, his father forced to see\" fantasy appears in ch9 (first ignition) and again ch14 (fuller), plus the ch1 want-seed plants it and ch1/ch14 both open on \"going to be king / never the question / no other outcome.\" It's a deliberate recurring engine, but currently the wording is close enough to read as reprint. Bill's recommendation: let ch9 be the tentative first ignition, ch14 the harder return (rephrase so it reads as a RETURN not a reprint), ch1 the plant.\n\n▸ Accept — Bill differentiates the wording across the three.\n▸ Reject — leave (it's meant to recur). COMMENT.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":26,"type":"decision","size":"ruling","title":"FLOW: \"craft\" lands 5× in ch1-2; the pitch figure is verbatim in ch1 & ch2","proposal":"Two small polish items from the read. (1) \"Craft\" appears 5 times across the two opening chapters (3 inside ch2's proclamation) — the two-crafts rivalry is strong but the word is dense; trimming one or two tightens it. (2) The pitch figure \"tooled properly, at scale... a third more ore inside a year\" runs nearly verbatim in ch1 interior AND ch2 spoken — intentional (he rehearsed it) but so verbatim it can read as a repeat rather than a callback. Bill's recommendation: trim one \"craft\", and vary the ch1 interior figure slightly so the ch2 spoken pitch lands fresh.\n\n▸ Accept — light trims.\n▸ Reject — keep (the rehearsed-line echo is deliberate).","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":27,"type":"decision","size":"ruling","title":"Audio: chapters changed — regenerate narration now or wait?","proposal":"The Author's Edition audio is stale — ch1, ch2, ch4 were fully rewritten and other chapters changed. Regenerating costs ElevenLabs credits. Bill's recommendation: WAIT until you've accepted the remaining green suggestions and ruled these cards, then narrate the final text once (so we pay for final only).\n\n▸ Accept — wait.\n▸ Comment — regenerate specific chapters now (name them).","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"0 · THE BIG CALLS","seq":301,"type":"new arc","size":"ruling","title":"The militant — who is he?","proposal":"**One of the resistance distrusts Burgundy first, then commits hardest — and later says \"why don't we put weapons on the machines?\"** The codex already has two men who could carry that: **Skorn** (a hard, quiet miner-organizer, principled suspicion of Burgundy — the moral center of the room) and **Moss** (a silent ex-soldier whose military past does his talking).\n\nThe distrust arc fits Skorn. The weaponize instinct fits a soldier. My instinct: **Skorn is the militant** (suspicion → earned trust → \"arm them\"), and **Moss** is the one who confirms in the debate that it's actually feasible — the two of them are the hawk and the armorer.\n\n▸ Skorn is the militant — Moss backs the feasibility (my recommendation)\n▸ Moss is the militant — the ex-soldier wants the guns\n▸ Merge them into one character — tell me which name\n▸ Comment","head":"","tail":"","rationale":"casting the distrust→militant arc","draft":""},{"chapter":"0 · THE BIG CALLS","seq":302,"type":"new arc","size":"big","title":"Hesta's trust moment — the hinge of the alliance","proposal":"**The trust hinge got written — with different logic than you dictated.** Ch21 stages the first-sighting decision (\"I'll hear you out. Once. Properly.\") and ch22 stages the full decision at the Hollow, where Hesta's spoken reasoning is now the vetted-liar wager: *\"I had his story walked back… The boy lies… never once, in any of it that we could reach, has a lie of his cost anyone below him anything. That's a strange kind of liar… It isn't trust. Trust is years. It's a wager, and I'm the one placing it.\"* Your dictated logic — the sheer insanity of the sole heir walking down unarmed into a room where she could kill him and no one could stop her — isn't in the text. The two are compatible: the insanity observation can open the wager speech as the thing that made her go check his story at all.\n\n▸ Braid it in — the unarmed-heir insanity as the opening of her wager speech, when ch22 is reworked to full (my recommendation)\n▸ Swap it in — replace the walked-his-story-back logic with your dictated reasoning\n▸ Keep the wager as written — this card is settled\n▸ Comment","head":"","tail":"","rationale":"the alliance hinge · first meeting","draft":""},{"chapter":"0 · THE BIG CALLS","seq":304,"type":"new arc","size":"big","title":"The militarization debate + the depot reveal","proposal":"**The debate is in the plan — but the depot knowledge flows the other way.** The standing outline gives Burgundy the depot in training first (ch14, The Arsenal: \"THE DEPOT LESSON + THE RED PHONE,\" from the defense minister), and at the Hollow debate (ch30) it's *Burgundy* who resists arming — \"any armed rising triggers Nicholas's depot force\" — while Maren realizes she knows where the depot sits. Your dictation runs it the other way: Hesta shuts the debate down and reveals the depot to Burgundy, location unknown. The two can't both stand.\n\n» Whoever holds the depot card first decides whether the council probe and the map room (next two cards) exist at all.\n\n▸ Keep the outline's flow — Burgundy learned it at the Arsenal rotation and cites it; Hesta's beat becomes her confirming it from the resistance side (my recommendation)\n▸ Your dictation wins — Hesta reveals it cold; strip the depot from the ch14 lesson\n▸ Comment — and tell me which chapter this sits after","head":"","tail":"","rationale":"raises the depot · sets the hunt","draft":""},{"chapter":"0 · THE BIG CALLS","seq":305,"type":"new arc","size":"medium","title":"The council probe — fishing without showing const esc = s => (s==null?'':String(s)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const inlineMd = s => esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');
function renderProp(s){
  if(!s) return '';
  let out=''; let opts=[];
  const flush=()=>{ if(opts.length){ out+='<ul class="opts">'+opts.map(o=>'<li>'+inlineMd(o)+'</li>').join('')+'</ul>'; opts=[]; } };
  for(const block of String(s).split(/\n\n+/)){
    const b = block.trim(); if(!b) continue;
    const lines = b.split(/\n/).map(l=>l.trim()).filter(Boolean);
    if(lines.length && lines.every(l=>/^▸\s+/.test(l))){ for(const l of lines) opts.push(l.replace(/^▸\s+/,'')); continue; }
    flush();
    if(/^»\s+/.test(b)){ out+='<div class="change">'+inlineMd(b.replace(/^»\s+/,''))+'</div>'; continue; }
    out += '<p'+(out?'':' class="lead"')+'>'+inlineMd(b).replace(/\n/g,'<br>')+'</p>';
  }
  flush();
  return out;
}

});

function ruled(id){ const s=R[id]||{}; return !!(s.v || (s.c && s.c.trim())); }
const doneSet = new Set(edits.filter(e=>ruled(e.id)).map(e=>e.id));
function refreshBar(){
  $('#pText').textContent = doneSet.size+' of '+total+' ruled';
  $('#fill').style.width=(total?doneSet.size/total*100:0)+'%';
}
function refresh(){ doneSet.clear(); edits.forEach(e=>{ if(ruled(e.id)) doneSet.add(e.id); }); refreshBar(); }
let saveTimer=null;
function persist(){ localStorage.setItem(KEY, JSON.stringify(R)); }
function persistSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(persist, 400); }
window.addEventListener('beforeunload', persist);
window.addEventListener('pagehide', persist);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') persist(); });
function updateOne(id){ if(ruled(id)) doneSet.add(id); else doneSet.delete(id); refreshBar(); }
function save(){ persist(); refresh(); }

document.body.addEventListener('click', ev=>{
  const b=ev.target.closest('.vbtn'); if(!b) return;
  const id=b.dataset.id, v=b.dataset.v;
  R[id]=R[id]||{};
  R[id].v = R[id].v===v ? null : v;
  const card=document.querySelector('.ed[data-id="'+id+'"]');
  card.querySelectorAll('.vbtn').forEach(x=>x.classList.toggle('on', x.dataset.v===R[id].v));
  updateOne(id); persist();
});
document.body.addEventListener('input', ev=>{
  const inp=ev.target.closest('.cmt input'); if(!inp) return;
  const id=inp.dataset.id; R[id]=R[id]||{}; R[id].c=inp.value;
  updateOne(id); persistSoon();
});
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1900); }

$('#accAllBtn').addEventListener('click', ()=>{
  edits.forEach(e=>{ if(!ruled(e.id)){ R[e.id]=R[e.id]||{}; R[e.id].v='accept'; } });
  document.querySelectorAll('.ed').forEach(card=>{
    const id=card.dataset.id; card.querySelectorAll('.vbtn').forEach(x=>x.classList.toggle('on', x.dataset.v===(R[id]&&R[id].v)));
  });
  save(); toast('accepted the rest');
});
$('#clearBtn').addEventListener('click', ()=>{
  if(!confirm('Clear all your rulings?')) return;
  R={}; localStorage.removeItem(KEY);
  document.querySelectorAll('.vbtn').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.cmt input').forEach(i=>i.value='');
  refresh(); toast('cleared');
});
$('#exportBtn').addEventListener('click', async ()=>{
  let md='# BURGUNDY — Johnny\'s rulings on the Edit Proposal\n\n';
  chapOrder.forEach(c=>{
    md+='\n## '+(String(c).match(/^\d+$/)?'Chapter '+c:c)+'\n';
    groups[c].forEach(e=>{
      const s=R[e.id]||{};
      md+='\n### '+e.title+' ['+(TYPE_LABEL[e.type]||e.type)+' · '+e.size+']\n';
      md+='- **Verdict:** '+(s.v?s.v.toUpperCase():'_(unruled)_')+'\n';
      if(s.c&&s.c.trim()) md+='- **Johnny:** '+s.c.trim()+'\n';
    });
  });
  try{ await navigator.clipboard.writeText(md); toast('copied — paste it back to Parley'); }catch(e){ toast('downloaded'); }
  const blob=new Blob([md],{type:'text/markdown'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='BURGUNDY-edit-rulings.md'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
});
const tb=$('#themeBtn');
function setTheme(t){ document.documentElement.dataset.theme=t; tb.textContent=t==='night'?'☀ day':'☾ night'; try{localStorage.setItem('bill-theme',t);}catch(e){} }
let bootTheme='day'; try{ bootTheme=localStorage.getItem('bill-theme')||'day'; }catch(e){}
setTheme(bootTheme);
tb.addEventListener('click', ()=>setTheme(document.documentElement.dataset.theme==='night'?'day':'night'));
refresh();
</script>
