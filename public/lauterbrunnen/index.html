<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lauterbrunnen — the menu</title>
<meta name="description" content="A simple menu of hikes and days out from Wengen, Lauterbrunnen valley. Every place links to its trail or map." />
<meta name="theme-color" content="#16140F" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="canonical" href="https://mycoldmars.com/lauterbrunnen/" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="mycoldmars" />
<meta property="og:title" content="Lauterbrunnen — the menu" />
<meta property="og:description" content="A simple menu of hikes and days out from Wengen. Every place links to its trail or map." />
<meta property="og:url" content="https://mycoldmars.com/lauterbrunnen/" />
<meta property="og:image" content="https://mycoldmars.com/lauterbrunnen/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Lauterbrunnen — the menu" />
<meta name="twitter:description" content="Hikes and days out from Wengen, with a trail or map link for each." />
<meta name="twitter:image" content="https://mycoldmars.com/lauterbrunnen/og.png" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz@0,6..72;1,6..72&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFAF6; --paper-2:#F3F1EA; --surface:#fff;
    --ink:#16140F; --ink-2:#46413A; --ink-3:#7C766B; --ink-faint:#A8A296;
    --line:#E6E2D9; --line-2:#D7D2C7;
    --red:#D42A1C; --red-ink:#B01E12; --red-bg:#FBEDEB;
    --trail:#2F7D4F; --trail-bg:#EEF5EF; --trail-line:#BFDCC8;
    --map:#2563C9; --map-bg:#EDF2FC; --map-line:#C6D6F2;
    --gold:#B07A1E;
    --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --serif:"Newsreader",Georgia,serif;
    --mono:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,monospace;
    --r-sm:6px; --r-md:10px; --r-pill:999px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.5}
  ::selection{background:var(--red);color:#fff}
  a{color:inherit}
  .wrap{max-width:720px;margin:0 auto;padding:0 22px}

  /* header */
  header{padding:54px 0 30px;border-bottom:1px solid var(--line)}
  .kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--red-ink);font-weight:600;display:flex;align-items:center;gap:9px}
  .kicker::before{content:"";width:22px;height:2px;background:var(--red)}
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(36px,7vw,52px);line-height:1.0;letter-spacing:-.02em;margin:16px 0 0}
  h1 em{font-style:italic}
  .lede{font-size:16px;color:var(--ink-2);line-height:1.6;margin:16px 0 0;max-width:52ch}
  .basebar{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .homebase{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);padding:7px 13px;border-radius:var(--r-pill)}
  .homebase b{color:var(--ink);font-weight:600}
  .homebase .dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px var(--red-bg)}
  .legend{font-family:var(--mono);font-size:11px;color:var(--ink-3);display:inline-flex;align-items:center;gap:14px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend .sw{width:9px;height:9px;border-radius:50%}

  /* menu list */
  .menu{padding:8px 0 60px}
  .entry{padding:34px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:54px 1fr;gap:8px 20px}
  .entry:last-child{border-bottom:none}
  .num{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--ink-faint);padding-top:7px}
  .ehead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .etitle{font-family:var(--serif);font-size:25px;font-weight:500;letter-spacing:-.01em;line-height:1.12}
  .emeta{display:flex;gap:7px;align-items:center;flex-shrink:0;padding-top:5px}
  .dist{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink-2);background:var(--paper-2);border:1px solid var(--line);padding:5px 10px;border-radius:var(--r-pill);white-space:nowrap}
  .pick{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);background:#FBF3E2;border:1px solid #ECD9A8;padding:5px 9px;border-radius:var(--r-pill);white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
  .edesc{grid-column:2;font-size:15.5px;line-height:1.62;color:var(--ink-2);margin:11px 0 0}
  .edesc strong{color:var(--ink);font-weight:600}

  /* chips */
  .chips{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .chip{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;font-weight:500;padding:8px 13px;border-radius:var(--r-pill);text-decoration:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);transition:transform .12s,box-shadow .15s,border-color .15s}
  .chip:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(22,20,15,.1);border-color:var(--ink-3)}
  .chip svg{width:14px;height:14px;flex-shrink:0}
  .chip .tag{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
  .chip.trail{background:var(--trail-bg);border-color:var(--trail-line);color:#1F5938}
  .chip.trail svg{color:var(--trail)}
  .chip.trail .tag{color:var(--trail)}
  .chip.place{background:var(--map-bg);border-color:var(--map-line);color:#1B4894}
  .chip.place svg{color:var(--map)}
  .chip.place .tag{color:var(--map)}
  .chip.rec{box-shadow:0 0 0 1.5px var(--gold)}
  .chip .star{color:var(--gold);font-size:11px}

  footer{padding:0 0 60px}
  .foot{border-top:1px solid var(--line);padding-top:22px;font-family:var(--mono);font-size:11px;color:var(--ink-faint);line-height:1.7}

  @media(max-width:560px){
    header{padding:40px 0 24px}
    .entry{grid-template-columns:1fr;gap:0}
    .num{padding-top:0;margin-bottom:6px}
    .etitle{font-size:22px}
    .edesc,.chips{grid-column:1}
    .legend{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Lauterbrunnen Valley · Bernese Oberland</div>
    <h1>The <em>menu</em></h1>
    <p class="lede" id="lede">Hikes and days out from Wengen. Each one is a little plan — tap a green chip for the trail on AllTrails, a blue chip for the spot on Google Maps.</p>
    <div class="basebar">
      <span class="homebase"><span class="dot"></span>Home base · <b>Wengen</b></span>
      <span class="legend">
        <span><span class="sw" style="background:#2F7D4F"></span>AllTrails</span>
        <span><span class="sw" style="background:#2563C9"></span>Google Maps</span>
      </span>
    </div>
  </header>

  <main class="menu" id="menu"></main>

  <footer><div class="foot" id="foot">A menu in progress · more entries coming.</div></footer>
</div>

<script>
// ===== ICONS =====
const ICON_TRAIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>';
const ICON_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>';
const gmaps = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);

// ===== MENU DATA — edit/extend this array to add entries =====
const ENTRIES = [
  {
    n: 1,
    title: "Cable car → 3-mile hike → train",
    dist: "≈3 mi",
    desc: "Cable car from Wengen up to Männlichen, then this hike brings you along the ridge to Kleine Scheidegg. From there you can take the train down into Grindelwald, or back to Wengen.",
    links: [
      { kind:'trail', label:"Männlichen → Grindelwald route", url:"https://www.alltrails.com/explore/custom-routes/copy-mannlichen-to-grindelwald-d5ffa58" },
      { kind:'place', label:"Männlichen", url: gmaps("Männlichen, Switzerland") },
      { kind:'place', label:"Kleine Scheidegg", url: gmaps("Kleine Scheidegg, Switzerland") },
      { kind:'place', label:"Grindelwald", url: gmaps("Grindelwald, Switzerland") },
    ],
  },
  {
    n: 2,
    title: "Head to Mürren",
    dist: "≈2.5 mi walk",
    desc: "You'll get a train from Wengen down to Lauterbrunnen. From there, there's a cable car that brings you up the other side of the valley to Grütschalp. Once you get up there you can either train or walk to Mürren — the walk is about 2.5 miles (≈4 km, ~1h15, mostly flat).",
    links: [
      { kind:'place', label:"Lauterbrunnen", url: gmaps("Lauterbrunnen, Switzerland") },
      { kind:'place', label:"Grütschalp (cable car top)", url: gmaps("Grütschalp, Lauterbrunnen, Switzerland") },
      { kind:'trail', label:"Grütschalp → Mürren walk", url:"https://www.alltrails.com/trail/switzerland/bern/murren-grutschalp" },
      { kind:'place', label:"Mürren", url: gmaps("Mürren, Switzerland") },
    ],
  },
  {
    n: 3,
    title: "North Face Trail",
    dist: "≈4 mi (can shorten)",
    pick: true,
    desc: "The most spectacular of all the hikes. This one is 4 miles, but you can make it shorter. From Mürren you can take the funicular up to Allmendhubel and then hike around the North Face Trail back down to Mürren. Or — and this is what I recommend — follow the signs to Gimmelwald, a really beautiful tiny village. You can stop for a meal at this perfect little place, Pension Gimmelwald. If you do go to Gimmelwald there's a cable car that brings you back to Mürren, or takes you to the valley floor to head back toward Wengen.",
    links: [
      { kind:'trail', label:"North Face Trail (Mürren loop)", url:"https://www.alltrails.com/trail/switzerland/bern/northface-trail-murren" },
      { kind:'trail', label:"Allmendhubel → Gimmelwald", rec:true, url:"https://www.alltrails.com/trail/switzerland/bern/allmendhubel-gimmelwald" },
      { kind:'place', label:"Pension Gimmelwald (lunch)", url:"https://www.google.com/maps/place/Pension+Gimmelwald/@46.5466255,7.8925067,3a,75y,90t/data=!3m8!1e2!3m6!1sCIHM0ogKEICAgIDCt9XmyAE!2e10!3e12!6shttps:%2F%2Flh3.googleusercontent.com%2Fgps-cs-s%2FAPNQkAHFYZ_xfk5KvT28UxnIL9TUq3RB9Vnt1LSwwkRvCxwk5TMJjXCJYhWqNlWvuaXxYyZyThTBIEF6BXCfpCrPWvXwQkMxthov6l5h3zlZWdmhjmpLIBBQwe80NmihGj9YtJofQO4beA%3Dw114-h86-k-no!7i1600!8i1200!4m19!1m8!3m7!1s0x478f0aed3f1c9881:0xcdef1b5a011453a8!2sGimmelwald,+3826+Lauterbrunnen,+Switzerland!3b1!8m2!3d46.5459095!4d7.8916164!16zL20vMDMxMnpu!3m9!1s0x478f0a993ce1ab21:0xd42d86909edd1a62!5m2!4m1!1i2!8m2!3d46.5466754!4d7.8925744!10e5!16s%2Fg%2F1tf1mr1l" },
      { kind:'place', label:"Allmendhubel", url: gmaps("Allmendhubel, Mürren, Switzerland") },
      { kind:'place', label:"Gimmelwald", url: gmaps("Gimmelwald, Switzerland") },
    ],
  },
];

// ===== RENDER =====
function chipHTML(l){
  const icon = l.kind==='trail' ? ICON_TRAIL : ICON_PIN;
  const tag = l.kind==='trail' ? 'AllTrails' : 'Maps';
  const star = l.rec ? '<span class="star">★</span>' : '';
  return `<a class="chip ${l.kind}${l.rec?' rec':''}" href="${l.url}" target="_blank" rel="noopener">
    ${icon}${star}<span>${l.label}</span><span class="tag">${tag}</span></a>`;
}
function entryHTML(e){
  return `<article class="entry">
    <div class="num">${String(e.n).padStart(2,'0')}</div>
    <div class="ehead">
      <div class="etitle">${e.title}</div>
      <div class="emeta">
        ${e.pick?'<span class="pick">★ my pick</span>':''}
        ${e.dist?`<span class="dist">${e.dist}</span>`:''}
      </div>
    </div>
    <p class="edesc">${e.desc}</p>
    <div class="chips">${e.links.map(chipHTML).join('')}</div>
  </article>`;
}
document.getElementById('menu').innerHTML = ENTRIES.map(entryHTML).join('');
document.getElementById('foot').textContent = ENTRIES.length + ' entries · a menu in progress, more coming · built for a friend';
</script>
</body>
</html>
