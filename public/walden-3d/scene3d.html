<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>35 Walden — stylized model</title>
<style>
  :root{--paper:#F4ECD8;--ink:#2B2722;--ink2:#5A534A;--line:#DDD6C9;}
  *{box-sizing:border-box}html,body{margin:0;height:100%;width:100%;overflow:hidden;background:#e9e2d2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #c{position:fixed;inset:0;display:block}
  #title{position:fixed;top:16px;left:18px;z-index:20;color:var(--ink)}
  #title .t{font-size:16px;font-weight:600}#title .s{font-size:11px;font-family:ui-monospace,Menlo,monospace;opacity:.85}
  #hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(43,39,34,.78);color:#fff;font-size:12.5px;padding:8px 16px;border-radius:999px}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#8a7a5c;font-family:ui-monospace,monospace;z-index:5}
  a.back{position:fixed;top:16px;right:18px;z-index:20;font-size:12.5px;color:var(--ink);background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:999px;padding:7px 14px;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">building your property…</div>
<div id="title"><div class="t">35 Walden Road</div><div class="s" id="subt">stylized model · your lot, house & design</div></div>
<a class="back" href="studio.html">← studio</a>
<div id="hint">drag to orbit · scroll to zoom · whatever you place in 2D shows up here</div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

/* ---- real geometry (east/north feet from house centroid) ---- */
const PARCEL=[[73.9,30.7],[-37.9,92.6],[-39.6,88.5],[-82.2,-7.9],[-92.1,-36.4],[-119,-113],[-64.8,-125.4],[77.6,-24],[74.9,-19.3],[72.5,-13.8],[70.6,-8.1],[69.3,-2.3],[68.7,3.6],[68.6,9.6],[69.2,15.6],[70.4,21.4],[73.9,30.7]];
const HOUSE=[[17,38.5],[-8.8,33.7],[-5.3,15.7],[-6.1,14],[-9.9,13.3],[-6.8,-9.2],[-13.3,-11.7],[-10.2,-27.3],[-3.2,-26.9],[-0.6,-41.9],[29.9,-36.4],[17.2,38.3]];
const MAIN_H=11, UPPER_H=20, RIDGE=27;   // stepped massing heights (ft)
const TREES=[[-72,-30,13,32],[-86,-58,11,28],[-70,-95,12,30],[-30,-100,10,26],[48,-78,13,32],[58,5,11,28],[40,40,10,26],[-30,70,12,31],[-70,15,10,25]];

const EN=(e,n,y=0)=>new THREE.Vector3(e,y,-n);
const houseCentroid=HOUSE.reduce((a,p)=>[a[0]+p[0],a[1]+p[1]],[0,0]).map(v=>v/HOUSE.length);
function scaleAbout(ring,c,k){return ring.map(p=>[c[0]+(p[0]-c[0])*k,c[1]+(p[1]-c[1])*k]);}

/* ---- renderer / scene ---- */
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(2,devicePixelRatio));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.04;
const scene=new THREE.Scene();
// warm gradient sky (Monument-Valley register)
const sky=document.createElement('canvas');sky.width=2;sky.height=256;const sx=sky.getContext('2d');
const sg=sx.createLinearGradient(0,0,0,256);sg.addColorStop(0,'#bcd2e0');sg.addColorStop(0.55,'#e4dcca');sg.addColorStop(1,'#f3ead6');
sx.fillStyle=sg;sx.fillRect(0,0,2,256);
scene.background=new THREE.CanvasTexture(sky);
scene.fog=new THREE.Fog('#ece2cf',360,1100);

const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.5,4000);
cam.position.set(88,90,160);
const ctrl=new OrbitControls(cam,renderer.domElement);
ctrl.enableDamping=true;ctrl.target.set(-6,6,-12);ctrl.maxPolarAngle=Math.PI/2.12;ctrl.minDistance=38;ctrl.maxDistance=380;ctrl.update();

/* ---- lights: warm sun + soft sky fill ---- */
scene.add(new THREE.HemisphereLight('#e8eef2','#b9ad7e',0.85));
const sun=new THREE.DirectionalLight('#ffe9c4',2.1);sun.position.set(120,190,90);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);const S=240;Object.assign(sun.shadow.camera,{left:-S,right:S,top:S,bottom:-S,near:20,far:760});sun.shadow.bias=-0.0004;scene.add(sun);
scene.add(new THREE.AmbientLight('#fff', .18));

/* ---- materials (warm, faceted, illustrated) ---- */
const M=(color,rough=1,flat=true)=>new THREE.MeshStandardMaterial({color,roughness:rough,flatShading:flat});
const matGrass=M('#9bab69'),matLot=M('#aeba78'),matWallMain=M('#e8dcc0'),matWallUpper=M('#ddcca6'),
  matRoof=M('#8f8576'),matTrim=M('#6f6657'),matWater=new THREE.MeshStandardMaterial({color:'#6fb1bd',roughness:.35,metalness:.0}),
  matWood=M('#cdb083'),matStone=M('#cfc7b2'),matBed=M('#8f9d5b'),matHedge=M('#5f7245'),matFire=M('#b06a4a');

/* ---- ground + lot ---- */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(2600,2600),matGrass.clone());
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
(()=>{const sh=new THREE.Shape(PARCEL.map(p=>new THREE.Vector2(p[0],p[1])));const g=new THREE.ShapeGeometry(sh);g.rotateX(Math.PI/2);const m=new THREE.Mesh(g,matLot.clone());m.position.y=0.12;m.receiveShadow=true;scene.add(m);})();
scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(PARCEL.map(p=>EN(p[0],p[1],0.4))),new THREE.LineBasicMaterial({color:0xb0552e})));

/* ---- house: stepped massing (main + set-back upper + hip roof) ---- */
function extrudeRing(ring,y0,y1,mat){
  const sh=new THREE.Shape(ring.map(p=>new THREE.Vector2(p[0],p[1])));
  const g=new THREE.ExtrudeGeometry(sh,{depth:y1-y0,bevelEnabled:false});g.rotateX(-Math.PI/2);g.translate(0,y0,0);
  const m=new THREE.Mesh(g,mat);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
function hipRoof(ring,base,rise,mat){
  const c=ring.reduce((a,p)=>[a[0]+p[0],a[1]+p[1]],[0,0]).map(v=>v/ring.length);
  const apex=new THREE.Vector3(c[0],base+rise,-c[1]);const pos=[];const r=[...ring];if(r[0][0]!==r[r.length-1][0]||r[0][1]!==r[r.length-1][1])r.push(r[0]);
  for(let i=0;i<r.length-1;i++){const a=EN(r[i][0],r[i][1],base),b=EN(r[i+1][0],r[i+1][1],base);pos.push(a.x,a.y,a.z,b.x,b.y,b.z,apex.x,apex.y,apex.z);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat);m.castShadow=true;scene.add(m);
}
extrudeRing(HOUSE,0,MAIN_H,matWallMain);                    // main floor
const upper=scaleAbout(HOUSE,houseCentroid,0.8);
extrudeRing(upper,MAIN_H,UPPER_H,matWallUpper);             // set-back upper floor
// thin eave band on the main roofline
extrudeRing(scaleAbout(HOUSE,houseCentroid,1.03),MAIN_H-0.5,MAIN_H+0.6,matTrim);
hipRoof(scaleAbout(upper,houseCentroid,1.06),UPPER_H,RIDGE-UPPER_H,matRoof);

/* ---- trees ---- */
function tree(e,n,r,h){const g=new THREE.Group();
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(r*0.08,r*0.11,h*0.45,6),M('#7a5c3c'));tr.position.y=h*0.22;tr.castShadow=true;g.add(tr);
  const greens=['#6b8a48','#7c9a54','#5d7a40'];
  for(let i=0;i<3;i++){const cr=r*(1-i*0.17);const cc=new THREE.Mesh(new THREE.IcosahedronGeometry(cr,0),M(greens[i%3]));cc.position.set((Math.sin(e+i)*r*.18),h*0.5+i*r*0.4,(Math.cos(n+i)*r*.18));cc.scale.y=0.85;cc.castShadow=true;g.add(cc);}
  g.position.copy(EN(e,n,0));scene.add(g);
}
TREES.forEach(t=>tree(...t));

/* ---- DESIGN OVERLAY: reads the shared element model (localStorage 'walden-design') ---- */
let designGroup=null;
function box(e,n,wFt,lFt,h,y0,mat,rot){const g=new THREE.Mesh(new THREE.BoxGeometry(wFt,h,lFt),mat);g.position.copy(EN(e,n,y0+h/2));g.rotation.y=(rot||0)*Math.PI/180;g.castShadow=true;g.receiveShadow=true;return g;}
function renderDesign(){
  if(designGroup){scene.remove(designGroup);designGroup.traverse(o=>{o.geometry&&o.geometry.dispose&&o.geometry.dispose();});}
  designGroup=new THREE.Group();scene.add(designGroup);
  let els=[];try{const d=JSON.parse(localStorage.getItem('walden-design')||'null');els=(d&&d.els)||[];}catch(_){ }
  for(const el of els){
    const e=+el.e||0,n=+el.n||0,w=+el.wFt||8,l=+el.lFt||8,rot=+el.rot||0;
    switch(el.type){
      case 'pool': case 'spa': designGroup.add(box(e,n,w,l,0.6,0.25,matWater,rot)); break;
      case 'deck': designGroup.add(box(e,n,w,l,1.4,0.2,matWood,rot)); break;
      case 'patio': case 'path': designGroup.add(box(e,n,w,l,0.5,0.15,matStone,rot)); break;
      case 'bed': designGroup.add(box(e,n,w,l,1.0,0.2,matBed,rot)); break;
      case 'hedge': designGroup.add(box(e,n,w,l,4.0,0.2,matHedge,rot)); break;
      case 'wall': designGroup.add(box(e,n,w,l,4.0,0.0,matStone,rot)); break;
      case 'firepit':{const m=new THREE.Mesh(new THREE.CylinderGeometry(w/2,w/2*1.05,1.0,16),matFire);m.position.copy(EN(e,n,0.5));m.castShadow=true;designGroup.add(m);break;}
      case 'tree':{const t=new THREE.Group();const cc=new THREE.Mesh(new THREE.IcosahedronGeometry(w/2,0),M('#6f9050'));cc.position.copy(EN(e,n,w/2+4));cc.castShadow=true;const tr=new THREE.Mesh(new THREE.CylinderGeometry(.6,.8,4,6),M('#7a5c3c'));tr.position.copy(EN(e,n,2));t.add(cc,tr);designGroup.add(t);break;}
      default: designGroup.add(box(e,n,w,l,0.6,0.15,matStone,rot));
    }
  }
}
renderDesign();
addEventListener('focus',renderDesign);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderDesign();});

addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();});
document.getElementById('loading').remove();
(function loop(){requestAnimationFrame(loop);ctrl.update();renderer.render(scene,cam);})();
</script>
</body>
</html>
