<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>reef</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { cursor: none; }
  body.paused { cursor: default; }

  #stage { position: fixed; inset: 0; background: #000; }
  .frame {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0; will-change: opacity, transform;
    transform-origin: center center;
  }
  .frame.show { opacity: 1; }

  /* paused = editable: accent ring + grab cursor on the image */
  body.paused #stage { box-shadow: inset 0 0 0 2px rgba(46,111,106,.45); cursor: grab; }
  body.paused.grabbing #stage { cursor: grabbing; }

  #boot {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: #000; color: #5b6b6e;
    font: 500 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .18em; text-transform: uppercase;
    transition: opacity .8s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #bar { width: 220px; height: 2px; background: #14201f; overflow: hidden; }
  #bar > i { display: block; height: 100%; width: 0%; background: #2e6f6a; transition: width .2s ease; }
  #boot .hint { font-size: 10px; color: #2c3a3a; max-width: 360px; text-align: center; }

  .mono { font: 500 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; }

  #kill {
    position: fixed; top: 22px; right: 22px; z-index: 15;
    width: 54px; height: 54px; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
    background: rgba(8,12,14,.62); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.14); color: #cfd9d8;
    font-size: 26px; line-height: 1; cursor: pointer;
    transition: background .15s ease, transform .12s ease, border-color .15s ease;
  }
  body.paused #kill { display: flex; }
  #kill:hover { background: rgba(220,38,38,.9); border-color: rgba(255,120,120,.6); color: #fff; transform: scale(1.06); }
  #kill:active { transform: scale(.94); }

  #ctrl {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(8px);
    z-index: 15; display: none; align-items: center; gap: 6px;
    padding: 8px 10px; border-radius: 14px;
    background: rgba(8,12,14,.6); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.1);
    opacity: 0; transition: opacity .2s ease, transform .2s ease;
  }
  body.paused #ctrl { display: flex; opacity: 1; transform: translateX(-50%) translateY(0); }
  #ctrl button {
    background: transparent; border: none; color: #b9c6c5;
    width: 36px; height: 36px; border-radius: 9px; cursor: pointer;
    font-size: 15px; display: flex; align-items: center; justify-content: center;
    transition: background .12s ease, color .12s ease;
  }
  #ctrl button:hover { background: rgba(255,255,255,.08); color: #fff; }
  #ctrl .sep { width: 1px; height: 22px; background: rgba(255,255,255,.12); margin: 0 4px; }
  #ctrl .fps { color: #74b2ab; min-width: 58px; text-align: center; }
  #ctrl .resume { background: rgba(46,111,106,.5); color: #eafffb; }
  #ctrl .resume:hover { background: rgba(46,111,106,.9); }

  #meta {
    position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%);
    z-index: 15; text-align: center; color: #8aa0a0; display: none;
    text-shadow: 0 1px 8px rgba(0,0,0,.8);
  }
  body.paused #meta { display: block; }
  #meta .name { font-size: 13px; letter-spacing: .22em; color: #d4e2e1; }
  #meta .tally { font-size: 10px; letter-spacing: .18em; color: #4a5e5d; margin-top: 6px; }
  #meta .hint2 { font-size: 10px; letter-spacing: .16em; color: #5b7572; margin-top: 7px; }
  #meta .hint2 #editScale { color: #9fcfc8; }

  #hud {
    position: fixed; left: 16px; bottom: 14px; z-index: 5;
    color: #243231; pointer-events: none; opacity: 0; transition: opacity .4s ease;
  }
  body.peek:not(.paused) #hud { opacity: 1; }
  body.peek { cursor: default; }

  .flash { position: fixed; inset: 0; z-index: 14; background: rgba(220,38,38,0); pointer-events: none; transition: background .08s ease; }
  .flash.on { background: rgba(220,38,38,.28); transition: none; }
</style>
</head>
<body>
  <div id="stage">
    <img class="frame" id="a" alt="">
    <img class="frame" id="b" alt="">
  </div>
  <div class="flash" id="flash"></div>

  <button id="kill" title="delete this frame (k)">✕</button>

  <div id="meta">
    <div class="name mono" id="metaName">—</div>
    <div class="tally mono" id="metaTally"></div>
    <div class="hint2 mono">scroll zoom · drag pan · <span id="editScale">1.50×</span> · space play</div>
  </div>

  <div id="ctrl">
    <button id="prev" title="previous frame (←)">⏮</button>
    <button id="slower" title="slower (↓)">−</button>
    <span class="fps mono" id="fps">5 fps</span>
    <button id="faster" title="faster (↑)">+</button>
    <button id="next" title="next frame (→)">⏭</button>
    <span class="sep"></span>
    <button id="resume" class="resume" title="play (space)">▶</button>
    <span class="sep"></span>
    <button id="export" title="export GIF / MP4 / image sequence (e)">⤓</button>
  </div>

  <div id="boot">
    <div>buffering reefs</div>
    <div id="bar"><i></i></div>
    <div class="hint mono" id="bootHint">space pause · scroll zoom · drag pan · ←→ step · ↑↓ speed · k delete · f fullscreen</div>
  </div>

  <div id="hud"><span class="mono" id="hudText"></span></div>

<script>
// Frames are baked Google-satellite stills in ./frames, listed in manifest.json.
// Rebuild them with: bun tools/reef-render.ts all
const els = {
  imgs: [document.getElementById('a'), document.getElementById('b')],
  stage: document.getElementById('stage'),
  boot: document.getElementById('boot'),
  bar: document.querySelector('#bar > i'),
  flash: document.getElementById('flash'),
  hud: document.getElementById('hudText'),
  name: document.getElementById('metaName'),
  tally: document.getElementById('metaTally'),
  fps: document.getElementById('fps'),
  scale: document.getElementById('editScale'),
};

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

const KILL_STORE = 'reef_killed_v2';
let killed = new Set();
try { const v = JSON.parse(localStorage.getItem(KILL_STORE) || '[]'); if (Array.isArray(v)) killed = new Set(v); } catch (e) {}
const persistKilled = () => { try { localStorage.setItem(KILL_STORE, JSON.stringify([...killed])); } catch (e) {} };

// ---- per-frame framing (zoom + pan), saved forever ---------------------------
// Pan stored as a FRACTION of the legal max-translate at the saved scale, NOT pixels —
// viewport/resolution independent, so a framing set on a laptop re-applies with no
// black bars on a phone, in fullscreen, or after a resize.
// localStorage 'reef_framing_v1' = { [file]: { s, x, y } }
//   s = scale [1.0 .. 3.0], default 1.5 (zoomed in, headroom to zoom OUT)
//   x,y = pan fraction [-1, 1]; px = fraction * (s-1)/2 * viewportDim
const FRAMING_STORE = 'reef_framing_v1';
const S_MIN = 1.0, S_DEF = 1.5, S_MAX = 3.0;
let framing = {};
try {
  const raw = JSON.parse(localStorage.getItem(FRAMING_STORE) || '{}');
  if (raw && typeof raw === 'object') {
    for (const k of Object.keys(raw)) {
      const e = raw[k];
      if (e && Number.isFinite(e.s) && Number.isFinite(e.x) && Number.isFinite(e.y)) {
        framing[k] = { s: clamp(e.s, S_MIN, S_MAX), x: clamp(e.x, -1, 1), y: clamp(e.y, -1, 1) };
      }
    }
  }
} catch (e) {}
let saveT = null;
const persistFraming = () => { try { localStorage.setItem(FRAMING_STORE, JSON.stringify(framing)); } catch (e) {} };
const scheduleSave = () => { clearTimeout(saveT); saveT = setTimeout(persistFraming, 140); };
const getFraming = (file) => framing[file] || { s: S_DEF, x: 0, y: 0 };

const stageWH = () => [els.stage.clientWidth, els.stage.clientHeight];
const frameTransform = (s, tx, ty) => `translate(${tx}px, ${ty}px) scale(${s})`;

// Apply a frame's SAVED-or-default framing to one img layer. Called from display()
// for the incoming layer on every show, so it applies during playback AND stepping.
function applyFraming(img, file) {
  const f = getFraming(file);
  const [W, H] = stageWH();
  const maxTx = (f.s - 1) / 2 * W, maxTy = (f.s - 1) / 2 * H;
  img.style.transform = frameTransform(f.s, f.x * maxTx, f.y * maxTy);
}

// ---- live editing: paused == editable, auto-saves (no lock) ------------------
// While paused we hold the working framing in PIXELS for the current frame and
// write it straight back to saved framing (as fractions) on every change.
let edit = null;      // { s, tx, ty } px for the frame being edited
let editFile = null;  // file of the frame being edited (stable across the shuffle)
let drag = null;      // active pan gesture

function clampEdit() {
  const [W, H] = stageWH();
  edit.s = clamp(edit.s, S_MIN, S_MAX);
  const maxTx = (edit.s - 1) / 2 * W, maxTy = (edit.s - 1) / 2 * H;
  edit.tx = maxTx > 0 ? clamp(edit.tx, -maxTx, maxTx) : 0;
  edit.ty = maxTy > 0 ? clamp(edit.ty, -maxTy, maxTy) : 0;
}

// push the working edit into the saved framing (as fractions), reflect it live, auto-save
function commitLive() {
  if (!edit || editFile == null) return;
  clampEdit();
  const [W, H] = stageWH();
  const maxTx = (edit.s - 1) / 2 * W, maxTy = (edit.s - 1) / 2 * H;
  framing[editFile] = {
    s: edit.s,
    x: maxTx > 0 ? clamp(edit.tx / maxTx, -1, 1) : 0,
    y: maxTy > 0 ? clamp(edit.ty / maxTy, -1, 1) : 0,
  };
  els.imgs[visible].style.transform = frameTransform(edit.s, edit.tx, edit.ty);
  if (els.scale) els.scale.textContent = edit.s.toFixed(2) + '×';
  scheduleSave();
}

// (re)target editing at the currently shown frame — on pause, and on every step
function beginEdit() {
  if (playing || curIdx == null || !FRAMES[curIdx]) { edit = null; editFile = null; return; }
  editFile = FRAMES[curIdx].file;
  const f = getFraming(editFile);
  const [W, H] = stageWH();
  edit = { s: f.s, tx: f.x * (f.s - 1) / 2 * W, ty: f.y * (f.s - 1) / 2 * H };
  if (els.scale) els.scale.textContent = edit.s.toFixed(2) + '×';
}

let FRAMES = [];
const frameKey = (f) => f.file;
const url = (f) => `frames/${f.file}`;

let cache = [], ready = [], order = [];
let pos = 0, curIdx = null, visible = 0;
let playing = true, interval = 1000 / 5, timer = null;
const BUFFER_TO_START = 8;

const isKilled = (i) => killed.has(frameKey(FRAMES[i]));
const readyCount = () => ready.filter(Boolean).length;
const liveCount = () => FRAMES.filter((f) => !killed.has(frameKey(f))).length;

function loadFrame(i) {
  return new Promise((res) => {
    if (isKilled(i)) { ready[i] = false; return res(false); }
    const im = new Image();
    im.decoding = 'async';
    im.onload = () => { cache[i] = im; ready[i] = true; res(true); };
    im.onerror = () => { ready[i] = false; res(false); };
    im.src = url(FRAMES[i]);
  });
}

async function preload() {
  let started = false;
  const idxs = [...FRAMES.keys()];
  const POOL = 6; let cursor = 0;
  async function worker() {
    while (cursor < idxs.length) {
      await loadFrame(idxs[cursor++]);
      els.bar.style.width = Math.min(100, (readyCount() / BUFFER_TO_START) * 100) + '%';
      if (!started && readyCount() >= BUFFER_TO_START) { started = true; start(); }
    }
  }
  await Promise.all(Array.from({ length: POOL }, worker));
  if (!started && readyCount() > 0) start();
  updateMeta();
}

function display(i) {
  if (i == null || !cache[i]) return;
  const incoming = els.imgs[1 - visible];
  incoming.src = cache[i].src;
  applyFraming(incoming, FRAMES[i].file);   // per-frame zoom/pan, keyed to THIS frame's file
  incoming.classList.add('show');
  els.imgs[visible].classList.remove('show');
  visible = 1 - visible;
  curIdx = i;
  if (!playing) { updateMeta(); beginEdit(); }   // stepped to a new frame while paused → edit it
  if (hud.on) els.hud.textContent =
    `${FRAMES[i].name} · z${FRAMES[i].z} · ${Math.round(1000/interval)}fps · ${readyCount()} ready`;
}

function step(dir) {
  for (let n = 0; n < order.length; n++) {
    pos = (pos + dir + order.length) % order.length;
    const i = order[pos];
    if (ready[i]) { display(i); return i; }
  }
  return -1;
}
const tick = () => step(1);

function start() {
  els.boot.classList.add('gone');
  if (timer) clearInterval(timer);
  const first = order.find((x) => ready[x]);
  if (first != null) { pos = order.indexOf(first); display(first); }
  timer = setInterval(() => { if (playing) tick(); }, interval);
}

function setSpeed(fps) {
  fps = Math.max(1, Math.min(24, fps));
  interval = 1000 / fps;
  els.fps.textContent = fps + ' fps';
  if (timer) { clearInterval(timer); timer = setInterval(() => { if (playing) tick(); }, interval); }
}

function setPaused(p) {
  playing = !p;
  document.body.classList.toggle('paused', p);
  if (p) { updateMeta(); beginEdit(); }
  else { edit = null; editFile = null; drag = null; document.body.classList.remove('grabbing'); persistFraming(); }
}
const togglePause = () => setPaused(playing);

function updateMeta() {
  if (curIdx != null && FRAMES[curIdx]) els.name.textContent = `${FRAMES[curIdx].name}  ·  z${FRAMES[curIdx].z}`;
  els.tally.textContent = `live ${liveCount()}  ·  deleted ${killed.size}  ·  ${Math.round(1000/interval)} fps`;
}

function killCurrent() {
  if (curIdx == null) return;
  killed.add(frameKey(FRAMES[curIdx])); persistKilled();
  ready[curIdx] = false;
  els.flash.classList.add('on'); setTimeout(() => els.flash.classList.remove('on'), 90);
  step(1); updateMeta();
}

const hud = { on: false, t: null };
function peek() {
  if (document.body.classList.contains('paused')) return;
  document.body.classList.add('peek'); hud.on = true;
  clearTimeout(hud.t);
  hud.t = setTimeout(() => { document.body.classList.remove('peek'); hud.on = false; }, 2000);
}
window.addEventListener('mousemove', peek);

document.getElementById('kill').addEventListener('click', (e) => { e.stopPropagation(); if (!playing) killCurrent(); });

// wheel = zoom toward the cursor — only while paused; otherwise let the page scroll
els.stage.addEventListener('wheel', (e) => {
  if (playing || !edit) return;
  e.preventDefault();
  const rect = els.stage.getBoundingClientRect();
  const [W, H] = stageWH();
  const factor = clamp(Math.exp(-e.deltaY * 0.0015), 0.82, 1.22);   // bound per-event jump
  const s2 = clamp(edit.s * factor, S_MIN, S_MAX);
  const px = e.clientX - rect.left - W / 2;     // cursor offset from stage center
  const py = e.clientY - rect.top - H / 2;
  // keep the content point under the cursor fixed: T' = p - (s2/s)*(p - T)
  edit.tx = px - (s2 / edit.s) * (px - edit.tx);
  edit.ty = py - (s2 / edit.s) * (py - edit.ty);
  edit.s = s2;
  commitLive();
}, { passive: false });

// drag = pan — only while paused
els.stage.addEventListener('mousedown', (e) => {
  if (playing || !edit) return;
  e.preventDefault();
  drag = { mx: e.clientX, my: e.clientY, tx: edit.tx, ty: edit.ty };
  document.body.classList.add('grabbing');
});
window.addEventListener('mousemove', (e) => {
  if (playing || !drag || !edit) return;
  edit.tx = drag.tx + (e.clientX - drag.mx);
  edit.ty = drag.ty + (e.clientY - drag.my);
  commitLive();
});
window.addEventListener('mouseup', () => {
  if (drag) { document.body.classList.remove('grabbing'); persistFraming(); }
  drag = null;
});

// keep framing black-bar-safe on resize / fullscreen
window.addEventListener('resize', () => {
  if (curIdx != null && FRAMES[curIdx]) applyFraming(els.imgs[visible], FRAMES[curIdx].file);
  if (!playing) beginEdit();
});

document.getElementById('prev').addEventListener('click', (e) => { e.stopPropagation(); step(-1); });
document.getElementById('next').addEventListener('click', (e) => { e.stopPropagation(); step(1); });
document.getElementById('slower').addEventListener('click', (e) => { e.stopPropagation(); setSpeed(Math.round(1000/interval) - 1); updateMeta(); });
document.getElementById('faster').addEventListener('click', (e) => { e.stopPropagation(); setSpeed(Math.round(1000/interval) + 1); updateMeta(); });
document.getElementById('resume').addEventListener('click', (e) => { e.stopPropagation(); togglePause(); });

// lazy-load the export module (GIF / MP4 / image sequence) only when asked
let exportMod = null;
async function openExport() {
  if (!playing) {} // exporting works from any state; it reads saved framing, not live transform
  try {
    if (!exportMod) exportMod = await import('./export.js');
    exportMod.openMenu({ fps: Math.round(1000 / interval) });   // bake at the speed you're watching
  } catch (err) { console.error('export load failed', err); }
}
document.getElementById('export').addEventListener('click', (e) => { e.stopPropagation(); openExport(); });

window.addEventListener('keydown', (e) => {
  switch (e.key) {
    case ' ':          e.preventDefault(); togglePause(); break;
    case 'k': case 'Backspace': case 'Delete': e.preventDefault(); if (!playing) killCurrent(); break;
    case 'ArrowRight': if (!playing) step(1); break;
    case 'ArrowLeft':  if (!playing) step(-1); break;
    case 'ArrowUp':    setSpeed(Math.round(1000/interval) + 1); updateMeta(); break;
    case 'ArrowDown':  setSpeed(Math.round(1000/interval) - 1); updateMeta(); break;
    case 'f':          document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); break;
    case 'e': case 'E': e.preventDefault(); openExport(); break;
  }
});

// ---- boot -------------------------------------------------------------------
(async function init() {
  let manifest = [];
  try { manifest = await fetch('frames/manifest.json', { cache: 'no-cache' }).then((r) => r.json()); } catch (e) {}
  FRAMES = manifest.map((m) => ({ name: m.name, z: m.z, file: m.file }));
  for (let i = FRAMES.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [FRAMES[i], FRAMES[j]] = [FRAMES[j], FRAMES[i]];
  }
  order = [...FRAMES.keys()];
  if (!FRAMES.length) { els.boot.querySelector('div').textContent = 'no frames'; return; }
  setSpeed(5);
  preload();
})();
</script>
</body>
</html>
