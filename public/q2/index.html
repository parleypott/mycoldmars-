e prototypes were nowhere to be found.\"\n\n**What this is really asking:** Stronger absence — not just missing from the room, gone entirely.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Done (his trailing dictation 'd' didn't leak in). Pairs with the DREKKO-naming card: this same sentence should say DREKKOs.","head":"","tail":"","rationale":"note 6f29eb01-917f-4da8-84d0-dedfad4d151e · priority low","draft":""},{"chapter":"20","seq":651,"type":"your note","size":"low","title":"YOU · 'Never achieved outside a lab'","proposal":"**Your note:** On 'could happen but never achieved' — \"Outside of a lab\"\n\n**The passage now:** Line 2446: \"the thing the papers promised could happen but never achieved outside a lab\".\n\n**What this is really asking:** Complete the claim — the labs did achieve it in vitro; his machines did it in rock.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Done verbatim.","head":"","tail":"","rationale":"note 6ea398ca-4e60-4a8f-ae4f-bfb48c201aff · priority low","draft":""},{"chapter":"20","seq":652,"type":"your note","size":"low","title":"YOU · Cut the 'checked and believed' clause","proposal":"**Your note:** On 'and he checked them against the sensor sums, and he believed them' — \"Cut\"\n\n**The passage now:** Line 2452: \"He looked at the numbers at the bottom of the stream, tonnage, waste ratio, energy per kilogram, and he did not believe them.\" Then: \"Then he took his lantern and raced into the tunnel.\"\n\n**What this is really asking:** End on disbelief so the disbelief propels him physically into the tunnel — seeing is the verification now.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Cut executed. Worth noting he overruled a passage HOUSE_STYLE quotes as a worked example — and his version is better here, because the tunnel itself becomes the sensor sum. The style doc's example should not resurrect this clause in future passes.","head":"","tail":"","rationale":"note 884d2433-6fd3-4beb-a581-9d48881afebb · priority low","draft":""},{"chapter":"20","seq":653,"type":"your note","size":"low","title":"YOU · 'Into the voids behind them' confusion","proposal":"**Your note:** On 'packed it into the voids behind them' — \".??\"\n\n**The passage now:** Line 2458: \"they had pulverized the waste rock and packed it into the walls, leaving a smooth finish.\"\n\n**What this is really asking:** 'Voids' was unvisualizable — packed into what?\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Fixed: packed into the walls, which also explains the planed-wood finish two paragraphs earlier. Clear now.","head":"","tail":"","rationale":"note 967e2c95-5262-41f9-9d65-479104442e97 · priority low","draft":""},{"chapter":"20","seq":654,"type":"your note","size":"medium","title":"YOU · Break into the old tunnel at an angle","proposal":"**Your note:** On 'Beyond it, the tunnel was still a tunnel, but an old one.' — \"Breaking into a tunnel at an angle\"\n\n**The passage now:** Line 2464: \"The machine-cut smoothness ended at an edge as clean as a doorway. Beyond it, the tunnel was still a tunnel, but an old one.\" No intersection geometry.\n\n**What this is really asking:** He wants the physical truth of the breach: a machine tunnel doesn't continue an old tunnel, it strikes one at an angle and punches through its wall.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree — as written, the reader can picture one continuous tube changing texture, which is geometrically wrong and wastes an engineer's-eye beat. One clause of intersection geometry fixes it and makes the doorway-clean edge more startling, not less.\n\n**Suggested edit:** OLD: \"The machine-cut smoothness ended at an edge as clean as a doorway.  Beyond it, the tunnel was still a tunnel, but an old one.\" NEW: \"The machine-cut smoothness ended at an edge as clean as a doorway, where his tunnel had struck an older one at an angle and broken through its wall. Beyond the breach, the tunnel was still a tunnel, but an old one.\"","head":"","tail":"","rationale":"note 80e0adaa-d3ec-4665-9622-661e4e961aa5 · priority medium","draft":""},{"chapter":"20","seq":655,"type":"your note","size":"low","title":"YOU · Cut ore-river-swimmers engraving","proposal":"**Your note:** On 'a seam of ore shown as a river with figures swimming in it;' — \"Cut\"\n\n**The passage now:** Line 2474 keeps only \"miners with picks, rendered in the blunt confident strokes of people carving their own lives.\"\n\n**What this is really asking:** The swimming-in-ore image was over-poetic for Ghai stonework.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Cut executed; what remains is blunt and right.","head":"","tail":"","rationale":"note 38d91826-3804-4cb2-bed3-173fc6d0c119 · priority low","draft":""},{"chapter":"20","seq":656,"type":"your note","size":"low","title":"YOU · 'Had just checked'","proposal":"**Your note:** On 'His machines had checked' — \"Had just checked\"\n\n**The passage now:** Line 2492: \"His machines had just checked.\"\n\n**What this is really asking:** The 'just' lands the four-hundred-year irony on tonight.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Done — one of the best buttons in the range.","head":"","tail":"","rationale":"note 9811b844-a1bb-45e9-876d-f893ad3c366a · priority low","draft":""},{"chapter":"20","seq":657,"type":"your note","size":"low","title":"YOU · Cut 'and wrong for the silence'","proposal":"**Your note:** On 'faint and rhythmic and wrong for the silence' — \"Cut\"\n\n**The passage now:** Line 2496: \"faint and rhythmic in the silence he could hear his machines.\"\n\n**What this is really asking:** The 'wrong for' editorialized the sound.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Cut executed. Separate live bug in the same sentence, already flagged in the book map: \"the dark ahead of him was pulling with the specific gravity.\" is broken mid-image and needs a finish or a cut in the cleanup pass.","head":"","tail":"","rationale":"note bb1be0ec-aa0f-4ff0-8556-44d07fa8194b · priority low","draft":""},{"chapter":"20","seq":658,"type":"your note","size":"low","title":"YOU · Cut 'blackness that had owned itself for centuries'","proposal":"**Your note:** On 'a blackness that had owned itself for centuries.' — \"Cut\"\n\n**The passage now:** Line 2500: \"his lantern a small moving room of light in a blackness. The tunnels branched and rejoined.\" The clause is cut but left a dangling article.\n\n**What this is really asking:** Scale-noun grandeur; kill it.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Cut executed, but the amputation left \"in a blackness.\" — an article with nothing to govern. One-word repair.\n\n**Suggested edit:** OLD: \"his lantern a small moving room of light in a blackness.\" NEW: \"his lantern a small moving room of light in the black.\"","head":"","tail":"","rationale":"note 48eecd0d-f040-48eb-bb04-b3bec58b2fbf · priority low","draft":""},{"chapter":"20","seq":659,"type":"your note","size":"low","title":"YOU · Ghai 'galleries' → wide hallways","proposal":"**Your note:** On 'and galleries [where the veins widened]' — \"Wide hallways\"\n\n**The passage now:** Line 2502: \"The Ghai had cut stairs where the veins dipped, and wide hallways where the veins widened\".\n\n**What this is really asking:** Same de-jargoning as ch14 — hallways are livable, galleries are technical.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Done, and it supports the built-to-be-lived-in read of the Ghai spaces.","head":"","tail":"","rationale":"note 474e0fa4-3362-4908-81cb-73836c74a3c9 · priority low","draft":""},{"chapter":"20","seq":660,"type":"your note","size":"low","title":"YOU · Cut industrial heartbeat; add fear of getting lost","proposal":"**Your note:** On 'a faint industrial heartbeat threading through the old stone, and with it, gradually, another sound he could not place' — \"Cut and say he thought he would get lost down here forever\"\n\n**The passage now:** Line 2504: \"The sound of the machines came and went with the turnings, closer and farther and closer and Burgundy contemplated what could happen if he got lost down here. But still he followed the sound...\"\n\n**What this is really asking:** Kill the heartbeat metaphor (and 'threading', a banned word) and replace with the concrete fear of being lost.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Both halves executed. 'Contemplated what could happen if he got lost' is a touch bureaucratic — a lighter polish ('and he understood that if the sound stopped he might never find the way up') would sharpen it, but the note itself is satisfied.","head":"","tail":"","rationale":"note cc9b3f39-37bf-4973-bc55-eba28dc39d7e · priority low","draft":""},{"chapter":"20","seq":661,"type":"your note","size":"low","title":"YOU · Red-blinking machine takes receiving duty","proposal":"**Your note:** \"Blinking red to indicate it was out of explosives had given itself the duty of receiving the falling load its partner just cut free of the face\"\n\n**The passage now:** Line 2522: \"a sheet of ore sagged free and the second machine, blinking one red in between two green to indicate it was out of explosives, had given itself the duty of receiving the falling load its partner just cut free of the face.\"\n\n**What this is really asking:** Show emergent division of labor — a depleted machine reassigning itself — in one concrete image.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Incorporated nearly verbatim, with the one-red-between-two-greens refinement. 'Had given itself the duty' is the whole Closed Loop arc in five words. Protect this sentence.","head":"","tail":"","rationale":"note ffb61499-9e0c-48e7-a73c-aa8a245147aa · priority low","draft":""},{"chapter":"20","seq":662,"type":"your note","size":"low","title":"YOU · 'The lamplight' → his lamplight","proposal":"**Your note:** On 'had died when the [lamplight came around the turning]' — \"Burgundy's\"\n\n**The passage now:** Line 2530 still reads \"whatever murmur he had heard had died when the lamplight came around the turning.\"\n\n**What this is really asking:** Make it unambiguous that HIS light is what silenced the cavern — he is the event.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree; in close third 'his lamplight' is the right possessive and lands the he-is-the-intrusion beat. Micro-edit.\n\n**Suggested edit:** OLD: \"had died when the lamplight came around the turning\" NEW: \"had died when his lamplight came around the turning\"","head":"","tail":"","rationale":"note da36a8f6-dce4-4b26-9adb-085adf373eed · priority low","draft":""},{"chapter":"20","seq":663,"type":"your note","size":"low","title":"YOU · Cut 'no lungs at risk and no foreman in sight'","proposal":"**Your note:** On 'working a widow-maker vein in perfect silence with no lungs at risk and no foreman in sight' — \"Cut\"\n\n**The passage now:** Line 2530: \"men watching a shift's tonnage come off a widow-maker vein in perfect silence. And now, one by one, they turned, and they were watching him.\"\n\n**What this is really asking:** The clause spelled out the meaning the tableau already carried.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Cut executed; the chapter now ends on the turn to him, which is the correct button.","head":"","tail":"","rationale":"note ce770869-45e6-418c-a6ce-7d45a86fe684 · priority low","draft":""},{"chapter":"21","seq":664,"type":"your note","size":"high","title":"YOU · 'Foggy ideas became real' → the yearning made real, and complicated","proposal":"**Your note:** \"Years of a deep yearning to help the miners turned real if more complicated than he was expecting\"\n\n**The passage now:** Line 2701 ends the lying-awake passage: \"...Or how 'real world industrial application scenarios' had no shape in the minds of the core world researchers who had given him the final ingredients to his puzzle. But tonight, theory became application. Foggy ideas became real.\"\n\n**What this is really asking:** The chapter's emotional summit shouldn't close in the engineering register (theory→application, which just repeats ch19); it should close on the human one — the years of wanting to help finally touched real people, and the reality bit back.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree fully. 'Foggy ideas became real' is flat, and the researcher-callback sentence re-explains ch19. Johnny's note names the true cargo: want-made-real is more complicated than wanting. Render 'complicated' as the concrete things Hesta did to him, then stop — the next paragraph ('It had found other people.') is the button and must stay last.\n\n**Suggested edit:** OLD: \"Or how \\\"real world industrial application scenarios\\\" had no shape in the minds of the core world researchers who had given him the final ingredients to his puzzle. But tonight, theory became application. Foggy ideas became real.\" NEW: \"For years the wanting to help them had lived in pencil lines and part lists. Tonight it had stood in a cavern with real people looking back at it, and real was more complicated than wanting. Real had a quota, a snare, and a woman deciding whether he was worth her people's necks.\"","head":"","tail":"","rationale":"note fd54f743-63a5-4869-8ecc-fa43ddc39ab5 · priority high","draft":""},{"chapter":"21","seq":665,"type":"your note","size":"high","title":"YOU · Hesta's assessment — garbled incorporation","proposal":"**Your note:** \"This woman had made the swift assessment that this wasn't the crackdown. Maybe it was the look on Burgundy's face petrified and fearful himself. Either way her tone wasn't [read: was not] fearful. It was almost annoyed.\"\n\n**The passage now:** Line 2587 pasted the dictation raw, typos included: \"This woman had made the a quick assessment that this wasn't the crackdown. Maybe is was the look on Burgundy's face petrified and fearful himself. Either way her tone wasn't not fearful. It was almost annoyed.\" The book map flags this as one of the garbled lines.\n\n**What this is really asking:** Characterize Hesta's operator-speed read (not the crackdown → annoyance, not fear) — a key beat in building her as the real authority.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** The beat is right and load-bearing; the prose is broken (double article, 'is was', double negative). Also a POV nit: he can't see his own face, so render his fear as something he can feel. Repair, don't expand.\n\n**Suggested edit:** OLD: \"This woman had made the a quick assessment that this wasn’t the crackdown. Maybe is was the look on Burgundy's face petrified and fearful himself. Either way her tone wasn’t not fearful. It was almost annoyed.\" NEW: \"She had already made the quick assessment that this was not the crackdown. Maybe it was his face, which he could feel holding more fear than hers. Either way her tone was not fearful. It was almost annoyed.\"","head":"","tail":"","rationale":"note 72bbbf9a-e497-49f1-9460-2ab4e237c76e · priority high","draft":""},{"chapter":"21","seq":666,"type":"your note","size":"high","title":"YOU · The forgotten coat, worth more than three men's year","proposal":"**Your note:** On 'in a coat' — \"He had forgotten to take off. A coat worth more\"\n\n**The passage now:** Line 2539: \"Burgundy stood at the mouth of the tunnel  holding a lamp, in a princely coat he had forgotten to take off. a coat worth more than any three men in front of him earned in a year,~~ and understood that whoever spoke first would decide what this was.~~\"\n\n**What this is really asking:** Two payloads: the coat as unconscious costume (double life caught on his back) and priced against the miners' wages.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Both payloads are in — but the sentence is dirty: a lowercase restart after the period, a trailing comma, and an unresolved strikethrough (which the book map also flags). The struck clause should die: 'whoever spoke first would decide what this was' explains the standoff the silence already dramatizes.\n\n**Suggested edit:** OLD: \"in a princely coat he had forgotten to take off. a coat worth more than any three men in front of him earned in a year,~~ and understood that whoever spoke first would decide what this was.~~\" NEW: \"in a princely coat he had forgotten to take off, a coat worth more than any three men in front of him earned in a year.\"","head":"","tail":"","rationale":"note dce26c4d-c6ec-4758-b02d-ea5f5cd59c05 · priority high","draft":""},{"chapter":"21","seq":667,"type":"iz note","size":"high","title":"IZ · \"Did not feel empty... not abandoned\" is the House Style's own banned example in the wild","proposal":"**Iz said:** Describe this differently\n\n**The passage now:** Line 2693: \"...and as he went time the tunnels did not feel empty to him. He passed the tally walls and the clay lamps and the stairs worn into bowls, his lamp swinging its small room of light along the old stone, and the whole silent labyrinth felt different than it had on the way down — not abandoned.\"\n\n**What this is really asking:** She feels the passage failing and asks for a different rendering. She is more right than she knows: this is a double rhetorical negation (\"did not feel empty\"... \"not abandoned\") that is almost verbatim HOUSE_STYLE.md's canonical FAKE example (\"The tunnels weren't empty. They were waiting.\"), plus a non-interruption em dash, plus the \"as he went time\" typo.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree fully. Convert per the style law: replace the rhetorical negations with one concrete positive perception that makes the reader arrive at \"not abandoned\" on their own. The good specifics are already in the sentence; end on one of them, sharpened.\n\n**Suggested edit:** OLD: \"The walk back through the dead kingdom took its hour (mostly because the Drekkos could only move so quickly), and as he went time the tunnels did not feel empty to him. He passed the tally walls and the clay lamps and the stairs worn into bowls, his lamp swinging its small room of light along the old stone, and the whole silent labyrinth felt different than it had on the way down — not abandoned.\" NEW: \"The walk back through the dead kingdom took its hour, the Drekkos rolling behind at their own pace, and the tunnels read differently on the way up. He passed the tally walls and the clay lamps and the stairs worn into bowls, his lamp swinging its small room of light along the old stone, and for the first time he thought about how many boots it takes to wear a stair into a bowl.\"","head":"","tail":"","rationale":"note 1bcfc142-bc04-466f-8496-806ca772cc48 · priority high","draft":""},{"chapter":"21","seq":668,"type":"iz note","size":"high","title":"IZ · Cut the front-loaded crackdown conclusion; let the paragraph arrive at it","proposal":"**Iz said:** Cut. I like it coming at the end of the paragraph like you have it better\n\n**The passage now:** Line 2559: \"They thought he was the crackdown. Of course they did. A prince does not come down a shaft at night to admire the rock. He stood there in his coat, in the light, at the mouth of an ancient tunnel, and he watched fifteen hard-handed people arrive together at the reasonable conclusion that he had come to hang them.\"\n\n**What this is really asking:** She wants the opening two sentences cut because the paragraph reaches the same conclusion at its end, and the end placement is stronger. She is asking the prose to let the reader arrive with the miners instead of being told first.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree fully. The paragraph states its conclusion twice; front-loading it takes the last step before the walk to it. This is also one of the three spots my reread flagged where interiority decodes the crowd; this cut is the cheapest of the trims. \"A prince does not come down a shaft at night to admire the rock\" opens the paragraph beautifully on its own.\n\n**Suggested edit:** OLD: \"They thought he was the crackdown. Of course they did. A prince does not come down a shaft at night to admire the rock.\" NEW: \"A prince does not come down a shaft at night to admire the rock.\"","head":"","tail":"","rationale":"note 73f489dc-d56d-4495-8259-b35dbd5d83a4 · priority high","draft":""},{"chapter":"21","seq":669,"type":"iz note","size":"high","title":"IZ · Sew the seam the strikethrough cut left open (\"It was not him...\")","proposal":"**Iz said:** Revise with earlier cut\n\n**The passage now:** Lines 2539-2541: \"Burgundy stood at the mouth of the tunnel  holding a lamp, in a princely coat he had forgotten to take off. a coat worth more than any three men in front of him earned in a year,~~ and understood that whoever spoke first would decide what this was.~~\" followed by \"It was not him and it was not the woman at the front.\"\n\n**What this is really asking:** The strikethrough deletion (correctly killing the explaining clause about \"whoever spoke first\") orphans the next paragraph: with the cut applied, \"It was not him\" has no antecedent. She is asking for the follow-line to be revised so the cut can land.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree fully; this is exactly the unresolved-strikethrough class of bug my reread flagged as the chapter's heaviest debris. The cut is right (whoever-speaks-first was the narrator taking the last step); the seam just needs sewing, plus the lowercase fragment in the same sentence.\n\n**Suggested edit:** OLD: \"Burgundy stood at the mouth of the tunnel  holding a lamp, in a princely coat he had forgotten to take off. a coat worth more than any three men in front of him earned in a year,~~ and understood that whoever spoke first would decide what this was.~~\\n\\nIt was not him and it was not the woman at the front.\" NEW: \"Burgundy stood at the mouth of the tunnel holding a lamp, in a princely coat he had forgotten to take off, a coat worth more than any three men in front of him earned in a year.\\n\\nThe first one to speak was not him, and it was not the woman at the front.\"","head":"","tail":"","rationale":"note db9dcbfc-8c79-4658-8529-9b832ca87d84 · priority high","draft":""},{"chapter":"21","seq":670,"type":"iz note","size":"medium","title":"IZ · Third \"knuckle/polite\" use in ninety lines; cut the comparison and clean the paragraph","proposal":"**Iz said:** .??\n\n**The passage now:** Ch21 opening (line 2537): \"A micro-charge cracked, polite as a knuckle.\" The parent images are in ch20: \"a sound no louder than a knuckle crack\" (line 2450) and \"the crack of it was polite, almost apologetic\" (line 2522). The same paragraph also carries debris: \"But The machines kept working. Their sound a calm hum and clank against the stillness.\"\n\n**What this is really asking:** Her \"??\" is a comprehension stumble. Note: the line itself is blessed — HOUSE_STYLE.md cites \"The micro-charge cracked, polite as a knuckle.\" verbatim as a naturalist-precision exemplar, so it does not fail the Cargo Test in isolation. The real problem is density: this is the third use of the knuckle/polite device in about ninety lines (2450, 2522, 2537), and by the third pass the compression reads as a stumble rather than a callback.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree with the stumble, disagree with the diagnosis. The device is house-approved (HOUSE_STYLE line 56 quotes this exact sentence approvingly), so the fix is not to complete the image but to stop repeating it. The reader already holds the knuckle-crack image from ch20; the third instance earns nothing. Cut the comparison and let the plain fact stand, which is the style doc's own first conversion move. Do not echo ch20's \"no louder than\" phrasing, which would trade one repetition for another and drop the cargo-bearing \"crack.\" Clean the paragraph's capitalization debris in the same touch.\n\n**Suggested edit:** OLD: \"But The machines kept working. Their sound a calm hum and clank against the stillness.\" NEW: \"But the machines kept working, a calm hum and clank against the stillness.\" And OLD: \"A micro-charge cracked, polite as a knuckle.\" NEW: \"A micro-charge cracked.\"","head":"","tail":"","rationale":"note 0b19a30c-97e9-4d4d-a829-add3717e21e3 · priority medium","draft":""},{"chapter":"21","seq":671,"type":"iz note","size":"low","title":"IZ · Do NOT spell out what he hears in \"It doesn't get tired\"","proposal":"**Iz said:** Maybe say what this is instead. He heard their exhaustion, hunger, children being sacrificed to this world and air\n\n**The passage now:** Line 2549: \"Burgundy heard in it the thing he had not been able to say to his father, to his mother, to anyone, the whole point of years of nights, spoken in four words by a child in the dark.\"\n\n**What this is really asking:** She wants \"the thing\" unpacked into the suffering it stands for: exhaustion, hunger, children spent in the shafts. A classic Iz move: right about a vague noun, proposing more explanation as the cure.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Disagree with her fix. The child's four words ARE the whole project said back to him; enumerating exhaustion and sacrificed children would announce the theme and take the reader's last step. The chapter earns those images concretely elsewhere (the pinch seams, the milk-glass eye, the girl's smallness). Her real symptom is that \"the thing he had not been able to say\" is doing vague double duty with \"the whole point of years of nights.\" The move is a trim, not an expansion.\n\n**Suggested edit:** Optional trim only. OLD: \"Burgundy heard in it the thing he had not been able to say to his father, to his mother, to anyone, the whole point of years of nights, spoken in four words by a child in the dark.\" NEW: \"Burgundy heard in it the whole point of years of nights, the thing he had never been able to say to anyone, spoken in four words by a child in the dark.\"","head":"","tail":"","rationale":"note ae1f6269-dd43-4113-9341-0e1f21b2437f · priority low","draft":""},{"chapter":"21","seq":672,"type":"iz note","size":"medium","title":"IZ · The word \"Prince\": convert the negation, keep \"more fear in it\"","proposal":"**Iz said:** Note 1: cut \", and it was not what the word did in the palace.\" Note 2: on \"something with more fear in it\" she suggests \"that resembled fear.\"\n\n**The passage now:** Line 2557: \"And he watched what the word did, and it was not what the word did in the palace. There, it bent people at the waist. Here it moved through the crowd like cold water, awe curdling into something with more fear in it.\"\n\n**What this is really asking:** Two adjacent asks on one sentence run. The cut targets a rhetorical not-X setup (her ear for the negation tic is good); the rephrase wants \"fear\" softened to \"resembled fear.\"\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Half agree. The negation clause is the tic and should go, but a bare cut orphans \"There\" (its antecedent is \"the palace\" inside the cut clause), so convert to the affirmative contrast, which keeps all the cargo. On \"resembled fear\": disagree. \"Something with more fear in it\" is a precise ratio-shift from ch20's close (\"the awe and the fear locked together\"); \"resembled\" is vaguer, a hedge where the text is measuring. Keep it.\n\n**Suggested edit:** OLD: \"And he watched what the word did, and it was not what the word did in the palace. There, it bent people at the waist. Here it moved through the crowd like cold water, awe curdling into something with more fear in it.\" NEW: \"And he watched what the word did. In the palace it bent people at the waist. Here it moved through the crowd like cold water, awe curdling into something with more fear in it.\"","head":"","tail":"","rationale":"note 6305a9cb-b65a-4295-b625-cf054f30412b, 6350cc5d-686d-4dd9-81ed-c3aef69b7e2b · priority medium","draft":""},{"chapter":"21","seq":673,"type":"iz note","size":"low","title":"IZ · Keep the kicked-robot confession in his account to Hesta","proposal":"**Iz said:** Might be interesting for him to hold this point back in a way to not have them realize the stakes\n\n**The passage now:** Line 2593, his account to Hesta: \"That he had brought one to his father and his father had kicked it and forbidden him to build another. That he had secretly built three.\"\n\n**What this is really asking:** She proposes Burgundy withhold the father-forbade-it fact so the miners don't grasp how dangerous his presence is.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Disagree, for three reasons. First, the kicked robot is the one credential that separates him from the regime in their eyes; it is why Hesta grants a hearing at all, and it feeds her ch22 wager about what his lies have and haven't cost people below him. Second, it wouldn't lower their perceived stakes: their death sentence is his presence in the shaft, not his disobedience upstairs. Third, the scene already dramatizes strategic withholding (mother, white room, cartel) with the cold self-observation that the leaving-out doesn't show; adding another withheld item dilutes that designed list. The beat stays.\n\n**Suggested edit:** None. No change.","head":"","tail":"","rationale":"note 9dd176df-7398-4197-8376-b0faf123afd0 · priority low","draft":""},{"chapter":"21","seq":674,"type":"iz note","size":"low","title":"IZ · Cut the thin simile on \"brushed off the answer\"","proposal":"**Iz said:** Cut\n\n**The passage now:** Line 2627: \"She brushed off the answer like he hadn't given it. There was no valuable information coming out of this conversation for her. Just threat.\"\n\n**What this is really asking:** She wants \"like he hadn't given it\" cut. The simile restates what \"brushed off\" already does; near-zero cargo.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree. And while in the sentence, the explaining middle clause (\"no valuable information coming out of this conversation for her\") can tighten too; it is his read of her, worth keeping, but baggy as phrased.\n\n**Suggested edit:** OLD: \"She brushed off the answer like he hadn't given it. There was no valuable information coming out of this conversation for her. Just threat.\" NEW: \"She brushed off the answer. There was nothing in this conversation for her. Just threat.\"","head":"","tail":"","rationale":"note cc4d7ee1-ac67-405c-ad84-d619cfee8d66 · priority low","draft":""},{"chapter":"21","seq":675,"type":"iz note","size":"medium","title":"IZ · The operator-read of Hesta: earn the leap, clean the fragments; his guilt is already answered later","proposal":"**Iz said:** Quite the conclusion without knowing more. Also you need to decide what he feels here... is he unaware the risk is so great? Does he know that and he's being selfish? Or unaware?\n\n**The passage now:** Line 2631: \"He thought about her questions. Who audits your absence. Who supplies you. What is our exposure when your operation fails. They were not a crew chief's questions. This was a person who had run something. something with risk. with cost. with fear. something that had needed to survive being looked for by men withh guns. He stood in the tunnel. with nothing to say.\"\n\n**What this is really asking:** Two asks: (1) the leap to \"looked for by men with guns\" feels unearned from what she actually asked on the page; (2) she wants his moral position on endangering these people decided.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Split verdict. On (2), the fresh text already answers her downstream: he knows exactly what he risks for them (\"any of a hundred threads that could end everyone in that cavern\") and his \"Tell me what you need me to do right now\" is him submitting to their risk discipline. No change needed there. On (1) she has a point sharpened by a real bug: the recap includes a question Hesta never asked in those words (\"What is our exposure when your operation fails\"), which inflates the leap, and the passage is the most fragment-garbled in the chapter (\"withh,\" lowercase run-ons). Recap her actual questions and the inference earns itself; the plant for the resistance network stays.\n\n**Suggested edit:** OLD: \"He thought about her questions. Who audits your absence. Who supplies you. What is our exposure when your operation fails. They were not a crew chief's questions. This was a person who had run something. something with risk. with cost. with fear. something that had needed to survive being looked for by men withh guns. He stood in the tunnel. with nothing to say.\" NEW: \"He thought about her questions. Who knows you're gone. Who supplies you. How do you leave, quietly, forever. They were not a crew chief's questions. They were the questions of someone who had run a thing that carried a death sentence, and had kept it from being found. He stood in the tunnel with nothing to say.\"","head":"","tail":"","rationale":"note d4cedc79-08c4-41ba-878a-d66c2f83be40 · priority medium","draft":""},{"chapter":"21","seq":676,"type":"iz note","size":"low","title":"IZ · Praise: \"I weighed it twice\"","proposal":"**Iz said:** This is a great moment\n\n**The passage now:** Line 2645: \"\\\"I weighed it twice.\\\" The man pointed, arm not quite steady, back across the cavern floor.\"\n\n**What this is really asking:** Pure praise for the quota-arrival beat: disbelief carried by a procedure (weighing twice) and a body detail (arm not quite steady), no narration of awe.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** She is right. This is the book's method working: the impossible fact arrives as a measurement. Protect the beat; change nothing.\n\n**Suggested edit:** None. No change; mark the beat protected.","head":"","tail":"","rationale":"note 060e303d-7795-4d0f-81e2-e4a789878527 · priority low","draft":""},{"chapter":"21","seq":677,"type":"iz note","size":"medium","title":"IZ · Don't add dialogue; trim the interior snare-read and let the fish/worm speech be the dialogue","proposal":"**Iz said:** Make this dialogue\n\n**The passage now:** Line 2653: \"Too good. He could read it off her like a log stream. Forty years in the shafts, fifty years on this planet, and nothing in either had ever once been this good without a hook in it. The quota in two hours was not a miracle to her. It was bait sitting in a snare she couldn't see yet, and the fact that she couldn't see it only proved how big the snare must be.\"\n\n**What this is really asking:** She wants Hesta's suspicion voiced between characters instead of narrated inside Burgundy. The instinct maps to our own rule that payoffs surfacing between characters beat payoffs resolving in the narrator's head.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Her instinct is right and the book already obeys it: four paragraphs later Hesta says this exact idea out loud, in her own idiom, to the whole crowd (the fish/worm line). Adding dialogue here would make her say it twice, and Hesta's power is how little she says. The correct edit runs the other direction: trim the interior pre-statement (this is one of the three redundant Hesta-decodings my reread flagged) so her speech is the FIRST full statement of the trap idea. That delivers what Iz actually wants: the suspicion lands in dialogue.\n\n**Suggested edit:** OLD: \"Too good. He could read it off her like a log stream. Forty years in the shafts, fifty years on this planet, and nothing in either had ever once been this good without a hook in it. The quota in two hours was not a miracle to her. It was bait sitting in a snare she couldn't see yet, and the fact that she couldn't see it only proved how big the snare must be.\" NEW: \"Too good. He could read it off her like a log stream. Forty years in the shafts, and nothing in them had ever once been this good without a hook in it.\"","head":"","tail":"","rationale":"note 3979a1fb-1fa0-4669-9bc2-3d8aa3933698 · priority medium","draft":""},{"chapter":"21","seq":678,"type":"iz note","size":"medium","title":"IZ · Hesta's speech: three line fixes (diction, narrator tic, fauna)","proposal":"**Iz said:** Three notes on one paragraph: \"Friends.\" (for \"hangs our organizers\"); \"She paused.\" (for \"A pause, one beat, surgical.\"); \"Do they have fish? Maybe bird\" (for the fish/worm line).\n\n**The passage now:** Line 2663, Hesta's public speech: \"...takes our wages, works our children, hangs our organizers. His father's men have six of ours in some dark cell right now.\\\" A pause, one beat, surgical. \\\"And his boy came down our shaft in the night... If a fish saw a worm do that, even the fish would think twice.\\\"\"\n\n**What this is really asking:** Three micro-asks on the chapter's centerpiece speech: (1) \"organizers\" swapped for \"friends\"; (2) the narrated pause flattened to plain prose; (3) a worldbuilding check on whether Dross has fish.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** (1) Her diction instinct is right: \"organizers\" is modern labor jargon, off-register for Dross. But \"friends\" loses the political charge, and the book already planted the right idiom: the King's Ch12 speech about \"a practice for the ones who talked\" (the public descent), and his \"a man speaks against the crown in a drink hall... down the hole by night.\" Use that. (2) Agree fully: \"A pause, one beat, surgical\" is the narrator admiring its own timing; the speech shows her control without help. (3) Legitimate catch: fish are never established on Dross, and a lifetime-underground forewoman reaching for an angling idiom is doubly odd. A straight bird swap breaks the bait logic, but bait itself is in-world (the Ch12 preserve hunt runs on scattered grain, and the buck that didn't think twice got shot), so a grain-in-the-open version keeps the trap shape with established texture. The one established bird is the ladderfinch, a mine bird Hesta would know, if Johnny wants the specific noun. Flag the exact wording as a taste call for Johnny.\n\n**Suggested edit:** Three pairs. (1) OLD: \"hangs our organizers\" NEW: \"hangs the ones who talk\". (2) OLD: \"A pause, one beat, surgical.\" NEW: \"She paused.\" (3) OLD: \"If a fish saw a worm do that, even the fish would think twice.\" NEW: \"If a bird saw grain thrown down in the open, even the bird would think twice.\"","head":"","tail":"","rationale":"note 74793b5f-5865-4ea4-9781-5e7a124848ab, 6643c0c9-6de8-40a5-8a4c-0c7c445732a0, 1a2daa6f-7c43-4b0c-bd5d-b329a5867088 · priority medium","draft":""},{"chapter":"21","seq":679,"type":"iz note","size":"medium","title":"IZ · Cut \"There was no sentence that proved anything.\"","proposal":"**Iz said:** Cut this sentence\n\n**The passage now:** Line 2667: \"Every word he could offer, an informer could offer. Every promise he could make, the regime had made and broken to these people in some generation or another. There was no sentence that proved anything.\"\n\n**What this is really asking:** She wants the closing summary sentence cut. The two parallel sentences before it already deliver the idea, and the chapter stated the same theme once already (\"Words were not going to fix it\").\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree fully. Textbook Last Step violation: the parallel pair does the work, the summary sentence explains it, and the next line (\"So he said the only thing that was both true and useful\") turns harder against the unexplained pair. Words-prove-nothing is the chapter's designed point, which is exactly why it must not be announced a third time.\n\n**Suggested edit:** OLD: \"...the regime had made and broken to these people in some generation or another. There was no sentence that proved anything.\" NEW: \"...the regime had made and broken to these people in some generation or another.\"","head":"","tail":"","rationale":"note c3123965-d9e2-4555-9a08-7ac68ec7c4ae · priority medium","draft":""},{"chapter":"21","seq":680,"type":"iz note","size":"medium","title":"IZ · Drop the \"never seen anything like it\" claim; the snapshot carries it","proposal":"**Iz said:** Really? It doesn't sound that striking or like he wouldn't have seen it before.\n\n**The passage now:** Line 2689: \"One clank. Then the cavern was back to work, for real this time.  Burgundy had never seen anything like it: thirty people turning toward the wall picks finding rock,  the girl with the milk-glass eye materializing atop a cart with her eyes on the cage shaft, Tobin already ten feet away with his hands full of timber. For three seconds the entire cavern was a snapshot of an ordinary shift, held taut. Obeying.\"\n\n**What this is really asking:** She challenges the superlative: a cavern going back to work does not sound unprecedented. She has caught an inflation claim where the actually-striking thing (an entire community snapping into rehearsed camouflage on one clank) is being told instead of trusted.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree. The specifics ARE extraordinary and need no announcement; the claim sentence weakens them by promising more than \"people working\" appears to deliver. Cut the claim, run the list straight off the colon, and fix the dropped comma. Keep \"held taut. Obeying.\" — that closing pair is the observation the claim was reaching for.\n\n**Suggested edit:** OLD: \"One clank. Then the cavern was back to work, for real this time.  Burgundy had never seen anything like it: thirty people turning toward the wall picks finding rock,  the girl with the milk-glass eye materializing atop a cart with her eyes on the cage shaft, Tobin already ten feet away with his hands full of timber.\" NEW: \"One clank. Then the cavern was back to work, for real this time: thirty people turning toward the wall, picks finding rock, the girl with the milk-glass eye atop a cart with her eyes on the cage shaft, Tobin already ten feet away with his hands full of timber.\"","head":"","tail":"","rationale":"note 3d4e6020-2041-4051-9d40-06a621a74f15 · priority medium","draft":""},{"chapter":"21","seq":681,"type":"iz note","size":"medium","title":"IZ · \"Came back up as something else\": cut the vague inflation, keep the concrete list","proposal":"**Iz said:** Just describe this feeling for real. What did he come back as?\n\n**The passage now:** Line 2705: \"He had gone down a tunnel to retrieve three runaway mining machines, and had come back up as something else — measured by a woman who ran something, scheduled into a network that had survived being looked for, four words of a child's observation still ringing in his ears.\"\n\n**What this is really asking:** She is poking at \"as something else,\" a zero-cargo placeholder, and asking the prose to commit. Her framing (\"describe this feeling for real\") pulls toward naming the emotion.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree with the symptom, resist the naming. \"As something else\" is the inflation move wearing an em dash; but the sentence's own list (measured, scheduled, the four words) IS the answer to \"what did he come back as,\" and the paragraph's button two lines down (\"It had found other people.\") is the feeling, delivered as fact. Cut the placeholder, break the dash into a period, and let the list state it plainly.\n\n**Suggested edit:** OLD: \"He had gone down a tunnel to retrieve three runaway mining machines, and had come back up as something else — measured by a woman who ran something, scheduled into a network that had survived being looked for, four words of a child's observation still ringing in his ears.\" NEW: \"He had gone down a tunnel to retrieve three runaway mining machines. He had come back up measured by a woman who ran something, scheduled into a network that had survived being looked for, with four words of a child's observation still ringing in his ears.\"","head":"","tail":"","rationale":"note 0b825888-907e-4fa8-baeb-3440e91a3a15 · priority medium","draft":""},{"chapter":"21","seq":682,"type":"your note","size":"low","title":"YOU · 'The smallest in the group'","proposal":"**Your note:** On 'It was the small[est]' — \"Smallest one in the group\"\n\n**The passage now:** Line 2543: \"It was the smallest in the group.\"\n\n**What this is really asking:** Set up the child before revealing her.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Done — a clean withheld-reveal into the milk-eye girl.","head":"","tail":"","rationale":"note 434dac35-cf0b-4693-b46c-cb0ae5557773 · priority low","draft":""},{"chapter":"21","seq":683,"type":"your note","size":"low","title":"YOU · Italicize 'Prince'","proposal":"**Your note:** \"Italics\" on the word passing through the crowd.\n\n**The passage now:** Line 2555: \"*Prince.*\"\n\n**What this is really asking:** The word as overheard object, not narration.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Done. (Remember italics only survive to publish via the markdown-emphasis pipeline — REPUBLISH to see it.)","head":"","tail":"","rationale":"note 36c36470-f5ef-4fa6-8eeb-f33a8d7bd08e · priority low","draft":""},{"chapter":"21","seq":684,"type":"your note","size":"low","title":"YOU · Revise 'patient industry of them'","proposal":"**Your note:** On 'freezing mid-reach, the whole patient industry of them' — \"Revise\"\n\n**The passage now:** Line 2569: \"drills stilling mid-rotation, arms freezing mid-reach, all motion cut off between one heartbeat and the next\".\n\n**What this is really asking:** 'Patient industry of them' was an abstraction where the halt needed physics.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Revised into pure concrete motion — and the paragraph it opens (the first true silence South 12 ever held) is now the chapter's best passage.","head":"","tail":"","rationale":"note d2689e61-23b9-4ee7-ba9c-d36d35e661aa · priority low","draft":""},{"chapter":"21","seq":685,"type":"your note","size":"medium","title":"YOU · 'South Twelfth' → 'South 12'","proposal":"**Your note:** Two notes: \"12\" on 'a silence the South Twelfth...' and on 'from the palace to South Twelfth'.\n\n**The passage now:** Both targets fixed: \"the South 12 shaft\" (2569) and \"from the palace to South 12\" (2607). But 'South Twelfth' survives twice downstream: ch22 line 2800 and the ch28 frame line 3064.\n\n**What this is really asking:** Normalize the shaft's name to the numeral form used everywhere since ch1.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Addressed at his targets; the ask is systematic, so finish the sweep in the two stragglers.\n\n**Suggested edit:** Global: replace \"South Twelfth\" with \"South 12\" at line 2800 (ch22 prose) and line 3064 (ch28 frame).","head":"","tail":"","rationale":"note a0dfba66-af27-4c2d-98b0-de57c6eeeb9b, 943a4950-c496-4f09-adc5-b6a6f665871d · priority medium","draft":""},{"chapter":"21","seq":686,"type":"your note","size":"medium","title":"YOU · 'These were his... who obeyed his order' — raw fragment","proposal":"**Your note:** On 'these robots doing their work' — \"Who obeyed his order\"\n\n**The passage now:** Line 2573: \"It was clear now that these were his. These robots doing their work. Who obeyed his order\" — the dictated fragment was pasted in raw (no period, fragment syntax).\n\n**What this is really asking:** The crowd's inference must land: the halt proved ownership — these machines answer to the prince.\ eing seen is the function he built, not him. Present-tense only, the hands carry it, never the word ashamed.","head":"The pressure lifted out of his molars. The cargo field was empty.","tail":"\"Thank you, Father,\" he said.","rationale":"Pillar I wound (seen as function, not himself) against the visible-face King, via the engineer's-hands device.","draft":"Insert new paragraph: \"His father was still looking at him. Burgundy could not remember a look that had stayed on him this long. He kept his hands in his coat pockets, where last night's sealant was still cracked into the knuckle creases, and let his father see the prince.\""},{"chapter":"20","seq":10,"type":"new-paragraph","size":"small","title":"Want-engine: the Vicentennial plan, held silently","proposal":"I'm going to add one paragraph right after the kindest-thing line, surfacing the plan the want-engine edits seed upstream: nine months; he walks at his father's side and holds the plan where he always holds it, next to the fear for Ran: the Vicentennial, this field, the machines rolling out of the dark to work in front of everyone; his father would see what his son had not given up. It answers the King's 'I'm glad you gave up those childish things' without a word spoken.","head":"the kindest thing his father had ever said to him.","tail":"He was released an hour before dusk,","rationale":"Want-engine alive in the last pre-Freeze chapters; interiority never staged into dialogue.","draft":"Insert new paragraph: \"Nine months. He walked at his father's side and held the plan where he always held it, next to the fear for Ran: the Vicentennial, this field, the machines rolling out of the dark to work in front of everyone. His father would see what his son had not given up.\""},{"chapter":"21","seq":1,"type":"age-fix","size":"tiny","title":"'Almost two years of chewing' becomes weeks","proposal":"I'm going to change 'where almost two years of patient insufficient chewing' to 'where weeks of patient, insufficient ent the lamp finds the Ghai mark and Burgundy reaches for what his tutors taught. Trigger: the circle-within-a-circle engraving. The current vague line ('faded, collapsed, dispersed, were conquered. Something. He didn't remember.') stays as the placeholder; when Johnny supplies the real story of what happened to the Ghai and how it connects to the tribute order, it threads here, still filtered through a bored tutor's half-remembered lesson. I am writing no geopolitical content now.","head":"and a capital no raider ever found because it had no outside.","tail":"But he did remember that their tunnels had been filled in centuries ago","rationale":"Tutor-memory content parked; slot only.","draft":""},{"chapter":"21","seq":5,"type":"line-edit","size":"tiny","title":"Fix the dangling 'specific gravity' clause","proposal":"I'm going to change 'But the dark ahead of him was pulling with the specific gravity.' to 'But the dark ahead of him was pulling.' The half-finished physics metaphor stops the sentence dead; the machine-sound in the next line is the real pull.","head":"The logs alone were a life's work, the bundles in the tunnel were a hoard.","tail":"And somewhere in that dark, faint and rhythmic in the silence","rationale":"Cargo Test: a comparison with no payload gets cut.","draft":"change \"But the dark ahead of him was pulling with the specific gravity.\" to \"But the dark ahead of him was pulling.\""},{"chapter":"22","seq":1,"type":"line-edit","size":"small","title":"Em-dash sweep, chapter 22 (8 instances)","proposal":"Chapter 22 carries eight em dashes and the ban is absolute, so I'm going to recast every one (this edit is the sweep; two more instances are handled inside my seq-4 and seq-9 edits): (1) 'crowd's edge — a girl,' becomes 'crowd's edge, a girl,'; (2) '*Stopped* — drills stilling' becomes '*Stopped*: drills stilling'; (3) 'a piece of it — *first the sheds, now this* — and he did not need the rest' becomes 'a piece of it: *first the sheds, now this*. He const KEY = 'bill-burgundy-proposal-v3';
let R = {};
try{ const p = JSON.parse(localStorage.getItem(KEY) || '{}'); R = (p && typeof p==='object' && !Array.isArray(p)) ? p : {}; }catch(e){ R = {}; }
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const TYPE_LABEL = { 'age-fix':'number fix','line-edit':'line edit','timing-marker':'timing marker','new-paragraph':'new paragraph','new-scene':'new scene','new-chapter':'new chapter','restructure':'restructure','flashback-slot':'flashback slot','parked':'parked (geo)','open-question':'open question' };
const TYPE_COLOR = { 'age-fix':'var(--gold)','line-edit':'var(--gold)','timing-marker':'var(--gold)','new-paragraph':'var(--green)','new-scene':'var(--oxblood)','new-chapter':'var(--oxblood)','restructure':'var(--red)','flashback-slot':'var(--purple)','parked':'var(--purple)','open-question':'var(--blue)' };

const edits = DATA.edits.map((e,i)=>({...e, id: 'e'+i}));
const total = edits.length;

$('#byline').textContent = 'chronological · '+total+' proposed edits · accept, reject, or comment on each';
$('#intro').innerHTML = DATA.intro.split(/\n\n+/).map(p=>'<p>'+esc(p)+'</p>').join('');

// legend (only types present)
const present = [...new Set(edits.map(e=>e.type))];
$('#legend').innerHTML = present.map(t=>'<span class="lg"><span class="sw" style="background:'+TYPE_COLOR[t]+'"></span>'+esc(TYPE_LABEL[t]||t)+'</span>').join('');

// group by chapter, chronological
function chapKey(c){ const m = String(c).match(/\d+/); return m ? parseInt(m[0]) + (String(c).toLowerCase().includes('new')? 0.5 : 0) : 99; }
const groups = {};
edits.forEach(e=>{ (groups[e.chapter] = groups[e.chapter] || []).push(e); });
const chapOrder = Object.keys(groups).sort((a,b)=>chapKey(a)-chapKey(b) || String(a).localeCompare(String(b)));
chapOrder.forEach(c => groups[c].sort((a,b)=>(a.seq||0)-(b.seq||0)));

const cbox = $('#chapters');
chapOrder.forEach(c=>{
  const sec = document.createElement('section'); sec.className='chap';
  let h = '<div class="chap-head"><h2>'+(String(c).match(/^\d+$/)?'Chapter '+c:esc(c))+'</h2><span class="cnt">'+groups[c].length+' edits</span></div>';
  groups[c].forEach(e=>{
    const st = R[e.id]||{};
    h += '<div class="ed" data-t="'+esc(e.type)+'" data-id="'+e.id+'">';
    h += '<div class="ed-top"><span class="pill type">'+esc(TYPE_LABEL[e.type]||e.type)+'</span><span class="pill">'+esc(e.size)+'</span></div>';
    h += '<h4>'+esc(e.title)+'</h4>';
    h += '<p class="prop">'+esc(e.proposal)+'</p>';
    if(e.draft) h += '<div class="draft"><b>the change</b>'+esc(e.draft)+'</div>';
    if(e.head || e.tail){
      h += '<p class="anchor">';
      if(e.head) h += '<b>after</b><span class="h">“…'+esc(e.head)+'”</span> ';
      h += '<span class="mark">◆</span>';
      if(e.tail) h += ' <b>before</b><span class="t">“'+esc(e.tail)+'…”</span>';
      h += '</p>';
    }
    if(e.rationale) h += '<p class="why">'+esc(e.rationale)+'</p>';
    h += '<div class="verd">';
    h += '<button class="vbtn acc'+(st.v==='accept'?' on':'')+'" data-id="'+e.id+'" data-v="accept">✓ accept</button>';
    h += '<button class="vbtn rej'+(st.v==='reject'?' on':'')+'" data-id="'+e.id+'" data-v="reject">✗ reject</button>';
    h += '<span class="cmt"><input data-id="'+e.id+'" placeholder="comment…" value="'+esc(st.c||'')+'"></span>';
    h += '</div></div>';
  });
  sec.innerHTML = h; cbox.appendChild(sec);
});

function ruled(id){ const s=R[id]||{}; return !!(s.v || (s.c && s.c.trim())); }
const doneSet = new Set(edits.filter(e=>ruled(e.id)).map(e=>e.id));
function refreshBar(){
  $('#pText').textContent = doneSet.size+' of '+total+' ruled';
  $('#fill').style.width=(total?doneSet.size/total*100:0)+'%';
}
function refresh(){ doneSet.clear(); edits.forEach(e=>{ if(ruled(e.id)) doneSet.add(e.id); }); refreshBar(); }
let saveTimer=null;
function persist(){ localStorage.setItem(KEY, JSON.stringify(R)); }
function persistSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(persist, 400); }
window.addEventListener('beforeunload', persist);
window.addEventListener('pagehide', persist);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') persist(); });
function updateOne(id){ if(ruled(id)) doneSet.add(id); else doneSet.delete(id); refreshBar(); }
function save(){ persist(); refresh(); }

document.body.addEventListener('click', ev=>{
  const b=ev.target.closest('.vbtn'); if(!b) return;
  const id=b.dataset.id, v=b.dataset.v;
  R[id]=R[id]||{};
  R[id].v = R[id].v===v ? null : v;
  const card=document.querySelector('.ed[data-id="'+id+'"]');
  card.querySelectorAll('.vbtn').forEach(x=>x.classList.toggle('on', x.dataset.v===R[id].v));
  updateOne(id); persist();
});
document.body.addEventListener('input', ev=>{
  const inp=ev.target.closest('.cmt input'); if(!inp) return;
  const id=inp.dataset.id; R[id]=R[id]||{}; R[id].c=inp.value;
  updateOne(id); persistSoon();
});
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1900); }

$('#accAllBtn').addEventListener('click', ()=>{
  edits.forEach(e=>{ if(!ruled(e.id)){ R[e.id]=R[e.id]||{}; R[e.id].v='accept'; } });
  document.querySelectorAll('.ed').forEach(card=>{
    const id=card.dataset.id; card.querySelectorAll('.vbtn').forEach(x=>x.classList.toggle('on', x.dataset.v===(R[id]&&R[id].v)));
  });
  save(); toast('accepted the rest');
});
$('#clearBtn').addEventListener('click', ()=>{
  if(!confirm('Clear all your rulings?')) return;
  R={}; localStorage.removeItem(KEY);
  document.querySelectorAll('.vbtn').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.cmt input').forEach(i=>i.value='');
  refresh(); toast('cleared');
});
$('#exportBtn').addEventListener('click', async ()=>{
  let md='# BURGUNDY — Johnny\'s rulings on the Edit Proposal\n\n';
  chapOrder.forEach(c=>{
    md+='\n## '+(String(c).match(/^\d+$/)?'Chapter '+c:c)+'\n';
    groups[c].forEach(e=>{
      const s=R[e.id]||{};
      md+='\n### '+e.title+' ['+(TYPE_LABEL[e.type]||e.type)+' · '+e.size+']\n';
      md+='- **Verdict:** '+(s.v?s.v.toUpperCase():'_(unruled)_')+'\n';
      if(s.c&&s.c.trim()) md+='- **Johnny:** '+s.c.trim()+'\n';
    });
  });
  try{ await navigator.clipboard.writeText(md); toast('copied — paste it back to Parley'); }catch(e){ toast('downloaded'); }
  const blob=new Blob([md],{type:'text/markdown'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='BURGUNDY-edit-rulings.md'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
});
const tb=$('#themeBtn');
function setTheme(t){ document.documentElement.dataset.theme=t; tb.textContent=t==='night'?'☀ day':'☾ night'; try{localStorage.setItem('bill-theme',t);}catch(e){} }
let bootTheme='day'; try{ bootTheme=localStorage.getItem('bill-theme')||'day'; }catch(e){}
setTheme(bootTheme);
tb.addEventListener('click', ()=>setTheme(document.documentElement.dataset.theme==='night'?'day':'night'));
refresh();
</script>
