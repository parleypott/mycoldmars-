<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill · BURGUNDY — The Edit Proposal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%99%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --paper:#f3ead9; --paper-2:#efe4cf; --card:#faf3e6; --ink:#211a14; --ink-soft:#5b4f42;
    --ink-faint:#8a7c69; --rule:#d8c8ab; --oxblood:#7c2130; --red:#b8332c; --gold:#a9853f;
    --green:#4a6741; --blue:#3d5a6e; --purple:#5d4a6e;
    --shadow:0 1px 0 rgba(120,90,40,.08), 0 12px 34px -20px rgba(60,40,20,.55);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --disp:"Hoefler Text","Iowan Old Style",Palatino,Georgia,serif;
    --mono:"SF Mono",ui-monospace,"Menlo","Consolas",monospace;
  }
  html[data-theme="night"]{
    --paper:#171310; --paper-2:#1d1813; --card:#221b15; --ink:#eadfce; --ink-soft:#c3b39a;
    --ink-faint:#8c7c66; --rule:#3a2f24; --oxblood:#d98a92; --red:#e0776d; --gold:#d6b673;
    --green:#8fb283; --blue:#8ab0c4; --purple:#b09ac4;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 14px 40px -22px rgba(0,0,0,.85);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:radial-gradient(120% 80% at 50% -10%, rgba(169,133,63,.10), transparent 60%),var(--paper);
    color:var(--ink); font-family:var(--serif); font-size:17.5px; line-height:1.6; -webkit-font-smoothing:antialiased; padding-bottom:110px}
  .wrap{max-width:860px; margin:0 auto; padding:0 20px}
  header.masthead{padding:52px 0 20px; text-align:center}
  .emblem{display:inline-flex; align-items:baseline; gap:.04em; font-family:var(--disp); font-size:60px; line-height:1}
  .emblem .b{color:var(--ink); font-weight:600; position:relative; padding-bottom:6px}
  .emblem .b::after{content:""; position:absolute; left:2%; right:2%; bottom:0; height:4px; background:linear-gradient(90deg,var(--red),var(--oxblood)); border-radius:2px}
  .spark{color:var(--gold); font-size:24px; transform:translateY(-20px); margin-left:2px}
  .kicker{font-family:var(--mono); font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--ink-faint); margin:20px 0 6px}
  h1.title{font-family:var(--disp); font-weight:600; font-size:36px; line-height:1.1; margin:.1em 0 .15em}
  .byline{font-family:var(--mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--oxblood); margin-top:14px}
  .rule{height:1px; background:linear-gradient(90deg,transparent,var(--rule) 15%,var(--rule) 85%,transparent); margin:28px 0}
  .letter{background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:26px 28px 22px; box-shadow:var(--shadow); position:relative}
  .letter::before{content:"how to use this"; position:absolute; top:-9px; left:22px; background:var(--card); padding:0 10px; font-family:var(--mono); font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--gold)}
  .letter p{margin:0 0 12px} .letter p:last-child{margin-bottom:0}

  /* legend */
  .legend{display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 0}
  .lg{display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); border:1px solid var(--rule); border-radius:20px; padding:4px 11px}
  .lg .sw{width:10px; height:10px; border-radius:3px; display:inline-block}

  /* chapters */
  .chap{margin-top:44px}
  .chap-head{display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter:blur(8px); padding:10px 0; border-bottom:1px solid var(--rule)}
  .chap-head h2{font-family:var(--disp); font-weight:600; font-size:24px; margin:0}
  .chap-head .cnt{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--ink-faint); text-transform:uppercase}

  /* edit cards */
  .ed{background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:16px 18px; margin:14px 0; box-shadow:var(--shadow); border-left-width:4px; border-left-style:solid}
  .ed[data-t="age-fix"], .ed[data-t="line-edit"], .ed[data-t="timing-marker"]{border-left-color:var(--gold)}
  .ed[data-t="new-paragraph"]{border-left-color:var(--green)}
  .ed[data-t="new-scene"], .ed[data-t="new-chapter"]{border-left-color:var(--oxblood)}
  .ed[data-t="restructure"]{border-left-color:var(--red)}
  .ed[data-t="flashback-slot"], .ed[data-t="parked"]{border-left-color:var(--purple)}
  .ed[data-t="open-question"]{border-left-color:var(--blue)}
  .ed-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px}
  .pill{font-family:var(--mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; padding:3px 8px; border-radius:20px; border:1px solid var(--rule); color:var(--ink-soft)}
  .pill.type{font-weight:600}
  .ed[data-t="new-scene"] .pill.type, .ed[data-t="new-chapter"] .pill.type{color:var(--oxblood); border-color:var(--oxblood)}
  .ed[data-t="new-paragraph"] .pill.type{color:var(--green); border-color:var(--green)}
  .ed[data-t="restructure"] .pill.type{color:var(--red); border-color:var(--red)}
  .ed[data-t="flashback-slot"] .pill.type, .ed[data-t="parked"] .pill.type{color:var(--purple); border-color:var(--purple)}
  .ed[data-t="open-question"] .pill.type{color:var(--blue); border-color:var(--blue)}
  .ed[data-t="age-fix"] .pill.type, .ed[data-t="line-edit"] .pill.type, .ed[data-t="timing-marker"] .pill.type{color:var(--gold); border-color:var(--gold)}
  .ed h4{font-family:var(--disp); font-weight:600; font-size:19px; margin:0 0 7px; line-height:1.25}
  .ed .prop{margin:0 0 10px; font-size:16px}
  .ed .why{font-size:13.5px; color:var(--ink-faint); font-style:italic; margin:0 0 10px}
  .ed .draft{font-size:14.5px; color:var(--ink-soft); background:var(--paper-2); border:1px dashed var(--rule); border-radius:8px; padding:9px 12px; margin:0 0 10px}
  .ed .draft b{font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:400; display:block; margin-bottom:4px}
  .anchor{font-size:13px; color:var(--ink-faint); margin:0 0 12px; line-height:1.5}
  .anchor .h,.anchor .t{font-style:italic}
  .anchor b{font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; font-style:normal; color:var(--ink-faint); margin-right:4px}
  .anchor .mark{color:var(--oxblood); font-weight:700; font-style:normal; padding:0 3px}

  /* verdict row */
  .verd{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .vbtn{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; padding:7px 14px; border-radius:8px; border:1px solid var(--rule); background:transparent; color:var(--ink-soft); cursor:pointer; transition:.12s}
  .vbtn:hover{border-color:var(--ink-soft)}
  .vbtn.acc.on{background:var(--green); border-color:var(--green); color:var(--paper)}
  .vbtn.rej.on{background:var(--red); border-color:var(--red); color:var(--paper)}
  .cmt{flex:1; min-width:160px}
  .cmt input{width:100%; background:var(--paper); color:var(--ink); border:1px solid var(--rule); border-radius:8px; padding:8px 11px; font-family:var(--serif); font-size:14px}
  .cmt input:focus{outline:none; border-color:var(--oxblood)}

  .bar{position:fixed; left:0; right:0; bottom:0; z-index:40; backdrop-filter:blur(10px); background:color-mix(in srgb, var(--paper) 86%, transparent); border-top:1px solid var(--rule)}
  .bar-in{max-width:860px; margin:0 auto; padding:11px 20px; display:flex; align-items:center; gap:14px}
  .progress{flex:1; display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:11.5px; color:var(--ink-soft)}
  .track{flex:1; height:6px; background:var(--rule); border-radius:6px; overflow:hidden; max-width:240px}
  .fill{height:100%; width:0; background:linear-gradient(90deg,var(--oxblood),var(--gold)); transition:width .3s}
  button.act{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--oxblood); color:var(--paper); background:var(--oxblood); padding:9px 14px; border-radius:8px; cursor:pointer}
  button.ghost{background:transparent; color:var(--oxblood)}
  .theme-btn{position:absolute; top:16px; right:18px; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); background:transparent; border:1px solid var(--rule); border-radius:20px; padding:5px 11px; cursor:pointer}
  .toast{position:fixed; bottom:70px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0; background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:10px; font-size:13.5px; font-family:var(--mono); transition:.25s; pointer-events:none; z-index:50}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  @media(max-width:640px){ h1.title{font-size:30px} .emblem{font-size:50px} .letter{padding:20px} .ed{padding:14px} }
</style>
</head>
<body>
<button class="theme-btn" id="themeBtn">☾ night</button>
<div class="wrap">
  <header class="masthead">
    <div class="emblem"><span class="b">B</span><span class="spark">✦</span></div>
    <div class="kicker">Bill · your story wizard</div>
    <h1 class="title">BURGUNDY: The Edit Proposal</h1>
    <div class="byline" id="byline"></div>
  </header>

  <div class="letter" id="intro"></div>

  <div class="legend" id="legend"></div>

  <div id="chapters"></div>
</div>

<div class="bar"><div class="bar-in">
  <div class="progress"><span id="pText">0 ruled</span><span class="track"><span class="fill" id="fill"></span></span></div>
  <button class="act ghost" id="accAllBtn" title="accept everything not yet ruled">accept rest</button>
  <button class="act ghost" id="clearBtn">clear</button>
  <button class="act" id="exportBtn">export ↧</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
const DATA = {"intro":"Johnny — this is the merged edit proposal for the BURGUNDY big edit, assembled from all six range editors and checked line by line against the master decision digest. Every item is one decision you can accept or reject on its own. They run in book order, chapter by chapter, and each one carries a verbatim head/tail anchor so you can see exactly where it lands in the manuscript.\n\nThree chief-editor calls to know about: (1) The quilt tradition was proposed in both ch1 and ch6; I kept the ch6 version because it's better specified and sits inside the birthday-memory scene where Tuck's mother is already telling stories — ch1 still gets the birthday-night reframe and the tour-dread seed. (2) The one-new-scene budget is spent on the ch13 birthday opening, as both editors converged on; no separate loneliness scene is proposed anywhere. (3) The completeness check found two gaps — Tuck's provider-act object (the pedal rig) and Mira's small age drift in ch14 — and I added an edit for each, using only anchor text the range editors supplied.\n\nTwo items are marked open-question (the King's own-hands act, ch13 and ch19 variants) — those wait for your ruling and shouldn't both run at full strength. Everything marked \"parked\" is a slot only: location and trigger, geopolitics content to come from you. Sizes run from a single number change to the new ch13 section; accept, reject, or redirect per line.","edits":[{"chapter":"1","seq":1,"type":"restructure","size":"medium","title":"Recast Chapter 1 as the night after his 17th birthday","proposal":"I'm going to insert a short framing passage on page one, right after the hand-shake beat and before any worldbuilding, that locks the new premise: this is the night after his seventeenth birthday (Twinrise, said plainly), tomorrow morning he reports to council for the first time in his robes because seventeen is the age a prince begins, he did not ask to see his father (the rite asked for him), and the robot under the tarp is his own addition, the thing he plans to bring to show the kind of prince he means to be. I'll carry the wound in one concrete interior beat here (tomorrow his father would look at him for the first time in years, and what he wanted his father's eyes to land on was the machine, then him; fact stated, then stop), no theme announced.","head":"The number didn't bother him. The shake in his right hand did.","tail":"The basement smelled like smoking copper.","rationale":"Locked timeline (ch1 = night after 17th birthday, the rite, robot brought unbidden) plus Pillar I plunge/want/wound planted page one.","draft":""},{"chapter":"1","seq":2,"type":"age-fix","size":"tiny","title":"Nineteen becomes seventeen","proposal":"I'm going to change nineteen to seventeen and leave the two years untouched, since he started building at about fifteen and the pre-pitch two-years count is correct under the new timeline.","head":"the smell of it, yeast and iron and woodsmoke.","tail":"His *prototype, *he called it to himself.","rationale":"Locked timing fix: ch1 \"nineteen now\" becomes \"seventeen now\".","draft":"Change \"He was nineteen now and had been working on this thing for two years.\" to \"He was seventeen now and had been working on this thing for two years.\""},{"chapter":"1","seq":3,"type":"age-fix","size":"tiny","title":"Decade line recalced to nine years","proposal":"I'm going to change \"over a decade\" to \"nine years\" so the since-he-was-eight math holds at seventeen.","head":"Two years. Or, that was the official count.","tail":"when he had taken apart the desk clock in the receiving room","rationale":"Timing recalc for training at seventeen (eight to seventeen is nine years).","draft":"Change \"working on something like the prototype for over a decade, since he was eight years old\" to \"working on something like the prototype for nine years, since he was eight years old\""},{"chapter":"1","seq":4,"type":"new-scene","size":"large","title":"The mineshaft memory rewritten as the lozenge atrocity","proposal":"I'm going to replace the whole miners rumination block (from \"He thought, sometimes, about the miners.\" through \"and he was aware that this was also possibly true.\") with the age-12 South 12 memory: taken down for a corvite demonstration ringed by soldiers, lines of workers filing past including children, the sulfur smell coming up out of the ground, and a compact vivid child's-eye rendering of the mine itself (work lights making the air look solid, the half-hour cage ride, the labyrinth no one person knows); an attendant hands him a honey-colored lozenge to kill the smell and he pockets a handful; he passes a boy his own age working a chisel and puts a lozenge in the boy's hand; his father slaps it away, crushes it under his heel, and says he is not to do that; nothing else said, scene ends. I'll keep three existing assets inside the rewrite: the woman working the rock (including \"I built it for a woman whose name I do not know\"), the greycaps detail (pays off in the ch7 market), and the rim-inspections-in-the-embroidered-coat fact. No misery tour; the lozenge carries the horror.","head":"and his father had never mentioned it again.","tail":"His father did not know about the basement.","rationale":"Locked Pillar III atrocity: the ch1 mineshaft/lozenge memory with a compact sensory mine description.","draft":""},{"chapter":"1","seq":5,"type":"parked","size":"small","title":"Tribute-ships passage held as geopolitics slot","proposal":"I'm going to hold the run about the King of Dross, the \"our ores make travel between the stars possible\" dinner line, the tribute ships, the \"Everything\" exchange, and the Nicholas naming as the ch1 fragment-seed slot: location stays (the window, the ships descending, the child's question), the Kettletown-view description stays regardless, but the geopolitical content inside it is a placeholder to be rewritten from Johnny's real geopolitical story. I will not polish or extend this material now.","head":"Burgundy hoped his father did not know about the basement. It was possible that he did.","tail":"The basement where he now worked had been a wine cellar once","rationale":"Locked parking: Dross geopolitics parked; this is the ch1 fragment-seed slot (trigger: tribute ships from the window).","draft":""},{"chapter":"1","seq":6,"type":"new-paragraph","size":"medium","title":"Restore the mother-glance dinner passage","proposal":"I'm going to restore the struck dinner passage and revise it: the dinner becomes last night's birthday dinner (his seventeenth, Twinrise), I keep both glance beats and the core image of him watching Mira watch him and not being able to tell whether she sees him or the answer she built (the watch-a-clock-you-built-yourself image stays), I trim the guest-list inventory to two or three concrete strokes, cap the negation run at the end (\"He was probably inventing it.\" survives, the pile-up before it thins), and keep it strictly one-directional interior recognition, never staged into dialogue.","head":"He had been careful in his rehearsals not to imagine his father's response.","tail":"The code terminal blipped. The torque simulation had finished and produced an output graph","rationale":"Johnny's restore list names the ch1 mother-glance passage; Mira carries the wound; negation tic capped.","draft":""},{"chapter":"1","seq":7,"type":"timing-marker","size":"small","title":"Vicentennial three years off, spoken at the birthday dinner","proposal":"I'm going to put the first Vicentennial marker inside the restored dinner passage, in a character's mouth: a minister's toast that names three years to the Vicentennial and the prince starting training in the morning, which the King accepts without looking at his son. Plain, spoken, no header, no day-count.","head":"she had looked at him across the table, briefly, and then looked away.","tail":"That night they were joined by the finance minister, The governor of the northern fields,","rationale":"Vicentennial ladder: ch1-2 carries the three-years-off marker, said plainly amid the rite seeding.","draft":"Sketch: Somewhere down the table the finance minister lifted his glass. \"Three years to the Vicentennial, sire, and the prince to council in the morning. Good timing.\" His father accepted the toast without looking at him."},{"chapter":"1","seq":8,"type":"new-paragraph","size":"small","title":"Seed the marriage-tour dread and the why-tonight","proposal":"I'm going to replace the \"pitch waiting for him in the morning\" sentence with a short passage that lays out the road he has known his whole life: training at seventeen, then the rite, then the tour, then home with a wife the way his father came home with Mira; the dread stated as flat fact, one beat, and then the turn: the robot is finished tonight because it is the one thing on that road he put there himself, the thing that might bend the track. No plan yet, just the why.","head":"The number had ticked over to thirty-two hours.","tail":"The boiler coughed below.","rationale":"Locked want-engine: tour-dread seeded in ch1-2; the robot is ready on the birthday night because it might change the trajectory.","draft":"Sketch: He should sleep. But tomorrow was council, robes, the start of the road he had known since he was small: training, then the rite, then the tour, then home with a wife the way his father had come home with Mira. The robot under the tarp was the one thing on that road he had put there himself."},{"chapter":"2","seq":1,"type":"restructure","size":"chapter","title":"Merge old Ch2 and Ch3 into new Chapter 2","proposal":"I'm going to merge old Chapter 2 (The Kings' Hall) and old Chapter 3 (I Rule Men) into a single new Chapter 2 titled \"I Rule Men\": hall arrival, presentation, rejection, and the rite-and-tour seeding all in one chapter, with the Chapter 3 heading struck. Old Chapter 4 (Mira's Wing) keeps its own chapter and renumbers to Chapter 3, so the digest's beat order (rejection, then Mira shows him the room) is preserved across a clean chapter turn rather than one overlong chapter; everything downstream renumbers by one. Redistribution map: old ch1 becomes new ch1 whole (reframed as birthday night); old ch2's hall and window description survives inside new ch2 but the three-villages preserve detail moves out (next edit) and the Nicholas tutor memory becomes a parked slot; no ch1-3 content is orphaned.","head":"","tail":"The Kings' Hall was the most used room in the castle.","rationale":"Locked restructure: old ch1/ch2/ch3 redistribute so the first council and rejection stand as one chapter.","draft":""},{"chapter":"2","seq":2,"type":"line-edit","size":"tiny","title":"Cut the three-villages preserve reveal from the spending list","proposal":"I'm going to replace the sentence about the hunting ground requiring the forced removal of three villages (eighteen hundred people) with a plainer extravagance line, because stating the three-villages fact here defuses its ch13 detonation, where Burgundy discovers it standing in the ruined houses.","head":"or the stables, rebuilt twice, stocked with beasts from other systems.","tail":"The hall did not get any attention.","rationale":"Locked ch13 preserve staging: atrocity facts land where Burgundy feels them, not as early narration.","draft":"Replace \"There was a private hunting ground that had required the forced removal of three villages worth of people, eighteen hundred people in total so that the king could hunt once a year.\" with \"There was a private hunting ground, walled and stocked, for a hunt he held once a year.\""},{"chapter":"2","seq":3,"type":"parked","size":"small","title":"Nicholas tutor memory held as a parked tutor slot","proposal":"I'm going to hold the tutor exchange (from \"He had asked about Nicholas exactly once, when he was ten\" through the northern-fields deflection) as a parked tutor-memory slot: the dramatic shape stays as the trigger (boy asks the dangerous question in the flat bored voice, tutor goes still, stylus lifted), but the content inside it is a placeholder for Johnny's geopolitics and I will not extend or polish it now; it may also relocate when the real material arrives.","head":"the cosmology of the big window to him pane by pane. He never asked outloud.","tail":"And there was no more talk of Nicholas.","rationale":"Locked parking: tutor-memory content is parked; slot = location plus trigger only.","draft":""},{"chapter":"2","seq":4,"type":"line-edit","size":"medium","title":"Reframe the arrival as his first council, in robes","proposal":"I'm going to rewrite the arrival run (from \"On this particular morning\" through the coin-across-slate line) so that this is the first morning of his training, not a requested audience: he had planned to wake at five, dress in the council robes laid out for the rite, and walk the prototype up unseen; instead he wakes at seven with the sleeve print and the counter at thirty-five, throws the robes on over yesterday's clothes, and arrives at doors where he is expected for the first time in his life, just not with a robot. I'll keep the robot description, the best-thing-or-a-toy beat, and the loud wheel exactly as they are; \"rehearse the pitch\" becomes rehearsing what he would say when his father asked what the machine was.","head":"And there was no more talk of Nicholas.","tail":"The boy and his robot walked toward the throne.","rationale":"Locked timeline: seventeen is the age a prince begins; he did not ask for the audience.","draft":""},{"chapter":"3","seq":1,"type":"line-edit","size":"small","title":"Restore the searching-her-face beat on Mira","proposal":"I'm going to restore the struck sentences where he searches Mira's face for last night's dinner look and cannot find it, and fix the grammar of the line that follows so it reads as one clean beat; this is the ch1 restored glance paying off in the hall.","head":"She did not smile when she saw her son. Burgundy felt her watching him","tail":"As he arrived at the foot of the dais, the group started to go silent","rationale":"Pillar I restoration: the mother-glance thread pays off; Mira carries the wound through watching.","draft":"Restore: \"He searched her face for the look she had given him at dinner the night before. He could not find it. She was looking at him a different way now: a tense, unchanging expression.\""},{"chapter":"3","seq":2,"type":"line-edit","size":"medium","title":"Rewrite the opening exchange for first council","proposal":"I'm going to replace the \"You asked to see me\" / \"You know this is the council hour\" exchange (through \"What is that?\") with a first-day exchange: the King marks his son's first morning of training, maybe half a nod to the robes, and then his eye lands on the robot and the temperature drops into \"What is that.\" Burgundy didn't ask for this audience; he was summoned by the rite and brought the machine on his own, and the dialogue has to carry that.","head":"Burgundy's heart was ramping up.","tail":"Burgundy stepped forward and so did the Robot, The wheel was loud again.","rationale":"Locked ch2 beat: first council of his training, not a requested pitch.","draft":""},{"chapter":"3","seq":3,"type":"line-edit","size":"tiny","title":"The shame: fingers curled to hide the grease","proposal":"I'm going to add one sentence after his throat goes tight: he curls his fingers into his palms so the grease in the knuckle creases will not show; never the word ashamed, and it sets up the same gesture recurring at council tables later.","head":"Burgundy did not answer. His throat was too tight.","tail":"The King stood.","rationale":"Pillar I tool: the engineer's hands in a court that despises labor, word never said.","draft":"Add: \"He curled his fingers into his palms, so the grease in the knuckle creases would not show.\""},{"chapter":"3","seq":4,"type":"line-edit","size":"medium","title":"Rewrite the rejection close: training, rite, tour","proposal":"I'm going to replace the \"Take it away\" close (through \"Do you understand me?\") with the cold version the timeline requires: get rid of this thing, do not bring me anything like it again, be back tomorrow morning without it, ready to learn how this kingdom is actually run; and in the same breath, flat and unexplained, the King names what training leads to: the rite when it is done, then the tour, and a line about finding a wife the way every king of this line has, none of it glossed for the reader. I'll keep the \"Take it away\" cadence but the old \"next time I want to see you in council robes\" line goes, since he is already standing in them.","head":"an old man who had been standing in this room since before Burgundy was born.","tail":"Burgundy looked down at the prototype.","rationale":"Locked ch2 beat: cold rejection plus the King naming rite and marriage tour unexplained.","draft":""},{"chapter":"3","seq":5,"type":"timing-marker","size":"small","title":"Vicentennial marker in the King's mouth","proposal":"I'm going to insert one overheard line as Burgundy turns the robot for the long walk out: the King, already back at the tally with his ministers, names three years to the Vicentennial in plain business language, so the date threads through his dismissal without anyone explaining it to the reader.","head":"He did not look at the advisors.","tail":"He turned the prototype around, by hand, because he did not trust himself","rationale":"Vicentennial ladder: ch1-2 three-years-off marker in characters' mouths.","draft":"Add: \"Behind him the King was already back at the tables. 'Gentlemen. Three years to the Vicentennial and the southern numbers still crawl. Where were we.'\""},{"chapter":"4","seq":1,"type":"timing-marker","size":"tiny","title":"The stair \"Two years\" stays as is","proposal":"I'm going to leave the \"How long.\" / \"Two years.\" exchange on the stairs exactly as written: under the new timeline he started building at about fifteen, so two years to the r's-daughter idiom: her trunks were already packed for the core academies when her father closed the deal, in the family's vicentennial year, and he had the crews carry the trunks to a different ship. She says it flat, the way she reads a manifest; the anger shows only in her stillness. This also puts the word \"vicentennial\" into her backstory as canon.","head":"I was the family bargaining chip, every generation has one.","tail":"I knew I had to be sent here to this place.","rationale":"Pillar IV: her anger shows about her father and the core worlds, not Dross; fragments, no dump.","draft":"Insert: \"She was quiet a moment. 'My trunks were already packed for the core academies when the deal closed. It was my family's vicentennial year, there were larger contracts in the air, and my father had the crews carry my trunks to a different ship.' She said it the way she read a manifest. Her hands stayed folded in her lap.\""},{"chapter":"5","seq":3,"type":"new-paragraph","size":"small","title":"Tour-dread interior recognition, the age mirror","proposal":"I'm going to add a two-to-three sentence one-sided interior beat after her marriage story lands: she was seventeen, exactly his age, and he thinks of the marriage tour waiting on the far side of his own crowning and the stranger he would be expected to bring home from it. She had been that stranger once. It stays interior; he says nothing and the scene moves on. This is chapter 5's single interior-recognition budget item, and it echoes the ch1 tour seeding.","head":"My family agreed to fund the wing. Your father's family agreed to build it.","tail":"\"For the last 19 years I've been procuring books and technology","rationale":"Want-engine tour-dread threaded; interiority budget one per early chapter, never staged into dialogue.","draft":"Insert: \"Seventeen. She had been exactly his age. He thought of the tour that waited on the far side of his own crowning, the stranger he would be expected to bring home from it. She had been that stranger once.\""},{"chapter":"5","seq":4,"type":"line-edit","size":"tiny","title":"Flatten the resentful laugh about the King","proposal":"I'm going to change \"Mira laughed a resentful gutteral laugh\" to \"Mira laughed once, short, and let it die.\" Her sharpness in this chapter should belong to the father fragment, not to talk of the King; this also fixes the typo.","head":"She has been very helpful.\"\n\n\"What about the academy?\"","tail":"\"Your father would never let it happen. I didn’t know that in the beginning.","rationale":"Pillar IV: anger belongs to her father, not Dross; calm-operator surface holds.","draft":"Change \"Mira laughed a resentful gutteral laugh\" to \"Mira laughed once, short, and let it die.\""},{"chapter":"5","seq":5,"type":"line-edit","size":"tiny","title":"Kill em dashes and stated tenderness on \"curious\"","proposal":"I'm going to replace the two sentences \"She said the last word — curious — with something like tenderness. It was the first tender thing Burgundy had heard her say all morning.\" with \"She said the last word, curious, more carefully than the rest of it.\" The em dashes go, and the named emotion goes; the reader infers the warmth.","head":"He has never opened the door to this library. He is not curious.","tail":"\"Why?\" said Burgundy, looking at his mother as if for the first time.","rationale":"No em dashes ever; love = provision, never a tender word.","draft":"Replace both sentences with: \"She said the last word, curious, more carefully than the rest of it.\""},{"chapter":"5","seq":6,"type":"timing-marker","size":"tiny","title":"Mira says the Vicentennial out loud, three years off","proposal":"I'm going to add one spoken line inside her list of princely duties: the Vicentennial is three years out and the King will want the heir polished for it. A character says the date plainly, mid-list, no header, no day-count. It also quietly hands the want-engine its deadline.","head":"You will be seen at the tribute inspections. You will attend the seasonal meeting with regional governors.","tail":"You will travel to the docks each month with him to see the tribute shipment goes smoothly.","rationale":"Vicentennial ladder rung, timing said out loud by characters.","draft":"Insert into her duties speech: \"You will stand at his side through the Vicentennial preparations. It is three years out, and he will want the heir polished for it.\""},{"chapter":"5","seq":7,"type":"new-paragraph","size":"small","title":"Training-as-cover: the bargain is an alibi","proposal":"I'm going to add a short Mira paragraph at the end of the duties speech framing the whole performance as pure pragmatism: a prince who fills his days in plain sight is a prince nobody follows after dark; be excellent where he can see you, and he will never look where he cannot. She hands him the alibi as logistics, nothing sentimental.","head":"you will speak, and you will say what he wants to hear.","tail":"\"He'll never believe it,\" Burgundy said.","rationale":"Pillar IV: training-as-cover said as pragmatism; the alibi is one more thing she provides.","draft":"Insert after the duties speech: \"'And understand why,' she said. 'A prince who fills his days in plain sight is a prince nobody follows after dark. Be excellent where he can see you, and he will never look where he cannot.'\""},{"chapter":"5","seq":8,"type":"line-edit","size":"small","title":"Raise the stakes of discovery, said plainly","proposal":"I'm going to replace the unfinished line and Johnny's inline note (\"if he finds out about this room, it will end very poorly for all of us ***<<<I need to raise the stakes of him finding out. Hint to how bad it would be.***\") with Mira stating the cost out loud: if the King finds the room he will not see a library, he will see nineteen years of her family's cargo inside his walls, the treaty broken in his own house, and the treaty is the only thing keeping his family and hers from each other's throats. One small fear-leak beat: her eyes go once to the bookcase door. No hinting, no withheld dread; the stakes are on the page. I'm deliberately not touching the medicine/locked-wing story, which stays fresh for ch14.","head":"just to keep his eyes away from what you are doing here.","tail":"\"Do we have a bargain?\"\n\nHe thought about it.","rationale":"Resolves Johnny's inline note under his veto: no withheld secrets, danger plain and spoken.","draft":"Replace with: \"'I am asking you to look like him. Just to keep his eyes away from this room. Because if he finds it, it is not a father finding a son's workshop. It is nineteen years of my family's cargo inside his walls, and the marriage is the treaty, and the treaty is the only thing keeping his family and mine from each other's throats.' Her eyes went once to the bookcase door and came back.\""},{"chapter":"6","seq":1,"type":"timing-marker","size":"tiny","title":"Name Twinrise as the shared birthday","proposal":"I'm going to change \"They had been born on the same day, Burgundy and Tuck.\" to add \"Twinrise, both of them.\" This plants the locked anchor (every prince, and Tuck, born at Twinrise) using the provisional name.","head":"during the festival season, and that's when Burgundy would sneak out.","tail":"Tuck's mother told it every year, at both their birthdays, which were one birthday","rationale":"Locked anchor: every prince and Tuck born at Twinrise, planted early.","draft":"Change to: \"They had been born on the same day, Burgundy and Tuck. Twinrise, both of them.\""},{"chapter":"6","seq":2,"type":"line-edit","size":"tiny","title":"The joint parties stopped at ten","proposal":"I'm going to change \"Tuck's mother told it every year, at both their birthdays, which were one birthday, always held in a little room off the kitchens.\" so the story was told every year until the boys turned ten. The warm memory stays; the tense now agrees with the locked canon that the shared celebrations ended at ten.","head":"They had been born on the same day, Burgundy and Tuck.","tail":"A rare mix of servant and royal.","rationale":"Quilt canon: celebrations stopped at ten; the ch13 kitchen-pass depends on this.","draft":"Change \"told it every year, at both their birthdays\" to \"told it every year until the boys turned ten, at both their birthdays\" and drop \"always\" before \"held\"."},{"chapter":"6","seq":3,"type":"new-paragraph","size":"medium","title":"Plant the quilt tradition and Essa's name","proposal":"I'm going to write the quilt-tradition passage here, right after Mira's laugh in the birthday memory: Tuck's mother started it when the boys were small; each Twinrise each boy cuts a hand-sized square from his own clothes and gives it to the other; Tuck's great-aunt Essa, a seamstress, stitches the squares into two quilts, so the quilt on Burgundy's bed grew in rough cotton and burlap and the one on Tuck's in fine linen and silk. The parties stopped at ten; the patch exchange never did, one square a year, passed hand to hand in a hallway in the space of two minutes, more awkward every year, and neither boy lets it die. I'll end the passage on the object (the newest square, or the quilt on his bed), not on a stated theme. Essa's name touches the book here for the first time, so her ch14 death-and-cushions story and the ch19 lounge cushions detonate backward. (Chief-editor note: this replaces the duplicate ch1 quilt proposal; this is the single plant.)","head":"in a way Burgundy never heard her laugh anywhere else.","tail":"Tuck's great-great-grandmother had been the head cook for the King's great-great-grandfather.","rationale":"Locked Pillar I quilt canon planted early; Tuck carries the bond; Essa enters here first.","draft":"Sketch: one paragraph of the tradition's mechanics (mother's invention, the cut squares, Essa stitching, the two quilts described by fabric), one short paragraph of the exchange surviving the separation (one square a year, two minutes in a hallway, more awkward each he way you look at a coin that rang wrong,\" \"the market closed back over the two of them the way water closes\") and take exactly one thing from version B: the name \"aunt Leel\" in Tuck's line. The replaced span runs from the first \"Go on,\" she said through \"he went back into taking it all in.\" No darkening; pure de-duplication, and the coin simile stays because it carries cargo.","head":"a woman with a scale and a hundred baskets, and she took him for a customer.","tail":"He had always thought the low city would be starving.","rationale":"The chapter is locked warm-as-written; the double-draft is its only real defect.","draft":"One offer from her, one \"He should have pointed\" paragraph, his polite reply, the coin-rang-wrong reaction, Tuck's rescue with \"aunt Leel,\" and a single aftermath ending with him breathing again and going back to taking it all in."},{"chapter":"7","seq":3,"type":"parked","size":"small","title":"Parked slot: extraction fragment at the square","proposal":"I'm going to reserve a slot, not write content, immediately after Tuck's speech about Nicholas's soldiers at the tribute square. Location: end of the square scene, before they leave for Ran's. Trigger: Tuck's folk understanding of the arrangement (\"the stuff,\" the stipend story, \"be grateful\") seen through fifteen-year-old Burgundy, who half-registers it and moves on. Content to come from Johnny's geopolitics; two or three sentences max when it arrives, in Tuck's mouth or Burgundy's flat observation, no lecture. Rejecting this slot costs nothing since the square beat already works as a seeded fragment.","head":"They're not just here, there's a bunch all over the city","tail":"They left the square, and after two more turns they were standing in front of a house made of scrap.","rationale":"Pillar III: extraction read assembles across seeded fragments; content parked.","draft":""},{"chapter":"7","seq":4,"type":"new-paragraph","size":"small","title":"Tuck's provider-act as a finished object (ADDED by chief editor)","proposal":"I'm going to add a short object beat inside the scrap-house visit: Burgundy notices something Tuck built and finished for the household, the pedal rig under the wash-sink (or an equivalent finished contraption), worn smooth from use, and no one comments on it. Two or three sentences, the object carries the whole provider read, nothing stated. This was in the digest (Tuck's provider-act rendered as a finished object) but no range editor placed it, so I'm adding it; the head anchor below is editor-supplied verbatim text at the mouth of the house scene, and I'll set the exact tail during the drafting pass rather than invent anchor text now. Johnny can also move this beat to the ch17 cold-storage scene if he'd rather it land in the present timeline.","head":"They left the square, and after two more turns they were standing in front of a house made of scrap.","tail":"","rationale":"Digest Pillar I split: Tuck carries the bond and the stakes, provider-act as finished object; coverage gap filled.","draft":"Sketch: under the wash-sink, a pedal rig, treadle and belt and a hand-filed crank, driving the scrub drum so his mother's hands didn't have to. The pedal was worn pale in the middle. Tuck walked past it without looking."},{"chapter":"8","seq":1,"type":"line-edit","size":"tiny","title":"Decision item: ch8 timing verified, no changes","proposal":"I'm proposing no timing changes in chapter 8, as a checkable decision: the whole chapter sits inside the age-fifteen flashback and contains no age or duration statements that conflict with the locked timeline (training at 17, first wall-crossing at 15). Burgundy's osmarine blurt is consistent with his schooling, and it correctly seeds ch16's rope-line recall and ch17's coin scene, both of which say \"four years back,\" which is right. Accepting this item = locking ch8 timing as-is.","head":"Ran was Tuck's uncle, his mother's brother.","tail":"Thirty-something,  years old, with a beard and kind eyes","rationale":"Locked timeline: first crossing at fifteen; ch8 already agrees everywhere.","draft":"No text change. This is a confirm-the-no-op decision."},{"chapter":"9","seq":1,"type":"age-fix","size":"tiny","title":"Ch9 age: nineteen becomes seventeen","proposal":"I'm going to change \"nineteen\" to \"seventeen\" in the line that stamps his age at the start of the double life, so the whole building/training stretch runs 17-19 instead of 19-21.","head":"neither of them ever talked about their little flash of adventure and friendship when they were fifteen.","tail":"and sitting at a long dark oiled table in his mother's secret library,","rationale":"Digest names this exact line as a required fix.","draft":"Change \"And now he was nineteen years old, and sitting at a long dark oiled table\" to \"And now he was seventeen years old, and sitting at a long dark oiled table\"."},{"chapter":"9","seq":2,"type":"timing-marker","size":"small","title":"Spoken Vicentennial marker in the tea scene","proposal":"I'm going to add two spoken sentences in the pre-council tea chatter, just before Burgundy asks about coming up short: the trade minister notes that the Vicentennial is under three years out and the crown wants full books for it. Said plainly, in a character's mouth, no header, no day-count.","head":"which was five days out, the tally sheet spread down the main table.","tail":"Burgundy set down his cup. \"What happens if we come up short?\"","rationale":"Vicentennial ladder: first rung after ch1-2's three-years-off.","draft":"The trade minister said the counts would only grow heavier from here. \"Under three years to the Vicentennial now. The crown means to arrive at it with full books.\" He said it the way men say the Freeze is coming."},{"chapter":"9","seq":3,"type":"line-edit","size":"tiny","title":"Fill Vharush's TK face comparison","proposal":"I'm going to replace the TK placeholder in Vharush's description with a mining-native comparison that carries concrete sensory payload, keeping the milk-pale eye exactly as written.","head":"The oldest man in the room answers. Vharush was the minister of mining.","tail":"one eye gone milk-pale from a rockburst forty years down.","rationale":"Cargo Test: a TK can't ship.","draft":"Replace \"He a face like a TK,\" with \"He had a face like weathered pit stone,\" so the line reads: \"He had a face like weathered pit stone, one eye gone milk-pale from a rockburst forty years down.\""},{"chapter":"10","seq":1,"type":"parked","size":"small","title":"Parked tutor-memory slot at the stale-disc beat","proposal":"I'm going to mark a flashback slot here, right after the line about Dross being fifty years behind: the staleness of knowledge reaching Dross triggers a short tutor-memory. I am NOT writing the content; it waits for Johnny's geopolitics. The slot is one short paragraph of remembered schoolroom, functioning as one of the fragment-seeds that let the reader assemble the extraction-system read.","head":"On Dross, three years behind the core was still fifty years ahead of anything else on the planet.","tail":"Mira's cousin, Ressa, brought the discs in with the cargo runs.","rationale":"Pillar III fragment-seed; tutor-memory content explicitly parked.","draft":"[PARKED SLOT — tutor-memory. Trigger: the discs arriving a year to three years stale. Placement: one short paragraph between \"anything else on the planet.\" and the Ressa paragraph. Content to come from Johnny's geopolitics.]"},{"chapter":"10","seq":2,"type":"line-edit","size":"tiny","title":"Repair the garbled crate sentence","proposal":"I'm going to fix the broken run-on where two drafts collided (\"crates with . a dozen more... one paper at a timeAnd inside were parts\"), keeping every image, so the foundry-mark slot that follows lands in clean prose.","head":"He began reading to build and building to know what to read next.","tail":"Tin-fulls of ball bearings that turned with a breath","rationale":"Mechanically broken sentence at a beat the digest builds on.","draft":"Replace the garbled passage with: \"Every few weeks a stack of boxes came up from the cargo field: crystal discs packed in wool and sawdust, a dozen more of somebody's solved problems pressed into crystal, and crates beside them. He carried them down through the dark and fed the discs into the machine one paper at a time. And inside the crates were parts unlike anything Burgundy had ever laid eyes on.\""},{"chapter":"10","seq":3,"type":"parked","size":"small","title":"Parked tutor-memory slot at the foundry-mark beat","proposal":"I'm going to mark the second flashback slot here, in the unpacking of the core-world parts: the trigger is a foundry mark stamped into the new motor's housing, offworld lettering on metal that likely started as Dross ore. I write the trigger object only (one sentence putting the mark in his hand); the tutor-memory content itself is parked for Johnny's geopolitics.","head":"a motor still in its foam, shiney sharp drill heads. Bright spools of never-used wire.","tail":"One box he forgot he ordered.","rationale":"Pillar III fragment-seed: ore leaves raw, returns with somebody else's mark; specifics parked.","draft":"[PARKED SLOT — tutor-memory. Trigger: an offworld foundry mark stamped into the motor housing; he tilts it to the light and reads the maker's name. One short remembered-lesson paragraph to come from Johnny's geopolitics.]"},{"chapter":"10","seq":4,"type":"line-edit","size":"tiny","title":"Remove duplicated apron phrase","proposal":"I'm going to delete the accidental duplication in the apron sentence so it reads once.","head":"One box he forgot he ordered.","tail":"leather apron, cut heavy and supple, oiled to a shine.","rationale":"Doubled phrase breaks the night-work rhythm.","draft":"Change \"He opened it to pull out a He opened it to pull out a leather apron, cut heavy and supple, oiled to a shine.\" to \"He opened it to pull out a leather apron, cut heavy and supple, oiled to a h implies she arrived at eighteen. I'll adjust the ch14 line to \"I was twenty-five and I had been on this planet eight years\" (or \"nine years\" with twenty-six, whichever reads better in place) so both chapters agree with the seventeen-at-marriage canon my ch5 tour-dread beat leans on. Her \"Twenty years. You've known\" line stays as round speech per the check-in-place rule. Exact placement follows the quoted line, which sits inside her locked-wing telling.","head":"","tail":"","rationale":"Range notes flagged the drift with no edit filed; the ch5 age-mirror beat depends on seventeen being true.","draft":"Change \"I was twenty-six and I had been on this planet eight years\" so the arithmetic agrees with marriage at seventeen (twenty-five/eight years, or twenty-six/nine years)."},{"chapter":"15","seq":1,"type":"age-fix","size":"tiny","title":"Six months becomes three months","proposal":"I'm going to change the chapter's opening \"For the next six months he poured himself into the machines.\" to \"For the next three months\", the firm preserve-to-South-12 window.","head":"","tail":"he poured himself into the machines.","rationale":"Explicit digest fix: FIRM three months, breakthrough at freeze-onset.","draft":"Change \"For the next six months\" to \"For the next three months\"."},{"chapter":"15","seq":2,"type":"restructure","size":"medium","title":"Replace the no-plan beat with the want-engine","proposal":"I'm going to replace the whole paragraph beginning \"He had no plan. He knew that...\" and ending \"...the pencil drawing pinned above his bench of a robot that could mine.\" with the want-engine: he has always assumed he will be crowned, and the question forming on these nights is what kind of king he means to be; a vague plan is gaining edges: show his father the robots at the Vicentennial itself, under a year off now, the one stage where nothing can be waved away or kicked, so finished they cannot be dismissed; maybe it rearranges things with Nicholas; maybe i d the lane adjusting around it, talk changing pitch a stall ahead of the soldier and settling a stall behind, a whole row of shoulders making the same small movement at the same moment. I'll close on a concrete object and rejoin \"Nobody looked at them.\" No aphorisms, no em dashes, comparative eye only; his ignorance in ch7 stays untouched. (Drafting note: the patrol stays unnamed as to whose it is; recommend a crown patrol, keeping Nicholas's men statue-ringed and uncanny.)","head":"again and the whole warm loud world was his to walk through.","tail":"Nobody looked at them. The Freeze kept every head down and every scarf up.","rationale":"Locked staging: the full detonation lands on the return, not in ch7.","draft":""},{"chapter":"17","seq":6,"type":"new-paragraph","size":"small","title":"Tuck's swallowed sentence on the walk down","proposal":"I'm going to add a short beat between the market and Ran's yard: Tuck starts to say something real about the crown, stops mid-sentence, checks the length of the lane once, and folds it into a loud joke; Burgundy laughs where the laugh belongs and says nothing. The recognition stays interior and unstated.","head":"The Freeze kept every head down and every scarf up. Being nobody was easy in the cold.","tail":"Ran's yard sat where it had always sat, the heaps taller under the snow,","rationale":"Locked beat: surveillance on a loved face; Burgundy sees it and says nothing.","draft":"Tuck started to say something about the crown, got three words into it, and stopped with the sentence still in his mouth. His eyes went up the lane, once, the whole length of it. Then he was loud again, a story about a cheese wheel that rolled into the soup vat. Burgundy laughed where the laugh belonged and said nothing."},{"chapter":"17","seq":7,"type":"line-edit","size":"small","title":"Fill the TK with the Essa line","proposal":"I'm going to replace \"He doesn't know TKTKTK\" with the Essa fact, spoken plainly to Ran: his father doesn't know the name of the woman who sewed the cushions he hunts from, asked only whether they'd finish on schedule while she was dying, and Burgundy knows her name. It answers Ran's challenge with the one thing an informer couldn't fake: which side of the wall his eyes are on.","head":"\"My father doesn't know I'm here.\" Burgundy said it flat.","tail":"I've sat there for almost two years listening to the men who run this planet","rationale":"The Essa irony is the locked spine; this makes the ch19 recognition and the quilt canon detonate backward.","draft":"Replace \"He doesn't know TKTKTK\" with: \"He doesn't know the name of the woman who sewed the cushions he hunts off of. She was dying while she finished them, and he asked one question: whether they'd be done on schedule. I know her name.\""},{"chapter":"17","seq":8,"type":"timing-marker","size":"tiny","title":"Almost two years becomes more than two years","proposal":"I'm going to change \"almost two years\" to \"more than two years\": council began the morning after his 17th birthday and it's now about two years and three months, so \"almost\" points the wrong way.","head":"because he's never once asked. He doesn't know TKTKTK","tail":"listening to the men who run this planet talk about you and your neighbors","rationale":"Checked in place per the digest's instruction; ~2.25 years of council.","draft":"Change \"I've sat there for almost two years listening\" to \"I've sat there for more than two years listening\"."},{"chapter":"18","seq":1,"type":"parked","size":"small","title":"Parked flashback slot at the osmarine sphere","proposal":"I'm going to reserve a slot here, not write it: at the first sight of bare refined osmarine hanging in its cradle in his own hands, a short flashback or fragment-seed goes in (tutor-memory or extraction-system fragment). Trigger: the sphere itself, the most controlled substance in the galaxy sitting on his bench. Content to come from Johnny's geopolitics; no prose now.","head":"And inside it, a ","title":"Cap the negation tic: 'Not throttled, not batched'","proposal":"I'm going to cut the chapter's second negation construction, since 'Not damaged. Not advanced upon. Gone.' earns the chapter's one: change 'had synchronized. Not throttled, not batched, but brought into rhythm, the machine sampling' to 'had synchronized, the machine sampling'. The rhythm image that follows already does the work.","head":"The data firehose and the scoring loop","tail":"the machine sampling its own body in rhythm with its own actions","rationale":"Negation tic capped at one per chapter.","draft":"change \"had synchronized. Not throttled, not batched, but brought into rhythm, the machine sampling\" to \"had synchronized, the machine sampling\""},{"chapter":"21","seq":3,"type":"line-edit","size":"tiny","title":"Cut 'Old was not the word.'","proposal":"I'm going to delete the sentence 'Old was not the word.' and let the hand-cut, pick-scarred, water-softened description carry the age on its own.","head":"Beyond it, the tunnel was still a tunnel, but an old one.","tail":"The walls beyond the breach were hand-cut, pick-scarred,","rationale":"Negation cap plus THE LAST STEP: the concrete walls say it.","draft":"Delete \"Old was not the word.\""},{"chapter":"21","seq":4,"type":"parked","size":"small","title":"PARKED SLOT: the true Ghai collapse (tutor memory)","proposal":"I'm going to mark this paragraph as the slot for Johnny's geopolitics. Location: the moment the lamp finds the Ghai mark and Burgundy reaches for what his tutors taught. Trigger: the circle-within-a-circle engraving. The current vague line ('faded, collapsed, dispersed, were conquered. Something. He didn't remember.') stays as the placeholder; when Johnny supplies the real story of what happened to the Ghai and how it connects to the tribute order, it threads here, still filtered through a bored tutor's half-remembered lesson. I am writing no geopolitical content now.","head":"and a capital no raider ever found because it had no outside.","tail":"But he did remember that their tunnels had been filled in centuries ago","rationale":"Tutor-memory content parked; slot only.","draft":""},{"chapter":"21","seq":5,"type":"line-edit","size":"tiny","title":"Fix the dangling 'specific gravity' clause","proposal":"I'm going to change 'But the dark ahead of him was pulling with the specific gravity.' to 'But the dark ahead of him was pulling.' The half-finished physics metaphor stops the sentence dead; the machine-sound in the next line is the real pull.","head":"The logs alone were a life's work, the bundles in the tunnel were a hoard.","tail":"And somewhere in that dark, faint and rhythmic in the silence","rationale":"Cargo Test: a comparison with no payload gets cut.","draft":"change \"But the dark ahead of him was pulling with the specific gravity.\" to \"But the dark ahead of him was pulling.\""},{"chapter":"22","seq":1,"type":"line-edit","size":"small","title":"Em-dash sweep, chapter 22 (8 instances)","proposal":"Chapter 22 carries eight em dashes and the ban is absolute, so I'm going to recast every one (this edit is the sweep; two more instances are handled inside my seq-4 and seq-9 edits): (1) 'crowd's edge — a girl,' becomes 'crowd's edge, a girl,'; (2) '*Stopped* — drills stilling' becomes '*Stopped*: drills stilling'; (3) 'a piece of it — *first the sheds, now this* — and he did not need the rest' becomes 'a piece of it: *first the sheds, now this*. He did not need the rest'; (4) 'turned her head — the first time she had taken her eyes off him since the lamplight found the cavern — and looked' becomes comma appositives; (5) 'by the cage — full.' becomes 'by the cage: full.'; (6) 'the truth in his chest — *I am not him, I built these against him* — and did not say any of it' becomes comma-set; (7) 'Not here — this is a working site' becomes 'Not here. This is a working site'; (8) 'You tell no one — and before you answer' becomes 'You tell no one. And before you answer'.","head":"It was the smallest in the group.","tail":"he saw as she crossed the light, and she walked past Burgundy","rationale":"NO EM DASHES ever; period, comma appositive, colon are the instruments.","draft":"Recast all eight listed em dashes using period, comma appositive, or colon as itemized in the proposal."},{"chapter":"22","seq":2,"type":"line-edit","size":"tiny","title":"Clean the arm's-length sentence and capitalization","proposal":"I'm going to fix 'And now here he was, an arms length away to two miners, people he had thought about for years, but never actaully approached until this moment. / the woman did not bow' to 'And now here he was, an arm's length from two miners, people he had thought about for years and never once approached. / The woman did not bow'.","head":"and the girl with the milk-glass eye had vanished on a cart.","tail":"\"Not here,\" is all she said.","rationale":"Copyedit on the beat carrying the book's want; LAST STEP cuts the throat-clearing.","draft":"Replace the two garbled sentences as quoted; \"until this moment\" is cut, \"the woman\" capitalized."},{"chapter":"22","seq":3,"type":"line-edit","size":"small","title":"Rewrite the broken 'quick assessment' paragraph","proposal":"I'm going to rewrite the garbled paragraph about the woman's quick assessment as: 'The woman had already decided he was not the crackdown. Maybe it was his face, which held more fear than any inspector's ever would. Her tone had no fear in it. It was almost annoyed.'","head":"pricing what the arms could lift.","tail":"\"You have until I say,\" the woman said.","rationale":"Plain language where Hesta's authority establishes itself.","draft":"Replace the four garbled sentences with: \"The woman had already decided he was not the crackdown. Maybe it was his face, which held more fear than any inspector's ever would. Her tone had no fear in it. It was almost annoyed.\""},{"chapter":"22","seq":4,"type":"line-edit","size":"tiny","title":"Recast 'not wonder. The opposite.'","proposal":"I'm going to change 'and saw the amazement arrive and saw what it turned into — not wonder. The opposite. Her jaw set,' to 'and saw the amazement arrive and saw it sour. Her jaw set,'. One verb replaces a dash, a negation, and an announcement.","head":"Hesta looked at the carts for a long moment. Burgundy watched her face","tail":"and when she turned back to him, her eyes had gone harder","rationale":"Em-dash ban plus negation cap; 'Too good.' already lands the meaning.","draft":"change \"and saw what it turned into — not wonder. The opposite. Her jaw set,\" to \"and saw it sour. Her jaw set,\""},{"chapter":"22","seq":5,"type":"line-edit","size":"tiny","title":"Fix 'brown-haird... number 2' to russet-haired","proposal":"I'm going to change 'The brown-haird man who was seemingly her number 2 had no such trouble.' to 'The russet-haired man had no such trouble.' It fixes the typo, matches his earlier introduction as 'a broad russet-haired man,' and drops the modern-register 'number 2' (his role is already shown).","head":"only proved how big the snare must be.","tail":"He was looking at the carts, and then at the machines,","rationale":"Plain language and continuity; hair color must not drift in the same scene.","draft":"change the sentence to \"The russet-haired man had no such trouble.\""},{"chapter":"22","seq":6,"type":"timing-marker","size":"small","title":"Tobin speaks the Vicentennial from below","proposal":"I'm going to give the looming date one spoken beat from the underside, in Tobin's mouth, inserted after 'We've never done that.': 'You know the quota climbs from here. Every month of it, the whole nine months to the Vicentennial.' The King names the date from the platform in my ch20 edit; the miner names it from the shaft. Same date, two altitudes, which is the climax's geometry in miniature.","head":"Do you see it? Quota by midnight. We've never done that.","tail":"This could mean no more short-stipend months.","rationale":"Ladder rung plus a foundations-only seed of crowned-above-while-machines-break-below.","draft":"Insert into Tobin's dialogue after \"We've never done that.\": \"You know the quota climbs from here. Every month of it, the whole nine months to the Vicentennial.\""},{"chapter":"22","seq":7,"type":"line-edit","size":"small","title":"Clean Hesta's exit orders","proposal":"I'm going to repair the run-on 'Get these machines out of my shaft..' paragraph to: '\"Get these machines out of my shaft,\" she said. \"Now, before a foreman walks over or that cage comes down. And take half their harvest with you. I'll deal with what the rest looks like.\" Tobin gave her an incredulous look.' Double period gone, the orders land as orders, and 'the number 2' phrasing goes.","head":"completely, instantly, and with the door left open exactly one crack.","tail":"She stepped closer, and lowered her voice to the width of the three of them.","rationale":"Plain language on the beat that establishes Hesta's command style.","draft":"Replace the paragraph from \"Get these machines out of my shaft..\" through \"an incredulous look.\" with the version quoted in the proposal."},{"chapter":"22","seq":8,"type":"line-edit","size":"small","title":"Cut the theory-became-application explainer","proposal":"I'm going to end the 'other thing' paragraph two sentences early: keep 'It was the other thing. The thing with no shape in his world until tonight, the way the machines had no shape in Hesta's.' and cut the callback to the core-world researchers plus 'But tonight, theory became application. Foggy ideas became real.' The chapter has already dramatized all of it; the narrator restating it as thesis flattens the ending.","head":"any of a hundred threads that could end everyone in that cavern.","tail":"Three nights. A full moon. A place he would be taken to.","rationale":"Theme dramatized never stated; the Hesta mirror is the fact, stop there.","draft":"Delete from \"Or how \\\"real world industrial application scenarios\\\" had no shape\" through \"Foggy ideas became real.\""},{"chapter":"22","seq":9,"type":"line-edit","size":"small","title":"Tighten the came-back-up paragraph to its button","proposal":"I'm going to recast the penultimate paragraph as: 'He had gone down a tunnel to retrieve three runaway mining machines, and had come back up as something else: measured by a woman who ran something, scheduled into a network that had survived being looked for, four words of a child's observation still ringing in his ears. *It doesn't get tired.*' The em dash becomes a colon and the triple-negation sentence ('never have planned, never have designed, never have predicted') is cut, so 'It had found other people.' lands directly after the girl's four words.","head":"Three nights. A full moon. A place he would be taken to.","tail":"It had found other people.","rationale":"Em-dash ban, negation cap, LAST STEP: the Part One button is strongest unexplained.","draft":"Replace \"something else — measured\" with \"something else: measured\" and delete the \"His project had become something he could never have planned...\" sentence."}],"coverage":[{"goal":"Ch1 = night after 17th birthday, rite, robot brought unbidden","coveredBy":"Ch1: Recast Chapter 1 as the night after his 17th birthday"},{"goal":"Ch2 first council: rejection + rite and marriage tour mentioned unexplained","coveredBy":"Ch2: Reframe the arrival; Ch3: Rewrite the opening exchange; Rewrite the rejection close"},{"goal":"Restructure: old ch1-3 redistribute; then Mira shows him the room","coveredBy":"Ch2: Merge old Ch2 and Ch3 (Mira's Wing kept as its own chapter turn, one-word revert if Johnny wants the full merge)"},{"goal":"Timing number fixes (17 not 19, Oz two years, 18 months, six->three months, three-week break, thirteen->fifteen, in-place two-years checks)","coveredBy":"Age-fix and timing items in ch1, 6, 9, 13, 15, 16, 17, 20, 21; keep-as-is decision items ch4, ch8"},{"goal":"Vicentennial spoken ladder (3 yrs -> 2 yrs -> year and "coveredBy":"Ch7: market-stays-warm decision item; Ch17: THE RETURN DETONATION"},{"goal":"Surveillance on a loved face (Tuck's swallowed sentence)","coveredBy":"Ch17: Tuck's swallowed sentence on the walk down"},{"goal":"King = visible face; own-hands act as OPEN QUESTION with one recommended option","coveredBy":"Ch13: open-question (recommended); Ch19: open-question variant (optional, not both at full strength)"},{"goal":"Extraction read via 3-4 fragment-seeds; geopolitics/tutor content PARKED","coveredBy":"Parked slots: ch1 tribute ships, ch2 tutor, ch7 square, ch10 (x2), ch12 counting, ch15 mining disc, ch18 sphere, ch21 Ghai — slots only, no prose"},{"goal":"Mira: operator, love=provision, academy-rebuilt, fragments, father-anger, training-as-cover, stakes plain","coveredBy":"Ch5: academy room, father fragment, flattened laugh, alibi paragraph, stakes edit; Ch16: freight/cartel fragment"},{"goal":"Tuck provider-act as finished object (pedal rig)","coveredBy":"ADDED — Ch7: Tuck's provider-act as a finished object (was MISSING from all six ranges)"},{"goal":"Voice doctrine enforcement (em dashes, negation cap, cargo test, end on object)","coveredBy":"Ch5 curious line; Ch9 TK face; Ch12/18 end-on-object; Ch20 final-frontier cut; Ch21 negation cuts; Ch22 sweep and tightenings"},{"goal":"Twinrise/Teem renames everywhere","coveredBy":"Ch6 Twinrise birthday; Ch12 (x3); Ch13 (x2); Ch14; Ch16 Descent"},{"goal":"Climax foundations only, no revolution prose","coveredBy":"Seeds only: ch20 King's platform line, ch20 silent plan, ch22 Tobin from below; nothing drafted (confirmed)"},{"goal":"Mira internal age consistency (ch5 seventeen vs ch14 twenty-six/eight years)","coveredBy":"ADDED — Ch14: Reconcile Mira's age drift (was flagged in notes but MISSING from edits)"}],"stats":{"total":123,"byType":"line-edit 56, new-paragraph 19, timing-marker 17, age-fix 14, parked 8, new-scene 3, restructure 3, open-question 2, flashback-slot 1 (122 from range editors, minus 1 duplicate quilt plant, plus 2 chief-editor additions)"}};
const KEY = 'bill-burgundy-proposal-v1';
let R = {};
try{ R = JSON.parse(localStorage.getItem(KEY) || '{}'); }catch(e){ R = {}; }
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const TYPE_LABEL = { 'age-fix':'number fix','line-edit':'line edit','timing-marker':'timing marker','new-paragraph':'new paragraph','new-scene':'new scene','new-chapter':'new chapter','restructure':'restructure','flashback-slot':'flashback slot','parked':'parked (geo)','open-question':'open question' };
const TYPE_COLOR = { 'age-fix':'var(--gold)','line-edit':'var(--gold)','timing-marker':'var(--gold)','new-paragraph':'var(--green)','new-scene':'var(--oxblood)','new-chapter':'var(--oxblood)','restructure':'var(--red)','flashback-slot':'var(--purple)','parked':'var(--purple)','open-question':'var(--blue)' };

const edits = DATA.edits.map((e,i)=>({...e, id: 'e'+i}));
const total = edits.length;

$('#byline').textContent = 'chronological · '+total+' proposed edits · accept, reject, or comment on each';
$('#intro').innerHTML = DATA.intro.split(/\n\n+/).map(p=>'<p>'+esc(p)+'</p>').join('');

// legend (only types present)
const present = [...new Set(edits.map(e=>e.type))];
$('#legend').innerHTML = present.map(t=>'<span class="lg"><span class="sw" style="background:'+TYPE_COLOR[t]+'"></span>'+esc(TYPE_LABEL[t]||t)+'</span>').join('');

// group by chapter, chronological
function chapKey(c){ const m = String(c).match(/\d+/); return m ? parseInt(m[0]) + (String(c).toLowerCase().includes('new')? 0.5 : 0) : 99; }
const groups = {};
edits.forEach(e=>{ (groups[e.chapter] = groups[e.chapter] || []).push(e); });
const chapOrder = Object.keys(groups).sort((a,b)=>chapKey(a)-chapKey(b) || String(a).localeCompare(String(b)));
chapOrder.forEach(c => groups[c].sort((a,b)=>(a.seq||0)-(b.seq||0)));

const cbox = $('#chapters');
chapOrder.forEach(c=>{
  const sec = document.createElement('section'); sec.className='chap';
  let h = '<div class="chap-head"><h2>'+(String(c).match(/^\d+$/)?'Chapter '+c:esc(c))+'</h2><span class="cnt">'+groups[c].length+' edits</span></div>';
  groups[c].forEach(e=>{
    const st = R[e.id]||{};
    h += '<div class="ed" data-t="'+esc(e.type)+'" data-id="'+e.id+'">';
    h += '<div class="ed-top"><span class="pill type">'+esc(TYPE_LABEL[e.type]||e.type)+'</span><span class="pill">'+esc(e.size)+'</span></div>';
    h += '<h4>'+esc(e.title)+'</h4>';
    h += '<p class="prop">'+esc(e.proposal)+'</p>';
    if(e.draft) h += '<div class="draft"><b>the change</b>'+esc(e.draft)+'</div>';
    if(e.head || e.tail){
      h += '<p class="anchor">';
      if(e.head) h += '<b>after</b><span class="h">“…'+esc(e.head)+'”</span> ';
      h += '<span class="mark">◆</span>';
      if(e.tail) h += ' <b>before</b><span class="t">“'+esc(e.tail)+'…”</span>';
      h += '</p>';
    }
    if(e.rationale) h += '<p class="why">'+esc(e.rationale)+'</p>';
    h += '<div class="verd">';
    h += '<button class="vbtn acc'+(st.v==='accept'?' on':'')+'" data-id="'+e.id+'" data-v="accept">✓ accept</button>';
    h += '<button class="vbtn rej'+(st.v==='reject'?' on':'')+'" data-id="'+e.id+'" data-v="reject">✗ reject</button>';
    h += '<span class="cmt"><input data-id="'+e.id+'" placeholder="comment…" value="'+esc(st.c||'')+'"></span>';
    h += '</div></div>';
  });
  sec.innerHTML = h; cbox.appendChild(sec);
});

function ruled(id){ const s=R[id]||{}; return !!(s.v || (s.c && s.c.trim())); }
function refresh(){
  let done=0; edits.forEach(e=>{ if(ruled(e.id)) done++; });
  $('#pText').textContent = done+' of '+total+' ruled';
  $('#fill').style.width=(total?done/total*100:0)+'%';
}
function save(){ localStorage.setItem(KEY, JSON.stringify(R)); refresh(); }

document.body.addEventListener('click', ev=>{
  const b=ev.target.closest('.vbtn'); if(!b) return;
  const id=b.dataset.id, v=b.dataset.v;
  R[id]=R[id]||{};
  R[id].v = R[id].v===v ? null : v;
  const card=document.querySelector('.ed[data-id="'+id+'"]');
  card.querySelectorAll('.vbtn').forEach(x=>x.classList.toggle('on', x.dataset.v===R[id].v));
  save();
});
document.body.addEventListener('input', ev=>{
  const inp=ev.target.closest('.cmt input'); if(!inp) return;
  const id=inp.dataset.id; R[id]=R[id]||{}; R[id].c=inp.value; save();
});
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1900); }

$('#accAllBtn').addEventListener('click', ()=>{
  edits.forEach(e=>{ if(!ruled(e.id)){ R[e.id]=R[e.id]||{}; R[e.id].v='accept'; } });
  document.querySelectorAll('.ed').forEach(card=>{
    const id=card.dataset.id; card.querySelectorAll('.vbtn').forEach(x=>x.classList.toggle('on', x.dataset.v===(R[id]&&R[id].v)));
  });
  save(); toast('accepted the rest');
});
$('#clearBtn').addEventListener('click', ()=>{
  if(!confirm('Clear all your rulings?')) return;
  R={}; localStorage.removeItem(KEY);
  document.querySelectorAll('.vbtn').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.cmt input').forEach(i=>i.value='');
  refresh(); toast('cleared');
});
$('#exportBtn').addEventListener('click', async ()=>{
  let md='# BURGUNDY — Johnny\'s rulings on the Edit Proposal\n\n';
  chapOrder.forEach(c=>{
    md+='\n## '+(String(c).match(/^\d+$/)?'Chapter '+c:c)+'\n';
    groups[c].forEach(e=>{
      const s=R[e.id]||{};
      md+='\n### '+e.title+' ['+(TYPE_LABEL[e.type]||e.type)+' · '+e.size+']\n';
      md+='- **Verdict:** '+(s.v?s.v.toUpperCase():'_(unruled)_')+'\n';
      if(s.c&&s.c.trim()) md+='- **Johnny:** '+s.c.trim()+'\n';
    });
  });
  try{ await navigator.clipboard.writeText(md); toast('copied — paste it back to Parley'); }catch(e){ toast('downloaded'); }
  const blob=new Blob([md],{type:'text/markdown'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='BURGUNDY-edit-rulings.md'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
});
const tb=$('#themeBtn');
function setTheme(t){ document.documentElement.dataset.theme=t; tb.textContent=t==='night'?'☀ day':'☾ night'; localStorage.setItem('bill-theme',t); }
setTheme(localStorage.getItem('bill-theme')||'day');
tb.addEventListener('click', ()=>setTheme(document.documentElement.dataset.theme==='night'?'day':'night'));
refresh();
</script>
