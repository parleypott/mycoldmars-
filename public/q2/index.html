<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill · BURGUNDY — The Edit Proposal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%99%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --paper:#f3ead9; --paper-2:#efe4cf; --card:#faf3e6; --ink:#211a14; --ink-soft:#5b4f42;
    --ink-faint:#8a7c69; --rule:#d8c8ab; --oxblood:#7c2130; --red:#b8332c; --gold:#a9853f;
    --green:#4a6741; --blue:#3d5a6e; --purple:#5d4a6e;
    --shadow:0 1px 0 rgba(120,90,40,.08), 0 12px 34px -20px rgba(60,40,20,.55);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --disp:"Hoefler Text","Iowan Old Style",Palatino,Georgia,serif;
    --mono:"SF Mono",ui-monospace,"Menlo","Consolas",monospace;
  }
  html[data-theme="night"]{
    --paper:#171310; --paper-2:#1d1813; --card:#221b15; --ink:#eadfce; --ink-soft:#c3b39a;
    --ink-faint:#8c7c66; --rule:#3a2f24; --oxblood:#d98a92; --red:#e0776d; --gold:#d6b673;
    --green:#8fb283; --blue:#8ab0c4; --purple:#b09ac4;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 14px 40px -22px rgba(0,0,0,.85);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);
    color:var(--ink); font-family:var(--serif); font-size:17.5px; line-height:1.6; padding-bottom:110px}
  .wrap{max-width:860px; margin:0 auto; padding:0 20px}
  header.masthead{padding:52px 0 20px; text-align:center}
  .emblem{display:inline-flex; align-items:baseline; gap:.04em; font-family:var(--disp); font-size:60px; line-height:1}
  .emblem .b{color:var(--ink); font-weight:600; position:relative; padding-bottom:6px}
  .emblem .b::after{content:""; position:absolute; left:2%; right:2%; bottom:0; height:4px; background:linear-gradient(90deg,var(--red),var(--oxblood)); border-radius:2px}
  .spark{color:var(--gold); font-size:24px; transform:translateY(-20px); margin-left:2px}
  .kicker{font-family:var(--mono); font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--ink-faint); margin:20px 0 6px}
  h1.title{font-family:var(--disp); font-weight:600; font-size:36px; line-height:1.1; margin:.1em 0 .15em}
  .byline{font-family:var(--mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--oxblood); margin-top:14px}
  .rule{height:1px; background:linear-gradient(90deg,transparent,var(--rule) 15%,var(--rule) 85%,transparent); margin:28px 0}
  .letter{background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:26px 28px 22px; box-shadow:var(--shadow); position:relative}
  .letter::before{content:"how to use this"; position:absolute; top:-9px; left:22px; background:var(--card); padding:0 10px; font-family:var(--mono); font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--gold)}
  .letter p{margin:0 0 12px} .letter p:last-child{margin-bottom:0}

  /* legend */
  .legend{display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 0}
  .lg{display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); border:1px solid var(--rule); border-radius:20px; padding:4px 11px}
  .lg .sw{width:10px; height:10px; border-radius:3px; display:inline-block}

  /* chapters */
  .chap{margin-top:44px}
  .chap-head{display:flex; align-items:center; gap:12px; background:var(--paper); padding:10px 0; border-bottom:1px solid var(--rule)}
  .chap-head h2{font-family:var(--disp); font-weight:600; font-size:24px; margin:0}
  .chap-head .cnt{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--ink-faint); text-transform:uppercase}

  /* edit cards */
  .ed{background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:16px 18px; margin:14px 0; border-left-width:4px; border-left-style:solid}
  .ed[data-t="age-fix"], .ed[data-t="line-edit"], .ed[data-t="timing-marker"]{border-left-color:var(--gold)}
  .ed[data-t="new-paragraph"]{border-left-color:var(--green)}
  .ed[data-t="new-scene"], .ed[data-t="new-chapter"]{border-left-color:var(--oxblood)}
  .ed[data-t="restructure"]{border-left-color:var(--red)}
  .ed[data-t="flashback-slot"], .ed[data-t="parked"]{border-left-color:var(--purple)}
  .ed[data-t="open-question"]{border-left-color:var(--blue)}
  .ed-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px}
  .pill{font-family:var(--mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; padding:3px 8px; border-radius:20px; border:1px solid var(--rule); color:var(--ink-soft)}
  .pill.type{font-weight:600}
  .ed[data-t="new-scene"] .pill.type, .ed[data-t="new-chapter"] .pill.type{color:var(--oxblood); border-color:var(--oxblood)}
  .ed[data-t="new-paragraph"] .pill.type{color:var(--green); border-color:var(--green)}
  .ed[data-t="restructure"] .pill.type{color:var(--red); border-color:var(--red)}
  .ed[data-t="flashback-slot"] .pill.type, .ed[data-t="parked"] .pill.type{color:var(--purple); border-color:var(--purple)}
  .ed[data-t="open-question"] .pill.type{color:var(--blue); border-color:var(--blue)}
  .ed[data-t="age-fix"] .pill.type, .ed[data-t="line-edit"] .pill.type, .ed[data-t="timing-marker"] .pill.type{color:var(--gold); border-color:var(--gold)}
  .ed h4{font-family:var(--disp); font-weight:600; font-size:19px; margin:0 0 7px; line-height:1.25}
  .ed .prop{margin:0 0 10px; font-size:16px}
  .ed .prop p{margin:0 0 9px}
  .ed .prop p:last-child{margin-bottom:0}
  .ed .prop strong{font-weight:600}
  .ed .prop .lead{color:var(--ink)}
  .ed .prop ul.opts{list-style:none; margin:10px 0 2px; padding:0}
  .ed .prop ul.opts li{position:relative; padding:6px 10px 6px 26px; margin:4px 0; background:var(--paper-2); border:1px solid var(--rule); border-radius:8px; font-size:15px; line-height:1.45}
  .ed .prop ul.opts li:before{content:"▸"; position:absolute; left:9px; top:6px; color:var(--gold)}
  .ed .prop .change{background:var(--paper-2); border:1px dashed var(--rule); border-radius:8px; padding:8px 12px; margin:8px 0; font-size:15px}
  .ed .why{font-size:13.5px; color:var(--ink-faint); font-style:italic; margin:0 0 10px}
  .ed .draft{font-size:14.5px; color:var(--ink-soft); background:var(--paper-2); border:1px dashed var(--rule); border-radius:8px; padding:9px 12px; margin:0 0 10px}
  .ed .draft b{font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:400; display:block; margin-bottom:4px}
  .anchor{font-size:13px; color:var(--ink-faint); margin:0 0 12px; line-height:1.5}
  .anchor .h,.anchor .t{font-style:italic}
  .anchor b{font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; font-style:normal; color:var(--ink-faint); margin-right:4px}
  .anchor .mark{color:var(--oxblood); font-weight:700; font-style:normal; padding:0 3px}

  /* verdict row */
  .verd{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .vbtn{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; padding:7px 14px; border-radius:8px; border:1px solid var(--rule); background:transparent; color:var(--ink-soft); cursor:pointer; transition:.12s}
  .vbtn:hover{border-color:var(--ink-soft)}
  .vbtn.acc.on{background:var(--green); border-color:var(--green); color:var(--paper)}
  .vbtn.rej.on{background:var(--red); border-color:var(--red); color:var(--paper)}
  .cmt{flex:1; min-width:160px}
  .cmt input{width:100%; background:var(--paper); color:var(--ink); border:1px solid var(--rule); border-radius:8px; padding:8px 11px; font-family:var(--serif); font-size:14px}
  .cmt input:focus{outline:none; border-color:var(--oxblood)}

  .bar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--paper); border-top:1px solid var(--rule)}
  .bar-in{max-width:860px; margin:0 auto; padding:11px 20px; display:flex; align-items:center; gap:14px}
  .progress{flex:1; display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:11.5px; color:var(--ink-soft)}
  .track{flex:1; height:6px; background:var(--rule); border-radius:6px; overflow:hidden; max-width:240px}
  .fill{height:100%; width:0; background:linear-gradient(90deg,var(--oxblood),var(--gold)); transition:width .3s}
  button.act{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--oxblood); color:var(--paper); background:var(--oxblood); padding:9px 14px; border-radius:8px; cursor:pointer}
  button.ghost{background:transparent; color:var(--oxblood)}
  .theme-btn{position:absolute; top:16px; right:18px; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); background:transparent; border:1px solid var(--rule); border-radius:20px; padding:5px 11px; cursor:pointer}
  .toast{position:fixed; bottom:70px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0; background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:10px; font-size:13.5px; font-family:var(--mono); transition:.25s; pointer-events:none; z-index:50}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  @media(max-width:640px){ h1.title{font-size:30px} .emblem{font-size:50px} .letter{padding:20px} .ed{padding:14px} }
</style>
</head>
<body>
<button class="theme-btn" id="themeBtn">☾ night</button>
<div class="wrap">
  <header class="masthead">
    <div class="emblem"><span class="b">B</span><span class="spark">✦</span></div>
    <div class="kicker">Bill · your story wizard</div>
    <h1 class="title">BURGUNDY: The Edit Proposal</h1>
    <div class="byline" id="byline"></div>
  </header>

  <div class="letter" id="intro"></div>

  <div class="legend" id="legend"></div>

  <div id="chapters"></div>
</div>

<div class="bar"><div class="bar-in">
  <div class="progress"><span id="pText">0 ruled</span><span class="track"><span class="fill" id="fill"></span></span></div>
  <button class="act ghost" id="accAllBtn" title="accept everything not yet ruled">accept rest</button>
  <button class="act ghost" id="clearBtn">clear</button>
  <button class="act" id="exportBtn">export ↧</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
const DATA = {"intro":"**★ First, a personal one (not the novel):** this FALL, set Henry up to walk his dog every day. He gets a TRACKER, racks up miles, and earns $1 per mile. He wears a little ruck with his iPad and goes out exploring with the dog — makes money, feels motivated, gets exercise. (Logged so it doesn't get lost; ACCEPT to mark it handled, or COMMENT to adjust the deal.)\n\n---\n\n**The cockpit — one page, everything the book needs from you.** I've written each card the way I'd say it to you out loud: what got flagged, what I actually think and why, and then a clear choice or two. No cipher. Accept means I make the change as a green edit in the book; reject kills it; comment overrides me with your own words.\n\n**Where we are:** Part 1 is in the manuscript, ch1/ch2/the white-room are rewritten and clean, and I re-read the whole current book before judging a single note below.\n\n**What's on this page:** 30 decisions I need from you — the big new-canon calls (names for the space-doors, the clan, the red phone; the physics ruling; the weapons-depot spec; which shape the middle takes) sit up top, then every one of **Iz's 117 margin notes** and **your own 84**, each read against the current text and given my honest verdict (102 still live, 88 already handled — just confirm those). Below all that, the 42 original proposal edits (82–123) still waiting on you. Export when you're done and I'll execute.","edits":[{"chapter":"world","seq":900,"type":"open question","size":"ruling","title":"NAME: the space-doors (not \"port\", not \"space door\")","proposal":"The massive circular megastructures that rip open + hold a wormhole (supernova-powered, osmarine-held). You didn't love \"port\" or \"space door.\" Options grounded in the physics — pick one or riff: (A) The Aperture / an Aperture. (B) The Throat (the physics term for a wormhole's neck — stark, bodily). (C) The Lock (canal-lock resonance — a passage you pass through; pairs with \"the door stays locked open\"). (D) The Seam. (E) The Conjunction / a Conjunction-gate. (F) named per its star — \"the Ros Gate.\" Bill's lean: THE LOCK (canal + held-open double meaning). COMMENT with your pick.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"world","seq":901,"type":"open question","size":"ruling","title":"NAME: Burgundy's ruling clan (V-start, not too magical)","proposal":"The clan Nicholas installed 84 years ago; Burgundy is its 4th generation. You wanted a V, not-magical. Options: (A) Clan VESK. (B) Clan VORNE. (C) Clan VOSS. (D) Clan VANTREL. (E) Clan VIRE. (F) Clan VARO. (G) Clan VESNIK. Bill's lean: VOSS (hard, plain, planetary) or VANTREL (a touch more dynastic). Note: the King's name is currently \"Vorran\" — pick a clan name that doesn't collide. COMMENT with your pick, or a different letter.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"world","seq":902,"type":"open question","size":"ruling","title":"NAME: the \"red phone\" (Cold-War hotline device)","proposal":"The comms device in the King's lounge — the only channel to Nicholas, with a color-coded escalation ladder (code red → Shanti). Not a literal red telephone. Options: (A) The Line. (B) The Recourse. (C) The Hotline (plain, Cold-War-honest). (D) The Petition. (E) The Escalation. (F) The Redoubt-line / the Redline (the color survives as the top tier: \"going redline\"). Bill's lean: THE REDLINE — keeps your red, verbs nicely (\"he went redline\"), and the ladder tiers are colors. COMMENT.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"physics","seq":903,"type":"open question","size":"ruling","title":"RULING: how much to fudge the space-door physics","proposal":"The research grounds it in real theory (traversable wormholes need exotic matter to hold the throat = osmarine's job; supernova energetics ~10^44 J = the tear; Chandrasekhar-limit \"tipping\" a marginal star = the trigger; canal/chokepoint economics = the ~71 doors). The honest fudges: harnessing/channeling a whole supernova, and \"coaxing\" a star over the edge on demand. Bill's recommendation: keep the TRAPPINGS rigorous (characters speak of throats, exotic mass, the Chandrasekhar edge, the door's frame) and let the two big cheats stay off-page / stated once as accepted history.\n\n▸ Accept — that level.\n▸ Comment — go harder/softer. (Full physics bible on your Desktop.)","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"4","seq":904,"type":"open question","size":"ruling","title":"REFRAME: osmarine is what HOLDS THE DOORS OPEN (not \"enables star travel\")","proposal":"Per your note, we kill the too-Dune line. New framing everywhere osmarine/travel comes up (ch4 Custom House, Mira's library, the King's dinner boasts): before the doors, travel between stars was slow (decades), the galaxy thin; osmarine's discovery let them hold open the space-doors that made everything reachable — and Nicholas pioneered it here.\n\n▸ Accept — Bill rewrites the osmarine/travel lines to the door framing (green suggestions).\n▸ Comment — your framing.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"world","seq":905,"type":"open question","size":"ruling","title":"THE STRIKE CAUTIONARY TALE: the uniquely-Nicholas cruelty","proposal":"Grandpa once used the lowest tier of the red phone (a mine strike the domestic force couldn't break). Nicholas's people came and did something uniquely cruel — NOT just \"mowed them down.\" THE RESEARCH FOUND A GROUNDED ANSWER (from King Leopold's Congo, where the signature atrocity was an accounting rule — a severed hand per spent bullet, because the arms-supplier metered munitions and wouldn't trust the local force with unaccounted weapons). Bill's recommendation: \"the Listen + the Meter.\" Nicholas installs (a) a pervasive SURVEILLANCE instrument that hands the King power to hear the people's own words (feeds his control-by-listening doctrine), AND (b) a MUNITIONS-METERING regime — every round issued to the King's men must be reconciled crate-by-crate on the Vicentennial cadence, because Nicholas is an arms-maker who fears his proxy hoarding force for a mutiny. It empowers the King's oppression precisely by making him ACCOUNT to Nicholas for every gram of force — and it foreshadows Burgundy building an army of drill-robots that appears on no ledger at all. And the tribute rose after, and never came down.\n\n▸ Accept — the Listen + the Meter.\n▸ Comment — pick one, or your own.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"world","seq":906,"type":"open question","size":"ruling","title":"SPEC: the weapons depot arsenal (what's actually in there)","proposal":"Nicholas's on-planet bunker of the clan's disbanded Civil-War military — the thing the resistance quietly empties. You wanted tactical/conventional, NOT WMD, and feasibly under front-heavy / back-unguarded security. Bill's spec: bulk small arms + ammunition, crew-served weapons, armored ground platforms (tanks/walkers), tube & rocket artillery, air-defense batteries, munitions/explosives stores — sealed and racked, guarded hard at the single front entry, zero rear security because it's buried in dead tunnels nothing could breach (until antimatter drills).\n\n▸ Accept — that spec.\n▸ Comment — adjust the loadout.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"world","seq":907,"type":"open question","size":"ruling","title":"The vassal-planet roster (what each world provides)","proposal":"The system's vassal planets each export ~one thing as tribute; trade among them existed before Nicholas, extortion after. Confirmed: Ros = minerals/osmarine; the ocean world = seafood protein (99% ocean, 87 islands, vacuum-cold cargo). Bill proposes (transposed from real single-resource colonies): a timber/biomass world, a heavy-metals world, a rare-earth/refining world, an agri/calorie world (the sugar-analogue), and a transit/broker world that skims every cargo.\n\n▸ Accept — build the roster from these.\n▸ Comment — your worlds. (Full economics bible on your Desktop.)","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"middle","seq":908,"type":"open question","size":"ruling","title":"STRUCTURE: pick the escalation approach for the middle (4 paths coming)","proposal":"I ran a deep structural study (Harry Potter / Hunger Games / Dune / Monte Cristo / Baru Cormorant) and designed FOUR distinct architectures for the tunnels→climax middle: (1) THE TIGHTENING LEDGER — the father's finance audit is the master clock; (2) THE TRAINING PROGRESSION — the 3-week rotations ARE the structure, curriculum-as-clock; (3) THE EMPTYING DEPOT — the heist is the spine; (4) THE SEEN BOY — the emotional arc drives everything. All are visualized side-by-side on the new OUTLINE HUB (mycoldmars.com/burgundy/outline). This card is where you tell me which one (or which blend) to build the middle around.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"middle","seq":909,"type":"open question","size":"ruling","title":"The 20th-birthday time-bomb: what forces the war?","proposal":"The middle needs a hard clock: something scheduled for the Vicentennial (20th birthday) that would EXPOSE the workshop / South-12 and force Burgundy to move first. Bill's candidate: the rite includes a ceremonial full SURVEY/mapping of the palace's under-tunnels (an old tradition — the new prince is shown \"the whole of what he'll rule\"), which would walk the King's people straight into the robot-dug tunnel and the factory. So the revolution must break BEFORE the survey.\n\n▸ Accept — that device.\n▸ Comment — your time-bomb.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"middle","seq":910,"type":"open question","size":"ruling","title":"Does Burgundy volunteering to run the ledger audit read as too convenient?","proposal":"You flagged this: the father gripes that Mira is over-spending (steel, tracks, bearings, hydraulic arms), sends a finance minister to audit — and Burgundy, who knows it's all for HIM, wants to deflect, maybe by volunteering to run the investigation himself. Bill's read: him volunteering outright IS a little convenient/suspicious (a prince asking to audit his own mother reads as odd to the King). Stronger: Burgundy doesn't volunteer — he QUIETLY sabotages from inside (befriends/feeds the finance minister false leads, or gets Mira to reroute the worst orders through a clean broker) so the audit keeps almost-finding-it. That's the Baru Cormorant move and it's far more tense.\n\n▸ Accept — the quiet-sabotage version.\n▸ Comment — keep the volunteer version / your idea.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"world","seq":911,"type":"open question","size":"ruling","title":"NAME/ROLE: who is the militant, and who is the Ghai depot-navigator?","proposal":"Two resistance roles are still uncast. (1) THE MILITANT — his father was killed brutally by the regime; he's the one who says \"put weapons on the robots,\" the revenge-force who pushes escalation. (2) THE GHAI-DESCENDED NAVIGATOR — the woman with indigenous local knowledge of the old tunnels who realizes she knows where the weapons depot is and how to reach its unguarded back. They can be two people or (riskier, richer) linked. Bill will draft names on your nod.\n\n▸ Accept — Bill casts + names them.\n▸ Comment — your casting (e.g. make the militant the Ghai woman's brother; whose death drives the militant).","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"world","seq":912,"type":"open question","size":"ruling","title":"NAME: the rival that fueled the LOSING side of the Great Rupture","proposal":"The clan won the proxy war because Nicholas backed them. The OTHER side was backed by a rival Core-adjacent power — a second East-India-Company-type corporate machine competing with Nicholas for the newly-opened backwater. Naming it (and keeping it faintly alive — a defeated claimant, a corporate competitor still lurking) gives the history teeth and a future threat. Bill's options on your nod.\n\n▸ Accept — Bill names the rival + defines its residue.\n▸ Reject — leave it unnamed backstory. COMMENT.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"world","seq":913,"type":"open question","size":"ruling","title":"CANON RECONCILE: numbers that must line up before we lock the history","proposal":"The deep model surfaced a few number collisions to settle so the book stays airtight: (a) the manuscript's \"83 years\" (Gitz on refining osmarine) vs the new \"84 years ago\" (the supernova/Cut + the clan takeover) — align to ONE date or make the 1-year gap meaningful; (b) \"four generations\" (clan rule) vs any \"five generations\" line — the clan has ruled FOUR (Burgundy is 4th; great-grandfather = founder); (c) osmarine scarcity — the manuscript says \"31 known planets with osmarine\" but the new door-physics wants it rare/controlled; reconcile abundance. Bill's recommendation: lock 84 years, 4 generations, and make osmarine 'known on 31 worlds but refinable/door-grade on almost none — and Nicholas holds those.'\n\n▸ Accept — lock as recommended.\n▸ Comment — your numbers.","head":"","tail":"","rationale":"a decision for you","draft":""},{"chapter":"structure","seq":914,"type":"open question","size":"ruling","title":"STRUCTURE: the two new TRAINING chapters — where do they go?","proposal":"The training-rhythm middle needs ~2 new chapters where Burgundy shadows professionals (the Archives with the old archivist → the Rupture history; the Office of External Affairs with Schwartz → the vassal planets; the defense track → the weapons depot + red phone as 'boring training facts'). This REPLACES the tutor-flashbacks (to be deleted). The integration map proposes exact insertion points + renumber.\n\n▸ Accept — Bill inserts the two trai ork. Not *for *anyone. For himself. / He had told himself, sometimes, that he was preparing for something. / He had not been sure, until this year, what.'\n\nAgree with the cut, decline the replacement. 'Not for anyone. For himself.' is the negation-family construction under the house cap — and since the 2026-08-04 lock it's also mildly off-canon: the want is engineered and outward (the machine traces to the boy at the chisel; modernization is the mark he means to make; the look lands on the machine first). 'For himself' re-frames the build as private hobby. The two lines that follow ('preparing for something... not sure, until this year, what') already carry the want-engine forming — let them stand alone. Her replacement restates secrecy the scene has already established twice.\n\n» **I'd change:** Change 'And then he would work. Not *for *anyone. For himself.' → 'And then he would work.'\n\n▸ Accept — I make that change as a green edit in the book\n▸ Reject — keep the line as it is\n▸ Comment — tell me your own version","head":"","tail":"","rationale":"note f27515bc · live","draft":""},{"chapter":"1","seq":501,"type":"iz note","size":"low","title":"Iz · The off-by-one beat: 'without seeing' / 'He saw it now.'","proposal":"**Iz flagged this:** 'without seeing' — Not necessary. 'He saw it now.' — Same [cut].\n\n*As it reads now:* 'an off-by-one error he had been looking at for almost an hour without seeing. / He saw it now. He pressed the tab key...'\n\nDisagree. This pair is the proof of the opening's fatigue engine: thirty-one hours awake means his eyes slide over his own bug. 'Without seeing' sets the paradox; 'He saw it now' pays it in three flat words. Cut either and the timer and the shaking hand lose their evidence. This is the house's flat repetition doing work, not fluff.\n\n▸ Agree with me — leave it, close the note\n▸ Override — tell me what to change instead","head":"","tail":"","rationale":"note 17b73713 · live","draft":""},{"chapter":"1","seq":502,"typ e machines out of my shaft..' paragraph to: '\"Get these machines out of my shaft,\" she said. \"Now, before a foreman walks over or that cage comes down. And take half their harvest with you. I'll deal with what the rest looks like.\" Tobin gave her an incredulous look.' Double period gone, the orders land as orders, and 'the number 2' phrasing goes.","head":"completely, instantly, and with the door left open exactly one crack.","tail":"She stepped closer, and lowered her voice to the width of the three of them.","rationale":"Plain language on the beat that establishes Hesta's command style.","draft":"Replace the paragraph from \"Get these machines out of my shaft..\" through \"an incredulous look.\" with the version quoted in the proposal."},{"chapter":"22","seq":8,"type":"line-edit","size":"small","title":"Cut the theory-became-application explainer","proposal":"I'm going to end the 'other thing' paragraph two sentences early: keep 'It was the other thing. The thing with no shape in his world until tonight, the way the machines had no shape in Hesta's.' and cut the callback to the core-world researchers plus 'But tonight, theory became application. Foggy ideas became real.' The chapter has already dramatized all of it; the narrator restating it as thesis flattens the ending.","head":"any of a hundred threads that could end everyone in that cavern.","tail":"Three nights. A full moon. A place he would be taken to.","rationale":"Theme dramatized never stated; the Hesta mirror is the fact, stop there.","draft":"Delete from \"Or how \\\"real world industrial application scenarios\\\" had no shape\" through \"Foggy ideas became real.\""},{"chapter":"22","seq":9,"type":"line-edit","size":"small","title":"Tighten the came-back-up paragraph to its button","proposal":"I'm going to recast the penultimate paragraph as: 'He had gone down a tunnel to retrieve three runaway mining machines, and had come back up as something else: measured by a woman who ran something, scheduled into a network that had survived being looked for, four words of a child's observation still ringing in his ears. *It doesn't get tired.*' The em dash becomes a colon and the triple-negation sentence ('never have planned, never have designed, never have predicted') is cut, so 'It had found other people.' lands directly after the girl's four words.","head":"Three nights. A full moon. A place he would be taken to.","tail":"It had found other people.","rationale":"Em-dash ban, negation cap, LAST STEP: the Part One button is strongest unexplained.","draft":"Replace \"something else — measured\" with \"something else: measured\" and delete the \"His project had become something he could never have planned...\" sentence."}],"stats":{"total":273,"byType":"30 decisions + 201 note cards (Iz 117 / yours 84) + 42 original edits"},"coverage":[{"goal":"Ch1 = night after 17th birthday, rite, robot brought unbidden","coveredBy":"Ch1: Recast Chapter 1 as the night after his 17th birthday"},{"goal":"Ch2 first council: rejection + rite and marriage tour mentioned unexplained","coveredBy":"Ch2: Reframe the arrival; Ch3: Rewrite the opening exchange; Rewrite the rejection close"},{"goal":"Restructure: old ch1-3 redistribute; then Mira shows him the room","coveredBy":"Ch2: Merge old Ch2 and Ch3 (Mira's Wing kept as its own chapter turn, one-word revert if Johnny wants the full merge)"},{"goal":"Timing number fixes (17 not 19, Oz two years, 18 months, six->three months, three-week break, thirteen->fifteen, in-place two-years checks)","coveredBy":"Age-fix and timing items in ch1, 6, 9, 13, 15, 16, 17, 20, 21; keep-as-is decision items ch4, ch8"},{"goal":"Vicentennial spoken ladder (3 yrs -> 2 yrs -> year and change -> a year -> months -> weeks)","coveredBy":"Timing markers ch1, 3, 5, 9, 11, 12 (x2), 13 (toast inside new scene), 15, 16, 18, 20, 22; weeks: ch19 cores marker"},{"goal":"Want-engine: Vicentennial demo plan replaces ch15 no-plan; threaded","coveredBy":"Ch10: Birth of the plan; ommended option","coveredBy":"Ch13: open-question (recommended); Ch19: open-question variant (optional, not both at full strength)"},{"goal":"Extraction read via 3-4 fragment-seeds; geopolitics/tutor content PARKED","coveredBy":"Parked slots: ch1 tribute ships, ch2 tutor, ch7 square, ch10 (x2), ch12 counting, ch15 mining disc, ch18 sphere, ch21 Ghai — slots only, no prose"},{"goal":"Mira: operator, love=provision, academy-rebuilt, fragments, father-anger, training-as-cover, stakes plain","coveredBy":"Ch5: academy room, father fragment, flattened laugh, alibi paragraph, stakes edit; Ch16: freight/cartel fragment"},{"goal":"Tuck provider-act as finished object (pedal rig)","coveredBy":"ADDED — Ch7: Tuck's provider-act as a finished object (was MISSING from all six ranges)"},{"goal":"Voice doctrine enforcement (em dashes, negation cap, cargo test, end on object)","coveredBy":"Ch5 curious line; Ch9 TK face; Ch12/18 end-on-object; Ch20 final-frontier cut; Ch21 negation cuts; Ch22 sweep and tightenings"},{"goal":"Twinrise/Teem renames everywhere","coveredBy":"Ch6 Twinrise birthday; Ch12 (x3); Ch13 (x2); Ch14; Ch16 Descent"},{"goal":"Climax foundations only, no revolution prose","coveredBy":"Seeds only: ch20 King's platform line, ch20 silent plan, ch22 Tobin from below; nothing drafted (confirmed)"},{"goal":"Mira internal age consistency (ch5 seventeen vs ch14 twenty-six/eight years)","coveredBy":"ADDED — Ch14: Reconcile Mira's age drift (was flagged in notes but MISSING from edits)"}]};
const KEY = 'bill-burgundy-proposal-v3';
let R = {};
try{ const p = JSON.parse(localStorage.getItem(KEY) || '{}'); R = (p && typeof p==='object' && !Array.isArray(p)) ? p : {}; }catch(e){ R = {}; }
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const inlineMd = s => esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');
function renderProp(s){
  if(!s) return '';
  let out=''; let opts=[];
  const flush=()=>{ if(opts.length){ out+='<ul class="opts">'+opts.map(o=>'<li>'+inlineMd(o)+'</li>').join('')+'</ul>'; opts=[]; } };
  for(const block of String(s).split(/\n\n+/)){
    const b = block.trim(); if(!b) continue;
    const lines = b.split(/\n/).map(l=>l.trim()).filter(Boolean);
    if(lines.length && lines.every(l=>/^▸\s+/.test(l))){ for(const l of lines) opts.push(l.replace(/^▸\s+/,'')); continue; }
    flush();
    if(/^»\s+/.test(b)){ out+='<div class="change">'+inlineMd(b.replace(/^»\s+/,''))+'</div>'; continue; }
    out += '<p'+(out?'':' class="lead"')+'>'+inlineMd(b).replace(/\n/g,'<br>')+'</p>';
  }
  flush();
  return out;
}

const TYPE_LABEL = { 'age-fix':'number fix','line-edit':'line edit','timing-marker':'timing marker','new-paragraph':'new paragraph','new-scene':'new scene','new-chapter':'new chapter','restructure':'restructure','flashback-slot':'flashback slot','parked':'parked (geo)','open-question':'open question' };
const TYPE_COLOR = { 'age-fix':'var(--gold)','line-edit':'var(--gold)','timing-marker':'var(--gold)','new-paragraph':'var(--green)','new-scene':'var(--oxblood)','new-chapter':'var(--oxblood)','restructure':'var(--red)','flashback-slot':'var(--purple)','parked':'var(--purple)','open-question':'var(--blue)' };

const edits = DATA.edits.map((e,i)=>({...e, id: 'e'+i}));
const total = edits.length;

$('#byline').textContent = 'chronological · '+total+' proposed edits · accept, reject, or comment on each';
$('#intro').innerHTML = DATA.intro.split(/\n\n+/).map(p=>'<p>'+inlineMd(p)+'</p>').join('');

// legend (only types present)
const present = [...new Set(edits.map(e=>e.type))];
$('#legend').innerHTML = present.map(t=>'<span class="lg"><span class="sw" style="background:'+TYPE_COLOR[t]+'"></span>'+esc(TYPE_LABEL[t]||t)+'</span>').join('');

// group by chapter, chronological
function chapKey(c){ const m = String(c).match(/\d+/); return m ? parseInt(m[0]) + (String(c).toLowerCase().includes('new')? 0.5 : 0) : 99; }
const groups = {};
edits.forEach(e=>{ (groups[e.chapter] = groups[e.chapter] || []).push(e); });
const chapOrder = Object.keys(groups).sort((a,b)=>chapKey(a)-chapKey(b) || String(a).localeCompare(String(b)));
chapOrder.forEach(c => groups[c].sort((a,b)=>(a.seq||0)-(b.seq||0)));

const cbox = $('#chapters');
chapOrder.forEach(c=>{
  const sec = document.createElement('section'); sec.className='chap';
  let h = '<div class="chap-head"><h2>'+(String(c).match(/^\d+$/)?'Chapter '+c:esc(c))+'</h2><span class="cnt">'+groups[c].length+' edits</span></div>';
  groups[c].forEach(e=>{
    const st = R[e.id]||{};
    h += '<div class="ed" data-t="'+esc(e.type)+'" data-id="'+e.id+'">';
    h += '<div class="ed-top"><span class="pill type">'+esc(TYPE_LABEL[e.type]||e.type)+'</span><span class="pill">'+esc(e.size)+'</span></div>';
    h += '<h4>'+esc(e.title)+'</h4>';
    h += '<div class="prop">'+renderProp(e.proposal)+'</div>';
    if(e.draft) h += '<div class="draft"><b>the change</b>'+esc(e.draft)+'</div>';
    if(e.head || e.tail){
      h += '<p class="anchor">';
      if(e.head) h += '<b>after</b><span class="h">“…'+esc(e.head)+'”</span> ';
      h += '<span class="mark">◆</span>';
      if(e.tail) h += ' <b>before</b><span class="t">“'+esc(e.tail)+'…”</span>';
      h += '</p>';
    }
    if(e.rationale) h += '<p class="why">'+esc(e.rationale)+'</p>';
    h += '<div class="verd">';
    h += '<button class="vbtn acc'+(st.v==='accept'?' on':'')+'" data-id="'+e.id+'" data-v="accept">✓ accept</button>';
    h += '<button class="vbtn rej'+(st.v==='reject'?' on':'')+'" data-id="'+e.id+'" data-v="reject">✗ reject</button>';
    h += '<span class="cmt"><input data-id="'+e.id+'" placeholder="comment…" value="'+esc(st.c||'')+'"></span>';
    h += '</div></div>';
  });
  sec.innerHTML = h; cbox.appendChild(sec);
});

function ruled(id){ const s=R[id]||{}; return !!(s.v || (s.c && s.c.trim())); }
const doneSet = new Set(edits.filter(e=>ruled(e.id)).map(e=>e.id));
function refreshBar(){
  $('#pText').textContent = doneSet.size+' of '+total+' ruled';
  $('#fill').style.width=(total?doneSet.size/total*100:0)+'%';
}
function refresh(){ doneSet.clear(); edits.forEach(e=>{ if(ruled(e.id)) doneSet.add(e.id); }); refreshBar(); }
let saveTimer=null;
function persist(){ localStorage.setItem(KEY, JSON.stringify(R)); }
function persistSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(persist, 400); }
window.addEventListener('beforeunload', persist);
window.addEventListener('pagehide', persist);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') persist(); });
function updateOne(id){ if(ruled(id)) doneSet.add(id); else doneSet.delete(id); refreshBar(); }
function save(){ persist(); refresh(); }

document.body.addEventListener('click', ev=>{
  const b=ev.target.closest('.vbtn'); if(!b) return;
  const id=b.dataset.id, v=b.dataset.v;
  R[id]=R[id]||{};
  R[id].v = R[id].v===v ? null : v;
  const card=document.querySelector('.ed[data-id="'+id+'"]');
  card.querySelectorAll('.vbtn').forEach(x=>x.classList.toggle('on', x.dataset.v===R[id].v));
  updateOne(id); persist();
});
document.body.addEventListener('input', ev=>{
  const inp=ev.target.closest('.cmt input'); if(!inp) return;
  const id=inp.dataset.id; R[id]=R[id]||{}; R[id].c=inp.value;
  updateOne(id); persistSoon();
});
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1900); }

$('#accAllBtn').addEventListener('click', ()=>{
  edits.forEach(e=>{ if(!ruled(e.id)){ R[e.id]=R[e.id]||{}; R[e.id].v='accept'; } });
  document.querySelectorAll('.ed').forEach(card=>{
    const id=card.dataset.id; card.querySelectorAll('.vbtn').forEach(x=>x.classList.toggle('on', x.dataset.v===(R[id]&&R[id].v)));
  });
  save(); toast('accepted the rest');
});
$('#clearBtn').addEventListener('click', ()=>{
  if(!confirm('Clear all your rulings?')) return;
  R={}; localStorage.removeItem(KEY);
  document.querySelectorAll('.vbtn').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.cmt input').forEach(i=>i.value='');
  refresh(); toast('cleared');
});
$('#exportBtn').addEventListener('click', async ()=>{
  let md='# BURGUNDY — Johnny\'s rulings on the Edit Proposal\n\n';
  chapOrder.forEach(c=>{
    md+='\n## '+(String(c).match(/^\d+$/)?'Chapter '+c:c)+'\n';
    groups[c].forEach(e=>{
      const s=R[e.id]||{};
      md+='\n### '+e.title+' ['+(TYPE_LABEL[e.type]||e.type)+' · '+e.size+']\n';
      md+='- **Verdict:** '+(s.v?s.v.toUpperCase():'_(unruled)_')+'\n';
      if(s.c&&s.c.trim()) md+='- **Johnny:** '+s.c.trim()+'\n';
    });
  });
  try{ await navigator.clipboard.writeText(md); toast('copied — paste it back to Parley'); }catch(e){ toast('downloaded'); }
  const blob=new Blob([md],{type:'text/markdown'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='BURGUNDY-edit-rulings.md'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
});
const tb=$('#themeBtn');
function setTheme(t){ document.documentElement.dataset.theme=t; tb.textContent=t==='night'?'☀ day':'☾ night'; try{localStorage.setItem('bill-theme',t);}catch(e){} }
let bootTheme='day'; try{ bootTheme=localStorage.getItem('bill-theme')||'day'; }catch(e){}
setTheme(bootTheme);
tb.addEventListener('click', ()=>setTheme(document.documentElement.dataset.theme==='night'?'day':'night'));
refresh();
</script>
