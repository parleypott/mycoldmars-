iar script of his, Burgundy could see it. / 'But actually you know what? I don't actually rule this planet. I don't rule ore. Do you know what I actually rule?'\"\n\n**What this is really asking:** She hears the wrongness. \"But actually you know what?\" is modern-casual, and \"actually\" lands three times in two sentences — the King sounds like a podcast host, not a man performing a polished maxim.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree on the symptom, disagree on the full cut. The pivot to \"Men.\" is the chapter's title beat and canon (the rehearsed performance); cutting it guts the reveal. The fix is register: locked King canon says he speaks in polished maxims and never quips — dialogue is personality, never clever quips. Strip the colloquialisms, keep the turn. Also repairs the comma-spliced \"charming smile\" frame sentence.\n\n**Suggested edit:** Lines 294–296. OLD: \"He smiled a charming smile, and looked around, he was going into a familiar script of his, Burgundy could see it.\\n\\n\\\"But actually you know what? I don't actually rule this planet. I don't rule ore. Do you know what I actually rule?\\\"\" NEW: \"He smiled, and looked around the hall, and Burgundy could see him settling into a familiar script.\\n\\n\\\"But no. I do not rule this planet. I do not rule ore. Do you know what I rule?\\\"\"","head":"","tail":"","rationale":"note aadbbf0c-03a1-420f-b2e5-6a80d8b84f84 · priority medium","draft":""},{"chapter":"2","seq":550,"type":"iz note","size":"low","title":"IZ · \"Then a pause. Long\" → \"Longer\"","proposal":"**Iz said:** Longer — grammar fix on the fragment \"Then a pause. Long.\"\n\n**The passage now:** Live line 298: \"Then a pause. Longer than was comfortable.\"\n\n**What this is really asking:** Simple fragment repair.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Applied as she suggested. \"Longer than was comfortable\" mildly reports the feeling, but before the one-word \"Men.\" the timing note earns its place. Leave it.\n\n**Suggested edit:** None — resolved.","head":"","tail":"","rationale":"note 30706916-9bb8-4dc4-992d-69e92ee21130 · priority low","draft":""},{"chapter":"2","seq":551,"type":"iz note","size":"low","title":"IZ · \"His robe whispering\" — reword","proposal":"**Iz said:** \"Trailing behind him\" — replace \"whispering\" on the King's robe as he descends the dais.\n\n**The passage now:** Live line 310: \"he came down the three steps slowly, his coat brushing against the stone, and he stopped in front of the robot.\"\n\n**What this is really asking:** Her ear caught a banned word: \"whisper\" for a non-whispering thing is on the house blacklist.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Doubly resolved: \"whispering\" became the concrete \"brushing against the stone\" (real sound, passes Cargo), and \"robe\" became \"coat\" per the round-1 canon ruling — the council garment is a coat, never robes. The live version beats her \"trailing\" suggestion, which is visual filler.\n\n**Suggested edit:** None — resolved.","head":"","tail":"","rationale":"note 93cd42ca-c809-4034-8fc9-93ba3dd34d54 · priority low","draft":""},{"chapter":"2","seq":552,"type":"iz note","size":"low","title":"IZ · \"At eight years old, holding...\" — complete the image","proposal":"**Iz said:** \"Holding an upside down clock.\" — supplying an ending for the broken/incomplete clause in the old draft.\n\n**The passage now:** Live line 318: \"the word what came out the way it had come out of him at eight years old, holding a clock he had put back together upside down.\"\n\n**What this is really asking:** The old sentence trailed off; she completed it from memory of the clock beat.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Resolved, and the live wording outdoes her suggestion: \"a clock he had put back together upside down\" carries agency and shame in one object — the boy who takes things apart and gets them wrong in front of his father — and it echoes ch1's clock-taken-apart memory. An upside-down clock is just an object; a clock he reassembled wrong is the wound.\n\n**Suggested edit:** None — resolved.","head":"","tail":"","rationale":"note bde3f5cc-5b36-495a-9721-beb3ab8efb7a · priority low","draft":""},{"chapter":"2","seq":553,"type":"iz note","size":"medium","title":"IZ · \"Willingness\" — reader lost the question it answers","proposal":"**Iz said:** \"What makes our world better is willingness\" — adding the frame because \"it's been a sec and I forgot what he was answering.\"\n\n**The passage now:** Live: the King's question \"Do you know what changes the world, Burgundy?\" (line 314) → \"What.\" → a ~90-word interiority paragraph (the small word, the clock memory, line 318) → \"'Willingness,' the King said. 'Willingness to do what it takes to keep order and peace. That's what we do here.'\" (line 320).\n\n**What this is really asking:** A real comprehension gap from a trusted line-reader: the interiority beat between question and answer is long enough that the one-word answer lands unmoored. Her fix restates the question inside the answer — right diagnosis, slightly clunky prescription.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree the gap is real; the interiority paragraph is too good to cut and shouldn't move. The fix is to let the King re-anchor his own question in the answer's second sentence — which suits his rehearsed-maxim habit perfectly (canon: he may speak in polished maxims, diegetically). Keeps the one-word punch, closes the gap.\n\n**Suggested edit:** Line 320. OLD: \"\\\"Willingness,\\\" the King said. \\\"Willingness to do what it takes to keep order and peace. That's what we do here.\\\"\" NEW: \"\\\"Willingness,\\\" the King said. \\\"That is what changes the world. Willingness to do what it takes to keep order and peace. That is what we do here.\\\"\"","head":"","tail":"","rationale":"note 2178af91-4890-4447-9aa5-f692204c1dc3 · priority medium","draft":""},{"chapter":"2","seq":554,"type":"iz note","size":"low","title":"IZ · Tense: \"as it moves\" → \"moved\"","proposal":"**Iz said:** Moved — tense fix in the exit beat.\n\n**The passage now:** Live line 368: \"The wheel loud again as it moved across twenty colorful shades of sunlight.\"\n\n**What this is really asking:** Simple tense catch.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Fixed. The verbless fragment \"The wheel loud again\" is a deliberate rhythm choice and reads fine; the image of the loud wheel crossing the window's colored light is the chapter's motif closing correctly.\n\n**Suggested edit:** None — resolved.","head":"","tail":"","rationale":"note 9515c9ed-384a-4e3d-9608-00643d557fb6 · priority low","draft":""},{"chapter":"2","seq":555,"type":"iz note","size":"low","title":"IZ · Exit sentence — \"cut everything after\"","proposal":"**Iz said:** Cut everything after — targeting the run-on tail of \"...and at the doors he did not stop, and...\"\n\n**The passage now:** Live line 368: \"...and at the doors he did not stop, and he did not look back, and he pushed through into the corridor.\" Followed by the corridor coda: doors closing, the still moment, the shaking right hand, and \"Its green panel pulsed once, gently.\"\n\n**What this is really asking:** She felt the exit dragging — a pile-up of negations (\"did not look at Mira / did not look at the advisors / did not stop / did not look back\") stretching the departure.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Partially agree. The accumulation is real: four \"did not\" beats in the close. But a full cut after \"did not stop\" would amputate the corridor coda, which is protected — the shaking hand echoes ch1's timer beat, and the green panel pulsing once into the silence is exactly the quiet-object button the house style names as a model rest. Trim one negation, keep the coda whole.\n\n**Suggested edit:** Line 368. OLD: \"and at the doors he did not stop, and he did not look back, and he pushed through into the corridor.\" NEW: \"and at the doors he did not stop, and pushed through into the corridor.\" Keep everything after (doors closing through \"pulsed once, gently\") unchanged.","head":"","tail":"","rationale":"note 7abf2c9b-b932-46b3-bdb1-d1ad74378ced · priority low","draft":""},{"chapter":"3","seq":556,"type":"iz note","size":"low","title":"IZ · Combine 'He put his hand… He pressed…' into one motion","proposal":"**Iz said:** \"And pressed\" — combine the two sentences.\n\n**The passage now:** Fresh ch3: \"He put his hand on the prototype's housing. He pressed the small command that told it to follow. The prototype rolled after him.\"\n\n**What this is really asking:** Two consecutive 'He'-led sentences describing what is physically one motion (hand on housing, press the command) read choppy; she wants them joined.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree. Short declaratives are house rhythm, but here the period splits a single gesture and stacks a third 'He/The' sentence right after. Joining the first two keeps the punch for 'The prototype rolled after him,' which is the sentence that deserves to stand alone.\n\n**Suggested edit:** OLD: \"He put his hand on the prototype's housing. He pressed the small command that told it to follow.\" NEW: \"He put his hand on the prototype's housing and pressed the small command that told it to follow.\"","head":"","tail":"","rationale":"note 37a14eee-344e-4f59-a99c-5982015255b9 · priority low","draft":""},{"chapter":"3","seq":557,"type":"iz note","size":"low","title":"IZ · 'Descend' should be 'ascend' (the wheel climbs stairs)","proposal":"**Iz said:** \"Ascend\" — correcting the old draft's 'was going to have to descend.'\n\n**The passage now:** Fresh ch3: \"Its wheel, a single fat wheel, salvaged from a serving cart, rated for stone floors and stone floors only, was going to have to climb stairs.\"\n\n**What this is really asking:** A straight direction error in the old draft: the robot is going UP a stair flight to Mira's wing, and the old text said 'descend.'\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** She was right, and the big edit already fixed it, better than the one-word swap: the fresh line now says 'was going to have to climb stairs,' which is both correct and more concrete than 'ascend.' Nothing left to do.","head":"","tail":"","rationale":"note b9808ef4-2d0d-4591-a8b4-c3fb664f7085 · priority low","draft":""},{"chapter":"3","seq":558,"type":"iz note","size":"low","title":"IZ · Tense slip in the soft-mode retrofit paragraph ('He then wired')","proposal":"**Iz said:** \"And had\" — fold the sentence in after 'rim with a rubber sleeve.'\n\n**The passage now:** Fresh ch3: \"Two months ago, in the basement, he had cut the wheel open. He had lined the inner rim with a rubber sleeve. He then wired a small air compressor into the chest cavity. He had coded a 'soft-mode'…\"\n\n**What this is really asking:** The paragraph runs in past perfect (had cut, had lined, had coded) and one sentence drops out of it: 'He then wired.' She's flagging the tense inconsistency and proposing a join that restores the 'had.'\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree, this is a real grammar wobble, not taste. Her join is the clean fix: attach the compressor clause to the sleeve sentence so the 'had' carries across, and the paragraph stays in one tense. Also trims one of four consecutive 'He'-led sentences.\n\n**Suggested edit:** OLD: \"He had lined the inner rim with a rubber sleeve. He then wired a small air compressor into the chest cavity.\" NEW: \"He had lined the inner rim with a rubber sleeve and wired a small air compressor into the chest cavity.\"","head":"","tail":"","rationale":"note 071d9d9a-5c5b-4888-9053-70213e3c0db6 · priority low","draft":""},{"chapter":"3","seq":559,"type":"iz note","size":"low","title":"IZ · Cut 'He had not been sure he would ever need to.'","proposal":"**Iz said:** \"Cut\"\n\n**The passage now:** Fresh ch3: \"It had worked decently this morning as he took the robot up a few small sets of stairs from the basement to the council. But he had never taken it up a full spiral flight. He had not been sure he would ever need to.\"\n\n**What this is really asking:** She thinks the trailing sentence is dead weight before the stair-climb test.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree. 'He had prepared for this, sort of' two paragraphs up already carries the speculative-build tentativeness; this sentence restates it as a shrug and deflates the tension right before 'He pressed the command.' Ending the beat on 'a full spiral flight' leaves the doubt hanging where it should. Classic Last Step: state the fact (never a full flight) and stop.\n\n**Suggested edit:** OLD: \"But he had never taken it up a full spiral flight. He had not been sure he would ever need to.\" NEW: \"But he had never taken it up a full spiral flight.\"","head":"","tail":"","rationale":"note 70dd4fbd-413c-4d96-b42c-352649affe25 · priority low","draft":""},{"chapter":"3","seq":560,"type":"iz note","size":"low","title":"IZ · The stair-climb sentence: three 'then's before the rhythm lands","proposal":"**Iz said:** \"Then it settled into a rhythm that was almost a walk.\" — proposing a sentence break and reorder.\n\n**The passage now:** Fresh ch3: \"The prototype rocked forward, awkward like it was about to fall, but then it mounted the first step, and then the second, and then a rhythm settled into it that was almost a walk. It was climbing.\"\n\n**What this is really asking:** The long chain of 'and then… and then… and then' feels cluttered to her; she wants the rhythm-beat broken out as its own sentence, phrased conventionally ('it settled into a rhythm').\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Half agree. The long build resolving onto the flat 'It was climbing.' is exactly the house pattern — don't break the sentence, and keep 'a rhythm settled into it': the inversion (the rhythm arriving INTO the machine) is doing quiet work, better than her conventional reorder. But she's right that three 'then's is one too many. Drop the second and third; the accumulation survives, the clutter goes.\n\n**Suggested edit:** OLD: \"but then it mounted the first step, and then the second, and then a rhythm settled into it that was almost a walk.\" NEW: \"but then it mounted the first step, and the second, and a rhythm settled into it that was almost a walk.\"","head":"","tail":"","rationale":"note 9852e393-8bc5-4140-ba8e-c989d1dc57f6 · priority low","draft":""},{"chapter":"3","seq":561,"type":"iz note","size":"medium","title":"IZ · 'You really built this?' — too warm too early? (keep it; 'How long' now exists)","proposal":"**Iz said:** This is too enthusiastic and gives away her kindness. Instead have her ask how long, and let us wait to see if she's accepting or not.\n\n**The passage now:** Fresh ch3: \"Mira was five steps up, watching. / 'You really built this?' she asked quietly.. / 'Yes.' / She nodded once and kept climbing. / Then, three steps further up, without turning: / 'How long.' / 'Two years.'\"\n\n**What this is really asking:** She wants Mira unreadable here — no early tell of acceptance — and proposes replacing the question with a flat 'how long.' The instinct is protecting exactly what canon later locked: Mira as operator, not warm confidante.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** The big edit already gave her the 'How long.' beat, delivered without turning, flat, no question mark — that's the withheld-acceptance she asked for. On cutting 'You really built this?': I'd keep it. Read after ch4's reveal (she's known about the basement for over a year), it isn't wonder, it's the first time she acknowledges his secret to his face — verification, answered 'Yes,' met with a single nod and her back. That IS restraint; her verdict stays hidden until the white room. The only mandatory fix is mechanical: the doubled period 'quietly..'. If Johnny wants one more notch of cold, cutting 'quietly' does it without losing the beat.\n\n**Suggested edit:** OLD: \"'You really built this?' she asked quietly..\" NEW: \"'You really built this?' she asked quietly.\"","head":"","tail":"","rationale":"note 30f9c9ca-16f5-4f08-8780-0c0b6d26bbdc · priority medium","draft":""},{"chapter":"3","seq":562,"type":"iz note","size":"medium","title":"IZ · Red runner: 'going grey' vs 'brand new' reads as a contradiction","proposal":"**Iz said:** Confusing if it is going grey.\n\n**The passage now:** Fresh ch3: \"the floor here was carpeted, a long red runner going grey. Burgundy realized, walking down it, that the runner had hardly been walked on at all. It felt brand new.\"\n\n**What this is really asking:** How can a carpet be simultaneously going grey and brand new? She's confused by the paradox as written.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree with the symptom; the fix is concretion, not cutting. The paradox is the whole image — aged by dust, unworn by feet: the academy that never happened — and the chapter map flags this exact spot as wanting one more notch of that. 'It felt brand new' asserts the paradox instead of resolving it in the senses. Say what greys it (dust) and what stays new (the pile underfoot), and the contradiction becomes the point instead of a clang.\n\n**Suggested edit:** OLD: \"the floor here was carpeted, a long red runner going grey. Burgundy realized, walking down it, that the runner had hardly been walked on at all. It felt brand new.\" NEW: \"the floor here was carpeted, a long red runner gone grey with dust. Burgundy realized, walking down it, that the runner had hardly been walked on at all. Under the dust the pile was still stiff.\"","head":"","tail":"","rationale":"note edf8464f-1da3-460e-8faa-d8a4808d182a · priority medium","draft":""},{"chapter":"3","seq":563,"type":"iz note","size":"low","title":"IZ · 'Neither of them was this' → 'None of them was this'","proposal":"**Iz said:** \"None of them\"\n\n**The passage now:** Fresh ch3: \"Burgundy had known there was a library in the palace. There were several. The one near the entrance… The one off the council chamber… Neither of them was this.\"\n\n**What this is really asking:** Grammar/logic check: the paragraph opens on 'several' libraries, then names two, then closes on 'Neither,' which only covers the two named.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree. 'Neither' is technically grammatical for the two described, but the paragraph promised 'several,' and 'None of them was this' closes the whole set, which is the stronger claim — not even the ones he didn't bother describing come close. One word, better logic, better sweep.\n\n**Suggested edit:** OLD: \"Neither of them was this.\" NEW: \"None of them was this.\"","head":"","tail":"","rationale":"note f5023e81-d989-4fc2-9551-c17240a6ae4d · priority low","draft":""},{"chapter":"3","seq":564,"type":"iz note","size":"medium","title":"IZ · 'Stacks running into stacks' — hard to visualize","proposal":"**Iz said:** Need further description, hard to visualize.\n\n**The passage now:** Fresh ch3: \"The room was cut up into a labyrinth of bookcases and crossings, stacks running into stacks, with narrow iron walkways bridging the gaps at each level so a person could walk from one wall of books to another without ever touching the floor.\"\n\n**What this is really asking:** The chapter's centerpiece image opens on two abstract layout gestures ('bookcases and crossings,' 'stacks running into stacks') before the concrete furniture (iron walkways, brass-rail ladders, arched doors) arrives. She can't picture the vague part.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree with the symptom, and the fix is NOT more description — the paragraph already delivers plenty of concrete cargo right after. The fix is replacing the vague doubled phrase with one specific observed thing about how a labyrinth of shelves actually behaves: aisles that cross and dead-end. Naturalist precision, no added length.\n\n**Suggested edit:** OLD: \"The room was cut up into a labyrinth of bookcases and crossings, stacks running into stacks, with narrow iron walkways bridging the gaps at each level\" NEW: \"The room was cut up into a labyrinth of bookcases, aisle crossing aisle, some ending blind against a wall of shelves, with narrow iron walkways bridging the gaps at each level\"","head":"","tail":"","rationale":"note e3312b2b-2353-4183-b8ce-e501218222c7 · priority medium","draft":""},{"chapter":"3","seq":565,"type":"iz note","size":"low","title":"IZ · 'Awed by this huge space he hadn't known about' — implied, cut the telling","proposal":"**Iz said:** Implied. Could also be: 'He didn't know what was more surprising, what this was or that he hadn't known it existed.'\n\n**The passage now:** The old 'Awed by this huge space he hadn't known about' sentence is gone from the fresh text. The beat now reads: \"Tens of thousands of books rose around him, more than he could take in at a glance; on the shelf to his left… half of them were in languages he had never been taught. / He stopped.\"\n\n**What this is really asking:** She's flagging a tell — the narration announcing awe the imagery already delivers — and offering a wittier replacement line.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Her instinct ('implied') was exactly right, and the big edit took the stronger of her two options: it cut the telling entirely. 'He stopped.' after the books-and-languages sentence is the correct move — flat action, reader supplies the awe. Her alternative line ('he didn't know what was more surprising…') would reintroduce narrated surprise; don't add it.","head":"","tail":"","rationale":"note 3cf8bc81-4b19-4c49-bc7c-0e80b72a8c37 · priority low","draft":""},{"chapter":"3","seq":566,"type":"iz note","size":"low","title":"IZ · 'The books on the shelf' → 'the books on this shelf'","proposal":"**Iz said:** \"This\"\n\n**The passage now:** Fresh ch3: \"At the top of the ladder Mira walked along the gallery to a specific shelf and stopped in front of it. / The books on the shelf were mostly grey and brown.\"\n\n**What this is really asking:** Deixis: Mira just stopped at one specific shelf, so 'this shelf' anchors the camera where she's standing; 'the shelf' is a half-step more distant.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree, mildly. 'This shelf' keeps us at Burgundy's shoulder looking where Mira stopped, and avoids the flat repetition of 'a specific shelf… the shelf.' A one-word close-third tightening.\n\n**Suggested edit:** OLD: \"The books on the shelf were mostly grey and brown.\" NEW: \"The books on this shelf were mostly grey and brown.\"","head":"","tail":"","rationale":"note cd4387f0-1150-4d47-833f-bead995bdc40 · priority low","draft":""},{"chapter":"3","seq":567,"type":"iz note","size":"medium","title":"IZ · The bookcase swings 'silently, like a great door on very old bearings'","proposal":"**Iz said:** Slowly. A door on old bearings wouldn't be silent.\n\n**The passage now:** Fresh ch3, the pre-button beat: \"…the whole bookcase shifted on some hidden hinge and began to swing inward, silently, like a great door on very old bearings. / Behind the bookcase was another room.\"\n\n**What this is really asking:** A physics check: 'silently' and 'very old bearings' fight each other. She proposes swapping silently for slowly.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree, and the deeper problem is the simile itself: the bookcase IS a great hidden door, so comparing it to one is circular — no cargo — while smuggling in the contradiction she caught. Her 'slowly' fixes the ear e would do with you, I cannot tell you, because I don't know… It frightens me. Now you've heard me say so, and you will not hear me say it again.\"\n\n**What this is really asking:** She was answering a visible TODO in the draft, proposing content for the how-bad-it-gets beat: paint the King's wrath as realm-wide.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** The placeholder was executed, and better than her proposal. The fresh passage prices the danger in specifics — the sealed wing, the ship that would not make port, and the unknown for Burgundy, which is the scariest item precisely because Mira won't guess at it. Her 'wrath and vengefulness touching all corners of his realm' would also fight locked King canon: he is presumptuous, never temperamental; his cruelty arrives as pedagogy and quiet disposal, not wrath. Generalizing the threat would shrink it. Do not add.","head":"","tail":"","rationale":"note dd3f9864-cfc3-462f-ad54-ccd51892f339 · priority low","draft":""},{"chapter":"4","seq":578,"type":"your note","size":"low","title":"YOU · Cut eastern-hills workshop line","proposal":"**Your note:** On 'He had built the workshop in the eastern hills, the one Mira did not yet know about...' — \"Cut\"\n\n**The passage now:** Not in fresh text. No eastern-hills workshop exists anywhere in the manuscript (the only 'eastern hills' is copper/tin in ch10's minerals lesson).\n\n**What this is really asking:** A continuity orphan — a workshop that contradicts the basement/white-room geography had to go.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Cut executed; the contradiction is gone from the book.","head":"","tail":"","rationale":"note 2266071f-174d-4f70-8fae-8be7b0752af7 · priority low","draft":""},{"chapter":"4","seq":579,"type":"your note","size":"low","title":"YOU · Cut tribute-hangar light comparison","proposal":"**Your note:** On 'a clean cold light Burgundy had only seen once before. Ch5 plants the gun explicitly: 'a boy could live an entire Freeze inside it and never once feel the cold on his skin. Burgundy hated this.' But on the first wall-crossing the cold stays scenery — packed snow, ice teeth on the wires, Tuck rubbing his hands — and never lands on Burgundy's body. At Ran's the stove is set dressing: 'A fire burned in an iron stove in the corner. On top of it a pot ticked and steamed... An old white dog had come in from the doorway and lay against the warm iron, legs fully extended.' No relief beat.\n\n**What this is really asking:** She's asking the text to cash a planted gun: this walk is the first cold of his life (the sealed palace made sure of it), so the cold should bite him on the way down and the stove warmth should land as physical relief. A payoff between plant and body, not added explanation.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree fully — this is the best note in the batch. Ch5 loads the gun in so many words and the fresh text never fires it; the sealed-palace detail currently pays off nothing. The fix is two small concrete beats, not commentary: the cold reaching his skin during the ch6 descent (stated flat, no gloss — the reader has the plant), and a body-level relief at Ran's stove, using gesture rather than named feeling. Her instinct to put the payoff at the pot moment is exactly right; the dog against the warm iron is already half the image.\n\n**Suggested edit:** TWO insertions. (1) Ch6, after the verbatim anchor 'The clean stone gave way to packed snow and then to a road of frozen mud.' insert: 'The cold worked in through the borrowed coat before the palace gate was out of sight, into his ears, into his teeth. The first cold of his life. He pulled the cap lower and kept up.' (2) Ch7, after the verbatim anchor 'An old white dog had come in from the doorway and lay against the warm iron, legs fully extended.' insert: 'The heat of the stove reached Burgundy at the door, and his shoulders came down from around his ears. He had not known they were up there.'","head":"","tail":"","rationale":"note 9f7a9083-06c7-4812-8838-abd4f1146ec1 · priority medium","draft":""},{"chapter":"9","seq":596,"type":"iz note","size":"medium","title":"IZ · Ch9 callback to the fifteen-year-old night — reader can't place it","proposal":"**Iz said:** Not remembering this\n\n**The passage now:** Fresh ch9 (The Claw), the all-night drawing: 'The pencil moved all night to keep up his blossoming visions, and he had a feeling he had not felt since he was fifteen on the far side of the wall with Tuck, which was the feeling of being about to build something that had never existed before.'\n\n**What this is really asking:** The callback claims a memory the reader can't retrieve. 'The far side of the wall with Tuck' is a whole two-chapter trip, and no moment in it was ever named as 'about to build something that had never existed' — the trip's remembered feelings are the market, the epiphany, and the bundle of parts. Possibly compounded by the old draft's mis-dated age ('thirteen,' since corrected to fifteen), which would have made the memory literally unplaceable.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Partially agree. The referent genuinely exists — ch7 ends on him carrying Ran's bundle up through the freeze, mind expanding — so the callback isn't false, it's just aimed at a region instead of an image. Her symptom is right; her implied fix (explain more) is wrong. The repair is to anchor the callback to the one concrete object the reader definitely holds from that night: the bundle of parts. Do NOT soften or relocate the osmarine material around it — the blurt is load-bearing for ch14-15 — this is purely the callback sentence.\n\n**Suggested edit:** OLD: 'and he had a feeling he had not felt since he was fifteen on the far side of the wall with Tuck, which was the feeling of being about to build something that had never existed before.' NEW: 'and he had a feeling he had not felt since he was fifteen, climbing home through the freeze with Ran's bundle of parts against his chest: the feeling of being about to build something that had never existed before.'","head":"","tail":"","rationale":"note 5a865f48-2d88-4b8d-825e-ab17c44298cc · priority medium","draft":""},{"chapter":"10","seq":597,"type":"iz note","size":"high","title":"IZ · 'Keeping things small' paragraph: praise, but she quoted the dirty duplicate","proposal":"**Iz said:** \"I like this paragraph\" on: \"His father's world ran on keeping things small: men fed but never full... every warm room he had ever stood in paid for by a cold one below.\"\n\n**The passage now:** The paragraph exists TWICE, live, near the statue-speech close of ch10. First copy: 'working shoulder to shoulder in the mines but never allowed to gather', clean capitalization, preceded by the epiphany paragraph ending '...settled in now, low and permanent.' Second copy (the one her lowercase-'every' quote matches): 'working together in the mines but not allowed to gather', preceded by the twin epiphany paragraph that ends '...lodged now, low and permanent, like a stone swallowed', which is Johnny's named false-usefulness example, a locked style violation.\n\n**What this is really asking:** Pure endorsement, protect this paragraph. But locating her quote exposes the unresolved duplication: the copy she highlighted is the residue twin whose companion sentence carries the banned 'like a stone swallowed.'\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree the paragraph is one of the chapter's best, small exact objects carrying the system (fed but never full, warm room over cold room), and it must survive any cleanup. The action item is collapsing the duplicate: keep the first, cleaner pair; delete the second pair, which both repeats the beat verbatim and smuggles the 'stone swallowed' violation back in.\n\n**Suggested edit:** DELETE both paragraphs of the second copy: (1) \"Standing at the foot of Bill's take:** Agree on the symptom, with a scope limit. The Custom House scene that follows IS the 'more' she's asking for, the craft dramatized at full length, so expanding this paragraph into scene would double the chapter's job. But the paragraph itself is both broken and vague where it should be specific: 'gossip on every advisor' is a category, not a lesson. The fix is naturalist precision inside the summary, one or two concrete named lessons, then let the scene deliver the rest. Bonus: 'no one would teach you honestly' sets up the King's ch11 line 'Nobody will teach it to you honestly but me', keep that echo.\n\n**Suggested edit:** OLD: \"Any hour he had his son beside him and a quiet minute to fill, he filled it with the *craft*. How to tell if a governor is lying or gossip on every advisor at council disguised as *this is stuff you gotta know *and *the parts of ruling he said no one would teach you honestly*.\" NEW: \"Any hour he had his son beside him and a quiet minute to fill, he filled it with the *craft*. How to tell if a governor is lying. Which advisor owed which minister money, and what the debt was worth at a vote. He called it *stuff you gotta know*, the parts of ruling no one would teach him honestly.\"","head":"","tail":"","rationale":"note f3767c6e-be45-49a8-8559-924920c80d58 · priority medium","draft":""},{"chapter":"10","seq":599,"type":"iz note","size":"low","title":"IZ · Osmarine marble: 'hanging' vs 'hovering'","proposal":"**Iz said:** On the marble 'not resting on the bottom but hanging' in the jar: \"Hovering?\"\n\n**The passage now:** Live in ch10: \"A single cylinder, and inside it, not resting on the bottom but hanging in the middle of the glass, one ivory colored marble, much smaller than the others.  turning very slowly on nothing.\"\n\n**What this is really asking:** A word-choice suggestion: 'hovering' is the expected term for a floating object, and she's offering it as the clearer verb.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Disagree. 'Hanging' is the better word precisely because it is the plain, wrong-seeming one. 'Hovering' imports the sci-fi category and announces the anomaly; 'hanging in the middle of the glass' states an impossible fact in ordinary physical language and lets the strangeness arrive on its own, which is the house method (compare the style doc's target image: 'a cask of it strained upward against its lashings'). This is Burgundy's world describing itself, not a genre label. Keep 'hanging.' The sentence does need mechanical cleanup, the orphaned fragment after the period.\n\n**Suggested edit:** Keep 'hanging.' Mechanical fix only. OLD: \"one ivory colored marble, much smaller than the others.  turning very slowly on nothing.\" NEW: \"one ivory colored marble, much smaller than the others, turning very slowly on nothing.\"","head":"","tail":"","rationale":"note c6842ab7-db6a-4e03-aa4e-a4686facd0b2 · priority low","draft":""},{"chapter":"11","seq":600,"type":"iz note","size":"low","title":"IZ · 'Slow grinding attrition': beautiful, but should we learn it sooner?","proposal":"**Iz said:** On \"Millions of people lived on Dross in conditions that anyone looking honestly would describe as slow grinding attrition\": \"Beautiful, let's also learn this sooner.\"\n\n**The passage now:** Live in ch11 (Festivals), sitting directly between the festival-ledger scene and the King's 'a man who has something to look forward to does not burn down what he has.' That placement is the sentence's whole power: honest description butted against the machinery that manages it.\n\n**What this is really asking:** She trusts the line and wants the reader to grasp the scale of the misery earlier in the book, i.e., front-load the poverty.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Disagree, and this one is locked by canon. Johnny's ruling: Burgundy doesn't know how bad it is until he's in with the resistance, no lukewarm middle; the market chapter stays WARM because his ignorance is the point, and the full detonation is staged (ch12 Preserve, then the ch21-22 return). The book is close-third on Burgundy, so the reader is meant to learn at his speed, and 'anyone looking honestly' is exactly the look he has only just acquired via two years of council. Moving this understanding earlier would flatten the staircase the whole first act is built on. The compliment is the actionable part: protect the sentence and its placement.","head":"","tail":"","rationale":"note 5eb61725-1ca8-4586-aa5d-1948791bed2b · priority low","draft":""},{"chapter":"12","seq":601,"type":"iz note","size":"low","title":"IZ · 'Details on pacification', the big edit already delivered them","proposal":"**Iz said:** On an old line ending \"...where that road ends. I have been the man who had to walk it back\": \"Details on pacification.\"\n\n**The passage now:** The quoted line no longer exists anywhere in the fresh text ('walk it back' and 'road ends' both zero hits). Its job is now done, at ten times the length, by the rebuilt Preserve chapter: Oz's full surveillance monologue (garrisons, checkpoints, paid listeners, 'Cheapest soldier I have, prince, is the one inside every man's head'), the King's groups-and-strikes speech ('There were strikes, before you were born... What it nearly cost us'), and the public-descent story with the name-in-the-book rule.\n\n**What this is really asking:** She wanted the pacification machinery made concrete instead of gestured at, exactly the right instinct against the old draft.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Agree with the note, and the big edit granted it in full. The fresh ch12 renders pacification as mechanism, scene by scene: grain-lure paralleled to festivals, the informant economy, the hole, the winch-and-lamp theater. Nothing further needed; if anything the chapter now risks the opposite problem and should not take on more detail here.","head":"","tail":"","rationale":"note ea07734e-c7ea-4c17-864a-2ac6ef1b4a62 · priority low","draft":""},{"chapter":"12","seq":602,"type":"iz note","size":"medium","title":"IZ · 'It was maintained': wants a lot more color on maintained poverty","proposal":"**Iz said:** On \"It was maintained. The planet was held down and worked around the clock so the payment would go up on schedule forever...\": \"Need a lot more color on the poverty and how it is maintained.\"\n\n**The passage now:** Live, the epiphany paragraph after the hunt: grain at dawn / festivals / listeners / groups, ending '...and so, in a coat he had never chosen, was he.' It compresses into interiority the mechanisms the preceding ten pages just dramatized.\n\n**What this is really asking:** She wants the maintenance of poverty shown in richer concrete detail, not just named in the summary paragraph.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Mostly disagree, because the color she's asking for is deliberately staged elsewhere. Within ch12 the mechanisms ARE the scenes: the grain-lure, Oz's informant lecture, the public descent, the threshold stone worn smooth. This paragraph is the earned engineering realization (protected interiority), and it works because it compresses what was just shown rather than introducing new claims. The street-level color of HOW poverty is maintained is canon-assigned to the resistance arc, where it detonates (ch21-22: Skorn's tally-book matching the palace ledger, Halda's ledger-leash, 'first the sheds, now this'), per Johnny's no-lukewarm-middle ruling. Front-loading it here would blunt that detonation. One concession to her instinct: when ch22's Hollow material is finalized, verify the then/now contrast actually cashes this paragraph's promissory note; if the Hollow monologues get trimmed, her note is the argument for keeping their concrete inventory beats.","head":"","tail":"","rationale":"note 53093fdc-65e0-46fa-8d31-7381c0b2b82a · priority medium","draft":""},{"chapter":"13","seq":603,"type":"iz note","size":"medium","title":"IZ · 'Understanding expanding too quickly to process' needs color","proposal":"**Iz said:** On \"that his understanding of his mother was expanding too quickly to process\": \"Give this more color.\"\n\n**The passage now:** Live in ch13 (The Library), after Mira's 'It's not just an issue between your father and me, it's between his family and mine': \"Burgundy looked at her and felt the sensation he had felt the day she showed him her wing, that his understanding of his mother was expanding too quickly to process.\"\n\n**What this is really asking:** The sentence is trying to render the vertigo of Mira unmasking as an operator, and she can feel it's underpowered, abstract processing-language where the chapter's biggest interior beat should land.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree, symptom exactly right, and her word 'color' points the correct direction as long as color means a concrete object, not more explanation. 'Expanding too quickly to process' is a half-formed abstraction that fails the Cargo Test. The scene itself hands us the object: the day she showed him her wing, a shelf of books swung inward and turned out to be a door into hidden rooms. That image IS the feeling, his mother is doing it again, in person. (Note: he first saw that bookcase the same day it opened, ch3 is his first time in the wing, so the image can't claim he'd walked past it for years.) Anchor the sensation to the swinging case and stop.\n\n**Suggested edit:** OLD: \"Burgundy looked at her and felt the sensation he had felt the day she showed him her wing, that his understanding of his mother was expanding too quickly to process.\" NEW: \"Burgundy looked at her and felt what he had felt the day the bookcase swung open, a wall of books turning out to be a door.\"","head":"","tail":"","rationale":"note 4010a64e-56fd-4fb8-b858-0a57525ee220 · priority medium","draft":""},{"chapter":"14","seq":604,"type":"iz note","size":"high","title":"IZ · Osmarine comprehension gap: from 'opposite of weight' to 'returns your push'","proposal":"**Iz said:** \"Not sure I understand osmarine well enough to follow.\"\n\n**The passage now:** Live: the survey-paper blockquote ('inverse reactive displacement under load... proportional forward impulse') followed by Burgundy's decoding: 'Osmarine pushed the wrong way. Everyone knew that... The harder the rock shoves the machine backward, the harder the osmarine presses it forward into the face.' Ch10 established osmarine only as 'other matter has weight, Osmarine has the opposite of weight' plus the hanging marble.\n\n**What this is really asking:** A trusted-reader comprehension flag on the book's most load-bearing physics. The deliberate jargon of the paper is fine (the text says it 'almost made no sense', and Burgundy decodes it for us), but there's a real conceptual gap: ch10 taught anti-WEIGHT (it floats), and ch14 needs anti-REACTION (push it and it pushes back toward you). A reader can't bridge floats-upward to braces-forward on her own.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree, and this matters beyond ch14, osmarine physics underwrites ch15-17 (the cores, the digging triumph) and the whole climax, so the reader must own it here. The fix is one concrete demonstration sentence in the decoding paragraph, in the everyone-knows register, not more exposition: a hand-scale image of osmarine answering force with opposite force. That single beat converts the paper's jargon into something the reader has already held, and the existing rock-shoves/osmarine-presses sentence then lands as arithmetic instead of assertion.\n\n**Suggested edit:** OLD: \"Osmarine pushed the wrong way. Everyone knew that; it was the whole point of the stuff. But he had only ever thought of it as the thing that made ships light, the thing that kept doors in space open to allow travel between systems.\" NEW: \"Osmarine pushed the wrong way. Everyone knew that; it was the whole point of the stuff. Shove a cask of it and the cask pressed back into your hands. But he had only ever thought of it as the thing that made ships light, the thing that kept doors in space open to allow travel between systems.\"","head":"","tail":"","rationale":"note 77592111-1d57-4028-be6d-5db148954067 · priority high","draft":""},{"chapter":"14","seq":605,"type":"iz note","size":"medium","title":"IZ · 'Rooms he could not explain', endorsed beat buried in the roughest prose","proposal":"**Iz said:** On \"[corridors that led to rooms] he could not explain\": \"This\" (bare pointer, her shorthand for a beat that lands).\n\n**The passage now:** Live in ch14 (Osmarine), the sealed-door discovery: the grey-stone Ghai chamber, bottomless arm-width holes breathing warm air, the circle-within-circle mark. But the passage is the dirtiest prose in the range: 'on the floos circular holes', 'He could a breath of warm air', 'He hard studied in the school that the Ghai has used heat.'\n\n**What this is really asking:** Endorsement of the mystery-chamber beat, the unexplained rooms are doing exactly the withheld-worldbuilding work she responds to (and they're load-bearing: they plant the Hollow and the ch20 tunnels payoff).\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree with the endorsement, and the actionable consequence is that a favorite, load-bearing beat deserves clean mechanics. The content should not change at all, 'rooms he could not explain' with no explanation is the correct restraint (the reader will get the answer in ch20). Fix only the debris so the spell isn't broken mid-sentence.\n\n**Suggested edit:** OLD: \"One was a huge chamber walled in a smooth grey stone that was not the palace's. on the floos circular holes, the width of his arm. He walked over one and shined his lantern down and could not see the bottom. He could a breath of warm air coming out of the hole, where everything else held the cold of deep rock.\" NEW: \"One was a huge chamber walled in a smooth grey stone that was not the palace's. In the floor, circular holes, the width of his arm. He walked to one and shined his lantern down and could not see the bottom. A breath of warm air came up out of the hole, where everything else held the cold of deep rock.\" ALSO, next paragraph, OLD: \"He hard studied in the school that the Ghai has used heat from the planet to fuel their society.\" NEW: \"He had studied in school that the Ghai had used heat from the planet to fuel their society.\"","head":"","tail":"","rationale":"note 71a3cd7c-0b85-4115-b780-327b3cb45e79 · priority medium","draft":""},{"chapter":"14","seq":606,"type":"iz note","size":"low","title":"IZ · Dramatize a disc arrival as a scene?","proposal":"**Iz said:** On \"the way most of his answers came: off a disc, three weeks later\": \"Maybe describe one of these arrivals like a scene?\"\n\n**The passage now:** Her exact wording survives only in a struck-through twin; the live paragraph reads \"off a disc, two weeks later, in a paper he almost skipped\" and runs straight into the osmarine revelation. Arrival texture already exists in ch9 (the list folded into his mother's breakfast book, the crate arriving labeled in formal Core dialect), and the very next chapter, ch15, dramatizes the arrival machinery at full chapter scale: the second cargo field, the freight ship, Mira correcting the cask count.\n\n**What this is really asking:** A scene-vs-summary instinct: the discs are the book's knowledge-freight system, and she wants to watch it work once instead of only hearing it summarized.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Right instinct, wrong location, and the book already grants the wish. Dramatize what matters, summarize what connects: here the thing that matters is the READING, and the text scenes it ('He read the passage four times', then the journal passage verbatim, then his decoding). A crate-arrival mini-scene at this point would add logistics without meaning and delay the chapter's turn, and it would double ch15, which exists precisely to show a shipment as a full scene the moment the arrivals become dramatically load-bearing (osmarine). Ch9's breakfast-book ritual covers the small-scale version. No change.","head":"","tail":"","rationale":"note f2b75681-7478-4ba6-b31a-ebfc3263fc0e · priority low","draft":""},{"chapter":"14","seq":607,"type":"your note","size":"low","title":"YOU · Clarify ground cutting-head line","proposal":"**Your note:** On 'a cutting head he had ground himself from offworld tool-stock' — \"Clarify\"\n\n**The passage now:** The sentence is gone; the build montage was rewritten. The toolset is now concrete at line 1822: \"a stub drill, a chisel point, a hammer face, a scaling claw, each one swappable, each one instrumented.\"\n\n**What this is really asking:** The old phrase was confusing (ground what? from what?); he wanted it comprehensible.\n\n**Status:** MOOT — the text it targeted is gone\n\n**Bill's take:** The confusing sentence died in the rewrite and its replacement is naturalist-precise. Concern resolved by deletion.","head":"","tail":"","rationale":"note b6787f39-b4e4-4d13-b12a-20ec85581016 · priority low","draft":""},{"chapter":"14","seq":608,"type":"your note","size":"low","title":"YOU · Feedback 'architecture' is code","proposal":"**Your note:** On 'rebuilt the feedback architecture' — \"Clarify this is code\"\n\n**The passage now:** Line 1818: \"He had coded the whole thing, especially the feedback system based on what the discs taught him.\"\n\n**What this is really asking:** A lay reader shouldn't mistake 'architecture' for physical structure.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Done — 'coded' now leads the sentence.","head":"","tail":"","rationale":"note c4d80c70-ab76-4170-bec9-0456fedf378b · priority low","draft":""},{"chapter":"14","seq":609,"type":"your note","size":"low","title":"YOU · 'Mining is a delicate art' insertion","proposal":"**Your note:** \"Mining is a delicate art. Sometimes dril sometime pick sometimes chisel. To get the best without wasting\"\n\n**The passage now:** Line 1820: '\"Mining is a delicate art. Drill, pick, or chisel, each to its moment, the whole skill of it being to take the ore clean and waste nothing,\" said one of the old books he read off his screen.'\n\n**What this is really asking:** Plant the craft-doctrine of mining as the design brief for the arms.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Executed elegantly — rendered as a diegetic quote from an old book, which keeps the narration from lecturing and motivates the swappable-tool design in the next line.","head":"","tail":"","rationale":"note 52ddc154-e075-4787-bc0b-e4b74f01c177 · priority low","draft":""},{"chapter":"14","seq":610,"type":"your note","size":"low","title":"YOU · Cut 'It was not built' fragment","proposal":"**Your note:** On 'second month. It was not built...' — \"Cut\"\n\n**The passage now:** 'Second month' and the fragment no longer exist; the montage timeline was rebuilt (five weeks of arms work, etc.).\n\n**What this is really asking:** Kill a broken/negation-y construction.\n\n**Status:** MOOT — the text it targeted is gone\n\n**Bill's take:** The host text is gone; concern died with it.","head":"","tail":"","rationale":"note edb2a85c-c93a-43be-8304-16c5fe3183a3 · priority low","draft":""},{"chapter":"14","seq":611,"type":"your note","size":"low","title":"YOU · Riches that became valuable since","proposal":"**Your note:** On 'still unmined riches here' — \"Stuff that has become valuable since.\"\n\n**The passage now:** Line 1846-1850: \"There was still unmined riches here... A mineral that probably wasn't valuable when this was an active dungeon. It was, he understood, a small fortune sitting inside the palace's own foundations.\"\n\n**What this is really asking:** Explain WHY riches sit unmined under a palace: corvite wasn't worth taking when the dungeon was dug.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** The logic is in. Residual grammar bug in the anchor sentence worth fixing while nearby.\n\n**Suggested edit:** OLD: \"There was still unmined riches here.\" NEW: \"There were still unmined riches here.\"","head":"","tail":"","rationale":"note f97502ea-f54e-4876-8611-8ee46e02832e · priority low","draft":""},{"chapter":"14","seq":612,"type":"your note","size":"low","title":"YOU · 'Thick as' the seam","proposal":"**Your note:** On 'A seam of it, thick at th[e]...' — \"As\"\n\n**The passage now:** Line 1850: \"A seam of it, thick as a room.\"\n\n**What this is really asking:** Typo fix plus a concrete size comparison.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Done; 'thick as a room' passes the Cargo Test.","head":"","tail":"","rationale":"note 47e67010-2917-4094-9fd4-8ed47ecc3ea7 · priority low","draft":""},{"chapter":"14","seq":613,"type":"your note","size":"low","title":"YOU · Galleries → dungeons","proposal":"**Your note:** On 'went down through the old galleries' — \"Dungeons\"\n\n**The passage now:** Line 1854: \"Burgundy went down through the previously sealed door, into the old dungeons\"; the whole section now runs on dungeon/prison-cell vocabulary (1832, 1834, 1844).\n\n**What this is really asking:** 'Gallery' is mining jargon that blurred the image; he wanted the prison identity of the space.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Done consistently in ch14. Note 'gallery' correctly survives where it means a mine gallery (ch19's shatter off \"the gallery walls\" at 2353 is arguably fine but could join the sweep if Johnny wants total consistency).","head":"","tail":"","rationale":"note ae450624-69be-4800-9595-0d0577454e0f · priority low","draft":""},{"chapter":"14","seq":614,"type":"your note","size":"low","title":"YOU · 'One every 90 days' rate — 'it would be years'","proposal":"**Your note:** Two adjacent notes on 'perhaps one every 90 days': one empty highlight, one saying \"It would be years\"\n\n**The passage now:** '90 days' appears nowhere in the fresh text. The whole old progress-rate estimate was cut; the chapter's problem is now the physics wall (they cannot dig at all), and the improvement-rate question moved to ch19's closed-loop arc.\n\n**What this is really asking:** The old math undersold how slow hand-tuned progress was; he wanted the number honest.\n\n**Status:** MOOT — the text it targeted is gone\n\n**Bill's take:** The beat was cut, and rightly: 'machines that cannot dig' is a harder wall than 'machines improving slowly,' and the improvement-rate story now detonates properly in ch19-20. The concern died with the text.","head":"","tail":"","rationale":"note 6289e7ab-c6f4-4912-89ac-2feee4348341, 4448ecb4-997c-48ab-9429-06d129f79f9e · priority low","draft":""},{"chapter":"14","seq":615,"type":"your note","size":"low","title":"YOU · Machines rate themselves and self-improve","proposal":"**Your note:** On 'feedback code let each machine tune...' — \"Rate itself and even automatically make small improvements\"\n\n**The passage now:** The old sentence is gone from ch14. Self-scoring and self-improvement are now the entire ch19-20 engine: \"each machine scoring itself and passing what it learned sideways\" (2363) and \"It improved the improving\" (2448).\n\n**What this is really asking:** He wanted the self-improvement capability on the page.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Addressed by relocation, and the relocation is structurally correct: if ch14's machines already self-improved, ch19's breakthrough (and ch11/ch17's he-is-the-ceiling problem) would collapse. Right idea, now in the only chapter that can hold it.","head":"","tail":"","rationale":"note 394eebd2-d80f-4518-b7b9-3a3e912317b2 · priority low","draft":""},{"chapter":"14","seq":616,"type":"your note","size":"low","title":"YOU · 'Gallery' → his prison lab","proposal":"**Your note:** On 'on the cold floor of the gallery' — \"His prison lab\"\n\n**The passage now:** The old phrase is gone; the space is now \"dungeon-turned-lab\" (2333), \"cell-turned-lab\" (2423), and ch21 exits \"through prison cells where the logs still streamed\" (2695).\n\n**What this is really asking:** Name the workspace by its prison identity — the resonance (a prince building freedom machines in a dungeon) is the point.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Done throughout. The prison-lab identity is now one of the book's quiet best images.","head":"","tail":"","rationale":"note c55f62d4-b437-4974-9146-641744664b0d · priority low","draft":""},{"chapter":"15","seq":617,"type":"iz note","size":"low","title":"IZ · The ramp woman has no face","proposal":"**Iz said:** Describe her features (anchored on 'Was this Ressa, his mother's cousin?')\n\n**The passage now:** Fresh ch15, second cargo field: 'Burgundy and Mira approached the ramp just as a woman was walking down it out of the ship to meet them. She was carrying a clipboard under her  arm.  Was this Ressa, his mother's cousin?' The woman turns out to be one of Ressa's people; Ressa 'ran the trade without attending it.'\n\n**What this is really asking:** Iz wants a physical picture of the person Burgundy is wondering about. The woman speaks, glances at him twice, and carries a whole beat ('Is this—' / 'Yes') with zero physical presence, so the 'Was this Ressa?' question has nothing to hang on.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Half right. Do NOT describe Ressa — her absence is the point of this beat, and Ressa-in-person is banked for ch28 (the cartel terms scene); spending her face here dulls that card. But the ramp woman deserves one concrete stroke: she is a speaking character and Burgundy reads people like equipment. One operator-tell detail es with the mining vocabulary on the same pages.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** She's right, and the chapter map predicted it: ch17 confusion notes are 'likely RIGHT as symptom; fix = concrete clarity, never added explanation.' The new information in this sentence is the broken feedback path — the score exists but never travels back into behavior. Say that with objects (score, log, swing), drop the ambiguous 'grade,' and let the existing forty-strikes scene and the 'his read of the log, his rewrite, his upload' line carry the rest. This is the comprehension gate for the book's biggest invention arc; it has to parse on first read.\n\n**Suggested edit:** Replace: 'But the data wasn't coming back to improve the code. They could grade their own work and could not learn from the grade, could not do more than the few blunt adjustments he had written in by hand.' With: 'But the score never traveled. It went into the log and sat there, and the machine that had marked its own swing a failure took the same swing in the morning, exactly, to the degree.'","head":"","tail":"","rationale":"note fff1bd5f-d152-4284-96f5-2b8b0467f421 · priority high","draft":""},{"chapter":"17","seq":620,"type":"iz note","size":"medium","title":"IZ · 'Finest thing he had ever made' vs 'heard'","proposal":"**Iz said:** Heard (one-word substitution for 'made')\n\n**The passage now:** Fresh ch17, the triumph beat: 'He sat down on the cold floor where he had watched it lose so many times, and listened to the drill go on into the rock, and for one long breath it was the finest thing he had ever made.'\n\n**What this is really asking:** Iz wants the sentence to resolve on the sense actually in play. The spine of the sentence is 'listened'; 'made' forces 'it' to reach back past the sound to the machine.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree — this is a genuinely good line-edit, not just a preference. With 'heard,' the referent is clean (the sound he is listening to), the triumph arrives through the working sense, and the reader takes the last step themselves: a drill sound is the finest thing he ever heard BECAUSE he made it. 'Made' announces the maker's claim; 'heard' earns it. The chapter map lists 'the finest thing he had ever made' as load-bearing, but the load is the one-breath triumph, and it lands harder Iz's way. Rare case where the reader's one-word fix passes every style test.\n\n**Suggested edit:** Replace: 'and for one long breath it was the finest thing he had ever made.' With: 'and for one long breath it was the finest thing he had ever heard.'","head":"","tail":"","rationale":"note d42b60e4-8fb8-4fcb-9207-e619d22c6fc5 · priority medium","draft":""},{"chapter":"18","seq":621,"type":"iz note","size":"low","title":"IZ · 'The carpet took his boots to the ankle' misparsers","proposal":"**Iz said:** Confusing\n\n**The passage now:** Fresh ch18 opening of the lounge: 'The carpet took his boots to the ankle. The cushions heaped in the chairs were velvet, deep red, stitched in a fine close hand he knew...' — the sentence right before the Essa's-hand detonation.\n\n**What this is really asking:** Iz stumbled on 'took': on first read the carpet appears to be taking (removing) his boots. The image is pile so deep his boots sink to the ankle, but the compression sends the reader down the wrong parse and interrupts the run-up to the chapter's best beat.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree. The image is good — obscene luxury measured in boot-depth, exactly the right first fact about the inner sanctum — but a sentence that has to be read twice right before the Essa reveal costs more than its compression buys. Plain declarative fixes it with zero cargo lost.\n\n**Suggested edit:** Replace: 'The carpet took his boots to the ankle.' With: 'His boots sank to the ankle in the carpet.'","head":"","tail":"","rationale":"note d9623872-50f0-43f2-a4ee-ce3364b042e0 · priority low","draft":""},{"chapter":"18","seq":622,"type":"iz note","size":"medium","title":"IZ · The King's osmarine line needs teeth","proposal":"**Iz said:** Stronger (anchored on 'I don't know what for, and')\n\n**The passage now:** Fresh ch18, the 'find me the buyer' beat: '\"Someone is buying loose osmarine off a Kettletown scrap man,\" he said. \"I don't know who, and I don't know what for, and I dislike both of those. Find me the buyer.\"' The buyer is Burgundy, standing in the room.\n\n**What this is really asking:** Iz feels the line go slack at its most dangerous moment. The triple-and run is limp, and 'I dislike both of those' has the King editorializing his own feelings — off-register for the locked canon King, who is presumptuous, never alarmed, and states conclusions as settled fact.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree, and the chapter map independently flags this exact beat ('King's reaction to the osmarine news could sharpen'). The fix is the House Style move: the period as dramatic instrument. Two flat not-knowings, then the command. Cutting 'I dislike both of those' makes him colder, not weaker — a man who does not explain why not-knowing is intolerable, because the command already says it. And with less cushioning, the dramatic irony presses harder on Burgundy.\n\n**Suggested edit:** Replace: '\"I don't know who, and I don't know what for, and I dislike both of those. Find me the buyer.\"' With: '\"I don't know who. I don't know what for. Find me the buyer.\"'","head":"","tail":"","rationale":"note 69d8a1a2-b9f8-4433-8f6e-8fe6405dca36 · priority medium","draft":""},{"chapter":"19","seq":623,"type":"iz note","size":"high","title":"IZ · Dedupe the clean-labs riff so ch19's realization lands as realization","proposal":"**Iz said:** You said this earlier so cut the other so we believe he just realized it\n\n**The passage now:** Ch19 line 2339: \"These researchers had proved all this only in clean labs, on simple rigs, in air scrubbed of the dust and heat and the physics that made his machines choke.\" Ch17 lines 2213-2215 already said it almost verbatim: \"Three labs in the core worlds had been circling this exact problem for years... from inside clean labs, on simple rigs, in air scrubbed of dust and heat.\"\n\n**What this is really asking:** She caught a real cross-chapter duplication: the clean-labs/blind-researchers material appears in ch17 and again in ch19 in nearly identical words, which deflates ch19's \"somewhere in the reading he had understood something\" into a rerun.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree the duplication must die, but I would keep ch17's version rather than cut it: it makes ch17's wall feel absolute (even the core worlds are stuck). Ch19's genuinely NEW cargo is different: the labs have now begun succeeding, and their blindness to real rock is his advantage. So the fix is to strip ch19's verbatim echo of the lab-conditions phrasing and keep only the new insight. Then the realization reads as realization, which is what Iz wants.\n\n**Suggested edit:** In ch19, OLD: \"And somewhere in the reading he had understood something: These researchers had proved all this only in clean labs, on simple rigs, in air scrubbed of the dust and heat and the physics that made his machines choke.\" NEW: \"And somewhere in the reading he had understood something: all of it had been proved on rigs that had never met the dust, the heat, the physics that made his machines choke.\" Leave ch17's passage untouched.","head":"","tail":"","rationale":"note 0e3df3a1-4dc1-40c2-8c67-df63a4d18389 · priority high","draft":""},{"chapter":"19","seq":624,"type":"iz note","size":"medium","title":"IZ · Cut the restated learning-wall; ch17's button already carries it","proposal":"**Iz said:** You've said this a lot, maybe describe differently like more about his frustration and determination\n\n**The passage now:** Ch19 opening (line 2333): \"So before the clock struck midnight he spring ou
