<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill · BURGUNDY — The Edit Proposal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%99%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --paper:#f3ead9; --paper-2:#efe4cf; --card:#faf3e6; --ink:#211a14; --ink-soft:#5b4f42;
    --ink-faint:#8a7c69; --rule:#d8c8ab; --oxblood:#7c2130; --red:#b8332c; --gold:#a9853f;
    --green:#4a6741; --blue:#3d5a6e; --purple:#5d4a6e;
    --shadow:0 1px 0 rgba(120,90,40,.08), 0 12px 34px -20px rgba(60,40,20,.55);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --disp:"Hoefler Text","Iowan Old Style",Palatino,Georgia,serif;
    --mono:"SF Mono",ui-monospace,"Menlo","Consolas",monospace;
  }
  html[data-theme="night"]{
    --paper:#171310; --paper-2:#1d1813; --card:#221b15; --ink:#eadfce; --ink-soft:#c3b39a;
    --ink-faint:#8c7c66; --rule:#3a2f24; --oxblood:#d98a92; --red:#e0776d; --gold:#d6b673;
    --green:#8fb283; --blue:#8ab0c4; --purple:#b09ac4;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 14px 40px -22px rgba(0,0,0,.85);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);
    color:var(--ink); font-family:var(--serif); font-size:17.5px; line-height:1.6; padding-bottom:110px}
  .wrap{max-width:860px; margin:0 auto; padding:0 20px}
  header.masthead{padding:52px 0 20px; text-align:center}
  .emblem{display:inline-flex; align-items:baseline; gap:.04em; font-family:var(--disp); font-size:60px; line-height:1}
  .emblem .b{color:var(--ink); font-weight:600; position:relative; padding-bottom:6px}
  .emblem .b::after{content:""; position:absolute; left:2%; right:2%; bottom:0; height:4px; background:linear-gradient(90deg,var(--red),var(--oxblood)); border-radius:2px}
  .spark{color:var(--gold); font-size:24px; transform:translateY(-20px); margin-left:2px}
  .kicker{font-family:var(--mono); font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--ink-faint); margin:20px 0 6px}
  h1.title{font-family:var(--disp); font-weight:600; font-size:36px; line-height:1.1; margin:.1em 0 .15em}
  .byline{font-family:var(--mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--oxblood); margin-top:14px}
  .rule{height:1px; background:linear-gradient(90deg,transparent,var(--rule) 15%,var(--rule) 85%,transparent); margin:28px 0}
  .letter{background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:26px 28px 22px; box-shadow:var(--shadow); position:relative}
  .letter::before{content:"how to use this"; position:absolute; top:-9px; left:22px; background:var(--card); padding:0 10px; font-family:var(--mono); font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--gold)}
  .letter p{margin:0 0 12px} .letter p:last-child{margin-bottom:0}

  /* legend */
  .legend{display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 0}
  .lg{display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); border:1px solid var(--rule); border-radius:20px; padding:4px 11px}
  .lg .sw{width:10px; height:10px; border-radius:3px; display:inline-block}

  /* chapters */
  .chap{margin-top:44px}
  .chap-head{display:flex; align-items:center; gap:12px; background:var(--paper); padding:10px 0; border-bottom:1px solid var(--rule)}
  .chap-head h2{font-family:var(--disp); font-weight:600; font-size:24px; margin:0}
  .chap-head .cnt{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--ink-faint); text-transform:uppercase}

  /* edit cards */
  .ed{background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:16px 18px; margin:14px 0; border-left-width:4px; border-left-style:solid}
  .ed[data-t="age-fix"], .ed[data-t="line-edit"], .ed[data-t="timing-marker"]{border-left-color:var(--gold)}
  .ed[data-t="new-paragraph"]{border-left-color:var(--green)}
  .ed[data-t="new-scene"], .ed[data-t="new-chapter"]{border-left-color:var(--oxblood)}
  .ed[data-t="restructure"]{border-left-color:var(--red)}
  .ed[data-t="flashback-slot"], .ed[data-t="parked"]{border-left-color:var(--purple)}
  .ed[data-t="open-question"]{border-left-color:var(--blue)}
  .ed-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px}
  .pill{font-family:var(--mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; padding:3px 8px; border-radius:20px; border:1px solid var(--rule); color:var(--ink-soft)}
  .pill.type{font-weight:600}
  .ed[data-t="new-scene"] .pill.type, .ed[data-t="new-chapter"] .pill.type{color:var(--oxblood); border-color:var(--oxblood)}
  .ed[data-t="new-paragraph"] .pill.type{color:var(--green); border-color:var(--green)}
  .ed[data-t="restructure"] .pill.type{color:var(--red); border-color:var(--red)}
  .ed[data-t="flashback-slot"] .pill.type, .ed[data-t="parked"] .pill.type{color:var(--purple); border-color:var(--purple)}
  .ed[data-t="open-question"] .pill.type{color:var(--blue); border-color:var(--blue)}
  .ed[data-t="age-fix"] .pill.type, .ed[data-t="line-edit"] .pill.type, .ed[data-t="timing-marker"] .pill.type{color:var(--gold); border-color:var(--gold)}
  .ed h4{font-family:var(--disp); font-weight:600; font-size:19px; margin:0 0 7px; line-height:1.25}
  .ed .prop{margin:0 0 10px; font-size:16px}
  .ed .why{font-size:13.5px; color:var(--ink-faint); font-style:italic; margin:0 0 10px}
  .ed .draft{font-size:14.5px; color:var(--ink-soft); background:var(--paper-2); border:1px dashed var(--rule); border-radius:8px; padding:9px 12px; margin:0 0 10px}
  .ed .draft b{font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:400; display:block; margin-bottom:4px}
  .anchor{font-size:13px; color:var(--ink-faint); margin:0 0 12px; line-height:1.5}
  .anchor .h,.anchor .t{font-style:italic}
  .anchor b{font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; font-style:normal; color:var(--ink-faint); margin-right:4px}
  .anchor .mark{color:var(--oxblood); font-weight:700; font-style:normal; padding:0 3px}

  /* verdict row */
  .verd{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .vbtn{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; padding:7px 14px; border-radius:8px; border:1px solid var(--rule); background:transparent; color:var(--ink-soft); cursor:pointer; transition:.12s}
  .vbtn:hover{border-color:var(--ink-soft)}
  .vbtn.acc.on{background:var(--green); border-color:var(--green); color:var(--paper)}
  .vbtn.rej.on{background:var(--red); border-color:var(--red); color:var(--paper)}
  .cmt{flex:1; min-width:160px}
  .cmt input{width:100%; background:var(--paper); color:var(--ink); border:1px solid var(--rule); border-radius:8px; padding:8px 11px; font-family:var(--serif); font-size:14px}
  .cmt input:focus{outline:none; border-color:var(--oxblood)}

  .bar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--paper); border-top:1px solid var(--rule)}
  .bar-in{max-width:860px; margin:0 auto; padding:11px 20px; display:flex; align-items:center; gap:14px}
  .progress{flex:1; display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:11.5px; color:var(--ink-soft)}
  .track{flex:1; height:6px; background:var(--rule); border-radius:6px; overflow:hidden; max-width:240px}
  .fill{height:100%; width:0; background:linear-gradient(90deg,var(--oxblood),var(--gold)); transition:width .3s}
  button.act{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--oxblood); color:var(--paper); background:var(--oxblood); padding:9px 14px; border-radius:8px; cursor:pointer}
  button.ghost{background:transparent; color:var(--oxblood)}
  .theme-btn{position:absolute; top:16px; right:18px; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); background:transparent; border:1px solid var(--rule); border-radius:20px; padding:5px 11px; cursor:pointer}
  .toast{position:fixed; bottom:70px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0; background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:10px; font-size:13.5px; font-family:var(--mono); transition:.25s; pointer-events:none; z-index:50}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  @media(max-width:640px){ h1.title{font-size:30px} .emblem{font-size:50px} .letter{padding:20px} .ed{padding:14px} }
</style>
</head>
<body>
<button class="theme-btn" id="themeBtn">☾ night</button>
<div class="wrap">
  <header class="masthead">
    <div class="emblem"><span class="b">B</span><span class="spark">✦</span></div>
    <div class="kicker">Bill · your story wizard</div>
    <h1 class="title">BURGUNDY: The Edit Proposal</h1>
    <div class="byline" id="byline"></div>
  </header>

  <div class="letter" id="intro"></div>

  <div class="legend" id="legend"></div>

  <div id="chapters"></div>
</div>

<div class="bar"><div class="bar-in">
  <div class="progress"><span id="pText">0 ruled</span><span class="track"><span class="fill" id="fill"></span></span></div>
  <button class="act ghost" id="accAllBtn" title="accept everything not yet ruled">accept rest</button>
  <button class="act ghost" id="clearBtn">clear</button>
  <button class="act" id="exportBtn">export ↧</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
const DATA = {"intro":"**THE COCKPIT.** Everything the book needs from you, one page, newest thinking first.\n\n**Where things stand:** Part 1 (edits 1–81) is in the manuscript — your editor's pass, 166 verified review fixes, the chapter merge, and your ch5 lock included. The green suggested edits sit in the writing tool above struck-through old passages (one-tap atomic accept), and the pipeline that puts them there has been rebuilt and proven end to end. I re-read the whole current book tonight — all 28 chapters, 56k words — before evaluating a single note below.\n\n**What's new here:** every one of **Iz's 117 margin notes** and **your own 84 notes**, each located in the CURRENT text, interpreted, and judged — 102 live and needing your ruling, 88 already answered by the big edit (confirm and they close). Each card: what was said, the passage as it reads now, what the note is really asking, my honest verdict and why, and a concrete suggested edit where I agree. Accept = I execute it as a green suggestion in the manuscript AND your reader edition. Reject = it dies. Type your own = your words win.\n\n**Also below:** 12 standing ruling cards (the ch5 tour-revelation question is the urgent one) and the 42 original proposal edits (82–123) still awaiting verdicts. Export when done; the surgery is one command away.","edits":[{"chapter":"2","seq":900,"type":"open question","size":"ruling","title":"FLOW: the kick became a push — but ch9/ch14/ch18/ch21 still say \"kicked\"","proposal":"Per your King doctrine, ch2 now ends on a brake-check PUSH, not an angry kick. But at least four later lines recall it as a kick: \"the robot his father kicked\" (ch9/10), \"Machines too finished to kick\" (ch14), \"his father had kicked it\" (ch18/21). A reader who watched the gentle push then reads \"kicked\" as a harder act. Bill's recommendation: KEEP the push in ch2 and keep \"too finished to kick\" (it's a great button) by seeding one line in ch2's aftermath where Burgundy privately thinks of the push AS a kick — then every later \"kick\" is his earned bitter shorthand. ACCEPT = Bill adds that one seeding line + leaves later lines. REJECT = change all later \"kick\" lines to \"pushed/set his boot against.\" COMMENT = your call.","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation round.","draft":""},{"chapter":"2","seq":901,"type":"open question","size":"ruling","title":"FLOW: ch2's King now pre-says Oz's surveillance reveal (ch11-12)","proposal":"Confirmed what your doctrine md asked me to check: the new ch2 has the King spell out the informant mechanism in his own mouth (\"who's short on his rent, who's angry at his shift boss, who's been asking questions he oughtn't\" / \"I want to know\"). Oz's hunt scene (ch11-12) is built to REVEAL exactly that to Burgundy as new — so it now lands a principle the reader already owns, softening the detonation. Your md's own fallback: \"soften those specifics and let Oz's chapter do them.\" Bill's recommendation: TRIM the three concrete informant specifics from ch2, keep the philosophy (\"a foreman walks a seam to read his men... I know what is moving under it before it moves\"). ACCEPT = Bill trims ch2 to principle-level, Oz keeps the machinery. REJECT = keep ch2 as-is (accept the early seed). COMMENT = your framing.","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation round.","draft":""},{"chapter":"8","seq":902,"type":"open question","size":"ruling","title":"FLOW: King \"seethes\"/rages in ch8 & ch13 — clashes with presumptuous-not-temperamental","proposal":"Now that the King is locked as presumptuous, never raging (\"he corrects, he never rages\"), two earlier/later beats read wrong: ch8 has him \"seethed\" (the no-more-cook's-boy scene) and ch13 (the preserve) has a hot reaction. Bill's recommendation: re-key both to cold verdict register (ch8 \"seethed\" → \"he informed him, flatly\"; ch13 → cold presumption). ACCEPT = Bill applies the register fixes. REJECT = accept these as rare exceptions (a father CAN rage once about his son). COMMENT = per scene.","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation round.","draft":""},{"chapter":"—","seq":903,"type":"open question","size":"ruling","title":"FLOW: book-wide dedup sweep (some real repeats, some are your green review layer)","proposal":"The whole-book read flagged duplicated paragraphs in ch5, ch6, ch8, ch10, ch12, ch15, ch16, ch17 (e.g. the ch6 pepper-seller beat runs as two overlapping drafts; ch8 triples a trade-minister line; ch5's \"beginning next morning\" seam). IMPORTANT: I verified several are actually PENDING GREEN SUGGESTIONS (the review layer), not reader-facing repeats — they resolve when you accept/reject them. But some are genuine both-active dups from the big-edit machine insertions. Bill's recommendation: run a careful dedup sweep that distinguishes green-proposals (leave for your review) from real both-active dups (kill the stale copy, keep the stronger). ACCEPT = Bill runs the sweep (one tab, verified). REJECT = leave it; you'll resolve dups as you accept greens.","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation round.","draft":""},{"chapter":"9","seq":904,"type":"open question","size":"ruling","title":"FLOW: the want-engine Vicentennial fantasy echoes across ch1, ch9, ch14","proposal":"The \"finished machines on the Kings' Hall floor at the Vicentennial, too finished to dismiss, his father forced to see\" fantasy appears in ch9 (first ignition) and again ch14 (fuller), plus the ch1 want-seed plants it and ch1/ch14 both open on \"going to be king / never the question / no other outcome.\" It's a deliberate recurring engine, but currently the wording is close enough to read as reprint. Bill's recommendation: let ch9 be the tentative first ignition, ch14 the harder return (rephrase so it reads as a RETURN not a reprint), ch1 the plant. ACCEPT = Bill differentiates the wording across the three. REJECT = leave (it's meant to recur). COMMENT.","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation round.","draft":""},{"chapter":"1","seq":905,"type":"open question","size":"ruling","title":"FLOW: \"craft\" lands 5× in ch1-2; the pitch figure is verbatim in ch1 & ch2","proposal":"Two small polish items from the read. (1) \"Craft\" appears 5 times across the two opening chapters (3 inside ch2's proclamation) — the two-crafts rivalry is strong but the word is dense; trimming one or two tightens it. (2) The pitch figure \"tooled properly, at scale... a third more ore inside a year\" runs nearly verbatim in ch1 interior AND ch2 spoken — intentional (he rehearsed it) but so verbatim it can read as a repeat rather than a callback. Bill's recommendation: trim one \"craft\", and vary the ch1 interior figure slightly so the ch2 spoken pitch lands fresh. ACCEPT = light trims. REJECT = keep (the rehearsed-line echo is deliberate).","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation round.","draft":""},{"chapter":"16","seq":906,"type":"open question","size":"ruling","title":"The TKTKTK in your speech to Ran — still needs your line","proposal":"The whole-book read reconfirmed: Burgundy's confrontation with Ran carries a raw placeholder, \"he doesn't know TKTKTK,\" inside the emotional core of the scene. Only you can supply what the father has never asked about. Canon-safe candidates: that his son's been over the wall since fifteen; the boy in South 12; that the palace sits on a corvite seam. Or COMMENT with the real line. (REJECT = cut the sentence, let \"I've sat there for more than two years listening...\" carry it.)","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation round.","draft":""},{"chapter":"13","seq":907,"type":"open question","size":"ruling","title":"The \"public descent\" shares its name with the Midsteam Descent — deliberate or rename?","proposal":"The King's execution practice in the preserve scene is called \"a public descent\" — and the sacred festival is the Midsteam Descent. Editor's vote: LEAN IN (the execution wearing the holy rite's name is exactly this regime; the King acknowledges it in one clause). ACCEPT = keep the collision on purpose. REJECT = Bill renames it. COMMENT = your name.","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation round.","draft":""},{"chapter":"6","seq":908,"type":"open question","size":"ruling","title":"The 20-year moon mechanism: is a Vicentennial year the PERFECT lock?","proposal":"You locked the annual Twinrise (moons drift together and lock for one week mid-Steam). Proposed reconciliation with the old 20-year cause: every year the moons lock, but once every twenty years the lock is EXACT — one moon perfectly centered — and a perfect-lock year is a Vicentennial year (your editor softened \"perfect ring\" on the annual lock to leave room for this). ACCEPT = canon. COMMENT = your mechanism.","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation round.","draft":""},{"chapter":"16","seq":909,"type":"open question","size":"ruling","title":"\"The full moon\" under the two-moon sky — one ruling for the whole book","proposal":"The narration now uses the two-shadows image, but Tuck's dialogue still keys the escape plan to \"the full moon\" (twice in ch16, three more in ch21). Options: (A) \"full moon\" is Dross vernacular for the both-moons-full nights — keep it in dialogue (one-line canon note, no prose change). (B) Key it to one named moon (\"when the Bruise comes full\"). Bill's vote: A. ACCEPT = A. COMMENT = B/C.","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation round.","draft":""},{"chapter":"11","seq":910,"type":"open question","size":"ruling","title":"The ladderfinch: \"small, tall\" — pick the bird's shape","proposal":"The ladderfinch is \"a small, tall red bird\" — self-contradictory. Bill's candidate: \"a small, upright red bird\" (honors the ladder name). Simplest: just \"a small red bird.\" ACCEPT = \"small, upright.\" COMMENT = your bird.","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation round.","draft":""},{"chapter":"—","seq":911,"type":"open question","size":"ruling","title":"Audio: chapters changed — regenerate narration now or wait?","proposal":"The Author's Edition audio is stale — ch1, ch2, ch4 were fully rewritten and other chapters changed. Regenerating costs ElevenLabs credits. Bill's recommendation: WAIT until you've accepted the remaining green suggestions and ruled these cards, then narrate the final text once (so we pay for final only). ACCEPT = wait. COMMENT = regenerate specific chapters now (name them).","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation round.","draft":""},{"chapter":"1","seq":500,"type":"iz note","size":"high","title":"IZ · Cut 'Not for anyone. For himself.' — right call, and it now fights the locked want","proposal":"**Iz said:** 'For years, he would sneak down here, careful to go unnoticed' [as replacement]; and cut 'hen he would work. Not for anyone. For himself.'\n\n**The passage now:** Live: 'And then he would work. Not *for *anyone. For himself. / He had told himself, sometimes, that he was preparing for something. / He had not been sure, until this year, what.'\n\n**What this is really asking:** She wants the self-declaration gone and a secrecy-span line in its place.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree with the cut, decline the replacement. 'Not for anyone. For himself.' is the negation-family construction under the house cap — and since the 2026-08-04 lock it's also mildly off-canon: the want is engineered and outward (the machine traces to the boy at the chisel; modernization is the mark he means to make; the look lands on the machine first). 'For himself' re-frames the build as private hobby. The two lines that follow ('preparing for something... not sure, until this year, what') already carry the want-engine forming — let them stand alone. Her replacement restates secrecy the scene has already established twice.\n\n**Suggested edit:** Change 'And then he would work. Not *for *anyone. For himself.' → 'And then he would work.'","head":"","tail":"","rationale":"note f27515bc-8413-4040-9fef-09ecd7029ea9,48a628d0-6859-4cfc-a6ec-5ff22459923d · priority high","draft":""},{"chapter":"1","seq":501,"type":"iz note","size":"low","title":"IZ · The off-by-one beat: 'without seeing' / 'He saw it now.'","proposal":"**Iz said:** 'without seeing' — Not necessary. 'He saw it now.' — Same [cut].\n\n**The passage now:** Live in fresh ch1: 'an off-by-one error he had been looking at for almost an hour without seeing. / He saw it now. He pressed the tab key...'\n\n**What this is really asking:** She hears redundancy — looking-without-seeing followed by now-seeing feels like the same fact told twice.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Disagree. This pair is the proof of the opening's fatigue engine: thirty-one hours awake means his eyes slide over his own bug. 'Without seeing' sets the paradox; 'He saw it now' pays it in three flat words. Cut either and the timer and the shaking hand lose their evidence. This is the house's flat repetition doing work, not fluff.\n\n**Suggested edit:** None — keep as is.","head":"","tail":"","rationale":"note 17b73713-bcd5-4c4b-8cb6-2276d2c830be,22e8a6d6-dfc9-41ed-b6ed-bc378ea0c71b · priority low","draft":""},{"chapter":"1","seq":502,"type":"iz note","size":"low","title":"IZ · Break the tab-key run-on before 'watched'","proposal":"**Iz said:** End sentence he watched… or get rid of again.\n\n**The passage now:** Live: 'He pressed it a third time and committed the fix and ran the simulation again and watched the torque curve resolve into something less ugly than it had been.'\n\n**What this is really asking:** The and-chain runs one clause too long; she wants a period before the payoff, or the doubled 'again' (after 'pressed it again') gone.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Partially agree. The polysyndeton is deliberate, but four 'and's is one over the dose and the second 'again' in the same breath as 'pressed it again' snags the ear. Take her first option: break before 'watched' so the resolve gets its own beat. Keep 'again' — it is true (he has run it before, and runs it again at chapter's end).\n\n**Suggested edit:** Change 'and committed the fix and ran the simulation again and watched the torque curve resolve into something less ugly than it had been.' → 'and committed the fix and ran the simulation again. He watched the torque curve resolve into something less ugly than it had been.'","head":"","tail":"","rationale":"note 7910def1-0eae-4583-ba9a-17ae47baeb6f · priority low","draft":""},{"chapter":"1","seq":503,"type":"iz note","size":"low","title":"IZ · Kitchens 'had not yet started' vs 'were quiet'","proposal":"**Iz said:** Were quiet.\n\n**The passage now:** Live: 'Even the kitchens, which started before dawn, had not yet started.'\n\n**What this is really asking:** The started/started repetition reads clunky to her; she wants a smoother predicate.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Disagree. 'Were quiet' would double the previous sentence ('The palace was always quiet at this hour') and lose the cargo: the repetition is doing hour-arithmetic — it is earlier than the earliest room in the palace. The flat echo is the house register.\n\n**Suggested edit:** None — keep as is.","head":"","tail":"","rationale":"note 4161466c-ae3d-49e4-89b9-98c3ab06d7c4 · priority low","draft":""},{"chapter":"1","seq":504,"type":"iz note","size":"low","title":"IZ · Compress the boiler listen/stop-listening turn","proposal":"**Iz said:** So long it mostly blended into the background. He pressed his hands….\n\n**The passage now:** Live: '...soundtrack for so long that he no longer heard it unless he listened. He listened for a moment. Then he stopped listening and pressed his hands against his eyes and counted to ten.'\n\n**What this is really asking:** She finds the listened/stopped-listening play fussy and wants it collapsed to one clause.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Disagree. 'Blended into the background' is exactly the category phrase the Cargo Test kills, and the three-step turn is the beat: a tired mind poking at its own perception in scene time. It also plants the boiler as the chapter's ambient instrument (it coughs again at the close). Keep.\n\n**Suggested edit:** None — keep as is.","head":"","tail":"","rationale":"note 83ba637e-0df8-4c99-904e-4abdf2c4529e · priority low","draft":""},{"chapter":"1","seq":505,"type":"iz note","size":"low","title":"IZ · 'He knew' → 'Burgundy knew' at the kitchen-memory pivot","proposal":"**Iz said:** Burgundy knew…\n\n**The passage now:** Live: 'He knew the kitchens better than a prince was supposed to.' — first sentence of the pivot from basement-present into the kitchen memory.\n\n**What this is really asking:** Use the name to signal the topic shift after several paragraphs of 'he.'\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree. Cheap orientation gain at a real gear change (present room → childhood memory). No cost.\n\n**Suggested edit:** Change 'He knew the kitchens better than a prince was supposed to.' → 'Burgundy knew the kitchens better than a prince was supposed to.'","head":"","tail":"","rationale":"note 8e3e4639-4b1a-4dd8-82bc-df7c0adc5cb1 · priority low","draft":""},{"chapter":"1","seq":506,"type":"iz note","size":"medium","title":"IZ · The bread-loaf sentence: break it, don't decorate it","proposal":"**Iz said:** 'Steaming and still hot enough to sting'; and: new sentence at 'He…standing up,' then 'The smell of yeast and iron and woodsmoke was engrained in his memory.'\n\n**The passage now:** Live: '...pressing it into his hands without a word, still hot enough to hurt, and he would eat it standing up, and the smell of it, yeast and iron and woodsmoke.'\n\n**What this is really asking:** Two asks on one sentence: more sensory dressing ('steaming,' 'sting') and a period break so the dangling smell-fragment stands alone and resolves ('engrained in his memory').\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Partially agree. The symptom is real — the sentence runs long and the smell-fragment hangs off it by a comma. Take the break. Refuse the dressing: 'hurt' is blunter and truer than 'sting,' 'steaming' is a second adjective where one exact thing suffices, and 'was engrained in his memory' explains what the fragment already carries (Last Step violation). End on the object.\n\n**Suggested edit:** Change 'pressing it into his hands without a word, still hot enough to hurt, and he would eat it standing up, and the smell of it, yeast and iron and woodsmoke.' → 'pressing it into his hands without a word, still hot enough to hurt. He would eat it standing up. The smell of it, yeast and iron and woodsmoke.'","head":"","tail":"","rationale":"note a5abbded-57b9-40f1-b6f6-5dcb7d8039e3,54703294-1c9d-471c-aa04-a0a37a583fba · priority medium","draft":""},{"chapter":"1","seq":507,"type":"iz note","size":"low","title":"IZ · 'this thing' vs 'project'","proposal":"**Iz said:** Project.\n\n**The passage now:** Live: 'had been working on this thing for two years. His *prototype,* he called it to himself. This project no one knew about.'\n\n**What this is really asking:** She wants the more dignified noun.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Disagree. 'This thing' is the boy's own dismissive-intimate diction, and 'project' already lands two sentences later — the swap would double it. The progression thing → prototype → project is a little ladder of how seriously he lets himself take it.\n\n**Suggested edit:** None — keep as is.","head":"","tail":"","rationale":"note 311eb632-2951-419b-91e8-46240f107712 · priority low","draft":""},{"chapter":"1","seq":508,"type":"iz note","size":"low","title":"IZ · 'Two years' needs the official-vs-true count","proposal":"**Iz said:** Of official work at least, the truth was…\n\n**The passage now:** Fresh ch1 now reads: 'Two years. Or, that was the official count. The truth was he had been working on something like the prototype for nine years, since he was eight years old...'\n\n**What this is really asking:** She wanted the two-years claim qualified against the longer true history.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** The big edit did exactly this — the concession ('Or, that was the official count') is in, and the arithmetic now checks (17 − 8 = 9). Note the struck duplicate paragraph below it ('most of a decade' version) still needs the residue sweep.\n\n**Suggested edit:** None — already in the fresh text; sweep the ~~struck~~ duplicate below it.","head":"","tail":"","rationale":"note 83ea3c0f-9413-4bea-81b7-4cba589f9593 · priority low","draft":""},{"chapter":"1","seq":509,"type":"iz note","size":"low","title":"IZ · Adding felt emotion to the upside-down clock memory","proposal":"**Iz said:** What did he feel? Maybe: 'Upside down. He still remembered the thrill when that final piece clicked into place. Excited, he waited for his father to notice his ingenuity.'\n\n**The passage now:** Live: '...put it back together upside down on purpose to see if his father would notice. / His father had not noticed for two months. When he had noticed, he had cuffed Burgundy on the side of the head...'\n\n**What this is really asking:** She wants the boy's interior excitement named so the memory reads warmer.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Disagree, firmly. 'To see if his father would notice' IS the feeling — the whole hope in eight words. Naming 'the thrill' and 'his ingenuity' does the reader's work and pre-softens the payoff: two months of not-noticing, the cuff, 'never mentioned it again' is the wound in miniature, and it lands because the hope was never stated. The 2026-08-04 canon asks the want to read engineered, not sentimental; this edit pushes the wrong way.\n\n**Suggested edit:** None — keep as is.","head":"","tail":"","rationale":"note 1adb23f6-7bcf-4d88-8c2a-764eab42af3f · priority low","draft":""},{"chapter":"1","seq":510,"type":"iz note","size":"low","title":"IZ · Give 'never mentioned it again' its own sentence","proposal":"**Iz said:** It was never mentioned again.\n\n**The passage now:** Live: 'Burgundy had taken it apart again that night and put it back the right way, and his father had never mentioned it again.'\n\n**What this is really asking:** She wants the last fact broken off flat instead of riding the and-clause.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Partially agree. The period break is right — short punch after long build, the house's primary dramatic instrument. But keep the father as subject: the silence is specifically his. Her passive version widens the agency.\n\n**Suggested edit:** Change 'and put it back the right way, and his father had never mentioned it again.' → 'and put it back the right way. His father never mentioned it again.'","head":"","tail":"","rationale":"note d2127a3d-90d2-4fa7-b6f0-220a3f181455 · priority low","draft":""},{"chapter":"1","seq":511,"type":"iz note","size":"medium","title":"IZ · 'their dying lungs' — concrete symptom instead of the conclusion","proposal":"**Iz said:** Their lungs clogged with soot.\n\n**The passage now:** Live: 'He thought, sometimes, about the miners... Their faces, stained black, their dying lungs.  This whole world relied on their arms.'\n\n**What this is really asking:** 'Dying lungs' tells the outcome; she wants the physical picture.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree on the symptom, not her material — soot is combustion; a mine gives rock dust. Replace the told conclusion with the observable fact and let the reader take the last step. Note this whole miner block sits in the zone the pending canon rebuild (age-12 boy at the chisel, South 12, the lozenge) will reshape — fold this fix into that pass.\n\n**Suggested edit:** Change 'Their faces, stained black, their dying lungs.' → 'Their faces stained black. The cough the older ones all had.'","head":"","tail":"","rationale":"note 5a8d2669-5a4b-4bea-a0b8-79750686e37d · priority medium","draft":""},{"chapter":"1","seq":512,"type":"iz note","size":"low","title":"IZ · Adding 'dark but necessary... or so he'd been told' after 'their arms'","proposal":"**Iz said:** A dark but nevertheless necessary part of a functioning society. Or so he'd been told.\n\n**The passage now:** Live: 'This whole world relied on their arms.'\n\n**What this is really asking:** She wants the taught worldview named — the received justification for the extraction.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Disagree with the wording, and mostly with the move. 'A dark but necessary part of a functioning society' is essay diction announcing the theme. The taught-worldview idea is real canon (embattled righteousness) but it belongs in the King's own mouth — ch10's statue speech and 'We are survivors' carry it properly. Narration editorializing here also spends ch1's warm ignorance early. The flat fact is stronger alone.\n\n**Suggested edit:** None — keep as is.","head":"","tail":"","rationale":"note 5ffc3a92-09a2-4771-afb1-b226f50e1723 · priority low","draft":""},{"chapter":"1","seq":513,"type":"iz note","size":"low","title":"IZ · The inspection tableau sentence: three rewrites declined","proposal":"**Iz said:** 'Crisp, clean, embroidered'; cut 'at whatever they said'; and 'the miners, blank levels below appeared as shadows, only the whites of their eyes visible as they acknowledged the disturbance.'\n\n**The passage now:** Live, one sentence: '...stand at the rim during inspections, in the embroidered coat his father made him wear, while the foremen read from their clipboards and the King nodded at whatever they said and the miners below in the pits, black-faced, soaked through, holding their picks at their sides like rifles at parade, looked up at him without expression.'\n\n**What this is really asking:** Three adjacent patches on one long sentence: heighten the coat contrast, shorten the King clause, make the miners more atmospheric.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Disagree on all three. The adjective stack pads what the sentence already contrasts (embroidered vs black-faced, soaked through). 'At whatever they said' is the King characterization — the inspection as theater no one listens to — and cutting it loses him. And 'shadows... whites of their eyes... acknowledged the disturbance' trades the sentence's two best concretes ('picks at their sides like rifles at parade,' 'looked up at him without expression') for stock imagery plus an abstraction. The single long breath is deliberate: the whole ceremony scanned in one pass, landing on the expressionless faces.\n\n**Suggested edit:** None — keep as is.","head":"","tail":"","rationale":"note ee16d65f-207a-4152-a80f-de259ee0558d,df095f07-b9db-4049-9725-5f5786195458,b65a4e75-1f8c-40a7-84f9-985d369fb395 · priority low","draft":""},{"chapter":"1","seq":514,"type":"iz note","size":"medium","title":"IZ · The 'worst mine' paragraph: attribution right, and it needs a syntax sweep anyway","proposal":"**Iz said:** 'Said to be the worst'; 'and Burgundy believed it. Then detail about elevators and then continue as you have.'\n\n**The passage now:** Live and rough: 'It was the \"worst\" mine. It wasn't just a pit, but a deep labyrinth of tunnels. Burgundy's grandpa's had inspectors who  found some special vein... \"Never ending\" is the how it was talked about. So they just kept digging down. for decades now...'\n\n**What this is really asking:** Attribute the 'worst' claim as hearsay he accepts, then run the elevator detail — plus the paragraph plainly needs cleanup.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree in substance. Everything he knows about South 12 arrives second-hand (inspectors' reports, his uncle's stories), so 'people called it... and Burgundy believed them' fits the hearsay texture better than scare quotes. The paragraph also carries live draft damage ('grandpa's had inspectors,' 'is the how it was talked about,' 'digging down. for decades') and a negation-cap construction ('It wasn't just a pit, but...'). One rewrite fixes all of it while keeping every fact.\n\n**Suggested edit:** Replace the paragraph with: 'He had been to the rim of the South 12 Shaft three times in his life. People called it the worst mine, and Burgundy believed them. His grandfather's inspectors had found a vein down there the reports called never-ending, so the crown had kept digging, for decades now, a tangle of tunnels no single person knew the extent of. The elevators to the deepest parts took thirty minutes one way. Or so Burgundy had heard from his uncle, who used to sneak down as a teenager and explore.'","head":"","tail":"","rationale":"note 25e45916-bb02-4ebd-91d4-6d5c2999dfdd,8b3cd69b-a8ea-4c35-a587-9f6b0a75f646 · priority medium","draft":""},{"chapter":"1","seq":515,"type":"iz note","size":"medium","title":"IZ · Name the remembered smell — but canon already picked it: sulfur","proposal":"**Iz said:** Stale, cold, and metallic.\n\n**The passage now:** Live: 'Burgundy only knew the surface of South 12 but remembered the smell.'\n\n**What this is really asking:** 'Remembered the smell' without giving the smell is a withheld sensory; she wants it specified.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree with the symptom, not her answer. The canon mineshaft-memory rebuild specifies a strong sulfur smell coming up from the ground — it is load-bearing (the attendant's honey-colored lozenge exists to kill it). Use sulfur now so this line and the rebuilt age-12 memory agree; 'stale, cold, metallic' would contradict the plant.\n\n**Suggested edit:** Change 'but remembered the smell.' → 'but remembered the smell, sulfur coming up out of the ground.'","head":"","tail":"","rationale":"note 7bcfb8ab-d225-4e35-ad02-97ef9d8ce68a · priority medium","draft":""},{"chapter":"1","seq":516,"type":"iz note","size":"low","title":"IZ · 'Her sweat seemed permanent' — already in","proposal":"**Iz said:** Her sweat seemed permanent.\n\n**The passage now:** Live: the miner-woman sentence now ends '...into an impossibly old cart. Her sweat seemed permanent.' — her exact line.\n\n**What this is really asking:** She offered a closing sensory detail for the remembered miner.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Applied verbatim in the fresh text. Note for the ledger: this whole beat (the woman at the rock) is scheduled to become the age-12 boy at the chisel per canon, so the line may not survive the rebuild — but the note itself is honored.\n\n**Suggested edit:** None — already in the fresh text.","head":"","tail":"","rationale":"note b04176d7-eae9-4dab-b901-0170fb0172f0 · priority low","draft":""},{"chapter":"1","seq":517,"type":"iz note","size":"medium","title":"IZ · 'Pick nearly half her size' — carry the instinct into the boy rebuild","proposal":"**Iz said:** Swinging her pick that was nearly half her size.\n\n**The passage now:** Live but garbled: 'swinging her pick, the working the stubborn rock with a chisel and hammer,  directing the black crumbs that came off that wall into an impossibly old cart.' The canon rebuild replaces this woman with the age-12 boy at the chisel.\n\n**What this is really asking:** Give the tool a scale that indicts the labor — a body too small for the work.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Good instinct, wrong target. Don't invest in the pick: canon rebuilds this memory around a child at a chisel, where too-big-tool-in-too-small-hands lands even harder — carry her idea there. Meanwhile the live sentence has a garble (pick AND chisel-and-hammer, plus 'the working') that should be cleaned regardless.\n\n**Suggested edit:** Interim cleanup: change 'swinging her pick, the working the stubborn rock with a chisel and hammer,  directing the black crumbs' → 'working the stubborn rock with a chisel and hammer, directing the black crumbs'. In the canon rebuild, give the boy's chisel her scale idea (a tool sized for a grown hand in a child's).","head":"","tail":"","rationale":"note 15c326c4-7af9-4e89-9df2-01ce95abd8f6 · priority medium","draft":""},{"chapter":"1","seq":518,"type":"iz note","size":"low","title":"IZ · 'replace that woman' → 'replace her'","proposal":"**Iz said:** Her.\n\n**The passage now:** Live: 'the entire thing he was building in this basement... could trace back to her.  A machine that could replace that woman.'\n\n**What this is really asking:** Pronoun consistency — 'her' then 'that woman' steps backward in closeness.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree as an interim fix; 'that woman' after 'her' is a small distancing wobble. Flag: canon re-points this trace to the boy at the chisel ('the machine must trace to him'), so the rebuild rewrites this sentence anyway.\n\n**Suggested edit:** Change 'A machine that could replace that woman.' → 'A machine that could replace her.'","head":"","tail":"","rationale":"note 86c956ff-452b-4b50-9733-1a1a84a93c4a · priority low","draft":""},{"chapter":"1","seq":519,"type":"iz note","size":"medium","title":"IZ · Cut 'and he was aware that this was also possibly true'","proposal":"**Iz said:** Cut.\n\n**The passage now:** Live: 'He was aware that it was the sort of thing that would sound stupid if he said it out loud,* I built it for a woman whose name I do not know*, and he was aware that this was also possibly true.'\n\n**What this is really asking:** The trailing clause over-turns the beat and its antecedent is slippery (possibly true that it's stupid? that he built it for her?).\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree. End on the italic confession — that's the Last Step. The tail is a second wry turn on a beat that only needs one, and the muddy antecedent makes the reader do grammar instead of feeling. Also fixes the stray asterisk spacing while we're in the sentence.\n\n**Suggested edit:** Change 'if he said it out loud,* I built it for a woman whose name I do not know*, and he was aware that this was also possibly true.' → 'if he said it out loud. *I built it for a woman whose name I do not know.*'","head":"","tail":"","rationale":"note d5fc0205-4fb6-4e13-9e85-414e1092b566 · priority medium","draft":""},{"chapter":"1","seq":520,"type":"iz note","size":"medium","title":"IZ · The father-knows hedge: tighten, don't kill","proposal":"**Iz said:** Cut ['Or, Burgundy hoped his father did not know about the basement. It was possible that he did'].\n\n**The passage now:** Live, two paragraphs: 'His father did not know about the basement. / Or, Burgundy hoped his father did not know about the basement. It was possible that he did.'\n\n**What this is really asking:** She reads the doubling-back as wheel-spinning and wants the confident statement to stand alone.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Partially agree. Two sentences of hedging is one too many — but cutting the retraction entirely deletes the dread the book runs on (is anything on Dross unwatched?). Compress to a single turn: statement, then the four-word doubt.\n\n**Suggested edit:** Replace both paragraphs with one: 'His father did not know about the basement. Or, Burgundy hoped he did not.'","head":"","tail":"","rationale":"note d1f985b4-ddd5-4cad-9b94-c1cbbe87494e · priority medium","draft":""},{"chapter":"1","seq":521,"type":"iz note","size":"medium","title":"IZ · 'Didn't really understand what it meant' — clarify concretely, keep 'He never asked'","proposal":"**Iz said:** Hard to believe since it sounds simple. I'd cut.\n\n**The passage now:** Live: '\"Our ores make travel between the stars possible\" is something his father would say... Burgundy didn't really understand what it meant. He never asked.'\n\n**What this is really asking:** As written it sounds like he can't parse a plain sentence, so she doubts it and wants it gone.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree with the symptom, disagree with the cut. He must NOT understand — the mechanism ignorance is the plant ch10 detonates (the floating osmarine marble, the 83-years arithmetic he does himself), and 'He never asked' is the trained-out-curiosity thesis in four words (asking is dangerous on Dross; ch8 says it outright). The fix is concretion: name what he can't fill in, so the ignorance reads engineered, not dim.\n\n**Suggested edit:** Change 'Burgundy didn't really understand what it meant. He never asked.' → 'Burgundy could not have said which ore it was, or what a ship did with it. He never asked.'","head":"","tail":"","rationale":"note 74a577d7-a577-4bd5-0000-000000000000 · priority medium","draft":""},{"chapter":"1","seq":522,"type":"iz note","size":"low","title":"IZ · Cut 'had' in 'he had watched them'","proposal":"**Iz said:** Cur [Cut].\n\n**The passage now:** Live: 'The tribute ships came every month and he had watched them for as long as he could stand at a window.'\n\n**What this is really asking:** Tense feels heavy to her; she wants simple past.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Disagree with the specific cut — 'he watched them for as long as he could stand at a window' turns a lifetime habit into one session's endurance. If the line snags, the real wobble is the ambiguity of 'for as long as he could stand at a window' (whenever-possible vs since-he-could-stand). Optional recast below if Johnny wants it airtight; otherwise leave.\n\n**Suggested edit:** Optional: change 'and he had watched them for as long as he could stand at a window.' → 'and he had watched them from the windows all his life.'","head":"","tail":"","rationale":"note a8747b8a-8a74-0000-0000-000000000000 · priority low","draft":""},{"chapter":"1","seq":523,"type":"iz note","size":"low","title":"IZ · Tripling 'houses built on the roofs of houses'","proposal":"**Iz said:** Could be cool to repeat 'on the roofs of houses' one more time. Then 'a jagged mountain of iron sheeting gone orange…'\n\n**The passage now:** Live: 'It fell away from the castle walls in stacked tiers, houses built on the roofs of houses, iron sheeting gone orange with rust.  In the warm months it looked like one great heap of salvage.'\n\n**What this is really asking:** She wants the stacking figure run again as incantation, plus a bigger mass-image.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Disagree, narrowly — it's a taste call. One repetition already performs the stacking; a second turns observation into flourish, and 'a jagged mountain of iron sheeting' would collide with the next sentence's 'one great heap of salvage,' which is the better image because it's a judgment the snow then revises. Restraint carries it.\n\n**Suggested edit:** None — keep as is.","head":"","tail":"","rationale":"note 553a0cd6-46fd-4960-9f2c-822ea172a288 · priority low","draft":""},{"chapter":"1","seq":524,"type":"iz note","size":"low","title":"IZ · Staging the King's 'Everything' — fights locked King canon","proposal":"**Iz said:** He paused in front of Burgundy, eyes low gazing into the hazy distance. Everything, he said and walked away.\n\n**The passage now:** Live: 'What were they taking away from our planet. *Everything*, his father had said. He didn't explain.'\n\n**What this is really asking:** She wants the moment dramatized with gesture and atmosphere.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Disagree, on canon grounds. 'Eyes low, gazing into the hazy distance' makes the King wistful and theatrical; the locked King is presumptuous, never brooding — he states a conclusion as if it is obviously shared and moves on. 'Everything, his father had said. He didn't explain.' is that register exactly, and it is the chapter's cleanest piece of the father. Do not touch.\n\n**Suggested edit:** None — keep as is.","head":"","tail":"","rationale":"note f455b464-7ae5-44f5-aeed-b488a3d33015 · priority low","draft":""},{"chapter":"1","seq":525,"type":"iz note","size":"low","title":"IZ · 'Through years of eavesdropping' before the Nicholas name","proposal":"**Iz said:** Through years of evesdropping along the echoey halls, he eventually learned.\n\n**The passage now:** Live: 'He had learned, eventually, the name of the man whose ships these were.'\n\n**What this is really asking:** She wants the how of the learning shown.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Disagree. 'Learned, eventually' is the canon fragments-assembly in one word; the method — learning the system by listening — is dramatized properly in ch8, where it's the chapter's engine. Certifying him a practiced hall-spy in ch1 pre-spends that, and 'echoey halls' is soft goods anyway.\n\n**Suggested edit:** None — keep as is.","head":"","tail":"","rationale":"note 9d68867a-bf43-4555-b1a8-97c8edd1bf62 · priority low","draft":""},{"chapter":"1","seq":526,"type":"iz note","size":"low","title":"IZ · Explaining Nicholas's power — the parked slot already owns this","proposal":"**Iz said:** It was unclear to Burgundy why Nicholas had so much power and what exactly that power wielded, what it meant for the people of Dross — maybe something like that?\n\n**The passage now:** Live: 'Nicholas was a name his father said the way other people talked about the season's rainfall, as a fact of the world that determined abundance or scarcity. It was all Nicholas.' — with the ⟦PARKED SLOT⟧ marker directly below.\n\n**What this is really asking:** She wants Burgundy's confusion about Nicholas made explicit.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Disagree with the insertion; the ask is already queued by design. Naming the confusion explains the mystery that 'It was all Nicholas.' deposits as a button — the rainfall comparison already tells us nobody on Dross interrogates Nicholas, which IS the answer. And geopolitics content is parked: Johnny's tutor-flashback material lands in exactly this slot. Keep the button; let the slot do the expanding.\n\n**Suggested edit:** None — keep as is; the PARKED SLOT below this paragraph is where the expansion goes.","head":"","tail":"","rationale":"note 1e564662-8e2b-47d6-8869-ba9fdab0bf54 · priority low","draft":""},{"chapter":"1","seq":527,"type":"iz note","size":"medium","title":"IZ · Re-ground in the room before the wine-cellar history","proposal":"**Iz said:** Bring us back with an interruption — 'Somewhere in the corner a nodule beeped, Burgundy startled.'\n\n**The passage now:** Live: ten paragraphs of memory and exposition (miners → South 12 → father → tribute → Nicholas) run before 'The basement where he now worked had been a wine cellar once...'\n\n**What this is really asking:** Right structural ear: the reader has been away from the present for a long stretch and needs one sensory beat to come home on.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Partially agree. The re-grounding is a real need; her device is wrong ('nodule' is nothing, and a startle overplays it). The chapter already owns an ambient instrument — the boiler. One flat line of it before the history re-anchors without ceremony, and its recurrence at the chapter's close becomes a quiet rhythm.\n\n**Suggested edit:** Insert a new paragraph before 'The basement where he now worked had been a wine cellar once, before some great-great-uncle had decided wine was beneath royal dignity.': 'The boiler coughed in the next sublevel.'","head":"","tail":"","rationale":"note 08aed74b-ab7c-4e27-98ac-9fc568546675 · priority medium","draft":""},{"chapter":"1","seq":528,"type":"iz note","size":"low","title":"IZ · Expanding the bottle-breaking into an inequality set-piece","proposal":"**Iz said:** Possible moment to drive home inequality — a gathered crowd watching thousands of bottles shattered; people struggling for clean water, drinking watery ale...\n\n**The passage now:** Live: 'The bottles had been carried up and broken in the courtyard to make the point.'\n\n**What this is really asking:** She wants the moment to carry visible class commentary.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Disagree. The one-line version is the aristocratic psychology whole — waste as display, 'to make the point' doing all the work. Staging a crowd and adding water-deprivation commentary announces the theme, invents non-canon detail, and pre-spends the book's architecture: ch1 holds warm ignorance, and the deprivation detonates later through the resistance return. The offhandedness is the horror.\n\n**Suggested edit:** None — keep as is.","head":"","tail":"","rationale":"note 9e350f97-aacb-47a4-90f5-3f1ea1e560e1 · priority low","draft":""},{"chapter":"1","seq":529,"type":"iz note","size":"low","title":"IZ · 'Taken the found...' clunk — phrasing no longer exists","proposal":"**Iz said:** Abandoned.\n\n**The passage now:** The old draft's awkward 'taken the found...' construction is gone. Fresh reads: 'He had found the cellar when he was twelve and run the cables down himself, through a vent shaft.' — with the abandonment carried by the wine-cellar history above it.\n\n**What this is really asking:** She was patching an awkward 'found' in the old sentence with 'abandoned.'\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** The rewrite dissolved the clunk: 'found' is now a clean verb and the cellar's abandonment is established by the broken-bottles history, which is better than an adjective. Nothing left to do.\n\n**Suggested edit:** None — resolved by the rewrite.","head":"","tail":"","rationale":"note c5baa6be-524d-4148-b745-5727b4affcd2 · priority low","draft":""},{"chapter":"1","seq":530,"type":"iz note","size":"low","title":"IZ · Is 'himself' implied in 'run the cables down himself'?","proposal":"**Iz said:** Implied.\n\n**The passage now:** Live: 'He had found the cellar when he was twelve and run the cables down himself, through a vent shaft.'\n\n**What this is really asking:** Redundancy trim — of course he did it himself, it's a secret.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Disagree. For a prince, 'himself' is not implied — princes have things done for them. The word marks the transgression: royal hands doing wire-pulling through a vent shaft. Two syllables buying class information.\n\n**Suggested edit:** None — keep as is.","head":"","tail":"","rationale":"note 93d1645a-f1d6-4482-9db4-61f55c6ee682 · priority low","draft":""},{"chapter":"1","seq":531,"type":"iz note","size":"low","title":"IZ · Trim 'servants' from the scavenged-motor location","proposal":"**Iz said:** Cut ['servants'].\n\n**The passage now:** Live (with typo): 'a motor left to rust in the servants court yard behind the kitchens, ball bearings from a broken serving cart...'\n\n**What this is really asking:** Leaner list rhythm; the location is doubled.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree. 'Behind the kitchens' already locates it and carries the class geography (the kitchens are Tuck's world); 'servants court yard' adds a typo and a second address. The scavenge list reads faster without it.\n\n**Suggested edit:** Change 'a motor left to rust in the servants court yard behind the kitchens' → 'a motor left to rust in the courtyard behind the kitchens'","head":"","tail":"","rationale":"note d3f39181-8733-4c55-9726-c45c4982e39c · priority low","draft":""},{"chapter":"1","seq":532,"type":"iz note","size":"medium","title":"IZ · Four notes on the struck run-it-again block — cut won, but a ch14 plant is orphaned","proposal":"**Iz said:** 'Short and low'; a darker rewrite of 'naming objects was a way of lying to yourself' ('naming things only added to the sting when they were taken away'); cut 'He's going to hate it... sighed a long breath' (since he'd tried not to imagine the response); and tighten 'the way it pulsed when it was only waiting' to 'as it waited.'\n\n**The passage now:** All four target the late-night console exchange ('Run it again' ... 'Good prototype' ... 'He's going to hate it'), which is entirely ~~strikethrough~~ in the fresh text — cut by the big edit, residue awaiting the sweep.\n\n**What this is really asking:** Line-tuning plus one cut on a beat the big edit deleted whole.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** The cut does everything these notes wanted and more — c8922cca asked for exactly this deletion, for exactly the right reason (it contradicted 'careful in his rehearsals not to imagine his father's response'). The three rewrites died with the text. One flag before the sweep: the struck block holds the only plant of Tuck's mother naming machines ('gave them all people-names: the boiler and the bread knife'), which ch14's DREKKO-naming echo leans on. Re-home that one fact in the live kitchen memory so ch14 doesn't orphan.\n\n**Suggested edit:** Sweep the ~~struck~~ block. Then insert into the kitchen-memory paragraph, after 'on a stool near the ovens where it was warm, watching Tuck's mother work.': 'She gave things people-names, the boiler, the bread knife, her favorite cutting board.'","head":"","tail":"","rationale":"note caea6022-442b-4992-9c12-e8726d50e724,0b05a1c7-c5aa-4090-8282-4f179676b5dd,c8922cca-3d42-47f4-a993-cfd9a541315a,26eeeecb-f29c-46f4-a048-ca720565f66c · priority medium","draft":""},{"chapter":"1","seq":533,"type":"iz note","size":"low","title":"IZ · 'In fact, the graph had been fine...'","proposal":"**Iz said:** In fact, the.\n\n**The passage now:** Live: 'The graph was fine. The graph had been fine the last three times he had run it.'\n\n**What this is really asking:** She wants a discourse marker smoothing the repetition.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Disagree. 'In fact' is chat filler; the deadpan echo ('The graph was fine. The graph had been fine...') is the house's flat repetition rendering exhaustion — he's re-running a solved problem because his brain has stopped. The dryness is the joke and the diagnosis at once.\n\n**Suggested edit:** None — keep as is.","head":"","tail":"","rationale":"note a9628823-0be7-4668-9ec0-f5d5b58976c4 · priority low","draft":""},{"chapter":"1","seq":534,"type":"iz note","size":"low","title":"IZ · 'His mind wouldn't stop working...' — cut, as she asked","proposal":"**Iz said:** Implied [cut 'His mind wouldn't stop working, not with the pitch waiting for him in the morning'].\n\n**The passage now:** Live text now reads exactly 'He should sleep. He knew he couldn't.' The explaining sentence survives only inside a struck duplicate below, pending the residue sweep.\n\n**What this is really asking:** The explanation restated what the whole chapter shows.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Her call was right and the big edit made it — textbook Last Step. Just sweep the ~~struck~~ twin so it can't resurrect.\n\n**Suggested edit:** None — already applied; sweep the struck duplicate.","head":"","tail":"","rationale":"note 6369257e-61c3-4c14-8a56-cc9eef1eaddb · priority low","draft":""},{"chapter":"1","seq":535,"type":"iz note","size":"low","title":"IZ · The 'dark and green' closing paragraph — cut, chapter now ends on sleep","proposal":"**Iz said:** I'd cut [the closing 'The basement was dark and green... could not afford to disappoint, and could not stop himself from trying to' paragraph, which appeared twice in the old draft].\n\n**The passage now:** Gone from fresh ch1. The chapter now ends: 'He told himself it was only for a moment... and then, between one of those things and the next, he was no longer telling himself anything at all.'\n\n**What this is really asking:** She read the summarizing send-off as over-serving a chapter that had already made its case (twice, since the draft duplicated it).\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** The cut carried the day and I think it was right, with one caveat checked: the old paragraph held the 'priceable fuse' house style once wanted at this ending, but the fuse now lives earlier and better ('he wanted that look to land on the machine first. Then him.'), so the chapter can afford its quiet button — a boy talked to sleep by his own reasonable lies while the timer ticks on. That's a stronger close than the disappoint-sentence, which explained the stakes it should have deposited.\n\n**Suggested edit:** None — already applied.","head":"","tail":"","rationale":"note 6d39abfb-4e18-4eea-a784-cf5e62411e68,7fb767f1-a619-4981-910d-df98e44c9081 · priority low","draft":""},{"chapter":"2","seq":536,"type":"iz note","size":"high","title":"IZ · \"The look she had given him at dinner\" — cut scene? Plus a LIVE duplicate paragraph","proposal":"**Iz said:** \"I think you cut this scene?\" — the reference to the look Mira gave him at dinner seemed to dangle after a scene deletion.\n\n**The passage now:** Two live paragraphs now cover this beat. Line 234 (correct): \"...he searched her face for the look she had given him at the feast the night before. He could not find it. Her council face was on, and nothing in it moved.\" The referent exists: fresh ch1 carries the feast and \"His mother had given him a glance, at the feast\" (ch1 lines 99–101). BUT line 238 is an un-struck DUPLICATE of the same paragraph, still reading \"at dinner the night before\" and ending in the garbled \"She was looking at him a different way now. A tense unchanging expressions.\"\n\n**What this is really asking:** A continuity check: does the referenced scene still exist? Yes — but her note leads straight to the chapter's worst live defect, the duplicated Mira-at-the-throne paragraph the book map flagged.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Her continuity worry is answered (the feast glance is planted in ch1), but the note is live because the fresh text repeats the whole paragraph with the stale \"dinner\" wording and a broken final sentence. One version must die, and it's the second: \"Her council face was on, and nothing in it moved\" beats \"A tense unchanging expressions\" on every axis.\n\n**Suggested edit:** Delete the entire paragraph at line 238 (\"His mother stood beside the throne. Mira's hair was dust-grey... She was looking at him a different way now. A tense unchanging expressions.\") — it directly follows the struck \"~~When Burgundy had been very small...~~\" block. Keep line 234's version unchanged.","head":"","tail":"","rationale":"note 39070e5f-1e28-4839-99db-9b9bfe11790b · priority high","draft":""},{"chapter":"2","seq":537,"type":"iz note","size":"low","title":"IZ · \"Three villages worth of people\" — cut","proposal":"**Iz said:** Cut — flagging the awkward phrase \"worth of people\" in \"the forced removal of three villages worth of people.\"\n\n**The passage now:** The sentence survives only inside a strikethrough block (line 172). The live hall-description now reads: \"There was a private hunting ground, walled and kept and grain-fed the whole year round, so that the King could shoot one morning of it.\" The forced-removal fact was relocated to ch12, where the King says \"Three villages, this was\" on the hunt and the threshold-stone beat detonates it.\n\n**What this is really asking:** She's flagging clunky phrasing, but the deeper instinct is right: the atrocity stated flatly in a room-description paragraph was wasted. It's exposition where it should be detonation.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Agree, and the big edit did something better than her cut: it moved the cruelty to ch12 where Burgundy stands on the threshold stone and prices it himself. Ch2's hunting ground now reads as mere royal indulgence, which preserves his warm ignorance per canon. Nothing left to do here.\n\n**Suggested edit:** None — resolved by the rewrite. (Separately: the dead ~~strikethrough~~ blocks at lines 170–176 still need deleting in a cleanup pass.)","head":"","tail":"","rationale":"note 96bbfcc9-ba15-4aab-92fd-95e80312c657 · priority low","draft":""},{"chapter":"2","seq":538,"type":"iz note","size":"low","title":"IZ · \"Stone ribs\" hard to visualize","proposal":"**Iz said:** Hard time visualizing — on \"stone ribs\" in the hall description.\n\n**The passage now:** Live at line 166: \"It was long, with an arched ceiling, stone ribs fanning out from the tops of the columns, and was mostly empty.\"\n\n**What this is really asking:** The image (rib vaulting) is real and concrete, but the syntax presents \"arched ceiling\" and \"stone ribs\" as separate list items, so the ribs float free of the ceiling they hold up. The confusion is grammatical, not imagistic.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Partially agree. Don't add description — Iz's usual fix — just attach the ribs to the ceiling structurally so the picture assembles in one pass. One clause reorder does it.\n\n**Suggested edit:** Line 166. OLD: \"It was long, with an arched ceiling, stone ribs fanning out from the tops of the columns, and was mostly empty.\" NEW: \"It was long and mostly empty, the arched ceiling carried on stone ribs that fanned out from the tops of the columns.\"","head":"","tail":"","rationale":"note afad31b8-f50b-454d-8ab9-ca97400da552 · priority low","draft":""},{"chapter":"2","seq":539,"type":"iz note","size":"medium","title":"IZ · \"In ways no glass ever could\" — describe more","proposal":"**Iz said:** Describe more — on \"into gleaming threads of colored light in ways no glass ever could.\"\n\n**The passage now:** Live at line 180: \"In daylight the stone panes would catch the sunlight and split it into gleaming threads of colored light in ways no glass ever could. And at night the stone glowed faint and pale like embers.\"\n\n**What this is really asking:** Her symptom is exactly right, though her fix is wrong. \"In ways no glass ever could\" claims wonder without delivering any — it's the false-usefulness pattern Johnny named the capital crime. The reader is told the stone beats glass and shown nothing.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Agree on the symptom, not the prescription. The fix is not more description; it's one concrete difference the eye can verify. Translucent stone has mineral grain — its light is veined where glass light is flat. One clause of cargo replaces the empty superlative.\n\n**Suggested edit:** Line 180. OLD: \"split it into gleaming threads of colored light in ways no glass ever could.\" NEW: \"split it into gleaming threads of colored light, veined with the grain of the mineral, where the glass panes threw their color flat.\"","head":"","tail":"","rationale":"note 7e6d82ae-f4b6-482f-83b4-9b1b36332f6c · priority medium","draft":""},{"chapter":"2","seq":540,"type":"iz note","size":"low","title":"IZ · \"On this particular morning\" — abrupt transition","proposal":"**Iz said:** A bit abrupt — on the old opener \"On this particular morning, the one he had been preparing for.\"\n\n**The passage now:** The old line lives only in strikethrough (line 216). The live version (line 204) reads: \"On this particular morning, the first morning of his training, Burgundy had not planned to arrive late.\"\n\n**What this is really asking:** She felt the hard pivot from the long hall/window/cosmology establishing block into the action with no hinge.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** The rewrite fixed the sentence-level abruptness: \"the first morning of his training\" names the day and gives the pivot a hinge. The residual issue — the window/Ghai front-load delaying the scene — is a known chapter weakness tracked upstream, and it's a structural call, not this note's fix. No action on the line itself.\n\n**Suggested edit:** None — the live line carries its own anchor now.","head":"","tail":"","rationale":"note 41d5535c-ebf4-41ec-a1ff-0a3e7207f7b9 · priority low","draft":""},{"chapter":"2","seq":541,"type":"iz note","size":"low","title":"IZ · \"Looked smaller than it did at night\" — proposed cut","proposal":"**Iz said:** Cut — on \"In the thin morning light it looked smaller than it did at night.\"\n\n**The passage now:** Live at line 208, unchanged, inside the robot boot-up paragraph.\n\n**What this is really asking:** She reads it as a throwaway observation slowing the morning rush.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Disagree. This is one of the quiet load-bearing lines: the machine diminished by daylight is the double-life theme in nine words — the thing he built by night, about to be judged in his father's light. It passes the Cargo Test (a seen size-shift), costs nothing, and pre-figures the rejection without announcing it. Keep.\n\n**Suggested edit:** No change — keep the line as written.","head":"","tail":"","rationale":"note 10a749a2-3ca4-4e4d-b286-ec21e1c17ee4 · priority low","draft":""},{"chapter":"2","seq":542,"type":"iz note","size":"low","title":"IZ · Boot-up sentence machinery (heart line + \"indicating active\" tail)","proposal":"**Iz said:** Two adjacent notes on the same old sentence: reword \"positioned where the heart would live\" to \"ones heart would be,\" and cut everything from \"and\" (after 'indicating \"active\"') through \"...decide which.\"\n\n**The passage now:** The old sentence survives only in strikethrough (line 220). Live version (line 208): the \"brain where the heart would live\" clause is cut entirely; 'pulsing... indicating \"active\"' became \"the panel pulsed slow and green\"; the sentence now runs clean to \"...either the best thing he had ever made or a toy, and that in a few hours his father would decide which.\"\n\n**What this is really asking:** Both notes attack the same baggy, mechanically-narrated boot-up sentence. The heart/brain line was a reach; 'indicating \"active\"' was spec-sheet narration.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** The rewrite did what both notes wanted at the clunk level. But I part ways with the full cut cf919417 asked for: \"the best thing he had ever made or a toy, and his father would decide which\" is the paragraph's fuse — it prices the stakes of the pitch and hands judgment to the father before we meet him. The edit correctly kept it while killing the machinery around it.\n\n**Suggested edit:** None — resolved; the kept tail should stay kept.","head":"","tail":"","rationale":"note 81ca48c9-4269-4d73-b0c7-8fb986facccb, cf919417-8605-4779-b22e-0b2fe1df23d8 · priority low","draft":""},{"chapter":"2","seq":543,"type":"iz note","size":"low","title":"IZ · \"He had never walked through them at this hour\" — cut","proposal":"**Iz said:** Cut — the sentence was redundant after \"He had been walking past them his whole life.\"\n\n**The passage now:** Old passage is struck (line 222). Live version (line 210): \"The doors of the Kings' Hall had been shut to him at the council hour his whole life. He had walked past them a thousand times. This morning they stood open, because this morning, for the first time, he was expected through them. Nobody knew he was not coming alone.\"\n\n**What this is really asking:** Straight redundancy catch — three sentences saying the same fact.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Agree with her, and the rewrite went further than a cut: \"expected through them\" reframes the beat from trespass to rite (canon: the council is his duty, the robot is the surprise), and \"Nobody knew he was not coming alone\" is a proper fuse. Better than the version her cut would have produced.\n\n**Suggested edit:** None — resolved.","head":"","tail":"","rationale":"note ed386265-dd9d-4e85-ba17-e8b827394739 · priority low","draft":""},{"chapter":"2","seq":544,"type":"iz note","size":"low","title":"IZ · Typo: \"heir voices\" → \"their voices\"","proposal":"**Iz said:** Their — typo fix on \"heir voices an echoing hum.\"\n\n**The passage now:** Old typo survives only in strikethrough (line 226). Live line 214: \"Advisors talked among themselves, their voices an echoing hum in the huge hall.\"\n\n**What this is really asking:** Simple typo catch.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** Fixed in the live text. (A pleasing accidental typo, given the chapter — but fixed.)\n\n**Suggested edit:** None — resolved.","head":"","tail":"","rationale":"note 9d809b7f-0c30-4345-9a9b-17793915c60d · priority low","draft":""},{"chapter":"2","seq":545,"type":"iz note","size":"low","title":"IZ · King's description — merge the choppy fragments","proposal":"**Iz said:** \"He was broad…with a serious,,,and his hair\" — merge the old fragmented description (\"The King a large man. Broad...\") into one flowing sentence.\n\n**The passage now:** Live line 232: \"The King was a large man, broad through the chest, his brow set in a permanent seriousness, his hair going silver at the temples.\" Followed by the eleven-minerals crown band.\n\n**What this is really asking:** She wanted the staccato fragments consolidated into a single descriptive sentence.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** The live sentence is exactly the merge she sketched, plus the crown band with the eleven unpolished minerals — a strong concrete object that carries the extraction theme without comment. Done.\n\n**Suggested edit:** None — resolved.","head":"","tail":"","rationale":"note 4dd6503e-5383-4126-badb-62a45860c740 · priority low","draft":""},{"chapter":"2","seq":546,"type":"iz note","size":"low","title":"IZ · Loud cart nobody noticed — the \"Ah yes, Burgundy\" implausibility","proposal":"**Iz said:** Liked the \"Thundered\" beat but flagged: with the cart so loud, it's confusing that they didn't notice him earlier — emphasize how engrossed they were.\n\n**The passage now:** The \"Ah yes, Burgundy\" / \"You asked to see me\" exchange is struck (lines 252–262). Live text: the advisors notice him progressively — \"As he arrived at the foot of the dais, the group started to go silent and look\" (line 240), then \"'Burgundy,' the King said, and the hall finished going quiet around the name\" (line 244).\n\n**What this is really asking:** A logic catch: the old draft had the King act surprised by a boy who'd been scraping a coin across slate for the length of the hall.\n\n**Status:** ALREADY ADDRESSED by the big edit — confirm & close\n\n**Bill's take:** The rewrite dissolved the implausibility rather than patching it: notice now spreads as he crosses the hall, and the King addresses him on arrival instead of being startled. \"The hall finished going quiet around the name\" is doing lovely work. Nothing left of her concern.\n\n**Suggested edit:** None — resolved by the restaged arrival.","head":"","tail":"","rationale":"note fa49ee18-d06f-4c36-9982-62ee86fa9b99 · priority low","draft":""},{"chapter":"2","seq":547,"type":"iz note","size":"low","title":"IZ · \"The wheel was loud again\" → one scrape","proposal":"**Iz said:** \"With one loud scrape\" — for the robot's single step forward, one sound, not a resumed noise.\n\n**The passage now:** Live at line 250: \"Burgundy stepped forward and so did the robot. The wheel was loud again. Then it parked and lit up...\"\n\n**What this is really asking:** Naturalist precision: one short movement makes one sound. \"Was loud again\" narrates a state where the moment contains a single event.\n\n**Status:** LIVE — needs your ruling\n\n**Bill's take:** Partially agree. Her ear is right about
