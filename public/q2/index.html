<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill · BURGUNDY — The Edit Proposal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%99%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --paper:#f3ead9; --paper-2:#efe4cf; --card:#faf3e6; --ink:#211a14; --ink-soft:#5b4f42;
    --ink-faint:#8a7c69; --rule:#d8c8ab; --oxblood:#7c2130; --red:#b8332c; --gold:#a9853f;
    --green:#4a6741; --blue:#3d5a6e; --purple:#5d4a6e;
    --shadow:0 1px 0 rgba(120,90,40,.08), 0 12px 34px -20px rgba(60,40,20,.55);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --disp:"Hoefler Text","Iowan Old Style",Palatino,Georgia,serif;
    --mono:"SF Mono",ui-monospace,"Menlo","Consolas",monospace;
  }
  html[data-theme="night"]{
    --paper:#171310; --paper-2:#1d1813; --card:#221b15; --ink:#eadfce; --ink-soft:#c3b39a;
    --ink-faint:#8c7c66; --rule:#3a2f24; --oxblood:#d98a92; --red:#e0776d; --gold:#d6b673;
    --green:#8fb283; --blue:#8ab0c4; --purple:#b09ac4;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 14px 40px -22px rgba(0,0,0,.85);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);
    color:var(--ink); font-family:var(--serif); font-size:17.5px; line-height:1.6; padding-bottom:110px}
  .wrap{max-width:860px; margin:0 auto; padding:0 20px}
  header.masthead{padding:52px 0 20px; text-align:center}
  .emblem{display:inline-flex; align-items:baseline; gap:.04em; font-family:var(--disp); font-size:60px; line-height:1}
  .emblem .b{color:var(--ink); font-weight:600; position:relative; padding-bottom:6px}
  .emblem .b::after{content:""; position:absolute; left:2%; right:2%; bottom:0; height:4px; background:linear-gradient(90deg,var(--red),var(--oxblood)); border-radius:2px}
  .spark{color:var(--gold); font-size:24px; transform:translateY(-20px); margin-left:2px}
  .kicker{font-family:var(--mono); font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--ink-faint); margin:20px 0 6px}
  h1.title{font-family:var(--disp); font-weight:600; font-size:36px; line-height:1.1; margin:.1em 0 .15em}
  .byline{font-family:var(--mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--oxblood); margin-top:14px}
  .rule{height:1px; background:linear-gradient(90deg,transparent,var(--rule) 15%,var(--rule) 85%,transparent); margin:28px 0}
  .letter{background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:26px 28px 22px; box-shadow:var(--shadow); position:relative}
  .letter::before{content:"how to use this"; position:absolute; top:-9px; left:22px; background:var(--card); padding:0 10px; font-family:var(--mono); font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--gold)}
  .letter p{margin:0 0 12px} .letter p:last-child{margin-bottom:0}

  /* legend */
  .legend{display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 0}
  .lg{display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); border:1px solid var(--rule); border-radius:20px; padding:4px 11px}
  .lg .sw{width:10px; height:10px; border-radius:3px; display:inline-block}

  /* chapters */
  .chap{margin-top:44px}
  .chap-head{display:flex; align-items:center; gap:12px; background:var(--paper); padding:10px 0; border-bottom:1px solid var(--rule)}
  .chap-head h2{font-family:var(--disp); font-weight:600; font-size:24px; margin:0}
  .chap-head .cnt{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--ink-faint); text-transform:uppercase}

  /* edit cards */
  .ed{background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:16px 18px; margin:14px 0; border-left-width:4px; border-left-style:solid}
  .ed[data-t="age-fix"], .ed[data-t="line-edit"], .ed[data-t="timing-marker"]{border-left-color:var(--gold)}
  .ed[data-t="new-paragraph"]{border-left-color:var(--green)}
  .ed[data-t="new-scene"], .ed[data-t="new-chapter"]{border-left-color:var(--oxblood)}
  .ed[data-t="restructure"]{border-left-color:var(--red)}
  .ed[data-t="flashback-slot"], .ed[data-t="parked"]{border-left-color:var(--purple)}
  .ed[data-t="open-question"]{border-left-color:var(--blue)}
  .ed-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px}
  .pill{font-family:var(--mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; padding:3px 8px; border-radius:20px; border:1px solid var(--rule); color:var(--ink-soft)}
  .pill.type{font-weight:600}
  .ed[data-t="new-scene"] .pill.type, .ed[data-t="new-chapter"] .pill.type{color:var(--oxblood); border-color:var(--oxblood)}
  .ed[data-t="new-paragraph"] .pill.type{color:var(--green); border-color:var(--green)}
  .ed[data-t="restructure"] .pill.type{color:var(--red); border-color:var(--red)}
  .ed[data-t="flashback-slot"] .pill.type, .ed[data-t="parked"] .pill.type{color:var(--purple); border-color:var(--purple)}
  .ed[data-t="open-question"] .pill.type{color:var(--blue); border-color:var(--blue)}
  .ed[data-t="age-fix"] .pill.type, .ed[data-t="line-edit"] .pill.type, .ed[data-t="timing-marker"] .pill.type{color:var(--gold); border-color:var(--gold)}
  .ed h4{font-family:var(--disp); font-weight:600; font-size:19px; margin:0 0 7px; line-height:1.25}
  .ed .prop{margin:0 0 10px; font-size:16px}
  .ed .why{font-size:13.5px; color:var(--ink-faint); font-style:italic; margin:0 0 10px}
  .ed .draft{font-size:14.5px; color:var(--ink-soft); background:var(--paper-2); border:1px dashed var(--rule); border-radius:8px; padding:9px 12px; margin:0 0 10px}
  .ed .draft b{font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:400; display:block; margin-bottom:4px}
  .anchor{font-size:13px; color:var(--ink-faint); margin:0 0 12px; line-height:1.5}
  .anchor .h,.anchor .t{font-style:italic}
  .anchor b{font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; font-style:normal; color:var(--ink-faint); margin-right:4px}
  .anchor .mark{color:var(--oxblood); font-weight:700; font-style:normal; padding:0 3px}

  /* verdict row */
  .verd{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .vbtn{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; padding:7px 14px; border-radius:8px; border:1px solid var(--rule); background:transparent; color:var(--ink-soft); cursor:pointer; transition:.12s}
  .vbtn:hover{border-color:var(--ink-soft)}
  .vbtn.acc.on{background:var(--green); border-color:var(--green); color:var(--paper)}
  .vbtn.rej.on{background:var(--red); border-color:var(--red); color:var(--paper)}
  .cmt{flex:1; min-width:160px}
  .cmt input{width:100%; background:var(--paper); color:var(--ink); border:1px solid var(--rule); border-radius:8px; padding:8px 11px; font-family:var(--serif); font-size:14px}
  .cmt input:focus{outline:none; border-color:var(--oxblood)}

  .bar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--paper); border-top:1px solid var(--rule)}
  .bar-in{max-width:860px; margin:0 auto; padding:11px 20px; display:flex; align-items:center; gap:14px}
  .progress{flex:1; display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:11.5px; color:var(--ink-soft)}
  .track{flex:1; height:6px; background:var(--rule); border-radius:6px; overflow:hidden; max-width:240px}
  .fill{height:100%; width:0; background:linear-gradient(90deg,var(--oxblood),var(--gold)); transition:width .3s}
  button.act{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--oxblood); color:var(--paper); background:var(--oxblood); padding:9px 14px; border-radius:8px; cursor:pointer}
  button.ghost{background:transparent; color:var(--oxblood)}
  .theme-btn{position:absolute; top:16px; right:18px; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); background:transparent; border:1px solid var(--rule); border-radius:20px; padding:5px 11px; cursor:pointer}
  .toast{position:fixed; bottom:70px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0; background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:10px; font-size:13.5px; font-family:var(--mono); transition:.25s; pointer-events:none; z-index:50}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  @media(max-width:640px){ h1.title{font-size:30px} .emblem{font-size:50px} .letter{padding:20px} .ed{padding:14px} }
</style>
</head>
<body>
<button class="theme-btn" id="themeBtn">☾ night</button>
<div class="wrap">
  <header class="masthead">
    <div class="emblem"><span class="b">B</span><span class="spark">✦</span></div>
    <div class="kicker">Bill · your story wizard</div>
    <h1 class="title">BURGUNDY: The Edit Proposal</h1>
    <div class="byline" id="byline"></div>
  </header>

  <div class="letter" id="intro"></div>

  <div class="legend" id="legend"></div>

  <div id="chapters"></div>
</div>

<div class="bar"><div class="bar-in">
  <div class="progress"><span id="pText">0 ruled</span><span class="track"><span class="fill" id="fill"></span></span></div>
  <button class="act ghost" id="accAllBtn" title="accept everything not yet ruled">accept rest</button>
  <button class="act ghost" id="clearBtn">clear</button>
  <button class="act" id="exportBtn">export ↧</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
const DATA = {"intro":"**PART 1 IS IN THE BOOK.** Here's where things stand, and what's left.\n\n**What happened since you ruled on edits 1–81:** Bill wrote real prose for all 81 rulings, your editor went through every entry (15 surgical prose fixes, notes on all 69 items, verdict: \"ready for insertion\"), and the whole package has been machine-inserted into the manuscript with verified anchors — 76 operations, every one landing exactly once, plus the chapter merge (old ch2+ch3 are now Chapter 2, \"I Rule Men\"; the book is 21 chapters). Four adversarial review agents then fine-tooth-combed the rewritten book for style, seams, and timeline. The mechanical catches were fixed on the spot; anything needing YOUR judgment is now a card below under \"NEW — needs a ruling.\"\n\n**Where to read it:** your Author's Edition at mycoldmars.com/burgundy/johnny (same password). Every applied edit renders as a green suggested edit you can tap — accept it, note yourself, or send Bill a change note; it all funnels to your feedback space at /q3.\n\n**What's below:** the 42 edits you haven't ruled yet (82–123, from mid-ch17's return detonation onward — old chapter numbers preserved so the anchors stay findable), plus 11 new ruling cards from the implementation round. Same drill: accept, reject, or comment, and export when done.","edits":[{"chapter":"13","seq":900,"type":"open question","size":"ruling","title":"The \"public descent\" shares its name with the Midsteam Descent — deliberate or rename?","proposal":"The King's execution practice in the new preserve scene is called \"a public descent\" — and the sacred festival is the Midsteam Descent. Your editor's vote: LEAN IN — the execution wearing the holy rite's name is exactly this regime, and the King could acknowledge it in one clause when you red-ink the scene (\"they borrowed the name from the festival, which tells you something about my great-great-grandfather\"). ACCEPT = keep the collision on purpose (Bill adds the acknowledging clause). REJECT = Bill renames the practice (e.g. \"a public lowering\"). COMMENT = your own name for it.","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation and fine-tooth review.","draft":""},{"chapter":"6","seq":901,"type":"open question","size":"ruling","title":"The 20-year moon mechanism: is a Vicentennial year the PERFECT lock?","proposal":"You locked the annual Twinrise (the moons drift together all year and lock for one week mid-Steam). Old canon had the moons conjoining every ~20 years as the Vicentennial's cause. Proposed reconciliation, which the prose now quietly leaves room for (your editor softened \"perfect ring\" on the annual lock for exactly this reason): every year the moons lock, but once every twenty years the lock is EXACT — one moon perfectly centered on the other — and a perfect-lock year is a Vicentennial year. ACCEPT = that's canon. COMMENT = your own mechanism.","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation and fine-tooth review.","draft":""},{"chapter":"16","seq":902,"type":"open question","size":"ruling","title":"\"The full moon\" under the two-moon sky — one ruling for the whole book","proposal":"The narration line is now the two-shadows image (\"The moons did the sun's work, and every man on the path threw two shadows, blue across the drifts\") per your editor. But Tuck's dialogue still keys the whole escape plan to \"the full moon\" (twice in ch16), and ch21 has three more. Options: (A) \"full moon\" is Dross vernacular for the both-moons-full nights — folk speech doesn't obey astronomy; keep it everywhere in dialogue (one-line canon note, zero prose changes). (B) Key it to one named moon: \"when the Bruise comes full.\" (C) Recast the guards' drinking tradition to some other hook. Bill's vote: A. ACCEPT = A. COMMENT = B or C.","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation and fine-tooth review.","draft":""},{"chapter":"16","seq":903,"type":"open question","size":"ruling","title":"The TKTKTK in your speech to Ran — the thing the King never asked about","proposal":"Burgundy's confrontation with Ran still carries a raw placeholder: \"And I'll tell you what else he doesn't know, because he's never once asked. He doesn't know TKTKTK.\" The payload — the concrete thing his father has never asked — is yours to supply. Canon-safe candidates: that his son has been over the wall since fifteen; the boy in South 12; that his own palace sits on a corvite seam. Or COMMENT with the real line. (REJECT = cut the sentence cleanly and let \"I've sat there for more than two years listening...\" carry the speech.)","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation and fine-tooth review.","draft":""},{"chapter":"6","seq":904,"type":"open question","size":"ruling","title":"The struck grease-and-voice passage in the disguise beat — delete or restore?","proposal":"Old ch7's disguise paragraph still contains a strikethrough span: \"~~and grease worked into the hands, which was no trouble, Burgundy's hands were never clean. The one thing Tuck could not fix was the voice.~~\" It was marked deleted but never executed. Option A: honor the strike and delete (Tuck's \"Dontchu talk to anyone\" line still sets up the pepper-seller slip). Option B: restore it un-struck — \"the one thing Tuck could not fix was the voice\" is a clean plant for the slip. Bill's vote: B, restored. ACCEPT = restore. REJECT = delete.","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation and fine-tooth review.","draft":""},{"chapter":"11","seq":905,"type":"open question","size":"ruling","title":"The ladderfinch: \"small, tall\" — pick the bird's shape","proposal":"The ladderfinch is described as \"a small, tall red bird with black lines on its back\" — self-contradictory, likely an abandoned revision. Bill's candidate (honors the ladder name and the mine-climbing life): \"a small, upright red bird.\" Simplest: just \"a small red bird.\" ACCEPT = \"small, upright.\" COMMENT = your bird.","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation and fine-tooth review.","draft":""},{"chapter":"12","seq":906,"type":"open question","size":"ruling","title":"Two negations in the post-hunt paragraph — pick which one keeps the slot","proposal":"The post-hunt realization runs two not-X-but-Y constructions back to back: \"It was not a condition. It was maintained.\" and \"his father was not trapped in the system, his father was the system.\" House law caps the move at one per chapter even when both are strong. Bill's vote (and the reviewers'): keep \"his father WAS the system\" (the paragraph's true payoff) and flatten the first to \"It was maintained.\" ACCEPT = that. REJECT = keep both (override the cap here).","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation and fine-tooth review.","draft":""},{"chapter":"2","seq":907,"type":"open question","size":"ruling","title":"The King's speech does NOT mention finding a wife — confirm","proposal":"Your notes once had the King \"maybe mentioning finding a wife\" at the rejection. Bill left the wife out and your editor endorsed it: the tour named-but-unexplained in ch2 is what makes Mira's white-room revelation detonate — the reader, like Burgundy, has heard the word and doesn't know what it costs. ACCEPT = confirmed. REJECT = Bill adds a one-clause wife mention to the speech.","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation and fine-tooth review.","draft":""},{"chapter":"5","seq":908,"type":"open question","size":"ruling","title":"Essa and the quilts: she STARTED them, Tuck's mother continued — bless the reconciliation","proposal":"Continuity catch: ch13 (old 14) locks Essa's death when the boys were about six, so she can't have sewn thirteen more years of birthday squares. As written now: Essa sewed the first years of squares into the two quilts; after she was gone, Tuck's mother kept the quilts growing. The ch13 detonation still lands (her hands STARTED the quilt on his bed; the pillows were her last work). ACCEPT = canon. COMMENT = different heir to the needle.","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation and fine-tooth review.","draft":""},{"chapter":"—","seq":909,"type":"open question","size":"ruling","title":"Audio for the edited chapters is stale — regenerate now or wait?","proposal":"The Author's Edition plays the existing chapter audio, but chapters 1–16 changed under the big edit, so narration and text disagree wherever edits landed. Regenerating those chapters costs real ElevenLabs credits and should be a decision, not a default. ACCEPT = regenerate all edited chapters now. COMMENT = regenerate only specific chapters (name them), or wait until after you accept/red-ink the suggested edits so we only pay for final text (Bill's recommendation).","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation and fine-tooth review.","draft":""},{"chapter":"13","seq":910,"type":"open question","size":"ruling","title":"The public-descent scene awaits your red ink","proposal":"You said \"you can try to write this and I'll edit.\" It's written (the crowd-controlled winch: a man comes back up when a neighbor asks for him by name, and the name goes in the book) and both your editor and Bill's reviewers think it should survive largely intact — but it's yours. It's a green suggested edit in the Author's Edition; edit or annotate it there, or COMMENT here.","head":"","tail":"","rationale":"Surfaced during the Part 1 implementation and fine-tooth review.","draft":""},{"chapter":"17","seq":5,"type":"new-scene","size":"medium","title":"THE RETURN DETONATION: then/now market pass","proposal":"I'm going to expand the two-sentence market pass into the full then/now comparative sequence, roughly 300-450 words inserted after the fifteen-again sentence: the memory breaks against the present one concrete detail at a time. A checkpoint with a brazier and helmeted soldiers now sits at the mouth of the straight road where the open lane used to run, and Tuck cuts down a side lane without breaking stride; the frying woman still works her oil but works it silent, no long complaint about her son; the singing cook's stall is lit and quiet; and then the thing he could not see at fifteen and can see now, a grey helmet moving up a lane and the lane adjusting around it, talk changing pitch a stall ahead of the soldier and settling a stall behind, a whole row of shoulders making the same small movement at the same moment. I'll close on a concrete object and rejoin \"Nobody looked at them.\" No aphorisms, no em dashes, comparative eye only; his ignorance in ch7 stays untouched. (Drafting note: the patrol stays unnamed as to whose it is; recommend a crown patrol, keeping Nicholas's men statue-ringed and uncanny.)","head":"again and the whole warm loud world was his to walk through.","tail":"Nobody looked at them. The Freeze kept every head down and every scarf up.","rationale":"Locked staging: the full detonation lands on the return, not in ch7.","draft":""},{"chapter":"17","seq":6,"type":"new-paragraph","size":"small","title":"Tuck's swallowed sentence on the walk down","proposal":"I'm going to add a short beat between the market and Ran's yard: Tuck starts to say something real about the crown, stops mid-sentence, checks the length of the lane once, and folds it into a loud joke; Burgundy laughs where the laugh belongs and says nothing. The recognition stays interior and unstated.","head":"The Freeze kept every head down and every scarf up. Being nobody was easy in the cold.","tail":"Ran's yard sat where it had always sat, the heaps taller under the snow,","rationale":"Locked beat: surveillance on a loved face; Burgundy sees it and says nothing.","draft":"Tuck started to say something about the crown, got three words into it, and stopped with the sentence still in his mouth. His eyes went up the lane, once, the whole length of it. Then he was loud again, a story about a cheese wheel that rolled into the soup vat. Burgundy laughed where the laugh belonged and said nothing."},{"chapter":"17","seq":7,"type":"line-edit","size":"small","title":"Fill the TK with the Essa line","proposal":"I'm going to replace \"He doesn't know TKTKTK\" with the Essa fact, spoken plainly to Ran: his father doesn't know the name of the woman who sewed the cushions he hunts from, asked only whether they'd finish on schedule while she was dying, and Burgundy knows her name. It answers Ran's challenge with the one thing an informer couldn't fake: which side of the wall his eyes are on.","head":"\"My father doesn't know I'm here.\" Burgundy said it flat.","tail":"I've sat there for almost two years listening to the men who run this planet","rationale":"The Essa irony is the locked spine; this makes the ch19 recognition and the quilt canon detonate backward.","draft":"Replace \"He doesn't know TKTKTK\" with: \"He doesn't know the name of the woman who sewed the cushions he hunts off of. She was dying while she finished them, and he asked one question: whether they'd be done on schedule. I know her name.\""},{"chapter":"17","seq":8,"type":"timing-marker","size":"tiny","title":"Almost two years becomes more than two years","proposal":"I'm going to change \"almost two years\" to \"more than two years\": council began the morning after his 17th birthday and it's now about two years and three months, so \"almost\" points the wrong way.","head":"because he's never once asked. He doesn't know TKTKTK","tail":"listening to the men who run this planet talk about you and your neighbors","rationale":"Checked in place per the digest's instruction; ~2.25 years of council.","draft":"Change \"I've sat there for almost two years listening\" to \"I've sat there for more than two years listening\"."},{"chapter":"18","seq":1,"type":"parked","size":"small","title":"Parked flashback slot at the osmarine sphere","proposal":"I'm going to reserve a slot here, not write it: at the first sight of bare refined osmarine hanging in its cradle in his own hands, a short flashback or fragment-seed goes in (tutor-memory or extraction-system fragment). Trigger: the sphere itself, the most controlled substance in the galaxy sitting on his bench. Content to come from Johnny's geopolitics; no prose now.","head":"And inside it, an ivort white sphere, mounted into a cradle with a spinning mechanism.","tail":"There was already a small perfect hole drilled through the center of the sphere.","rationale":"Geopolitics parked; the digest assigns this exact slot.","draft":""},{"chapter":"18","seq":2,"type":"line-edit","size":"tiny","title":"Fix \"walked wheeled\" doubled verb","proposal":"I'm going to change \"He walked wheeled this first DREKKO over\" to \"He wheeled this first DREKKO over\", removing the doubled verb at the start of the first-dig beat.","head":"The report had called this moment *magnetically suspended rotation.*","tail":"to the corvite face that had thrown it a week ago,","rationale":"Mechanical fix on the chapter's pivotal beat.","draft":"Change \"He walked wheeled this first DREKKO over\" to \"He wheeled this first DREKKO over\"."},{"chapter":"18","seq":3,"type":"new-paragraph","size":"small","title":"Want-engine echo: nine months to the Vicentennial","proposal":"I'm going to add a two-sentence beat after the first successful cut: nine months to the Vicentennial, and for one breath he lets himself see the three machines rolling up the worn pale path of the Kings' Hall on their own treads, no one laughing; then back to work. It keeps the forming plan load-bearing and doubles as the months-register countdown.","head":"and for one long breath it was the finest thing he had ever made.","tail":"He spent the next week rigging all three of his DREKKOs with osmarine spheres","rationale":"Want-engine threaded mid-build; \"no one laughing\" pays off the ch3 advisor's laugh.","draft":"Nine months to the Vicentennial. For one breath he let himself see it: the three of them rolling up the worn pale path of the Kings' Hall on their own treads, and no one laughing. Then he went back to work."},{"chapter":"18","seq":4,"type":"line-edit","size":"tiny","title":"Cage location: chest contradicts back","proposal":"I'm going to change \"in the cage he wleded inside their chest\" to \"in the cages he had welded onto their backs\", because six lines earlier the cage is mounted on the back of the DREKKO and ch15's paper puts the housing at the machine's rear; this also kills the \"wleded\" typo.","head":"He spent the next week rigging all three of his DREKKOs with osmarine spheres","tail":"and calculated that this increased each DREKKO's mass by seven thousand percent.","rationale":"Internal consistency: the green chest panel is the brain's home; housing is rear-mounted.","draft":"Change \"with osmarine spheres in the cage he wleded inside their chest.\" to \"with osmarine spheres in the cages he had welded onto their backs.\""},{"chapter":"18","seq":5,"type":"line-edit","size":"tiny","title":"Mass becomes effective mass","proposal":"I'm going to change \"increased each DREKKO's mass by seven thousand percent\" to \"increased each DREKKO's effective mass at the rock face by seven thousand percent\", because osmarine has negative mass; adding spheres makes the machine lighter (Ran's basket comes down too easily), while the anchoring effect is what multiplies.","head":"with osmarine spheres in the cage he wleded inside their chest.","tail":"he started to notice what would become his final challenge: The robots got stuck.","rationale":"Engineering register is Burgundy's soul; the physics has to hold.","draft":"Change \"this increased each DREKKO's mass by seven thousand percent\" to \"this increased each DREKKO's effective mass at the rock face by seven thousand percent\"."},{"chapter":"18","seq":6,"type":"line-edit","size":"tiny","title":"Delete duplicated robots-got-stuck paragraph","proposal":"I'm going to delete the first of the two near-identical paragraphs (\"As he put the robots to work on the wall... The robots got stuck.\"), keeping the second, which flows into \"He saw it first on a single machine.\"","head":"and calculated that this increased each DREKKO's mass by seven thousand percent.","tail":"he started to notice what would become his final challenge. The robots got stuck.","rationale":"Straight drafting duplication; one instance carries the turn.","draft":"Delete the paragraph ending \"...his final challenge: The robots got stuck.\" (the colon version); keep the following near-identical paragraph."},{"chapter":"18","seq":7,"type":"timing-marker","size":"tiny","title":"Elapsed marker: Twinrise near three months gone","proposal":"I'm going to add one plain sentence at the plateau: \"Twinrise was near three months gone, and the Freeze had shut over the city.\" It pins the firm preserve-to-South-12 window in narration without a header or day-count.","head":"climbed for a week or two and then settled onto a competence that never became mastery.","tail":"Every real improvement still ran through him, his read of the log, his rewrite, his upload,","rationale":"Locked +3 months window, timing said plainly in the text.","draft":"Insert as its own sentence before \"Every real improvement still ran through him\": \"Twinrise was near three months gone, and the Freeze had shut over the city.\""},{"chapter":"18","seq":8,"type":"line-edit","size":"small","title":"End chapter 18 on the seam, not the verdict","proposal":"I'm going to reorder the final two paragraphs so the chapter ends on the barely scarred seam standing in the lamplight instead of on the abstract verdict, per the end-on-an-object rule; the replaced text is the current final two paragraphs from \"He shut the machines down\" to \"teach themselves to get better.\"","head":"Nobody had cracked it there. He certainly had not cracked it here.","tail":"","rationale":"Chapters end on an object; the scarred seam carries the failure.","draft":"He shut the machines down one at a time, and the cell went quiet. The strongest digging machines ever built on Dross, and worth nothing, none of it, until they could teach themselves to get better. The seam the first one had been worrying all night stood in the lamplight, barely scarred."},{"chapter":"19","seq":1,"type":"line-edit","size":"small","title":"Essa's hand known instantly, through the quilt","proposal":"I'm going to replace \"he knew, though it took him a moment to place it, and when he placed it he wished he had not. Essa's hand.\" with an instant recognition: he knows the stitching because he has slept under it his whole life. With the quilt canon planted early, the lounge cushions detonate backward through the whole book.","head":"The carpet took his boots to the ankle. The cushions heaped in the chairs were velvet, deep red,","tail":"The old woman had sewn for this palace until the Freeze took her,","rationale":"The quilt canon makes Essa's stitching intimate since infancy; quietest payoff of the Essa irony.","draft":"Change to: \"...stitched in a fine close hand he knew at once, because he had slept under it his whole life. Essa's hand.\" Then keep \"The old woman had sewn for this palace until the Freeze took her...\" as is."},{"chapter":"19","seq":2,"type":"line-edit","size":"tiny","title":"Fix \"out little...chats\" in the King's mouth","proposal":"I'm going to change \"to join us from here for out little...chats\" to \"to join us for our little...chats\", fixing the typo and the awkward \"from here\" in the King's welcome line.","head":"He waved at a box of them on the table. Burgundy did not take one.","tail":"The King had invited Burgundy tonight promising that this was the *real council,*","rationale":"The King's lines carry the visible-face read; no mechanical wobble.","draft":"Change \"You're old enough now to join us from here for out little...chats.\" to \"You're old enough now to join us for our little...chats.\""},{"chapter":"19","seq":3,"type":"open-question","size":"small","title":"Optional variant: King disposes of the taken men himself","proposal":"I'm flagging a second open question for Johnny, paired with the ch13 one: how much of the King's own-hands cruelty should Burgundy and the reader see here? My ch19 check says the visible-face beats already land (the kind-voiced \"It's always a few,\" the flat \"Find me the buyer\"), so this is optional strengthening. If you want a present-tense own-hands act here, I'd insert one breath after Oz's report: the King, not looking up from the cigar, rules on the taken men in the flat accounting voice. The primary recommended option remains the ch13 preserve disposition; don't take both at full strength.","head":"and we took care of it. We took two or three of the offenders.","tail":"\"It's always a few,\" his father said, comfortable, turning the cigar in his fingers.","rationale":"The own-hands act is an open item awaiting Johnny's ruling; this is the ch19-shaped variant.","draft":"Option: \"Hold them through the Freeze, then down the hole,\" the King said, and tapped his ash. \"Families off the stipend rolls.\""},{"chapter":"19","seq":4,"type":"line-edit","size":"tiny","title":"Oz's intel: sawing open contradicts Ran","proposal":"I'm going to change \"He was sawing them open for what's inside\" to \"He was hoarding them for what's inside\", because Ran says on the page he never cracked one and sold all twelve intact weeks before the arrest.","head":"\"The lift cores. The ones under the cage floors, that carry the harvest up the shafts.","tail":"\"And how are lift cores ending up in a scrap yard.\"","rationale":"Consistency with ch17; accurate intelligence is scarier for Burgundy.","draft":"Change \"He was sawing them open for what's inside.\" to \"He was hoarding them for what's inside.\""},{"chapter":"19","seq":5,"type":"timing-marker","size":"tiny","title":"Weeks marker: the cores moved weeks back","proposal":"I'm going to extend Oz's answer by one sentence so the elapsed time since the Ran purchase is said out loud: the cores moved some weeks back, all at once. It threads the weeks-register timing and warms the trail pointing at Burgundy.","head":"\"Floaters. And who was he selling the stuff to?\"","tail":"Oz laid a folded paper on the table. \"But he'd done well for a junk man.","rationale":"Timing said out loud; a single buyer taking the lot raises the stakes.","draft":"Change \"That we haven't found.\" to \"That we haven't found. The cores moved some weeks back, the neighbors say. All twelve at once.\""},{"chapter":"19","seq":6,"type":"line-edit","size":"tiny","title":"Fix \"hit heart\" at the panic beat","proposal":"I'm going to change \"hit heart was going so hard\" to \"His heart was going so hard\", fixing the typo at the chapter's highest-pressure moment.","head":"There was a silence while the men puffed their cigars.","tail":"They had Ran. Ran was in a hole somewhere in the dark right now.","rationale":"Mechanical fix on the beat the chapter turns on.","draft":"Change \"Burgundy sat very still in the honey light. hit heart was going so hard\" to \"Burgundy sat very still in the honey light. His heart was going so hard\"."},{"chapter":"20","seq":1,"type":"line-edit","size":"tiny","title":"Fix 'spring out of his bed'","proposal":"I'm going to change 'he spring out of his bed' to 'he sprang out of his bed'.","head":"So before the clock struck midnight","tail":"and rushed through the dark palace toward his dungeon-turned-lab","rationale":"Copyedit on a sentence load-bearing for the chapter's urgency.","draft":"change \"he spring out of his bed\" to \"he sprang out of his bed\""},{"chapter":"20","seq":2,"type":"line-edit","size":"small","title":"De-duplicate the clean-labs phrase from ch18","proposal":"I'm going to recast the ch20 repeat of ch18's closing phrase ('clean labs, on simple rigs, in air scrubbed of dust and heat') so the idea returns without the verbatim echo: 'These researchers had proved all this in rooms that had never held rock dust, on rigs that never left a bench, in air with none of the grit and heat and physics that made his machines choke.'","head":"somewhere in the reading he had understood something: These researchers had proved all this","tail":"None of them had ever spent a night on their back under a machine","rationale":"The repeated stock phrase reads as filler on second use.","draft":"Replace \"only in clean labs, on simple rigs, in air scrubbed of the dust and heat and the physics that made his machines choke.\" with \"in rooms that had never held rock dust, on rigs that never left a bench, in air with none of the grit and heat and physics that made his machines choke.\""},{"chapter":"20","seq":3,"type":"line-edit","size":"small","title":"Kill 'final frontier,' keep the irrational Ran-engine","proposal":"I'm going to replace the vague 'He could feel he was arriving at a final frontier. And he could feel that whatever this meant, it would result in some way to free Ran. Or at least ensure his safety until they could let him out. / So he worked the problem.' with two hard sentences: 'There was no line he could draw from a learning loop to Ran's cell. He worked the problem anyway.' The cliché goes, the guilt-driven engine stays, and the reader infers the rest.","head":"All he had to do was implement their theories into reality and he would be ahead of them.","tail":"The sensor buses that fed data from the machine's arms to its brain","rationale":"No scale-noun grandeur; THE LAST STEP: state the fact and stop.","draft":"Replace the quoted three sentences plus \"So he worked the problem.\" with: \"There was no line he could draw from a learning loop to Ran's cell. He worked the problem anyway.\""},{"chapter":"20","seq":4,"type":"age-fix","size":"tiny","title":"Explosives built weeks ago, not a year","proposal":"I'm going to change 'He had built them a year ago' to 'He had built them weeks ago.' Under the locked timeline the micro-charges were machined in the ch15 build window, and the whole preserve-to-South-12 stretch is a firm three months, so 'a year' is now impossible.","head":"the micro-charges down off the back shelf. He had built them","tail":"a magazine of little explosives the size of beads.","rationale":"The firm three-month window makes in-window durations weeks, not years.","draft":"change \"a year ago\" to \"weeks ago\""},{"chapter":"20","seq":5,"type":"line-edit","size":"tiny","title":"Repair the garbled Ran's-cell sentence","proposal":"I'm going to fix the broken clause ', in two places at once, the ran's cell and the seam hi Robots were working on armed with a hundred new experiments.' to read ', in two places at once: Ran's cell, and the seam his robots were working with a hundred new experiments loose on it.'","head":"Council was a blur he moved through with his body while his mind stayed forty feet down","tail":"He got through the grain reports.","rationale":"Colon reveals, plain language, on the double-life tension sentence.","draft":"Replace the garbled clause with \", in two places at once: Ran's cell, and the seam his robots were working with a hundred new experiments loose on it.\""},{"chapter":"20","seq":6,"type":"line-edit","size":"tiny","title":"Fix 'as we nodded off'","proposal":"I'm going to change 'as we nodded off' to 'as he nodded off' to hold close third.","head":"through a dispute between two southern governors. Twice his head dipped","tail":"chin to chest, and the second time he surfaced","rationale":"Close third on Burgundy is locked.","draft":"change \"as we nodded off\" to \"as he nodded off\""},{"chapter":"20","seq":7,"type":"line-edit","size":"tiny","title":"Clean the tribute-ships sentence","proposal":"I'm going to fix the garbled pair of sentences at the ships' arrival so they read: 'They stopped to hang in the air a hundred meters up, without wings, without any visible propulsion, just a deep low pressure that Burgundy could feel in his molars.'","head":"each the length of the palace and its grounds laid end to end.","tail":"White arms unfolded from the ships' bellies, joint after joint after joint","rationale":"The molars detail is Cargo-Test gold and must land clean.","draft":"Replace the two garbled sentences with: \"They stopped to hang in the air a hundred meters up, without wings, without any visible propulsion, just a deep low pressure that Burgundy could feel in his molars.\""},{"chapter":"20","seq":8,"type":"timing-marker","size":"small","title":"King speaks the Vicentennial: nine months out","proposal":"I'm going to put the looming date in the King's mouth on the platform. Replace 'You'll be king someday, sooner than either of us would like, how fast years are going.' with 'You'll be king sooner than either of us would like. Nine months to the Vicentennial. Look how fast the years go.' A spoken marker, no header, no day-count, and it quietly hangs the coronation date over everything the Freeze will cover.","head":"You've become a great prince. I want you to know I see it.","tail":"And for the first time I believe you're ready for it.","rationale":"Ladder rung plus a foundations-only seed of the crowned-above climax at the next Twinrise.","draft":"Replace \"You'll be king someday, sooner than either of us would like, how fast years are going.\" with \"You'll be king sooner than either of us would like. Nine months to the Vicentennial. Look how fast the years go.\""},{"chapter":"20","seq":9,"type":"new-paragraph","size":"small","title":"Wound beat: seen at last, and seen as the coat","proposal":"I'm going to insert one short interior paragraph between the ships leaving and 'Thank you, Father,' so the kindest-thing line detonates against the wound: his father finally looks at him longer than he ever has, and what is being seen is the function he built, not him. Present-tense only, the hands carry it, never the word ashamed.","head":"The pressure lifted out of his molars. The cargo field was empty.","tail":"\"Thank you, Father,\" he said.","rationale":"Pillar I wound (seen as function, not himself) against the visible-face King, via the engineer's-hands device.","draft":"Insert new paragraph: \"His father was still looking at him. Burgundy could not remember a look that had stayed on him this long. He kept his hands in his coat pockets, where last night's sealant was still cracked into the knuckle creases, and let his father see the prince.\""},{"chapter":"20","seq":10,"type":"new-paragraph","size":"small","title":"Want-engine: the Vicentennial plan, held silently","proposal":"I'm going to add one paragraph right after the kindest-thing line, surfacing the plan the want-engine edits seed upstream: nine months; he walks at his father's side and holds the plan where he always holds it, next to the fear for Ran: the Vicentennial, this field, the machines rolling out of the dark to work in front of everyone; his father would see what his son had not given up. It answers the King's 'I'm glad you gave up those childish things' without a word spoken.","head":"the kindest thing his father had ever said to him.","tail":"He was released an hour before dusk,","rationale":"Want-engine alive in the last pre-Freeze chapters; interiority never staged into dialogue.","draft":"Insert new paragraph: \"Nine months. He walked at his father's side and held the plan where he always held it, next to the fear for Ran: the Vicentennial, this field, the machines rolling out of the dark to work in front of everyone. His father would see what his son had not given up.\""},{"chapter":"21","seq":1,"type":"age-fix","size":"tiny","title":"'Almost two years of chewing' becomes weeks","proposal":"I'm going to change 'where almost two years of patient insufficient chewing' to 'where weeks of patient, insufficient chewing.' The wall work all happens inside the firm three-month preserve-to-South-12 window, so two years of physical chewing at this seam is now impossible.","head":"Not damaged. Not advanced upon. *Gone*.","tail":"had left a shallow scarred tunnel there was now a hole.","rationale":"The firm three-month window caps the dungeon-seam work at weeks.","draft":"change \"where almost two years of patient insufficient chewing\" to \"where weeks of patient, insufficient chewing\""},{"chapter":"21","seq":2,"type":"line-edit","size":"tiny","title":"Cap the negation tic: 'Not throttled, not batched'","proposal":"I'm going to cut the chapter's second negation construction, since 'Not damaged. Not advanced upon. Gone.' earns the chapter's one: change 'had synchronized. Not throttled, not batched, but brought into rhythm, the machine sampling' to 'had synchronized, the machine sampling'. The rhythm image that follows already does the work.","head":"The data firehose and the scoring loop","tail":"the machine sampling its own body in rhythm with its own actions","rationale":"Negation tic capped at one per chapter.","draft":"change \"had synchronized. Not throttled, not batched, but brought into rhythm, the machine sampling\" to \"had synchronized, the machine sampling\""},{"chapter":"21","seq":3,"type":"line-edit","size":"tiny","title":"Cut 'Old was not the word.'","proposal":"I'm going to delete the sentence 'Old was not the word.' and let the hand-cut, pick-scarred, water-softened description carry the age on its own.","head":"Beyond it, the tunnel was still a tunnel, but an old one.","tail":"The walls beyond the breach were hand-cut, pick-scarred,","rationale":"Negation cap plus THE LAST STEP: the concrete walls say it.","draft":"Delete \"Old was not the word.\""},{"chapter":"21","seq":4,"type":"parked","size":"small","title":"PARKED SLOT: the true Ghai collapse (tutor memory)","proposal":"I'm going to mark this paragraph as the slot for Johnny's geopolitics. Location: the moment the lamp finds the Ghai mark and Burgundy reaches for what his tutors taught. Trigger: the circle-within-a-circle engraving. The current vague line ('faded, collapsed, dispersed, were conquered. Something. He didn't remember.') stays as the placeholder; when Johnny supplies the real story of what happened to the Ghai and how it connects to the tribute order, it threads here, still filtered through a bored tutor's half-remembered lesson. I am writing no geopolitical content now.","head":"and a capital no raider ever found because it had no outside.","tail":"But he did remember that their tunnels had been filled in centuries ago","rationale":"Tutor-memory content parked; slot only.","draft":""},{"chapter":"21","seq":5,"type":"line-edit","size":"tiny","title":"Fix the dangling 'specific gravity' clause","proposal":"I'm going to change 'But the dark ahead of him was pulling with the specific gravity.' to 'But the dark ahead of him was pulling.' The half-finished physics metaphor stops the sentence dead; the machine-sound in the next line is the real pull.","head":"The logs alone were a life's work, the bundles in the tunnel were a hoard.","tail":"And somewhere in that dark, faint and rhythmic in the silence","rationale":"Cargo Test: a comparison with no payload gets cut.","draft":"change \"But the dark ahead of him was pulling with the specific gravity.\" to \"But the dark ahead of him was pulling.\""},{"chapter":"22","seq":1,"type":"line-edit","size":"small","title":"Em-dash sweep, chapter 22 (8 instances)","proposal":"Chapter 22 carries eight em dashes and the ban is absolute, so I'm going to recast every one (this edit is the sweep; two more instances are handled inside my seq-4 and seq-9 edits): (1) 'crowd's edge — a girl,' becomes 'crowd's edge, a girl,'; (2) '*Stopped* — drills stilling' becomes '*Stopped*: drills stilling'; (3) 'a piece of it — *first the sheds, now this* — and he did not need the rest' becomes 'a piece of it: *first the sheds, now this*. He did not need the rest'; (4) 'turned her head — the first time she had taken her eyes off him since the lamplight found the cavern — and looked' becomes comma appositives; (5) 'by the cage — full.' becomes 'by the cage: full.'; (6) 'the truth in his chest — *I am not him, I built these against him* — and did not say any of it' becomes comma-set; (7) 'Not here — this is a working site' becomes 'Not here. This is a working site'; (8) 'You tell no one — and before you answer' becomes 'You tell no one. And before you answer'.","head":"It was the smallest in the group.","tail":"he saw as she crossed the light, and she walked past Burgundy","rationale":"NO EM DASHES ever; period, comma appositive, colon are the instruments.","draft":"Recast all eight listed em dashes using period, comma appositive, or colon as itemized in the proposal."},{"chapter":"22","seq":2,"type":"line-edit","size":"tiny","title":"Clean the arm's-length sentence and capitalization","proposal":"I'm going to fix 'And now here he was, an arms length away to two miners, people he had thought about for years, but never actaully approached until this moment. / the woman did not bow' to 'And now here he was, an arm's length from two miners, people he had thought about for years and never once approached. / The woman did not bow'.","head":"and the girl with the milk-glass eye had vanished on a cart.","tail":"\"Not here,\" is all she said.","rationale":"Copyedit on the beat carrying the book's want; LAST STEP cuts the throat-clearing.","draft":"Replace the two garbled sentences as quoted; \"until this moment\" is cut, \"the woman\" capitalized."},{"chapter":"22","seq":3,"type":"line-edit","size":"small","title":"Rewrite the broken 'quick assessment' paragraph","proposal":"I'm going to rewrite the garbled paragraph about the woman's quick assessment as: 'The woman had already decided he was not the crackdown. Maybe it was his face, which held more fear than any inspector's ever would. Her tone had no fear in it. It was almost annoyed.'","head":"pricing what the arms could lift.","tail":"\"You have until I say,\" the woman said.","rationale":"Plain language where Hesta's authority establishes itself.","draft":"Replace the four garbled sentences with: \"The woman had already decided he was not the crackdown. Maybe it was his face, which held more fear than any inspector's ever would. Her tone had no fear in it. It was almost annoyed.\""},{"chapter":"22","seq":4,"type":"line-edit","size":"tiny","title":"Recast 'not wonder. The opposite.'","proposal":"I'm going to change 'and saw the amazement arrive and saw what it turned into — not wonder. The opposite. Her jaw set,' to 'and saw the amazement arrive and saw it sour. Her jaw set,'. One verb replaces a dash, a negation, and an announcement.","head":"Hesta looked at the carts for a long moment. Burgundy watched her face","tail":"and when she turned back to him, her eyes had gone harder","rationale":"Em-dash ban plus negation cap; 'Too good.' already lands the meaning.","draft":"change \"and saw what it turned into — not wonder. The opposite. Her jaw set,\" to \"and saw it sour. Her jaw set,\""},{"chapter":"22","seq":5,"type":"line-edit","size":"tiny","title":"Fix 'brown-haird... number 2' to russet-haired","proposal":"I'm going to change 'The brown-haird man who was seemingly her number 2 had no such trouble.' to 'The russet-haired man had no such trouble.' It fixes the typo, matches his earlier introduction as 'a broad russet-haired man,' and drops the modern-register 'number 2' (his role is already shown).","head":"only proved how big the snare must be.","tail":"He was looking at the carts, and then at the machines,","rationale":"Plain language and continuity; hair color must not drift in the same scene.","draft":"change the sentence to \"The russet-haired man had no such trouble.\""},{"chapter":"22","seq":6,"type":"timing-marker","size":"small","title":"Tobin speaks the Vicentennial from below","proposal":"I'm going to give the looming date one spoken beat from the underside, in Tobin's mouth, inserted after 'We've never done that.': 'You know the quota climbs from here. Every month of it, the whole nine months to the Vicentennial.' The King names the date from the platform in my ch20 edit; the miner names it from the shaft. Same date, two altitudes, which is the climax's geometry in miniature.","head":"Do you see it? Quota by midnight. We've never done that.","tail":"This could mean no more short-stipend months.","rationale":"Ladder rung plus a foundations-only seed of crowned-above-while-machines-break-below.","draft":"Insert into Tobin's dialogue after \"We've never done that.\": \"You know the quota climbs from here. Every month of it, the whole nine months to the Vicentennial.\""},{"chapter":"22","seq":7,"type":"line-edit","size":"small","title":"Clean Hesta's exit orders","proposal":"I'm going to repair the run-on 'Get these machines out of my shaft..' paragraph to: '\"Get these machines out of my shaft,\" she said. \"Now, before a foreman walks over or that cage comes down. And take half their harvest with you. I'll deal with what the rest looks like.\" Tobin gave her an incredulous look.' Double period gone, the orders land as orders, and 'the number 2' phrasing goes.","head":"completely, instantly, and with the door left open exactly one crack.","tail":"She stepped closer, and lowered her voice to the width of the three of them.","rationale":"Plain language on the beat that establishes Hesta's command style.","draft":"Replace the paragraph from \"Get these machines out of my shaft..\" through \"an incredulous look.\" with the version quoted in the proposal."},{"chapter":"22","seq":8,"type":"line-edit","size":"small","title":"Cut the theory-became-application explainer","proposal":"I'm going to end the 'other thing' paragraph two sentences early: keep 'It was the other thing. The thing with no shape in his world until tonight, the way the machines had no shape in Hesta's.' and cut the callback to the core-world researchers plus 'But tonight, theory became application. Foggy ideas became real.' The chapter has already dramatized all of it; the narrator restating it as thesis flattens the ending.","head":"any of a hundred threads that could end everyone in that cavern.","tail":"Three nights. A full moon. A place he would be taken to.","rationale":"Theme dramatized never stated; the Hesta mirror is the fact, stop there.","draft":"Delete from \"Or how \\\"real world industrial application scenarios\\\" had no shape\" through \"Foggy ideas became real.\""},{"chapter":"22","seq":9,"type":"line-edit","size":"small","title":"Tighten the came-back-up paragraph to its button","proposal":"I'm going to recast the penultimate paragraph as: 'He had gone down a tunnel to retrieve three runaway mining machines, and had come back up as something else: measured by a woman who ran something, scheduled into a network that had survived being looked for, four words of a child's observation still ringing in his ears. *It doesn't get tired.*' The em dash becomes a colon and the triple-negation sentence ('never have planned, never have designed, never have predicted') is cut, so 'It had found other people.' lands directly after the girl's four words.","head":"Three nights. A full moon. A place he would be taken to.","tail":"It had found other people.","rationale":"Em-dash ban, negation cap, LAST STEP: the Part One button is strongest unexplained.","draft":"Replace \"something else — measured\" with \"something else: measured\" and delete the \"His project had become something he could never have planned...\" sentence."}],"stats":{"total":53,"byType":"11 new rulings from Part 1 implementation + 42 original edits (82–123) awaiting verdicts"},"coverage":[{"goal":"Ch1 = night after 17th birthday, rite, robot brought unbidden","coveredBy":"Ch1: Recast Chapter 1 as the night after his 17th birthday"},{"goal":"Ch2 first council: rejection + rite and marriage tour mentioned unexplained","coveredBy":"Ch2: Reframe the arrival; Ch3: Rewrite the opening exchange; Rewrite the rejection close"},{"goal":"Restructure: old ch1-3 redistribute; then Mira shows him the room","coveredBy":"Ch2: Merge old Ch2 and Ch3 (Mira's Wing kept as its own chapter turn, one-word revert if Johnny wants the full merge)"},{"goal":"Timing number fixes (17 not 19, Oz two years, 18 months, six->three months, three-week break, thirteen->fifteen, in-place two-years checks)","coveredBy":"Age-fix and timing items in ch1, 6, 9, 13, 15, 16, 17, 20, 21; keep-as-is decision items ch4, ch8"},{"goal":"Vicentennial spoken ladder (3 yrs -> 2 yrs -> year and change -> a year -> months -> weeks)","coveredBy":"Timing markers ch1, 3, 5, 9, 11, 12 (x2), 13 (toast inside new scene), 15, 16, 18, 20, 22; weeks: ch19 cores marker"},{"goal":"Want-engine: Vicentennial demo plan replaces ch15 no-plan; threaded","coveredBy":"Ch10: Birth of the plan; Ch12: The demo plan gets its date; Ch15: Replace the no-plan beat; Ch18: Want-engine echo; Ch20: plan held silently"},{"goal":"Marriage-tour dread seeded ch1-2 and mentioned throughout","coveredBy":"Ch1: Seed the marriage-tour dread; Ch3: rejection close; Ch5: age mirror; Ch12: Ghai marriages beat; Ch13 toast graze; Ch16: Mira speaks the tour"},{"goal":"Ch13 new 19th-birthday opening (manual, kitchen pass, hall, toast, first hunt, cut)","coveredBy":"Ch13: New 19th-birthday opening section"},{"goal":"One new scene budget: choose and say so","coveredBy":"Chosen: folded into the ch13 birthday opening (stated in that edit); no separate loneliness scene proposed"},{"goal":"Wound planted page one + shame device (hands)","coveredBy":"Ch1 recast; Ch3: fingers curled; Ch20: seen as the coat"},{"goal":"Restore struck prose: ch1 mother-glance, ch11 stone-swallowed, ch11 final sentence","coveredBy":"Ch1: Restore the mother-glance dinner passage; Ch3: searching-her-face; Ch11: stone-swallowed restore + final sentence"},{"goal":"Quilt tradition + Essa planted early; patch exchange never stopped","coveredBy":"Ch6: Plant the quilt tradition (kept over duplicate ch1 version); Ch13 patch beat; Ch17: both square hand-offs"},{"goal":"Essa irony spine (dying seamstress, one question, backward detonation)","coveredBy":"Ch14: King's one question + interior detonation; Ch17: Fill the TK with the Essa line; Ch19: Essa's hand known instantly; Ch13: pillow count fix"},{"goal":"Atrocity: ch1 mineshaft lozenge memory with compact mine description","coveredBy":"Ch1: The mineshaft memory rewritten as the lozenge atrocity"},{"goal":"Ch7 stays warm; ch17 return detonates (checkpoint, quiet cook, synchronized flinch)","coveredBy":"Ch7: market-stays-warm decision item; Ch17: THE RETURN DETONATION"},{"goal":"Surveillance on a loved face (Tuck's swallowed sentence)","coveredBy":"Ch17: Tuck's swallowed sentence on the walk down"},{"goal":"King = visible face; own-hands act as OPEN QUESTION with one recommended option","coveredBy":"Ch13: open-question (recommended); Ch19: open-question variant (optional, not both at full strength)"},{"goal":"Extraction read via 3-4 fragment-seeds; geopolitics/tutor content PARKED","coveredBy":"Parked slots: ch1 tribute ships, ch2 tutor, ch7 square, ch10 (x2), ch12 counting, ch15 mining disc, ch18 sphere, ch21 Ghai — slots only, no prose"},{"goal":"Mira: operator, love=provision, academy-rebuilt, fragments, father-anger, training-as-cover, stakes plain","coveredBy":"Ch5: academy room, father fragment, flattened laugh, alibi paragraph, stakes edit; Ch16: freight/cartel fragment"},{"goal":"Tuck provider-act as finished object (pedal rig)","coveredBy":"ADDED — Ch7: Tuck's provider-act as a finished object (was MISSING from all six ranges)"},{"goal":"Voice doctrine enforcement (em dashes, negation cap, cargo test, end on object)","coveredBy":"Ch5 curious line; Ch9 TK face; Ch12/18 end-on-object; Ch20 final-frontier cut; Ch21 negation cuts; Ch22 sweep and tightenings"},{"goal":"Twinrise/Teem renames everywhere","coveredBy":"Ch6 Twinrise birthday; Ch12 (x3); Ch13 (x2); Ch14; Ch16 Descent"},{"goal":"Climax foundations only, no revolution prose","coveredBy":"Seeds only: ch20 King's platform line, ch20 silent plan, ch22 Tobin from below; nothing drafted (confirmed)"},{"goal":"Mira internal age consistency (ch5 seventeen vs ch14 twenty-six/eight years)","coveredBy":"ADDED — Ch14: Reconcile Mira's age drift (was flagged in notes but MISSING from edits)"}]};
const KEY = 'bill-burgundy-proposal-v2';
let R = {};
try{ const p = JSON.parse(localStorage.getItem(KEY) || '{}'); R = (p && typeof p==='object' && !Array.isArray(p)) ? p : {}; }catch(e){ R = {}; }
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const TYPE_LABEL = { 'age-fix':'number fix','line-edit':'line edit','timing-marker':'timing marker','new-paragraph':'new paragraph','new-scene':'new scene','new-chapter':'new chapter','restructure':'restructure','flashback-slot':'flashback slot','parked':'parked (geo)','open-question':'open question' };
const TYPE_COLOR = { 'age-fix':'var(--gold)','line-edit':'var(--gold)','timing-marker':'var(--gold)','new-paragraph':'var(--green)','new-scene':'var(--oxblood)','new-chapter':'var(--oxblood)','restructure':'var(--red)','flashback-slot':'var(--purple)','parked':'var(--purple)','open-question':'var(--blue)' };

const edits = DATA.edits.map((e,i)=>({...e, id: 'e'+i}));
const total = edits.length;

$('#byline').textContent = 'chronological · '+total+' proposed edits · accept, reject, or comment on each';
$('#intro').innerHTML = DATA.intro.split(/\n\n+/).map(p=>'<p>'+esc(p)+'</p>').join('');

// legend (only types present)
const present = [...new Set(edits.map(e=>e.type))];
$('#legend').innerHTML = present.map(t=>'<span class="lg"><span class="sw" style="background:'+TYPE_COLOR[t]+'"></span>'+esc(TYPE_LABEL[t]||t)+'</span>').join('');

// group by chapter, chronological
function chapKey(c){ const m = String(c).match(/\d+/); return m ? parseInt(m[0]) + (String(c).toLowerCase().includes('new')? 0.5 : 0) : 99; }
const groups = {};
edits.forEach(e=>{ (groups[e.chapter] = groups[e.chapter] || []).push(e); });
const chapOrder = Object.keys(groups).sort((a,b)=>chapKey(a)-chapKey(b) || String(a).localeCompare(String(b)));
chapOrder.forEach(c => groups[c].sort((a,b)=>(a.seq||0)-(b.seq||0)));

const cbox = $('#chapters');
chapOrder.forEach(c=>{
  const sec = document.createElement('section'); sec.className='chap';
  let h = '<div class="chap-head"><h2>'+(String(c).match(/^\d+$/)?'Chapter '+c:esc(c))+'</h2><span class="cnt">'+groups[c].length+' edits</span></div>';
  groups[c].forEach(e=>{
    const st = R[e.id]||{};
    h += '<div class="ed" data-t="'+esc(e.type)+'" data-id="'+e.id+'">';
    h += '<div class="ed-top"><span class="pill type">'+esc(TYPE_LABEL[e.type]||e.type)+'</span><span class="pill">'+esc(e.size)+'</span></div>';
    h += '<h4>'+esc(e.title)+'</h4>';
    h += '<p class="prop">'+esc(e.proposal)+'</p>';
    if(e.draft) h += '<div class="draft"><b>the change</b>'+esc(e.draft)+'</div>';
    if(e.head || e.tail){
      h += '<p class="anchor">';
      if(e.head) h += '<b>after</b><span class="h">“…'+esc(e.head)+'”</span> ';
      h += '<span class="mark">◆</span>';
      if(e.tail) h += ' <b>before</b><span class="t">“'+esc(e.tail)+'…”</span>';
      h += '</p>';
    }
    if(e.rationale) h += '<p class="why">'+esc(e.rationale)+'</p>';
    h += '<div class="verd">';
    h += '<button class="vbtn acc'+(st.v==='accept'?' on':'')+'" data-id="'+e.id+'" data-v="accept">✓ accept</button>';
    h += '<button class="vbtn rej'+(st.v==='reject'?' on':'')+'" data-id="'+e.id+'" data-v="reject">✗ reject</button>';
    h += '<span class="cmt"><input data-id="'+e.id+'" placeholder="comment…" value="'+esc(st.c||'')+'"></span>';
    h += '</div></div>';
  });
  sec.innerHTML = h; cbox.appendChild(sec);
});

function ruled(id){ const s=R[id]||{}; return !!(s.v || (s.c && s.c.trim())); }
const doneSet = new Set(edits.filter(e=>ruled(e.id)).map(e=>e.id));
function refreshBar(){
  $('#pText').textContent = doneSet.size+' of '+total+' ruled';
  $('#fill').style.width=(total?doneSet.size/total*100:0)+'%';
}
function refresh(){ doneSet.clear(); edits.forEach(e=>{ if(ruled(e.id)) doneSet.add(e.id); }); refreshBar(); }
let saveTimer=null;
function persist(){ localStorage.setItem(KEY, JSON.stringify(R)); }
function persistSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(persist, 400); }
window.addEventListener('beforeunload', persist);
window.addEventListener('pagehide', persist);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') persist(); });
function updateOne(id){ if(ruled(id)) doneSet.add(id); else doneSet.delete(id); refreshBar(); }
function save(){ persist(); refresh(); }

document.body.addEventListener('click', ev=>{
  const b=ev.target.closest('.vbtn'); if(!b) return;
  const id=b.dataset.id, v=b.dataset.v;
  R[id]=R[id]||{};
  R[id].v = R[id].v===v ? null : v;
  const card=document.querySelector('.ed[data-id="'+id+'"]');
  card.querySelectorAll('.vbtn').forEach(x=>x.classList.toggle('on', x.dataset.v===R[id].v));
  updateOne(id); persist();
});
document.body.addEventListener('input', ev=>{
  const inp=ev.target.closest('.cmt input'); if(!inp) return;
  const id=inp.dataset.id; R[id]=R[id]||{}; R[id].c=inp.value;
  updateOne(id); persistSoon();
});
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1900); }

$('#accAllBtn').addEventListener('click', ()=>{
  edits.forEach(e=>{ if(!ruled(e.id)){ R[e.id]=R[e.id]||{}; R[e.id].v='accept'; } });
  document.querySelectorAll('.ed').forEach(card=>{
    const id=card.dataset.id; card.querySelectorAll('.vbtn').forEach(x=>x.classList.toggle('on', x.dataset.v===(R[id]&&R[id].v)));
  });
  save(); toast('accepted the rest');
});
$('#clearBtn').addEventListener('click', ()=>{
  if(!confirm('Clear all your rulings?')) return;
  R={}; localStorage.removeItem(KEY);
  document.querySelectorAll('.vbtn').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.cmt input').forEach(i=>i.value='');
  refresh(); toast('cleared');
});
$('#exportBtn').addEventListener('click', async ()=>{
  let md='# BURGUNDY — Johnny\'s rulings on the Edit Proposal\n\n';
  chapOrder.forEach(c=>{
    md+='\n## '+(String(c).match(/^\d+$/)?'Chapter '+c:c)+'\n';
    groups[c].forEach(e=>{
      const s=R[e.id]||{};
      md+='\n### '+e.title+' ['+(TYPE_LABEL[e.type]||e.type)+' · '+e.size+']\n';
      md+='- **Verdict:** '+(s.v?s.v.toUpperCase():'_(unruled)_')+'\n';
      if(s.c&&s.c.trim()) md+='- **Johnny:** '+s.c.trim()+'\n';
    });
  });
  try{ await navigator.clipboard.writeText(md); toast('copied — paste it back to Parley'); }catch(e){ toast('downloaded'); }
  const blob=new Blob([md],{type:'text/markdown'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='BURGUNDY-edit-rulings.md'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
});
const tb=$('#themeBtn');
function setTheme(t){ document.documentElement.dataset.theme=t; tb.textContent=t==='night'?'☀ day':'☾ night'; try{localStorage.setItem('bill-theme',t);}catch(e){} }
let bootTheme='day'; try{ bootTheme=localStorage.getItem('bill-theme')||'day'; }catch(e){}
setTheme(bootTheme);
tb.addEventListener('click', ()=>setTheme(document.documentElement.dataset.theme==='night'?'day':'night'));
refresh();
</script>
