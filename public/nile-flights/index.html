<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Nile Flights · Booking Tracker</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --ink:#f3f5f7; --ink-2:#9aa3ad; --ink-3:#69727c;
    --line:#2b333d; --air:#5b8def; --good:#3fb950; --warn:#e0a042; --slate:#7c8794;
    --red:#ff5c5c; --violet:#9663ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.35;
    padding:0 0 80px;
  }
  .wrap{max-width:620px;margin:0 auto;padding:0 18px}

  /* ---- sticky header ---- */
  header{position:sticky;top:0;z-index:10;background:rgba(13,17,23,.93);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line)}
  .head-in{max-width:620px;margin:0 auto;padding:16px 18px 14px}
  .kicker{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--air);font-weight:700}
  h1{font-size:21px;font-weight:800;letter-spacing:-.3px;margin:3px 0 0}
  .sub{font-size:13px;color:var(--ink-3);margin-top:3px}
  .prog{margin-top:13px}
  .prog .bar{height:8px;border-radius:6px;background:#20262f;overflow:hidden}
  .prog .fill{height:100%;background:linear-gradient(90deg,var(--good),#5fe08a);width:0;transition:width .45s cubic-bezier(.2,.7,.2,1)}
  .prog .lbl{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12.5px;color:var(--ink-2)}
  .prog .lbl b{color:var(--ink)}
  .who{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3)}
  .who input{background:#10141b;border:1px solid var(--line);border-radius:8px;color:var(--ink);
    font:inherit;font-size:12.5px;padding:4px 9px;width:96px}
  .who input:focus{outline:none;border-color:var(--air)}

  .day{margin:30px 0 16px}
  .day .dow{font-size:19px;font-weight:800}
  .day .dm{font-size:19px;font-weight:800;color:var(--air)}
  .day .rule{height:1px;background:var(--line);margin-top:10px}

  /* ---- flight booking card ---- */
  .card{display:flex;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:15px;margin:12px 0;transition:opacity .3s, border-color .3s, background .3s}
  .card.booked{border-color:rgba(63,185,80,.45);background:rgba(63,185,80,.05)}
  .card.locked{border-color:rgba(63,185,80,.4)}

  /* big checkbox */
  .check{flex:0 0 auto;width:46px;height:46px;border-radius:13px;border:2.5px dashed var(--warn);
    background:rgba(224,160,66,.07);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .2s;-webkit-tap-highlight-color:transparent;user-select:none;position:relative}
  .check:active{transform:scale(.92)}
  .check svg{width:26px;height:26px;opacity:0;transform:scale(.5);transition:all .25s cubic-bezier(.2,.9,.3,1.4)}
  .card.booked .check{border-style:solid;border-color:var(--good);background:var(--good)}
  .card.booked .check svg{opacity:1;transform:scale(1)}
  .card.locked .check{cursor:default}

  .body{flex:1 1 auto;min-width:0}
  .route{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .route .codes{font-size:20px;font-weight:800;letter-spacing:.4px}
  .route .codes .arr{color:var(--ink-3);margin:0 5px;font-weight:600}
  .route .dur{font-size:12.5px;color:var(--ink-3);font-weight:600}
  .card.booked .route .codes{text-decoration:line-through;text-decoration-color:rgba(63,185,80,.6);color:var(--ink-2)}
  .when{font-size:13px;color:var(--ink-2);margin-top:3px}
  .when .ov{margin-left:6px;font-size:10px;font-weight:800;letter-spacing:.4px;color:var(--warn);
    border:1px solid #4a3a18;border-radius:999px;padding:1px 7px;text-transform:uppercase}

  .status{display:inline-flex;align-items:center;gap:7px;margin-top:10px;font-size:12px;font-weight:800;
    letter-spacing:.4px;text-transform:uppercase;padding:4px 11px;border-radius:999px}
  .status.tobook{color:var(--warn);background:rgba(224,160,66,.13);border:1px solid rgba(224,160,66,.45)}
  .status.done{color:var(--good);background:rgba(63,185,80,.14);border:1px solid rgba(63,185,80,.5)}
  .status .by{font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink-3);margin-left:2px}

  .note{margin-top:11px;display:inline-flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;
    color:#e7d5ff;background:rgba(150,99,255,.16);border:1px solid rgba(150,99,255,.6);
    border-radius:11px;padding:9px 13px}
  .note .t{font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.5px;color:#caa9ff}

  .shot{margin-top:12px;max-width:100%;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0b0e13}
  .shot img{display:block;width:100%}

  /* ---- between-flight context (layover / ground / TBD) ---- */
  .gap{padding:4px 0 4px 60px}
  .pill{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;border-radius:10px;padding:6px 12px;
    border:1px solid;font-weight:600}
  .pill .t{font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.4px}
  .pill .sub{color:var(--ink-3);font-weight:500}
  .pill.lay{color:var(--warn);background:rgba(224,160,66,.1);border-color:rgba(224,160,66,.4)}
  .pill.ground{color:#b4bcc6;background:rgba(124,135,148,.1);border-color:rgba(124,135,148,.38)}
  .pill.warn{color:#ff9a9a;background:rgba(255,80,80,.1);border-color:rgba(255,92,92,.5)}
  .pill.warn .sub{color:#e08a8a}

  /* ---- TBD propose card ---- */
  .tbd{display:flex;gap:14px;border:1px dashed rgba(255,92,92,.6);background:rgba(255,80,80,.06);
    border-radius:16px;padding:15px;margin:12px 0}
  .tbd .mark{flex:0 0 auto;width:46px;height:46px;border-radius:13px;border:2.5px dashed var(--red);
    display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:var(--red)}
  .tbd .route .codes{color:var(--red)}
  .tbd .status.propose{color:#ff9a9a;background:rgba(255,80,80,.13);border:1px solid rgba(255,92,92,.5)}

  /* toast */
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:#222a33;border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:600;
    padding:10px 16px;border-radius:11px;pointer-events:none;transition:all .3s;z-index:50;max-width:90vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{border-color:var(--red);color:#ffb3b3}

  .footer{max-width:620px;margin:34px auto 0;padding:0 18px;font-size:12px;color:var(--ink-3);text-align:center}
</style>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<header>
  <div class="head-in">
    <div class="kicker">Nile Flights</div>
    <h1>Booking Tracker</h1>
    <div class="sub" id="route-sub">Addis Ababa → Bahir Dar → Cairo → Aswan → Warsaw</div>
    <div class="prog">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="lbl">
        <span><b id="done-n">0</b> of <b id="total-n">0</b> flights booked</span>
        <span class="who">Booked by <input id="who" maxlength="18" placeholder="name"></span>
      </div>
    </div>
  </div>
</header>

<div class="wrap"><div id="tl"></div></div>
<div class="footer" id="synced">syncing…</div>
<div id="toast"></div>

<script>
const API = '/api/nile-flights-state';

const AIRPORTS = {
  ADD:{city:"Addis Ababa"}, BJR:{city:"Bahir Dar"}, CAI:{city:"Cairo"},
  ASW:{city:"Aswan"}, WAW:{city:"Warsaw"},
};

/* legs in order. flights are bookable unless preBooked. tbd = needs proposal first. */
const LEGS = [
  { id:"adbj", from:"ADD", to:"BJR", depart:"2026-06-15 11:40", arrive:"2026-06-15 12:50",
    shot:"/nile-flights/cards/leg-ADD-BJR.png" },
  { id:"bjad", from:"BJR", to:"ADD", depart:"2026-06-16 16:35", arrive:"2026-06-16 17:45",
    shot:"/nile-flights/cards/leg-BJR-ADD.png" },
  { id:"adca", from:"ADD", to:"CAI", depart:"2026-06-16 22:15", arrive:"2026-06-17 02:05", overnight:true,
    eaNote:{for:"Marisa", text:"Book business class"}, shot:"/nile-flights/cards/leg-ADD-CAI.png" },
  { id:"casw", from:"CAI", to:"ASW", depart:"2026-06-17 08:35", arrive:"2026-06-17 09:55",
    shot:"/nile-flights/cards/leg-CAI-ASW.png" },
  { tbd:true, id:"ascai", from:"ASW", to:"CAI", date:"2026-06-21", note:"Lama to propose" },
  { id:"cawa", from:"CAI", to:"WAW", depart:"2026-06-22 03:10", arrive:"2026-06-22 06:10", durOverride:"4h 0m",
    preBooked:true, bookedBy:"Johnny", shot:"/nile-flights/cards/leg-CAI-WAW.png" },
];

/* ---- time helpers ---- */
const pad=n=>String(n).padStart(2,"0");
const parse=s=>{const[d,t]=s.split(" ");const[Y,M,D]=d.split("-").map(Number);const[h,m]=(t||"0:0").split(":").map(Number);return new Date(Y,M-1,D,h,m);};
const fmtTime=dt=>{let h=dt.getHours(),m=dt.getMinutes();const ap=h>=12?"PM":"AM";h=h%12||12;return `${h}:${pad(m)} ${ap}`;};
const dur=(a,b)=>{let mins=Math.round((b-a)/60000);const h=Math.floor(mins/60),mm=mins%60;return[(h?`${h}h`:""),(mm?`${mm}m`:(h?"":"0m"))].filter(Boolean).join(" ");};
const dayKey=dt=>`${dt.getFullYear()}-${dt.getMonth()}-${dt.getDate()}`;
const dayOnly=dt=>new Date(dt.getFullYear(),dt.getMonth(),dt.getDate());
const DOW=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
const groupDt=l=>l.tbd?parse(l.date+" 12:00"):parse(l.depart);
const fmtDate=dt=>`${MON[dt.getMonth()].slice(0,3)} ${dt.getDate()}`;
// Pure: classify a same-airport connection gap by minutes between previous arrival and next departure.
// <75 min = too tight to make the connection (book a later flight); <=12h = a layover; longer = on the
// ground (overnight+). Returns the pill CSS class + head label so render() interpolates byte-identically.
function classifyGap(mins){
  if(mins<75) return {pill:"warn", tight:true, head:null};
  const short=mins<=12*60;
  return {pill:short?"lay":"ground", tight:false, head:short?"⏱ Layover":"☾ On the ground"};
}

/* ---- state ---- */
let state={bookings:{}};
let updatedAt=null;
const bookableLegs=LEGS.filter(l=>!l.tbd);
const CHECK_SVG='<svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7" stroke="#0d1117" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function isBooked(l){
  if(l.preBooked) return true;
  return !!(state.bookings[l.id] && state.bookings[l.id].booked);
}
function bookedInfo(l){
  if(l.preBooked) return {by:l.bookedBy||"", at:null, pre:true};
  return state.bookings[l.id]||null;
}

/* ---- render ---- */
const tl=document.getElementById("tl");
function render(){
  let html="",curDay=null,prev=null;
  LEGS.forEach((l,i)=>{
    // gap from previous arrival
    if(prev && prev.to===l.from){
      const pArr=prev.tbd?null:parse(prev.arrive);
      const tDep=l.tbd?null:parse(l.depart);
      const city=(AIRPORTS[l.from]||{}).city||"";
      if(pArr&&tDep){
        const mins=(tDep-pArr)/60000;
        const g=classifyGap(mins);
        if(g.tight){
          html+=`<div class="gap"><span class="pill warn"><span class="t">⚠ ${Math.round(mins)} min connection</span><span class="sub">in ${city} · too tight — book a later flight</span></span></div>`;
        }else{
          html+=`<div class="gap"><span class="pill ${g.pill}"><span class="t">${g.head}</span><span>${dur(pArr,tDep)}</span><span class="sub">in ${city}</span></span></div>`;
        }
      }else{
        const days=Math.round((dayOnly(l.tbd?parse(l.date+" 12:00"):tDep)-dayOnly(prev.tbd?parse(prev.date+" 12:00"):pArr))/86400000);
        html+=`<div class="gap"><span class="pill ground"><span class="t">☾ On the ground</span><span>${days>=2?`~${days} days`:"overnight"}</span><span class="sub">in ${city}</span></span></div>`;
      }
    }
    // day header
    const gd=groupDt(l), k=dayKey(gd);
    if(k!==curDay){curDay=k;html+=`<div class="day"><span class="dow">${DOW[gd.getDay()]}</span> <span class="dm">${MON[gd.getMonth()]} ${gd.getDate()}</span><div class="rule"></div></div>`;}

    if(l.tbd){
      html+=`<div class="tbd"><div class="mark">?</div><div class="body">
        <div class="route"><span class="codes">${l.from}<span class="arr">→</span>${l.to}</span><span class="dur">${fmtDate(gd)}</span></div>
        <div class="when">Flight not chosen yet</div>
        <div class="status propose">◷ ${l.note}</div></div></div>`;
      prev=l;return;
    }

    const dep=parse(l.depart), arr=parse(l.arrive);
    const booked=isBooked(l), info=bookedInfo(l);
    const d=l.durOverride||dur(dep,arr);
    const ov=l.overnight?`<span class="ov">overnight</span>`:"";
    const eaNote=l.eaNote?`<div class="note"><span class="t">📝 For ${l.eaNote.for}</span> ${l.eaNote.text}</div>`:"";
    let statusHtml;
    if(booked){
      const who = info&&info.pre ? (info.by?`· ${info.by}`:"") : (info&&info.by?`· ${info.by}`:"");
      const when = info&&info.at ? `· ${fmtDate(new Date(info.at))}` : "";
      const label = info&&info.pre ? "Already booked" : "Booked";
      statusHtml=`<div class="status done">✓ ${label} <span class="by">${who} ${when}</span></div>`;
    }else{
      statusHtml=`<div class="status tobook">○ To book</div>`;
    }
    const cls=booked?(l.preBooked?"card booked locked":"card booked"):"card";
    const checkAttr=l.preBooked?"":`data-toggle="${l.id}"`;
    html+=`<div class="${cls}" id="card-${l.id}">
      <div class="check" ${checkAttr} role="checkbox" aria-checked="${booked}" tabindex="0">${CHECK_SVG}</div>
      <div class="body">
        <div class="route"><span class="codes">${l.from}<span class="arr">→</span>${l.to}</span><span class="dur">${d}</span></div>
        <div class="when">${fmtTime(dep)} – ${fmtTime(arr)} · ${fmtDate(dep)}${ov}</div>
        ${statusHtml}${eaNote}
        ${l.shot?`<div class="shot"><img src="${l.shot}" alt="${l.from} to ${l.to} flight"></div>`:""}
      </div></div>`;
    prev=l;
  });
  tl.innerHTML=html;
  updateProgress();
}

function updateProgress(){
  const total=bookableLegs.length;
  const done=bookableLegs.filter(isBooked).length;
  document.getElementById("done-n").textContent=done;
  document.getElementById("total-n").textContent=total;
  document.getElementById("fill").style.width=(total?Math.round(done/total*100):0)+"%";
}

/* ---- booking actions ---- */
const whoInput=document.getElementById("who");
whoInput.value=localStorage.getItem("nile-booker")||"Marisa";
whoInput.addEventListener("change",()=>localStorage.setItem("nile-booker",whoInput.value.trim()||"EA"));

function toggle(id){
  const cur=state.bookings[id]&&state.bookings[id].booked;
  if(cur){ delete state.bookings[id]; }
  else { state.bookings[id]={booked:true, by:(whoInput.value.trim()||"EA"), at:new Date().toISOString()}; }
  render();
  save();
}

let saveTimer=null;
function save(){
  setSynced("saving…");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({state})});
      if(!r.ok) throw new Error("save failed ("+r.status+")");
      const j=await r.json(); updatedAt=j.updated_at;
      setSynced("all changes saved");
    }catch(e){ toast("Couldn't save — check connection","err"); setSynced("not saved"); }
  },350);
}

async function load(){
  try{
    const r=await fetch(API,{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const j=await r.json();
    if(j.state&&typeof j.state==="object") state={bookings:(j.state.bookings)||{}};
    updatedAt=j.updated_at;
    setSynced("all changes saved");
  }catch(e){ toast("Couldn't load saved status","err"); setSynced("offline"); }
  render();
}

function fmtSyncTime(updatedAt){
  if(!updatedAt) return "";
  const d = new Date(updatedAt);
  return isFinite(d.getTime()) ? d.toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "";
}
function setSynced(msg){
  const t = fmtSyncTime(updatedAt);
  document.getElementById("synced").textContent = msg + (t?` · last update ${t}`:"");
}
let toastTimer=null;
function toast(msg,kind){
  const el=document.getElementById("toast"); el.textContent=msg; el.className="show"+(kind?" "+kind:"");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.className="",2600);
}

// click toggle on checkbox (delegated — no inline JS-string handler)
tl.addEventListener("click",e=>{
  const c=e.target.closest&&e.target.closest(".check[data-toggle]");
  if(c) toggle(c.dataset.toggle);
});

// keyboard toggle on checkbox
document.addEventListener("keydown",e=>{
  if((e.key===" "||e.key==="Enter")&&e.target.classList&&e.target.classList.contains("check")&&e.target.dataset&&e.target.dataset.toggle){
    e.preventDefault(); e.target.click();
  }
});

render();
load();
// light polling so Johnny sees Marisa's checks land (and vice-versa)
setInterval(()=>{ if(document.visibilityState==="visible") load(); }, 20000);
</script>
</body>
</html>
