<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#E5DECC">
<title>BURGUNDY</title>
<!-- private novel-in-progress — keep it out of search indexes (belt-and-suspenders with robots.txt Disallow: /burgundy/) -->
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<link rel="manifest" href="/burgundy/manifest.webmanifest">
<link rel="apple-touch-icon" href="/burgundy/icon-180.png">
<link rel="icon" type="image/svg+xml" href="/burgundy/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ── the reading instrument: Kindle typography on Burma warm paper ── */
  :root{
    --paper:#E5DECC; --paper-deep:#DED7C3; --ink:#16140F;
    --ink-soft:rgba(22,20,15,.75); --ink-faint:rgba(22,20,15,.45);
    --line:rgba(22,20,15,.16); --orange:#E84B22; --green:#2D7A4F;
    --hl-amber:rgba(212,149,31,.28); --hl-green:rgba(45,122,79,.22);
    --hl-blue:rgba(52,98,145,.20); --hl-rose:rgba(163,57,42,.18);
    --serif:'Libre Caslon Text','Iowan Old Style',Georgia,serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --display:'Playfair Display','Libre Caslon Text',Georgia,serif;
    --size:19px; --lead:1.78;
  }
  html[data-theme="dark"]{
    --paper:#191712; --paper-deep:#211E17; --ink:#E9E2D0;
    --ink-soft:rgba(233,226,208,.75); --ink-faint:rgba(233,226,208,.45);
    --line:rgba(233,226,208,.16);
    --hl-amber:rgba(226,168,60,.34); --hl-green:rgba(88,170,120,.30);
    --hl-blue:rgba(110,155,205,.30); --hl-rose:rgba(210,110,95,.28);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
  /* author's visible cuts — struck but still faintly legible */
  .chapter s{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--ink-faint)}
  body{font-family:var(--serif);font-size:var(--size);line-height:var(--lead);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    transition:background .3s, color .3s}

  /* ── chrome: appears on tap, sleeps while reading ── */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:40;
    padding:calc(env(safe-area-inset-top) + 10px) 20px 12px;
    display:flex;align-items:baseline;gap:14px;
    background:color-mix(in srgb, var(--paper) 92%, transparent);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    transform:translateY(0);transition:transform .28s cubic-bezier(.22,1,.36,1);
  }
  body.zen .topbar{transform:translateY(-110%)}
  .brand{font-family:var(--serif);font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft)}
  .chap-label{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);
    flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bottombar{
    position:fixed;bottom:0;left:0;right:0;z-index:40;
    padding:10px 20px calc(env(safe-area-inset-bottom) + 10px);
    display:flex;align-items:center;gap:16px;
    background:color-mix(in srgb, var(--paper) 92%, transparent);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    transform:translateY(0);transition:transform .28s cubic-bezier(.22,1,.36,1);
  }
  body.zen .bottombar{transform:translateY(110%)}
  body.player-on .topbar{transform:translateY(0)!important}
  body.player-on .bottombar{transform:translateY(0)!important}
  .bb-btn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-soft);background:transparent;border:1.5px solid var(--line);border-radius:4px;
    padding:8px 13px;cursor:pointer}
  .bb-btn:active{border-color:var(--orange);color:var(--orange)}
  /* ── the listener ── */
  #btn-listen{border-color:var(--orange);color:var(--orange);white-space:nowrap}
  #btn-listen.live{background:var(--orange);color:#fff;border-color:var(--orange)}
  #btn-prevp,#btn-nextp,#btn-lx,#btn-dl{display:none}
  body.player-on #btn-prevp,body.player-on #btn-nextp,body.player-on #btn-lx,body.player-on #btn-dl{display:block}
  #btn-dl.done{color:#2D7A4F;border-color:rgba(45,122,79,.5)}
  #btn-dl.busy{color:var(--orange);border-color:var(--orange)}
  .chapter p.speaking{background:none;box-shadow:inset 3px 0 0 0 var(--orange);padding-left:14px;margin-left:-14px;transition:box-shadow .3s}
  /* phones: the listening controls take the row; secondary chrome yields */
  @media (max-width:540px){
    .bottombar{gap:8px;padding-left:12px;padding-right:12px}
    .bb-btn{padding:9px 10px;font-size:10px}
    .p-label{display:none}
    body.player-on #btn-theme,body.player-on #btn-chapters,body.player-on #btn-smaller,body.player-on #btn-bigger,body.player-on #btn-mode{display:none}
    body.player-on .progress{min-width:36px}
    .tp-note{padding:0 8px}
  }
  .progress{flex:1;display:flex;flex-direction:column;gap:5px}
  .p-track{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  .p-fill{height:100%;width:0%;background:var(--orange);border-radius:2px;transition:width .2s}
  .p-label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);text-align:center}
  /* FOLIO — the real page number. One page = 250 words, the trade-book
     standard, so "page 217" means the same prose here, in the writing tool,
     and in any future print. Caslon's old-style figures, a centered-dot
     frame, always present, never loud. */
  .folio{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 64px);z-index:29;pointer-events:none;
    font-family:var(--serif);font-size:12.5px;letter-spacing:.32em;text-indent:.32em;
    font-variant-numeric:oldstyle-nums;color:var(--ink-soft);
    background:var(--paper);border:1px solid rgba(127,112,80,.25);
    padding:2px 12px;border-radius:999px;transition:opacity .4s, bottom .3s}
  body.zen .folio{bottom:calc(env(safe-area-inset-bottom) + 14px)}
  .folio.hidden{opacity:0}

  /* ── the gate ── */
  .gate[hidden]{display:none}   /* author display:flex would otherwise beat the hidden attribute */
  .gate{position:fixed;inset:0;z-index:90;background:var(--paper);display:flex;align-items:flex-start;justify-content:center;
    padding:calc(env(safe-area-inset-top) + 14vh) 24px 24px;overflow:auto}
  .gate-card{max-width:340px;width:100%;text-align:center}
  .gate-mark{display:flex;flex-direction:column;align-items:center;margin-bottom:26px}
  .gm-b{font-family:var(--display);font-size:84px;line-height:1;color:var(--ink)}
  .gm-rule{width:64px;height:7px;background:var(--orange);margin-top:10px}
  .gate-title{font-family:var(--display);font-size:clamp(38px,14.5vw,56px);line-height:1;margin:14px 0 28px}
  .gate-input{width:100%;box-sizing:border-box;font-family:var(--mono);font-size:16px;letter-spacing:.12em;text-align:center;
    padding:13px;border:1.5px solid var(--line);border-radius:4px;background:transparent;color:var(--ink);outline:none}
  .gate-input:focus{border-color:var(--orange)}
  .gate-btn{margin-top:12px;width:100%;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    padding:13px;border:1.5px solid var(--ink);border-radius:4px;background:var(--ink);color:var(--paper);cursor:pointer}
  .gate-hint{margin-top:12px;font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink-faint);min-height:1.4em}
  .offline-chip{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);z-index:80;
    font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);
    background:var(--paper-deep);border:1px solid var(--line);border-radius:999px;padding:6px 14px}

  /* ── contents: a tracking rail on wide pages, a sheet on phones ── */
  .toc-scrim{position:fixed;inset:0;z-index:64;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s}
  .toc{z-index:65;background:var(--paper)}
  .toc-head{font-family:var(--serif);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:18px}
  .toc-item{display:flex;gap:12px;align-items:baseline;padding:9px 0;cursor:pointer;border:none;background:none;width:100%;text-align:left}
  .toc-num{font-family:var(--serif);font-size:10.5px;letter-spacing:.14em;color:var(--ink-faint);min-width:26px}
  .toc-name{font-family:var(--display);font-style:italic;font-weight:500;font-size:15.5px;color:var(--ink-soft);line-height:1.3}
  .toc-item.is-current .toc-num{color:var(--orange)}
  .toc-item.is-current .toc-name{color:var(--ink)}
  .toc-item:active .toc-name{color:var(--orange)}
  @media (min-width:1180px){
    .toc{position:fixed;left:max(24px, calc(50vw - 320px - 260px));top:calc(env(safe-area-inset-top) + 56px);bottom:72px;width:210px;
      z-index:30;padding:40px 22px 96px 0;overflow-y:auto;
      border-right:1px solid var(--line);
      transform:none;transition:opacity .28s}
    body.zen .toc{opacity:0;pointer-events:none}
    .toc-scrim{display:none}
  }
  @media (max-width:1179.9px){
    .toc{position:fixed;left:0;right:0;bottom:0;max-height:64vh;overflow-y:auto;
      border-top:1.5px solid var(--line);border-radius:18px 18px 0 0;
      padding:18px 24px calc(env(safe-area-inset-bottom) + 18px);
      transform:translateY(105%);transition:transform .3s cubic-bezier(.22,1,.36,1)}
    body.toc-on .toc{transform:translateY(0)}
    body.toc-on .toc-scrim{opacity:1;pointer-events:auto}
    .toc-item{padding:12px 0;border-bottom:1px solid var(--line)}
    .toc-item:last-child{border-bottom:none}
  }

  /* ── the page ── */
  .book{max-width:640px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 84px) max(24px, env(safe-area-inset-left)) 40vh max(24px, env(safe-area-inset-right))}
  .titlepage{min-height:64vh;display:flex;flex-direction:column;justify-content:center;text-align:center}
  .tp-eyebrow{font-family:var(--serif);font-size:12px;letter-spacing:.38em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:30px}
  .tp-frame{border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:44px 12px 40px;position:relative}
  .tp-frame::before,.tp-frame::after{content:'';position:absolute;left:0;right:0;height:1px;background:var(--ink);opacity:.55}
  .tp-frame::before{top:5px} .tp-frame::after{bottom:5px}
  .tp-title{font-family:var(--display);font-weight:700;font-size:clamp(46px,11vw,84px);line-height:1;letter-spacing:.04em}
  .tp-sub{font-family:var(--display);font-style:italic;font-weight:500;font-size:20px;color:var(--ink-soft);margin-top:22px}
  .tp-fleuron{font-size:15px;color:var(--ink-soft);margin-top:26px}
  .tp-author{font-family:var(--serif);font-size:14px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink);margin-top:24px}
  .tp-rule{width:58px;height:1px;background:var(--ink);margin:30px auto 0;opacity:.5;position:relative}
  .tp-rule::after{content:'❦';position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:var(--paper);padding:0 10px;font-size:12px;color:var(--ink-soft)}
  .tp-note{font-family:var(--serif);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint);margin-top:36px;line-height:2}

  .chapter{padding-top:11vh}
  .ch-head{margin-bottom:6vh;text-align:center}
  .ch-num{font-family:var(--serif);font-size:14px;letter-spacing:.42em;text-transform:uppercase;color:var(--ink-soft);font-variant-numeric:oldstyle-nums}
  .ch-title{font-family:var(--display);font-weight:500;font-style:italic;font-size:clamp(26px,6vw,38px);line-height:1.15;margin-top:18px;letter-spacing:.01em}
  .ch-rule{width:56px;height:1px;background:var(--ink);opacity:.45;margin:26px auto 0;position:relative}
  .ch-rule::after{content:'❦';position:absolute;left:50%;top:-9px;transform:translateX(-50%);
    background:var(--paper);padding:0 10px;font-size:12px;color:var(--ink-soft);transition:background .3s}
  .chapter p{margin:0;text-indent:1.5em;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
  .chapter p.opener{text-indent:0}
  /* the prologue reads as a letter, not novel prose: ragged-right, no indent,
     paragraph spacing, a signature that sits to the right */
  .prologue p{text-indent:0;text-align:left;margin:0 0 1.1em;hyphens:none;-webkit-hyphens:none}
  .prologue .ch-title{font-size:clamp(24px,5.4vw,34px)}
  .prologue-sign{text-align:right;font-style:italic;color:var(--ink-soft);margin-top:1.5em!important}
  .chapter p+p.speaking, .chapter p.speaking{/* keep listen highlight readable */}
  .chapter p.asterism{text-indent:0!important;text-align:center!important;letter-spacing:.9em;padding:1.4em 0;color:var(--ink-soft)}
  .chapter p.asterism + p{text-indent:0}
  .chapter p.wip-note{text-indent:0!important;text-align:center!important;font-family:var(--mono);font-size:10px;
    letter-spacing:.3em;text-transform:uppercase;color:var(--ink-faint);padding:2.2em 0}
  .chapter p.wip-note::first-letter{float:none;font-size:inherit;font-family:inherit;padding:0;font-weight:inherit}
  .chapter p.opener::first-letter{
    font-family:var(--display);font-weight:700;font-size:3.4em;line-height:.8;float:left;
    padding:.04em .14em 0 0;color:var(--ink)}
  .the-end{text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.34em;
    text-transform:uppercase;color:var(--ink-faint);padding:14vh 0 4vh}

  /* highlights */
  mark{background:var(--hl-amber);color:inherit;border-radius:2px;padding:.05em 0;cursor:pointer;
    -webkit-box-decoration-break:clone;box-decoration-break:clone}
  mark.c-green{background:var(--hl-green)} mark.c-blue{background:var(--hl-blue)} mark.c-rose{background:var(--hl-rose)}
  mark.has-note{border-bottom:2px solid var(--orange)}
  html[data-theme="dark"] .sheet-btn.danger{color:#d26e5f;border-color:rgba(210,110,95,.5)}

  /* ── selection pill ── */
  .pill{
    position:fixed;z-index:60;display:none;gap:0;align-items:stretch;
    background:var(--ink);border-radius:8px;overflow:hidden;
    box-shadow:0 6px 24px rgba(0,0,0,.22)}
  .pill.on{display:flex}
  /* touch: the iOS edit menu owns the selection — dock our pill at the bottom
     where the callout can never land, at comfortable touch size */
  @media (pointer: coarse){
    .pill{left:50% !important;top:auto !important;transform:translateX(-50%);
      bottom:calc(env(safe-area-inset-bottom) + 76px)}
    #pill button{padding:15px 22px;font-size:13px}
  }
  body:has(.pill.on) .folio{opacity:0}
  .pill button{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--paper);background:transparent;border:none;padding:13px 18px;cursor:pointer}
  .pill button:active{background:rgba(255,255,255,.14)}
  .pill .sep{width:1px;background:rgba(255,255,255,.2)}

  /* ── note sheet (bottom drawer, iPad-native feel) ── */
  .sheet-scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:71;
    background:var(--paper-deep);border-top:1.5px solid var(--line);
    border-radius:18px 18px 0 0;
    padding:14px 22px calc(env(safe-area-inset-bottom) + 18px);
    transform:translateY(105%);transition:transform .3s cubic-bezier(.22,1,.36,1);
    max-width:720px;margin:0 auto}
  body.sheet-on .sheet{transform:translateY(0)}
  body.sheet-on .sheet-scrim{opacity:1;pointer-events:auto}
  .sheet-grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
  .sheet-quote{font-style:italic;font-size:16px;color:var(--ink-soft);border-left:3px solid var(--orange);
    padding:2px 0 2px 14px;margin-bottom:14px;max-height:5.2em;overflow:hidden;text-overflow:ellipsis}
  .sheet textarea{
    width:100%;min-height:96px;resize:none;border:1.5px solid var(--line);border-radius:8px;
    background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.5;
    padding:12px 14px;outline:none}
  .sheet textarea:focus{border-color:var(--orange)}
  .sheet-row{display:flex;align-items:center;gap:10px;margin-top:12px}
  .swatches{display:flex;gap:8px;margin-right:auto}
  .sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
  .sw.amber{background:rgba(212,149,31,.55)} .sw.green{background:rgba(45,122,79,.5)}
  .sw.blue{background:rgba(52,98,145,.5)} .sw.rose{background:rgba(163,57,42,.5)}
  .sw.sel{border-color:var(--ink)}
  .sheet-btn{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    border:1.5px solid var(--line);background:transparent;color:var(--ink-soft);border-radius:6px;padding:11px 18px;cursor:pointer}
  .sheet-btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .sheet-btn.danger{color:#a3392a;border-color:rgba(163,57,42,.4)}
  .saved-flash{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}

  .loading{min-height:90vh;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint);
    animation:lo 1.3s ease-in-out infinite}
  @keyframes lo{0%,100%{opacity:.4}50%{opacity:1}}
  .orphans{max-width:640px;margin:0 auto;padding:0 24px 8vh}
  .orphans h4{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint);
    border-top:1px solid var(--line);padding-top:26px;margin:0 0 14px}
  .orphan{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
  .orphan .oq{font-style:italic;font-size:15px;color:var(--ink-soft)}
  .orphan .on{font-size:15px;margin-top:6px}
  /* ── PAGED MODE: the book turns pages like a book ── */
  body.paged{overflow:hidden;height:100dvh}
  body.paged .book{position:fixed;top:calc(env(safe-area-inset-top) + 52px);bottom:calc(env(safe-area-inset-bottom) + 64px);
    left:50%;transform:translateX(-50%);width:min(692px,100vw);max-width:none;margin:0;padding:0;overflow:hidden}
  body.paged .pages{height:100%;column-fill:auto;
    transform:translateX(0);transition:transform .3s cubic-bezier(.22,1,.36,1);will-change:transform}
  body.paged .titlepage{min-height:0;height:96%}
  body.paged .chapter{break-before:column;-webkit-column-break-before:always;padding-top:2vh}
  body.paged .ch-head{margin-bottom:4vh}
  body.paged .the-end{padding:5vh 0}
  body.paged .orphans{max-width:none;margin:0;padding:0}

  /* ── the hamburger: contents from anywhere (the rail owns wide screens) ── */
  .tb-burger{font-size:17px;line-height:1;background:none;border:none;color:var(--ink-soft);
    cursor:pointer;padding:2px 8px 2px 0;align-self:center}
  .tb-burger:active{color:var(--orange)}
  @media (min-width:1180px){ .tb-burger{display:none} }

  /* ── the signature: a name asked once, remembered on this device ── */
  .namebox[hidden]{display:none}   /* hidden must beat any display author style */
  .namebox-scrim{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s}
  body.name-on .namebox-scrim{opacity:1;pointer-events:auto}
  .namebox{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:96;width:min(340px,86vw);
    background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:26px 24px 18px;text-align:center;
    box-shadow:0 18px 60px rgba(0,0,0,.25)}
  .nb-head{font-family:var(--display);font-style:italic;font-size:24px;margin-bottom:8px}
  .nb-sub{font-family:var(--serif);font-size:13.5px;color:var(--ink-soft);margin-bottom:18px;line-height:1.5}
  .nb-skip{margin-top:12px;background:none;border:none;font-family:var(--mono);font-size:10px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);cursor:pointer}
  .sheet-sig{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-faint);margin-top:10px;text-align:right}

<script>
/* ═══ BERGUNDY reader — Kindle-like, iPad-first, read-only + margin notes.
   Hardened per adversarial audit: true-offset anchoring, re-anchor on locate
   failure, POST-first edits, honest save feedback, keyboard-aware sheet,
   per-node mark wrapping, orphan-note strip, paragraph-based place memory. ═══ */
const API = '/api/burgundy-notes';
const $ = id => document.getElementById(id);
let BOOK = null, NOTES = [], sel = null, editingNote = null, color = 'amber';
let lastSelCollapse = 0, hadSelection = false;

/* storage-blocked browsers (iOS 'Block All Cookies', in-app webviews, private
   mode) throw on the mere touch of localStorage — guard READS and writes. */
const safeGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
let READER = null;   // per-device identity: each reader sees only their own margin notes
function readerId() {
  if (READER) return READER;
  // A per-reader URL token (?r=jess) is the DURABLE identity: it survives a
  // device switch, a Safari data-clear, and iOS ITP storage eviction, so one
  // person's notes never fragment into many ids and never lose their own
  // highlights on a second device. Hand each reader their own link before they
  // open it. Falls back to a per-device random id for anyone who opens the bare
  // URL. (2026-07-17 pre-onboarding identity fix)
  const tok = (new URLSearchParams(location.search).get('r') || '').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 32);
  if (tok) { READER = 'r-' + tok; safeSet('bg-reader', READER); return READER; }
  READER = safeGet('bg-reader');
  if (!READER) { READER = 'r-' + (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now()); safeSet('bg-reader', READER); }
  return READER;
}
const safeSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

/* ── load the book + notes ── */
async function boot() {
  try {
    // absolute path: /burgundy (no trailing slash) serves this page too, and a
    // relative fetch from there resolves book.json against the site root and 404s
    const r = await fetch('/burgundy/book.json?t=' + Math.floor(Date.now() / 60000));
    if (!r.ok) throw new Error('no book');
    BOOK = await r.json();
  } catch (err) {
    const offlineish = !navigator.onLine || /fetch|network|load/i.test(String(err?.message || err));
    $('book').innerHTML = offlineish
      ? `<div class="loading">couldn\u2019t reach the book \u2014 check your signal<br><br>
          <button class="bb-btn" onclick="boot()" style="margin-top:8px">try again</button></div>`
      : '<div class="loading">the book has not been published yet</div>';
    return;
  }
  try {
    // page through notes (500/page) so old highlights never fall off
    let all = [], page = 0;
    while (page < 6) {
      const r = await fetch(API + '?page=' + page);
      const d = await r.json();
      all = all.concat(d.notes || []);
      if (!d.notes || d.notes.length < 500) break;
      page++;
    }
    NOTES = all.filter(n => n.reader === readerId());
  } catch { NOTES = []; }
  // offline: anything still in the device queue is YOURS — show it
  NOTES = NOTES.concat(queuedNotes().map(r => ({ ...r, id: r._lid || ('local-' + Math.random().toString(36).slice(2)), _local: true })));
  render();
  if (safeGet('bg-place2')) document.body.classList.add('zen');   // returning reader: quiet page; first-timer sees the controls
  restorePlace();
}

/* the ROOT book object. A malformed publish (the WIP-novel tool writing a
   literal `null`, a bare array, or a primitive to book.json) yields a non-object
   BOOK, and render() runs OUTSIDE any try/catch — a bare `BOOK.chapters` on a
   null BOOK throws a TypeError that strands the whole reader on the "opening the
   book…" spinner. Coerce to a usable object so render never dereferences null,
   completing the chapter/paragraph-level guards one level up at the root.
   Byte-identical for any real (object) book. */
function safeBook(b) { return b && typeof b === 'object' ? b : {}; }
function bareTitle(t) {
  return String(t || '').replace(/^\s*chapter\s+(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\s*[:·.\-—]?\s*/i, '').trim();
}
function render() {
  const el = $('book');
  const book = safeBook(BOOK);
  const chapters = book.chapters || [];
  let html = `
    <div class="titlepage">
      <div class="tp-eyebrow">a novel in progress</div>
      <div class="tp-frame">
        <div class="tp-title">BURGUNDY</div>
        ${book.subtitle ? `<div class="tp-sub">${esc(book.subtitle)}</div>` : '<div class="tp-sub">A Novel</div>'}
        <div class="tp-fleuron">❦</div>
        <div class="tp-author">by Henry Harris</div>
      </div>
      <div class="tp-rule"></div>
      <div class="tp-note">set forth ${pubDate(book.published_at)}<br>
        tap the right edge to turn the page · the left edge to turn back<br>
        tap the middle of the page to wake the controls<br>
        press and hold a sentence to leave a note for the author<br>
        this device remembers your place, your name, your notes, and your audio</div>
    </div>`;
  // Johnny's note to the readers — front matter, formatted like a prologue
  // (no chapter numeral, a letter-set left rag, signed). Not annotatable (no
  // data-key), it is not part of the manuscript readers mark up.
  html += `
    <section class="chapter prologue" data-ch="pro">
      <div class="ch-head">
        <div class="ch-num">Prologue</div>
        <div class="ch-title">What This Is</div>
        <div class="ch-rule"></div>
      </div>
      <p class="opener">Burgundy is the product of five years of conversation — between Henry and me and others, including the weekly FaceTimes with his grandma where he first began building his world.</p>
      <p>Henry's imagination is vast and singular. It's a mind unlike any I know, by a long way. As he's gotten older — as he's devoured hundreds of novels and taught himself geopolitics, astrophysics, engineering, and economics — those subjects have found their way into his invented worlds.</p>
      <p>Three years ago it became clear that his world had grown big and complex enough to become a novel, while staying coherent enough to actually hold together. So we started developing it, mostly just in conversation: characters, storylines, the shape of things. Two years ago we began putting down words — slowly, in the long breaks from school and work. This year we made real progress.</p>
      <p>And that's what this is: an initial manuscript of the first few chapters. An introduction to the world Henry invited me into, and that I've helped him build.</p>
      <p>Have a read, and tell us what you think. What's working and what isn't. What lands and what confuses. We want to hear all of it.</p>
      <p class="prologue-sign">— Johnny</p>
    </section>`;
  chapters.forEach((ch, ci) => { html += chapterHTML(ch, ci, esc); });
  html += `<div class="the-end">· to be continued ·</div><div class="orphans" id="orphans"></div>`;
  el.innerHTML = `<div class="pages" id="pages">${html}</div>`;
  buildFolio();
  paintNotes();
  renderToc();
  observeChapters();
}

/* ── the folio: real book pages ──────────────────────────────────
   One page = 250 words (the estimator the trade has used forever).
   Computed once per render from the same words every surface sees,
   so the number agrees with the writing tool. */
const FOLIO_WPP = 250;
let FOLIO_TOTAL = 1;
function buildFolio() {
  let cum = 0;
  for (const p of document.querySelectorAll('.chapter p[data-key]')) {
    const t = p.textContent.trim();
    if (t) cum += t.split(/\s+/).length;
    // page of the word this paragraph ENDS on. Use the SAME ceil formula as
    // FOLIO_TOTAL so the two never disagree: a paragraph ending exactly on a
    // page boundary (cum a multiple of 250) stays on the page it just filled
    // instead of jumping ahead — otherwise you get "page N+1 of N".
    p.dataset.bookpage = Math.max(1, Math.ceil(cum / FOLIO_WPP));
  }
  FOLIO_TOTAL = Math.max(1, Math.ceil(cum / FOLIO_WPP));
}
function setFolio(p) {
  const el = $('folio'); if (!el) return;
  if (!p || !p.dataset.bookpage) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  el.textContent = `· ${p.dataset.bookpage} ·`;
  el.title = `page ${p.dataset.bookpage} of ${FOLIO_TOTAL} — a page is 250 words`;
}
function folioFromScroll() {
  const top = [...document.querySelectorAll('.chapter p[data-key]')].find(p => p.getBoundingClientRect().bottom > 90);
  setFolio(top || null);
}

/* one chapter's HTML. A chapter still being drafted (this is "a novel in
   progress") may carry a title but no paragraphs array yet — guard it so a
   half-written or malformed chapter renders its heading with no body instead of
   throwing a TypeError that bricks render() and strands the whole reader on the
   loading spinner. The chapter ENTRY itself can also be null/non-object (a
   malformed publish leaving a hole in the chapters array) — coerce it so
   `ch.paragraphs`/`ch.title` never throw and the rest of the book still renders.
   Byte-identical output for any well-formed chapter. */
function chapterHTML(ch, ci, esc) {
  const c = ch && typeof ch === 'object' ? ch : {};
  const paras = Array.isArray(c.paragraphs) ? c.paragraphs : [];
  const roman = (n) => { const R = [[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']]; let s = ''; for (const [v, r] of R) while (n >= v) { s += r; n -= v; } return s; };
  // the display title drops any leading "chapter N" — the numeral line carries it.
  // Coerce first: a malformed publish can leave a non-string title (number/null),
  // and a bare `.replace` on that throws and bricks the whole reader.
  const bare = String(c.title || '').replace(/^\s*chapter\s+(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\s*[:·.\-—]?\s*/i, '').trim();
  return `<section class="chapter" data-ch="${ci}" data-chid="${esc(String(c.id || ''))}">
      <div class="ch-head">
        <div class="ch-num">Chapter ${roman(ci + 1)}</div>
        ${bare ? `<div class="ch-title">${esc(bare)}</div>` : ''}
        <div class="ch-rule"></div>
      </div>
      ${(() => {
        let openerDone = false;
        return paras.map((p, pi) => {
          // Coerce first: a malformed/mid-edit publish can leave a non-string
          // paragraph element; a bare p.trim() throws and bricks the whole reader.
          const s = String(p ?? '');
          const t = s.trim();
          if (/^[\s*·—-]{2,}$/.test(t)) return `<p class="asterism" data-key="${ci}:${pi}">＊ ＊ ＊</p>`;
          if (/^\[?work in progress\]?$/i.test(t)) return `<p class="wip-note" data-key="${ci}:${pi}">· work in progress ·</p>`;
          const cls = openerDone ? '' : ' class="opener"';
          openerDone = true;
          // inline formatting from the manuscript, restored post-esc (esc never
          // touches ~ or *): ~~strike~~, ***bold-italic***, **bold**, *italic*.
          // textContent stays clean so note anchoring (which counts textContent)
          // is unaffected; highlighting already spans inline elements via <s>.
          const md = esc(s)
            .replace(/~~([^~]+?)~~/g, '<s>$1</s>')
            .replace(/\*\*\*([^*]+?)\*\*\*/g, '<strong><em>$1</em></strong>')
            .replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*([^*]+?)\*/g, '<em>$1</em>');
          return `<p${cls} data-key="${ci}:${pi}">${md}</p>`;
        }).join('');
      })()}
    </section>`;
}

/* ── notes: paint highlights; unplaceable ones surface in an orphan strip ── */
function paintNotes() {
  const orphans = [];
  for (const n of NOTES) { try { if (!paintNote(n)) orphans.push(n); } catch (e) { console.warn('[paint]', n.id, e); orphans.push(n); } }
  renderOrphans(orphans);
}
function paintNote(n) {
  // 1) fast path: the stored paragraph key
  let p = document.querySelector(`p[data-key="${CSS.escape(n.para_key)}"]`);
  let idx = p ? locate(p.textContent, n.quote, n.prefix) : -1;
  // 2) RE-ANCHOR: indices shift on republish — locate failure (not just a
  //    missing key) triggers the whole-book search
  if (idx < 0) {
    p = findByQuote(n);
    idx = p ? locate(p.textContent, n.quote, n.prefix) : -1;
  }
  if (!p || idx < 0) return false;
  return wrapRange(p, idx, n.quote.length, n);
}
function findByQuote(n) {
  let fallback = null;
  for (const p of document.querySelectorAll('.chapter p')) {
    const t = p.textContent;
    if (!t.includes(n.quote)) continue;
    if (!fallback) fallback = p;
    // prefer a paragraph where the prefix ALSO matches (repeated phrases)
    if (!n.prefix) return p;
    const i = t.indexOf(n.quote);
    const before = t.slice(Math.max(0, i - (n.prefix || '').length), i);
    if (before.endsWith((n.prefix || '').slice(-12))) return p;
  }
  return fallback;
}
function locate(text, quote, prefix) {
  if (!quote) return -1;
  let idx = -1, from = 0, first = -1;
  while ((idx = text.indexOf(quote, from)) !== -1) {
    if (first < 0) first = idx;
    if (!prefix) return idx;
    const before = text.slice(Math.max(0, idx - prefix.length), idx);
    if (before === prefix || before.endsWith(prefix.slice(-12))) return idx;
    from = idx + 1;
  }
  return first;   // prefix mismatch → first occurrence beats nothing
}
function wrapRange(p, start, len, n) {
  // wrap PER TEXT NODE — a single surroundContents throws when the range
  // partially overlaps an existing mark, silently losing the paint
  const nodes = [];
  let seen = 0;
  const walker = document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
  while (walker.nextNode()) {
    const t = walker.currentNode, l = t.textContent.length;
    const a = Math.max(start, seen), b = Math.min(start + len, seen + l);
    if (a < b) nodes.push({ node: t, from: a - seen, to: b - seen });
    seen += l;
    if (seen >= start + len) break;
  }
  if (!nodes.length) return false;
  for (const { node, from, to } of nodes) {
    try {
      const r = document.createRange();
      r.setStart(node, from); r.setEnd(node, to);
      const mark = document.createElement('mark');
      mark.className = 'c-' + (n.color || 'amber') + (n.note ? ' has-note' : '');
      mark.dataset.noteId = n.id;
      r.surroundContents(mark);
    } catch { /* node already fully inside a mark — visual overlap, fine */ }
  }
  return true;
}
function renderOrphans(list) {
  const host = $('orphans');
  if (!host) return;
  host.innerHTML = list.length ? `<h4>notes whose passage has changed (${list.length})</h4>` + list.map(n => `
    <div class="orphan" data-id="${n.id}">
      <div class="oq">“${esc((n.quote || '').slice(0, 140))}”</div>
      ${n.note ? `<div class="on">${esc(n.note)}</div>` : ''}
    </div>`).join('') : '';
  host.querySelectorAll('.orphan').forEach(el => el.addEventListener('click', () => {
    const n = NOTES.find(x => x.id === el.dataset.id);
    if (n) openSheet(n);
  }));
}

/* ── selection → pill (true offsets — repeated phrases anchor correctly) ── */
function paraOfNode(node) {
  const el = node?.nodeType === 1 ? node : node?.parentElement;
  return el?.closest?.('p[data-key]') || null;
}
function offsetInPara(p, node, nodeOffset) {
  // Measure with a Range, not a text-node walk. The old walk matched only
  // TEXT-node containers (t === node); but once a paragraph carries <mark>s,
  // iPad/WebKit routinely reports a selection endpoint as an ELEMENT node
  // (the <p> or a <mark>, with a child-index offset). The walk then returned
  // -1 and the selectionchange handler bailed -> the highlight pill vanished,
  // worse the more highlights existed. A Range counts characters from the
  // paragraph start whether the container is text OR an element, matching the
  // textContent counting used elsewhere. (2026-07-16 selection-decay fix)
  try {
    const r = document.createRange();
    r.selectNodeContents(p);
    r.setEnd(node, nodeOffset);
    return r.toString().length;
  } catch { return -1; }
}
document.addEventListener('selectionchange', () => {
  const s = document.getSelection();
  if (!s || s.isCollapsed || !s.rangeCount) {
    if (hadSelection) lastSelCollapse = Date.now();
    hadSelection = false;
    hidePill(); return;
  }
  const range = s.getRangeAt(0);
  const p = paraOfNode(range.startContainer);
  if (!p || !p.closest('.chapter')) { hidePill(); return; }
  hadSelection = true;
  const full = p.textContent;
  let startOff = offsetInPara(p, range.startContainer, range.startOffset);
  if (startOff < 0) { hidePill(); return; }
  // clamp to the START paragraph — cross-paragraph phantoms can never paint
  const pEnd = paraOfNode(range.endContainer);
  let quote;
  if (pEnd === p) {
    const endOff = offsetInPara(p, range.endContainer, range.endOffset);
    quote = full.slice(startOff, endOff > startOff ? endOff : undefined).trim();
  } else {
    quote = full.slice(startOff).trim();
  }
  if (!quote || quote.length < 3 || quote.length > 1200) { hidePill(); return; }
  sel = {
    para_key: p.dataset.key,
    chapter_idx: +(p.closest('.chapter')?.dataset.ch || 0),
    // the tool's permanent chapter id — insertion-proof anchoring
    chapter_id: p.closest('.chapter')?.dataset.chid || '',
    quote,
    prefix: startOff > 0 ? full.slice(Math.max(0, startOff - 24), startOff) : '',
  };
  showPill(range.getBoundingClientRect());
});
const COARSE_POINTER = matchMedia('(pointer: coarse)').matches;
let pillTimer = 0;
function showPill(rect) {
  const pill = $('pill');
  if (COARSE_POINTER) {
    // TOUCH: iPadOS's own edit menu (Copy / Look Up) hugs the selection and
    // cannot be suppressed or predicted, so we stop fighting it for that
    // space. The pill docks at the bottom of the screen (CSS owns position),
    // and appears only after the selection has settled — no flicker while
    // the handles drag, no overlap ever.
    clearTimeout(pillTimer);
    pillTimer = setTimeout(() => pill.classList.add('on'), 350);
    return;
  }
  pill.classList.add('on');
  const vv = window.visualViewport;
  const pw = pill.offsetWidth || 210, ph = pill.offsetHeight || 46;
  let x = rect.left + rect.width / 2 - pw / 2;
  const minX = (vv ? vv.offsetLeft : 0) + 10;
  const maxX = (vv ? vv.offsetLeft + vv.width : innerWidth) - pw - 10;
  x = Math.max(minX, Math.min(maxX, x));
  let y = rect.bottom + 12;   // below the selection — the callout usually owns the top
  const vBottom = vv ? vv.offsetTop + vv.height : innerHeight;
  if (y + ph > vBottom - 76) y = rect.top - ph - 12;   // keyboard/bottombar collision → flip above
  pill.style.left = x + 'px'; pill.style.top = y + 'px';
}
function hidePill() { clearTimeout(pillTimer); $('pill').classList.remove('on'); }

// pointerdown beats iOS selection-collapse: act BEFORE the tap clears the selection
$('pill').addEventListener('pointerdown', async (e) => {
  e.preventDefault(); e.stopPropagation();
  const id = e.target.closest('button')?.id;
  // GESTURE LOCK (2026-07-16): capture the selection and drop it SYNCHRONOUSLY
  // before the await, so a second tap during the in-flight save is a no-op.
  // saveNote paints first, so hiding the pill immediately loses nothing — and
  // it closes the double-tap duplicate vector the per-save key cannot (two taps
  // = two keys). This was a real source of the byte-identical note pairs.
  const s = sel;
  if (id === 'pill-hl' && s) {
    sel = null; clearSelection();
    await saveNote({ ...s, note: '', color });
  } else if (id === 'pill-note' && s) {
    sel = null; hidePill();

const SILENT = 'data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYyLjEyLjEwMAAAAAAAAAAAAAAA//OEwAAAAAAAAAAAAEluZm8AAAAPAAAADwAABmAALS0tLS0tPDw8PDw8PEtLS0tLS1paWlpaWlppaWlpaWlpeHh4eHh4h4eHh4eHh5aWlpaWlpalpaWlpaW0tLS0tLS0w8PDw8PDw9LS0tLS0uHh4eHh4eHw8PDw8PDw////////AAAAAExhdmM2Mi4yOAAAAAAAAAAAAAAAACQDYAAAAAAAAAZga5fgdQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//NExAAAAANIAAAAAExBTUUzLjEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMu//NExFMAAANIAAAAADEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMu//NExKYAAANIAAAAADEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMu//NExKwAAANIAAAAADEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMu//NExKwAAANIAAAAADEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMu//NExKwAAANIAAAAADEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMu//NExKwAAANIAAAAADEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMu//NExKwAAANIAAAAADEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMu//NExKwAAANIAAAAADEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMu//NExKwAAANIAAAAADEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMu//NExKwAAANIAAAAADEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMu//NExKwAAANIAAAAADEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMu//NExKwAAANIAAAAADEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NExKwAAANIAAAAAFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//NExKwAAANIAAAAAFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV';
const tts = new Audio();
tts.setAttribute('playsinline', ''); tts.preload = 'auto';
const player = { on: false, idx: -1, flat: [], urls: new Map(), errors: 0 };
let playSeq = 0;

const speakable = t => /[\p{L}\p{N}]/u.test(t);
function flatParas() {
  // struck-through prose (<s>) is a visible cut — the narrator skips it
  const spoken = (p) => {
    if (!p.querySelector('s')) return p.textContent;
    const c = p.cloneNode(true);
    c.querySelectorAll('s').forEach(x => x.remove());
    return c.textContent;
  };
  return [...document.querySelectorAll('.chapter p[data-key]:not(.asterism):not(.wip-note)')]
    .map(p => ({ el: p, key: p.dataset.key, text: spoken(p) }))
    .filter(x => speakable(x.text));
}
function savedAudioIdx(flat) {
  // the furthest point wins — read ahead silently and ▶ continues from THERE,
  // never back to where you last listened (tap any paragraph to override)
  const audio = safeGet(AUDIO_PLACE);
  const read = placeParts(safeGet('bg-place2')).key;
  const ai = audio ? flat.findIndex(u => u.key === audio) : -1;
  const ri = read ? flat.findIndex(u => u.key === read) : -1;
  return Math.max(ai, ri, 0);
}
function urlFor(i) {
  const u = player.flat[i]; if (!u) return Promise.reject(new Error('out of range'));
  if (player.urls.has(u.key)) return player.urls.get(u.key);
  const pr = fetch(TTS_API, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: u.text, voice_id: safeBook(BOOK).voice_id }),
  }).then(r => r.json()).then(d => {
    if (!d.url) throw new Error(d.error || 'tts failed');
    try {   // remember paragraph→mp3 URLs on device: cached audio then plays fully offline
      const map = ttsUrlMap();
      map[u.key] = d.url;
      const keys = Object.keys(map);
      if (keys.length > 1200) for (const k of keys.slice(0, keys.length - 1200)) delete map[k];
      safeSet('bg-tts-urls', JSON.stringify(map));
    } catch {}
    return d.url;
  }).catch(err => {
    const map = ttsUrlMap();
    if (map[u.key]) return map[u.key];   // offline: the SW audio cache serves it
    throw err;
  });
  player.urls.set(u.key, pr);
  pr.catch(() => player.urls.delete(u.key));   // a failed fetch must not poison the cache
  return pr;
}
function markSpeaking(i) {
  document.querySelectorAll('.chapter p.speaking').forEach(p => p.classList.remove('speaking'));
  const u = player.flat[i]; if (!u || !u.el.isConnected) return;
  u.el.classList.add('speaking');
  if (!document.hidden) {
    if (pagedOn()) { const pg = pageOfEl(u.el); if (pg !== paged.page) goToPage(pg); }
    else u.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}
function mediaMeta(i) {
  if (!('mediaSession' in navigator)) return;
  try {
    const book = safeBook(BOOK);
    const ci = player.flat[i] ? +player.flat[i].key.split(':')[0] : 0;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: bareTitle(book.chapters?.[ci]?.title) || `chapter ${ci + 1}`,
      artist: 'BURGUNDY — Henry Harris',
      album: book.subtitle || 'a novel in progress',
    });
  } catch {}
}
async function startAt(i) {
  if (!player.on) return;
  if (i < 0 || i >= player.flat.length) { closePlayer(); return; }
  const seq = ++playSeq;
  try { tts.pause(); } catch {}   // never talk over the paragraph being replaced
  player.idx = i;
  player.loading = true;
  markSpeaking(i); mediaMeta(i);
  updatePlayerChrome('loading');
  let url;
  try { url = await urlFor(i); } catch { player.loading = false; return skipForward(seq, i); }
  if (seq !== playSeq || !player.on) { player.loading = false; return; }   // user moved on
  tts.src = url;
  tts.dataset.seq = String(seq);
  try { await tts.play(); player.errors = 0; } catch {}
  player.loading = false;
  safeSet(AUDIO_PLACE, player.flat[i].key);   // saved only once playback truly starts
  updatePlayerChrome();
  urlFor(i + 1).catch(() => {});   // prefetch the next paragraph — the gap stays tiny
}
function skipForward(seq, i) {
  if (seq !== playSeq || !player.on) return;
  player.errors++;
  if (player.errors > 3) { updatePlayerChrome('error'); return; }
  if (i + 1 < player.flat.length) startAt(i + 1); else closePlayer();
}
// the SILENT unlock clip also fires 'ended' — only a real paragraph may advance the queue
tts.addEventListener('ended', () => { if (player.on && tts.src && !tts.src.startsWith('data:')) startAt(player.idx + 1); });
tts.addEventListener('error', () => { if (player.on && tts.src && !tts.src.startsWith('data:') && +tts.dataset.seq === playSeq) skipForward(playSeq, player.idx); });
tts.addEventListener('pause', () => updatePlayerChrome());
tts.addEventListener('play', () => updatePlayerChrome());
function openPlayer() {
  player.on = true; player.flat = flatParas(); player.errors = 0;
  document.body.classList.remove('zen');   // a listener must never lose the controls
  document.body.classList.add('player-on');
  // unlock audio INSIDE the tap gesture — iOS requires the first play be user-driven.
  // The queue begins only AFTER the silent clip fully finishes, so its late
  // ended/error events can never race a real paragraph and bump the place.
  tts.src = SILENT;
  let begun = false;
  const begin = () => { if (begun || !player.on) return; begun = true; startAt(savedAudioIdx(player.flat)); };
  tts.addEventListener('ended', begin, { once: true });
  tts.addEventListener('error', begin, { once: true });
  setTimeout(begin, 700);   // safety net if the silent clip never reports
  tts.play().catch(() => {});
  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', () => { tts.play().catch(() => {}); });
      navigator.mediaSession.setActionHandler('pause', () => { tts.pause(); });
      navigator.mediaSession.setActionHandler('previoustrack', () => startAt(Math.max(0, player.idx - 1)));
      navigator.mediaSession.setActionHandler('nexttrack', () => startAt(player.idx + 1));
    } catch {}
  }
}
function closePlayer() {
  player.on = false; playSeq++; player.loading = false;
  try { tts.pause(); tts.removeAttribute('src'); tts.load(); } catch {}
  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.metadata = null;
      for (const a of ['play', 'pause', 'previoustrack', 'nexttrack']) navigator.mediaSession.setActionHandler(a, null);
    } catch {}
  }
  document.body.classList.remove('player-on');
  document.querySelectorAll('.chapter p.speaking').forEach(p => p.classList.remove('speaking'));
  updatePlayerChrome();
}
function updatePlayerChrome(state) {
  const b = $('btn-listen'); if (!b) return;
  if (!player.on) { b.textContent = '▶ listen'; b.classList.remove('live'); return; }
  b.classList.add('live');
  b.textContent = state === 'loading' ? '· · ·'
    : state === 'error' ? '✕ voice' : (tts.paused ? '▶' : '⏸');
}
$('btn-listen').addEventListener('click', () => {
  if (!player.on) { openPlayer(); return; }
  if (player.loading) {   // pause during '· · ·' = cancel the pending load, stay put
    playSeq++; player.loading = false; updatePlayerChrome(); return;
  }
  if (tts.paused) { if (tts.src && !tts.src.startsWith('data:')) tts.play().catch(() => {}); else startAt(savedAudioIdx(player.flat)); }
  else tts.pause();
  updatePlayerChrome();
});
$('btn-lx').addEventListener('click', closePlayer);
const dl = { busy: false, expected: 0 };
// the audiobook is only truly "downloaded" when EVERY paragraph both resolved to
// a URL and fetched clean. reportedTotal is the SW's view (the resolved-URL count);
// expected is the true paragraph count. a silently-skipped resolution (a transient
// TTS failure in the click loop) makes reportedTotal < expected, so we must NOT
// persist the green "done" state — else one dropped paragraph = a silent offline
// gap under a button that promises a full week of listening.
function audiobookFullyDownloaded(reportedTotal, expected, failed) {
  return !failed && expected > 0 && reportedTotal >= expected;
}
function dlChrome(done, total, failed) {
  const b = $('btn-dl'); if (!b) return;
  if (dl.busy) { b.classList.add('busy'); b.classList.remove('done'); b.textContent = `${Math.round(done / Math.max(1, total) * 100)}%`; return; }
  const complete = safeGet('bg-audiobook-done') === (safeBook(BOOK).version || 'v');
  b.classList.toggle('done', complete);
  b.classList.remove('busy');
  b.textContent = complete ? '✓ kept' : '⤓ keep audio';
  b.title = complete ? 'audio downloaded — every night this week works offline' : 'download the audio to this device';
}
navigator.serviceWorker?.addEventListener('message', (e) => {
  const m = e.data || {};
  if (m.type !== 'audiobook-progress') return;
  dlChrome(m.done, m.total, m.failed);
  if (m.done >= m.total) {
    dl.busy = false;
    if (audiobookFullyDownloaded(m.total, dl.expected, m.failed)) safeSet('bg-audiobook-done', safeBook(BOOK).version || 'v');
    dlChrome();
  }
});
$('btn-dl').addEventListener('click', async () => {
  if (dl.busy) return;
  dl.busy = true;
  $('btn-dl').textContent = '· · ·';
  try { navigator.storage?.persist?.(); } catch {}   // ask iOS to keep the audiobook
  const reg = await (navigator.serviceWorker?.ready || Promise.resolve(null));
  if (!reg?.active) { dl.busy = false; dlChrome(); return; }
  if (!player.flat.length) player.flat = flatParas();
  dl.expected = player.flat.length;   // the TRUE paragraph count — a dropped resolution must not read as complete
  dlChrome(0, player.flat.length);
  // resolve every paragraph URL (the server synthesizes each AT MOST once, ever)
  const urls = [];
  for (let i = 0; i < player.flat.length; i++) {
    try { urls.push(await urlFor(i)); } catch {}
    if (i % 10 === 0) dlChrome(Math.round(i / 2), player.flat.length);   // resolving ≈ first half of the bar
  }
  const map = ttsUrlMap();   // hardened: a corrupt/legacy non-object store can't poison the audiobook manifest
  reg.active.postMessage({ type: 'download-audiobook', urls, map });
});
setTimeout(() => dlChrome(), 1200);
$('btn-prevp').addEventListener('click', () => startAt(Math.max(0, player.idx - 1)));
$('btn-nextp').addEventListener('click', () => startAt(player.idx + 1));

function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
/* a present-but-unparseable published_at (legacy/hand-edited book.json) must never
   render the literal "Invalid Date" on the title page — fall back to today. */
function pubDate(v) { const d = new Date(v || Date.now()); return isNaN(d.getTime()) ? new Date().toLocaleDateString() : d.toLocaleDateString(); }
/* ── the gate: one little word, remembered forever on this device ── */
function gateOpen() { return (safeGet('bg-key') || '') === 'mycoldmars'; }
let gateMisses = 0;
function showGate() {
  const g = $('gate'); g.hidden = false;
  const go = () => {
    // letters only, any case: forgives iOS autocapitalize, the double-space
    // period, stray spaces — "My cold mars." opens the book
    const v = ($('gate-input').value || '').toLowerCase().replace(/[^a-z]/g, '');
    if (v === 'mycoldmars') { safeSet('bg-key', 'mycoldmars'); g.hidden = true; boot(); }
    else {
      gateMisses++;
      $('gate-hint').textContent = gateMisses >= 2
        ? 'one small word, letters only — check the message that brought you here.'
        : 'not that word — ask the author.';
      $('gate-input').select();
    }
  };
  $('gate-form').addEventListener('submit', e => { e.preventDefault(); go(); });
  setTimeout(() => $('gate-input').focus(), 200);
}

/* ── offline: the book reads from device, notes queue until signal returns ── */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/burgundy/sw.js', { scope: '/burgundy/' }).catch(() => {});
}
function refreshOfflineChip() { $('offline-chip').hidden = navigator.onLine; }
addEventListener('online', () => { refreshOfflineChip(); flushNoteQueue(); });
addEventListener('offline', refreshOfflineChip);
function queuedNotes() { try { const v = JSON.parse(safeGet('bg-note-queue') || '[]'); return Array.isArray(v) ? v : []; } catch { return []; } }
function queueNote(row) {
  const q = queuedNotes(); q.push(row);
  safeSet('bg-note-queue', JSON.stringify(q));
  if (queuedNotes().length !== q.length) {
    // shared 5MB origin quota is full — evict the biggest cache and retry once
    try { localStorage.removeItem('bg-tts-urls'); } catch {}
    safeSet('bg-note-queue', JSON.stringify(q));
    if (queuedNotes().length !== q.length) console.warn('[notes] storage full — note may not sync until space frees');
  }
}
let flushingQueue = false;
async function flushNoteQueue() {
  // reentrancy guard: 'online', 'visibilitychange', the 60s heartbeat and boot can all
  // fire near-simultaneously (network-return + foreground routinely coincide on mobile).
  // The queue is only cleared AFTER every POST resolves, so a second concurrent flush
  // would read the same un-cleared queue and re-POST every row → permanent duplicate notes.
  if (flushingQueue) return;
  const q = queuedNotes();
  if (!q.length || !navigator.onLine) return;
  flushingQueue = true;
  try {
    const sentLids = new Set();
    for (const row of q) {
      try {
        if (row._delete) {   // a queued delete (edit/remove that failed while flaky)
          const r = await fetch(`${API}?id=${row._delete}`, { method: 'DELETE' });
          if (r.ok || r.status === 404) sentLids.add(row._lid);
          continue;
        }
        const { _lid, ...clean } = row;
        // a row queued under the OLD build carries no dedupe_key — stamp one
        // from its stable _lid so a reflush can't insert a twin (2026-07-16)
        if (!clean.dedupe_key && _lid) clean.dedupe_key = 'dk-q-' + _lid;
        const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(clean) });
        if (r.ok) sentLids.add(row._lid);
      } catch {}
    }
    // NEVER write back the stale snapshot: a note written DURING this flush
    // exists only in the fresh queue. Re-read, remove only what actually sent.
    const still = queuedNotes().filter(row => !sentLids.has(row._lid));
    safeSet('bg-note-queue', JSON.stringify(still));
    // NO refetch here. The painted local copies stay on screen; boot does the
    // real reconciliation. A stale service-worker page-0 snapshot must never
    // overwrite live NOTES and strip fresh marks (the iPad vanishing-highlight bug).
  } finally {
    flushingQueue = false;
  }
}

// Safari wipes localStorage after 7 idle days but Cache Storage often survives —
// restore the paragraph→audio map from the audiobook manifest so kept audio stays playable
(async () => {
  try {
    if (!safeGet('bg-tts-urls') && 'caches' in window) {
      const cache = await caches.open('bg-audiobook-v1');
      const mf = await cache.match('/burgundy/audiobook-manifest');
      if (mf) safeSet('bg-tts-urls', JSON.stringify(await mf.json()));
    }
  } catch {}
})();
refreshOfflineChip();
if (gateOpen()) boot(); else showGate();
flushNoteQueue();
// belt-and-braces: 'online' events are unreliable across webviews — also retry
// when the app comes back to the foreground and on a slow heartbeat
document.addEventListener('visibilitychange', () => { if (!document.hidden) flushNoteQueue(); });
setInterval(() => { if (queuedNotes().length) flushNoteQueue(); }, 60000);
</script>
