let spans = [];
paras.forEach((ws) => {
  if(!ws) return;
  const p = document.createElement('p');
  ws.forEach((t) => {
    const s = document.createElement('span');
    s.className = 'w'; s.textContent = t.w + ' ';
    s.onclick = () => { audio.currentTime = t.s + 0.01; if(audio.paused) toggle(); };
    p.appendChild(s); spans.push({el:s, t, pEl:p});
  });
  essay.appendChild(p);
});

function fmt(s){ s=Math.max(0,s|0); return (s/60|0)+':'+String(s%60).padStart(2,'0'); }
function toggle(){ audio.paused ? audio.play() : audio.pause(); }
btn.onclick = toggle;
audio.onplay = () => btn.textContent = '⏸';
audio.onpause = () => btn.textContent = '▶';

let idx = 0, curP = null;
function tick(){
  const t = audio.currentTime;
  fill.style.width = (100*t/(audio.duration||1))+'%';
  timeEl.textContent = fmt(t)+' / '+fmt(audio.duration||0);
  // find active word (spans sorted by start)
  while(idx < spans.length-1 && spans[idx+1].t.s <= t) idx++;
  while(idx > 0 && spans[idx].t.s > t) idx--;
  spans.forEach((s,i)=> s.el.classList.toggle('on', i===idx && t >= s.t.s && t <= s.t.e + .25));
  const pEl = spans[idx] && spans[idx].pEl;
  if(pEl !== curP){ if(curP) curP.classList.remove('p-on'); curP = pEl; if(curP){ curP.classList.add('p-on');
    const r = curP.getBoundingClientRect();
    if(r.top < 80 || r.bottom > innerHeight-160) curP.scrollIntoView({behavior:'smooth', block:'center'});
  }}
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

document.getElementById('scrub').onclick = (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX-r.left)/r.width) * (audio.duration||0);
};
const SPEEDS=[1,1.15,1.3,1.5,.9]; let si=0;
speedBtn.onclick=()=>{ si=(si+1)%SPEEDS.length; audio.playbackRate=SPEEDS[si]; speedBtn.textContent=SPEEDS[si].toFixed(2).replace(/0$/,'')+'×'; };
document.body.onkeydown=(e)=>{ if(e.code==='Space'&&e.target===document.body){e.preventDefault();toggle();} };
</script>
</body>
