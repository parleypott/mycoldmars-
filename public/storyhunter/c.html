<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Hunter, exploration C: the record sheet</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:13px;font-weight:400;color:#000;background:#FFFFFF;
    display:flex;flex-direction:column;overflow:hidden;
  }
  /* ---- formula bar: the top grid row ---- */
  #fx{display:flex;height:20px;flex:none;border-bottom:1px solid #D8D8D8;background:#FFFFFF}
  #fx .fxlab{
    width:56px;flex:none;background:#F1F1F1;color:#8C8C8C;font-style:italic;
    text-align:right;padding:0 8px;line-height:19px;border-right:1px solid #D8D8D8;
  }
  #fxc{flex:1;line-height:19px;padding:0 8px;white-space:nowrap;overflow:hidden}
  .ghost{color:#8C8C8C}
  .ghi{color:#8C8C8C;font-style:italic}
  .rcell{
    display:inline-block;border:1px solid #D8D8D8;background:#F1F1F1;
    padding:0 8px;height:19px;line-height:17px;vertical-align:top;
    margin-left:-1px;cursor:pointer;
  }
  .rcell:hover{background:#FAFAFA}
  .rcell .num{font-variant-numeric:tabular-nums}
  /* ---- the sheet ---- */
  #sh{flex:1;overflow:auto;cursor:cell;background:#FFFFFF}
  table{border-collapse:separate;border-spacing:0;table-layout:fixed;background:#FFFFFF}
  td,th{
    border-right:1px solid #D8D8D8;border-bottom:1px solid #D8D8D8;
    padding:0;vertical-align:top;text-align:left;font-weight:400;overflow:hidden;
  }
  .ci{
    padding:0 8px;height:18px;line-height:18px;
    white-space:nowrap;overflow:hidden;position:relative;
  }
  thead th{position:sticky;top:0;background:#F1F1F1;z-index:2}
  td.rn,th.rn{position:sticky;left:0;background:#F1F1F1;z-index:1}
  thead th.rn{z-index:3}
  .rn .ci{text-align:right}
  .num{font-variant-numeric:tabular-nums}
  .right .ci{text-align:right}
  .it .ci{font-style:italic}
  .gh{color:#8C8C8C}
  .cl{color:#8C8C8C}
  .cl .ci{text-align:center}
  .bandc .ci{color:#F04A16}
  /* row hover: flat fill on plain cells only; meaning fills keep their color */
  #sh tbody tr:hover td.pl{background:#FAFAFA}
  /* rating ramp: single hue, fills */
  td.rt1{background:#FDE4DB}
  td.rt2{background:#FAC5B2}
  td.rt3{background:#F79E7F}
  td.rt4{background:#F4744A;color:#FFFFFF}
  td.rt5{background:#F04A16;color:#FFFFFF}
  /* status fills */
  td.st-rev{background:#F1F1F1}
  td.st-short{background:#FAC5B2}
  td.st-arch{background:#E6E6E6;color:#8C8C8C}
  /* cell cursor: 2px inset accent, 0ms */
  td.cur{outline:2px solid #F04A16;outline-offset:-2px}
  /* comment corner triangle */
  .tri{
    position:absolute;top:0;right:0;width:0;height:0;
    border-top:5px solid #F04A16;border-left:5px solid transparent;
  }
  /* record sheet pieces */
  td.lab{background:#F1F1F1}
  td.back{color:#F04A16;cursor:pointer}
  tr.bigrow .big .ci{height:34px;line-height:34px;font-size:28px}
  .wrap .ci{height:auto;min-height:18px;white-space:normal;max-width:72ch}
  #cmtin{
    font-family:inherit;font-size:13px;font-weight:400;color:#000;
    border:0;outline:0;width:100%;height:18px;line-height:18px;background:transparent;
  }
  #cmtin::placeholder{color:#8C8C8C;font-style:italic}
  /* archive as collapse: the row folds upward, 180ms, the only easing */
  tr.archrow .ci{transition:height 180ms cubic-bezier(0.2,0,0,1)}
  tr.collapsing .ci{height:0}
  @media (prefers-reduced-motion:reduce){
    tr.archrow .ci{transition:none}
  }
  /* ---- sheet tabs ---- */
  #tabs{display:flex;height:20px;flex:none;border-top:1px solid #D8D8D8;background:#F1F1F1}
  .tabpad{width:56px;flex:none;border-right:1px solid #D8D8D8}
  .tab{
    padding:0 12px;line-height:19px;border-right:1px solid #D8D8D8;
    color:#8C8C8C;cursor:pointer;white-space:nowrap;
  }
  .tab.on{background:#FFFFFF;color:#000}
  .tab.rec{background:#FFFFFF;color:#F04A16}
  /* ---- status bar ---- */
  #status{
    display:flex;height:20px;flex:none;border-top:1px solid #D8D8D8;
    background:#F1F1F1;color:#8C8C8C;line-height:19px;
    font-variant-numeric:tabular-nums;
  }
  #stL{flex:1;padding:0 8px;white-space:nowrap;overflow:hidden}
  #stR{padding:0 8px;white-space:nowrap}
</style>
</head>

function el(id){return document.getElementById(id)}

function fmtDate(d){

 var p=d.split("-");
 return (+p[2])+" "+m[+p[1]-1]+" "+p[0];
}

/* ---------------- stories sheet ---------------- */

/* ---------------- record sheet (variant C: dossier as its own sheet) ---------------- */
function recordHTML(st){
 var RW=[160,560,140,110,100,100,100,100,100,100,100,100];  /* cols A..L */
 var n=0;
 function rn(){n++;return '<td class="rn num"><div class="ci">'+n+'</div></td>'}
 function cell(c,content,cls,extra){
  return '<td class="'+(cls||"pl")+'" data-c="'+c+'"'+(extra||"")+'><div class="ci">'+content+'</div></td>';
 }
 function tail(from){var h="";for(var c=from;c<=12;c++)h+=cell(c,"");return h}
 function fieldRow(label,val,cls){
  return '<tr data-nav>'+rn()+cell(1,label,"lab")+cell(2,val,cls)+tail(3)+'</tr>';
 }
 var h='<table id="grid" style="width:'+RECORD_W+'px"><colgroup><col style="width:56px">';
 RW.forEach(function(w){h+='<col style="width:'+w+'px">'});
 h+='</colgroup><thead><tr><th class="rn num"><div class="ci">#</div></th>';
 for(var i=0;i<12;i++)h+='<th class="cl"><div class="ci">'+L[i]+'</div></th>';
 h+='</tr></thead><tbody>';
 /* A1: the back cell */
 h+='<tr data-nav>'+rn()+cell(1,"&larr; Stories","back",' data-act="back"')+tail(2)+'</tr>';
 /* title: the only large type */
 h+='<tr data-nav class="bigrow">'+rn()+cell(1,"title","lab")
  +'<td class="big pl" data-c="2" colspan="11"><div class="ci">'+esc(st.title)+'</div></td></tr>';
 /* premise: richer text for week 39 lives here */
 h+='<tr data-nav>'+rn()+cell(1,"premise","lab")
  +'<td class="pl it wrap" data-c="2" colspan="11"><div class="ci">'+esc(st.premise)+'</div></td></tr>';
 h+=fieldRow("record","C"+st.row,"num pl");
 h+=fieldRow("week",st.iso,"num pl");
 h+=fieldRow("found",st.found,"num pl");
 h+=fieldRow("publisher",esc(st.publisher));
 h+=fieldRow("region",esc(st.region));
 h+=fieldRow("tags",esc(st.tags));
 h+=fieldRow("hunt score",String(st.score),"num gh pl");
 h+=fieldRow("scored by","=HUNT(week "+st.wk+")","gh pl");
 /* rating and status: value plus a one-cell legend swatch */
 h+='<tr data-nav>'+rn()+cell(1,"rating (keys 1 to 5)","lab")
  +cell(2,st.rating?String(st.rating):'<span class="ghi">unrated</span>',"num pl",' id="recRating"')
  +cell(3,"",st.rating?"rt"+st.rating:"pl",' id="recSwatch"')+tail(4)+'</tr>';
 h+='<tr data-nav>'+rn()+cell(1,"status","lab")
  +cell(2,st.status,"pl",' id="recStatus"')
  +cell(3,"",st.status==="new"?"pl":stCls(st.status),' id="recStSwatch"')+tail(4)+'</tr>';
 if(st.status==="archived"&&st.reason)h+=fieldRow("archive reason",reasonText(st.reason));
 /* sources: a sub-table on the same sheet */
 h+='<tr class="band">'+rn()+'<td colspan="12" class="bandc"><div class="ci">Sources (2)</div></td></tr>';
 h+='<tr data-nav>'+rn()+cell(1,"","lab")+cell(2,"Source","lab")+cell(3,"Type","lab")+cell(4,"Date","lab")+tail(5)+'</tr>';
 h+='<tr data-nav>'+rn()+cell(1,"")+cell(2,esc(st.publisher))+cell(3,"publisher")+cell(4,st.found,"num pl")+tail(5)+'</tr>';
 h+='<tr data-nav>'+rn()+cell(1,"")+cell(2,"=HUNT(week "+st.wk+")","gh pl")+cell(3,"hunt job","gh pl")+cell(4,st.found,"num gh pl")+tail(5)+'</tr>';
 /* comments: rows plus a composer row */
 h+='<tr class="band" id="cmts">'+rn()+'<td colspan="12" class="bandc"><div class="ci">Comments ('+st.comments+')</div></td></tr>';
 var seedN=st.comments-st._local.length;
 if(st.comments===0){
  h+='<tr data-nav>'+rn()+cell(1,"")+cell(2,'<span class="ghi">no comments yet</span>')+tail(3)+'</tr>';
 }else{
  for(var i=0;i<seedN;i++)
   h+='<tr data-nav>'+rn()+cell(1,"")+cell(2,'<span class="ghi">(comment body not in seed.json)</span>')+tail(3)+'</tr>';
  st._local.forEach(function(c){
   h+='<tr data-nav>'+rn()+cell(1,"")+cell(2,esc(c.b))+cell(3,"johnny")+cell(4,c.d,"num pl")+tail(5)+'</tr>';
  });
 }
 h+='<tr data-nav>'+rn()+cell(1,"")
  +'<td class="pl" data-c="2"><div class="ci"><input id="cmtin" placeholder="Add a comment, press Enter"></div></td>'
  +cell(3,"johnny","gh pl")+cell(4,TODAY,"num gh pl")+tail(5)+'</tr>';
 /* the endless sheet continues below the record too */
 for(var r=0;r<40;r++){
  h+='<tr data-nav data-empty>'+rn();
  for(var c=1;c<=12;c++)h+='<td class="pl" data-c="'+c+'"><div class="ci"></div></td>';
  h+='</tr>';
 }
 h+='</tbody></table>';
 return h;
}

/* ---------------- chrome ---------------- */
function renderTabs(){
 var h='<span class="tabpad"></span>';
 h+='<span class="tab'+(mode==="stories"?" on":"")+'" id="tabStories">Stories</span>';
 h+='<span class="tab">This week</span><span class="tab">Shortlist</span><span class="tab">Archive</span>';
 if(mode==="record"&&openId)h+='<span class="tab rec">C'+byId(openId).row+'</span>';
 el("tabs").innerHTML=h;
 el("tabStories").addEventListener("click",function(){if(mode==="record")closeRecord()});
}
function renderStatus(){
 var short=0,arch=0;
 S.forEach(function(s){if(s.status==="shortlisted")short++;if(s.status==="archived")arch++});
 el("stL").textContent=S.length+" stories · "+WEEKS.length+" weeks · "+short+" shortlisted · "+arch+" archived";
 el("stR").textContent="Enter opens · Esc closes · 1-5 rate · S shortlist · X archive";
}
function fxDefault(){
 if(mode==="stories"){
  fxc.innerHTML='<span class="ghost">=HUNT(week 39) &rarr; 12 stories</span>';
 }else{
  fxc.innerHTML='<span class="ghost">=RECORD('+byId(openId).row+')</span>';
 }
}
function colLetter(c){return L[c-1]}

/* ---------------- cursor ---------------- */
function refreshNav(){navRows=Array.prototype.slice.call(sh.querySelectorAll("tr[data-nav]"))}
function maxCol(){return mode==="stories"?21:12}
function clearCur(){var p=sh.querySelector("td.cur");if(p)p.classList.remove("cur")}
function applyCursor(){
 clearCur();
 if(pendingArchive)return;
 if(!cursor){fxDefault();return}
 cursor.r=Math.max(0,Math.min(cursor.r,navRows.length-1));
 cursor.c=Math.max(1,Math.min(cursor.c,maxCol()));
 var tr=navRows[cursor.r];
 var td=tr.querySelector('td[data-c="'+cursor.c+'"]');
 if(!td){                                   /* landed inside a colspan: snap to it */
  var tds=tr.querySelectorAll("td[data-c]");
  td=tds[tds.length-1];
  for(var i=0;i<tds.length;i++){if(+tds[i].dataset.c<=cursor.c)td=tds[i];else break}
 }
 td.classList.add("cur");
 ensureVisible(td);
 var rowLab=tr.querySelector(".rn .ci").textContent;
 var ref=colLetter(+td.dataset.c)+rowLab;
 var label=(mode==="stories"&&+td.dataset.c<12)?COLS[+td.dataset.c].h.toLowerCase():"";
 var v=td.dataset.fv||td.querySelector(".ci").textContent.trim();
 var out=esc(ref);
 if(label&&v)out+=" · "+esc(label)+": "+esc(v);
 else if(v)out+=" · "+esc(v);
 fxc.innerHTML=out;
}
function ensureVisible(td){
 var r1=td.getBoundingClientRect(),r0=sh.getBoundingClientRect();
 if(r1.top<r0.top+20)sh.scrollTop-=(r0.top+20-r1.top);
 else if(r1.bottom>r0.bottom)sh.scrollTop+=r1.bottom-r0.bottom;
 if(r1.left<r0.left+56)sh.scrollLeft-=(r0.left+56-r1.left);
 else if(r1.right>r0.right)sh.scrollLeft+=r1.right-r0.right;
}
function cursorStory(){
 if(!cursor)return null;
 var tr=navRows[cursor.r];
 return tr&&tr.dataset.sid?byId(+tr.dataset.sid):null;
}

/* ---------------- record open/close ---------------- */
function openRecord(id,gotoComments){
 storiesCursor=mode==="stories"?cursor:storiesCursor;
 mode="record";openId=id;cursor=null;pendingArchive=null;
 sh.innerHTML=recordHTML(byId(id));
 refreshNav();renderTabs();fxDefault();
 sh.scrollTop=0;sh.scrollLeft=0;
 if(gotoComments){var b=el("cmts");if(b)sh.scrollTop=b.offsetTop-20}
}
function closeRecord(){
 mode="stories";openId=null;cursor=storiesCursor;
 sh.innerHTML=storiesHTML();
 refreshNav();renderTabs();
 if(cursor){cursor.r=Math.min(cursor.r,navRows.length-1);applyCursor()}
 else{fxDefault();var b=el("band39");if(b)sh.scrollTop=b.offsetTop-20}
}
function recordStep(dir){
 var live=S.filter(function(s){return !s._gone});
 var i=-1;
 for(var j=0;j<live.length;j++)if(live[j].id===openId)i=j;
 var next=live[i+dir];
 if(next)openRecord(next.id);
}

/* ---------------- rating / shortlist ---------------- */
function rate(nv){
 var s=mode==="record"?byId(openId):cursorStory();
 if(!s)return;
 s.rating=nv;
 if(mode==="stories"){
  var td=el("rat"+s.id);
  td.className="num right rt"+nv;
  td.querySelector(".ci").textContent=nv;
  applyCursor();
 }else{
  el("recRating").querySelector(".ci").textContent=nv;
  el("recSwatch").className="rt"+nv;
  applyCursor();
 }
}
function toggleShortlist(){
 if(mode!=="stories")return;
 var s=cursorStory();
 if(!s||s.status==="archived")return;
 s.status=s.status==="shortlisted"?"reviewed":"shortlisted";
 var td=el("st"+s.id);
 td.className=stCls(s.status);
 td.querySelector(".ci").textContent=s.status;
 renderStatus();applyCursor();
}

/* ---------------- archive as collapse ---------------- */
function startArchive(){
 if(mode!=="stories")return;
 var s=cursorStory();
 if(!s||s.status==="archived")return;
 pendingArchive=s.id;
 clearCur();
 var h='Archive '+s.row+': ';
 REASONS.forEach(function(r,i){
  h+='<span class="rcell" data-i="'+i+'"><span class="ghost num">'+(i+1)+'</span> '+r.t+'</span>';
 });
 h+='<span class="rcell ghost" data-i="-1">esc cancel</span>';
 fxc.innerHTML=h;
}
function cancelArchive(){pendingArchive=null;applyCursor()}
function doArchive(reasonKey){
 var s=byId(pendingArchive);
 pendingArchive=null;
 s.status="archived";s.reason=reasonKey;s._gone=true;
 renderStatus();                                          /* the count ticks */
 var tr=sh.querySelector('tr[data-sid="'+s.id+'"]');
 if(!tr){applyCursor();return}
 tr.classList.add("archrow");
 void tr.offsetHeight;
 tr.classList.add("collapsing");                          /* 180ms fold upward */
 setTimeout(function(){
  tr.remove();
  refreshNav();
  if(cursor){cursor.r=Math.min(cursor.r,navRows.length-1)}
  applyCursor();
 },180);
}

/* ---------------- comments ---------------- */
function submitComment(input){
 var v=input.value.trim();
 if(!v)return;
 var st=byId(openId);
 st._local.push({b:v,d:TODAY});
 st.comments++;
 var keep=sh.scrollTop,keepL=sh.scrollLeft;
 sh.innerHTML=recordHTML(st);
 refreshNav();
 sh.scrollTop=keep;sh.scrollLeft=keepL;
 fxDefault();
}

/* ---------------- events ---------------- */
sh.addEventListener("click",function(e){
 var act=e.target.closest("[data-act]");
 if(act){if(act.dataset.act==="back")closeRecord();return}
 var td=e.target.closest("td[data-c]");
 if(!td)return;
 var tr=td.closest("tr[data-nav]");
 if(!tr)return;
 if(pendingArchive)cancelArchive();
 cursor={r:navRows.indexOf(tr),c:+td.dataset.c};
 applyCursor();
});
fxc.addEventListener("click",function(e){
 var r=e.target.closest(".rcell");
 if(!r||pendingArchive===null)return;
 var i=+r.dataset.i;
 if(i<0)cancelArchive();else doArchive(REASONS[i].k);
});
document.addEventListener("keydown",function(e){
 if(e.target.tagName==="INPUT"){
  if(e.key==="Enter")submitComment(e.target);
  else if(e.key==="Escape")e.target.blur();
  return;
 }
 if(pendingArchive){
  if(e.key>="1"&&e.key<="4")doArchive(REASONS[+e.key-1].k);
  else if(e.key==="Escape")cancelArchive();
  e.preventDefault();
  return;
 }
 var k=e.key;
 if(k==="ArrowUp"||k==="ArrowDown"||k==="ArrowLeft"||k==="ArrowRight"){
  e.preventDefault();
  if(!cursor){
   if(mode==="stories"){
    var first=sh.querySelector('tr[data-sid="440"]')||navRows[0];
    cursor={r:navRows.indexOf(first),c:2};
   }else cursor={r:0,c:1};
  }else{
   if(k==="ArrowUp")cursor.r--;
   if(k==="ArrowDown")cursor.r++;
   if(k==="ArrowLeft")cursor.c--;
   if(k==="ArrowRight")cursor.c++;
  }
  applyCursor();
 }else if(k==="Enter"){
  if(mode==="stories"){
   var s=cursorStory();
   if(s)openRecord(s.id);
  }else if(cursor){
   var tr=navRows[cursor.r];
   var td=tr.querySelector("td.cur")||tr.querySelector('td[data-c="'+cursor.c+'"]');
   if(td&&td.dataset.act==="back"){closeRecord();return}
   var inp=td&&td.querySelector("input");
   if(inp){inp.focus();e.preventDefault()}
  }
 }else if(k==="Escape"){
  if(mode==="record")closeRecord();
  else{cursor=null;clearCur();fxDefault()}
 }else if(k>="1"&&k<="5"){
  rate(+k);
 }else if(k==="x"||k==="X"){
  startArchive();
 }else if(k==="s"||k==="S"){
  toggleShortlist();
 }else if(k==="c"||k==="C"){
  if(mode==="stories"){var s2=cursorStory();if(s2)openRecord(s2.id,true)}
 }else if(k==="j"||k==="J"){
  if(mode==="record")recordStep(1);
 }else if(k==="k"||k==="K"){
  if(mode==="record")recordStep(-1);
 }
});

/* ---------------- boot ---------------- */
sh.innerHTML=storiesHTML();
refreshNav();renderTabs();renderStatus();fxDefault();
var b39=el("band39");
if(b39)sh.scrollTop=b39.offsetTop-20;
</script>
</body>
</html>
