html,body{height:100%;}
body{

#scroll{flex:1;overflow:auto;cursor:cell;}
#grid{display:grid;grid-template-columns:var(--cols);position:relative;}

.rgt{text-align:right;}
.it{font-style:italic;}
.g{color:var(--ghost);}
.row:where(:hover) > .c, .row:where(.hov) > .c{background:#FAFAFA;}
/* meaning fills stay put under hover: same specificity, later in the sheet */
.c.num{background:var(--head);position:sticky;left:0;z-index:2;text-align:right;font-variant-numeric:tabular-nums;}
.c.sc{color:var(--ghost);}
.c.ramp1{background:var(--ramp1);}
.c.ramp2{background:var(--ramp2);}
.c.ramp3{background:var(--ramp3);}

.c.ramp5{background:var(--ramp5);color:#FFFFFF;}
.c.st-reviewed{background:var(--head);}
.c.st-shortlisted{background:var(--ramp2);}
.c.st-archived{background:#E6E6E6;color:var(--ghost);}
.c.cur{outline:2px solid var(--accent);outline-offset:-2px;}
/* formula bar: one row of the grid */
.c.fx{position:sticky;left:0;top:0;z-index:6;background:var(--head);color:var(--ghost);font-style:italic;text-align:right;}
.c.fbar{grid-column:2/-1;position:sticky;top:0;z-index:5;display:flex;align-items:center;padding:0;overflow:visible;}
#ftext{position:sticky;left:56px;padding:0 8px;white-space:nowrap;overflow:hidden;max-width:calc(100vw - 180px);}
#huntbtn{
  position:sticky;right:0;margin-left:auto;height:100%;flex:none;
  border:0;border-left:1px solid var(--grid);background:var(--head);
  font:inherit;padding:0 8px;cursor:pointer;color:var(--ink);
}
#huntbtn:disabled{color:var(--ghost);cursor:default;}
/* header row: sticky, --head */
.c.hd{position:sticky;top:19px;z-index:4;background:var(--head);}
.c.hd.num{z-index:5;}
.c.hd.gl{color:var(--ghost);text-align:center;}
/* week band: merged row, accent text on white */
.c.band{grid-column:1/-1;color:var(--accent);padding:0;overflow:visible;}
.c.band span{position:sticky;left:0;display:inline-block;padding:0 8px;font-variant-numeric:tabular-nums;}
/* comment corner triangle */
.tri{position:absolute;top:0;right:0;width:0;height:0;border-top:5px solid var(--accent);border-left:5px solid transparent;}
/* dossier: the sheet parts and the record lives below the row, as cells */
.dossier{grid-column:1/-1;overflow:hidden;height:0;transition:height 180ms var(--ease);background:var(--sheet);}
.drow{display:grid;grid-template-columns:var(--cols);}
.drow .c{height:auto;min-height:19px;}
.drow .c.num{min-height:19px;}
.trow .c{min-height:38px;display:flex;align-items:center;}
.dtitle{font-size:28px;line-height:34px;}
.dl{background:var(--head);}
.wrap{white-space:normal;line-height:19px;}
.wrap span{display:block;max-width:72ch;}
/* marching ants: SVG stroke, no fills harmed */
.ants{position:absolute;pointer-events:none;overflow:visible;z-index:3;}
.ants rect{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;animation:march 0.4s linear infinite;}
@keyframes march{to{stroke-dashoffset:-20;}}
/* sheet tabs: a row of cells, visual only */
#tabs{display:flex;height:19px;flex:none;border-top:1px solid var(--grid);background:var(--head);}
#tabs .tab{height:100%;line-height:18px;padding:0 8px;border-right:1px solid var(--grid);}
#tabs .tab.on{background:var(--sheet);}
#tabs .tabfill{flex:1;}
/* status bar */
#status{
  display:flex;justify-content:space-between;height:19px;flex:none;line-height:18px;
  padding:0 8px;border-top:1px solid var(--grid);background:var(--head);color:var(--ghost);
  font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap;
}
@media (prefers-reduced-motion:reduce){
  .dossier{transition:none;}
  .ants rect{animation:none;}
}

  ftext.textContent="=HUNT(week 39) → 12 stories";
  huntbtn=el("button",null,"=HUNT()");huntbtn.id="huntbtn";huntbtn.type="button";
  huntbtn.addEventListener("click",runHunt);
  bar.appendChild(ftext);bar.appendChild(huntbtn);
  w.appendChild(fx);w.appendChild(bar);
  grid.appendChild(w);
}
function buildHeaderRow(){
  var w=el("div","hrow");
  for(var i=0;i<NCOLS;i++){
    var c=el("div","c hd"+(i===0?" num":"")+(i>11?" gl":""),HEADS[i]);
    if(i===0){c.style.left="0";}
    w.appendChild(c);
  }
  grid.appendChild(w);
}
function bandRow(wk){
  var meta=weeks[wk];
  var w=el("div","brow");
  var c=el("div","c band");
  var sp=el("span",null,"Week "+meta.n+" · "+fdate(meta.starts)+" · "+meta.count+" new");
  c.appendChild(sp);w.appendChild(c);
  return w;
}
function storyRow(s){
  var w=el("div","row");
  w.dataset.sid=s.id;
  var num=el("div","c num",s.row);
  var week=el("div","c","W"+weekNum(s.week));
  var title=el("div","c",s.title);
  if(s.com>0)title.appendChild(el("span","tri"));
  var prem=el("div","c",s.premise);
  var pub=el("div","c",s.publisher);
  var reg=el("div","c",s.region);
  var tags=el("div","c",s.tags.join(", "));
  var score=el("div","c tn rgt sc",String(s.score));
  var rating=el("div","c tn rgt "+rampCls(s.rating),s.rating?String(s.rating):"");
  var status=el("div","c "+statusCls(s),s.status);
  var com=el("div","c tn rgt",s.com>0?String(s.com):"");
  var found=el("div","c tn",s.found);
  [num,week,title,prem,pub,reg,tags,score,rating,status,com,found].forEach(function(c){w.appendChild(c);});
  for(var i=12;i<NCOLS;i++)w.appendChild(el("div","c"));
  storyByWrap.set(w,s);
  return w;
}
function emptyRow(n){
  var w=el("div","row");
  w.dataset.num=pad(n);
  w.appendChild(el("div","c num g",pad(n)));
  for(var i=1;i<NCOLS;i++)w.appendChild(el("div","c"));
  return w;
}
function buildSheet(){
  buildFormulaRow();
  buildHeaderRow();
  var lastWeek=null;
  stories.forEach(function(s){
    if(s.week!==lastWeek){grid.appendChild(bandRow(s.week));lastWeek=s.week;}
    var w=storyRow(s);
    grid.appendChild(w);
    navRows.push({w:w,s:s});
  });
  var base=nextId;
  for(var i=0;i<EMPTY_ROWS;i++){
    var w=emptyRow(base+i);
    grid.appendChild(w);
    emptyEls.push(w);
    navRows.push({w:w});
  }
  reindex();
  updateStatus();
}
function reindex(){navRows.forEach(function(r,i){r.w.dataset.nav=i;});}
function renumberEmpties(){
  emptyEls.forEach(function(w,i){
    var n=pad(nextId+i);
    w.dataset.num=n;
    w.children[0].textContent=n;
  });
}
function updateStatus(){
  var wk={},sh=0,ar=0;
  stories.forEach(function(s){wk[s.week]=1;if(s.status==="shortlisted")sh++;if(s.status==="archived")ar++;});
  document.getElementById("counts").textContent=
    stories.length+" stories · "+Object.keys(wk).length+" weeks · "+sh+" shortlisted · "+ar+" archived";
}

/* ---------- selection ---------- */
function ensureVisible(cell){
  var top=cell.offsetTop,left=cell.offsetLeft,hdr=38;
  if(top-hdr<scroller.scrollTop)scroller.scrollTop=top-hdr;
  else if(top+19>scroller.scrollTop+scroller.clientHeight)scroller.scrollTop=top+19-scroller.clientHeight;
  if(left-56<scroller.scrollLeft&&left>0)scroller.scrollLeft=Math.max(0,left-56);
  else if(left+cell.offsetWidth>scroller.scrollLeft+scroller.clientWidth)
    scroller.scrollLeft=left+cell.offsetWidth-scroller.clientWidth;
}
function showSel(){
  if(!cur||hunting)return;
  var s=storyByWrap.get(cur.w);
  var rowid=s?s.row:cur.w.dataset.num;
  var out=LET[cur.col]+rowid;
  var txt=cur.w.children[cur.col].textContent.trim();
  if(s&&txt&&cur.col<12)out+=" · "+HEADS[cur.col]+": "+txt;
  ftext.textContent=out;
  ftext.classList.remove("g");
}
function setCursor(w,col){
  col=Math.min(Math.max(col,1),NCOLS-1);
  if(cur)cur.w.children[cur.col].classList.remove("cur");
  cur={w:w,col:col};
  var cell=w.children[col];
  cell.classList.add("cur");
  showSel();
  ensureVisible(cell);
}
function moveCursor(dr,dc){
  if(!cur){setCursor(navRows[0].w,2);return;}
  if(dr!==0){
    var i=+cur.w.dataset.nav+dr;
    i=Math.min(Math.max(i,0),navRows.length-1);
    setCursor(navRows[i].w,cur.col);
  }else{
    setCursor(cur.w,cur.col+dc);
  }
}

/* ---------- dossier: the row expands downward ---------- */
function drow(specs,rcls){
  var d=el("div","drow"+(rcls?" "+rcls:""));
  var by={};specs.forEach(function(s){by[s.col]=s;});
  d.appendChild(el("div","c num"));
  var i=2;
  while(i<=NCOLS){
    var s=by[i];
    if(s){
      var c=el("div","c "+(s.cls||""));
      if(s.html)c.appendChild(s.html);else c.textContent=s.txt!=null?s.txt:"";
      var span=s.span||1;
      if(span>1)c.style.gridColumn=i+" / span "+span;
      d.appendChild(c);
      i+=span;
    }else{
      d.appendChild(el("div","c"));
      i++;
    }
  }
  return d;
}
function buildDossier(s){
  var box=el("div","dossier");
  var inner=el("div");
  var premSpan=el("span",null,s.premise);
  var rows=[
    drow([{col:3,span:5,txt:s.title,cls:"dtitle"}],"trow"),
    drow([{col:3,txt:"Premise",cls:"dl"},{col:4,span:3,html:premSpan,cls:"wrap it"}]),
    drow([{col:3,txt:"Publisher",cls:"dl"},{col:4,txt:s.publisher}]),
    drow([{col:3,txt:"Region",cls:"dl"},{col:4,txt:s.region}]),
    drow([{col:3,txt:"Tags",cls:"dl"},{col:4,txt:s.tags.join(", ")}]),
    drow([{col:3,txt:"Hunt score",cls:"dl"},{col:4,txt:String(s.score),cls:"g tn"}]),
    drow([{col:3,txt:"Rating",cls:"dl"},
          {col:4,txt:s.rating?String(s.rating):"press 1 to 5 to rate",cls:"drt tn "+(s.rating?rampCls(s.rating):"g it")}]),
    drow([{col:3,txt:"Status",cls:"dl"},{col:4,txt:s.status,cls:statusCls(s)}])
  ];
  if(s.ar)rows.push(drow([{col:3,txt:"Archive reason",cls:"dl"},{col:4,txt:s.ar.replace(/_/g," "),cls:"g"}]));
  rows.push(drow([{col:3,txt:"Comments",cls:"dl"},{col:4,txt:String(s.com),cls:"tn"}]));
  rows.push(drow([{col:3,txt:"Found",cls:"dl"},{col:4,txt:s.found,cls:"tn"}]));
  rows.forEach(function(r){inner.appendChild(r);});
  box.appendChild(inner);
  return box;
}
function openDossier(w,s){
  var box=buildDossier(s);
  w.after(box);
  var h=box.firstChild.offsetHeight;
  open={el:box,sid:s.id,w:w,ratingCell:box.querySelector(".drt")};
  if(RM){box.style.height=h+"px";}
  else{
    box.getBoundingClientRect();
    box.style.height=h+"px";
  }
  var rowTop=w.children[0].offsetTop;
  var want=Math.min(h,scroller.clientHeight-4*19);
  var bottom=rowTop+19+want;
  if(bottom>scroller.scrollTop+scroller.clientHeight)scroller.scrollTop=bottom-scroller.clientHeight;
}
function closeDossier(immediate){
  if(!open)return;
  var box=open.el;
  open=null;
  if(immediate||RM){box.remove();return;}
  box.style.height="0px";
  setTimeout(function(){box.remove();},200);
}
function toggleDossier(){
  if(!cur)return;
  var s=storyByWrap.get(cur.w);
  if(!s)return;
  if(open&&open.sid===s.id){closeDossier();return;}
  if(open)closeDossier(true);
  openDossier(cur.w,s);
}
function walk(dir){
  if(!open)return;
  var i=navRows.findIndex(function(r){return r.s&&r.s.id===open.sid;});
  var j=i+dir;
  while(j>=0&&j<navRows.length&&!navRows[j].s)j+=dir;
  if(j<0||j>=navRows.length||!navRows[j].s)return;
  var t=navRows[j];
  closeDossier(true);
  setCursor(t.w,cur?cur.col:2);
  openDossier(t.w,t.s);
}

/* ---------- rating 1 to 5, live fill ---------- */
function rate(n){
  if(!cur)return;
  var s=storyByWrap.get(cur.w);
  if(!s)return;
  s.rating=n;
  var cell=cur.w.children[8];
  var wasCur=cell.classList.contains("cur");
  cell.className="c tn rgt "+rampCls(n)+(wasCur?" cur":"");
  cell.textContent=String(n);
  if(open&&open.sid===s.id&&open.ratingCell){
    open.ratingCell.className="c drt tn "+rampCls(n);
    open.ratingCell.textContent=String(n);
  }
  if(cur.col===8)showSel();
}

/* ---------- the hunt paste-in ---------- */
function huntDate(wn){
  var t=Date.UTC(2026,8,21)+(wn-39)*7*864e5;
  return new Date(t).toISOString().slice(0,10);
}
async function runHunt(){
  if(hunting)return;
  hunting=true;huntbtn.disabled=true;
  var wn=nextHuntWeek++;
  var iso="2026-W"+wn, starts=huntDate(wn);
  weeks[iso]={n:wn,starts:starts,count:huntPool.length};
  /* the formula types itself */
  ftext.classList.remove("g");
  ftext.textContent="";
  var f="=HUNT(week "+wn+")";
  for(var i=0;i<f.length;i++){ftext.textContent+=f[i];if(!RM)await sleep(40);}
  if(!RM)await sleep(240);
  /* band, then rows paste in top-down */
  var anchor=emptyEls[0];
  grid.insertBefore(bandRow(iso),anchor);
  var pasted=[];
  var insertAt=navRows.findIndex(function(r){return !r.s;});
  for(var k=0;k<huntPool.length;k++){
    var p=huntPool[k];
    var s={id:nextId,row:pad(nextId),week:iso,title:p.title,premise:p.premise,
           publisher:p.publisher,region:p.region,tags:p.tags.slice(),score:p.score,
           rating:null,status:"new",ar:null,com:0,found:starts};
    nextId++;
    stories.push(s);
    var w=storyRow(s);
    grid.insertBefore(w,anchor);
    navRows.splice(insertAt+k,0,{w:w,s:s});
    pasted.push(w);
    ensureVisible(w.children[1]);
    if(!RM)await sleep(60);
  }
  reindex();
  renumberEmpties();
  updateStatus();
  /* marching ants around the pasted block for 2s */
  var first=pasted[0],last=pasted[pasted.length-1];
  var top=first.children[1].offsetTop,left=first.children[1].offsetLeft;
  var rc=first.children[11];
  var wdt=rc.offsetLeft+rc.offsetWidth-left;
  var hgt=last.children[1].offsetTop+19-top;
  var NS="http://www.w3.org/2000/svg";
  var svg=document.createElementNS(NS,"svg");
  svg.setAttribute("class","ants");
  svg.setAttribute("width",wdt);svg.setAttribute("height",hgt);
  svg.style.top=top+"px";svg.style.left=left+"px";
  var rect=document.createElementNS(NS,"rect");
  rect.setAttribute("x",1);rect.setAttribute("y",1);
  rect.setAttribute("width",wdt-2);rect.setAttribute("height",hgt-2);
  svg.appendChild(rect);
  grid.appendChild(svg);
  setTimeout(function(){svg.remove();},2000);
  ftext.textContent="=HUNT(week "+wn+") → "+pasted.length+" stories";
  ftext.classList.add("g");
  hunting=false;huntbtn.disabled=false;
}

/* ---------- events ---------- */
window.addEventListener("keydown",function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  switch(e.key){
    case "ArrowUp":e.preventDefault();moveCursor(-1,0);break;
    case "ArrowDown":e.preventDefault();moveCursor(1,0);break;
    case "ArrowLeft":e.preventDefault();moveCursor(0,-1);break;
    case "ArrowRight":e.preventDefault();moveCursor(0,1);break;
    case "Enter":e.preventDefault();toggleDossier();break;
    case "Escape":closeDossier();break;
    case "j":walk(1);break;
    case "k":walk(-1);break;
    default:
      if(e.key>="1"&&e.key<="5")rate(+e.key);
  }
});
scroller.addEventListener("mousedown",function(e){
  if(e.target.closest("#huntbtn"))return;
  var c=e.target.closest(".c");
  if(!c)return;
  var w=c.parentElement;
  if(!w||!w.classList.contains("row"))return;
  var col=Array.prototype.indexOf.call(w.children,c);
  setCursor(w,col===0?1:col);
});
scroller.addEventListener("dblclick",function(e){
  var c=e.target.closest(".c");
  if(!c)return;
  var w=c.parentElement;
  if(w&&w.classList.contains("row")&&storyByWrap.get(w))toggleDossier();
});
scroller.addEventListener("mouseover",function(e){
  var r=e.target.closest(".row");
  if(r!==hov){if(hov)hov.classList.remove("hov");hov=r;if(hov)hov.classList.add("hov");}
});
scroller.addEventListener("mouseleave",function(){if(hov){hov.classList.remove("hov");hov=null;}});

buildSheet();
</script>
