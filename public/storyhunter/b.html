<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Hunter — exploration B (split pane)</title>
<style>
  :root{
    --sheet:#FFFFFF;
    --ink:#000000;
    --grid:#D8D8D8;
    --head:#F1F1F1;
    --accent:#F04A16;
    --ghost:#8C8C8C;
    --r1:#FDE4DB; --r2:#FAC5B2; --r3:#F79E7F; --r4:#F4744A; --r5:#F04A16;
    --st-reviewed:#F1F1F1; --st-shortlisted:#FAC5B2; --st-archived:#E6E6E6;
    --ease:cubic-bezier(0.2, 0, 0, 1);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size:13px; line-height:18px; font-weight:400;
    font-variant-numeric:tabular-nums;
    color:var(--ink); background:var(--sheet);
    overflow:hidden;
  }
  b,strong{ font-weight:400; }

  .app{ height:100vh; display:flex; flex-direction:column; }

  /* ── formula bar: one row of the grid ─────────────────────────── */
  .fbar{ display:flex; height:19px; flex:none; }
  .fbar .fx{
    width:56px; flex:none; height:19px; padding:0 8px;
    background:var(--head); color:var(--ghost);
    border-right:1px solid var(--grid); border-bottom:1px solid var(--grid);
  }
  .fbar .fcontent{
    flex:1; min-width:0; height:19px; padding:0 8px;
    border-bottom:1px solid var(--grid);
    white-space:nowrap; overflow:hidden;
  }
  .fbar .fcontent.ghost{ color:var(--ghost); }

  /* ── main: sheet + dossier pane ───────────────────────────────── */
  .main{ flex:1; min-height:0; display:flex; }
  .sheetwrap{
    flex:1; min-width:0; overflow:auto;
    cursor:cell;
    scroll-padding-top:19px; scroll-padding-left:56px;
  }
  table{ border-collapse:separate; border-spacing:0; table-layout:fixed; }
  th,td{
    height:19px; padding:0 8px;
    border-right:1px solid var(--grid); border-bottom:1px solid var(--grid);
    white-space:nowrap; overflow:hidden;
    text-align:left; font-weight:400;
    background:var(--sheet);
  }
  thead th{
    position:sticky; top:0; z-index:4;
    background:var(--head);
  }
  thead th.rownum{ z-index:5; }
  thead th.eletter{ color:var(--ghost); }
  td.rownum, th.rownum{
    position:sticky; left:0; z-index:3;
    background:var(--head); text-align:right;
  }
  tr.emptyrow td.rownum{ color:var(--ghost); }

  td.num{ text-align:right; }
  td.score{ color:var(--ghost); text-align:right; }

  /* row hover: flat, instant */
  tbody tr.hoverable:hover > td{ background:#FAFAFA; }
  tbody tr.hoverable:hover > td.rownum{ background:var(--head); }

  /* week bands: merged rows, accent text on white */
  tr.band td{
    color:var(--accent); background:var(--sheet);
  }
  tr.band td .bandlabel{ position:sticky; left:64px; display:inline-block; }

  /* selected row while dossier open: its fill runs into the pane */
  tbody tr.sel.sel td{ background:var(--sheet); }
  tbody tr.sel.st-reviewed td{ background:var(--st-reviewed); }
  tbody tr.sel.st-shortlisted td{ background:var(--st-shortlisted); }
  tbody tr.sel.st-archived td{ background:var(--st-archived); }
  tbody tr.sel td.rownum{ background:var(--head); color:var(--accent); }

  /* status fills (after sel rules so they hold inside a selected row) */
  td.status.st-reviewed{ background:var(--st-reviewed); }
  td.status.st-shortlisted{ background:var(--st-shortlisted); }
  td.status.st-archived{ background:var(--st-archived); color:var(--ghost); }

  /* rating ramp fills (after hover + sel so the fill always wins) */
  td.rate{ text-align:right; }
  td.rate.r1{ background:var(--r1); }
  td.rate.r2{ background:var(--r2); }
  td.rate.r3{ background:var(--r3); }
  td.rate.r4{ background:var(--r4); color:#FFFFFF; }
  td.rate.r5{ background:var(--r5); color:#FFFFFF; }

  /* comment corner triangle */
  td.comments{ position:relative; text-align:right; }
  td.comments .ctri{
    position:absolute; top:0; right:0; width:0; height:0;
    border-left:5px solid transparent; border-top:5px solid var(--accent);
  }

  /* the one cell cursor: 2px inset accent, 0ms */
  td.cur{ outline:2px solid var(--accent); outline-offset:-2px; }

  /* ── dossier: right split pane, grid-ruled ────────────────────── */
  .pane{
    width:0; flex:none; overflow:hidden;
    transition:width 180ms var(--ease);
    background:var(--sheet);
  }
  .pane.open{ width:480px; }
  .pane-inner{
    width:480px; height:100%;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .pane-spacer{ flex:none; overflow:hidden; }
  .pane-fill{ flex:1; min-height:0; overflow:hidden; }
  .rule{
    height:19px; border-bottom:1px solid var(--grid);
    border-left:1px solid var(--grid);
  }
  .pane-body{ flex:none; max-height:100%; overflow-y:auto; }
  .ptitle{
    min-height:57px; padding:8px 8px 8px 8px;
    font-size:28px; line-height:34px;
    border-bottom:1px solid var(--grid);
    background:var(--sheet);
    overflow:hidden;
  }
  .ptitle.st-reviewed{ background:var(--st-reviewed); }
  .ptitle.st-shortlisted{ background:var(--st-shortlisted); }
  .ptitle.st-archived{ background:var(--st-archived); }
  .prow{ display:flex; border-left:1px solid var(--grid); }
  .prow .plabel{
    width:96px; flex:none; padding:0 8px; height:19px;
    background:var(--head); color:var(--ghost);
    border-right:1px solid var(--grid); border-bottom:1px solid var(--grid);
    white-space:nowrap; overflow:hidden;
  }
  .prow .pval{
    flex:1; min-width:0; padding:0 8px; height:19px;
    border-bottom:1px solid var(--grid);
    white-space:nowrap; overflow:hidden;
  }
  .prow .pval.score{ color:var(--ghost); }
  .prow .pval.rate.r1{ background:var(--r1); }
  .prow .pval.rate.r2{ background:var(--r2); }
  .prow .pval.rate.r3{ background:var(--r3); }
  .prow .pval.rate.r4{ background:var(--r4); color:#FFFFFF; }
  .prow .pval.rate.r5{ background:var(--r5); color:#FFFFFF; }
  .prow .pval.st-reviewed{ background:var(--st-reviewed); }
  .prow .pval.st-shortlisted{ background:var(--st-shortlisted); }
  .prow .pval.st-archived{ background:var(--st-archived); color:var(--ghost); }
  .prow .pval.reason{ color:var(--ghost); }
  .ppremise{
    padding:8px; max-width:72ch;
    font-style:italic;
    border-left:1px solid var(--grid);
    border-bottom:1px solid var(--grid);
    min-height:57px;
  }
  .phint{
    padding:0 8px; height:19px; color:var(--ghost);
    border-left:1px solid var(--grid);
    border-bottom:1px solid var(--grid);
    white-space:nowrap; overflow:hidden;
  }

  /* ── sheet tabs row (visual only) ─────────────────────────────── */
  .tabs{ display:flex; height:19px; flex:none; border-top:1px solid var(--grid); }
  .tabs .tab{
    padding:0 12px; height:19px;
    border-right:1px solid var(--grid);
    background:var(--head); color:var(--ghost);
  }
  .tabs .tab.active{ background:var(--sheet); color:var(--ink); }
  .tabs .rest{ flex:1; background:var(--head); }

  /* ── status bar ───────────────────────────────────────────────── */
  .statusbar{
    display:flex; height:19px; flex:none;
    border-top:1px solid var(--grid);
    padding:0 8px; color:var(--ghost);
    white-space:nowrap; overflow:hidden;
  }

  @media (prefers-reduced-motion: reduce){
    .pane{ transition:none; }
  }
</style>
</head>

function cellText(s, k){
  switch(k){
    case 'week': return 'W' + weekNo(s.week);
    case 'title': return s.title;
    case 'premise': return s.premise;
    case 'publisher': return s.publisher;
    case 'region': return s.region;
    case 'tags': return s.tags.join(', ');
    case 'score': return String(s.score);
    case 'rating': return s.rating == null ? '' : String(s.rating);
    case 'status': return s.status;
    case 'comments': return s.comments > 0 ? String(s.comments) : '';
    case 'found': return s.found;
    default: return '';
  }
}

function paintCell(td, s, k){
  td.textContent = cellText(s, k);
  td.className = td.className.replace(/\br[1-5]\b|\bst-\w+\b/g, '').trim();
  if (k === 'rating' && s.rating != null) td.classList.add('r' + s.rating);
  if (k === 'status' && s.status !== 'new') td.classList.add('st-' + s.status);
  if (k === 'comments'){
    if (s.comments > 0){
      const t = document.createElement('span');
      t.className = 'ctri';
      td.appendChild(t);
    }
  }
}

WEEKS.forEach(wk => {
  const band = document.createElement('tr');
  band.className = 'band';
  const td = document.createElement('td');
  td.colSpan = COLS.length + 1;
  const span = document.createElement('span');
  span.className = 'bandlabel';
  span.textContent = `Week ${weekNo(wk.iso)} · ${fmtDate(wk.starts)} · ${wk.count} new`;
  td.appendChild(span);
  band.appendChild(td);
  tbody.appendChild(band);
  if (wk.iso === '2026-W39') firstBand39 = band;

  STORIES.filter(s => s.week === wk.iso).forEach(s => {
    const tr = document.createElement('tr');
    tr.className = 'hoverable';
    const nav = { type:'story', story:s, rownum:s.row, tr, tds:[] };
    const rn = document.createElement('td');
    rn.className = 'rownum';
    rn.textContent = s.row;
    tr.appendChild(rn);
    COLS.forEach((c, ci) => {
      const td = document.createElement('td');
      td.dataset.r = navRows.length;
      td.dataset.c = ci;
      if (c.k === 'score') td.classList.add('score');
      if (c.k === 'rating') td.classList.add('rate');
      if (c.k === 'status') td.classList.add('status');
      if (c.k === 'comments') td.classList.add('comments');
      if (c.k === 'found' || c.k === 'week') td.classList.add('num');
      if (c.k) paintCell(td, s, c.k);
      tr.appendChild(td);
      nav.tds.push(td);
    });
    s._tr = tr;
    s._nav = nav;
    tbody.appendChild(tr);
    navRows.push(nav);
  });
});

/* endless sheet: empty rows below content */
let nextNum = 452;
for (let i = 0; i < EMPTY_ROWS; i++){
  const tr = document.createElement('tr');
  tr.className = 'hoverable emptyrow';
  const rownum = String(nextNum++).padStart(4, '0');
  const nav = { type:'empty', rownum, tr, tds:[] };
  const rn = document.createElement('td');
  rn.className = 'rownum';
  rn.textContent = rownum;
  tr.appendChild(rn);
  COLS.forEach((c, ci) => {
    const td = document.createElement('td');
    td.dataset.r = navRows.length;
    td.dataset.c = ci;
    tr.appendChild(td);
    nav.tds.push(td);
  });
  tbody.appendChild(tr);
  navRows.push(nav);
}

table.appendChild(tbody);
wrap.appendChild(table);

/* ── state ───────────────────────────────────────────────────────── */
const state = { cur:null /* {r,c} */, open:null /* story */ };
const storyList = STORIES; /* seed order = ledger order */

const fcontent = document.getElementById('fcontent');
const statusbar = document.getElementById('statusbar');
const pane = document.getElementById('pane');
const paneSpacer = document.getElementById('paneSpacer');
const paneBody = document.getElementById('paneBody');
const paneFill = document.getElementById('paneFill');

const w39 = WEEKS.find(w => w.iso === '2026-W39');

/* ── the living formula bar ──────────────────────────────────────── */
let flashTimer = null;

function cellRef(nav, ci){
  return COLS[ci].letter + nav.rownum;
}

function selectionText(){
  if (!state.cur) return null;
  const nav = navRows[state.cur.r];
  const col = COLS[state.cur.c];
  const ref = cellRef(nav, state.cur.c);
  if (nav.type === 'story' && col.k){
    const v = cellText(nav.story, col.k);
    if (v === '') return ref;
    return `${ref} · ${col.label}: ${v}`;
  }
  return ref;
}

function renderFormulaBar(){
  if (flashTimer) return; /* a formula is speaking; it reverts on its own */
  const sel = selectionText();
  if (sel == null){
    fcontent.classList.add('ghost');
    fcontent.textContent = `=HUNT(week 39) → ${w39.count} stories`;
  } else {
    fcontent.classList.remove('ghost');
    fcontent.textContent = sel;
  }
}

function flash(formula){
  if (flashTimer) clearTimeout(flashTimer);
  fcontent.classList.remove('ghost');
  fcontent.textContent = formula;
  flashTimer = setTimeout(() => {
    flashTimer = null;
    renderFormulaBar();
  }, 1400);
}

/* ── status bar: live counts ─────────────────────────────────────── */
function renderStatusBar(){
  const shortlisted = storyList.filter(s => s.status === 'shortlisted').length;
  const archived = storyList.filter(s => s.status === 'archived').length;
  statusbar.textContent =
    `${storyList.length} stories · ${WEEKS.length} weeks · ${shortlisted} shortlisted · ${archived} archived`;
}

/* ── cell cursor ─────────────────────────────────────────────────── */
function curTd(){
  if (!state.cur) return null;
  return navRows[state.cur.r].tds[state.cur.c];
}

function setCursor(r, c){
  const prev = curTd();
  if (prev) prev.classList.remove('cur');
  state.cur = { r, c };
  const td = curTd();
  td.classList.add('cur');
  td.scrollIntoView({ block:'nearest', inline:'nearest' });
  renderFormulaBar();
}

function moveCursor(dr, dc){
  if (!state.cur){
    setCursor(storyList.find(s => s.week === '2026-W39')._nav === undefined ? 0
      : navRows.indexOf(storyList.find(s => s.week === '2026-W39')._nav), 0);
    return;
  }
  const r = Math.max(0, Math.min(navRows.length - 1, state.cur.r + dr));
  const c = Math.max(0, Math.min(COLS.length - 1, state.cur.c + dc));
  setCursor(r, c);
  if (state.open && dr !== 0){
    const nav = navRows[r];
    if (nav.type === 'story' && nav.story !== state.open) openStory(nav.story, false);
  }
}

/* ── dossier pane (variant B: right split pane, attached to its row) */
function ruleRows(n){
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++){
    const d = document.createElement('div');
    d.className = 'rule';
    frag.appendChild(d);
  }
  return frag;
}
paneFill.appendChild(ruleRows(60));

function markSelectedRow(){
  storyList.forEach(s => {
    s._tr.classList.remove('sel','st-reviewed','st-shortlisted','st-archived','st-new');
  });
  if (state.open){
    const s = state.open;
    s._tr.classList.add('sel');
    if (s.status !== 'new') s._tr.classList.add('st-' + s.status);
  }
}

function prow(label, value, valClass){
  const row = document.createElement('div');
  row.className = 'prow';
  const l = document.createElement('div');
  l.className = 'plabel';
  l.textContent = label;
  const v = document.createElement('div');
  v.className = 'pval' + (valClass ? ' ' + valClass : '');
  v.textContent = value;
  row.appendChild(l); row.appendChild(v);
  return row;
}

function renderPane(){
  const s = state.open;
  if (!s) return;
  paneBody.textContent = '';

  const title = document.createElement('div');
  title.className = 'ptitle' + (s.status !== 'new' ? ' st-' + s.status : '');
  title.textContent = s.title;
  paneBody.appendChild(title);

  const prem = document.createElement('div');
  prem.className = 'ppremise';
  prem.textContent = s.premise;
  paneBody.appendChild(prem);

  paneBody.appendChild(prow('week', 'W' + weekNo(s.week) + ', found ' + fmtDate(s.found)));
  paneBody.appendChild(prow('row', s.row));
  paneBody.appendChild(prow('publisher', s.publisher));
  paneBody.appendChild(prow('region', s.region));
  paneBody.appendChild(prow('tags', s.tags.join(', ')));
  paneBody.appendChild(prow('score', String(s.score), 'score'));
  paneBody.appendChild(prow('rating', s.rating == null ? '' : String(s.rating),
    'rate' + (s.rating != null ? ' r' + s.rating : '')));
  paneBody.appendChild(prow('status', s.status, s.status !== 'new' ? 'st-' + s.status : ''));
  if (s.status === 'archived' && s.reason){
    paneBody.appendChild(prow('reason', s.reason, 'reason'));
  }
  paneBody.appendChild(prow('comments', s.comments > 0 ? String(s.comments) : 'none'));

  const hint = document.createElement('div');
  hint.className = 'phint';
  hint.textContent = 'J/K walk stories. 1-5 rates. Esc closes.';
  paneBody.appendChild(hint);
}

function alignPane(){
  if (!state.open) return;
  const wrapRect = wrap.getBoundingClientRect();
  const rowRect = state.open._tr.getBoundingClientRect();
  let y = rowRect.top - wrapRect.top;
  y = Math.max(0, Math.min(y, wrap.clientHeight - 280));
  paneSpacer.textContent = '';
  paneSpacer.style.height = y + 'px';
  paneSpacer.appendChild(ruleRows(Math.ceil(y / 19)));
}

function openStory(s, moveCursorToo){
  state.open = s;
  if (moveCursorToo !== false){
    const r = navRows.indexOf(s._nav);
    const c = state.cur ? state.cur.c : 1;
    setCursor(r, c);
  }
  markSelectedRow();
  renderPane();
  pane.classList.add('open');
  /* seat the row four grid rows below the header, then attach the pane */
  wrap.scrollTop = s._tr.offsetTop - 19 * 4;
  alignPane();
  flash(`=OPEN(C${s.row})`);
}

function closePane(){
  if (!state.open) return;
  flash(`=CLOSE(C${state.open.row})`);
  state.open = null;
  markSelectedRow();
  pane.classList.remove('open');
}

function walk(delta){
  if (!state.open) return;
  const i = storyList.indexOf(state.open);
  const next = storyList[i + delta];
  if (next) openStory(next);
}

/* ── actions that write themselves as formulas ───────────────────── */
function repaintStoryRow(s){
  COLS.forEach((c, ci) => {
    if (c.k === 'rating' || c.k === 'status' || c.k === 'comments'){
      s._nav.tds[ci].textContent = '';
      paintCell(s._nav.tds[ci], s, c.k);
    }
  });
  markSelectedRow();
}

function cursorStory(){
  if (state.open) return state.open;
  if (!state.cur) return null;
  const nav = navRows[state.cur.r];
  return nav.type === 'story' ? nav.story : null;
}

function rate(n){
  const s = cursorStory();
  if (!s) return;
  s.rating = n;
  repaintStoryRow(s);
  if (state.open === s) renderPane();
  flash(`=RATE(C${s.row}, ${n})`);
}

function shortlist(){
  const s = cursorStory();
  if (!s) return;
  s.status = 'shortlisted';
  s.reason = null;
  repaintStoryRow(s);
  if (state.open === s) renderPane();
  renderStatusBar();
  flash(`=SHORTLIST(C${s.row})`);
}

function archive(){
  const s = cursorStory();
  if (!s) return;
  s.status = 'archived';
  s.reason = s.reason || 'too_thin';
  repaintStoryRow(s);
  if (state.open === s) renderPane();
  renderStatusBar();
  flash(`=ARCHIVE(C${s.row}, "${s.reason}")`);
}

/* ── input ───────────────────────────────────────────────────────── */
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  switch(e.key){
    case 'ArrowUp':    e.preventDefault(); moveCursor(-1, 0); break;
    case 'ArrowDown':  e.preventDefault(); moveCursor(1, 0);  break;
    case 'ArrowLeft':  e.preventDefault(); moveCursor(0, -1); break;
    case 'ArrowRight': e.preventDefault(); moveCursor(0, 1);  break;
    case 'Enter': {
      e.preventDefault();
      const s = state.cur && navRows[state.cur.r].type === 'story'
        ? navRows[state.cur.r].story : null;
      if (s) openStory(s, false);
      break;
    }
    case 'Escape':
      if (state.open) closePane();
      else if (state.cur){
        curTd().classList.remove('cur');
        state.cur = null;
        renderFormulaBar();
      }
      break;
    case 'j': case 'J': walk(1);  break;
    case 'k': case 'K': walk(-1); break;
    case '1': case '2': case '3': case '4': case '5':
      rate(parseInt(e.key, 10)); break;
    case 's': case 'S': shortlist(); break;
    case 'x': case 'X': archive(); break;
  }
});

wrap.addEventListener('click', e => {
  const td = e.target.closest('td');
  if (!td || td.dataset.r === undefined) return;
  setCursor(parseInt(td.dataset.r, 10), parseInt(td.dataset.c, 10));
});

wrap.addEventListener('dblclick', e => {
  const td = e.target.closest('td');
  if (!td || td.dataset.r === undefined) return;
  const nav = navRows[parseInt(td.dataset.r, 10)];
  if (nav.type === 'story') openStory(nav.story, false);
});

/* the pane stays attached to its row while the sheet scrolls */
wrap.addEventListener('scroll', alignPane);
window.addEventListener('resize', alignPane);

/* ── boot: land on the latest hunt ───────────────────────────────── */
renderFormulaBar();
renderStatusBar();
wrap.scrollTop = firstBand39.offsetTop - 19 * 2;
</script>
</body>
</html>
