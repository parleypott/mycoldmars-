<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>35 Walden — landscape studio</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;450;500&family=Newsreader:ital,opt@1,8..60&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF8F3; --paper-2:#F6F3EC; --surface:#fff; --surface-2:#EDE8DF;
    --ink:#2B2722; --ink-2:#5A534A; --ink-mute:#8A8175; --ink-faint:#B5AD9F;
    --line:#E7E2D8; --line-2:#DDD6C9;
    --accent:#B0552E; --accent-ink:#8F4322; --accent-bg:#F7ECE4;
    --ok:#4F7A4A; --ok-bg:#EDF3EA; --warn:#9A6B1E; --warn-bg:#FBF3E2; --bad:#A8412F; --bad-bg:#F8ECE8;
    --survey-sat:#ffffff; --survey-paper:#3F3A33;
    --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --serif:"Newsreader",Georgia,serif;
    --mono:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,monospace;
    --r-sm:6px; --r-md:9px; --r-lg:14px; --r-xl:18px; --r-pill:999px;
    --chatw:384px;
    --sh-1:0 1px 2px rgba(43,39,34,.06);
    --sh-2:0 2px 10px rgba(43,39,34,.08),0 1px 3px rgba(43,39,34,.05);
    --sh-3:0 8px 30px rgba(43,39,34,.12),0 2px 8px rgba(43,39,34,.06);
    --sh-lift:0 12px 40px rgba(43,39,34,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:var(--font);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;overflow:hidden}
  button{font-family:inherit}
  #app{display:grid;grid-template-columns:74px 1fr var(--chatw);grid-template-rows:56px 1fr 28px;height:100vh;width:100vw}
  #app.chat-collapsed{grid-template-columns:74px 1fr 0}
  .span{grid-column:1/-1}

  /* ---------- topbar ---------- */
  #topbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);z-index:30}
  .wordmark{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .pchip{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);background:var(--paper-2);border:1px solid var(--line);padding:3px 7px;border-radius:var(--r-sm)}
  .tb-spacer{flex:1}
  .modepill{display:flex;background:var(--paper-2);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:3px;position:relative}
  .modepill button{position:relative;z-index:2;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink-2);padding:6px 16px;border-radius:var(--r-pill);transition:color .2s;display:flex;align-items:center;gap:6px}
  .modepill button.active{color:#fff}
  .modepill .glider{position:absolute;top:3px;left:3px;height:calc(100% - 6px);background:var(--ink);border-radius:var(--r-pill);transition:transform .22s cubic-bezier(.22,.61,.36,1),width .22s;z-index:1}
  .tbtn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:500;padding:7px 11px;border-radius:var(--r-sm);cursor:pointer;display:flex;align-items:center;gap:6px}
  .tbtn:hover{border-color:var(--ink);color:var(--ink)}
  .tbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tbtn.ghost{border-color:transparent;background:none}
  .tbtn.ghost:hover{background:var(--surface-2)}
  .tb-hair{width:1px;height:22px;background:var(--line-2)}
  .tbtn svg{width:15px;height:15px}

  /* ---------- palette rail ---------- */
  #rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:3px;overflow-y:auto;z-index:20}
  #rail::-webkit-scrollbar{width:0}
  .pcard{width:60px;height:58px;border:1px solid transparent;border-radius:var(--r-md);background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-2);transition:.12s}
  .pcard:hover{background:var(--paper-2);transform:translateY(-1px)}
  .pcard.active{background:var(--ink);color:#fff}
  .pcard svg{width:22px;height:22px}
  .pcard span{font-size:9px;font-weight:500;letter-spacing:.01em}
  .rail-div{width:36px;height:1px;background:var(--line);margin:5px 0}

  /* ---------- canvas ---------- */
  #canvaswrap{position:relative;overflow:hidden;background:var(--paper-2)}
  #map{position:absolute;inset:0}
  .maplibregl-ctrl-attrib{font-size:9px!important;opacity:.6}
  .maplibregl-ctrl-bottom-right{margin-bottom:34px}
  #hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(43,39,34,.92);color:#fff;font-size:12px;padding:7px 15px;border-radius:var(--r-pill);pointer-events:none;opacity:0;transition:.2s;white-space:nowrap;box-shadow:var(--sh-3);z-index:6}
  #hint.show{opacity:1}
  #northarrow{position:absolute;top:14px;right:14px;width:34px;height:34px;z-index:5;opacity:.7;transition:transform .6s cubic-bezier(.22,.61,.36,1)}
  #toast{position:absolute;top:14px;left:50%;transform:translateX(-50%) translateY(-12px);background:var(--ink);color:#fff;font-size:12.5px;padding:8px 16px;border-radius:var(--r-pill);opacity:0;transition:.3s;z-index:8;pointer-events:none;box-shadow:var(--sh-3)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* render overlay */
  #renderlayer{position:absolute;inset:0;z-index:7;pointer-events:none;display:none}
  #renderlayer img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--paper)}
  #renderctl{position:absolute;bottom:46px;left:50%;transform:translateX(-50%);z-index:9;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:8px 14px;display:none;align-items:center;gap:12px;box-shadow:var(--sh-3)}
  #renderctl.show{display:flex}
  #renderctl input[type=range]{width:150px;accent-color:var(--accent)}
  #renderctl .rl{font-size:11px;font-family:var(--mono);color:var(--ink-mute)}
  #renderctl button{border:none;background:none;cursor:pointer;color:var(--ink-2);font-size:12px;font-weight:500}
  #renderctl button:hover{color:var(--accent)}

  /* layers/scenarios popover */
  .pop{position:absolute;top:54px;right:8px;width:300px;max-height:78vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--sh-3);z-index:40;padding:12px 14px;display:none}
  .pop.show{display:block}
  .pop h3{margin:0 0 8px;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-mute)}
  .lgroup{margin-top:10px}.lgroup .gl{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);margin-bottom:3px}
  .lrow{display:flex;align-items:center;gap:8px;padding:4px 0}
  .lrow .sw{width:22px;height:12px;border-radius:3px;border:1px solid var(--line-2);flex:none}
  .lrow label{flex:1;font-size:12px;color:var(--ink-2);cursor:pointer}
  .lrow input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px}
  .lrow .op{width:54px;accent-color:var(--accent)}
  .basebar{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
  .basebtn{font-size:11px;padding:4px 8px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;color:var(--ink-2)}
  .basebtn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .yr{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);margin-bottom:6px}
  .yr select,.scsel{font-family:var(--mono);font-size:12px;padding:4px 6px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);flex:1}
  .nrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0}
  .nrow label{font-size:12.5px;color:var(--ink-2)}
  .nrow .note{font-size:10px;color:var(--ink-mute)}
  .nrow input[type=number]{width:64px;font-family:var(--mono);font-size:12.5px;padding:5px 7px;border:1px solid var(--line-2);border-radius:var(--r-sm);text-align:right}
  .badge{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;padding:1px 4px;border-radius:3px;background:var(--warn-bg);color:var(--warn)}
  .toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer;padding:4px 0}
  .toggle input{accent-color:var(--accent);width:14px;height:14px}
  .btn{font-size:12px;padding:6px 11px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;color:var(--ink-2);font-weight:500}
  .btn:hover{border-color:var(--ink)} .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)} .btn.danger{color:var(--bad)}

  /* ---------- chat panel ---------- */
  #chat{position:relative;background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:20;min-height:0}
  #chat.collapsed{display:none}
  /* left-edge resize handle */
  #chatresize{position:absolute;left:-4px;top:0;bottom:0;width:9px;cursor:col-resize;z-index:25}
  #chatresize::after{content:"";position:absolute;left:3px;top:50%;transform:translateY(-50%);width:3px;height:42px;border-radius:3px;background:var(--line-2);transition:.15s}
  #chatresize:hover::after,#chatresize.drag::after{background:var(--accent);height:64px}
  #chathead{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line)}
  #chathead .hbtns{display:flex;gap:2px}
  /* attachments */
  #attachments{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px}
  #attachments:empty{display:none}
  #attachments .att{position:relative;width:48px;height:48px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line-2)}
  #attachments .att img{width:100%;height:100%;object-fit:cover}
  #attachments .att button{position:absolute;top:1px;right:1px;width:16px;height:16px;border:none;border-radius:50%;background:rgba(43,39,34,.82);color:#fff;font-size:11px;line-height:1;cursor:pointer;padding:0}
  .msg.user .uimgs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
  .msg.user .uimgs img{width:64px;height:64px;object-fit:cover;border-radius:6px}
  #chatdrop{position:absolute;inset:0;background:var(--accent-bg);border:2px dashed var(--accent);border-radius:12px;display:none;align-items:center;justify-content:center;color:var(--accent-ink);font-size:14px;font-weight:600;z-index:30;pointer-events:none}
  #chatdrop.show{display:flex}
  #chathead .ct{font-size:13px;font-weight:600}
  #chathead .cd{font-size:10px;color:var(--ink-mute);font-family:var(--mono)}
  #chathead button{border:none;background:none;cursor:pointer;color:var(--ink-mute);font-size:16px;padding:4px}
  #stream{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0}
  #stream::-webkit-scrollbar{width:8px}#stream::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px;border:2px solid var(--paper)}
  .msg{font-size:14px;line-height:1.55}
  .msg.agent{color:var(--ink);font-family:var(--serif)}
  .msg.agent::before{content:"•";color:var(--accent);margin-right:7px;font-weight:700}
  .msg.user{align-self:flex-end;max-width:82%;background:var(--surface-2);color:var(--ink);padding:8px 13px;border-radius:var(--r-lg);font-size:13.5px}
  .msg.sys{align-self:center;font-family:var(--mono);font-size:11px;color:var(--ink-mute)}
  .opcard{border:1px solid var(--line-2);border-radius:var(--r-lg);background:var(--surface);padding:10px 12px;box-shadow:var(--sh-1)}
  .opcard .oc-h{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
  .opcard .oc-h .dot{width:10px;height:10px;border-radius:3px}
  .opcard .oc-sub{font-size:11.5px;color:var(--ink-mute);margin-top:3px}
  .rendercard{border:1px solid var(--line-2);border-radius:var(--r-xl);overflow:hidden;background:var(--paper-2);box-shadow:var(--sh-2)}
  .rendercard .rc-img{width:100%;display:block;background:var(--paper)}
  .rendercard .rc-load{aspect-ratio:1/1;position:relative;background:var(--paper-2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="6" height="6"><rect width="6" height="6" fill="%23f2ede2"/><circle cx="1" cy="1" r=".5" fill="%23e6ddc9"/></svg>')}
  .rendercard .rc-load::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(122,150,90,.28) 50%,transparent 70%);transform:translateX(-100%);animation:wash 1.7s ease-in-out infinite}
  @keyframes wash{to{transform:translateX(100%)}}
  .rendercard .rc-cap{padding:8px 12px;font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);display:flex;justify-content:space-between;align-items:center}
  .rendercard .rc-cap .rc-acts{display:flex;gap:10px}
  .rendercard .rc-cap button{border:none;background:none;cursor:pointer;color:var(--accent);font-family:var(--font);font-size:11px;font-weight:500}
  .loadphrase{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:11px;color:var(--ink-2);z-index:2}
  #chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 0}
  .chip{font-size:11.5px;padding:5px 10px;border:1px solid var(--line-2);border-radius:var(--r-pill);background:var(--surface);cursor:pointer;color:var(--ink-2)}
  .chip:hover{background:var(--surface-2)}
  #composer{padding:12px 16px 16px;display:flex;gap:8px;align-items:flex-end}
  #composer textarea{flex:1;resize:none;border:1px solid var(--line-2);border-radius:var(--r-md);padding:9px 11px;font-family:var(--font);font-size:13.5px;color:var(--ink);background:var(--surface);max-height:120px;line-height:1.4}
  #composer textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  .cbtn{width:34px;height:34px;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none}
  .cbtn:hover{border-color:var(--ink);color:var(--ink)}
  .cbtn.send{background:var(--ink);color:#fff;border-color:var(--ink)}
  .cbtn svg{width:16px;height:16px}
  #framebtn{position:absolute;top:54px;right:14px;display:flex;align-items:center;gap:6px;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:6px 12px 6px 9px;cursor:pointer;color:var(--ink-2);font-size:12px;font-weight:500;box-shadow:var(--sh-2)}
  #framebtn:hover{border-color:var(--ink);color:var(--ink)}
  #framebtn svg{width:16px;height:16px}

  /* inspector drawer */
  #inspector{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line-2);box-shadow:0 -4px 20px rgba(43,39,34,.08);padding:12px 16px;transform:translateY(110%);transition:transform .26s cubic-bezier(.22,.61,.36,1);z-index:15}
  #inspector.show{transform:translateY(0)}
  #inspector .it{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  #inspector .dot{width:11px;height:11px;border-radius:3px}
  #inspector .iname{flex:1;font-size:13.5px;font-weight:600;border:none;background:none;outline:none;color:var(--ink)}
  #inspector .otype{font-family:var(--mono);font-size:9px;text-transform:uppercase;color:var(--ink-mute);background:var(--paper-2);padding:2px 5px;border-radius:3px}
  #inspector .idel{border:none;background:none;color:var(--ink-faint);cursor:pointer;font-size:15px}#inspector .idel:hover{color:var(--bad)}
  #inspector .dims{display:flex;gap:8px;flex-wrap:wrap}
  #inspector .dim{display:flex;flex-direction:column;gap:2px}
  #inspector .dim span{font-family:var(--mono);font-size:9px;text-transform:uppercase;color:var(--ink-faint)}
  #inspector .dim input{width:56px;font-family:var(--mono);font-size:12.5px;padding:4px 6px;border:1px solid var(--line-2);border-radius:var(--r-sm);text-align:right;background:var(--paper-2)}
  #inspector .dim input:focus{outline:none;border-color:var(--accent);background:#fff}
  #inspector .status{margin-top:8px;font-size:11.5px}
  #inspector .status.ok{color:var(--ok)}#inspector .status.bad{color:var(--bad)}
  #inspector .meta{margin-top:6px;font-size:11px;color:var(--ink-mute);display:flex;gap:14px}
  #inspector .meta b{font-family:var(--mono);color:var(--ink-2)}

  /* statusbar */
  #statusbar{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--surface);border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--ink-mute);z-index:20}
  #statusbar .lock{display:flex;align-items:center;gap:5px;color:var(--ok)}
  #statusbar .sb-r{margin-left:auto;display:flex;gap:16px}

  @media (max-width:1199px){#app{grid-template-columns:74px 1fr 0}#chat{position:fixed;right:0;top:56px;bottom:28px;width:var(--chatw);box-shadow:var(--sh-3)}#chat.collapsed{display:none}#chatresize{display:none}}
</style>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<div id="app">
  <!-- TOPBAR -->
  <header id="topbar">
    <span class="wordmark">35 walden</span>
    <span class="pchip">1.50-20-43 · R-20 · 0.54 ac</span>
    <div class="tb-spacer"></div>
    <div class="modepill" id="modepill">
      <div class="glider" id="glider"></div>
      <button data-mode="satellite" class="active">satellite</button>
      <button data-mode="design">design</button>
    </div>
    <div class="tb-spacer"></div>
    <button class="tbtn" id="gridbtn" title="square to house"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="1" transform="rotate(10 12 12)"/></svg>grid</button>
    <button class="tbtn ghost" id="layersbtn">layers</button>
    <button class="tbtn ghost" id="scenebtn">scenarios</button>
    <button class="tbtn ghost" id="checkbtn" title="site check — setbacks, walls, coverage">✓ check</button>
    <div class="tb-hair"></div>
    <button class="tbtn ghost" id="printbtn">print</button>
    <button class="tbtn ghost" id="chattoggle" title="toggle co-designer">✎</button>
  </header>

  <!-- PALETTE RAIL -->
  <nav id="rail"></nav>

  <!-- CANVAS -->
  <div id="canvaswrap">
    <div id="map"></div>
    <svg id="northarrow" viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="rgba(255,255,255,.7)" stroke="#3F3A33" stroke-width=".7"/><path d="M20 8 L24 22 L20 19 L16 22 Z" fill="#3F3A33"/><text x="20" y="33" font-size="8" text-anchor="middle" fill="#3F3A33" font-family="monospace">n</text></svg>
    <button id="framebtn" title="rotate square + zoom to the back yard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 12l4.5-4.5L12 16l-4.5-3.5z" fill="currentColor" stroke="none"/></svg>frame backyard</button>
    <div id="renderlayer"><img id="renderimg" alt="watercolor render"></div>
    <div id="renderctl">
      <span class="rl">watercolor</span>
      <input type="range" id="renderop" min="0" max="1" step="0.02" value="1">
      <button id="renderclose">remove</button>
    </div>
    <div id="hint"></div>
    <div id="toast"></div>
  </div>

  <!-- CHAT PANEL -->
  <aside id="chat">
    <div id="chatresize" title="drag to resize"></div>
    <div id="chatdrop">drop photos to attach</div>
    <div id="chathead"><div><span class="ct">co-designer</span> <span class="cd">nano banana</span></div><div class="hbtns"><button id="chatexpand" title="expand">⤢</button><button id="chatcollapse" title="collapse">›</button></div></div>
    <div id="stream"></div>
    <div id="chips"></div>
    <div id="attachments"></div>
    <div id="composer">
      <input type="file" id="filein" accept="image/*" multiple hidden>
      <button class="cbtn" id="attachbtn" title="attach photos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5l-8.5 8.5a5 5 0 01-7-7l8.5-8.5a3.5 3.5 0 015 5l-8.5 8.5a2 2 0 01-3-3l8-8"/></svg></button>
      <textarea id="cinput" rows="1" placeholder="place a pool, screen the west line, ask where things fit…"></textarea>
      <button class="cbtn" id="renderbtn" title="render watercolor board">🎨</button>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@turf/turf@7/turf.min.js" crossorigin="anonymous"></script>
<script>
/* ====================== DATA (embedded truth) ====================== */
const ARC="https://giswww.westchestergov.com/arcgis/rest/services";
const PARCEL_LAYER=ARC+"/MunicipalTaxParcels/MapServer/463";
const PARCEL_RING=[[-73.854692055940532,41.081355677241739],[-73.855098033192135,41.081526244157359],[-73.855104490405594,41.081515127761882],[-73.855258996126224,41.081249230296471],[-73.855295129103027,41.081170688507761],[-73.855392645160265,41.080959368967498],[-73.855195955665977,41.080925333284064],[-73.854678563533369,41.081204809121353],[-73.854688415913671,41.081217901805374],[-73.854697338032977,41.081232875091196],[-73.854704215051285,41.08124852705739],[-73.854708815565701,41.081264677949115],[-73.854711149056115,41.081280987363535],[-73.854711216679775,41.081297457114005],[-73.854709241667621,41.081313914666879],[-73.854704777612284,41.081330015988065],[-73.854692055940532,41.081355677241739]];
const HOUSE_RING=[[-73.8548987,41.0813772],[-73.8549925,41.0813638],[-73.8549796,41.0813144],[-73.8549828,41.0813095],[-73.8549966,41.0813077],[-73.8549853,41.0812455],[-73.8550087,41.0812388],[-73.8549974,41.0811956],[-73.8549723,41.0811968],[-73.8549626,41.0811554],[-73.8548519,41.0811706],[-73.8548979,41.0813766],[-73.8548987,41.0813772]];
const WALL_BEARING=-9.55;       // long house wall bearing (used to square the map)
const FRAME_BEARING=-99.55;     // local-frame +y points toward the open west yard ("away from back wall")
const GRID_BEARING=FRAME_BEARING;
const PARCEL_INFO={address:"35 Walden Road, Tarrytown NY 10591",printkey:"1.50-20-43",owner:"Germa, Eric",zoning:"R-20",areaSf:23527,acres:0.54,school:"Tarrytowns"};

const subjectPoly=turf.polygon([PARCEL_RING]);
const subjectLine=turf.polygonToLine(subjectPoly);
const housePoly=turf.polygon([HOUSE_RING]);
const CENTER=turf.centroid(subjectPoly).geometry.coordinates;
const HOUSE_C=turf.centroid(housePoly).geometry.coordinates;

/* ====================== LOCAL SITE FRAME (feet, anchored to house) ====================== */
const FT=3.28084, M2SF=10.7639104;
const mPerDeg=lat=>({lng:111320*Math.cos(lat*Math.PI/180),lat:110540});
const bn=GRID_BEARING*Math.PI/180;
const dN=[Math.sin(bn),Math.cos(bn)], dE=[Math.cos(bn),-Math.sin(bn)];
function local2ll(x,y){ // x=grid-east ft, y=grid-north ft
  const m=mPerDeg(HOUSE_C[1]);
  const te=x*dE[0]+y*dN[0], tn=x*dE[1]+y*dN[1];
  return [HOUSE_C[0]+(te/FT)/m.lng, HOUSE_C[1]+(tn/FT)/m.lat];
}
function ll2local(lng,lat){
  const m=mPerDeg(HOUSE_C[1]);
  const te=(lng-HOUSE_C[0])*m.lng*FT, tn=(lat-HOUSE_C[1])*m.lat*FT;
  return [te*dE[0]+tn*dE[1], te*dN[0]+tn*dN[1]]; // inverse rotation (dE,dN orthonormal)
}
function rot2(x,y,deg){const r=deg*Math.PI/180,c=Math.cos(r),s=Math.sin(r);return [x*c-y*s,x*s+y*c];}
// house local bbox (for AI "off the back wall")
const houseLocal=HOUSE_RING.map(p=>ll2local(p[0],p[1]));
const HBB={minx:Math.min(...houseLocal.map(p=>p[0])),maxx:Math.max(...houseLocal.map(p=>p[0])),miny:Math.min(...houseLocal.map(p=>p[1])),maxy:Math.max(...houseLocal.map(p=>p[1]))};

/* ====================== ELEMENT DEFS ====================== */
// family: 'box' (center+w+l+rot) or 'poly' (local pts + optional width)
const DEFS={
  pool:{label:'pool',family:'box',kind:'rect',w:16,l:36,color:'#2f8f9d',fill:'#7fb6bd'},
  spa:{label:'spa',family:'box',kind:'oval',w:8,l:8,color:'#2f8f9d',fill:'#7fb6bd'},
  deck:{label:'deck',family:'box',kind:'rect',w:16,l:20,color:'#9c7a45',fill:'#c9a878'},
  patio:{label:'patio',family:'box',kind:'rect',w:18,l:18,color:'#8a8268',fill:'#ccc6b4'},
  bed:{label:'bed',family:'box',kind:'oval',w:6,l:14,color:'#6c7d45',fill:'#9aa86a'},
  hedge:{label:'hedge',family:'poly',kind:'line',width:2.5,color:'#4c5d38',fill:'#5f7245'},
  tree:{label:'tree',family:'box',kind:'oval',w:18,l:18,color:'#5d6b3a',fill:'#84945a'},
  firepit:{label:'fire pit',family:'box',kind:'oval',w:6,l:6,color:'#9a4f33',fill:'#b06a4a'},
  path:{label:'path',family:'poly',kind:'line',width:4,color:'#a99a72',fill:'#d8cdae'},
  wall:{label:'retaining wall',family:'poly',kind:'line',width:1.6,color:'#6b5d44',fill:'#8a7a5c',isWall:true,defH:3},
  box:{label:'box',family:'box',kind:'rect',w:20,l:20,color:'#6d5bd0',fill:'#9d8cf0'},
  shape:{label:'shape',family:'poly',kind:'polygon',color:'#6d5bd0',fill:'#9d8cf0'},
  measure:{label:'measure',family:'poly',kind:'line',width:0,color:'#be123c',fill:'#be123c'},
};
const PALETTE=[['pool','◭'],['spa','◯'],['deck','▭'],['patio','▦'],['wall','▤'],['bed','⬭'],['hedge','∿'],['tree','♣'],['firepit','◉'],['path','⌇'],['__div__'],['box','□'],['shape','⬠'],['measure','📏'],['clear','🗑']];
function icon(t){const m={pool:'<rect x="4" y="7" width="16" height="10" rx="2"/>',spa:'<ellipse cx="12" cy="12" rx="7" ry="6"/>',deck:'<rect x="5" y="5" width="14" height="14" rx="1"/><path d="M9 5v14M14 5v14"/>',patio:'<rect x="5" y="5" width="14" height="14" rx="1"/><path d="M5 10h14M5 15h14M10 5v14M15 5v14"/>',bed:'<ellipse cx="12" cy="12" rx="5" ry="8"/>',hedge:'<path d="M4 14c2-4 4-4 6 0s4 4 6 0 4-4 4 0"/>',tree:'<circle cx="12" cy="11" r="6"/><path d="M12 17v4"/>',firepit:'<circle cx="12" cy="13" r="5"/><path d="M12 8c2 1 2 3 0 4"/>',path:'<path d="M5 19c4-2 4-8 8-10s6-4 6-4"/>',wall:'<path d="M3 9h18M3 15h18M9 9v6M15 9v6M6 15v4M12 15v4M18 15v4"/>',box:'<rect x="5" y="5" width="14" height="14" rx="1"/>',shape:'<path d="M6 8l5-3 8 4-2 9-9 1z"/>',measure:'<path d="M4 20L20 4M6 18l2-1M11 13l2-1"/>',clear:'<path d="M6 7h12M9 7V5h6v2M8 7l1 12h6l1-12"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${m[t]||''}</svg>`;}

/* ====================== STATE ====================== */
let map, mode='satellite', gridOn=false, currentBase='aerial', currentYear=2025;
let elements=[], selectedId=null, tool=null, draftPts=null, drag=null, uid=1;
let chatHistory=[];
let attachments=[]; // data-URL strings of pending reference photos
const $=s=>document.querySelector(s);
const STORE='walden-studio:v1', SCENES='walden-studio:scenes';

/* ====================== GEOMETRY ====================== */
function boxRingLocal(e){const hw=e.wFt/2,hl=e.lFt/2;return [[-hw,-hl],[hw,-hl],[hw,hl],[-hw,hl]].map(([x,y])=>{const[rx,ry]=rot2(x,y,e.rot||0);return [e.cx+rx,e.cy+ry];});}
function ovalRingLocal(e,n=48){const hw=e.wFt/2,hl=e.lFt/2,r=[];for(let i=0;i<n;i++){const a=2*Math.PI*i/n;const[rx,ry]=rot2(hw*Math.cos(a),hl*Math.sin(a),e.rot||0);r.push([e.cx+rx,e.cy+ry]);}return r;}
function elemLocalRing(e){ // returns array of local pts (open for poly-line, closed-ish for areas)
  if(e.family==='box') return e.kind==='oval'?ovalRingLocal(e):boxRingLocal(e);
  return e.pts; // poly: local pts
}
function elemLngLatRing(e){return elemLocalRing(e).map(([x,y])=>local2ll(x,y));}
function elemGeoJSON(e){
  if(e.family==='box'){const ring=elemLngLatRing(e);return turf.polygon([[...ring,ring[0]]]);}
  // poly
  const ll=elemLngLatRing(e);
  if(e.kind==='polygon'&&ll.length>=3){return turf.polygon([[...ll,ll[0]]]);}
  // line: buffer by width/2 if width>0, else line
  const line=turf.lineString(ll.length>=2?ll:[ll[0],ll[0]]);
  if(e.width>0){try{const b=turf.buffer(line,e.width/2,{units:'feet'});if(b)return b;}catch(_){}}
  return line;
}
function elemCentroidLocal(e){if(e.family==='box')return [e.cx,e.cy];const xs=e.pts.map(p=>p[0]),ys=e.pts.map(p=>p[1]);return [xs.reduce((a,b)=>a+b,0)/xs.length, ys.reduce((a,b)=>a+b,0)/ys.length];}
function elemArea(e){if(e.family==='box')return e.kind==='oval'?Math.PI*(e.wFt/2)*(e.lFt/2):e.wFt*e.lFt;if(e.kind==='polygon'){try{return turf.area(elemGeoJSON(e))*M2SF;}catch(_){return 0;}}return 0;}
function elemLen(e){const ll=elemLngLatRing(e);let t=0;for(let i=0;i<ll.length-1;i++)t+=turf.distance(ll[i],ll[i+1],{units:'feet'});if(e.family==='box')t+=turf.distance(ll[ll.length-1],ll[0],{units:'feet'});return t;}

/* ====================== SETBACKS ====================== */
// Setback/lot checks must sample the element's whole BOUNDARY, not just its corners.
// A rotated box near a lot-line corner is closest to it mid-edge, and a box edge can
// cross a concave notch in the parcel while all 4 corners stay inside. Densify in local
// feet (exact euclidean) so every sampled point sits on the true edge — this only ever
// catches a violation vertex-only sampling missed, never invents one.
function densifyLocalRing(pts,closed,step){step=step||1.5;const out=[],N=pts.length;if(!N)return out;const last=closed?N:N-1;for(let i=0;i<last;i++){const a=pts[i],b=pts[(i+1)%N];out.push(a);const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy),n=Math.floor(len/step);for(let k=1;k<=n;k++){const t=k*step/len;out.push([a[0]+dx*t,a[1]+dy*t]);}}if(!closed)out.push(pts[N-1]);return out;}
function sampledLngLatRing(e){const closed=e.family==='box'||e.kind==='polygon';return densifyLocalRing(elemLocalRing(e),closed,1.5).map(([x,y])=>local2ll(x,y));}
function envelope(ft){if(ft<=0)return subjectPoly;try{const b=turf.buffer(subjectPoly,-ft,{units:'feet'});return (b&&b.geometry&&b.geometry.coordinates.length)?b:null;}catch(_){return null;}}
function nearestLotLine(e){const ring=sampledLngLatRing(e);let mn=Infinity;ring.forEach(p=>{try{const d=turf.pointToLineDistance(p,subjectLine,{units:'feet'});if(d<mn)mn=d;}catch(_){}});return mn;}
function outsideLot(e){return sampledLngLatRing(e).some(p=>!turf.booleanPointInPolygon(p,subjectPoly));}
function evaluate(e){
  if(e.type==='measure')return null;
  const isPool=e.type==='pool'||e.type==='spa';
  const req=isPool?(+$('#sb-pool').value||0):(+$('#sb-struct').value||0);
  const clr=nearestLotLine(e); const reasons=[]; let ok=true;
  if(outsideLot(e)){reasons.push('extends beyond the lot line');ok=false;}
  else if(clr<req-0.05){reasons.push(`${(req-clr).toFixed(1)} ft inside the ${req} ft setback`);ok=false;}
  return {ok,reasons,clr,req,isPool};
}

/* ====================== MAP ====================== */
const AERIAL_YEARS=[2025,2023,2021,2018,2016,2013,2010,2007,2004,2000,1990,1976,1960,1947];
const aerialUrl=y=>`${ARC}/MappingWestchesterCounty_AerialPhoto${y}/MapServer/export?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=512,512&format=jpg&f=image`;
const envExp=id=>`${ARC}/DataHub_EnvironmentandPlanning/MapServer/export?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=512,512&format=png&transparent=true&dpi=180&layers=show:${id}&f=image`;
const BASEMAPS={aerial:{label:'aerial'},esri:{label:'esri',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256},light:{label:'street',tiles:['https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png'],tileSize:256}};
const OVERLAYS=[['Property',[['parcels','neighboring parcels','#9a3412','__V__',false,1]]],
 ['Built',[['planimetric','buildings · pavement','#525252',`${ARC}/Planimetric_Basemap_WGS84/MapServer/export?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=512,512&format=png&transparent=true&dpi=180&f=image`,false,.85],['zoning','zoning districts','#b45309',envExp(207),false,.5]]],
 ['Terrain & water',[['contours','2 ft contours','#92400e',`${ARC}/2FtContours_WGS84/MapServer/export?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=512,512&format=png&transparent=true&f=image`,false,.8],['slopes','steep slopes','#9f1239',envExp(152),false,.55],['flood','flood plains','#1d4ed8',envExp(157),false,.5]]],
 ['Environmental',[['wetnys','NYS wetlands','#047857',envExp(217),false,.55],['soils','USDA soils','#78350f',envExp(159),false,.45]]]];

function baseSource(){if(currentBase==='aerial')return{type:'raster',tiles:[aerialUrl(currentYear)],tileSize:512,attribution:'Westchester County GIS'};const b=BASEMAPS[currentBase];return{type:'raster',tiles:b.tiles,tileSize:b.tileSize,attribution:currentBase==='esri'?'Esri':'CARTO'};}

function initMap(){
  map=new maplibregl.Map({container:'map',preserveDrawingBuffer:true,
    style:{version:8,glyphs:"https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",sources:{},layers:[{id:'bg',type:'background',paint:{'background-color':'#F6F3EC'}}]},
    center:CENTER,zoom:18.7,maxZoom:22,attributionControl:{compact:true}});
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
  map.addControl(new maplibregl.ScaleControl({maxWidth:120,unit:'imperial'}),'bottom-left');
  map.on('load',onLoad);
  map.on('rotate',updateNorth);
  map.on('move',updateStatus);
  map.on('mousemove',e=>{$('#sb-cursor').textContent=`${e.lngLat.lat.toFixed(5)}, ${e.lngLat.lng.toFixed(5)}`;});
}

function onLoad(){
  map.addSource('base',baseSource());
  map.addLayer({id:'base',type:'raster',source:'base',paint:{'raster-opacity':1}});
  // GIS overlays
  OVERLAYS.forEach(([,arr])=>arr.forEach(([id,l,sw,url,on,op])=>{if(url==='__V__')return;map.addSource('ov-'+id,{type:'raster',tiles:[url],tileSize:512});map.addLayer({id:'ov-'+id,type:'raster',source:'ov-'+id,layout:{visibility:on?'visible':'none'},paint:{'raster-opacity':op}});}));
  // neighbors
  map.addSource('neighbors',{type:'geojson',data:turf.featureCollection([])});
  map.addLayer({id:'neighbors-line',type:'line',source:'neighbors',layout:{visibility:'none'},paint:{'line-color':'#9a3412','line-width':1,'line-opacity':.4}});
  // envelope + ring
  map.addSource('env',{type:'geojson',data:turf.featureCollection([])});
  map.addLayer({id:'env-fill',type:'fill',source:'env',paint:{'fill-color':'#22c55e','fill-opacity':.1}});
  map.addLayer({id:'env-line',type:'line',source:'env',paint:{'line-color':'#3fae5a','line-width':1.6,'line-dasharray':[3,2],'line-opacity':.9}});
  map.addSource('poolring',{type:'geojson',data:turf.featureCollection([])});
  map.addLayer({id:'poolring-line',type:'line',source:'poolring',layout:{visibility:'none'},paint:{'line-color':'#2f8f9d','line-width':1.3,'line-dasharray':[2,2],'line-opacity':.85}});
  // survey: house + parcel
  map.addSource('house',{type:'geojson',data:housePoly});
  map.addLayer({id:'house-fill',type:'fill',source:'house',paint:{'fill-color':'#e6ddc9','fill-opacity':.55}});
  map.addLayer({id:'house-line',type:'line',source:'house',paint:{'line-color':'#3F3A33','line-width':2}});
  map.addSource('parcel',{type:'geojson',data:subjectPoly});
  map.addLayer({id:'parcel-line',type:'line',source:'parcel',paint:{'line-color':'#3F3A33','line-width':2.6}});
  // elements
  map.addSource('elems',{type:'geojson',data:turf.featureCollection([])});
  map.addLayer({id:'elems-fill',type:'fill',source:'elems',filter:['==','$type','Polygon'],paint:{'fill-color':['get','fill'],'fill-opacity':['case',['get','bad'],.2,['case',['get','design'],.62,.34]]}});
  map.addLayer({id:'elems-line',type:'line',source:'elems',paint:{'line-color':['case',['get','bad'],'#b91c1c',['get','color']],'line-width':['case',['get','sel'],2.6,1.6]}});
  map.addSource('dimlbl',{type:'geojson',data:turf.featureCollection([])});
  map.addLayer({id:'dimlbl',type:'symbol',source:'dimlbl',layout:{'text-field':['get','t'],'text-size':['get','sz'],'text-font':['Noto Sans Bold'],'text-allow-overlap':true},paint:{'text-color':['get','col'],'text-halo-color':'#fff','text-halo-width':1.6}});
  map.addSource('handles',{type:'geojson',data:turf.featureCollection([])});
  map.addLayer({id:'handles',type:'circle',source:'handles',paint:{'circle-radius':['case',['==',['get','role'],'rotate'],6,5],'circle-color':'#fff','circle-stroke-color':'#B0552E','circle-stroke-width':2}});

  wireMap();
  fitParcel();
  loadNeighbors();
  if(!loadState()) addElement('pool',{cx:0,cy:HBB.maxy+22,name:'Pool'});
  redraw(); renderEnv();
  buildRail(); buildLayerUI(); restoreScenes();
  applyMode(); updateNorth(); updateStatus();
  greet();
}

function fitParcel(){const b=turf.bbox(subjectPoly);map.fitBounds([[b[0],b[1]],[b[2],b[3]]],{padding:80,duration:0,maxZoom:20,bearing:gridOn?-WALL_BEARING:0});}
async function loadNeighbors(){try{const env="-73.8595,41.0782,-73.8503,41.0843";const u=`${PARCEL_LAYER}/query?geometry=${env}&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=PRINTKEY&returnGeometry=true&outSR=4326&f=geojson`;const r=await fetch(u);const j=await r.json();const feats=(j.features||[]).filter(f=>f.properties.PRINTKEY!==PARCEL_INFO.printkey);map.getSource('neighbors').setData({type:'FeatureCollection',features:feats});}catch(e){}}

/* ====================== MODE + GRID ====================== */
function applyMode(){
  const design=mode==='design';
  // basemap fade
  if(map.getLayer('base'))map.setPaintProperty('base','raster-opacity',design?0:1);
  // background paper visible in design
  map.setPaintProperty('bg','background-color',design?'#F6F3EC':'#1a1a1a');
  // survey line color
  const sc=design?'#3F3A33':'#ffffff';
  map.setPaintProperty('parcel-line','line-color',sc);
  map.setPaintProperty('house-line','line-color',sc);
  map.setPaintProperty('house-fill','fill-color',design?'#e6ddc9':'#ffffff');
  map.setPaintProperty('house-fill','fill-opacity',design?.55:.12);
  // glider
  const mp=$('#modepill'),btns=[...mp.querySelectorAll('button')],gl=$('#glider');
  btns.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  const act=mp.querySelector('button.active');gl.style.width=act.offsetWidth+'px';gl.style.transform=`translateX(${act.offsetLeft-3}px)`;

/* ====================== ELEMENTS ====================== */
function addElement(type,opts={}){
  const d=DEFS[type];const e={id:'el_'+(uid++),type,family:d.family,kind:opts.kind||d.kind,color:d.color,fill:d.fill,name:opts.name||nextName(d.label),rot:opts.rot||0};
  if(d.family==='box'){e.cx=opts.cx??0;e.cy=opts.cy??0;e.wFt=opts.wFt||d.w;e.lFt=opts.lFt||d.l;}
  else {e.pts=opts.pts||[];e.width=opts.width??d.width??0;}
  if(d.isWall) e.heightFt=opts.heightFt??d.defH;
  if(opts.levelFt!=null) e.levelFt=opts.levelFt;
  elements.push(e);selectedId=e.id;save();return e;
}
function nextName(base){const n=elements.filter(e=>e.name&&e.name.toLowerCase().startsWith(base.toLowerCase())).length;return n?`${base} ${n+1}`:base;}
function selected(){return elements.find(e=>e.id===selectedId);}
function delElement(id){elements=elements.filter(e=>e.id!==id);if(selectedId===id)selectedId=null;save();redraw();closeInspector();}
function mapCenterLocal(){const c=map.getCenter();return ll2local(c.lng,c.lat);}

function redraw(){
  const design=mode==='design';const feats=[],labels=[];
  elements.forEach(e=>{
    const sel=e.id===selectedId, ev=evaluate(e);
    const g=elemGeoJSON(e);
    feats.push({type:'Feature',geometry:g.geometry,properties:{id:e.id,color:e.color,fill:e.fill,sel,design,bad:ev?!ev.ok:false}});
    const cLL=local2ll(...elemCentroidLocal(e));
    if(e.type==='measure'){let t=0;const ll=elemLngLatRing(e);for(let i=0;i<ll.length-1;i++)t+=turf.distance(ll[i],ll[i+1],{units:'feet'});labels.push(lbl(cLL,`${e.name}: ${Math.round(t)}′`,11,'#be123c'));}
    else if(e.family==='box'){const area=elemArea(e);const txt=e.type==='tree'?`${e.name}\n⌀${Math.round(e.wFt)}′`:`${e.name}\n${Math.round(e.wFt)}′×${Math.round(e.lFt)}′`;labels.push(lbl(cLL,txt,sel?12:11,ev&&!ev.ok?'#b91c1c':e.color));}
    else if(e.type==='wall'){const h=e.heightFt||0;labels.push(lbl(cLL,`R.W. H=${h}'-0"`,sel?11:10,h>4?'#b91c1c':e.color));}
    else {const area=elemArea(e);labels.push(lbl(cLL,e.kind==='polygon'?`${e.name}\n${Math.round(area)} sf`:`${e.name}`,sel?12:11,e.color));}
  });
  if(draftPts&&draftPts.length){const ll=draftPts.map(([x,y])=>local2ll(x,y));const geom=(tool==='shape'&&ll.length>=3)?{type:'Polygon',coordinates:[[...ll,ll[0]]]}:{type:'LineString',coordinates:ll};feats.push({type:'Feature',geometry:geom,properties:{color:DEFS[tool].color,fill:DEFS[tool].fill,sel:true,design,bad:false}});}
  map.getSource('elems').setData({type:'FeatureCollection',features:feats});
  map.getSource('dimlbl').setData({type:'FeatureCollection',features:labels});
  renderHandles(); renderPoolRing();
  if($('#checkpop')&&$('#checkpop').classList.contains('show')) renderCheck();
}
function lbl(c,t,sz,col){return{type:'Feature',geometry:{type:'Point',coordinates:c},properties:{t,sz,col}};}
function renderHandles(){const e=selected();const f=[];if(e){if(e.family==='box'){const hw=e.wFt/2,hl=e.lFt/2;[['nw',-hw,hl],['ne',hw,hl],['se',hw,-hl],['sw',-hw,-hl]].forEach(([role,x,y])=>{const[rx,ry]=rot2(x,y,e.rot||0);f.push(hf(local2ll(e.cx+rx,e.cy+ry),role,e.id));});const[rx,ry]=rot2(0,hl+Math.max(7,e.lFt*.16),e.rot||0);f.push(hf(local2ll(e.cx+rx,e.cy+ry),'rotate',e.id));}else{e.pts.forEach((p,i)=>f.push(hf(local2ll(p[0],p[1]),'vtx',e.id,i)));}}map.getSource('handles').setData({type:'FeatureCollection',features:f});}
function hf(c,role,id,idx){return{type:'Feature',geometry:{type:'Point',coordinates:c},properties:{role,id,idx:idx==null?-1:idx}};}

/* ====================== POINTER INTERACTION ====================== */
function wireMap(){
  map.on('mousedown',onDown);map.on('touchstart',onDown);
  map.on('mousemove',onMove);map.on('touchmove',onMove);
  window.addEventListener('mouseup',onUp);window.addEventListener('touchend',onUp);
  map.on('click',onClick);map.on('dblclick',onDbl);
  map.on('mousemove',e=>{if(drag||draftPts)return;const h=map.queryRenderedFeatures(e.point,{layers:['handles']});const fr=map.queryRenderedFeatures(e.point,{layers:['elems-fill','elems-line']});map.getCanvas().style.cursor=h.length?(h[0].properties.role==='rotate'?'grab':'nwse-resize'):(fr.length?'move':(tool?'crosshair':''));});
}
function onClick(e){
  const ll=ll2local(e.lngLat.lng,e.lngLat.lat);
  if(tool==='shape'||tool==='path'||tool==='hedge'||tool==='measure'||tool==='wall'){draftPts=draftPts||[];draftPts.push(ll);redraw();hint(tool==='shape'?'click to add points · double-click to close':'click to add points · double-click to finish');return;}
  if(tool&&DEFS[tool]&&DEFS[tool].family==='box'){addElement(tool,{cx:ll[0],cy:ll[1]});setTool(null);redraw();openInspector();return;}
  const fr=map.queryRenderedFeatures(e.point,{layers:['elems-fill','elems-line']});
  if(fr.length){selectedId=fr[0].properties.id;redraw();openInspector();}else if(!drag){selectedId=null;redraw();closeInspector();}
}
function onDbl(e){if((tool==='shape'||tool==='path'||tool==='hedge'||tool==='measure'||tool==='wall')&&draftPts&&draftPts.length>=(tool==='shape'?3:2)){e.preventDefault();const type=tool;addElement(type,{pts:draftPts.slice(),kind:type==='shape'?'polygon':'line'});draftPts=null;setTool(null);redraw();openInspector();}}
function onDown(e){
  if(tool)return;
  const h=map.queryRenderedFeatures(e.point,{layers:['handles']});
  if(h.length){const p=h[0].properties;const el=elements.find(x=>x.id===p.id);if(!el)return;map.dragPan.disable();drag={mode:p.role==='rotate'?'rotate':(p.role==='vtx'?'vertex':'resize'),role:p.role,idx:p.idx,e:el,start:snap(el),sLL:ll2local(e.lngLat.lng,e.lngLat.lat)};return;}
  const fr=map.queryRenderedFeatures(e.point,{layers:['elems-fill','elems-line']});
  if(fr.length){const el=elements.find(x=>x.id===fr[0].properties.id);if(!el)return;selectedId=el.id;map.dragPan.disable();drag={mode:'move',e:el,start:snap(el),sLL:ll2local(e.lngLat.lng,e.lngLat.lat)};redraw();openInspector();}
}
function onMove(e){
  if(!drag)return;const cur=ll2local(e.lngLat.lng,e.lngLat.lat),el=drag.e,st=drag.start;
  const dx=cur[0]-drag.sLL[0],dy=cur[1]-drag.sLL[1];
  if(drag.mode==='move'){if(el.family==='box'){el.cx=st.cx+dx;el.cy=st.cy+dy;}else{el.pts=st.pts.map(p=>[p[0]+dx,p[1]+dy]);}}
  else if(drag.mode==='vertex'){el.pts=st.pts.map((p,i)=>i===drag.idx?cur:p);}
  else if(drag.mode==='rotate'){const ang=Math.atan2(cur[0]-st.cx,cur[1]-st.cy)*180/Math.PI;el.rot=-ang;}
  else if(drag.mode==='resize'){const un=rot2(cur[0]-st.cx,cur[1]-st.cy,-(st.rot||0));const sx=drag.role.includes('e')?1:-1,sy=drag.role.includes('n')?1:-1;const ox=-sx*st.wFt/2,oy=-sy*st.lFt/2;el.wFt=Math.max(2,Math.abs(un[0]-ox));el.lFt=Math.max(2,Math.abs(un[1]-oy));const cxL=(un[0]+ox)/2,cyL=(un[1]+oy)/2;const[rx,ry]=rot2(cxL,cyL,st.rot||0);el.cx=st.cx+rx;el.cy=st.cy+ry;}
  redraw();
}
function onUp(){if(drag){map.dragPan.enable();drag=null;save();redraw();if(selected())openInspector();}}
function snap(e){return JSON.parse(JSON.stringify(e));}

/* ====================== SITE CHECK (constraint oracle) ====================== */
const COVERAGE_TYPES=['deck','patio','pool','spa','box','firepit'];
const MAX_COVER_PCT=20; // R-20 assumption — confirm w/ village
function siteCheck(){
  const flags=[];
  elements.filter(e=>e.type==='wall').forEach(w=>{ if((w.heightFt||0)>4) flags.push(`${w.name}: ${w.heightFt} ft wall — over 4 ft usually needs an engineer's stamp; consider splitting into terraces`); });
  elements.forEach(e=>{ const ev=evaluate(e); if(ev&&!ev.ok) flags.push(`${e.name}: ${ev.reasons.join('; ')}`); });
  let cover=0; try{cover+=turf.area(housePoly)*M2SF;}catch(_){}
  elements.filter(e=>COVERAGE_TYPES.includes(e.type)).forEach(e=>{cover+=elemArea(e)||0;});
  const pct=cover/PARCEL_INFO.areaSf*100;
  if(pct>MAX_COVER_PCT) flags.push(`lot coverage ${pct.toFixed(1)}% exceeds R-20 ~${MAX_COVER_PCT}% (confirm w/ village)`);
  return {flags, coverPct:pct, coverSf:cover};
}
function renderCheck(){
  const box=$('#checkbody'); if(!box)return;
  const r=siteCheck();
  let html=`<div style="font-size:12.5px;color:var(--ink-2);margin-bottom:8px">coverage <b style="font-family:var(--mono)">${r.coverPct.toFixed(1)}%</b> of lot <span style="color:var(--ink-mute)">(${Math.round(r.coverSf).toLocaleString()} sf incl. house; R-20 max ~${MAX_COVER_PCT}%)</span></div>`;
  if(!r.flags.length){ html+=`<div class="status ok" style="font-size:12.5px">✓ no flags — setbacks clear, walls under 4  ft, coverage ok</div>`; }
  else { html+=r.flags.map(f=>`<div style="font-size:12px;color:var(--bad);padding:6px 0;border-top:1px solid var(--line);line-height:1.4">⚠ ${f}</div>`).join(''); }
  html+=`<p style="font-size:10.5px;color:var(--ink-mute);margin-top:10px;font-family:var(--sans);line-height:1.4">Heads-up only — confirm setbacks, wall engineering, and coverage with the Village of Tarrytown. This is an early-warning check, not a permit.</p>`;
  box.innerHTML=html;
}

const API='/api/walden-design';
function greet(){addMsg('agent',"hey — this is your back yard at 35 walden. tell me what you're imagining: a pool off the back, hedges to screen the west line, a fire-pit corner. i'll place real, measured things on the plan and you can drag them anywhere. when it feels right, hit 🎨 and i'll paint the whole thing as a watercolor board.");setChips(['pool off the back','screen the west line with hedges','where would a pool fit?','render this as a watercolor']);}

function setChips(arr){const c=$('#chips');c.innerHTML='';arr.forEach(t=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{$('#cinput').value=t;send();};c.appendChild(b);});}
function planSummary(){return{units:'feet',gridBearing:GRID_BEARING,house:{centerLocal:[0,0],bbox:HBB,note:'+y points into the open back yard (west); the back wall faces +y at the maxy edge; the street/driveway is toward miny. place yard features at positive cy.'},setbacks:{structure:+$('#sb-struct').value,pool:+$('#sb-pool').value},elements:elements.map(e=>{const c=elemCentroidLocal(e);const bx=e.family==='box';const o={id:e.id,type:e.type,kind:e.kind,name:e.name,cx:Math.round((bx?e.cx:c[0])*10)/10,cy:Math.round((bx?e.cy:c[1])*10)/10,wFt:Math.round(bx?e.wFt:bboxW(e)),lFt:Math.round(bx?e.lFt:bboxL(e)),rot:Math.round(e.rot||0)};if(e.heightFt!=null)o.heightFt=e.heightFt;if(e.levelFt!=null)o.levelFt=e.levelFt;return o;})};}
function bboxW(e){const xs=e.pts.map(p=>p[0]);return Math.max(...xs)-Math.min(...xs);}
function bboxL(e){const ys=e.pts.map(p=>p[1]);return Math.max(...ys)-Math.min(...ys);}
async function send(){const inp=$('#cinput');const msg=inp.value.trim();if(!msg&&!attachments.length)return;
  const imgs=attachments.slice();inp.value='';inp.style.height='auto';
  addUserMsg(msg||'(photos)',imgs);chatHistory.push({role:'user',content:msg||'[reference photos attached]'});
  attachments=[];renderAttachments();
  const thinking=addMsg('sys','thinking…');
  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'chat',message:msg||'Here are some reference photos.',plan:planSummary(),history:chatHistory.slice(-12),images:imgs})});const j=await r.json();thinking.remove();
    if(j.error){addMsg('sys','⚠ '+j.error);return;}
    if(j.reply){addMsg('agent',j.reply);chatHistory.push({role:'assistant',content:j.reply});}
    if(j.ops&&j.ops.length){applyOps(j.ops);}
  }catch(e){thinking.remove();addMsg('sys','⚠ '+e.message);}
}
function addUserMsg(text,imgs){const s=$('#stream');const d=document.createElement('div');d.className='msg user';if(imgs&&imgs.length){const w=document.createElement('div');w.className='uimgs';imgs.forEach(src=>{const im=document.createElement('img');im.src=src;w.appendChild(im);});d.appendChild(w);}if(text){const t=document.createElement('div');t.textContent=text;d.appendChild(t);}s.appendChild(d);s.scrollTop=s.scrollHeight;}

function frameBackyard(){gridOn=true;$('#gridbtn').classList.add('on');
  const corners=[[-85,HBB.miny-20],[85,HBB.miny-20],[85,HBB.maxy+105],[-85,HBB.maxy+105]].map(([x,y])=>local2ll(x,y));corners.push(corners[0]);
  let focus=turf.polygon([corners]);
  try{const ix=turf.intersect(turf.featureCollection([turf.polygon([corners]),subjectPoly]));if(ix)focus=ix;}catch(_){}
  const b=turf.bbox(focus);
  map.fitBounds([[b[0],b[1]],[b[2],b[3]]],{bearing:-WALL_BEARING,duration:850,padding:50,maxZoom:20.5});
  toast('framed the backyard');
}
function applyOps(ops){let placed=0,last=null;ops.forEach(o=>{
  if(o.op==='add'){const e=addElement(o.type,{kind:o.kind,name:o.name,cx:o.cx,cy:o.cy,wFt:o.wFt,lFt:o.lFt,rot:o.rot,heightFt:o.heightFt,levelFt:o.levelFt});placed++;last=e;opReceipt(o);}
  else if(o.op==='move'){const e=elements.find(x=>x.id===o.id);if(e&&e.family==='box'){e.cx=o.cx;e.cy=o.cy;last=e;}}
  else if(o.op==='resize'){const e=elements.find(x=>x.id===o.id);if(e&&e.family==='box'){e.wFt=o.wFt;e.lFt=o.lFt;last=e;}}
  else if(o.op==='rotate'){const e=elements.find(x=>x.id===o.id);if(e){e.rot=o.rot;last=e;}}
  else if(o.op==='delete'){elements=elements.filter(x=>x.id!==o.id);}
  else if(o.op==='rename'){const e=elements.find(x=>x.id===o.id);if(e)e.name=o.name;}
});save();if(last){selectedId=last.id;const c=local2ll(...elemCentroidLocal(last));map.easeTo({center:c,duration:400});}redraw();if(selected())openInspector();}
function opReceipt(o){const s=$('#stream');const d=document.createElement('div');d.className='opcard';d.innerHTML=`<div class="oc-h"><span class="dot" style="background:${(DEFS[o.type]||{}).fill||'#888'}"></span>${o.name||o.type} · ${Math.round(o.wFt)}×${Math.round(o.lFt)} ft</div><div class="oc-sub">placed ${o.rot?('rotated '+Math.round(o.rot)+'°'):'squared to house'}</div>`;s.appendChild(d);s.scrollTop=s.scrollHeight;}

/* ====================== RENDER (watercolor) ====================== */
async function renderBoard(extra){
  const wasDesign=mode==='design';if(!wasDesign){mode='design';applyMode();await new Promise(r=>setTimeout(r,400));}
  await new Promise(r=>map.once('idle',r));
  const png=map.getCanvas().toDataURL('image/png');
  const s=$('#stream');const card=document.createElement('div');card.className='rendercard';card.innerHTML=`<div class="rc-load"><div class="loadphrase">washing in greens…</div></div>`;s.appendChild(card);s.scrollTop=s.scrollHeight;
  const phrases=['washing in greens…','softening the edges…','letting it dry…'];let pi=0;const ph=setInterval(()=>{pi=(pi+1)%phrases.length;const el=card.querySelector('.loadphrase');if(el)el.textContent=phrases[pi];},3500);
  const ctx=`~0.5-acre R-20 parcel in Tarrytown NY. Elements present: ${elements.map(e=>e.name).join(', ')||'bare lot'}. Keep orientation as shown.`;
  try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'render',image:png,context:ctx,instruction:extra||''})});const j=await r.json();clearInterval(ph);
    if(j.error||!j.image){card.innerHTML=`<div class="rc-cap">⚠ ${j.error||'render failed'}</div>`;return;}
    const src=`data:${j.mimeType||'image/png'};base64,${j.image}`;
    card.innerHTML=`<img class="rc-img" src="${src}"><div class="rc-cap"><span>watercolor · ${Math.round((j.ms||0)/1000)}s</span><span class="rc-acts"><button data-act="overlay">overlay</button><button data-act="open">open</button><button data-act="dl">download</button></span></div>`;
    card.querySelector('[data-act="overlay"]').onclick=()=>showOverlay(src);
    card.querySelector('[data-act="open"]').onclick=()=>window.open(src,'_blank');
    card.querySelector('[data-act="dl"]').onclick=()=>{const a=document.createElement('a');a.href=src;a.download='walden-watercolor.png';a.click();};
    showOverlay(src);
  }catch(e){clearInterval(ph);card.innerHTML=`<div class="rc-cap">⚠ ${e.message}</div>`;}
}
function showOverlay(src){$('#renderimg').src=src;$('#renderlayer').style.display='block';$('#renderctl').classList.add('show');$('#renderop').value=1;$('#renderimg').style.opacity=1;}
$('#renderop').oninput=e=>{$('#renderimg').style.opacity=e.target.value;};
$('#renderclose').onclick=()=>{$('#renderlayer').style.display='none';$('#renderctl').classList.remove('show');};

/* ====================== PERSIST ====================== */
function stateObj(){return{elements,uid,mode,gridOn,base:currentBase,year:currentYear,sb:{struct:+$('#sb-struct').value,pool:+$('#sb-pool').value,env:$('#env-on').checked,ring:$('#poolring-on').checked}};}
function applyState(s){elements=s.elements||[];uid=s.uid||(elements.reduce((m,e)=>Math.max(m,+(''+e.id).replace('el_','')||0),0)+1);if(s.sb){$('#sb-struct').value=s.sb.struct;$('#sb-pool').value=s.sb.pool;$('#env-on').checked=s.sb.env;$('#poolring-on').checked=s.sb.ring;}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(stateObj()));}catch(_){}}
function loadState(){try{const r=localStorage.getItem(STORE);if(!r)return false;applyState(JSON.parse(r));return true;}catch(_){return false;}}
function scenes(){try{const v=JSON.parse(localStorage.getItem(SCENES)||'{}');return(v&&typeof v==='object'&&!Array.isArray(v))?v:{};}catch(_){return{};}}
function restoreScenes(){const n=Object.keys(scenes());const sel=$('#sc-sel');sel.innerHTML='<option value="">— saved —</option>'+n.map(x=>`<option>${x}</option>`).join('');}
$('#sc-save').onclick=()=>{const n=prompt('save scenario as:','scheme '+(Object.keys(scenes()).length+1));if(!n)return;const o=scenes();o[n]=stateObj();localStorage.setItem(SCENES,JSON.stringify(o));restoreScenes();};
$('#sc-load').onclick=()=>{const n=$('#sc-sel').value;if(!n)return;const o=scenes();if(o[n]){applyState(JSON.parse(JSON.stringify(o[n])));renderEnv();redraw();save();closeInspector();}};
$('#sc-del').onclick=()=>{const n=$('#sc-sel').value;if(!n)return;if(confirm(`delete "${n}"?`)){const o=scenes();delete o[n];localStorage.setItem(SCENES,JSON.stringify(o));restoreScenes();}};
$('#wd-export').onclick=()=>{const payload={app:'walden-studio',v:1,exported:new Date().toISOString(),plan:stateObj(),scenes:scenes()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='walden-plan-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('#wd-import').onclick=()=>$('#wd-import-file').click();
$('#wd-import-file').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);const plan=d&&d.plan?d.plan:d;if(!plan||!Array.isArray(plan.elements))throw new Error('no elements');if(d&&d.scenes&&typeof d.scenes==='object'){const cur=scenes();localStorage.setItem(SCENES,JSON.stringify(Object.assign(cur,d.scenes)));restoreScenes();}applyState(JSON.parse(JSON.stringify(plan)));renderEnv();redraw();save();closeInspector();}catch(err){alert('could not import this file — '+(err.message||'invalid plan'));}};rd.readAsText(f);e.target.value='';};
$('#sc-clear').onclick=()=>{if(elements.length&&confirm('clear everything you\'ve drawn?')){elements=[];selectedId=null;save();redraw();closeInspector();}};
$('#sc-reset').onclick=()=>{if(confirm('reset to a single pool?')){elements=[];uid=1;addElement('pool',{cx:0,cy:HBB.maxy+22,name:'Pool'});$('#sb-struct').value=25;$('#sb-pool').value=15;save();renderEnv();redraw();}};

/* ====================== UI WIRING ====================== */
$('#modepill').querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;applyMode();if(mode==='design'&&currentBase==='aerial')map.setPaintProperty('base','raster-opacity',0);});
$('#gridbtn').onclick=toggleGrid;
$('#printbtn').onclick=()=>window.print();
function togglePop(id){['layerpop','scenepop','checkpop'].forEach(p=>{if(p===id)$('#'+p).classList.toggle('show');else $('#'+p).classList.remove('show');});}
$('#layersbtn').onclick=()=>togglePop('layerpop');
$('#scenebtn').onclick=()=>togglePop('scenepop');
$('#checkbtn').onclick=()=>{togglePop('checkpop');renderCheck();};
function toggleChat(){const c=$('#app').classList.toggle('chat-collapsed');$('#chat').classList.toggle('collapsed',c);setTimeout(()=>map.resize(),320);}
$('#chattoggle').onclick=toggleChat;
$('#chatcollapse').onclick=toggleChat;
$('#sendbtn').onclick=send;
$('#renderbtn').onclick=()=>renderBoard('');
$('#framebtn').onclick=frameBackyard;
// attachments: pick / paste / drop
$('#attachbtn').onclick=()=>$('#filein').click();
$('#filein').onchange=e=>{addFiles(e.target.files);e.target.value='';};
$('#cinput').addEventListener('paste',e=>{const items=[...((e.clipboardData||{}).items||[])];const imgs=items.filter(i=>i.type&&i.type.startsWith('image/'));if(imgs.length){e.preventDefault();addFiles(imgs.map(i=>i.getAsFile()).filter(Boolean));}});
(function(){const chat=$('#chat'),dz=$('#chatdrop');let c=0;chat.addEventListener('dragover',e=>e.preventDefault());chat.addEventListener('dragenter',e=>{e.preventDefault();c++;dz.classList.add('show');});chat.addEventListener('dragleave',()=>{c--;if(c<=0){c=0;dz.classList.remove('show');}});chat.addEventListener('drop',e=>{e.preventDefault();c=0;dz.classList.remove('show');if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files);});})();
// chat resize (drag left edge) + persist
function setChatW(w){w=Math.max(320,Math.min(900,Math.round(w)));document.documentElement.style.setProperty('--chatw',w+'px');try{localStorage.setItem('walden-chatw',w);}catch(_){}}
(function(){let saved=0;try{saved=+localStorage.getItem('walden-chatw');}catch(_){}if(saved)setChatW(saved);const h=$('#chatresize');let rz=null;h.addEventListener('mousedown',e=>{e.preventDefault();rz={x:e.clientX,w:$('#chat').offsetWidth};h.classList.add('drag');document.body.style.cursor='col-resize';});window.addEventListener('mousemove',e=>{if(!rz)return;setChatW(rz.w+(rz.x-e.clientX));if(map&&map.resize)map.resize();});window.addEventListener('mouseup',()=>{if(rz){rz=null;h.classList.remove('drag');document.body.style.cursor='';if(map)map.resize();}});})();
$('#chatexpand').onclick=()=>{const cur=$('#chat').offsetWidth,big=Math.min(900,Math.round(window.innerWidth*0.55));setChatW(cur<big-20?big:384);setTimeout(()=>map.resize(),320);};
$('#cinput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
$('#cinput').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(120,e.target.scrollHeight)+'px';});
document.addEventListener('click',e=>{if(!e.target.closest('.pop')&&!e.target.closest('#layersbtn')&&!e.target.closest('#scenebtn')&&!e.target.closest('#checkbtn')){$('#layerpop').classList.remove('show');$('#scenepop').classList.remove('show');$('#checkpop').classList.remove('show');}});

initMap();
</script>
</body>
