<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCENT — the family mountain</title>
<meta name="description" content="Every foot the Harris family has climbed, stacked into one growing mountain.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4f0e6;
    --ink:#22251f;
    --ink-soft:#5a5d54;
    --line:#c9c3b2;
    --line-faint:#dedac9;
    --accent:#e8590c;
    --sky-top:#f4f0e6;
    --hike-1:#2f6f4e;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  /* faint topo texture */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background:
      repeating-radial-gradient(circle at 15% 20%, transparent 0 58px, var(--line-faint) 58px 59px, transparent 59px 120px),
      repeating-radial-gradient(circle at 85% 75%, transparent 0 74px, var(--line-faint) 74px 75px, transparent 75px 150px);
    mask-image:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.1) 40%,rgba(0,0,0,.35));
  }
  .wrap{max-width:1180px;margin:0 auto;padding:48px 32px 80px;position:relative}

  header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:8px}
  .kicker{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft)}
  h1{
    font-family:'Fraunces',serif;font-weight:600;font-style:italic;
    font-size:clamp(40px,6vw,72px);line-height:1;letter-spacing:-.01em;margin-top:10px;
  }
  h1 .thin{font-style:normal;font-weight:300}

  .bignum{text-align:right}
  .bignum .n{
    font-family:'Fraunces',serif;font-weight:700;font-size:clamp(40px,5.5vw,64px);
    line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;
  }
  .bignum .u{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);margin-top:6px}
  .bignum .alt{font-size:13px;color:var(--ink-soft);margin-top:2px}

  .unit-toggle{
    display:inline-flex;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden;
    font-size:12px;letter-spacing:.12em;margin-top:12px;cursor:pointer;user-select:none;
  }
  .unit-toggle span{padding:5px 12px}
  .unit-toggle span.on{background:var(--ink);color:var(--paper)}

  .beaten{
    margin:22px 0 6px;font-size:14px;color:var(--ink);
    border-left:3px solid var(--accent);padding:8px 0 8px 14px;max-width:560px;line-height:1.55;
  }
  .beaten b{color:var(--accent)}

  /* ————— the mountain ————— */
  .mountain-box{position:relative;margin-top:26px;border:1.5px solid var(--ink);background:linear-gradient(180deg,#f8f5ec, #f1ecdf);border-radius:3px;box-shadow:6px 6px 0 rgba(34,37,31,.12)}
  svg{display:block;width:100%;height:auto}
  .axis text, .lm text{font-family:'IBM Plex Mono',monospace}

  /* ————— hike log ————— */
  section.log{margin-top:56px}
  .log-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1.5px solid var(--ink);padding-bottom:10px;margin-bottom:0}
  .log-head h2{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:28px}
  .log-head .count{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
  .hike{
    display:grid;grid-template-columns:14px 1fr auto;gap:0 18px;align-items:baseline;
    padding:20px 4px;border-bottom:1px solid var(--line);
  }
  .hike .swatch{width:14px;height:14px;border-radius:2px;transform:translateY(2px)}
  .hike .name{font-family:'Fraunces',serif;font-size:22px;font-weight:600}
  .hike .meta{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.7}
  .hike .gain{font-family:'Fraunces',serif;font-weight:700;font-size:26px;text-align:right;font-variant-numeric:tabular-nums}
  .hike .gain small{display:block;font-family:'IBM Plex Mono',monospace;font-weight:400;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);margin-top:4px}

  footer{margin-top:48px;font-size:12px;color:var(--ink-soft);letter-spacing:.06em;line-height:1.8}
  footer .dot{color:var(--accent)}
  @media(max-width:640px){
    .wrap{padding:32px 18px 64px}
    .bignum{text-align:left}
    .hike{grid-template-columns:14px 1fr}
    .hike .gain{grid-column:2;text-align:left;margin-top:8px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="kicker">Harris family · every metre climbed, stacked</div>
      <h1>ASCENT<span class="thin"> — the family mountain</span></h1>
      <div class="unit-toggle" id="unitToggle" title="switch units">
        <span data-u="m">m</span><span data-u="ft">ft</span>
      </div>
    </div>
    <div class="bignum">
      <div class="n" id="totalNum">—</div>
      <div class="u">climbed so far</div>
      <div class="alt" id="totalAlt"></div>
    </div>
  </header>

  <p class="beaten" id="beatenLine"></p>

  <div class="mountain-box">
    <svg id="mtn" viewBox="0 0 1140 520" preserveAspectRatio="xMidYMax meet" aria-label="The family's cumulative climbing drawn as a mountain, with real landmarks at their true heights"></svg>
  </div>

  <section class="log">
    <div class="log-head">
      <h2>The climb log</h2>
      <div class="count" id="logCount"></div>
    </div>
    <div id="logRows"></div>
  </section>

  <footer>
    <span class="dot">●</span> add a hike: append it to <b>hikes.json</b> — the mountain grows on its own.<br>
    heights compared against real structures at their true built height.
  </footer>
</div>

<script>
const HIKE_COLORS = ['#2f6f4e','#b3541e','#3a5f8a','#7d4a8c','#8a7420','#a13d3d','#2f7d76','#5d6b2f'];
const LANDMARKS = [
  {name:'Statue of Liberty', ft:305},
  {name:'Great Pyramid of Giza', ft:449},
  {name:'Washington Monument', ft:555},
  {name:'Eiffel Tower', ft:1083},
  {name:'Empire State Building', ft:1454},
  {name:'One World Trade Center', ft:1776},
  {name:'Burj Khalifa', ft:2722},
  {name:'Angel Falls', ft:3212},
  {name:'El Capitan (base to summit)', ft:3600},
];
const FT_TO_M = 0.3048;
let unit = 'm';
let DATA = null;

const fmt = n => n.toLocaleString('en-US', {maximumFractionDigits:0});
const inUnit = ft => unit === 'm' ? ft * FT_TO_M : ft;
const uLabel = () => unit === 'm' ? 'm' : 'ft';

/* deterministic jaggedness so each hike's ridge is stable across loads */
function seeded(id){
  let h = 2166136261;
  for (const c of id) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return () => {
    h = Math.imul(h ^ (h >>> 15), 2246822519);
    h = Math.imul(h ^ (h >>> 13), 3266489917);
    return ((h ^= h >>> 16) >>> 0) / 4294967296;
  };
}

function draw(){
  const svg = document.getElementById('mtn');
  const W = 1140, H = 520, padL = 70, padR = 260, padT = 46, padB = 44;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const hikes = DATA.hikes;
  const totalFt = hikes.reduce((s,h) => s + h.elevation_gain_ft, 0);
  /* y-scale: leave headroom to the next landmark not yet beaten */
  const nextLm = LANDMARKS.find(l => l.ft > totalFt);
  const yMaxFt = Math.max(totalFt * 1.25, (nextLm ? nextLm.ft : totalFt) * 1.12);
  const y = ft => padT + plotH - (ft / yMaxFt) * plotH;
  const x = f => padL + f * plotW;

  let el = '';

  /* horizon gridlines */
  const stepFt = unit === 'm' ? (100 / FT_TO_M) : niceStep(yMaxFt);
  for (let ft = stepFt; ft < yMaxFt; ft += stepFt){
    el += `<line x1="${padL}" y1="${y(ft)}" x2="${W-padR+40}" y2="${y(ft)}" stroke="#d8d3c2" stroke-width="1" stroke-dasharray="2 5"/>`;
    el += `<text x="${padL-10}" y="${y(ft)+4}" text-anchor="end" font-size="11" fill="#8a8c82">${fmt(inUnit(ft))}</text>`;
  }
  el += `<text x="${padL-10}" y="${padT-18}" text-anchor="end" font-size="10" letter-spacing="2" fill="#8a8c82">${uLabel().toUpperCase()}</text>`;

  /* the ridge — cumulative, jagged, only ever up */
  let cum = 0;
  let pts = [[x(0), y(0)]];
  const segments = [];
  hikes.forEach((h, i) => {
    const rand = seeded(h.id);
    const f0 = cum / totalFt, f1 = (cum + h.elevation_gain_ft) / totalFt;
    const segPts = [];
    const N = Math.max(7, Math.round(14 * (f1 - f0) * hikes.length + 8));
    for (let k = 1; k <= N; k++){
      const t = k / N;
      const jag = k === N ? 0 : (rand() - 0.42) * 0.09;
      const climbed = cum + h.elevation_gain_ft * Math.min(1, Math.max(t + jag, (k-1)/N + 0.01));
      segPts.push([x(f0 + (f1 - f0) * t), y(Math.min(climbed, cum + h.elevation_gain_ft))]);
    }
    segments.push({hike:h, color:HIKE_COLORS[i % HIKE_COLORS.length], from:pts[pts.length-1], pts:segPts});
    pts = pts.concat(segPts);
    cum += h.elevation_gain_ft;
  });

  /* fill under the whole mountain */
  const ridge = pts.map(p => p.join(',')).join(' ');
  el += `<polygon points="${x(0)},${y(0)} ${ridge} ${x(1)},${y(0)}" fill="#e7e1d0"/>`;

  /* per-hike colored strokes + under-glow */
  segments.forEach(s => {
    const line = [s.from, ...s.pts];
    el += `<polygon points="${s.from[0]},${y(0)} ${line.map(p=>p.join(',')).join(' ')} ${s.pts[s.pts.length-1][0]},${y(0)}" fill="${s.color}" opacity="0.13"/>`;
    el += `<polyline points="${line.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${s.color}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  });

  /* summit marker */
  const top = pts[pts.length-1];
  el += `<circle cx="${top[0]}" cy="${top[1]}" r="5" fill="var(--accent)"/>`;
  el += `<line x1="${top[0]}" y1="${top[1]}" x2="${top[0]}" y2="${top[1]-26}" stroke="#22251f" stroke-width="1.5"/>`;
  el += `<path d="M ${top[0]} ${top[1]-26} l 16 5 l -16 5 z" fill="var(--accent)"/>`;
  el += `<text x="${top[0]+2}" y="${top[1]-32}" font-size="12" font-weight="600" fill="#22251f">${fmt(inUnit(totalFt))} ${uLabel()}</text>`;

  /* landmarks at true height, right side */
  const lmX = W - padR + 60;
  LANDMARKS.filter(l => l.ft < yMaxFt).forEach(l => {
    const beaten = totalFt >= l.ft;
    const c = beaten ? 'var(--accent)' : '#8a8c82';
    el += `<line x1="${padL}" y1="${y(l.ft)}" x2="${lmX-8}" y2="${y(l.ft)}" stroke="${beaten ? '#e8590c' : '#b9b4a2'}" stroke-width="1" stroke-dasharray="${beaten ? '0' : '4 4'}" opacity="${beaten ? .55 : .8}"/>`;
    el += `<g class="lm"><text x="${lmX}" y="${y(l.ft)+4}" font-size="12" fill="${c}" font-weight="${beaten?600:400}">${beaten ? '✓ ' : ''}${l.name}</text>`;
    el += `<text x="${lmX}" y="${y(l.ft)+18}" font-size="10" fill="#8a8c82">${fmt(inUnit(l.ft))} ${uLabel()}</text></g>`;
  });

  /* baseline */
  el += `<line x1="${padL}" y1="${y(0)}" x2="${W-padR+40}" y2="${y(0)}" stroke="#22251f" stroke-width="2"/>`;

  svg.innerHTML = el;

  /* header numbers */
  document.getElementById('totalNum').textContent = fmt(inUnit(totalFt)) + ' ' + uLabel();
  const altU = unit === 'm' ? 'ft' : 'm';
  const altV = unit === 'm' ? totalFt : totalFt * FT_TO_M;
  document.getElementById('totalAlt').textContent = '= ' + fmt(altV) + ' ' + altU;

  /* beaten line */
  const beaten = LANDMARKS.filter(l => l.ft <= totalFt);
  const next = LANDMARKS.find(l => l.ft > totalFt);
  let msg = '';
  if (beaten.length) {
    const last = beaten[beaten.length-1];
    msg += `The family has now climbed higher than <b>the ${last.name}</b> (${fmt(inUnit(last.ft))} ${uLabel()}). `;
  }
  if (next) {
    const toGo = next.ft - totalFt;
    msg += `Next up: <b>${next.name}</b> — ${fmt(inUnit(toGo))} ${uLabel()} of climbing to go.`;
  }
  document.getElementById('beatenLine').innerHTML = msg;

  /* log */
  document.getElementById('logCount').textContent = hikes.length + (hikes.length === 1 ? ' hike' : ' hikes');
  document.getElementById('logRows').innerHTML = hikes.slice().reverse().map((h) => {
    const i = hikes.indexOf(h);
    const d = new Date(h.date + 'T12:00:00');
    const dateStr = d.toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'});
    const dist = unit === 'm' ? (h.distance_mi * 1.60934).toFixed(1) + ' km' : h.distance_mi + ' mi';
    return `<div class="hike">
      <div class="swatch" style="background:${HIKE_COLORS[i % HIKE_COLORS.length]}"></div>
      <div>
        <div class="name">${h.name}</div>
        <div class="meta">${dateStr} · ${h.location}<br>${dist} · ${h.moving_time} moving · ${h.total_time} total${h.calories ? ' · ' + fmt(h.calories) + ' cal' : ''}</div>
      </div>
      <div class="gain">+${fmt(inUnit(h.elevation_gain_ft))}<small>${unit === 'm' ? 'metres' : 'feet'} up</small></div>
    </div>`;
  }).join('');
}

function niceStep(maxFt){
  const raw = maxFt / 5;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1,2,2.5,5,10]) if (raw <= m * mag) return m * mag;
  return 10 * mag;
}

document.getElementById('unitToggle').addEventListener('click', e => {
  if (!e.target.dataset.u) return;
  unit = e.target.dataset.u;
  document.querySelectorAll('#unitToggle span').forEach(s => s.classList.toggle('on', s.dataset.u === unit));
  draw();
});

fetch('hikes.json').then(r => r.json()).then(d => {
  DATA = d;
  unit = d.units_default || 'm';
  document.querySelectorAll('#unitToggle span').forEach(s => s.classList.toggle('on', s.dataset.u === unit));
  draw();
});
</script>
</body>
</html>
