<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Family Mountain</title>
<meta name="description" content="Every family hike stacked into one growing mountain — cumulative climb over real GPS ridgelines, famous landmarks for scale, and a ski run down the whole range." />
<meta name="theme-color" content="#F2EFE6" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="canonical" href="https://mycoldmars.com/ascent/" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="mycoldmars" />
<meta property="og:title" content="Family Mountain" />
<meta property="og:description" content="Every family hike stacked into one growing mountain — cumulative climb over real GPS ridgelines, with a ski run down the whole range." />
<meta property="og:url" content="https://mycoldmars.com/ascent/" />
<meta property="og:image" content="https://mycoldmars.com/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Family Mountain" />
<meta name="twitter:description" content="Every family hike stacked into one growing mountain, with a ski run down the whole range." />
<meta name="twitter:image" content="https://mycoldmars.com/og.png" />
<link rel="stylesheet" href="src/style.css">
</head>
<body class="theme-clean">
<div class="poster" id="poster">
  <i class="reg tl"></i><i class="reg tr"></i><i class="reg bl"></i><i class="reg br"></i>
  <div class="topbar">
    <div class="title"><span>Family</span> <span>Mountain</span></div>
    <div class="topright">
      <div class="stamp">
        <div class="total"><span id="big-total">—</span> <span class="unit" id="big-unit">FT</span> <span class="tri">▲</span></div>
      </div>
      <div class="controls">
        <div class="toggle" id="mode-toggle">
          <button data-m="height" class="on">Height</button>
          <button data-m="distance">Distance</button>
        </div>
        <div class="toggle" id="unit-toggle">
          <button data-u="ft" class="on">Ft</button>
          <button data-u="m">M</button>
        </div>
        <button class="btn" id="landmarks">Marks</button>
        <button class="btn" id="vibe">Vibe</button>
        <button class="btn" id="play">▶ Play</button>
        <button class="btn" id="ski">▶ Ski</button>
        <button class="btn" id="heads" title="toggle the obstacle heads in the ski game">Heads</button>
        <button class="btn" id="reset">Reset</button>
      </div>
    </div>
  </div>
  <div class="rule"></div>
  <div class="stage">
    <canvas id="mtn"></canvas>
    <canvas id="hov"></canvas>
    <div class="hint" id="hint"></div>
  </div>
  <div class="statbar">
    <div class="st"><span class="lab" id="lab1">Hikes</span><b id="st-1">—</b></div>
    <div class="st"><span class="lab" id="lab2">MI</span><b id="st-2">—</b></div>
    <div class="st"><span class="lab" id="lab3">Season</span><b id="st-3">2026</b></div>
  </div>
  <div class="serial" id="serial">N° 037–401/65</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="data/hikes.js"></script>
<script src="src/landmarks.js"></script>
<script src="src/icons.js"></script>
<script src="src/app.js"></script>
</body>
</html>
