<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lost — mycoldmars</title>

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#d42e05">
  <meta name="description" content="this corner of the workshop doesn't exist (yet).">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --red: #d42e05;
      --ivory: #f5f0e8;
      --ivory-bright: #faf7f2;
      --ivory-faint: rgba(245, 240, 232, 0.18);
      --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    }

    html { background: var(--red); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    body {
      min-height: 100vh;
      font-family: var(--mono);
      color: var(--ivory-bright);
      overflow: hidden;
      position: relative;
    }

    /* film-grain overlay, identical to the front door */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.78' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1000;
      mix-blend-mode: multiply;
    }

    /* ── Corner meta ── */
    .meta {
      position: fixed;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ivory-bright);
      z-index: 5;
    }
    .meta.tl { top: 24px; left: 24px; }
    .meta.tr { top: 24px; right: 24px; }
    .meta.bl { bottom: 24px; left: 24px; }
    .meta.br { bottom: 24px; right: 24px; color: rgba(245,240,232,0.5); }

    /* ── Center stage ── */
    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: clamp(20px, 3.2vw, 36px);
      position: relative;
      z-index: 4;
    }

    /* the globe, knocked off its meridian — drifting, lost */
    .globe-wrap {
      width: clamp(120px, 16vw, 188px);
      height: clamp(120px, 16vw, 188px);
      animation: drift 14s ease-in-out infinite;
    }
    .globe { width: 100%; height: 100%; transform: rotate(-17deg); }
    .globe ellipse, .globe line { stroke: var(--ivory-bright); fill: none; stroke-width: 0.9; }
    .globe path.land { fill: var(--ivory-bright); stroke: none; opacity: 0.92; }

    @keyframes drift {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-14px) rotate(6deg); }
    }

    .code {
      font-size: clamp(13px, 1.4vw, 15px);
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: rgba(245, 240, 232, 0.62);
    }
    .headline {
      font-size: clamp(20px, 3.4vw, 34px);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.25;
      max-width: 18ch;
    }
    .sub {
      font-size: clamp(12px, 1.3vw, 14px);
      letter-spacing: 0.04em;
      color: rgba(245, 240, 232, 0.7);
      max-width: 38ch;
      line-height: 1.6;
    }

    .home {
      margin-top: clamp(4px, 1vw, 10px);
      display: inline-flex;
      align-items: center;
      gap: 0.6em;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ivory-bright);
      text-decoration: none;
      padding: 12px 22px;
      border: 1.5px solid var(--ivory-bright);
      border-radius: 999px;
      transition: background 0.25s ease, color 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .home:hover,
    .home:focus-visible {
      background: var(--ivory-bright);
      color: var(--red);
      transform: scale(1.04);
    }
    .home:focus-visible { outline: 2px solid var(--ivory-bright); outline-offset: 5px; }
    .home:focus { outline: none; }

    @media (prefers-reduced-motion: reduce) {
      .globe-wrap { animation: none; }
      .home { transition: none; }
    }
  </style>
</head>
<body>
  <div class="meta tl">mycoldmars</div>
  <div class="meta tr">404</div>
  <div class="meta bl">2026</div>
  <div class="meta br">↗</div>

  <main>
    <!-- the wireframe globe, drifting off its axis -->
    <div class="globe-wrap" aria-hidden="true">
      <svg class="globe" viewBox="0 0 100 100">
        <ellipse cx="50" cy="50" rx="48" ry="48"/>
        <ellipse cx="50" cy="50" rx="22" ry="48"/>
        <line x1="2" y1="50" x2="98" y2="50"/>
        <path class="land" d="M14 28 C18 22, 28 20, 36 22 C40 24, 44 27, 44 31 C44 35, 40 39, 34 41 C28 42, 22 40, 18 36 C15 32, 14 30, 14 28Z"/>
        <path class="land" d="M28 54 C32 52, 38 53, 40 57 C42 62, 41 70, 38 75 C35 78, 32 76, 30 71 C28 64, 27 58, 28 54Z"/>
        <path class="land" d="M52 24 C56 22, 60 24, 60 28 C60 32, 56 33, 53 31 C51 29, 51 26, 52 24Z"/>
        <path class="land" d="M55 38 C60 36, 66 39, 68 44 C70 50, 68 58, 64 62 C60 65, 56 62, 55 56 C54 50, 54 42, 55 38Z"/>
        <path class="land" d="M68 22 C73 20, 80 22, 82 26 C84 30, 80 34, 75 34 C70 33, 67 28, 68 22Z"/>
        <path class="land" d="M76 60 C80 58, 84 60, 84 64 C84 68, 80 70, 76 68 C73 66, 73 62, 76 60Z"/>
      </svg>
    </div>

    <div class="code">error 404</div>
    <h1 class="headline">you've wandered off the map.</h1>
    <p class="sub">this corner of the workshop doesn't exist — or doesn't exist yet. the globe kept spinning without you.</p>
    <a class="home" href="/">← back to the workshop</a>
  </main>
</body>
</html>
