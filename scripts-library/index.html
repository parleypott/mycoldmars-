<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Newpress Scripts</title>
  <link rel="icon" type="image/svg+xml" href="/newpress-favicon.svg" />
  <meta name="description" content="Newpress Scripts — the script library for The Human Element." />
  <meta name="robots" content="noindex" />
  <!-- Offline app-shell: manifest + theme so /scripts-library/ installs and opens with no internet (plane mode). -->
  <link rel="manifest" href="/scripts-library/manifest.json" />
  <meta name="theme-color" content="#1f1d18" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800&display=swap" rel="stylesheet" />
  <!-- Shared Cartridges engine styles (cream paper, mono chrome, flat) -->
  <link rel="stylesheet" href="../burma-script/src/styles.css" />
  <!-- Shared design doctrine — so Palau (and every) doc renders STYLED inside the Library too. -->
  <link rel="stylesheet" href="../burma-script/src/doctrine.css" />
  <!-- Library-specific chrome -->
  <link rel="stylesheet" href="./src/library.css" />
</head>
<body>
  <!-- Hidden until the auth gate resolves (gate.js reveals it on sign-in, or
       immediately when auth is unconfigured / already signed in). -->
  <div id="app" class="sl-hidden"></div>
  <script type="module" src="./src/boot.jsx"></script>
</body>
</html>
