<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>WP-01 · BURMA — THE HUMAN ELEMENT</title>
<style>
:root{
  /* ---- PAGE (Tufte) ---- */
  --paper:#f3ecdd;            /* warm paper */
  --paper-edge:#ece3d0;       /* page edge / sunk wells */
  --ink:#231d15;             /* near-black warm ink */
  --ink-soft:#4a4234;
  --faint:#8a8069;
  --line:#d8ccb3;
  --rule:#c8bb9d;

  /* ---- INSTRUMENT (Teenage Engineering / Braun chrome) ---- */
  --instr:#1a1813;           /* chrome body */
  --instr-2:#12100b;         /* deepest bay */
  --instr-3:#23201a;         /* raised key */
  --instr-edge:#322d22;      /* engraved edge highlight */
  --instr-ink:#ece2cf;
  --instr-dim:#8f8771;
  --instr-faint:#5d5747;

  /* ---- ACCENT: one safety orange, controls only ---- */
  --accent:#ff5a1f;
  --accent-deep:#d8430f;
  --accent2:#2f6f6a;         /* cool, visual cues only */

  /* ---- genre instrument labels ---- */
  --g-history:#a47cff; --g-ground:#e8743b; --g-inquiry:#3f86c4;
  --g-latm:#d9a441; --g-coldopen:#c0563f; --g-other:#9a9080;

  --done:#5f8a4e; --done-bg:#e9f0df; --done-edge:#bcd1ab;

  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --mono:"SF Mono","JetBrains Mono","Roboto Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--instr-2);color:var(--ink);
  font-family:var(--serif);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.09em}
::selection{background:rgba(255,90,31,.16)}

/* ======================================================================
   THE INSTRUMENT — top telemetry bar
   ====================================================================== */
#bar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#1f1c16,#14120d);
  color:var(--instr-ink);border-bottom:1px solid #000;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 6px 18px rgba(0,0,0,.45);
  display:flex;align-items:stretch;gap:0;height:54px;padding:0 4px 0 0}

/* MODEL plate — the nameplate, left */
.plate{display:flex;flex-direction:column;justify-content:center;gap:2px;
  padding:0 18px 0 18px;border-right:1px solid #000;position:relative}
.plate:after{content:"";position:absolute;right:0;top:6px;bottom:6px;width:1px;background:var(--instr-edge)}
.plate .fig{font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;color:var(--instr-faint)}
.plate .name{font-family:var(--mono);font-weight:700;letter-spacing:.16em;font-size:14px;line-height:1;color:var(--instr-ink)}
.plate .name b{color:var(--accent);font-weight:700}
.plate .sub{font-family:var(--mono);font-size:8px;letter-spacing:.18em;color:var(--instr-dim);margin-top:1px}

/* telemetry readouts — grouped sunken gauges */
.telem{display:flex;align-items:center;gap:0;margin-left:6px;height:100%;overflow:hidden}
.gauge{display:flex;flex-direction:column;justify-content:center;gap:3px;
  padding:0 15px;height:100%;border-right:1px solid #000;position:relative;min-width:64px}
.gauge:after{content:"";position:absolute;right:0;top:8px;bottom:8px;width:1px;background:var(--instr-edge)}
.gauge .k{font-family:var(--mono);font-size:7.5px;letter-spacing:.18em;color:var(--instr-faint)}
.gauge .v{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:.02em;color:var(--instr-ink);
  line-height:1;font-variant-numeric:tabular-nums}
.gauge .v small{font-size:9px;color:var(--instr-dim);font-weight:400;margin-left:1px}

/* MODE — a lit segment readout, right of telem */
.gauge.mode .v{color:var(--accent)}
.gauge.live .dotrow{display:flex;gap:3px;align-items:center;margin-top:1px}
.gauge.live .led{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.spacer{flex:1}

/* progress meter — a real horizontal gauge on the far right */
.meter{display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 16px;min-width:148px}
.meter .top{display:flex;justify-content:space-between;align-items:baseline}
.meter .k{font-family:var(--mono);font-size:7.5px;letter-spacing:.18em;color:var(--instr-faint)}
.meter .pct{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.meter .track{height:6px;border-radius:3px;background:#0a0906;border:1px solid #000;
  box-shadow:0 1px 1px rgba(0,0,0,.6) inset;overflow:hidden;position:relative}
.meter .fill{height:100%;background:linear-gradient(90deg,var(--accent-deep),var(--accent));
  box-shadow:0 0 8px rgba(255,90,31,.5);transition:width .4s ease;width:0}

/* ======================================================================
   FUNCTION-KEY BAY — tactile labelled keys + export cartridge rack
   ====================================================================== */
.fnbay{position:sticky;top:54px;z-index:29;background:linear-gradient(180deg,#0e0c08,#08070400);
  background-color:#0e0c08;border-bottom:1px solid #000;
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 4px 14px rgba(0,0,0,.4);
  display:flex;align-items:center;gap:9px;padding:8px 16px}
.baylabel{font-family:var(--mono);font-size:7.5px;letter-spacing:.2em;color:var(--instr-faint);
  writing-mode:vertical-rl;transform:rotate(180deg);line-height:1;padding-right:2px}
.fk{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;
  font-family:var(--mono);background:linear-gradient(180deg,#2b2720,#1c1913);
  border:1px solid #000;border-top:1px solid #3a352a;border-radius:6px;padding:6px 11px 6px 10px;
  box-shadow:0 2px 0 #000,0 3px 5px rgba(0,0,0,.4);user-select:none;
  transition:transform .07s ease, box-shadow .07s ease, border-color .12s}
.fk .kn{font-size:7px;letter-spacing:.14em;color:var(--instr-faint)}
.fk .lb{font-size:10.5px;letter-spacing:.07em;color:var(--instr-ink)}
.fk:hover{border-top-color:var(--accent)}
.fk:hover .kn{color:var(--accent)}
.fk:active,.fk.on{transform:translateY(2px);box-shadow:0 0 0 #000,0 1px 3px rgba(0,0,0,.5)}
.fk.on{background:linear-gradient(180deg,#3a1d0f,#23120a);border-top-color:var(--accent)}
.fk.on .lb,.fk.on .kn{color:var(--accent)}

.rackgap{flex:1}
/* export cartridge rack */
.rack{display:flex;align-items:stretch;gap:0;border:1px solid #000;border-radius:7px;overflow:hidden;
  background:#08070400;box-shadow:0 2px 0 #000,0 3px 6px rgba(0,0,0,.4)}
.rack .rlbl{display:flex;align-items:center;font-family:var(--mono);font-size:7.5px;letter-spacing:.16em;
  color:var(--instr-faint);padding:0 10px;background:#0a0906;border-right:1px solid #000}
.cart{display:flex;align-items:center;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  color:var(--instr-ink);padding:7px 13px;background:linear-gradient(180deg,#2b2720,#1c1913);
  border-right:1px solid #000;transition:background .12s,color .12s}
.cart:last-child{border-right:0}
.cart:hover{color:var(--accent);background:linear-gradient(180deg,#241208,#170b06)}
.cart:before{content:"";width:6px;height:14px;border-radius:2px;background:#0a0906;border:1px solid #3a352a;margin-right:7px}
.cart:hover:before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 6px rgba(255,90,31,.6)}

/* ======================================================================
   WORKSPACE — outline rail | page | margin hub
   ====================================================================== */
#work{display:grid;grid-template-columns:248px 1fr;min-height:calc(100vh - 90px);background:var(--paper)}
#work.focus{grid-template-columns:0 1fr}

/* OUTLINE — instrument-side panel, calm, grouped by genre */
#outline{background:linear-gradient(180deg,#19170f,#15130d);color:var(--instr-ink);
  border-right:1px solid #000;box-shadow:8px 0 18px rgba(0,0,0,.18);
  overflow:auto;position:sticky;top:90px;height:calc(100vh - 90px);padding:16px 12px 40px}
#work.focus #outline{display:none}
#outline .ohead{font-family:var(--mono);font-size:8px;letter-spacing:.2em;color:var(--instr-faint);
  margin:0 0 4px;display:flex;justify-content:space-between;align-items:center}
#outline .osub{font-family:var(--mono);font-size:7.5px;letter-spacing:.14em;color:var(--instr-faint);
  margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid #2a261d;line-height:1.6;color:#6a6450}
.oitem{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;
  font-family:var(--serif);font-size:13px;line-height:1.25;color:var(--instr-ink);
  border:1px solid transparent;transition:background .12s,border-color .12s}
.oitem:hover{background:#22201a;border-color:#2f2b22}
.oitem.active{background:#241208;border-color:var(--accent)}
.oitem.chapter{margin-top:14px;font-weight:600}
.oitem .num{font-family:var(--mono);font-size:8px;color:var(--instr-faint);flex:0 0 auto;width:14px;text-align:right}
.otag{font-family:var(--mono);font-size:7px;letter-spacing:.1em;padding:2px 5px;border-radius:3px;
  color:#0c0a07;font-weight:700;flex:0 0 auto}
.oitem.scene{padding-left:30px;font-size:11.5px;color:var(--instr-dim);font-style:italic}
.oitem.scene:before{content:"";width:9px;height:1px;background:var(--instr-faint);margin-right:-2px}

/* ======================================================================
   THE PAGE — Tufte: measure, rhythm, serif hierarchy
   ====================================================================== */
#pagewrap{display:grid;grid-template-columns:minmax(0,640px) 286px;gap:54px;justify-content:center;
  padding:58px 40px 200px}
@media(max-width:1180px){#pagewrap{grid-template-columns:minmax(0,640px);gap:0}#margin{display:none}}
#page{max-width:640px;font-size:19px}

/* document frontispiece — fig.01 style title block on the page */
.frontis{margin:0 0 54px;padding-bottom:26px;border-bottom:1px solid var(--rule)}
.frontis .fig{font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--faint);margin-bottom:14px}
.frontis h1{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.08;letter-spacing:-.01em;
  margin:0 0 10px;color:var(--ink)}
.frontis .deck{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink-soft);
  line-height:1.5;max-width:54ch;margin:0 0 22px}
.seqtable{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line);margin-top:4px}
.seqrow{display:grid;grid-template-columns:54px 1fr;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);
  align-items:baseline}
.seqrow .d{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--accent);font-weight:600}
.seqrow .n{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--faint);line-height:1.4}

/* blocks */
.block{margin:0 0 18px;position:relative}

/* CHAPTER — the strong page-hierarchy beat */
.chapter{margin:64px 0 28px;padding-top:0}
.chapter:first-of-type{margin-top:20px}
.chapter .crow{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.chapter .rule{flex:1;height:1px;background:var(--rule)}
.chapter .ctag{font-family:var(--mono);font-size:9px;letter-spacing:.14em;font-weight:700;
  color:#0c0a07;padding:3px 8px;border-radius:4px;flex:0 0 auto}
.chapter .cnum{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--faint);flex:0 0 auto}
.chapter h2{font-family:var(--serif);font-weight:600;font-size:25px;line-height:1.18;letter-spacing:-.005em;
  margin:0;color:var(--ink);max-width:30ch}

/* SCENE — quieter sub-beat */
.scene{margin:40px 0 16px}
.scene h3{font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.14em;
  color:var(--ink);margin:0;display:flex;align-items:center;gap:9px}
.scene h3 .sq{width:6px;height:6px;background:var(--accent);border-radius:1px;flex:0 0 auto}
.scene h3 .line{flex:1;height:1px;background:var(--line)}

/* VO / ON-CAM prose — the actual script, sober ink */
.vo,.oncam{display:flex;gap:16px;align-items:flex-start;margin:0 0 22px}
.vo .body,.oncam .body{flex:1;line-height:1.62;color:var(--ink)}
.vo .body{font-size:19px}
.kicker{font-family:var(--mono);font-size:8px;letter-spacing:.16em;color:var(--faint);
  display:block;margin-bottom:6px}
.oncam .body{font-size:20px;font-style:italic;color:var(--ink);
  border-left:2px solid var(--rule);padding-left:18px}
.oncam .kicker{color:var(--accent2)}

/* 3-state VO hardware switch — a real toggle */
.vostate{flex:0 0 auto;width:34px;height:62px;border-radius:8px;cursor:pointer;overflow:hidden;
  margin-top:4px;background:linear-gradient(180deg,#1f1c16,#14120d);border:1px solid #000;
  box-shadow:0 2px 4px rgba(0,0,0,.3),0 1px 0 rgba(255,255,255,.05) inset;
  display:flex;flex-direction:column;position:relative}
.vostate i{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--mono);
  font-size:6.5px;letter-spacing:.06em;color:var(--instr-faint);border-bottom:1px solid #000;
  position:relative;transition:color .15s,background .15s}
.vostate i:last-child{border-bottom:0}
.vostate i.lit{color:#0c0a07;font-weight:700}
.vostate[data-s="todo"] i[data-k="todo"]{background:#3a352a;color:var(--instr-ink)}
.vostate[data-s="recorded"] i[data-k="rec"]{background:var(--accent);box-shadow:0 0 8px rgba(255,90,31,.5) inset}
.vostate[data-s="in-edit"] i[data-k="ed"]{background:var(--accent2);color:#eaf3f1}

/* SOT / B-ROLL — instrument footage rows */
.sot,.broll{display:flex;align-items:flex-start;gap:12px;margin:0 0 12px;
  border:1px solid var(--line);border-radius:9px;padding:12px 13px;
  background:linear-gradient(180deg,#fbf6ec,#f5eedd);
  box-shadow:0 1px 2px rgba(60,50,30,.05);transition:background .25s,border-color .25s,box-shadow .25s}
.sot.done,.broll.done{background:var(--done-bg);border-color:var(--done-edge)}
.dchk{flex:0 0 auto;width:22px;height:22px;border:1.5px solid var(--line);border-radius:6px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:transparent;font-size:14px;margin-top:1px;
  background:#fff;transition:background .15s,border-color .15s;box-shadow:0 1px 2px rgba(0,0,0,.04) inset}
.dchk:hover{border-color:var(--done)}
.done .dchk{background:var(--done);border-color:var(--done);color:#fff}
.tcwrap{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;align-items:flex-start;width:96px}
.daychip{font-family:var(--mono);font-size:8px;letter-spacing:.1em;font-weight:700;
  background:var(--ink);color:var(--paper);padding:3px 7px;border-radius:4px}
.broll .daychip{background:var(--accent2)}
.tc{font-family:var(--mono);font-size:12px;color:var(--ink);font-weight:600;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.copy{font-family:var(--mono);font-size:8px;letter-spacing:.08em;cursor:pointer;
  border:1px solid var(--line);background:#fff;border-radius:5px;padding:4px 8px;color:var(--faint);
  display:inline-flex;align-items:center;gap:4px;transition:all .12s;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.copy:before{content:"";width:5px;height:5px;border-radius:1px;background:var(--line)}
.copy:hover{border-color:var(--accent);color:var(--accent-deep)}
.copy:hover:before{background:var(--accent)}
.copy:active{transform:translateY(1px);box-shadow:none}
.copy.hit{background:var(--accent);color:#fff;border-color:var(--accent)}
.copy.hit:before{background:#fff}
.sot .txt,.broll .txt{flex:1;color:var(--ink-soft);line-height:1.5;font-size:14.5px}
.spk{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--accent-deep);
  font-weight:700;margin-right:7px}
.typetag{font-family:var(--mono);font-size:7px;letter-spacing:.12em;color:var(--faint);
  align-self:flex-start;margin-top:3px;writing-mode:vertical-rl;transform:rotate(180deg)}

/* service boxes — map / archive worklists */
.svc{border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:8px;
  padding:12px 14px;background:#eee7d8;font-size:14px;color:var(--ink-soft);line-height:1.55;margin:0 0 14px}
.svc .lbl{font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:var(--accent2);
  font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:7px}
.svc .lbl:before{content:"";width:6px;height:6px;background:var(--accent2);border-radius:1px}

/* notes */
.note{border:1px solid #e3b98f;border-left:3px solid var(--accent);border-radius:8px;
  padding:12px 14px;background:#fbf1e6;font-size:14.5px;color:var(--ink-soft);line-height:1.55;
  display:flex;gap:11px;margin:0 0 14px}
.note.done{opacity:.55}
.note .lbl{font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:var(--accent-deep);font-weight:700}
.jhnote{font-style:italic;color:var(--ink-soft);font-size:15.5px;line-height:1.55;
  border-left:2px solid var(--accent);padding:2px 0 2px 16px;margin:0 0 18px}
.jhnote:before{content:"JH ";font-family:var(--mono);font-style:normal;font-size:8px;
  letter-spacing:.14em;color:var(--accent-deep);font-weight:700;vertical-align:1px}
.bin{font-size:13px;color:var(--faint);border:1px dashed var(--line);border-radius:7px;
  padding:9px 12px;background:var(--paper-edge);line-height:1.5;margin:0 0 12px}
.bin .lbl{font-family:var(--mono);font-size:7px;letter-spacing:.14em;color:#b3a890;
  display:block;margin-bottom:3px}

/* inline spans — restrained, footnote-marker style not highlighter soup */
.span{cursor:pointer;position:relative;white-space:nowrap}
.span.tk{color:var(--accent-deep);border-bottom:1px solid rgba(216,67,15,.4);font-weight:500}
.span.visual{color:var(--accent2);border-bottom:1px solid rgba(47,111,106,.35);font-style:italic}
.span:hover{background:rgba(255,90,31,.08);border-radius:2px}
.span.visual:hover{background:rgba(47,111,106,.08)}
.span .mk{font-family:var(--mono);font-size:8px;vertical-align:.5em;letter-spacing:0;margin-left:1px;opacity:.7}

/* ======================================================================
   THE MARGIN HUB — Tufte sidenote that grows a local control surface
   ====================================================================== */
#margin{position:relative}
.hub{position:sticky;top:120px}
.hint{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--faint);
  line-height:1.9;text-align:left;padding:18px 2px;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line)}
.hint b{color:var(--accent-deep)}
.hubcard{border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,#fbf6ec,#f4ecda);
  padding:16px;font-size:14px;box-shadow:0 10px 30px rgba(40,30,15,.1),0 1px 0 rgba(255,255,255,.6) inset}
.hubcard .htop{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.hubcard .hl{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--accent-deep);font-weight:700}
.hubcard .x{cursor:pointer;color:var(--faint);font-family:var(--mono);font-size:8px;letter-spacing:.08em}
.hubcard .x:hover{color:var(--accent-deep)}
.hubcard .raw{font-family:var(--serif);font-size:14px;color:var(--ink-soft);background:var(--paper-edge);
  border-radius:7px;padding:10px 11px;margin-bottom:12px;line-height:1.5;border-left:2px solid var(--accent)}
.hubcard textarea{width:100%;min-height:78px;border:1px solid var(--line);border-radius:7px;padding:9px;
  font-family:var(--serif);font-size:14px;resize:vertical;background:#fff;color:var(--ink);line-height:1.5}
.hubcard textarea:focus{outline:none;border-color:var(--accent)}
.hubcard .opts{font-size:12px;color:var(--faint);margin-top:10px;line-height:1.55;font-style:italic}
</style>
</head>
<body>
<header id="bar">
  <div class="plate">
    <span class="fig">fig.01</span>
    <span class="name">MODEL <b>WP-01</b></span>
    <span class="sub">BURMA SCRIPT TERMINAL</span>
  </div>
  <div class="telem">
    <div class="gauge"><span class="k">BLOCKS</span><span class="v" id="t-blocks">0</span></div>
    <div class="gauge"><span class="k">WORDS</span><span class="v" id="t-words">0</span></div>
    <div class="gauge"><span class="k">RUNTIME</span><span class="v" id="t-read">0:00</span></div>
    <div class="gauge"><span class="k">SOURCE TC</span><span class="v" id="t-sots">0</span></div>
    <div class="gauge live"><span class="k">AUTOSAVE</span><span class="v" id="t-saved">—</span></div>
    <div class="gauge mode"><span class="k">MODE</span><span class="v" id="t-mode">PRECISE</span></div>
  </div>
  <div class="spacer"></div>
  <div class="meter">
    <div class="top"><span class="k">EDIT PROGRESS</span><span class="pct" id="t-done">0%</span></div>
    <div class="track"><div class="fill" id="t-fill"></div></div>
  </div>
</header>

<nav class="fnbay">
  <span class="baylabel">FN BAY</span>
  <span class="fk" id="fk-outline"><span class="kn">F2</span><span class="lb">OUTLINE</span></span>
  <span class="fk" id="fk-focus"><span class="kn">F5</span><span class="lb">FOCUS</span></span>
  <span class="fk" id="fk-history"><span class="kn">F3</span><span class="lb">VERSIONS</span></span>
  <span class="fk" id="fk-comment"><span class="kn">F4</span><span class="lb">COMMENT</span></span>
  <span class="fk" id="fk-reset"><span class="kn">ESC</span><span class="lb">RESET TICKS</span></span>
  <span class="rackgap"></span>
  <div class="rack">
    <span class="rlbl">EXPORT</span>
    <span class="cart" data-export="PDF">PDF</span>
    <span class="cart" data-export="DOCX">DOCX</span>
    <span class="cart" data-export="MD">MD</span>
    <span class="cart" data-export="WORKLISTS">WORKLISTS</span>
  </div>
</nav>

<div id="work">
  <aside id="outline">
    <div class="ohead"><span>DOCUMENT MAP</span><span id="o-count"></span></div>
    <div class="osub">THE PING-PONG · HISTORY ⇄ GROUND ⇄ INQUIRY</div>
    <div id="olist"></div>
  </aside>
  <div id="pagewrap">
    <div id="page"></div>
    <div id="margin"><div class="hub" id="hub"></div></div>
  </div>
</div>

<script src="blocks-data.js"></script>
<script>
const BLOCKS = (window.__BLOCKS__)||[];
const SEQS = [
  {day:1,name:"260331 · DAY 1 — MULTICAM STRINGOUT"},
  {day:2,name:"260401 · DAY 2 — SYNCED STRINGOUT"},
  {day:3,name:"260402 · DAY 3 — ALL FOOTAGE · Syncaila synced"}
];
const GENRE = {history:"--g-history",ground:"--g-ground",inquiry:"--g-inquiry",latm:"--g-latm",coldopen:"--g-coldopen",other:"--g-other"};
const GLABEL = {history:"HISTORY",ground:"GROUND",inquiry:"INQUIRY",latm:"LATM",coldopen:"COLD OPEN",other:"NOTE"};
const KEY="wp01_burma_state";
let state = JSON.parse(localStorage.getItem(KEY)||"{}");
state.done=state.done||{}; state.vo=state.vo||{}; state.hub=state.hub||{};
function gvar(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function save(){localStorage.setItem(KEY,JSON.stringify(state));flashSaved();telem()}
let st0=Date.now();
function flashSaved(){document.getElementById("t-saved").textContent="0s";st0=Date.now()}
setInterval(()=>{const s=Math.round((Date.now()-st0)/1000);const el=document.getElementById("t-saved");if(el)el.textContent=(s>99?"99+":s)+"s"},1000);

function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}

// clean script artifacts (escaped brackets etc) for display, keep spans aligned by NOT mutating length
function renderProse(b){
  let t=b.text||""; const spans=(b.spans||[]).slice().sort((a,b)=>a.start-b.start);
  if(!spans.length) return esc(t);
  let out="",i=0,n=0;
  for(const s of spans){ if(s.start<i) continue;
    out+=esc(t.slice(i,s.start));
    n++;
    out+=`<span class="span ${s.kind}" data-span="${s.id}" data-block="${b.id}">${esc(t.slice(s.start,s.end))}<sup class="mk">${n}</sup></span>`;
    i=s.end;
  }
  out+=esc(t.slice(i)); return out;
}
function copyChunk(tc,el){navigator.clipboard&&navigator.clipboard.writeText(tc);el.classList.add("hit");el.innerHTML="COPIED";setTimeout(()=>{el.classList.remove("hit");el.innerHTML="COPY "+(tc||'').slice(0,8)},900)}

function render(){
  const page=document.getElementById("page");
  let html=`<div class="frontis">
    <div class="fig">fig.01 · WORKING SCRIPT · THE HUMAN ELEMENT · S01</div>
    <h1>Burma</h1>
    <div class="deck">A country ripping itself apart, and what it feels like to live inside the tear. The ping-pong: history against ground against inquiry, until the place becomes legible.</div>
    <div class="seqtable">
      ${SEQS.map(s=>`<div class="seqrow"><span class="d">DAY ${s.day}</span><span class="n">${esc(s.name)}</span></div>`).join("")}
    </div>
  </div>`;
  let chapN=0;
  for(const b of BLOCKS){
    const id=b.id;
    if(b.type==="chapter"){chapN++;const c=gvar(GENRE[b.genre]||"--g-other");
      html+=`<div class="block chapter" id="b_${id}"><div class="crow"><span class="ctag" style="background:${c}">${GLABEL[b.genre]||"NOTE"}</span><span class="cnum">CH ${String(chapN).padStart(2,'0')}</span><span class="rule"></span></div><h2>${esc(cleanTitle(b.title))}</h2></div>`;}
    else if(b.type==="scene"){html+=`<div class="block scene" id="b_${id}"><h3><span class="sq"></span>${esc(cleanTitle(b.title))}<span class="line"></span></h3></div>`;}
    else if(b.type==="vo"||b.type==="oncam"){const stt=state.vo[id]||b.voStatus||"todo";
      html+=`<div class="block ${b.type}" id="b_${id}"><div class="vostate" data-s="${stt}" data-id="${id}" title="VO status: ${stt}"><i data-k="todo" class="${stt==='todo'?'lit':''}">TODO</i><i data-k="rec" class="${stt==='recorded'?'lit':''}">REC</i><i data-k="ed" class="${stt==='in-edit'?'lit':''}">EDIT</i></div><div class="body"><span class="kicker">${b.type==='oncam'?'ON CAM':'VOICEOVER'}</span>${renderProse(b)}</div></div>`;}
    else if(b.type==="sot"||b.type==="broll"){const d=state.done[id]!==undefined?state.done[id]:b.done;const tc=b.timecode||{};
      const tcDisp=tc.tc?(tc.tcOut?tc.tc+" → "+tc.tcOut:tc.tc):"—:—:—:—";
      html+=`<div class="block ${b.type} ${d?'done':''}" id="b_${id}"><div class="dchk" data-done="${id}" title="mark cut">✓</div><div class="tcwrap"><span class="daychip">DAY ${tc.day||'?'}</span><span class="tc">${esc(tcDisp)}</span>${tc.tc?`<button class="copy" data-tc="${esc(tc.tc)}">COPY ${esc(tc.tc.slice(0,8))}</button>`:''}</div><div class="txt">${b.speaker?`<span class="spk">${esc(b.speaker.toUpperCase())}</span>`:''}${esc(stripLead(b.text))}</div><span class="typetag">${b.type==='broll'?'B-ROLL':'SOT'}</span></div>`;}
    else if(b.type==="map-need"||b.type==="archive-req"){
      html+=`<div class="block svc" id="b_${id}"><span class="lbl">${b.type==='map-need'?'MAPPING NEEDS → MAP DEPT':'ARCHIVE REQUEST → ARCHIVIST'}</span>${esc(stripLead(b.text).slice(0,420))}</div>`;}
    else if(b.type==="note"){const d=state.done[id];
      html+=`<div class="block note ${d?'done':''}" id="b_${id}"><div class="dchk" data-done="${id}" title="resolve note">✓</div><div><span class="lbl">NOTE TO EDITOR</span><br/>${esc(stripLead(b.text).slice(0,320))}</div></div>`;}
    else if(b.type==="jh-note"){html+=`<div class="block jhnote" id="b_${id}">${esc(stripLead(b.text).slice(0,420))}</div>`;}
    else {html+=`<div class="block bin" id="b_${id}"><span class="lbl">HOLDING BIN</span>${esc(stripLead(b.text).slice(0,200))}</div>`;}
  }
  page.innerHTML=html;
  buildOutline(); telem(); wire();
}
function cleanTitle(t){return (t||"").replace(/^(CH:|SCENE:)\s*/i,'').replace(/^(COLD OPEN FROM JH:|LOOK AT THIS MAP ON CAM MONOLOGUE:)/i,m=>m).replace(/\\([\[\]])/g,'$1').replace(/\s+/g,' ').trim().slice(0,120)}
function stripLead(t){return (t||"").replace(/^(VO:|SOT:|ON ?CAM:|\\?\[|MAP\]\s*)/i,'').replace(/\\([\[\]!])/g,'$1').replace(/\s+/g,' ').trim()}

function buildOutline(){
  const ol=document.getElementById("olist"); let o="",chapN=0;
  for(const b of BLOCKS){ if(b.type!=="chapter"&&b.type!=="scene")continue;
    if(b.type==="chapter"){chapN++;const c=gvar(GENRE[b.genre]||"--g-other");
      o+=`<div class="oitem chapter" data-go="b_${b.id}"><span class="num">${String(chapN).padStart(2,'0')}</span><span class="otag" style="background:${c}">${(GLABEL[b.genre]||'·').slice(0,4)}</span><span>${esc(cleanTitle(b.title).slice(0,30))}</span></div>`;}
    else o+=`<div class="oitem scene" data-go="b_${b.id}">${esc(cleanTitle(b.title).slice(0,32))}</div>`;
  }
  ol.innerHTML=o;
  document.getElementById("o-count").textContent=chapN+" CH";
}

function telem(){
  document.getElementById("t-blocks").textContent=BLOCKS.length;
  const words=BLOCKS.filter(b=>b.type==='vo'||b.type==='oncam').reduce((n,b)=>n+(b.text||'').split(/\s+/).filter(Boolean).length,0);
  document.getElementById("t-words").innerHTML=words>999?(words/1000).toFixed(1)+'<small>K</small>':words;
  const m=Math.floor(words/150);document.getElementById("t-read").textContent=m+":"+String(Math.round((words/150-m)*60)).padStart(2,'0');
  document.getElementById("t-sots").textContent=BLOCKS.filter(b=>b.type==='sot'||b.type==='broll').length;
  const checkable=BLOCKS.filter(b=>b.type==='sot'||b.type==='broll'||b.type==='note').length;
  const done=BLOCKS.filter(b=>(b.type==='sot'||b.type==='broll'||b.type==='note')&&(state.done[b.id]!==undefined?state.done[b.id]:b.done)).length;
  const pct=Math.round(done/Math.max(1,checkable)*100);
  document.getElementById("t-done").textContent=pct+"%";
  document.getElementById("t-fill").style.width=pct+"%";
}

function openHub(spanId,blockId){
  const b=BLOCKS.find(x=>x.id===blockId); const s=(b.spans||[]).find(x=>x.id===spanId); if(!s)return;
  const isTk=s.kind==="tk"; const saved=state.hub[spanId]||"";
  document.getElementById("hub").innerHTML=`<div class="hubcard">
    <div class="htop"><span class="hl">${isTk?'{TK} · RESEARCH + WRITE':'[VISUAL] · DIRECTION'}</span><span class="x" data-closehub>ESC ✕</span></div>
    <div class="raw">${esc(s.raw)}</div>
    ${isTk?`<textarea data-hubin="${spanId}" placeholder="workshop the line here…">${esc(saved)}</textarea>
    <div class="opts">Coming: click → fresh research on this passage, 3–5 lines in your voice with sources, pick or chat to refine, then INSERT — formatting kept.</div>`:`<div class="opts">Visual direction note. Soon: drag a B-roll cue here to pair it A/V with the line.</div>`}
  </div>`;
  const ta=document.querySelector('[data-hubin]'); if(ta)ta.addEventListener('input',e=>{state.hub[spanId]=e.target.value;save()});
  document.querySelectorAll('.span').forEach(el=>el.classList.toggle('active',el.getAttribute('data-span')===spanId));
}
function closeHub(){document.getElementById('hub').innerHTML='<div class="hint">SELECT A <b>{TK}</b> OR <b>[VISUAL]</b> SPAN IN THE PROSE.<br/>ITS LOCAL HUB OPENS HERE IN THE MARGIN.</div>';}

function wire(){
  document.querySelectorAll('[data-done]').forEach(el=>el.onclick=()=>{const id=el.getAttribute('data-done');state.done[id]=!state.done[id];document.getElementById('b_'+id).classList.toggle('done',state.done[id]);save()});
  document.querySelectorAll('.copy').forEach(el=>el.onclick=()=>copyChunk(el.getAttribute('data-tc'),el));
  document.querySelectorAll('.vostate').forEach(el=>el.onclick=()=>{const id=el.getAttribute('data-id');const order=['todo','recorded','in-edit'];const cur=state.vo[id]||'todo';const nx=order[(order.indexOf(cur)+1)%3];state.vo[id]=nx;el.setAttribute('data-s',nx);el.querySelectorAll('i').forEach(i=>i.classList.remove('lit'));const km={'todo':'todo','recorded':'rec','in-edit':'ed'};const t=el.querySelector('[data-k='+km[nx]+']');if(t)t.classList.add('lit');el.title='VO status: '+nx;save()});
  document.querySelectorAll('.span').forEach(el=>el.onclick=()=>openHub(el.getAttribute('data-span'),el.getAttribute('data-block')));
  document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{document.getElementById(el.getAttribute('data-go')).scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('.oitem').forEach(o=>o.classList.remove('active'));el.classList.add('active')});
}
document.addEventListener('click',e=>{if(e.target.hasAttribute&&e.target.hasAttribute('data-closehub'))closeHub()});

document.getElementById('fk-outline').onclick=function(){this.classList.toggle('on');document.getElementById('outline').style.display=this.classList.contains('on')?'none':''};
document.getElementById('fk-focus').onclick=function(){this.classList.toggle('on');document.getElementById('work').classList.toggle('focus');document.getElementById('t-mode').textContent=this.classList.contains('on')?'FOCUS':'PRECISE'};
document.getElementById('fk-comment').onclick=()=>alert('Inline editor comments thread onto any block — wires up with the Supabase table.');
document.getElementById('fk-history').onclick=()=>alert('Version history (every save = a restore point) wires up when the Supabase table is live. Local autosave is already protecting your ticks.');
document.getElementById('fk-reset').onclick=()=>{if(confirm('Clear all done-ticks and VO states?')){state={done:{},vo:{},hub:{}};save();render();closeHub()}};
document.querySelectorAll('[data-export]').forEach(el=>el.onclick=()=>alert('Export cartridge ['+el.getAttribute('data-export')+'] lands in a coming demon cycle — PDF · DOCX · MD plus map-needs / archive / translation worklists.'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeHub()});

render(); closeHub();
</script>
</body>
</html>
